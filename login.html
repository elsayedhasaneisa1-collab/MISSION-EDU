<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | MISSION EDU</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main class="auth-wrap">
<section class="auth-card">
<div class="logo-mark">M</div>
<h1>تسجيل الدخول</h1>
<p class="muted">ادخل بحسابك للوصول إلى المنصة.</p>
<form id="loginForm">
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn btn-primary full" type="submit">دخول آمن</button>
</form>
<p id="status" class="status"></p>
<a href="index.html" class="back-link">العودة للرئيسية</a>
</section>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
