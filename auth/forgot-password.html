<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — استعادة كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--gold:#00d4ff;--gold-l:#00ffff;--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;--red:#ef4444;--green:#22c55e;--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),var(--bg);color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.7}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(10,18,32,.92),rgba(5,10,20,.88));border:1px solid var(--border2);border-radius:24px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.85);animation:pu .5s}
@keyframes pu{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;justify-content:center}
.brand-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--grad-gold)}
.brand-name{font-weight:900;font-size:22px;background:linear-gradient(100deg,#00ffff,#a0e8ff 45%,#00d4ff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s infinite}
.brand-sub{font-size:11px;color:var(--muted)}
.title{font-size:23px;font-weight:900;text-align:center;margin-bottom:8px;color:var(--gold)}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:8px}
.input{width:100%;padding:13px 16px;border-radius:14px;background:rgba(5,10,20,.85);border:1.5px solid var(--border);outline:none;font-size:15px;color:var(--txt);font-family:inherit;transition:.22s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(0,212,255,.14)}
.input::placeholder{color:var(--muted)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:.24s;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 12px 32px rgba(0,212,255,.5)}
.btn-p:hover{transform:translateY(-2px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-s{background:rgba(0,212,255,.10);color:var(--gold);border:1px solid var(--border2);text-decoration:none;display:inline-flex}
.link{color:var(--gold);text-decoration:none;font-weight:700;font-size:13px;display:inline-block;margin-top:16px}
.alert{padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;animation:shake .4s}
.alert.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#6ee7a0}
.spinner{width:20px;height:20px;border:2.5px solid rgba(5,10,20,.3);border-top-color:#050a14;border-radius:50%;animation:sp .8s linear infinite}
.footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted)}
.footer b{background:linear-gradient(90deg,#00ffff,#a0e8ff,#00d4ff,#00ffff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s infinite;font-weight:900}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#050a14" stroke-width="2.5" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </div>
    <div><div class="brand-name">MISSION EDU</div><div class="brand-sub">استعادة الحساب</div></div>
  </div>

  <div class="title">🔑 استعادة كلمة المرور</div>
  <div class="subtitle">أدخل رقم هاتفك + كلمة مرور جديدة</div>

  <div class="alert err" id="errBox"></div>
  <div class="alert ok" id="okBox"></div>

  <form id="resetForm">
    <div class="field">
      <label class="lbl" for="phone">رقم الهاتف</label>
      <input type="tel" class="input" id="phone" placeholder="01xxxxxxxxx" inputmode="numeric" required maxlength="15"/>
    </div>
    <div class="field">
      <label class="lbl" for="newPass">كلمة المرور الجديدة</label>
      <input type="password" class="input" id="newPass" placeholder="6 أحرف على الأقل" minlength="6" maxlength="128" required/>
    </div>
    <div class="field">
      <label class="lbl" for="newPassConfirm">تأكيد كلمة المرور</label>
      <input type="password" class="input" id="newPassConfirm" placeholder="أعد كتابة كلمة المرور" minlength="6" maxlength="128" required/>
    </div>
    <button type="submit" class="btn btn-p" id="submitBtn"><span id="btnText">🔄 إعادة تعيين كلمة المرور</span></button>
  </form>

  <div style="text-align:center"><a href="/auth/login.html" class="link">← العودة لتسجيل الدخول</a></div>

  <div class="footer">Developed by <b>EL-sayed Hasan</b></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/db.js"></script>
<script>
(function(){
  'use strict';
  
  const SECURITY = {
    clean: s => String(s ?? '').replace(/[<>]/g,'').trim(),
    isPhone: s => /^\d{8,15}$/.test(String(s||'')),
    sleep: ms => new Promise(r => setTimeout(r, ms))
  };
  
  const RATE_LIMIT_KEY = 'reset_attempts';
  const MAX_ATTEMPTS = 3;
  const WINDOW = 60 * 60 * 1000;
  
  function checkRateLimit(){
    try{
      const data = JSON.parse(localStorage.getItem(RATE_LIMIT_KEY) || '{}');
      const now = Date.now();
      if(data.resetAt && data.resetAt > now && data.count >= MAX_ATTEMPTS) return false;
      if(!data.resetAt || data.resetAt < now){
        localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify({count: 1, resetAt: now + WINDOW}));
      } else {
        data.count++;
        localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(data));
      }
      return true;
    }catch(e){ return true; }
  }

  const form = document.getElementById('resetForm');
  const errBox = document.getElementById('errBox');
  const okBox = document.getElementById('okBox');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  
  function showErr(m){ errBox.textContent = SECURITY.clean(m); errBox.classList.add('show'); okBox.classList.remove('show'); setTimeout(()=>errBox.classList.remove('show'),5000); }
  function showOk(m){ okBox.textContent = m; okBox.classList.add('show'); errBox.classList.remove('show'); }
  function setLoading(l){ submitBtn.disabled = l; btnText.textContent = l ? 'جارٍ التحديث...' : '🔄 إعادة تعيين كلمة المرور'; if(l && !document.getElementById('bs')){ const sp = document.createElement('span'); sp.className = 'spinner'; sp.id = 'bs'; submitBtn.prepend(sp); } else if(!l){ const sp = document.getElementById('bs'); if(sp) sp.remove(); } }

  document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 15); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.remove('show'); okBox.classList.remove('show');

    if(!checkRateLimit()) return showErr('تجاوزت الحد المسموح — حاول لاحقًا');

    const phone = document.getElementById('phone').value.replace(/\D/g,'');
    const p1 = document.getElementById('newPass').value;
    const p2 = document.getElementById('newPassConfirm').value;

    if(!SECURITY.isPhone(phone)) return showErr('رقم هاتف غير صحيح');
    if(!p1 || p1.length < 6) return showErr('كلمة المرور 6 أحرف على الأقل');
    if(p1.length > 128) return showErr('كلمة المرور طويلة جدًا');
    if(p1 !== p2) return showErr('كلمتا المرور غير متطابقتين');

    setLoading(true);
    await SECURITY.sleep(500);

    try{
      const user = await MissionDB.getUserByPhone(phone);
      if(!user) throw new Error('رقم الهاتف غير مسجل');
      if(user.banned) throw new Error('الحساب محظور، تواصل مع الإدارة');
      await MissionDB.updateUser(user.id, { password: p1 });
      showOk('✅ تم تحديث كلمة المرور. جارٍ التحويل...');
      setTimeout(() => { window.location.replace('/auth/login.html'); }, 2000);
    } catch(err) {
      setLoading(false);
      showErr(err.message || 'فشل التحديث');
    }
  });
})();
</script>
</body>
</html>
