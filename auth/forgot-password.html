<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0805" />
<title>MISSION EDU — استعادة كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0805;--gold:#D4AF37;--gold-l:#FFD700;--border:rgba(212,175,55,.18);--border2:rgba(212,175,55,.38);--txt:#f7f0dd;--txt2:#d4c79a;--muted:#8a7d55;--red:#ef4444;--green:#22c55e;--grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(212,175,55,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(184,134,11,.14),transparent 60%),var(--bg);color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.7}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(28,22,12,.92),rgba(15,12,7,.88));border:1px solid var(--border2);border-radius:24px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.85);animation:pu .5s}
@keyframes pu{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;justify-content:center}
.brand-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--grad-gold)}
.brand-name{font-weight:900;font-size:22px;background:linear-gradient(100deg,#FFD700,#FFF3B0 45%,#D4AF37 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s infinite}
.brand-sub{font-size:11px;color:var(--muted)}
.title{font-size:23px;font-weight:900;text-align:center;margin-bottom:8px;color:var(--gold)}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:8px}
.input{width:100%;padding:13px 16px;border-radius:14px;background:rgba(15,12,7,.85);border:1.5px solid var(--border);outline:none;font-size:15px;color:var(--txt);font-family:inherit;transition:.22s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:.24s;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.btn-p{background:var(--grad-gold);color:#1a1206;box-shadow:0 12px 32px rgba(212,175,55,.5)}
.btn-p:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:rgba(212,175,55,.10);color:var(--gold);border:1px solid var(--border2);text-decoration:none}
.link{color:var(--gold);text-decoration:none;font-weight:700;font-size:13px;display:inline-block;margin-top:16px}
.alert{padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.alert.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#6ee7a0}
.spinner{width:20px;height:20px;border:2.5px solid rgba(26,18,6,.3);border-top-color:#1a1206;border-radius:50%;animation:sp .8s linear infinite}
.footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted)}
.footer b{background:linear-gradient(90deg,#FFD700,#FFF3B0,#D4AF37,#FFD700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s infinite;font-weight:900}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.5" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </div>
    <div><div class="brand-name">MISSION EDU</div><div class="brand-sub">استعادة الحساب</div></div>
  </div>

  <div class="title">🔑 استعادة كلمة المرور</div>
  <div class="subtitle">أدخل رقم هاتفك المسجل + كلمة مرور جديدة</div>

  <div class="alert err" id="errBox"></div>
  <div class="alert ok" id="okBox"></div>

  <form id="resetForm">
    <div class="field">
      <label class="lbl">رقم الهاتف</label>
      <input type="tel" class="input" id="phone" placeholder="01xxxxxxxxx" inputmode="numeric" required/>
    </div>
    <div class="field">
      <label class="lbl">كلمة المرور الجديدة</label>
      <input type="password" class="input" id="newPass" placeholder="6 أحرف على الأقل" minlength="6" required/>
    </div>
    <div class="field">
      <label class="lbl">تأكيد كلمة المرور</label>
      <input type="password" class="input" id="newPassConfirm" placeholder="أعد كتابة كلمة المرور" minlength="6" required/>
    </div>
    <button type="submit" class="btn btn-p" id="submitBtn"><span id="btnText">🔄 إعادة تعيين كلمة المرور</span></button>
  </form>

  <div style="text-align:center"><a href="/auth/login.html" class="link">← العودة لتسجيل الدخول</a></div>

  <div class="footer">Developed by <b>EL-sayed Hasan</b></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SUPABASE_URL='YOUR_SUPABASE_URL';window.SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';</script>
<script src="/db.js"></script>
<script>
(function(){
  'use strict';
  const form = document.getElementById('resetForm');
  const errBox = document.getElementById('errBox');
  const okBox = document.getElementById('okBox');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  document.getElementById('phone').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 15);
  });

  function showErr(m){ errBox.textContent = m; errBox.classList.add('show'); okBox.classList.remove('show'); setTimeout(()=>errBox.classList.remove('show'),5000); }
  function showOk(m){ okBox.textContent = m; okBox.classList.add('show'); errBox.classList.remove('show'); }
  function setLoading(l){ submitBtn.disabled=l; btnText.textContent=l?'جارٍ التحديث...':'🔄 إعادة تعيين كلمة المرور'; }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.remove('show'); okBox.classList.remove('show');

    const phone = document.getElementById('phone').value.replace(/\D/g,'');
    const p1 = document.getElementById('newPass').value;
    const p2 = document.getElementById('newPassConfirm').value;

    if (!phone || phone.length < 8) return showErr('رقم هاتف غير صحيح');
    if (!p1 || p1.length < 6) return showErr('كلمة المرور قصيرة جدًا');
    if (p1 !== p2) return showErr('كلمتا المرور غير متطابقتين');

    setLoading(true);
    try {
      const user = await MissionDB.getUserByPhone(phone);
      if (!user) throw new Error('رقم الهاتف غير مسجل');
      if (user.banned) throw new Error('الحساب محظور، تواصل مع الإدارة');
      await MissionDB.updateUser(user.id, { password: p1 });
      showOk('✅ تم تحديث كلمة المرور. جارٍ التحويل...');
      setTimeout(() => { window.location.replace('/auth/login.html'); }, 2000);
    } catch (err) {
      setLoading(false);
      showErr(err.message || 'فشل التحديث');
    }
  });
})();
</script>
</body>
</html>
