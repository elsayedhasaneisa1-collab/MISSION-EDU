<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060e" />
<title>إنشاء حساب | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--violet:#8b5cf6;--r:20px;--rs:13px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),radial-gradient(800px 500px at 50% 115%,rgba(6,182,212,.09),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.h1{font-size:clamp(24px,4vw,32px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:20px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.grad{background:linear-gradient(100deg,#5aa9ff,#a78bfa 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.flex{display:flex}.col{flex-direction:column}.center{align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover:not(:disabled){box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.input,select.input{width:100%;padding:13px 16px;border-radius:13px;background:rgba(10,16,32,.72);border:1.5px solid var(--border);outline:none;font-size:14.5px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12)}
select.input{cursor:pointer;appearance:none;padding-inline-start:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237f93b8' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:7px}
.field{margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:40px;font-size:12px;font-weight:700;border:1px solid transparent}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.brand-logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 12px 34px rgba(47,125,255,.45);margin:0 auto}
.wrap-page{width:100%;max-width:480px;animation:fu .5s cubic-bezier(.2,.8,.3,1)}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:11.5px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.strength{height:4px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
.strength-f{height:100%;border-radius:20px;transition:width .4s, background .4s}
.strength-txt{font-size:11px;margin-top:6px;font-weight:700}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:8px}
.check-box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex-shrink:0;margin-top:2px}
.check-box.ok{background:var(--green);color:#fff}
.check-box.no{background:rgba(255,255,255,.08);color:var(--muted)}
.phone-prefix{background:rgba(10,16,32,.72);border:1.5px solid var(--border);border-radius:13px;padding:13px 14px;font-weight:700;font-size:14px;color:var(--txt2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.eye{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;color:var(--txt);background:none;border:none;padding:6px}
.footer-dev{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px 16px;margin-top:36px;width:100%;max-width:480px;position:relative}
.footer-dev::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:1px;background:linear-gradient(90deg,transparent,#2f7dff,transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s cubic-bezier(.2,.8,.3,1);border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));border-color:rgba(90,140,230,.3);color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.gov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:220px;overflow-y:auto;padding:10px;border-radius:13px;background:rgba(10,16,32,.5);border:1.5px solid var(--border);margin-top:8px}
.gov-grid::-webkit-scrollbar{width:6px}
.gov-grid::-webkit-scrollbar-thumb{background:rgba(90,140,230,.3);border-radius:10px}
.gov-item{padding:10px 8px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer;text-align:center;transition:.2s;font-family:inherit}
.gov-item:hover{background:rgba(47,125,255,.12);border-color:var(--border2);color:var(--txt)}
.gov-item.on{background:linear-gradient(135deg,rgba(47,125,255,.25),rgba(139,92,246,.2));border-color:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(47,125,255,.3)}
.gov-selected{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:rgba(47,125,255,.12);border:1px solid var(--border2);margin-top:10px;font-size:13px;font-weight:700;color:#7db6ff}
@media(max-width:520px){.brand-logo{width:56px;height:56px;font-size:26px}.gov-grid{grid-template-columns:repeat(2,1fr);max-height:200px}}
</style>
</head>
<body>

<div class="wrap-page">
  <div class="flex col center mb20" style="gap:14px;text-align:center">
    <div class="brand-logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
    </div>
    <div>
      <div class="h1 grad">MISSION EDU</div>
      <div class="sm muted mt6">انضم إلينا وابدأ رحلتك</div>
    </div>
  </div>

  <div class="glass" style="padding:26px">
    <div class="h2 mb6">إنشاء حساب جديد</div>
    <div class="sm muted mb20">املأ البيانات التالية للبدء</div>

    <div id="loadErr" class="pill pill-r mb16" style="width:100%;justify-content:center;padding:10px 14px;display:none">⚠️</div>

    <form id="regForm" onsubmit="handleRegister(event)">
      <div class="field">
        <label class="lbl">الاسم الكامل</label>
        <input id="name" class="input" placeholder="أدخل اسمك الكامل" autocomplete="name" required>
      </div>

      <div class="field">
        <label class="lbl">رقم الهاتف</label>
        <div style="display:flex;gap:8px">
          <div class="phone-prefix">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span>+20</span>
          </div>
          <input id="phone" class="input" type="tel" inputMode="numeric" placeholder="1xxxxxxxxx" dir="ltr" autocomplete="tel" style="flex:1;text-align:left" required>
        </div>
        <div class="xs muted mt6">مثال: 1012345678</div>
      </div>

      <div class="field" id="gradeField" style="display:none">
        <label class="lbl">الصف الدراسي</label>
        <select id="gradeId" class="input"></select>
      </div>

      <div class="field">
        <label class="lbl">📍 المحافظة</label>
        <div class="gov-grid" id="govGrid">
          <!-- JavaScript سيضيف المحافظات -->
        </div>
        <div class="gov-selected" id="govSelected" style="display:none">
          <span style="font-size:16px">📍</span>
          <span>المحافظة: <span id="govName"></span></span>
        </div>
        <input type="hidden" id="governorate" value="">
      </div>

      <div class="field">
        <label class="lbl">كلمة المرور</label>
        <div style="position:relative">
          <input id="password" class="input" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" style="padding-inline-start:44px" required>
          <button type="button" class="eye" onclick="togglePass('password',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div id="strength" style="display:none">
          <div class="strength"><div class="strength-f" id="strengthFill"></div></div>
          <div class="strength-txt" id="strengthTxt"></div>
        </div>
      </div>

      <div class="field">
        <label class="lbl">تأكيد كلمة المرور</label>
        <div style="position:relative">
          <input id="confirm" class="input" type="password" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" style="padding-inline-start:44px" required>
          <button type="button" class="eye" onclick="togglePass('confirm',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="mb16">
        <div class="check-row">
          <div class="check-box" id="cbName"></div>
          <span class="sm">الاسم 3 أحرف على الأقل</span>
        </div>
        <div class="check-row">
          <div class="check-box" id="cbPhone"></div>
          <span class="sm">رقم هاتف صالح (8 أرقام على الأقل)</span>
        </div>
        <div class="check-row">
          <div class="check-box" id="cbGov"></div>
          <span class="sm">اختر محافظتك</span>
        </div>
        <div class="check-row">
          <div class="check-box" id="cbPass"></div>
          <span class="sm">كلمة المرور 6 أحرف على الأقل</span>
        </div>
        <div class="check-row">
          <div class="check-box" id="cbMatch"></div>
          <span class="sm">كلمتا المرور متطابقتان</span>
        </div>
      </div>

      <div id="errBox" class="pill pill-r mb16" style="width:100%;justify-content:center;padding:10px 14px;display:none">⚠️</div>

      <button type="submit" id="submitBtn" class="btn btn-p btn-block btn-lg">
        <span id="submitText">إنشاء الحساب</span>
      </button>
    </form>

    <div class="divider">لديك حساب بالفعل؟</div>

    <a href="login.html" class="btn btn-s btn-block">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
      تسجيل الدخول
    </a>
  </div>

  <div class="footer-dev">
    <button class="dev-btn" onclick="openWhatsApp()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span class="dev-name">Developed by <b>EL-sayed Hasan</b></span>
    </button>
    <button class="dev-btn" onclick="openWhatsApp()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span>بلاغ</span>
    </button>
  </div>
</div>

<script src="/db.js"></script>
<script>
(function(){
  "use strict";

  const DB = window.MissionDB;

  // ═══════════════ قائمة المحافظات المصرية ═══════════════
  const GOVERNORATES = [
    "القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "الشرقية", "المنوفية",
    "القليوبية", "البحيرة", "الغربية", "بورسعيد", "دمياط", "الإسماعيلية",
    "السويس", "كفر الشيخ", "الفيوم", "بني سويف", "المنيا", "أسيوط",
    "سوهاج", "قنا", "الأقصر", "أسوان", "البحر الأحمر", "الوادي الجديد",
    "مطروح", "شمال سيناء", "جنوب سيناء"
  ];

  const Icons = {
    eye: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
  };

  // ═══════════════ حماية ═══════════════
  (function(){
    document.addEventListener("keydown", (e)=>{
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && ["I","J","C","K"].includes(e.key.toUpperCase()))) {
        e.preventDefault();
      }
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  })();

  // ═══════════════ Element References ═══════════════
  const els = {
    name: document.getElementById("name"),
    phone: document.getElementById("phone"),
    gradeId: document.getElementById("gradeId"),
    gradeField: document.getElementById("gradeField"),
    govGrid: document.getElementById("govGrid"),
    govSelected: document.getElementById("govSelected"),
    govName: document.getElementById("govName"),
    governorate: document.getElementById("governorate"),
    password: document.getElementById("password"),
    confirm: document.getElementById("confirm"),
    loadErr: document.getElementById("loadErr"),
    errBox: document.getElementById("errBox"),
    submitBtn: document.getElementById("submitBtn"),
    submitText: document.getElementById("submitText"),
  };

  function togglePass(id, btn){
    const el = document.getElementById(id);
    el.type = el.type === "password" ? "text" : "password";
    btn.style.opacity = el.type === "text" ? "1" : ".6";
  }
  window.togglePass = togglePass;

  function openWhatsApp(){
    window.open("https://wa.me/201550802408?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
  }
  window.openWhatsApp = openWhatsApp;

  function calcStrength(pw){
    let s = 0;
    if (pw.length >= 6) s++;
    if (pw.length >= 10) s++;
    if (/[A-Z]/.test(pw) || /[\u0600-\u06FF]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9\u0600-\u06FF]/.test(pw)) s++;
    return Math.min(s, 4);
  }
  function strengthInfo(s){
    if (s <= 1) return { label:"ضعيفة", color:"#ef4444", width:"25%" };
    if (s === 2) return { label:"مقبولة", color:"#f59e0b", width:"50%" };
    if (s === 3) return { label:"جيدة", color:"#22c55e", width:"75%" };
    return { label:"قوية", color:"#22c55e", width:"100%" };
  }
  function setCheck(id, ok){
    const el = document.getElementById(id);
    el.className = "check-box " + (ok ? "ok" : "no");
    el.textContent = ok ? "✓" : "";
  }
  function showErr(msg){
    els.errBox.style.display = "flex";
    els.errBox.textContent = "⚠️ " + msg;
  }

  // ═══════════════ Render Governorates ═══════════════
  function renderGovernorates(){
    els.govGrid.innerHTML = GOVERNORATES.map(gov => `
      <button type="button" class="gov-item" data-gov="${gov}">${gov}</button>
    `).join("");

    els.govGrid.querySelectorAll(".gov-item").forEach(btn => {
      btn.addEventListener("click", ()=>{
        const gov = btn.dataset.gov;
        els.governorate.value = gov;

        // إزالة التنشيط من الكل
        els.govGrid.querySelectorAll(".gov-item").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");

        // عرض الاختيار
        els.govName.textContent = gov;
        els.govSelected.style.display = "flex";

        // تحديث check
        setCheck("cbGov", true);
        updateUI();
      });
    });
  }

  // ═══════════════ Update UI Checks ═══════════════
  function updateUI(){
    const name = els.name.value.trim();
    const phone = els.phone.value.replace(/\D/g, "");
    const pass = els.password.value;
    const conf = els.confirm.value;
    const gov = els.governorate.value;

    const nameOk = name.length >= 3;
    const phoneOk = phone.length >= 8;
    const passOk = pass.length >= 6;
    const matchOk = pass && pass === conf;
    const govOk = !!gov;

    setCheck("cbName", nameOk);
    setCheck("cbPhone", phoneOk);
    setCheck("cbGov", govOk);
    setCheck("cbPass", passOk);
    setCheck("cbMatch", matchOk);

    if (pass){
      document.getElementById("strength").style.display = "block";
      const info = strengthInfo(calcStrength(pass));
      const fill = document.getElementById("strengthFill");
      const txt = document.getElementById("strengthTxt");
      fill.style.width = info.width;
      fill.style.background = info.color;
      txt.style.color = info.color;
      txt.textContent = "قوة كلمة المرور: " + info.label;
    } else {
      document.getElementById("strength").style.display = "none";
    }
  }

  // ربط الأحداث
  [els.name, els.phone, els.password, els.confirm].forEach(el => {
    el.addEventListener("input", ()=>{
      if (el === els.phone){
        el.value = el.value.replace(/\D/g, "").slice(0, 11);
      }
      updateUI();
    });
  });

  // ═══════════════ Load Grades ═══════════════
  async function loadGrades(){
    try{
      const sb = await DB.getClient();
      const { data, error } = await sb.from("grades").select("*");
      if (error) throw new Error(error.message);
      if (!data || data.length === 0){
        els.loadErr.style.display = "flex";
        els.loadErr.textContent = "⚠️ لا توجد صفوف دراسية. تواصل مع الإدارة.";
        els.submitBtn.disabled = true;
        return;
      }
      const sorted = [...data].sort((a,b) => a.id.localeCompare(b.id));
      els.gradeId.innerHTML = sorted.map(g => `<option value="${g.id}">${g.name}</option>`).join("");
      els.gradeField.style.display = "block";
    }catch(e){
      els.loadErr.style.display = "flex";
      els.loadErr.textContent = "⚠️ " + e.message;
      els.submitBtn.disabled = true;
    }
  }

  // ═══════════════ Register ═══════════════
  async function handleRegister(e){
    e.preventDefault();
    els.errBox.style.display = "none";

    const name = els.name.value.trim();
    const phone = els.phone.value.replace(/\D/g, "");
    const pass = els.password.value;
    const conf = els.confirm.value;
    const gradeId = els.gradeId.value;
    const governorate = els.governorate.value;

    if (name.length < 3) return showErr("الاسم يجب أن يكون 3 أحرف على الأقل");
    if (phone.length < 8) return showErr("رقم الهاتف غير صالح");
    if (!governorate) return showErr("اختر محافظتك");
    if (pass.length < 6) return showErr("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
    if (pass !== conf) return showErr("كلمتا المرور غير متطابقتين");
    if (!gradeId) return showErr("اختر الصف الدراسي");

    els.submitBtn.disabled = true;
    els.submitText.innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle"></span>';

    try{
      // استخدام DB.register
      const u = await DB.register({
        name, phone, password: pass, gradeId, countryCode: "+20", governorate
      });

      // تحديث إضافي بحقل governorate
      try{
        const sb = await DB.getClient();
        await sb.from("users").update({ governorate }).eq("id", u.id);
      }catch(e){}

      els.submitText.textContent = "تم الإنشاء ✓";
      setTimeout(() => DB.redirectByRole(u), 600);
    }catch(ex){
      showErr(ex.message);
      els.submitBtn.disabled = false;
      els.submitText.textContent = "إنشاء الحساب";
    }
  }
  window.handleRegister = handleRegister;

  // ═══════════════ Init ═══════════════
  (async () => {
    const sid = DB.getSessionId();
    if (sid) {
      const u = await DB.getUser(sid);
      if (u && u.active !== false) return DB.redirectByRole(u);
      DB.clearSession();
    }
    renderGovernorates();
    await loadGrades();
    updateUI();
    setTimeout(() => els.name.focus(), 200);
  })();

})();
</script>
</body>
</html>
