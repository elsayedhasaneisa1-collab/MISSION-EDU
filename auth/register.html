<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — حساب جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{--bg:#050a14;--bg2:#0a1220;--gold:#00d4ff;--gold-l:#00ffff;--gold-d:#0088cc;--gold-soft:#a0e8ff;--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;--red:#ef4444;--green:#22c55e;--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(0,255,255,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.7}
.auth-card{width:100%;max-width:500px;background:linear-gradient(180deg,rgba(10,18,32,.92),rgba(5,10,20,.88));border:1px solid var(--border2);border-radius:24px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.85);backdrop-filter:blur(20px);animation:pu .5s;position:relative}
@keyframes pu{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;justify-content:center}
.brand-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 12px 32px rgba(0,212,255,.6)}
.brand-name{font-weight:900;font-size:22px;background:linear-gradient(100deg,#00ffff,#a0e8ff 45%,#00d4ff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s infinite}
.brand-sub{font-size:11px;color:var(--muted);font-weight:600}
.title{font-size:24px;font-weight:900;text-align:center;margin-bottom:8px;background:linear-gradient(100deg,#00ffff,#a0e8ff 50%,#00d4ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.input,select.input{width:100%;padding:12px 14px;border-radius:14px;background:rgba(5,10,20,.85);border:1.5px solid var(--border);outline:none;font-size:14px;color:var(--txt);transition:.22s;font-family:inherit}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(0,212,255,.14)}
.input::placeholder{color:var(--muted)}
select.input{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2300d4ff' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center;padding-left:38px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:.24s;font-family:inherit;border:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;margin-top:8px}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 12px 32px rgba(0,212,255,.5)}
.btn-p:hover{box-shadow:0 16px 40px rgba(0,212,255,.7);transform:translateY(-2px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 8px 24px rgba(37,211,102,.4);text-decoration:none;display:flex;margin-top:16px}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,211,102,.6)}
.btn-wa svg{width:20px;height:20px;flex-shrink:0}
.link{color:var(--gold);text-decoration:none;font-weight:700;font-size:13px}
.link:hover{color:var(--gold-l)}
.error-msg{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;display:none}
.error-msg.show{display:block;animation:shake .4s}
.strength-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.strength-fill{height:100%;transition:.3s;width:0%}
.spinner{width:20px;height:20px;border:2.5px solid rgba(5,10,20,.3);border-top-color:#050a14;border-radius:50%;animation:sp .8s linear infinite}
.footer-dev{margin-top:26px;text-align:center;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.footer-dev b{background:linear-gradient(90deg,#00ffff,#a0e8ff,#00d4ff,#00ffff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s infinite;font-weight:900}
.swal-custom-popup{border:1px solid rgba(0,212,255,.4)!important;border-radius:22px!important;font-family:'Tajawal','Cairo',sans-serif!important}
@media(max-width:480px){.auth-card{padding:28px 22px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#050a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">MISSION EDU</div>
      <div class="brand-sub">منصة تعليمية متكاملة</div>
    </div>
  </div>

  <div class="title">إنشاء حساب جديد</div>
  <div class="subtitle">ابدأ رحلتك التعليمية الآن 🚀</div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="registerForm" novalidate autocomplete="on">
    <div class="field">
      <label class="lbl" for="name">الاسم الكامل *</label>
      <input type="text" class="input" id="name" placeholder="اسمك الثلاثي" autocomplete="name" required maxlength="60" minlength="3"/>
    </div>

    <div class="row">
      <div class="field">
        <label class="lbl" for="countryCode">كود الدولة</label>
        <select class="input" id="countryCode">
          <option value="+20">🇪🇬 +20</option>
          <option value="+966">🇸🇦 +966</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+965">🇰🇼 +965</option>
          <option value="+974">🇶🇦 +974</option>
          <option value="+973">🇧🇭 +973</option>
          <option value="+968">🇴🇲 +968</option>
          <option value="+962">🇯🇴 +962</option>
          <option value="+961">🇱🇧 +961</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="phone">رقم الهاتف *</label>
        <input type="tel" class="input" id="phone" placeholder="1xxxxxxxxx" inputmode="numeric" autocomplete="tel" required maxlength="15"/>
      </div>
    </div>

    <div class="field">
      <label class="lbl" for="password">كلمة المرور *</label>
      <input type="password" class="input" id="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" minlength="6" maxlength="128" required/>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>

    <div class="field">
      <label class="lbl" for="passwordConfirm">تأكيد كلمة المرور *</label>
      <input type="password" class="input" id="passwordConfirm" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" minlength="6" maxlength="128" required/>
    </div>

    <div class="row">
      <div class="field">
        <label class="lbl" for="gender">النوع *</label>
        <select class="input" id="gender" required>
          <option value="">اختر</option>
          <option value="male">👦 ذكر</option>
          <option value="female">👧 أنثى</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="gradeId">الصف الدراسي</label>
        <select class="input" id="gradeId">
          <option value="">اختر</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="lbl" for="governorate">المحافظة</label>
      <select class="input" id="governorate">
        <option value="">— بدون —</option>
        <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option>
        <option>الدقهلية</option><option>الشرقية</option><option>المنوفية</option>
        <option>القليوبية</option><option>البحيرة</option><option>الغربية</option>
        <option>بورسعيد</option><option>دمياط</option><option>الإسماعيلية</option>
        <option>السويس</option><option>كفر الشيخ</option><option>الفيوم</option>
        <option>بني سويف</option><option>المنيا</option><option>أسيوط</option>
        <option>سوهاج</option><option>قنا</option><option>الأقصر</option>
        <option>أسوان</option><option>البحر الأحمر</option><option>الوادي الجديد</option>
        <option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option>
      </select>
    </div>

    <div class="field">
      <label class="lbl" for="schoolName">اسم المدرسة</label>
      <input type="text" class="input" id="schoolName" placeholder="اسم مدرستك" maxlength="100"/>
    </div>

    <button type="submit" class="btn btn-p" id="submitBtn">
      <span id="btnText">إنشاء الحساب</span>
    </button>
  </form>

  <a href="https://wa.me/201128351702?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%A3%D8%AD%D8%AA%D8%A7%D8%AC%20%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%D8%A9%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D8%B3%D8%AC%D9%8A%D9%84" target="_blank" rel="noopener noreferrer" class="btn btn-wa">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    تواصل مع الإدارة
  </a>

  <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--muted)">
    لديك حساب؟ <a href="/auth/login.html" class="link">سجّل دخول</a>
  </div>

  <div class="footer-dev">Developed by <b>EL-sayed Hasan</b></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/db.js"></script>
<script>
(function(){
  'use strict';
  const SECURITY = {
    clean: s => String(s ?? '').replace(/[<>]/g,'').replace(/\s+/g,' ').trim(),
    isPhone: s => /^\d{8,15}$/.test(String(s||'')),
    isName: s => /^[\u0600-\u06FFa-zA-Z\s]{3,60}$/.test(String(s||'')),
    sleep: ms => new Promise(r => setTimeout(r, ms))
  };
  const RATE_LIMIT_KEY = 'register_attempts';
  const MAX_ATTEMPTS = 3;
  const WINDOW = 60 * 60 * 1000;
  function checkRateLimit(){
    try{
      const data = JSON.parse(localStorage.getItem(RATE_LIMIT_KEY) || '{}');
      const now = Date.now();
      if(data.resetAt && data.resetAt > now && data.count >= MAX_ATTEMPTS) return false;
      if(!data.resetAt || data.resetAt < now){ localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify({count: 1, resetAt: now + WINDOW})); }
      else { data.count++; localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(data)); }
      return true;
    }catch(e){ return true; }
  }
  const form = document.getElementById('registerForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const strengthFill = document.getElementById('strengthFill');
  function showError(msg){ errorMsg.textContent = SECURITY.clean(msg); errorMsg.classList.add('show'); setTimeout(()=>errorMsg.classList.remove('show'), 6000); window.scrollTo({top: 0, behavior: 'smooth'}); }
  function setLoading(l){ submitBtn.disabled = l; btnText.textContent = l ? 'جارٍ إنشاء الحساب...' : 'إنشاء الحساب'; if(l && !document.getElementById('bs')){ const sp = document.createElement('span'); sp.className = 'spinner'; sp.id = 'bs'; submitBtn.prepend(sp); } else if(!l){ const sp = document.getElementById('bs'); if(sp) sp.remove(); } }
  MissionDB.getClient().then(async sb => {
    try{
      const { data } = await sb.from('grades').select('id,name').order('sort_order');
      if(data){ const sel = document.getElementById('gradeId'); data.forEach(g => { const o = document.createElement('option'); o.value = SECURITY.clean(g.id); o.textContent = SECURITY.clean(g.name); sel.appendChild(o); }); }
    }catch(e){}
  });
  document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 15); });
  document.getElementById('password').addEventListener('input', e => {
    const p = e.target.value;
    let score = 0;
    if(p.length >= 6) score++;
    if(p.length >= 10) score++;
    if(/[a-z]/.test(p)) score++;
    if(/[A-Z]/.test(p)) score++;
    if(/\d/.test(p)) score++;
    if(/[^a-zA-Z0-9]/.test(p)) score++;
    const pct = (score / 6) * 100;
    const colors = ['#ef4444','#f59e0b','#f59e0b','#22c55e','#22c55e','#00ffff'];
    strengthFill.style.width = pct + '%';
    strengthFill.style.background = colors[Math.min(score, 5)];
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    if(!checkRateLimit()) return showError('عدد محاولات التسجيل تجاوز الحد — حاول لاحقًا');
    const name = SECURITY.clean(document.getElementById('name').value);
    const countryCode = document.getElementById('countryCode').value;
    const phone = document.getElementById('phone').value.replace(/\D/g, '');
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    const gender = document.getElementById('gender').value;
    const gradeId = document.getElementById('gradeId').value || null;
    const governorate = document.getElementById('governorate').value || null;
    const schoolName = SECURITY.clean(document.getElementById('schoolName').value);
    if(!SECURITY.isName(name)) return showError('الاسم يجب أن يكون 3-60 حرفًا (عربي أو إنجليزي)');
    if(!SECURITY.isPhone(phone)) return showError('رقم الهاتف غير صحيح');
    if(!password || password.length < 6) return showError('كلمة المرور 6 أحرف على الأقل');
    if(password.length > 128) return showError('كلمة المرور طويلة جدًا');
    if(password !== passwordConfirm) return showError('كلمتا المرور غير متطابقتين');
    if(!gender) return showError('اختر النوع');
    if(schoolName.length > 100) return showError('اسم المدرسة طويل جدًا');
    setLoading(true);
    await SECURITY.sleep(500);
    try{
      const user = await MissionDB.createUser({name, phone, country_code: countryCode, password, gender, grade_id: gradeId, governorate, school_name: schoolName || null});
      MissionDB.setSession(user.id);
      try{ const sb = await MissionDB.getClient(); await sb.from('activity').insert([{id: MissionDB.uid('act_'), user_id: user.id, user_name: user.name, type: 'register', target: null, at: Date.now()}]); }catch(e){}
      window.location.replace('/student/index.html');
    } catch(err) {
      setLoading(false);
      showError(err.message || 'فشل إنشاء الحساب');
    }
  });
})();
</script>
</body>
</html>
