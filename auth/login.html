<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0805" />
<title>MISSION EDU — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root{--bg:#0a0805;--gold:#D4AF37;--gold-l:#FFD700;--gold-d:#8B6914;--border:rgba(212,175,55,.18);--border2:rgba(212,175,55,.38);--txt:#f7f0dd;--txt2:#d4c79a;--muted:#8a7d55;--green:#22c55e;--red:#ef4444;--grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(212,175,55,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(184,134,11,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.7}
.auth-card{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(28,22,12,.92),rgba(15,12,7,.88));border:1px solid var(--border2);border-radius:24px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.85),0 0 60px rgba(212,175,55,.15);backdrop-filter:blur(20px);position:relative;overflow:hidden;animation:pu .5s}
@keyframes pu{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.auth-card::before{content:'';position:absolute;top:-100px;inset-inline-end:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,215,0,.15),transparent 65%);pointer-events:none;border-radius:50%}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;justify-content:center}
.brand-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 12px 32px rgba(212,175,55,.6)}
.brand-name{font-weight:900;font-size:22px;background:linear-gradient(100deg,#FFD700,#FFF3B0 45%,#D4AF37 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s linear infinite}
.brand-sub{font-size:11px;color:var(--muted);font-weight:600}
.title{font-size:26px;font-weight:900;text-align:center;margin-bottom:8px;background:linear-gradient(100deg,#FFD700,#FFF3B0 50%,#D4AF37 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:8px}
.input{width:100%;padding:13px 16px;border-radius:14px;background:rgba(15,12,7,.85);border:1.5px solid var(--border);outline:none;font-size:15px;color:var(--txt);transition:.22s;font-family:inherit}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.input::placeholder{color:var(--muted)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:.24s;font-family:inherit;border:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.btn-p{background:var(--grad-gold);color:#1a1206;box-shadow:0 12px 32px rgba(212,175,55,.5);position:relative;overflow:hidden}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:0 16px 40px rgba(212,175,55,.7);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:rgba(212,175,55,.10);color:var(--gold);border:1px solid var(--border2)}
.btn-s:hover{background:rgba(212,175,55,.20)}
.link{color:var(--gold);text-decoration:none;font-weight:700;font-size:13px;transition:.2s}
.link:hover{color:var(--gold-l)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.spinner{width:20px;height:20px;border:2.5px solid rgba(26,18,6,.3);border-top-color:#1a1206;border-radius:50%;animation:sp .8s linear infinite}
.error-msg{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;display:none}
.error-msg.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.footer-dev{margin-top:26px;text-align:center;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.footer-dev b{background:linear-gradient(90deg,#FFD700,#FFF3B0,#D4AF37,#FFD700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900}
.swal-custom-popup{border:1px solid rgba(212,175,55,.4)!important;border-radius:22px!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-title{color:#f7f0dd!important;font-family:'Tajawal','Cairo',sans-serif!important}
@media(max-width:480px){.auth-card{padding:28px 22px}.title{font-size:22px}.brand-name{font-size:19px}}
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">MISSION EDU</div>
      <div class="brand-sub">منصة تعليمية متكاملة</div>
    </div>
  </div>

  <div class="title">تسجيل الدخول</div>
  <div class="subtitle">أهلاً بك مرة أخرى 👋</div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label class="lbl">رقم الهاتف</label>
      <input type="tel" class="input" id="phone" placeholder="01xxxxxxxxx" autocomplete="tel" inputmode="numeric" required />
    </div>
    <div class="field">
      <label class="lbl">كلمة المرور</label>
      <input type="password" class="input" id="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-p" id="submitBtn">
      <span id="btnText">دخول</span>
    </button>
  </form>

  <div class="divider">أو</div>

  <div style="text-align:center;font-size:13px;color:var(--muted)">
    ليس لديك حساب؟ <a href="/auth/register.html" class="link">سجّل الآن</a>
    <br><br>
    <a href="/auth/forgot-password.html" class="link" style="font-size:12px">نسيت كلمة المرور؟</a>
  </div>

  <div class="footer-dev">
    Developed by <b>EL-sayed Hasan</b>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SUPABASE_URL='YOUR_SUPABASE_URL';window.SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';</script>
<script src="/db.js"></script>
<script>
(function(){
  'use strict';

  const form = document.getElementById('loginForm');
  const phoneInput = document.getElementById('phone');
  const passInput = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const errorMsg = document.getElementById('errorMsg');

  const existing = MissionDB.getSessionId();
  if (existing) {
    MissionDB.getUser(existing).then(u => {
      if (u && u.active !== false && !u.banned) {
        window.location.replace(u.role === 'admin' ? '/index.html' : '/student/index.html');
      }
    }).catch(() => {});
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), 5000);
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    btnText.textContent = loading ? 'جارٍ الدخول...' : 'دخول';
    if (loading) {
      if (!document.getElementById('btnSpinner')) {
        const sp = document.createElement('span');
        sp.className = 'spinner';
        sp.id = 'btnSpinner';
        submitBtn.prepend(sp);
      }
    } else {
      const sp = document.getElementById('btnSpinner');
      if (sp) sp.remove();
    }
  }

  phoneInput.addEventListener('input', () => {
    phoneInput.value = phoneInput.value.replace(/[^\d+]/g, '');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    const phone = phoneInput.value.replace(/\D/g, '');
    const pass = passInput.value;

    if (!phone || phone.length < 8) return showError('رقم الهاتف غير صحيح');
    if (!pass || pass.length < 1) return showError('كلمة المرور مطلوبة');

    setLoading(true);
    try {
      const user = await MissionDB.loginUser(phone, pass);
      MissionDB.setSession(user.id);
      if (user.role === 'admin') {
        window.location.replace('/index.html');
      } else {
        window.location.replace('/student/index.html');
      }
    } catch (err) {
      setLoading(false);
      showError(err.message || 'فشل تسجيل الدخول');
      if (String(err.message).includes('محظور')) {
        setTimeout(() => { window.location.replace('/auth/banned.html'); }, 1500);
      }
    }
  });
})();
</script>
</body>
</html>
