<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060e" />
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<title>تسجيل الدخول | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--red:#ef4444;--green:#22c55e;--r:20px;--rs:13px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),radial-gradient(800px 500px at 50% 115%,rgba(6,182,212,.09),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.h1{font-size:clamp(24px,4vw,32px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:20px;font-weight:800}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.grad{background:linear-gradient(100deg,#5aa9ff,#a78bfa 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.flex{display:flex}.col{flex-direction:column}.center{align-items:center}
.g6{gap:6px}.g8{gap:8px}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover:not(:disabled){box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.input{width:100%;padding:13px 16px;border-radius:13px;background:rgba(10,16,32,.72);border:1.5px solid var(--border);outline:none;font-size:14.5px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:7px}
.field{margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:40px;font-size:12px;font-weight:700;border:1px solid transparent}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.brand-logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 12px 34px rgba(47,125,255,.45);margin:0 auto}
.login-wrap{width:100%;max-width:460px;animation:fu .5s cubic-bezier(.2,.8,.3,1)}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:11.5px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.phone-prefix{background:rgba(10,16,32,.72);border:1.5px solid var(--border);border-radius:13px;padding:13px 14px;font-weight:700;font-size:14px;color:var(--txt2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.eye{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;color:var(--txt);background:none;border:none;padding:6px}
.footer-dev{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px 16px;margin-top:36px;width:100%;max-width:460px;position:relative}
.footer-dev::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:1px;background:linear-gradient(90deg,transparent,#2f7dff,transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s cubic-bezier(.2,.8,.3,1);border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));border-color:rgba(90,140,230,.3);color:var(--txt);position:relative;overflow:hidden}
.dev-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);transition:transform .7s}
.dev-btn:hover::before{transform:translateX(100%)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900;letter-spacing:.3px}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.tg-btn{background:rgba(34,158,217,.12);border-color:rgba(34,158,217,.3);color:#7dd3fc}
.tg-btn:hover{background:rgba(34,158,217,.22);border-color:#229ed9;color:#fff;transform:translateY(-2px);box-shadow:0 10px 26px rgba(34,158,217,.3)}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;box-shadow:0 24px 70px rgba(0,0,0,.75) !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-size:20px !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-confirm{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
.swal-custom-cancel{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="flex col center mb20" style="gap:14px;text-align:center">
    <div class="brand-logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div>
      <div class="h1 grad">MISSION EDU</div>
      <div class="sm muted mt6">سجّل دخولك لمتابعة رحلتك</div>
    </div>
  </div>

  <div class="glass" style="padding:26px">
    <div class="h2 mb6">تسجيل الدخول</div>
    <div class="sm muted mb20">أدخل رقم هاتفك وكلمة المرور</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label class="lbl">رقم الهاتف</label>
        <div style="display:flex;gap:8px">
          <div class="phone-prefix">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span>+20</span>
          </div>
          <input id="phone" class="input" type="tel" inputMode="numeric" placeholder="1xxxxxxxxx" dir="ltr" autocomplete="tel" style="flex:1;text-align:left" required>
        </div>
        <div class="xs muted mt6">مثال: 1012345678</div>
      </div>

      <div class="field">
        <label class="lbl">كلمة المرور</label>
        <div style="position:relative">
          <input id="password" class="input" type="password" placeholder="••••••" autocomplete="current-password" style="padding-inline-start:44px" required>
          <button type="button" class="eye" onclick="togglePass('password',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="errBox" class="pill pill-r mb16" style="width:100%;justify-content:center;padding:10px 14px;display:none">⚠️</div>

      <button type="submit" id="submitBtn" class="btn btn-p btn-block btn-lg">
        <span id="submitText">دخول</span>
      </button>
    </form>

    <div class="divider">ليس لديك حساب؟</div>

    <a href="/auth/register.html" class="btn btn-s btn-block">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      إنشاء حساب جديد
    </a>
  </div>

  <div class="footer-dev">
    <button class="dev-btn" onclick="openWhatsApp()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span class="dev-name">Developed by <b>EL-sayed Hasan</b></span>
    </button>
    <button class="tg-btn" onclick="window.open('https://t.me/@sayoda_elgadar','_blank')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
      <span>تواصل</span>
    </button>
  </div>
</div>

<script src="/db.js"></script>
<script>
(function(){
  const blocked = (e) => {
    if (e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I","J","C","K"].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toUpperCase() === "U")) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  };
  document.addEventListener("keydown", blocked, true);
  document.addEventListener("contextmenu", (e) => e.preventDefault());
})();

function togglePass(id, btn){
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
  btn.style.opacity = el.type === "text" ? "1" : ".6";
}
function openWhatsApp(){
  window.open("https://wa.me/201128351702?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
}

function showErr(msg){
  const b = document.getElementById("errBox");
  b.style.display = "flex";
  b.textContent = "⚠️ " + msg;
}

async function handleLogin(e){
  e.preventDefault();
  document.getElementById("errBox").style.display = "none";

  const phone = document.getElementById("phone").value.replace(/\D/g, "");
  const password = document.getElementById("password").value;

  if (!phone || !password) return showErr("يرجى تعبئة جميع الحقول");
  if (phone.length < 8) return showErr("رقم الهاتف غير صالح");

  const btn = document.getElementById("submitBtn");
  const txt = document.getElementById("submitText");
  btn.disabled = true;
  txt.innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle"></span>';

  try {
    const DB = window.MissionDB;
    const u = await DB.login(phone, password, "+20");
    txt.textContent = "تم الدخول ✓";
    setTimeout(() => DB.redirectByRole(u), 500);
  } catch (ex) {
    showErr(ex.message);
    btn.disabled = false;
    txt.textContent = "دخول";
  }
}

(async () => {
  const DB = window.MissionDB;
  const sid = DB.getSessionId();
  if (sid) {
    const u = await DB.getUser(sid);
    if (u && u.active !== false) return DB.redirectByRole(u);
    DB.clearSession();
  }
  setTimeout(() => document.getElementById("phone").focus(), 200);
})();
</script>
</body>
</html>
