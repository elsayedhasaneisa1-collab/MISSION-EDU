<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060e" />
<title>الملف الشخصي | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 100px}
.h1{font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.wrap-fl{flex-wrap:wrap}.col{flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-ok:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(34,197,94,.5)}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-v{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.28)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.div{height:1px;background:var(--border);margin:14px 0}
.input{width:100%;padding:12px 14px;border-radius:12px;background:rgba(10,16,32,.72);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt);font-family:inherit}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.field{margin-bottom:14px}
.avatar-lg{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;font-size:32px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0;box-shadow:0 12px 36px rgba(47,125,255,.4)}
.stat-box{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.stat-box .lbl-x{font-size:12px;color:var(--muted);font-weight:600}
.stat-box .val-x{font-size:20px;font-weight:900;letter-spacing:-.5px;margin-top:4px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade-in{animation:fu .5s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(6,9,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;font-weight:700;transition:.2s;text-decoration:none}
.back-btn:hover{background:rgba(47,125,255,.15);color:var(--txt);border-color:var(--border2)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);flex-wrap:wrap}
.dev-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .3s;border:1px solid rgba(90,140,230,.3);background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;background:linear-gradient(180deg, #151f38, #0b1122) !important;color:#e8eefc !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important}
.swal-custom-confirm{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
.swal-custom-cancel{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}

.referral-box{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(47,125,255,.10));border:1.5px solid rgba(139,92,246,.4);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.referral-box::before{content:"";position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,.20),transparent 65%);pointer-events:none}
.referral-code{display:inline-flex;align-items:center;gap:10px;background:rgba(10,16,32,.75);border:1.5px dashed rgba(139,92,246,.5);border-radius:12px;padding:12px 18px;font-family:monospace;font-size:18px;font-weight:900;letter-spacing:2px;color:#c4b5fd;margin:10px 0}
.copy-btn{background:rgba(139,92,246,.20);border:1px solid rgba(139,92,246,.4);color:#c4b5fd;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.copy-btn:hover{background:rgba(139,92,246,.35);color:#fff}

.sub-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;position:relative;overflow:hidden}
.sub-free{background:rgba(255,255,255,.04);border:1px solid var(--border)}
.sub-paid{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(47,125,255,.10));border:1.5px solid rgba(34,197,94,.4)}
.sub-vip{background:linear-gradient(135deg,rgba(139,92,246,.20),rgba(251,191,36,.12));border:1.5px solid rgba(139,92,246,.5)}
.sub-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.sub-free .sub-icon{background:rgba(255,255,255,.06)}
.sub-paid .sub-icon{background:rgba(34,197,94,.20)}
.sub-vip .sub-icon{background:linear-gradient(140deg,rgba(139,92,246,.35),rgba(251,191,36,.25))}
</style>
</head>
<body>

<div class="topbar">
  <a href="/student/index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
    رجوع
  </a>
</div>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>جارٍ التحميل...</div>
</div>

<div class="footer-dev">
  <button class="dev-btn" onclick="openWhatsApp()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    <span class="dev-name">Developed by <b>EL-sayed Hasan</b></span>
  </button>
  <button class="dev-btn" onclick="sendReport()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
    <span>بلاغ</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/db.js"></script>
<script>
(function(){
  "use strict";

  const DB = window.MissionDB;
  const app = document.getElementById("app");
  let state = { user: null, referralCount: 0 };

  async function load(){
    const sid = DB.getSessionId();
    if(!sid){ window.location.replace("/auth/login.html"); return; }
    const user = await DB.getUser(sid);
    if(!user || user.active === false){ DB.clearSession(); window.location.replace("/auth/login.html"); return; }
    if(user.role === "admin"){ window.location.replace("/admin/index.html"); return; }
    state.user = user;

    try{
      const sb = await DB.getClient();
      const { data } = await sb.from('referrals').select('id').eq('referrer_id', user.id);
      state.referralCount = (data || []).length;
    }catch(e){}

    render();
  }

  function getReferralCode(user){
    return 'ME' + user.id.replace(/[^a-zA-Z0-9]/g,'').slice(-6).toUpperCase();
  }

  function esc(str){
    return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
  }

  function render(){
    const u = state.user;
    const code = getReferralCode(u);
    const sub = u.subscription || 'free';
    const subLabel = sub === 'vip' ? '💎 VIP' : sub === 'paid' ? '💳 مدفوع' : '🆓 مجاني';
    const subClass = sub === 'vip' ? 'sub-vip' : sub === 'paid' ? 'sub-paid' : 'sub-free';

    app.innerHTML = `
      <div class="fade-in">
        <div class="glass mb16" style="padding:28px">
          <div class="flex center wrap-fl" style="gap:20px">
            <div class="avatar-lg">${esc(u.avatar || "🧑‍🎓")}</div>
            <div style="flex:1;min-width:200px">
              <div class="h1 mb8">${esc(u.name)}</div>
              <div class="sm muted mb12" dir="ltr">${esc((u.country_code || "+20")+(u.phone || ""))}</div>
              <div class="flex wrap-fl g8">
                <span class="pill pill-v">🔥 ${u.streak || 0} يوم متواصل</span>
                <span class="pill pill-b">${subLabel}</span>
                ${u.governorate ? `<span class="pill pill-b">📍 ${esc(u.governorate)}</span>` : ''}
              </div>
            </div>
          </div>
        </div>

        <div class="glass mb16" style="padding:20px">
          <div class="h4 mb16">📊 إحصائياتك</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
            <div class="stat-box">
              <div>
                <div class="lbl-x">نقاط XP</div>
                <div class="val-x" style="color:#5aa9ff">${DB.fmt(u.xp || 0)}</div>
              </div>
              <div style="font-size:24px">⚡</div>
            </div>
            <div class="stat-box">
              <div>
                <div class="lbl-x">دروس مكتملة</div>
                <div class="val-x" style="color:#22c55e">${(u.completed_lessons || []).length}</div>
              </div>
              <div style="font-size:24px">📖</div>
            </div>
            <div class="stat-box">
              <div>
                <div class="lbl-x">إنجازات</div>
                <div class="val-x" style="color:#f59e0b">${(u.achievements || []).length}</div>
              </div>
              <div style="font-size:24px">🏆</div>
            </div>
            <div class="stat-box">
              <div>
                <div class="lbl-x">مهام مكتملة</div>
                <div class="val-x" style="color:#8b5cf6">${(u.completed_missions || []).length}</div>
              </div>
              <div style="font-size:24px">🎯</div>
            </div>
          </div>
        </div>

        <div class="glass mb16" style="padding:20px">
          <div class="h4 mb16">💳 اشتراكي</div>
          <div class="sub-card ${subClass}">
            <div class="sub-icon">${sub === 'vip' ? '💎' : sub === 'paid' ? '💳' : '🆓'}</div>
            <div style="flex:1">
              <div class="h4" style="font-size:15px">${sub === 'vip' ? 'عضوية VIP' : sub === 'paid' ? 'عضوية مدفوعة' : 'الحساب المجاني'}</div>
              <div class="xs muted mt8">
                ${sub === 'free' ? 'للترقية، تواصل مع الإدارة' : `ينتهي في: ${u.subscription_until ? new Date(u.subscription_until).toLocaleDateString('ar-EG') : 'بلا نهاية'}`}
              </div>
            </div>
            ${sub === 'free' ? `<button class="btn btn-p btn-sm" onclick="upgradePrompt()">ترقية</button>` : ''}
          </div>
        </div>

        <div class="referral-box mb16">
          <div class="flex between center mb8" style="position:relative;z-index:1">
            <div class="h4">🎁 ادعُ أصدقاءك واكسب XP</div>
            <span class="pill pill-v">${state.referralCount} إحالة</span>
          </div>
          <div class="sm txt2 mb12" style="position:relative;z-index:1">
            شارك الكود ده مع أصحابك. لما يسجلوا ويستخدموه، إنت وهما تكسبوا XP!
          </div>
          <div class="flex center wrap-fl g8" style="position:relative;z-index:1">
            <div class="referral-code" style="margin:0">
              <span id="refCode">${code}</span>
              <button class="copy-btn" onclick="copyRefCode('${code}')" title="نسخ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <button class="btn btn-p" onclick="shareRefCode('${code}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              مشاركة
            </button>
          </div>
        </div>

        <div class="glass mb16" style="padding:20px">
          <div class="h4 mb12">✏️ تعديل البيانات</div>
          <div class="field">
            <label class="lbl">الاسم الكامل</label>
            <input id="inpName" class="input" value="${esc(u.name || "")}" placeholder="اسمك"/>
          </div>
          <div class="field">
            <label class="lbl">رقم الهاتف (لا يمكن تغييره)</label>
            <input class="input" value="${esc((u.country_code || "+20")+(u.phone || ""))}" disabled style="opacity:.6" dir="ltr"/>
          </div>
          <div class="field">
            <label class="lbl">📍 المحافظة</label>
            <select id="inpGov" class="input">
              <option value="">— بدون —</option>
              ${["القاهرة","الجيزة","الإسكندرية","الدقهلية","الشرقية","المنوفية","القليوبية","البحيرة","الغربية","بورسعيد","دمياط","الإسماعيلية","السويس","كفر الشيخ","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح","شمال سيناء","جنوب سيناء"].map(g => `<option value="${g}" ${u.governorate===g?'selected':''}>${g}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-p btn-block" id="btnSaveName">💾 حفظ التعديلات</button>
        </div>

        <div class="glass mb16" style="padding:20px">
          <div class="h4 mb12">🔒 تغيير كلمة المرور</div>
          <div class="field">
            <label class="lbl">كلمة المرور الحالية</label>
            <input id="inpOldPass" class="input" type="password" placeholder="••••••"/>
          </div>
          <div class="field">
            <label class="lbl">كلمة المرور الجديدة</label>
            <input id="inpNewPass" class="input" type="password" placeholder="6 أحرف على الأقل"/>
          </div>
          <div class="field">
            <label class="lbl">تأكيد كلمة المرور</label>
            <input id="inpConfirmPass" class="input" type="password" placeholder="أعد الكتابة"/>
          </div>
          <button class="btn btn-ok btn-block" id="btnChangePass">🔐 تغيير كلمة المرور</button>
        </div>

        <div class="glass" style="padding:20px">
          <div class="h4 mb12">🚪 تسجيل الخروج</div>
          <div class="sm muted mb16">سيتم إنهاء جلستك والعودة لصفحة الدخول.</div>
          <button class="btn btn-dn btn-block" id="btnLogout">تسجيل الخروج</button>
        </div>
      </div>
    `;

    document.getElementById("btnSaveName").addEventListener("click", async ()=>{
      const newName = document.getElementById("inpName").value.trim();
      const newGov = document.getElementById("inpGov").value || null;
      if(!newName || newName.length < 3){
        Swal.fire({
          icon:"warning", title:"الاسم قصير", text:"الاسم يجب أن يكون 3 أحرف على الأقل",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
        return;
      }
      try{
        await DB.updateUser(u.id, { name: newName, governorate: newGov });
        state.user.name = newName;
        state.user.governorate = newGov;
        Swal.fire({
          icon:"success", title:"تم الحفظ", text:"تم تحديث بياناتك بنجاح",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"},
          timer:1800, showConfirmButton:false
        });
        render();
      }catch(e){
        Swal.fire({
          icon:"error", title:"خطأ", text:e.message,
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
      }
    });

    document.getElementById("btnChangePass").addEventListener("click", async ()=>{
      const oldPass = document.getElementById("inpOldPass").value;
      const newPass = document.getElementById("inpNewPass").value;
      const confirmPass = document.getElementById("inpConfirmPass").value;

      if(!oldPass || !newPass || !confirmPass){
        Swal.fire({
          icon:"warning", title:"حقول ناقصة", text:"يرجى تعبئة جميع الحقول",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
        return;
      }
      if(newPass.length < 6){
        Swal.fire({
          icon:"warning", title:"كلمة قصيرة", text:"كلمة المرور يجب أن تكون 6 أحرف على الأقل",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
        return;
      }
      if(newPass !== confirmPass){
        Swal.fire({
          icon:"warning", title:"غير متطابقتين", text:"كلمتا المرور غير متطابقتين",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
        return;
      }

      try{
        const hashedOld = await DB.hashPassword(oldPass);
        const hashedNew = await DB.hashPassword(newPass);
        const result = await DB.changePassword(u.id, hashedOld, hashedNew);
        if(!result.success){
          Swal.fire({
            icon:"error", title:"كلمة المرور الحالية خطأ",
            background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
            confirmButtonColor:"#2f7dff",
            customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
          });
          return;
        }
        Swal.fire({
          icon:"success", title:"تم التغيير", text:"تم تحديث كلمة المرور بنجاح",
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"},
          timer:1800, showConfirmButton:false
        });
        document.getElementById("inpOldPass").value = "";
        document.getElementById("inpNewPass").value = "";
        document.getElementById("inpConfirmPass").value = "";
      }catch(e){
        Swal.fire({
          icon:"error", title:"خطأ", text:e.message,
          background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
          confirmButtonColor:"#2f7dff",
          customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
        });
      }
    });

    document.getElementById("btnLogout").addEventListener("click", ()=>{
      Swal.fire({
        title:"تسجيل الخروج", text:"هل أنت متأكد؟", icon:"question",
        showCancelButton:true, confirmButtonText:"نعم، خروج", cancelButtonText:"إلغاء",
        confirmButtonColor:"#ef4444", cancelButtonColor:"#64748b",
        background:"linear-gradient(180deg, #151f38, #0b1122)", color:"#e8eefc",
        customClass:{popup:"swal-custom-popup", title:"swal-custom-title"}
      }).then(r=>{
        if(r.isConfirmed){ DB.clearSession(); window.location.replace("/auth/login.html"); }
      });
    });
  }

  window.copyRefCode = (code) => {
    try{
      navigator.clipboard.writeText(code);
      Swal.fire({
        icon:'success', title:'✅ تم النسخ',
        text:`كود الإحالة: ${code}`,
        background:'linear-gradient(180deg, #151f38, #0b1122)',
        color:'#e8eefc', confirmButtonColor:'#2f7dff',
        customClass:{popup:'swal-custom-popup',title:'swal-custom-title'},
        timer:1800, showConfirmButton:false
      });
    }catch(e){
      Swal.fire({
        icon:'error', title:'فشل النسخ',
        background:'linear-gradient(180deg, #151f38, #0b1122)',
        color:'#e8eefc', confirmButtonColor:'#2f7dff',
        customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
      });
    }
  };

  window.shareRefCode = (code) => {
    const text = `🎓 انضم لمنصة MISSION EDU التعليمية!\n\nاستخدم كود الإحالة: ${code}\n\nواحصل على XP إضافي عند التسجيل 🚀\n\nhttps://missionedu.com/auth/register.html?ref=${code}`;
    if(navigator.share){
      navigator.share({
        title: 'MISSION EDU — دعوة',
        text: text
      }).catch(()=>{});
    } else {
      window.copyRefCode(code);
    }
  };

  window.upgradePrompt = () => {
    Swal.fire({
      icon:'info',
      title:'💳 ترقية الاشتراك',
      html:`
        <div style="text-align:right;font-size:14px;line-height:2">
          <div>للحصول على مزايا إضافية:</div>
          <ul style="padding-inline-start:20px;margin-top:12px">
            <li>📚 وصول لجميع المواد</li>
            <li>📝 اختبارات غير محدودة</li>
            <li>🏆 شهادات معتمدة</li>
            <li>💎 دعم فني مباشر</li>
          </ul>
          <div style="margin-top:16px;font-weight:800;color:#5aa9ff">تواصل مع الإدارة للترقية</div>
        </div>
      `,
      showCancelButton:true,
      confirmButtonText:'📱 واتساب',
      cancelButtonText:'إغلاق',
      confirmButtonColor:'#22c55e',
      cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #151f38, #0b1122)',
      color:'#e8eefc',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    }).then(r=>{
      if(r.isConfirmed){
        window.open("https://wa.me/201128351702?text="+encodeURIComponent("مرحبًا، أريد ترقية اشتراكي في MISSION EDU"),"_blank");
      }
    });
  };

  window.openWhatsApp = ()=>{
    window.open("https://wa.me/201128351702?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
  };

  window.sendReport = async ()=>{
    const { value: msg } = await Swal.fire({
      title: '🚨 بلاغ عن مشكلة',
      input: 'textarea',
      inputPlaceholder: 'اكتب رسالتك هنا...',
      showCancelButton: true,
      confirmButtonText: '📤 إرسال',
      cancelButtonText: 'إلغاء',
      confirmButtonColor: '#2f7dff',
      cancelButtonColor: '#64748b',
      inputValidator: v => { if(!v || v.trim().length < 5) return 'يرجى كتابة رسالة واضحة'; },
      customClass: {popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}
    });
    if(msg){
      const u = state.user;
      const sent = await DB.reportIssue({
        userName: u?.name || 'زائر',
        userPhone: (u?.country_code||'+20')+(u?.phone||'—'),
        message: msg
      });
      Swal.fire({
        icon: sent?'success':'error',
        title: sent?'✅ تم الإرسال':'❌ فشل',
        text: sent?'شكرًا لك':'حاول مرة أخرى',
        confirmButtonColor:'#2f7dff',
        customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
      });
    }
  };

  document.addEventListener("contextmenu", e=>e.preventDefault());
  load();
})();
</script>
</body>
</html>
