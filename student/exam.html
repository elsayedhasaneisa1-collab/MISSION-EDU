<style>
:root{--bg:#04060e;--panel:#111827;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--gold:#fbbf24;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}

a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}

.wrap{max-width:760px;margin:0 auto;padding:20px 20px 100px}
.h1{font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.h3{font-size:17px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}

.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.col{flex-direction:column}.wrap-fl{flex-wrap:wrap}

.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}

.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}

.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}

.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}

.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}

.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:linear-gradient(90deg,#2f7dff,#5aa9ff)}

.spinner{width:40px;height:40px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}

@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lockPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(251,191,36,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 35px rgba(251,191,36,.9))}}
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes cancelledPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(239,68,68,.5))}50%{transform:scale(1.05);filter:drop-shadow(0 0 40px rgba(239,68,68,.85))}}
.fade-in{animation:fu .3s ease-out}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(6,9,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;font-weight:700;transition:.2s;text-decoration:none}

.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);flex-wrap:wrap}
.dev-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .3s;border:1px solid rgba(90,140,230,.3);background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));color:var(--txt)}

.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;background:linear-gradient(180deg, #151f38, #0b1122) !important;color:#e8eefc !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important}
.ring{position:relative;display:grid;place-items:center;margin:0 auto}
.ring-t{position:absolute;text-align:center}
.stat{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:8px}
.stat-l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat-v{font-size:16px;font-weight:900;letter-spacing:-.5px}
.xp-box{margin-top:20px;padding:12px 20px;border-radius:14px;font-weight:700;text-align:center}
.locked-shell{width:100%;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,rgba(4,6,14,.96),rgba(11,18,38,.98));border:1px solid rgba(251,191,36,.35);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(251,191,36,.12) inset;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lock-content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;max-width:440px}
.lock-icon-wrap{position:relative;width:clamp(80px,20vw,120px);height:clamp(80px,20vw,120px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(251,191,36,.35),rgba(251,191,36,.08) 70%,transparent);border:2px solid rgba(251,191,36,.4);box-shadow:0 0 40px rgba(251,191,36,.3);margin-bottom:clamp(14px,3.5vw,22px);animation:lockPulse 3s ease-in-out infinite}
.lock-icon-wrap i{font-size:clamp(32px,8vw,50px);color:#fbbf24;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.crown-badge{position:absolute;top:-8px;right:-8px;width:clamp(30px,7.5vw,44px);height:clamp(30px,7.5vw,44px);border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;box-shadow:0 6px 20px rgba(251,191,36,.55),0 0 0 2px rgba(10,8,5,.9) inset;animation:crownFloat 2.5s ease-in-out infinite}
.crown-badge i{font-size:clamp(14px,3.8vw,20px);color:#1a1206}
.lock-title{font-size:clamp(17px,4.5vw,22px);font-weight:900;color:#fbbf24;margin-bottom:8px;text-shadow:0 2px 12px rgba(251,191,36,.4)}
.lock-desc{font-size:clamp(12px,3vw,14px);color:#b7c6e4;margin-bottom:clamp(14px,3.5vw,20px);line-height:1.6;padding:0 10px}
.lock-btn{display:inline-flex;align-items:center;gap:8px;padding:clamp(10px,2.8vw,13px) clamp(20px,5vw,30px);border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1206;font-weight:900;font-size:clamp(13px,3.2vw,15px);box-shadow:0 10px 30px rgba(251,191,36,.45);transition:.24s;border:none;cursor:pointer;font-family:inherit}
.lock-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(251,191,36,.6)}
.lock-btn i{font-size:clamp(13px,3.2vw,16px)}
.lock-note{margin-top:clamp(10px,2.8vw,16px);font-size:clamp(10px,2.5vw,12px);color:#7f93b8;opacity:.85}
.cancelled-shell{width:100%;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,rgba(20,4,4,.96),rgba(38,11,11,.98));border:1px solid rgba(239,68,68,.4);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(239,68,68,.15) inset;display:flex;align-items:center;justify-content:center;padding:44px 24px;text-align:center}
.cancelled-content{display:flex;flex-direction:column;align-items:center;max-width:460px;width:100%}
.cancelled-icon-wrap{width:clamp(90px,22vw,130px);height:clamp(90px,22vw,130px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(239,68,68,.35),rgba(239,68,68,.08) 70%,transparent);border:2px solid rgba(239,68,68,.5);box-shadow:0 0 40px rgba(239,68,68,.35);margin-bottom:22px;animation:cancelledPulse 2.5s ease-in-out infinite}
.cancelled-icon-wrap i{font-size:clamp(38px,9vw,58px);color:#fca5a5;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.cancelled-title{font-size:clamp(20px,4.8vw,26px);font-weight:900;color:#fca5a5;margin-bottom:10px;text-shadow:0 2px 12px rgba(239,68,68,.4)}
.cancelled-desc{font-size:clamp(13px,3.2vw,15px);color:#b7c6e4;line-height:1.8;margin-bottom:20px;padding:0 10px}
.cancelled-reason{padding:14px 18px;border-radius:14px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.3);font-size:13.5px;color:#fca5a5;font-weight:700;margin-bottom:22px;line-height:1.7}
.cancelled-note{padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.exam-block-overlay{position:fixed;inset:0;z-index:999999;background:rgba(10,5,5,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:all!important;cursor:not-allowed;animation:fu .15s ease-out}
.exam-block-overlay .exam-block-msg{padding:24px 32px;border-radius:20px;background:linear-gradient(180deg,rgba(21,31,56,.98),rgba(11,17,34,.98));border:2px solid rgba(239,68,68,.6);color:#fca5a5;font-weight:900;font-size:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.85),0 0 40px rgba(239,68,68,.25);max-width:420px;line-height:1.7}
.exam-block-overlay .exam-block-ico{font-size:52px;margin-bottom:12px;filter:drop-shadow(0 8px 20px rgba(239,68,68,.5));animation:cancelledPulse 1.5s ease-in-out infinite}
body.exam-active{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.exam-active input,body.exam-active textarea{user-select:text!important;-webkit-user-select:text!important}
.exam-layout{display:flex;min-height:calc(100vh - 60px);position:relative;max-width:1400px;margin:0 auto}
.sidebar{width:320px;flex-shrink:0;background:rgba(21,31,56,.72);border-left:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.main-content{flex:1;padding:30px;display:flex;flex-direction:column}
.timer-box{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.2);padding:15px;border-radius:var(--rs);border:1px solid var(--border)}
.timer-val{font-size:32px;font-weight:900;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer-label{font-size:13px;color:var(--txt2);font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:rgba(0,0,0,0.2);padding:12px;border-radius:var(--rs);text-align:center;border:1px solid var(--border)}
.stat-box .val{font-size:20px;font-weight:900}
.stat-box .lbl{font-size:11px;color:var(--txt2)}
.stat-box.ans .val{color:var(--blue)}
.stat-box.rem .val{color:var(--muted)}
.stat-box.pct .val{color:var(--green)}
.controls-box{display:flex;flex-direction:column;gap:8px}
.btn-ctrl{padding:12px;border-radius:var(--rs);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;border:none;cursor:pointer}
.btn-continue{background:var(--green);color:#fff}
.btn-review{background:var(--blue);color:#fff}
.btn-end{background:var(--red);color:#fff}
.grid-section{border-top:1px solid var(--border);padding-top:15px}
.grid-title{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}
.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q-btn{padding:10px 0;border-radius:8px;font-weight:800;font-size:14px;text-align:center;background:rgba(0,0,0,0.2);border:1px solid var(--border2);color:var(--muted);transition:.2s;cursor:pointer}
.q-btn.answered{background:rgba(47,125,255,.15);border-color:var(--blue);color:var(--blue)}
.q-btn.visited{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.q-btn.current{box-shadow:0 0 0 2px var(--txt);transform:scale(1.05)}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-top:15px;flex-wrap:wrap;gap:5px}
.leg-item{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.dot-blue{background:var(--blue)}
.dot-red{background:var(--red)}
.dot-gray{background:var(--muted)}
.sidebar-nav{display:flex;gap:10px;margin-top:auto}
.sidebar-nav button{flex:1;padding:12px;border-radius:var(--rs);background:rgba(0,0,0,0.2);border:1px solid var(--border2);font-weight:800;color:var(--txt);transition:.2s}
.sidebar-nav button:disabled{opacity:.5;cursor:not-allowed}
.question-area{flex:1;display:flex;flex-direction:column;background:rgba(21,31,56,.72);border-radius:var(--r);border:1px solid var(--border);padding:40px;position:relative}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.q-num-badge{width:40px;height:40px;border-radius:50%;background:rgba(47,125,255,.15);color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:18px}
.q-points{background:rgba(0,0,0,0.2);border:1px solid var(--border);padding:6px 16px;border-radius:20px;font-weight:800;font-size:13px;color:var(--green)}
.q-text{font-size:24px;font-weight:800;line-height:1.6;margin-bottom:40px;color:var(--txt)}
.opt{display:flex;align-items:center;gap:15px;padding:18px 20px;background:rgba(0,0,0,0.2);border:1.5px solid var(--border2);border-radius:var(--rs);cursor:pointer;transition:.2s;font-size:18px;font-weight:700;color:var(--txt)}
.opt:hover{background:rgba(255,255,255,.03);border-color:var(--txt2)}
.opt.selected{border-color:var(--blue);background:rgba(47,125,255,.08);box-shadow:0 0 0 1px var(--blue)}
.opt.ok{border-color:var(--green);background:rgba(34,197,94,.1)}
.opt.bad{border-color:var(--red);background:rgba(239,68,68,.1)}
.opt-letter{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--txt2);flex-shrink:0;transition:.2s}
.opt.selected .opt-letter{border-color:var(--blue);background:var(--blue);color:#fff}
.opt.ok .opt-letter{border-color:var(--green);background:var(--green);color:#fff}
.opt.bad .opt-letter{border-color:var(--red);background:var(--red);color:#fff}
@media(max-width:900px){
  .exam-layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-left:none;border-bottom:1px solid var(--border);padding:15px}
  .main-content{padding:15px}
  .question-area{padding:20px}
  .q-text{font-size:20px;margin-bottom:20px}
  .opt{font-size:16px;padding:14px}
  .timer-val{font-size:26px}
  .q-grid{grid-template-columns:repeat(6,1fr)}
}
</style>

function esc(str){
  return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
}
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${String(sec).padStart(2,"0")}`; }

function buildRing(value, size, stroke, color){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c - (value/100)*c;
  return `
    <div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.07)" stroke-width="${stroke}" fill="none"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
      </svg>
      <div class="ring-t"><div style="font-size:32px;font-weight:900;letter-spacing:-1px">${value}%</div></div>
    </div>`;
}

function isPaidContent(item){
  if(!item) return false;
  const v = item.is_free;
  return v === false || v === 'false' || v === 'paid' || v === 0;
}
function hasSubscriptionAccess(user){
  if(!user) return false;
  if(user.subscription === 'vip' || user.subscription === 'VIP') return true;
  if(user.subscription === 'paid' || user.subscription === 'PAID'){
    if(!user.subscription_until) return true;
    const until = typeof user.subscription_until === 'number' ? user.subscription_until : new Date(user.subscription_until).getTime();
    return !isNaN(until) && until > Date.now();
  }
  return false;
}
function hasAccess(user, item){ return !isPaidContent(item) || hasSubscriptionAccess(user); }

function getSubscriptionBadge(user){
  if(!user) return '';
  if(user.subscription === 'vip' || user.subscription === 'VIP')
    return '<span class="pill pill-vip"><i class="fa-solid fa-crown"></i> VIP</span>';
  if(user.subscription === 'paid' || user.subscription === 'PAID'){
    if(user.subscription_until){
      const until = typeof user.subscription_until === 'number' ? user.subscription_until : new Date(user.subscription_until).getTime();
      if(until > Date.now()){
        const days = Math.ceil((until - Date.now()) / 86400000);
        return `<span class="pill pill-paid"><i class="fa-solid fa-crown"></i> مشترك (${days} يوم)</span>`;
      }
      return '<span class="pill pill-r"><i class="fa-solid fa-circle-xmark"></i> اشتراك منتهي</span>';
    }
    return '<span class="pill pill-paid"><i class="fa-solid fa-crown"></i> مشترك</span>';
  }
  return '<span class="pill pill-free"><i class="fa-solid fa-user"></i> مجاني</span>';
}

function renderStart(){
  const e = state.exam;
  const attempts = (state.attempts||[]).filter(a => a.status !== 'cancelled');

  const paid = isPaidContent(e);

  let actionArea = '';
  if(hasWon){
    actionArea = `
      <div style="padding:20px;border-radius:14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);text-align:center">

          <div class="stat"><span class="stat-l">المدة</span><span class="stat-v">${e.duration}د</span></div>

        <div class="glass-s mb16" style="padding:14px;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.05)">

        ${attempts.length > 0 ? `<div class="glass-s mb16" style="padding:12px">

          ${attempts.map((a,i) => `<div class="flex between center" style="padding:4px 0;font-size:13px"><span class="muted">محاولة ${attempts.length - i}</span><span class="pill ${a.passed ? 'pill-g' : 'pill-r'}">${a.pct||0}%</span></div>`).join('')}

function renderExam(){
  app.style.display = 'flex';
  app.style.maxWidth = '1400px';
  app.className = 'exam-layout';

  const q = state.questions[state.current];
  if (!q) {
    app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12" style="color:#fca5a5">⚠️ حدث خطأ أثناء تحميل السؤال</div><p class="sm muted mb16">تعذر العثور على بيانات السؤال، يرجى إعادة المحاولة.</p><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
    return;
  }

  const total = state.questions.length;

  let answeredCount = 0;
  for(let i=0; i<total; i++) { if(state.answers[i] !== undefined) answeredCount++; }
  const remainingCount = total - answeredCount;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;

  let gridHtml = '';
  for(let i=0; i<total; i++) {
    let cls = 'q-btn';
    if(state.answers[i] !== undefined) cls += ' answered';
    else if (state.visited[i]) cls += ' visited';
    if(i === state.current) cls += ' current';
    gridHtml += `<button class="${cls}" onclick="window.jumpTo(${i})">${i+1}</button>`;
  }

  app.innerHTML = `
    <aside class="sidebar">
      <div class="timer-box">
        <div><div class="timer-label">الوقت المتبقي</div><div class="timer-val" id="timerDisplay">${fmtTime(state.timeLeft)}</div></div>
        <i class="fa-solid fa-hourglass-half" style="font-size:24px;color:var(--amber)"></i>
      </div>
      <div class="stats-grid">
        <div class="stat-box ans"><div class="val">${answeredCount}</div><div class="lbl">تمت الإجابة</div></div>
        <div class="stat-box rem"><div class="val">${remainingCount}</div><div class="lbl">متبقي</div></div>
        <div class="stat-box pct"><div class="val">${pct}%</div><div class="lbl">التقدم</div></div>
      </div>
      <div class="controls-box">
        <button class="btn-ctrl btn-end" onclick="window.finishExam()"><i class="fa-solid fa-flag-checkered"></i> إنهاء الاختبار</button>
      </div>
      <div class="grid-section">
        <div class="grid-title"><span>الأسئلة</span><span style="color:var(--muted)">${answeredCount}/${total}</span></div>
        <div class="q-grid">${gridHtml}</div>
        <div class="legend">
          <div class="leg-item"><span class="dot dot-blue"></span> تم الحل</div>
          <div class="leg-item"><span class="dot dot-red"></span> مفتوح</div>
          <div class="leg-item"><span class="dot dot-gray"></span> متبقي</div>
        </div>
      </div>
      <div class="sidebar-nav">
        <button ${state.current===0?'disabled':''} onclick="window.jumpTo(${state.current-1})">السابق</button>
        <button ${state.current===total-1?'disabled':''} onclick="window.jumpTo(${state.current+1})">التالي</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="question-area">
        <div class="q-header">
          <div class="q-num-badge">${state.current+1}</div>
          <div class="q-points">درجة واحدة</div>
        </div>
        <div class="q-text">${esc(q.text)}</div>
        <div class="options">
          ${(q.options||[]).map((opt, oi) => {
            const isSel = state.answers[state.current] === oi;
            return `<div class="opt ${isSel ? 'selected' : ''}" onclick="window.selectOpt(${oi})"><div class="opt-letter">${['أ','ب','ج','د'][oi]}</div><div>${esc(opt)}</div></div>`;
          }).join('')}
        </div>
      </div>
    </main>`;
}

window.jumpTo = (idx) => { state.current = idx; state.visited[idx] = true; saveState(); renderExam(); };
window.selectOpt = (oi) => { state.answers[state.current] = oi; state.visited[state.current] = true; saveState(); renderExam(); };
window.finishExam = () => {
  Swal.fire({
    title: 'إرسال الإجابات؟', text: 'لن يمكنك تعديل الإجابات بعد الإرسال',
    icon: 'question', showCancelButton: true, confirmButtonText: 'نعم، إرسال', cancelButtonText: 'إلغاء',
    confirmButtonColor: '#2f7dff', cancelButtonColor: '#64748b',
    customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
  }).then(r => { if(r.isConfirmed) submitExam(); });
};

function saveState(){
  if(!STATE_KEY || !state.started) return;
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify({
      startedAt: state.startedAt,
      timeLeft: state.timeLeft,
      current: state.current,
      answers: state.answers,
      visited: state.visited,
      savedAt: Date.now()
    }));
  }catch(e){}
}
function clearState(){ try{ if(STATE_KEY) localStorage.removeItem(STATE_KEY); }catch(e){} }

function renderResult(){
  app.style.display = 'block';
  app.style.maxWidth = '760px';
  app.className = 'wrap';
  const r = state.result;
  const color = r.passed ? "#22c55e" : "#f59e0b";

  if (r.passed && !r.hasWonBefore && window.confetti) {
    window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 }, colors: ['#2f7dff', '#8b5cf6', '#22c55e', '#fbbf24'] });
    setTimeout(() => {
      window.confetti({ particleCount: 80, angle: 60, spread: 60, origin: { x: 0 } });
      window.confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 1 } });
    }, 300);
  }

  let xpMessage = '';
  if (r.passed && !r.hasWonBefore && r.gained > 0){
    xpMessage = `<div class="xp-box" style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#6ee7a0">⚡ +${r.gained} XP مكافأة</div>`;
  } else if (r.passed && r.hasWonBefore){
    xpMessage = `<div class="xp-box" style="background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#c4b5fd">🔁 محاولة إعادة — لا XP إضافي</div>`;
  } else if (!r.passed){
    xpMessage = `<div class="xp-box" style="background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fcd34d">💪 لم تنجح — حاول مرة أخرى</div>`;
  }

  const resultsMap = {};
  (r.questionResults||[]).forEach(qr => { resultsMap[qr.id] = qr; });

  const reviewHtml = state.questions.map((q,i) => {
    const qr = resultsMap[q.id];
    const given = qr?.given ?? -1;
    const correct = qr?.correct ?? -1;
    const isCorrect = qr?.is_correct === true;
    return `
      <div class="glass mb12" style="padding:16px">
        <div class="flex between center mb8">
          <span class="pill ${isCorrect ? 'pill-g' : 'pill-r'}">${isCorrect ? '✓ صحيح' : '✗ خطأ'}</span>
          <span class="xs muted">سؤال ${i+1}</span>
        </div>
        <div class="h4 mb12">${esc(q.text)}</div>
        <div class="flex col g6">
          ${(q.options||[]).map((op,oi) => {
            const isGiven = given === oi;
            const isCorrectOpt = correct === oi;
            let cls = 'opt';
            if(isCorrectOpt) cls += ' ok';
            else if(isGiven) cls += ' bad';
            return `<div class="${cls}" style="cursor:default"><div class="opt-letter">${['أ','ب','ج','د','هـ'][oi]}</div><div>${esc(op)}</div></div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="fade-in">
      <div class="glass mb16" style="padding:32px 24px;text-align:center">
        <div style="font-size:72px;margin-bottom:12px">${r.passed ? '🎉' : '💪'}</div>
        <div class="h1 mb8">${r.passed ? 'أحسنت!' : 'حاول مرة أخرى'}</div>
        <div class="sm muted mb20">حصلت على ${r.score} من ${r.total}</div>
        ${buildRing(r.pct, 140, 10, color)}
        ${xpMessage}
        <div class="pill ${r.passed?'pill-g':'pill-r'}" style="margin-top:16px;padding:6px 16px;font-size:12.5px">${r.passed ? '✓ ناجح' : '✗ راسب'}</div>
      </div>
      <div class="h3 mb12">📋 مراجعة الإجابات</div>
      ${reviewHtml}
      <div class="flex g8 mt16"><a href="index.html" class="btn btn-p btn-block" style="text-decoration:none">🏠 العودة للرئيسية</a></div>
    </div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function showExamBlockOverlay(){
  if(document.getElementById('examBlockOverlay')) return;
  if(!state.started || state.submitted || state.cancelled) return;
  const el = document.createElement('div');
  el.id = 'examBlockOverlay';
  el.className = 'exam-block-overlay';
  el.innerHTML = `<div class="exam-block-msg"><div class="exam-block-ico">⛔</div><div>تم كشف خروج غير مسموح</div><div style="font-size:13px;color:#7f93b8;margin-top:8px;font-weight:600">جاري إلغاء الاختبار...</div></div>`;
  const block = (e)=>{ try{ e.stopPropagation(); e.stopImmediatePropagation(); e.preventDefault(); }catch(err){} return false; };
  el.addEventListener('click', block, true);
  el.addEventListener('mousedown', block, true);
  el.addEventListener('mouseup', block, true);
  el.addEventListener('touchstart', block, {capture:true, passive:false});
  el.addEventListener('touchend', block, {capture:true, passive:false});
  el.addEventListener('touchmove', block, {capture:true, passive:false});
  el.addEventListener('contextmenu', block, true);
  document.body.appendChild(el);
}
function removeExamBlockOverlay(){ const el = document.getElementById('examBlockOverlay'); if(el) el.remove(); }

async function enterExamFullscreen(){
  try{
    let success = false;
    if(document.documentElement.requestFullscreen){
      try{ await document.documentElement.requestFullscreen(); success = !!document.fullscreenElement; }catch(e){}
    }
    if(!success && document.documentElement.webkitRequestFullscreen){
      try{ document.documentElement.webkitRequestFullscreen(); success = !!document.webkitFullscreenElement; }catch(e){}
    }
    state.fullscreenEntered = success;
    if(screen.orientation && screen.orientation.lock){
      try{ await screen.orientation.lock('portrait'); }catch(e){}
    }
  }catch(e){ console.warn('Fullscreen failed:', e); }
}
async function exitExamFullscreen(){
  try{
    if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  if(screen.orientation && screen.orientation.unlock){ try{ screen.orientation.unlock(); }catch(e){} }
}

function setupExamProtection(){
  document.body.classList.add('exam-active');

  state.fsChangeHandler = ()=>{
    if(!state.started || state.submitted || state.cancelled) return;
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if(state.fullscreenEntered && !isFs){
      showExamBlockOverlay();
      setTimeout(()=>{ cancelExam('exit-fullscreen'); }, 50);
    }
  };

  state.visibilityHandler = ()=>{
    if(document.hidden && state.started && !state.submitted && !state.cancelled){
      showExamBlockOverlay();
      setTimeout(()=>{ cancelExam('visibility-hidden'); }, 50);
    }
  };

  state.contextHandler = (e)=>{
    if(state.started && !state.submitted && !state.cancelled){
      e.preventDefault();
      return false;
    }
  };

  state.keyHandler = (e)=>{
    if(!state.started || state.submitted || state.cancelled) return;
    if(e.key === 'F12'){ e.preventDefault(); return false; }
    if(e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())){ e.preventDefault(); return false; }
    if(e.ctrlKey && ['U','S','P','C','X','A'].includes(e.key.toUpperCase())){ e.preventDefault(); return false; }
    if(e.key === 'PrintScreen'){ try{ navigator.clipboard.writeText(''); }catch(err){} }
  };

  state.beforeUnloadHandler = (e)=>{
    if(state.started && !state.submitted && !state.cancelled){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  };

  document.addEventListener('fullscreenchange', state.fsChangeHandler);
  document.addEventListener('webkitfullscreenchange', state.fsChangeHandler);
  document.addEventListener('visibilitychange', state.visibilityHandler);
  document.addEventListener('contextmenu', state.contextHandler);
  document.addEventListener('keydown', state.keyHandler);
  document.addEventListener('copy', state.contextHandler);
  document.addEventListener('cut', state.contextHandler);
  window.addEventListener('beforeunload', state.beforeUnloadHandler);

  setTimeout(()=>{ enterExamFullscreen(); }, 200);
}

function removeExamProtection(){
  document.body.classList.remove('exam-active');
  if(state.fsChangeHandler){
    document.removeEventListener('fullscreenchange', state.fsChangeHandler);
    document.removeEventListener('webkitfullscreenchange', state.fsChangeHandler);
  }
  if(state.visibilityHandler) document.removeEventListener('visibilitychange', state.visibilityHandler);
  if(state.contextHandler){
    document.removeEventListener('contextmenu', state.contextHandler);
    document.removeEventListener('copy', state.contextHandler);
    document.removeEventListener('cut', state.contextHandler);
  }
  if(state.keyHandler) document.removeEventListener('keydown', state.keyHandler);
  if(state.beforeUnloadHandler) window.removeEventListener('beforeunload', state.beforeUnloadHandler);
  state.fsChangeHandler = null;
  state.visibilityHandler = null;
  state.contextHandler = null;
  state.keyHandler = null;
  state.beforeUnloadHandler = null;
}

function startExam(){
  if(state.questions.length === 0){
    Swal.fire({icon:'error',title:'خطأ',text:'لا توجد أسئلة في هذا الاختبار',background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc'});
    return;
  }
  state.started = true;
  state.submitted = false;
  state.cancelled = false;
  state.current = 0;
  state.answers = {};
  state.visited = { 0: true };
  state.timeLeft = (state.exam.duration || 15) * 60;
  state.result = null;
  state.startedAt = Date.now();
  saveState();

  DB.logActivity(state.user.id, state.user.name, "exam_start", state.exam.title);

  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft <= 0){
      clearInterval(state.timer);
      submitExam();
      return;
    }
    if(state.timeLeft % 5 === 0) saveState();
    const el = document.getElementById("timerDisplay");
    if(el){
      el.textContent = fmtTime(state.timeLeft);
      if(state.timeLeft <= 60) el.style.color = '#fca5a5';
    }
  }, 1000);

  setupExamProtection();
  renderExam();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function cancelExam(reason){
  if(state.cancelled || state.submitted || state.cancelling) return;
  state.cancelling = true;
  state.cancelled = true;
  clearInterval(state.timer);
  showExamBlockOverlay();
  removeExamProtection();
  await exitExamFullscreen();
  clearState();

  const reasonMap = {
    'exit-fullscreen': 'خرجت من وضع ملء الشاشة، فتم إلغاء الاختبار تلقائيًا.',
    'visibility-hidden': 'خرجت من الصفحة أو تصفحت تطبيق آخر، فتم إلغاء الاختبار تلقائيًا.',
    'user-closed': 'قمت بإلغاء الاختبار بنفسك.',
    'timeout': 'انتهى الوقت.'
  };
  const reasonText = reasonMap[reason] || 'تم إلغاء الاختبار لأسباب أمنية.';

  let durationSeconds = 0;
  try{
    const sb = await DB.getClient();
    const { data, error } = await sb.rpc('cancel_exam', {
      p_exam_id: state.exam.id,
      p_started_at: state.startedAt || Date.now(),
      p_reason: reason || 'unknown'
    });
    if(!error && data) durationSeconds = data.duration_seconds || 0;
    else durationSeconds = state.startedAt ? Math.max(0, Math.floor((Date.now() - state.startedAt)/1000)) : 0;
  }catch(e){
    durationSeconds = state.startedAt ? Math.max(0, Math.floor((Date.now() - state.startedAt)/1000)) : 0;
  }

  DB.logActivity(state.user.id, state.user.name, 'exam_cancelled', state.exam.title);

  setTimeout(()=>{ removeExamBlockOverlay(); }, 600);

  const durText = durationSeconds > 60
    ? `${Math.floor(durationSeconds/60)}د ${durationSeconds%60}ث`
    : `${durationSeconds} ث`;

  app.style.display = 'block';
  app.style.maxWidth = '760px';
  app.className = 'wrap';

  app.innerHTML = `
    <div class="fade-in">
      <div class="cancelled-shell">
        <div class="cancelled-content">
          <div class="cancelled-icon-wrap"><i class="fa-solid fa-ban"></i></div>
          <div class="cancelled-title">تم إلغاء الاختبار</div>
          <div class="cancelled-reason">${esc(reasonText)}</div>
          <div class="flex g12 wrap-fl" style="justify-content:center;margin-bottom:22px">
            <div class="pill pill-r" style="padding:8px 16px;font-size:13px"><i class="fa-solid fa-clock"></i> ${durText}</div>
            <div class="pill pill-y" style="padding:8px 16px;font-size:13px"><i class="fa-solid fa-xmark"></i> الحالة: ملغي</div>
          </div>
          <div class="cancelled-note">⛔ تم تسجيل هذه المحاولة كـ <b style="color:#fca5a5">ملغي</b> وسيراها الأدمن.</div>
          <a href="index.html" class="btn btn-p btn-lg" style="text-decoration:none;min-width:220px">
            <i class="fa-solid fa-arrow-right"></i> رجوع للرئيسية
          </a>
        </div>
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

async function submitExam(){
  if(state.submitted || state.cancelled || state.submitting) return;
  state.submitting = true;
  state.submitted = true;
  clearInterval(state.timer);
  removeExamProtection();
  await exitExamFullscreen();

  const total = state.questions.length;
  const answersPayload = {};
  for(let i=0; i<total; i++){
    if(state.answers[i] !== undefined) answersPayload[i] = state.answers[i];
  }

  try{
    const sb = await DB.getClient();
    const { data, error } = await sb.rpc('submit_exam', {
      p_exam_id: state.exam.id,
      p_answers: answersPayload,
      p_started_at: state.startedAt || Date.now()
    });

    if(error) throw new Error(error.message);

    clearState();

    state.result = {
      score: data.score,
      total: data.total,
      pct: data.pct,
      passed: data.passed,
      gained: data.gained,
      hasWonBefore: data.already_passed,
      durationSeconds: data.duration_seconds,
      questionResults: data.question_results || []
    };

    DB.logActivity(state.user.id, state.user.name, "exam_submit", state.exam.title);

    renderResult();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }catch(e){
    state.submitted = false;
    state.submitting = false;
    Swal.fire({
      icon: 'error',
      title: 'خطأ في التسليم',
      text: e.message || 'تعذر تسليم الاختبار. حاول مرة أخرى.',
      background: 'linear-gradient(180deg, #151f38, #0b1122)',
      color: '#e8eefc',
      confirmButtonColor: '#2f7dff',
      customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
    });
  }
}

async function load(){
  if(!examId){
    app.style.display = 'block';
    app.style.maxWidth = '760px';
    app.className = 'wrap';
    app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12">⚠️ لم يتم تحديد الاختبار</div><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
    return;
  }

  try {
    const sid = DB.getSessionId();
    if(!sid){ window.location.replace("/auth/login.html"); return; }
    const user = await DB.getUser(sid);
    if(!user || user.active === false){ DB.clearSession(); window.location.replace("/auth/login.html"); return; }
    state.user = user;
    if (userAvatar) userAvatar.textContent = user.avatar || "🧑‍🎓";

    const sb = await DB.getClient();
    const { data: exam, error } = await sb.from("exams").select("*").eq("id", examId).maybeSingle();
    if(error || !exam){
      app.style.display = 'block';
      app.style.maxWidth = '760px';
      app.className = 'wrap';
      app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12">⚠️ الاختبار غير موجود</div><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
      return;
    }
    state.exam = exam;
    state.hasAccess = hasAccess(user, exam);

    if(!state.hasAccess){
      app.style.display = 'block';
      app.style.maxWidth = '760px';
      app.className = 'wrap';
      renderLocked();
      return;
    }

    const qIds = Array.isArray(exam.question_ids) ? exam.question_ids : (typeof exam.question_ids === 'string' ? JSON.parse(exam.question_ids) : []);
    if(qIds.length === 0){
      app.style.display = 'block';
      app.style.maxWidth = '760px';
      app.className = 'wrap';
      app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12">⚠️ لا توجد أسئلة في الاختبار</div><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
      return;
    }

    let questions = [];
    try {
        const { data: qData, error: qErr } = await sb.from("questions_public").select("*").in("id", qIds);
        if (qErr) console.error("questions_public error:", qErr);
        if (qData && qData.length > 0) {
            questions = qData;
        } else {
            const { data: fbData, error: fbErr } = await sb.from("questions").select("id, text, options, subject_id, unit_id, lesson_id, xp, explanation").in("id", qIds);
            if (!fbErr && fbData) questions = fbData;
        }
    } catch (e) {
        console.error("Fetch questions error:", e);
    }

    const orderedQs = qIds.map(id => (questions||[]).find(q => q.id === id)).filter(Boolean);
    state.questions = orderedQs;

    if (state.questions.length === 0) {
        app.style.display = 'block';
        app.style.maxWidth = '760px';
        app.className = 'wrap';
        app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12" style="color:#fca5a5">⚠️ تعذر تحميل أسئلة الاختبار</div><p class="sm muted mb16">تأكد من وجود الأسئلة في بنك الأسئلة أو تواصل مع الإدارة.</p><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
        return;
    }

    const { data: attempts } = await sb.from("exam_attempts").select("*").eq("user_id", user.id).eq("exam_id", examId).order("at", {ascending:false});
    state.attempts = attempts || [];

    app.style.display = 'block';
    app.style.maxWidth = '760px';
    app.className = 'wrap';
    renderStart();

  } catch (err) {
      console.error(err);
      app.style.display = 'block';
      app.style.maxWidth = '760px';
      app.className = 'wrap';
      app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12" style="color:#fca5a5">⚠️ حدث خطأ غير متوقع</div><p class="sm muted mb16">${err.message}</p><a href="index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
  }
}

load();
