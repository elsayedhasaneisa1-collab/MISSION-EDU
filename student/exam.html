:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--gold:#fbbf24;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}

.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}

.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}

<script>
(function(){
"use strict";
const DB = window.MissionDB;
const params = new URLSearchParams(window.location.search);
const examId = params.get("id");
const app = document.getElementById("app");
const userAvatar = document.getElementById("userAvatar");
let state = {
user: null, exam: null, questions: [], attempts: [],
started: false, submitted: false, current: 0, answers: {},
timeLeft: 0, timer: null, result: null, hasAccess: false,
startedAt: null, cancelled: false,
fullscreenEntered: false, fullscreenActive: false,
visibilityHandler: null, blurHandler: null, keyHandler: null,
contextHandler: null, fsChangeHandler: null, beforeUnloadHandler: null
};
function esc(str){
return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
}
function fmtTime(s){
const m = Math.floor(s/60);
const sec = s%60;
return `${m}:${String(sec).padStart(2,"0")}`;
}
function buildRing(value, size, stroke, color){
const r = (size-stroke)/2;
const c = 2*Math.PI*r;
const off = c - (value/100)*c;
return `
<div class="ring" style="width:${size}px;height:${size}px">

};

async function submitExam(){
if(state.submitted || state.cancelled) return;

clearInterval(state.timer);
removeExamProtection();
await exitExamFullscreen();
let score = 0;
for(let i=0; i<state.questions.length; i++){
const q = state.questions[i];
const given = state.answers[i];
if(given === q.correct[0]){
score++;
} else {
try{
await DB.saveError({
userId: state.user.id,
questionId: q.id,
given: given ?? -1,
correct: q.correct[0],
lessonId: q.lesson_id
});
}catch(e){}
}
}
const total = state.questions.length;
const pct = Math.round((score/total)*100);
const passed = pct >= state.exam.pass_score;
const validAttempts = state.attempts.filter(a => a.status !== 'cancelled');
const hasWonBefore = validAttempts.some(a => a.passed);
const gained = (passed && !hasWonBefore) ? (state.exam.xp || 0) : 0;
const durationSeconds = state.startedAt ? Math.max(0, Math.floor((Date.now() - state.startedAt)/1000)) : 0;
try{
const sb = await DB.getClient();
await sb.from('exam_attempts').insert([{
id: DB.uid('att_'),
user_id: state.user.id,
exam_id: state.exam.id,
score, total, pct, passed,
answers: state.answers,
started_at: state.startedAt || Date.now(),
duration_seconds: durationSeconds,
status: passed ? 'passed' : 'failed',
at: Date.now(),
created_at: Date.now()
}]);
}catch(e){console.warn('Save attempt error:', e);}
if(gained > 0){
try{
const sb = await DB.getClient();
const { data: userRow } = await sb.from('users').select('xp').eq('id', state.user.id).maybeSingle();
const curXp = Number(userRow?.xp)||0;
await DB.updateUser(state.user.id, { xp: curXp + gained });
}catch(e){}
}
DB.trackActivity({
userId: state.user.id, userName: state.user.name,
type: "exam_submit", target: state.exam.title,
details: { score, total, pct, passed, gained, repeat: hasWonBefore, duration: durationSeconds, status: passed ? 'passed' : 'failed' }
});
state.result = { score, total, pct, passed, gained, hasWonBefore, durationSeconds };
renderResult();
}

let xpMessage = '';
if (r.passed && !r.hasWonBefore && r.gained > 0){
xpMessage = `<div class="xp-box" style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#6ee7a0">⚡ +${r.gained} XP مكافأة</div>`;
} else if (r.passed && r.hasWonBefore){
xpMessage = `<div class="xp-box" style="background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#c4b5fd">🔁 محاولة إعادة — لا XP إضافي</div>`;
} else if (!r.passed){
xpMessage = `<div class="xp-box" style="background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fcd34d">💪 لم تنجح — حاول مرة أخرى</div>`;
}
app.innerHTML = `
<div class="fade-in">
<div class="glass mb16" style="padding:32px 24px;text-align:center">
<div style="font-size:72px;margin-bottom:12px">${r.passed ? '🎉' : '💪'}</div>
<div class="h1 mb8">${r.passed ? 'أحسنت!' : 'حاول مرة أخرى'}</div>
<div class="sm muted mb20">حصلت على ${r.score} من ${r.total}</div>
${buildRing(r.pct, 140, 10, color)}
${xpMessage}
<div class="pill ${r.passed?'pill-g':'pill-r'}" style="margin-top:16px;padding:6px 16px;font-size:12.5px">
${r.passed ? '✓ ناجح' : '✗ راسب'}
</div>
</div>
<div class="h3 mb12">📋 مراجعة الإجابات</div>
${state.questions.map((q,i) => {
const given = state.answers[i];
const correct = given === q.correct[0];
return `
<div class="glass mb12" style="padding:16px">
<div class="flex between center mb8">
<span class="pill ${correct ? 'pill-g' : 'pill-r'}">${correct ? '✓ صحيح' : '✗ خطأ'}</span>
<span class="xs muted">سؤال ${i+1}</span>
</div>
<div class="h4 mb12">${esc(q.text)}</div>
<div class="flex col g6 mb12">
${(q.options||[]).map((op,oi) => {
const isGiven = given === oi;
const isCorrect = q.correct[0] === oi;
let cls = '';
if(isCorrect) cls = 'ok';
else if(isGiven) cls = 'bad';
return `
<div class="opt ${cls}" style="cursor:default">
<div class="opt-l">${['أ','ب','ج','د','هـ'][oi]}</div>
<div>${esc(op)}</div>
</div>
`;
}).join('')}
</div>
<div class="glass-s" style="padding:10px">
<div class="xs muted mb6"><b style="color:var(--blue2)">💡 الشرح:</b> ${esc(q.explanation || '')}</div>
</div>
</div>
`;
}).join('')}
<div class="flex g8 mt16">
<a href="/student/index.html" class="btn btn-p btn-block" style="text-decoration:none">🏠 العودة للرئيسية</a>
</div>
</div>
`;
window.scrollTo({top: 0, behavior: 'smooth'});
}
async function load(){
if(!examId){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ لم يتم تحديد الاختبار</div>
<a href="/student/index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}
const sid = DB.getSessionId();
if(!sid){ window.location.replace("/auth/login.html"); return; }
const user = await DB.getUser(sid);
if(!user || user.active === false){ DB.clearSession(); window.location.replace("/auth/login.html"); return; }
state.user = user;
userAvatar.textContent = user.avatar || "🧑‍🎓";
const sb = await DB.getClient();
const { data: exam, error } = await sb.from("exams").select("*").eq("id", examId).maybeSingle();
if(error || !exam){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ الاختبار غير موجود</div>
<a href="/student/index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}
state.exam = exam;
state.hasAccess = hasAccess(user, exam);
if(!state.hasAccess){
renderLocked();
return;
}
const qIds = exam.question_ids || [];
if(qIds.length === 0){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ لا توجد أسئلة في الاختبار</div>
<a href="/student/index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}
const { data: questions } = await sb.from("questions").select("*").in("id", qIds);
const orderedQs = qIds.map(id => (questions||[]).find(q => q.id === id)).filter(Boolean);
state.questions = orderedQs;
const { data: attempts } = await sb.from("exam_attempts").select("*").eq("user_id", user.id).eq("exam_id", examId).order("at", {ascending:false});
state.attempts = attempts || [];
renderStart();
}
window.openWhatsApp = ()=>{
window.open("https://wa.me/201128351702?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
};
window.sendReport = async ()=>{
const { value: msg } = await Swal.fire({
title: '🚨 بلاغ عن مشكلة',
input: 'textarea',
inputPlaceholder: 'اكتب رسالتك هنا...',
showCancelButton: true,
confirmButtonText: '📤 إرسال',
cancelButtonText: 'إلغاء',
confirmButtonColor: '#2f7dff',
cancelButtonColor: '#64748b',
inputValidator: v => { if(!v || v.trim().length < 5) return 'يرجى كتابة رسالة واضحة'; },
customClass: {popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}
});
if(msg){
const u = state.user;
const sent = await DB.reportIssue({
userName: u?.name || 'زائر',
userPhone: (u?.country_code||'+20')+(u?.phone||'—'),
message: msg
});
Swal.fire({
icon: sent?'success':'error',
title: sent?'✅ تم الإرسال':'❌ فشل',
text: sent?'شكرًا لك':'حاول مرة أخرى',
confirmButtonColor:'#2f7dff',
customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
});
}
};
load();
})();
</script>
</body>
</html>
