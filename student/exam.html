<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0e17" />
<title>الاختبار | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{--bg:#0a0e17;--panel:#111827;--border:#1f2937;--border2:#374151;--txt:#f3f4f6;--txt2:#9ca3af;--muted:#6b7280;--blue:#2f7dff;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--r:16px;--rs:12px;--sh:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(10,14,23,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--txt2);font-size:14px;font-weight:700;text-decoration:none;}
.back-btn:hover{background:var(--border);color:var(--txt)}

.exam-layout{display:flex;min-height:calc(100vh - 60px);position:relative;max-width:1400px;margin:0 auto}
.sidebar{width:320px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.main-content{flex:1;padding:30px;display:flex;flex-direction:column}

.timer-box{display:flex;align-items:center;justify-content:space-between;background:var(--bg);padding:15px;border-radius:var(--rs);border:1px solid var(--border)}
.timer-val{font-size:32px;font-weight:900;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer-label{font-size:13px;color:var(--txt2);font-weight:700}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--bg);padding:12px;border-radius:var(--rs);text-align:center;border:1px solid var(--border)}
.stat-box .val{font-size:20px;font-weight:900}
.stat-box .lbl{font-size:11px;color:var(--txt2)}
.stat-box.ans .val{color:var(--blue)}
.stat-box.wrg .val{color:var(--red)}
.stat-box.rem .val{color:var(--muted)}

.controls-box{display:flex;flex-direction:column;gap:8px}
.btn-ctrl{padding:12px;border-radius:var(--rs);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;border:none;cursor:pointer;}
.btn-continue{background:var(--green);color:#fff}
.btn-continue:hover{background:#059669}
.btn-review{background:var(--blue);color:#fff}
.btn-review:hover{background:#1d4ed8}
.btn-end{background:var(--red);color:#fff}
.btn-end:hover{background:#b91c1c}

.grid-section{border-top:1px solid var(--border);padding-top:15px}
.grid-title{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}
.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q-btn{padding:10px 0;border-radius:8px;font-weight:800;font-size:14px;text-align:center;background:var(--bg);border:1px solid var(--border2);color:var(--muted);transition:.2s;cursor:pointer}
.q-btn.answered{background:rgba(47,125,255,.15);border-color:var(--blue);color:var(--blue)}
.q-btn.visited{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.q-btn.current{box-shadow:0 0 0 2px var(--txt);transform:scale(1.05)}
.q-btn:hover{background:var(--border)}

.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-top:15px;flex-wrap:wrap;gap:5px;}
.leg-item{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.dot-blue{background:var(--blue)}
.dot-red{background:var(--red)}
.dot-gray{background:var(--muted)}

.sidebar-nav{display:flex;gap:10px;margin-top:auto}
.sidebar-nav button{flex:1;padding:12px;border-radius:var(--rs);background:var(--bg);border:1px solid var(--border2);font-weight:800;color:var(--txt);transition:.2s}
.sidebar-nav button:hover:not(:disabled){background:var(--border);border-color:var(--txt2)}
.sidebar-nav button:disabled{opacity:.5;cursor:not-allowed}

.question-area{flex:1;display:flex;flex-direction:column;background:var(--panel);border-radius:var(--r);border:1px solid var(--border);padding:40px;position:relative}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.q-num-badge{width:40px;height:40px;border-radius:50%;background:rgba(47,125,255,.15);color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:18px}
.q-points{background:var(--bg);border:1px solid var(--border);padding:6px 16px;border-radius:20px;font-weight:800;font-size:13px;color:var(--green)}
.q-text{font-size:24px;font-weight:800;line-height:1.6;margin-bottom:40px;color:var(--txt)}

.options{display:flex;flex-direction:column;gap:15px}
.opt{display:flex;align-items:center;gap:15px;padding:18px 20px;background:var(--bg);border:1.5px solid var(--border2);border-radius:var(--rs);cursor:pointer;transition:.2s;font-size:18px;font-weight:700;color:var(--txt)}
.opt:hover{background:rgba(255,255,255,.03);border-color:var(--txt2)}
.opt.selected{border-color:var(--blue);background:rgba(47,125,255,.08);box-shadow:0 0 0 1px var(--blue)}
.opt-letter{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--txt2);flex-shrink:0;transition:.2s}
.opt.selected .opt-letter{border-color:var(--blue);background:var(--blue);color:#fff}

.q-actions{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:30px}
.show-img-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;background:rgba(47,125,255,.1);color:var(--blue);font-weight:800;border:1px solid rgba(47,125,255,.3);cursor:pointer;}
.show-img-btn:hover{background:rgba(47,125,255,.2)}

.float-help{position:fixed;bottom:30px;left:30px;width:50px;height:50px;border-radius:50%;background:var(--panel);border:1px solid var(--border2);display:grid;place-items:center;font-size:20px;color:var(--txt);box-shadow:var(--sh);cursor:pointer;z-index:100}
.float-help:hover{background:var(--border)}

.modal-img-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:9999;display:none;place-items:center;padding:20px}
.modal-img-bg.on{display:grid}
.modal-img-box{position:relative;max-width:90vw;max-height:90vh}
.modal-img-box img{max-width:100%;max-height:90vh;border-radius:12px;border:2px solid var(--border2);pointer-events:none}
.close-img{position:absolute;top:-15px;right:-15px;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5)}

.spinner {width: 40px; height: 40px; border: 3px solid var(--border2); border-top-color: var(--blue); border-radius: 50%; animation: sp 1s linear infinite;}
@keyframes sp { to { transform: rotate(360deg); } }
.glass {background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);}

@media(max-width:900px){
  .exam-layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-left:none;border-bottom:1px solid var(--border);padding:15px}
  .main-content{padding:15px}
  .question-area{padding:20px}
  .q-text{font-size:20px;margin-bottom:20px}
  .opt{font-size:16px;padding:14px}
  .timer-val{font-size:26px}
  .q-grid{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/student/index.html" class="back-btn" id="backBtn">
    <i class="fa-solid fa-arrow-right"></i> رجوع
  </a>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-weight:800;font-size:14px" id="examTitleHeader">الاختبار</span>
    <div style="width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;font-size:14px" id="userAvatar">👤</div>
  </div>
</div>

<div id="app" class="exam-layout" style="display:grid;place-items:center;">
  <div class="spinner" style="margin:50px auto;"></div>
</div>

<div class="modal-img-bg" id="imgModal">
  <div class="modal-img-box">
    <button class="close-img" onclick="document.getElementById('imgModal').classList.remove('on')">✕</button>
    <img id="modalImgSrc" src="" alt="صورة السؤال" />
  </div>
</div>

<div class="float-help" id="helpBtn" style="display:none" title="المساعدة">
  <i class="fa-solid fa-comment-dots"></i>
</div>

<script src="/db.js"></script>
<script>
(function(){
"use strict";
const DB = window.MissionDB;
const params = new URLSearchParams(window.location.search);
const examId = params.get("id");
const app = document.getElementById("app");
const userAvatar = document.getElementById("userAvatar");

let state = {
  user: null, exam: null, questions: [], attempts: [], started: false, submitted: false,
  current: 0, answers: {}, visited: {}, timeLeft: 0, timer: null, result: null, hasAccess: false,
  startedAt: null, cancelled: false, fullscreenEntered: false,
  fsChangeHandler: null, visibilityHandler: null, blurHandler: null, keyHandler: null, contextHandler: null, beforeUnloadHandler: null
};

function esc(str){ return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]); }
function fmtTime(s){ const m = Math.floor(s/60); const sec = s%60; return `${m}:${String(sec).padStart(2,"0")}`; }

function showError(msg) {
  app.innerHTML = `<div class="glass" style="padding:40px;text-align:center;margin:20px"><div style="font-size:20px;font-weight:800;margin-bottom:12px">${msg}</div><a href="/student/index.html" style="display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;">العودة للرئيسية</a></div>`;
}

function renderStart() {
  const e = state.exam;
  const attempts = state.attempts.filter(a => a.status !== 'cancelled');
  const canTry = attempts.length < (e.max_attempts || 99);
  const hasWon = attempts.some(a => a.passed);
  
  app.style.display = 'grid';
  app.innerHTML = `
    <div class="glass" style="padding:40px;max-width:500px;text-align:center;margin:20px;">
      <div style="font-size:64px;margin-bottom:20px">📝</div>
      <h1 style="font-size:24px;font-weight:900;margin-bottom:10px">${esc(e.title)}</h1>
      <p style="color:var(--txt2);margin-bottom:20px">اقرأ التعليمات جيداً قبل البدء</p>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:30px;">
        <div style="background:var(--bg);padding:15px;border-radius:12px;border:1px solid var(--border)">
          <div style="font-size:12px;color:var(--txt2)">الأسئلة</div>
          <div style="font-size:20px;font-weight:900">${(e.question_ids||[]).length}</div>
        </div>
        <div style="background:var(--bg);padding:15px;border-radius:12px;border:1px solid var(--border)">
          <div style="font-size:12px;color:var(--txt2)">المدة</div>
          <div style="font-size:20px;font-weight:900">${e.duration} دقيقة</div>
        </div>
      </div>
      
      ${hasWon ? '<div style="color:var(--green);font-weight:800;margin-bottom:20px">✅ لقد نجحت في هذا الاختبار مسبقاً</div>' : ''}
      ${!canTry && !hasWon ? '<div style="color:var(--red);font-weight:800;margin-bottom:20px">🚫 لقد استنفدت جميع المحاولات</div>' : ''}

      ${(canTry && !hasWon) ? `<button class="btn-ctrl btn-continue" style="width:100%;font-size:16px;padding:15px" id="btnStart">▶️ بدء الاختبار</button>` : ''}
    </div>
  `;

  const btn = document.getElementById("btnStart");
  if(btn) {
    btn.addEventListener("click", () => {
      Swal.fire({
        title: '⚠️ هل أنت مستعد؟',
        text: 'بمجرد الضغط على "ابدأ الآن"، سيبدأ المؤقت ولن تتمكن من الخروج.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'نعم، ابدأ الآن',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#2f7dff',
        cancelButtonColor: '#64748b',
        background: '#111827', color: '#f3f4f6'
      }).then((result) => {
        if(result.isConfirmed) startExam();
      });
    });
  }
}

function renderExam() {
  app.style.display = 'flex';
  const q = state.questions[state.current];
  const total = state.questions.length;
  
  let answeredCount = 0;
  for(let i=0; i<total; i++) { if(state.answers[i] !== undefined) answeredCount++; }
  const remainingCount = total - answeredCount;
  
  let correctCount = 0;
  let wrongCount = 0;
  for(let i=0; i<total; i++) {
    if(state.answers[i] !== undefined) {
      if(state.answers[i] === state.questions[i].correct[0]) correctCount++;
      else wrongCount++;
    }
  }

  let gridHtml = '';
  for(let i=0; i<total; i++) {
    let cls = 'q-btn';
    if(state.answers[i] !== undefined) {
       cls += ' answered';
    } else if (state.visited[i]) {
       cls += ' visited';
    }
    if(i === state.current) cls += ' current';
    
    gridHtml += `<button class="${cls}" onclick="window.jumpTo(${i})">${i+1}</button>`;
  }

  app.innerHTML = `
    <aside class="sidebar">
      <div class="timer-box">
        <div>
          <div class="timer-label">الوقت المتبقي</div>
          <div class="timer-val" id="timerDisplay">${fmtTime(state.timeLeft)}</div>
        </div>
        <i class="fa-solid fa-hourglass-half" style="font-size:24px;color:var(--amber)"></i>
      </div>
      
      <div class="stats-grid">
        <div class="stat-box ans"><div class="val">${answeredCount}</div><div class="lbl">تمت الإجابة</div></div>
        <div class="stat-box wrg"><div class="val">${wrongCount}</div><div class="lbl">خطأ</div></div>
        <div class="stat-box rem"><div class="val">${remainingCount}</div><div class="lbl">متبقي</div></div>
      </div>

      <div class="controls-box">
        <button class="btn-ctrl btn-continue"><i class="fa-solid fa-arrow-left"></i> استكمال</button>
        <button class="btn-ctrl btn-review"><i class="fa-solid fa-list-check"></i> مراجعة</button>
        <button class="btn-ctrl btn-end" onclick="window.finishExam()"><i class="fa-solid fa-flag-checkered"></i> إنهاء الاختبار</button>
      </div>

      <div class="grid-section">
        <div class="grid-title">
          <span>الأسئلة</span>
          <span style="color:var(--muted)">${answeredCount}/${total}</span>
        </div>
        <div class="q-grid">${gridHtml}</div>
        <div class="legend">
          <div class="leg-item"><span class="dot dot-blue"></span> تم الحل</div>
          <div class="leg-item"><span class="dot dot-red"></span> مفتوح</div>
          <div class="leg-item"><span class="dot dot-gray"></span> متبقي</div>
        </div>
      </div>

      <div class="sidebar-nav">
        <button ${state.current===0?'disabled':''} onclick="window.jumpTo(${state.current-1})">السابق</button>
        <button ${state.current===total-1?'disabled':''} onclick="window.jumpTo(${state.current+1})">التالي</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="question-area">
        <div class="q-header">
          <div class="q-num-badge">${state.current+1}</div>
          <div class="q-points">درجة واحدة</div>
        </div>
        
        <div class="q-text">${esc(q.text)}</div>
        
        <div class="options">
          ${(q.options||[]).map((opt, oi) => {
            const isSel = state.answers[state.current] === oi;
            return `
              <div class="opt ${isSel ? 'selected' : ''}" onclick="window.selectOpt(${oi})">
                <div class="opt-letter">${['أ','ب','ج','د'][oi]}</div>
                <div>${esc(opt)}</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="q-actions">
          ${q.image_url ? `<button class="show-img-btn" onclick="window.showImg('${q.image_url}')"><i class="fa-solid fa-image"></i> عرض الصورة</button>` : '<div></div>'}
        </div>
      </div>
    </main>
  `;
}

window.jumpTo = (idx) => { 
  state.current = idx; 
  state.visited[idx] = true;
  renderExam(); 
};
window.selectOpt = (oi) => { 
  state.answers[state.current] = oi; 
  state.visited[state.current] = true;
  renderExam(); 
};
window.showImg = (url) => { document.getElementById('modalImgSrc').src = url; document.getElementById('imgModal').classList.add('on'); };
window.finishExam = () => {
  Swal.fire({
    title: 'إنهاء الاختبار؟',
    text: 'هل أنت متأكد من إنهاء وتسليم الاختبار الآن؟',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'نعم، سلم',
    cancelButtonText: 'إلغاء',
    confirmButtonColor: '#10b981',
    cancelButtonColor: '#ef4444',
    background: '#111827', color: '#f3f4f6'
  }).then(r => { if(r.isConfirmed) submitExam(); });
};

function startExam() {
  state.started = true;
  state.timeLeft = state.exam.duration * 60;
  state.startedAt = Date.now();
  state.answers = {};
  state.visited = { 0: true };
  state.current = 0;
  
  document.getElementById('helpBtn').style.display = 'grid';
  
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.timeLeft--;
    const t = document.getElementById('timerDisplay');
    if(t) { t.textContent = fmtTime(state.timeLeft); if(state.timeLeft <= 60) t.style.color = '#ef4444'; }
    if(state.timeLeft <= 0) { clearInterval(state.timer); submitExam(); }
  }, 1000);

  setupExamProtection();
  renderExam();
}

async function submitExam() {
  if(state.submitted) return;
  state.submitted = true;
  clearInterval(state.timer);
  removeExamProtection();
  await exitExamFullscreen();
  
  app.style.display = 'grid';
  app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="spinner" style="margin:0 auto 20px"></div><h2>جارٍ تسليم الإجابات...</h2></div>`;

  let score = 0;
  for(let i=0; i<state.questions.length; i++) {
    if(state.answers[i] === state.questions[i].correct[0]) score++;
  }
  
  const total = state.questions.length;
  const pct = Math.round((score/total)*100);
  const passed = pct >= state.exam.pass_score;
  const durationSeconds = state.startedAt ? Math.floor((Date.now() - state.startedAt)/1000) : 0;
  
  try {
    const sb = await DB.getClient();
    await sb.from('exam_attempts').insert([{
      id: DB.uid('att_'), user_id: state.user.id, exam_id: state.exam.id,
      score, total, pct, passed, answers: state.answers, started_at: state.startedAt,
      duration_seconds: durationSeconds, status: passed ? 'passed' : 'failed', at: Date.now(), created_at: Date.now()
    }]);
    if(passed) {
      const { data: u } = await sb.from('users').select('xp').eq('id', state.user.id).maybeSingle();
      await DB.updateUser(state.user.id, { xp: (u?.xp || 0) + (state.exam.xp || 0) });
    }
  } catch(e) {}

  setTimeout(() => {
    app.innerHTML = `
      <div class="glass" style="padding:40px;text-align:center;max-width:400px;">
        <div style="font-size:64px;margin-bottom:20px">${passed?'🎉':'💪'}</div>
        <h2 style="font-size:28px;font-weight:900;color:${passed?'var(--green)':'var(--red)'};margin-bottom:10px">${passed?'مبروك النجاح!':'حاول مرة أخرى'}</h2>
        <div style="font-size:20px;font-weight:800;margin-bottom:20px">${score} / ${total} (${pct}%)</div>
        ${passed?`<div style="color:var(--green);font-weight:800;margin-bottom:20px">+${state.exam.xp} XP</div>`:''}
        <a href="/student/index.html" class="btn-ctrl btn-continue" style="display:block;text-decoration:none;">العودة للرئيسية</a>
      </div>
    `;
    if(passed && window.confetti) window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
  }, 1000);
}

function setupExamProtection() {
  document.body.classList.add('exam-active');
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  
  document.documentElement.requestFullscreen().catch(()=>{});
  state.fullscreenEntered = true;

  state.fsChangeHandler = () => { if(!document.fullscreenElement && state.started) cancelExam('exit-fs'); };
  document.addEventListener('fullscreenchange', state.fsChangeHandler);

  state.visibilityHandler = () => { if(document.hidden && state.started) cancelExam('hidden'); };
  document.addEventListener('visibilitychange', state.visibilityHandler);
}

function removeExamProtection() {
  document.body.classList.remove('exam-active');
  if(state.fsChangeHandler) document.removeEventListener('fullscreenchange', state.fsChangeHandler);
  if(state.visibilityHandler) document.removeEventListener('visibilitychange', state.visibilityHandler);
}

async function exitExamFullscreen() {
  if(document.fullscreenElement) await document.exitFullscreen().catch(()=>{});
}

function cancelExam(reason) {
  if(state.submitted) return;
  state.submitted = true;
  clearInterval(state.timer);
  removeExamProtection();
  exitExamFullscreen();
  app.style.display = 'grid';
  app.innerHTML = `
    <div class="glass" style="padding:40px;text-align:center;max-width:400px;border-color:var(--red)">
      <div style="font-size:64px;margin-bottom:20px">⛔</div>
      <h2 style="font-size:24px;font-weight:900;color:var(--red);margin-bottom:10px">تم إلغاء الاختبار</h2>
      <p style="color:var(--txt2);margin-bottom:20px">لقد خرجت من وضع ملء الشاشة أو غادرت الصفحة، فتم إلغاء المحاولة تلقائياً.</p>
      <a href="/student/index.html" class="btn-ctrl btn-end" style="display:block;text-decoration:none;">رجوع للرئيسية</a>
    </div>
  `;
}

async function load() {
  if(!examId) return showError('لم يتم تحديد الاختبار');
  
  const sid = DB.getSessionId();
  if(!sid || sid === 'guest') { window.location.replace("/auth/login.html"); return; }
  const user = await DB.getUser(sid);
  if(!user || user.active === false || user.banned === true) { DB.clearSession(); window.location.replace("/auth/login.html"); return; }
  
  state.user = user;
  userAvatar.textContent = user.avatar || "🧑‍🎓";
  
  const sb = await DB.getClient();
  const { data: exam } = await sb.from("exams").select("*").eq("id", examId).maybeSingle();
  if(!exam) return showError('الاختبار غير موجود');
  
  state.exam = exam;
  document.getElementById('examTitleHeader').textContent = exam.title;

  const qIds = exam.question_ids || [];
  if(qIds.length === 0) return showError('لا توجد أسئلة في الاختبار');

  const { data: questions } = await sb.from("questions").select("*").in("id", qIds);
  state.questions = qIds.map(id => (questions||[]).find(q => q.id === id)).filter(Boolean);

  const { data: attempts } = await sb.from("exam_attempts").select("*").eq("user_id", user.id).eq("exam_id", examId).order("at", {ascending:false});
  state.attempts = attempts || [];

  renderStart();
}

document.getElementById('helpBtn').onclick = () => {
  Swal.fire({
    title: 'الدعم الفني',
    text: 'هل تواجه مشكلة في الاختبار؟',
    icon: 'info',
    showCancelButton: true,
    confirmButtonText: 'تواصل واتساب',
    cancelButtonText: 'إغلاق',
    confirmButtonColor: '#22c55e',
    background: '#111827', color: '#f3f4f6'
  }).then(r => {
    if(r.isConfirmed) window.open("https://wa.me/201128351702", "_blank");
  });
};

load();
})();
</script>
