<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ملف الشرح | MISSION EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; font-family: 'Cairo', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  
  header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0) 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
  header .title { font-size: 15px; font-weight: 700; pointer-events: auto; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
  header .badge { background: rgba(47,125,255,0.2); border: 1px solid rgba(47,125,255,0.4); color: #7db6ff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
  header .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .pdf-wrapper { position: absolute; inset: 0; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; padding: 80px 10px 40px; background: #111827; }
  .pdf-wrapper::-webkit-scrollbar { width: 8px; }
  .pdf-wrapper::-webkit-scrollbar-track { background: #0a0e17; }
  .pdf-wrapper::-webkit-scrollbar-thumb { background: #2f7dff; border-radius: 10px; }
  
  .page-container { position: relative; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); background: #fff; border-radius: 8px; overflow: hidden; }
  .page-container canvas { display: block; width: 100%; height: auto; }

  .watermark-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; overflow: hidden; }
  .watermark-text { color: rgba(47,125,255,0.15); font-size: clamp(20px, 4vw, 40px); font-weight: 900; transform: rotate(-30deg); white-space: nowrap; user-select: none; text-shadow: 0 0 2px rgba(255,255,255,0.5); letter-spacing: 2px; }

  .loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0e17; z-index: 200; transition: opacity 0.5s; }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(47,125,255,0.2); border-top-color: #2f7dff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,20,30,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 30px; display: flex; align-items: center; gap: 16px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .controls span { font-size: 13px; font-weight: 700; color: #b7c6e4; }
  .ctrl-btn { background: rgba(47,125,255,0.2); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: 0.2s; }
  .ctrl-btn:hover { background: rgba(47,125,255,0.4); transform: scale(1.05); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div style="font-size:14px;font-weight:600;color:#7db6ff" id="loadText">جارٍ تحميل الملف...</div>
</div>

<header>
  <div class="title" id="pdfTitle">ملف الشرح</div>
  <div class="badge">محمي</div>
</header>

<div class="pdf-wrapper" id="pdfWrapper"></div>

<div class="controls" id="controls" style="display:none;">
  <button class="ctrl-btn" id="prevBtn" aria-label="السابق">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <span id="pageNum">1</span>
  <span style="opacity:0.5">/</span>
  <span id="pageCount">0</span>
  <button class="ctrl-btn" id="nextBtn" aria-label="التالي">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<script>
(function(){
  "use strict";

  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('url');
  const title = params.get('title') || 'ملف الشرح';
  const userPhone = params.get('wm') || 'طالب';

  document.title = title + ' | MISSION EDU';
  document.getElementById('pdfTitle').textContent = title;

  const wrapper = document.getElementById('pdfWrapper');
  const loader = document.getElementById('loader');
  const loadText = document.getElementById('loadText');
  const controls = document.getElementById('controls');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageNum = document.getElementById('pageNum');
  const pageCount = document.getElementById('pageCount');

  if (!pdfUrl) {
    loader.innerHTML = '<div style="color:#fca5a5;font-size:14px;font-weight:700;">رابط الملف غير موجود.</div>';
    return;
  }

  if (typeof pdfjsLib === 'undefined') {
    loader.innerHTML = '<div style="color:#fca5a5;font-size:14px;font-weight:700;">فشل تحميل مكتبة العارض. تأكد من اتصالك بالإنترنت.</div>';
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  let pdfDoc = null;
  let currentPage = 1;
  const scale = 1.5;

  pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise.then((pdf) => {
    pdfDoc = pdf;
    pageCount.textContent = pdf.numPages;
    controls.style.display = 'flex';
    loader.classList.add('hidden');
    renderPage(1);
  }).catch((err) => {
    console.error(err);
    loader.innerHTML = '<div style="color:#fca5a5;font-size:14px;font-weight:700;text-align:center;padding:20px;">تعذر تحميل الملف.<br><br>تأكد أن الرابط مباشر وينتهي بـ .pdf<br>أو أن الملف متاح للجميع.</div>';
  });

  async function renderPage(num) {
    try {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: scale });
      
      wrapper.innerHTML = ''; 
      
      const container = document.createElement('div');
      container.className = 'page-container';
      container.style.width = viewport.width + 'px';
      container.style.maxWidth = '100%';

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const outputScale = window.devicePixelRatio || 1;
      
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

      const renderContext = { canvasContext: context, transform: transform, viewport: viewport };
      await page.render(renderContext).promise;

      const wmLayer = document.createElement('div');
      wmLayer.className = 'watermark-layer';
      
      const wm1 = document.createElement('div');
      wm1.className = 'watermark-text';
      wm1.textContent = userPhone;
      
      const wm2 = document.createElement('div');
      wm2.className = 'watermark-text';
      wm2.textContent = 'MISSION EDU';
      
      const wm3 = document.createElement('div');
      wm3.className = 'watermark-text';
      wm3.textContent = userPhone;

      wmLayer.appendChild(wm1);
      wmLayer.appendChild(wm2);
      wmLayer.appendChild(wm3);

      container.appendChild(canvas);
      container.appendChild(wmLayer);
      wrapper.appendChild(container);

      pageNum.textContent = num;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;

    } catch (error) {
      console.warn("Error rendering page:", error);
    }
  }

  prevBtn.addEventListener('click', () => { if (currentPage <= 1) return; currentPage--; renderPage(currentPage); });
  nextBtn.addEventListener('click', () => { if (currentPage >= pdfDoc.numPages) return; currentPage++; renderPage(currentPage); });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['S','P','U'].includes(e.key.toUpperCase()))) {
      e.preventDefault(); return false;
    }
  });
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
})();
</script>
</body>
</html>
