<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ملف الشرح | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e17;font-family:'Tajawal','Cairo',sans-serif;color:#e8eefc;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column}

/* ==== LOADER ==== */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),#0a0e17;z-index:200;transition:opacity .4s}
.loader.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:3px solid rgba(47,125,255,.2);border-top-color:#2f7dff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:14px;font-weight:600;color:#7db6ff;text-align:center;padding:0 20px}
.loader-error{color:#fca5a5;font-weight:800;font-size:15px;text-align:center;padding:20px;line-height:1.7}
.loader-error small{display:block;color:#7f93b8;font-weight:500;font-size:12px;margin-top:10px}

/* ==== HEADER ==== */
header{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(180deg,rgba(10,14,23,.98) 0%,rgba(10,14,23,.75) 60%,rgba(10,14,23,0) 100%);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;pointer-events:none;gap:12px}
.header-left{display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:0;flex:1}
.back-btn{width:38px;height:38px;border-radius:12px;background:rgba(47,125,255,.15);border:1px solid rgba(47,125,255,.4);color:#7db6ff;display:grid;place-items:center;cursor:pointer;transition:.2s;flex-shrink:0}
.back-btn:hover{background:rgba(47,125,255,.3);color:#fff}
.header-title{font-size:14.5px;font-weight:800;color:#e8eefc;text-shadow:0 2px 4px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#6ee7a0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;pointer-events:auto;flex-shrink:0}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ==== PDF AREA ==== */
.pdf-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:74px 12px 84px;position:relative}
.page-container{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.85);background:#fff;border-radius:6px;overflow:hidden;display:flex;justify-content:center;align-items:center;max-width:100%;max-height:100%;transition:opacity .2s}
.page-container.loading-page{opacity:.4}
.page-container canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}

/* ==== WATERMARK LAYER (CSS overlay) ==== */
.wm-layer{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;overflow:hidden;mix-blend-mode:multiply}
.wm-text{color:rgba(255,60,60,.14);font-size:clamp(18px,4.5vw,42px);font-weight:900;transform:rotate(-28deg);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15);letter-spacing:2px;font-family:'Cairo',sans-serif}

/* ==== CONTROLS ==== */
.controls{position:absolute;bottom:0;left:0;right:0;height:76px;background:linear-gradient(0deg,rgba(10,14,23,.98) 0%,rgba(10,14,23,.75) 60%,rgba(10,14,23,0) 100%);display:flex;align-items:center;justify-content:center;gap:14px;z-index:100;padding-bottom:14px}
.ctrl-btn{width:44px;height:44px;border-radius:50%;background:rgba(47,125,255,.15);border:1px solid rgba(47,125,255,.4);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.ctrl-btn:hover:not(:disabled){background:rgba(47,125,255,.35);transform:scale(1.06)}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
.ctrl-btn svg{width:22px;height:22px}
.page-info{font-size:15px;font-weight:800;color:#b7c6e4;min-width:110px;text-align:center;padding:6px 12px;background:rgba(0,0,0,.35);border-radius:20px;border:1px solid rgba(90,140,230,.2)}

/* ==== ZOOM ==== */
.zoom-wrap{display:flex;align-items:center;gap:6px;position:absolute;bottom:20px;left:16px;z-index:100;background:rgba(10,14,23,.85);border:1px solid rgba(90,140,230,.3);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
.zoom-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:#b7c6e4;cursor:pointer;font-size:16px;font-weight:800;transition:.2s;display:grid;place-items:center}
.zoom-btn:hover{background:rgba(47,125,255,.2);color:#fff}
.zoom-level{font-size:11px;font-weight:700;color:#7db6ff;min-width:42px;text-align:center;font-family:monospace}

/* ==== TOAST ==== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);background:rgba(10,14,23,.95);border:1px solid rgba(47,125,255,.5);color:#e8eefc;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ==== MOBILE ==== */
@media(max-width:640px){
  header{height:56px;padding:0 10px}
  .header-title{font-size:12.5px}
  .badge{padding:4px 10px;font-size:10px}
  .back-btn{width:34px;height:34px}
  .controls{height:66px;gap:10px}
  .ctrl-btn{width:40px;height:40px}
  .ctrl-btn svg{width:20px;height:20px}
  .page-info{font-size:13px;min-width:90px}
  .pdf-area{padding:64px 6px 76px}
  .zoom-wrap{bottom:14px;left:8px}
  .zoom-btn{width:28px;height:28px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-text" id="loadText">جارٍ التحقق من الهوية...</div>
</div>

<header>
  <div class="header-left">
    <button class="back-btn" id="btnBack" aria-label="رجوع" title="رجوع">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <div class="header-title" id="pdfTitle">ملف الشرح</div>
  </div>
  <div class="badge">محمي</div>
</header>

<div class="pdf-area" id="pdfArea">
  <div class="page-container" id="pageContainer"></div>
</div>

<div class="zoom-wrap">
  <button class="zoom-btn" id="zoomOut" title="تصغير">−</button>
  <span class="zoom-level" id="zoomLevel">100%</span>
  <button class="zoom-btn" id="zoomIn" title="تكبير">+</button>
</div>

<div class="controls" id="controls" style="display:none">
  <button class="ctrl-btn" id="prevBtn" aria-label="السابق">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="page-info"><span id="pageNum">1</span> / <span id="pageCount">1</span></div>
  <button class="ctrl-btn" id="nextBtn" aria-label="التالي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="/db.js"></script>
<script type="module">
// ═══════════════════════════════════════════════════════════════
// 1) استيراد pdf.js 4.x (يحتوي على إصلاح CVE-2024-4367)
// ═══════════════════════════════════════════════════════════════
let pdfjsLib;
try {
  pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs';
} catch (err) {
  // Fallback إلى 3.11.174 (UMD) يحتوي أيضاً على الإصلاح
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  pdfjsLib = window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ═══════════════════════════════════════════════════════════════
// 2) Elements & Params
// ═══════════════════════════════════════════════════════════════
const DB = window.MissionDB;
const params = new URLSearchParams(location.search);
const pdfUrl = params.get('url');
const title = params.get('title') || 'ملف الشرح';

const loader = document.getElementById('loader');
const loadText = document.getElementById('loadText');
const pageContainer = document.getElementById('pageContainer');
const controls = document.getElementById('controls');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageNumEl = document.getElementById('pageNum');
const pageCountEl = document.getElementById('pageCount');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const zoomLevelEl = document.getElementById('zoomLevel');
const toastEl = document.getElementById('toast');
const pdfArea = document.getElementById('pdfArea');
const btnBack = document.getElementById('btnBack');

// ═══════════════════════════════════════════════════════════════
// 3) State
// ═══════════════════════════════════════════════════════════════
const state = {
  pdfDoc: null,
  currentPage: 1,
  renderTask: null,
  userPhone: '',
  userName: '',
  user: null,
  zoom: 1.0,     // multiplier: 0.5 → 3.0
  fitMode: 'fit' // 'fit' = يملأ المساحة
};

// ═══════════════════════════════════════════════════════════════
// 4) Helpers
// ═══════════════════════════════════════════════════════════════
function showError(message, smallText) {
  loader.classList.remove('hidden');
  loader.innerHTML = `
    <div class="loader-error">
      ${message}
      ${smallText ? `<small>${smallText}</small>` : ''}
      <button onclick="location.href='/student/index.html'" style="margin-top:20px;padding:10px 24px;border-radius:10px;border:1px solid rgba(47,125,255,.4);background:rgba(47,125,255,.15);color:#7db6ff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">
        العودة للرئيسية
      </button>
    </div>`;
}

function showToast(msg, duration = 1800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), duration);
}

/**
 * التحقق من أن الرابط من مصدر موثوق.
 * يمنع: SSRF, XSS, تحميل PDF من مواقع خارجية.
 */
function isTrustedPdfUrl(url) {
  if (!url || typeof url !== 'string') return false;
  try {
    const u = new URL(url);
    if (!['http:', 'https:'].includes(u.protocol)) return false;
    const host = u.hostname.toLowerCase();

    // 1) Supabase Storage
    if (host.endsWith('.supabase.co') || host.endsWith('.supabase.in')) {
      return u.pathname.includes('/storage/');
    }

    // 2) نطاق الموقع نفسه
    if (host === window.location.hostname) return true;

    // 3) نطاقات مسموحة صراحةً
    const whitelist = ['mission-edu.vercel.app'];
    if (whitelist.includes(host)) return true;

    return false;
  } catch (e) {
    return false;
  }
}

/**
 * رسم علامة مائية داخل الـ canvas نفسه (لا يمكن حذفها بـ CSS/DevTools).
 * تُرسم 5 نسخ مائلة على نقاط مختلفة من الصفحة.
 */
function drawWatermarkOnCanvas(canvas, text) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const fontSize = Math.max(24, Math.floor(Math.min(w, h) / 22));

  ctx.save();
  ctx.globalAlpha = 0.13;
  ctx.font = `900 ${fontSize}px 'Cairo', sans-serif`;
  ctx.fillStyle = '#ff3c3c';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const positions = [
    [w * 0.25, h * 0.25],
    [w * 0.75, h * 0.25],
    [w * 0.50, h * 0.50],
    [w * 0.25, h * 0.75],
    [w * 0.75, h * 0.75]
  ];

  positions.forEach(([x, y]) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-Math.PI / 6);
    ctx.fillText(text, 0, 0);
    ctx.restore();
  });

  ctx.restore();
}

/**
 * إنشاء طبقة Watermark CSS فوق الصفحة (طبقة ثانية دفاعية).
 */
function createWatermarkLayer() {
  const layer = document.createElement('div');
  layer.className = 'wm-layer';
  [state.userPhone, 'MISSION EDU', state.userPhone, 'MISSION EDU'].forEach(t => {
    const span = document.createElement('div');
    span.className = 'wm-text';
    span.textContent = t;
    layer.appendChild(span);
  });
  return layer;
}

// ═══════════════════════════════════════════════════════════════
// 5) Auth Check
// ═══════════════════════════════════════════════════════════════
async function checkAuth() {
  loadText.textContent = 'جارٍ التحقق من الهوية...';
  const sid = DB.getSessionId();
  if (!sid) {
    window.location.replace('/auth/login.html');
    return false;
  }
  const user = await DB.getUser(sid);
  if (!user || user.active === false || user.banned === true) {
    DB.clearSession();
    window.location.replace('/auth/login.html');
    return false;
  }
  state.user = user;
  state.userPhone = ((user.country_code || '') + (user.phone || '')) || user.name || 'طالب';
  state.userName = user.name || 'طالب';
  return true;
}

// ═══════════════════════════════════════════════════════════════
// 6) Render PDF Page
// ═══════════════════════════════════════════════════════════════
async function renderPage(num) {
  if (!state.pdfDoc) return;

  // إلغاء أي مهمة سابقة
  if (state.renderTask) {
    try { state.renderTask.cancel(); } catch (e) {}
    state.renderTask = null;
  }

  pageContainer.classList.add('loading-page');

  try {
    const page = await state.pdfDoc.getPage(num);
    const areaRect = pdfArea.getBoundingClientRect();
    const availableW = areaRect.width - 24;
    const availableH = areaRect.height - 20;

    // viewport بمقياس 1 لمعرفة أبعاد الصفحة الأصلية
    let viewport = page.getViewport({ scale: 1 });

    // مقياس "fit" الافتراضي
    const fitScaleX = availableW / viewport.width;
    const fitScaleY = availableH / viewport.height;
    const fitScale = Math.min(fitScaleX, fitScaleY);

    // التطبيق مع zoom multiplier
    const finalScale = fitScale * state.zoom;
    viewport = page.getViewport({ scale: finalScale });

    // DPI للشاشات عالية الدقة
    const outputScale = Math.min(window.devicePixelRatio || 1, 2);

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

    // تفريغ الحاوية
    pageContainer.innerHTML = '';
    pageContainer.style.width = Math.floor(viewport.width) + 'px';
    pageContainer.style.height = Math.floor(viewport.height) + 'px';
    pageContainer.appendChild(canvas);

    const renderContext = { canvasContext: ctx, transform, viewport };
    state.renderTask = page.render(renderContext);
    await state.renderTask.promise;

    // ⚠️ رسم العلامة المائية داخل الـ canvas بعد الرسم
    drawWatermarkOnCanvas(canvas, state.userPhone);

    // طبقة watermark CSS إضافية
    pageContainer.appendChild(createWatermarkLayer());

    pageNumEl.textContent = num;
    prevBtn.disabled = num <= 1;
    nextBtn.disabled = num >= state.pdfDoc.numPages;

    pageContainer.classList.remove('loading-page');
    state.renderTask = null;
  } catch (err) {
    if (err && err.name === 'RenderingCancelledException') return;
    console.error('Render error:', err);
    showError('تعذر عرض الصفحة', err?.message || '');
  }
}

// ═══════════════════════════════════════════════════════════════
// 7) Load PDF
// ═══════════════════════════════════════════════════════════════
async function loadPdf() {
  loadText.textContent = 'جارٍ تحميل الملف...';

  try {
    state.pdfDoc = await pdfjsLib.getDocument({
      url: pdfUrl,
      withCredentials: false,
      // تعطيل تنفيذ JavaScript المضمّن في PDF
      isEvalSupported: false,
      // حد أقصى للصفحات التي تُعالج مسبقاً
      rangeChunkSize: 65536 * 4
    }).promise;

    pageCountEl.textContent = state.pdfDoc.numPages;

    loader.classList.add('hidden');
    controls.style.display = 'flex';

    await renderPage(1);
  } catch (err) {
    console.error('Load error:', err);
    const msg = err?.message || '';
    if (msg.includes('PasswordException') || msg.includes('password')) {
      showError('الملف محمي بكلمة مرور', 'تواصل مع المعلم للحصول على كلمة المرور');
    } else if (msg.includes('InvalidPDF') || msg.includes('Invalid PDF')) {
      showError('الملف ليس PDF صالح', 'تأكد أن الرابط مباشر وينتهي بـ .pdf');
    } else if (msg.includes('MissingPDF')) {
      showError('الملف غير موجود', 'تأكد من صحة الرابط');
    } else {
      showError('تعذر تحميل الملف', 'تأكد من اتصالك بالإنترنت، ثم حاول مرة أخرى');
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// 8) Navigation
// ═══════════════════════════════════════════════════════════════
async function goToPage(num) {
  if (!state.pdfDoc || num < 1 || num > state.pdfDoc.numPages) return;
  state.currentPage = num;
  await renderPage(num);
}

prevBtn.addEventListener('click', () => goToPage(state.currentPage - 1));
nextBtn.addEventListener('click', () => goToPage(state.currentPage + 1));

// ═══════════════════════════════════════════════════════════════
// 9) Zoom
// ═══════════════════════════════════════════════════════════════
function updateZoomUI() {
  zoomLevelEl.textContent = Math.round(state.zoom * 100) + '%';
  zoomOutBtn.disabled = state.zoom <= 0.5;
  zoomInBtn.disabled = state.zoom >= 3.0;
}

async function setZoom(newZoom) {
  newZoom = Math.max(0.5, Math.min(3.0, newZoom));
  if (Math.abs(newZoom - state.zoom) < 0.01) return;
  state.zoom = newZoom;
  updateZoomUI();
  await renderPage(state.currentPage);
  showToast(`تكبير ${Math.round(newZoom * 100)}%`);
}

zoomInBtn.addEventListener('click', () => setZoom(state.zoom + 0.25));
zoomOutBtn.addEventListener('click', () => setZoom(state.zoom - 0.25));

// ═══════════════════════════════════════════════════════════════
// 10) Keyboard Navigation
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  // حماية أساسية (defense in depth — ليست كافية وحدها)
  if (e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(e.key.toUpperCase())) ||
      (e.ctrlKey && ['S', 'P', 'U'].includes(e.key.toUpperCase()))) {
    e.preventDefault();
    return false;
  }

  // التنقل
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goToPage(state.currentPage - 1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    goToPage(state.currentPage + 1);
  } else if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    setZoom(state.zoom + 0.25);
  } else if (e.key === '-' || e.key === '_') {
    e.preventDefault();
    setZoom(state.zoom - 0.25);
  }
});

// ═══════════════════════════════════════════════════════════════
// 11) Protection (defense in depth — ليست الحماية الحقيقية)
// ═══════════════════════════════════════════════════════════════
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => {
  if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault();
});

// زر الرجوع
btnBack.addEventListener('click', () => {
  if (history.length > 1) history.back();
  else window.location.href = '/student/index.html';
});

// ═══════════════════════════════════════════════════════════════
// 12) Resize (إعادة الرسم عند تغيير حجم الشاشة)
// ═══════════════════════════════════════════════════════════════
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.pdfDoc && !state.renderTask) {
      renderPage(state.currentPage);
    }
  }, 300);
});

// ═══════════════════════════════════════════════════════════════
// 13) Boot
// ═══════════════════════════════════════════════════════════════
(async function boot() {
  document.title = title + ' | MISSION EDU';
  document.getElementById('pdfTitle').textContent = title;

  // 13.1 تحقق أولي من الرابط
  if (!pdfUrl) {
    showError('لا يوجد رابط للملف', 'يجب فتح الملف من داخل صفحة الدرس');
    return;
  }
  if (!isTrustedPdfUrl(pdfUrl)) {
    console.warn('Rejected untrusted URL:', pdfUrl);
    showError('مصدر الملف غير موثوق', 'لأمانك، لا يمكن فتح ملفات من مصادر خارجية');
    return;
  }

  // 13.2 تحقق الهوية
  try {
    const ok = await checkAuth();
    if (!ok) return;
  } catch (err) {
    console.error('Auth error:', err);
    showError('تعذر التحقق من الهوية', 'حاول تسجيل الدخول مرة أخرى');
    return;
  }

  // 13.3 تحميل الملف
  await loadPdf();

  updateZoomUI();
})();
</script>
</body>
