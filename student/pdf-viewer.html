<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ملف الشرح | MISSION EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; font-family: 'Cairo', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; }
header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0) 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
header .title { font-size: 15px; font-weight: 700; pointer-events: auto; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
header .badge { background: rgba(47,125,255,0.2); border: 1px solid rgba(47,125,255,0.4); color: #7db6ff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
header .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.pdf-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 70px 10px 80px; position: relative; }
.page-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #fff; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; max-width: 100%; max-height: 100%; }
.page-container canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

.watermark-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; overflow: hidden; }
.watermark-text { color: rgba(47,125,255,0.15); font-size: clamp(20px, 4vw, 40px); font-weight: 900; transform: rotate(-30deg); white-space: nowrap; user-select: none; text-shadow: 0 0 2px rgba(255,255,255,0.5); letter-spacing: 2px; }

.controls { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: linear-gradient(0deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0) 100%); display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 100; padding-bottom: 10px; }
.ctrl-btn { width: 46px; height: 46px; border-radius: 50%; background: rgba(47,125,255,0.15); border: 1px solid rgba(47,125,255,0.4); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.ctrl-btn:hover:not(:disabled) { background: rgba(47,125,255,0.3); transform: scale(1.05); }
.ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-info { font-size: 16px; font-weight: 700; color: #b7c6e4; min-width: 100px; text-align: center; }

.loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0e17; z-index: 200; transition: opacity 0.5s; }
.loader.hidden { opacity: 0; pointer-events: none; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(47,125,255,0.2); border-top-color: #2f7dff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div style="font-size:14px;font-weight:600;color:#7db6ff" id="loadText">جارٍ التحقق من الهوية...</div>
</div>

<header>
  <div class="title" id="pdfTitle">ملف الشرح</div>
  <div class="badge">محمي</div>
</header>

<div class="pdf-area" id="pdfArea">
  <div class="page-container" id="pageContainer"></div>
</div>

<div class="controls" id="controls" style="display:none;">
  <button class="ctrl-btn" id="prevBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="page-info"><span id="pageNum">1</span> / <span id="pageCount">1</span></div>
  <button class="ctrl-btn" id="nextBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<script src="/db.js"></script>
<script>
(function(){
  "use strict";
  const DB = window.MissionDB;
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('url');
  const title = params.get('title') || 'ملف الشرح';
  
  const pageContainer = document.getElementById('pageContainer');
  const loader = document.getElementById('loader');
  const loadText = document.getElementById('loadText');
  const controls = document.getElementById('controls');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageNumEl = document.getElementById('pageNum');
  const pageCountEl = document.getElementById('pageCount');

  let pdfDoc = null;
  let currentPage = 1;
  let renderTask = null;

  document.title = title + ' | MISSION EDU';
  document.getElementById('pdfTitle').textContent = title;

  async function checkAuth() {
    const sid = DB.getSessionId();
    if (!sid) { window.location.replace("/auth/login.html"); return false; }
    const user = await DB.getUser(sid);
    if (!user || user.active === false || user.banned === true) {
      DB.clearSession();
      window.location.replace("/auth/login.html");
      return false;
    }
    window.__userPhone = (user.country_code || '') + (user.phone || '');
    return true;
  }

  async function initPDF() {
    if (!pdfUrl) {
      loader.innerHTML = '<div style="color:#fca5a5;font-weight:700;">رابط الملف غير موجود.</div>';
      return;
    }
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    loadText.textContent = 'جارٍ تحميل الملف...';

    try {
      pdfDoc = await pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise;
      pageCountEl.textContent = pdfDoc.numPages;
      loader.classList.add('hidden');
      controls.style.display = 'flex';
      renderPage(currentPage);
    } catch (err) {
      console.error(err);
      loader.innerHTML = '<div style="color:#fca5a5;font-weight:700;text-align:center;padding:20px;">تعذر تحميل الملف.<br><br>تأكد أن الرابط مباشر وينتهي بـ .pdf</div>';
    }
  }

  async function renderPage(num) {
    if (renderTask) {
      renderTask.cancel();
    }

    const page = await pdfDoc.getPage(num);
    
    const containerWidth = document.getElementById('pdfArea').clientWidth - 20;
    const containerHeight = document.getElementById('pdfArea').clientHeight - 20;
    
    let viewport = page.getViewport({ scale: 1 });
    
    const scaleX = containerWidth / viewport.width;
    const scaleY = containerHeight / viewport.height;
    const scale = Math.min(scaleX, scaleY);
    
    viewport = page.getViewport({ scale: scale });
    
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    const outputScale = window.devicePixelRatio || 1;
    
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

    pageContainer.innerHTML = '';
    pageContainer.style.width = Math.floor(viewport.width) + 'px';
    pageContainer.style.height = Math.floor(viewport.height) + 'px';
    pageContainer.appendChild(canvas);

    const wmLayer = document.createElement('div');
    wmLayer.className = 'watermark-layer';
    const wm1 = document.createElement('div'); wm1.className = 'watermark-text'; wm1.textContent = window.__userPhone;
    const wm2 = document.createElement('div'); wm2.className = 'watermark-text'; wm2.textContent = 'MISSION EDU';
    const wm3 = document.createElement('div'); wm3.className = 'watermark-text'; wm3.textContent = window.__userPhone;
    wmLayer.appendChild(wm1);
    wmLayer.appendChild(wm2);
    wmLayer.appendChild(wm3);
    pageContainer.appendChild(wmLayer);

    const renderContext = { canvasContext: context, transform: transform, viewport: viewport };
    renderTask = page.render(renderContext);
    
    try {
      await renderTask.promise;
      pageNumEl.textContent = num;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
    } catch (err) {
      if (err.name !== 'RenderingCancelledException') console.error(err);
    }
  }

  prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(currentPage); } });
  nextBtn.addEventListener('click', () => { if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); } });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['S','P','U'].includes(e.key.toUpperCase()))) {
      e.preventDefault(); return false;
    }
    if (e.key === 'ArrowLeft') { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
    if (e.key === 'ArrowRight') { if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); } }
  });
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  checkAuth().then(isValid => { if (isValid) initPDF(); });
})();
</script>
</body>
</html>
