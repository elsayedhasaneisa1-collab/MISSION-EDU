<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ملف الشرح | MISSION EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; font-family: 'Cairo', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0) 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
header .title { font-size: 15px; font-weight: 700; pointer-events: auto; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
header .badge { background: rgba(47,125,255,0.2); border: 1px solid rgba(47,125,255,0.4); color: #7db6ff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
header .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.pdf-container { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111827; }
.pdf-container object, .pdf-container iframe { width: 100%; height: 100%; border: none; background: #111827; pointer-events: auto; }
.pdf-shield { position: absolute; inset: 0; z-index: 50; background: transparent; pointer-events: none; }

.watermark { position: absolute; z-index: 60; pointer-events: none; color: rgba(255,255,255,0.08); font-size: 32px; font-weight: 900; transform: rotate(-30deg); letter-spacing: 4px; white-space: nowrap; user-select: none; }
.wm-1 { top: 20%; left: 10%; }
.wm-2 { bottom: 30%; right: 10%; }
.wm-3 { top: 60%; left: 40%; }

.loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0e17; z-index: 200; transition: opacity 0.5s; }
.loader.hidden { opacity: 0; pointer-events: none; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(47,125,255,0.2); border-top-color: #2f7dff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #fca5a5; font-size: 14px; text-align: center; padding: 20px; display: none; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div style="font-size:14px;font-weight:600;color:#7db6ff">جارٍ تحميل الملف...</div>
  <div class="error" id="errorMsg"></div>
</div>

<header>
  <div class="title" id="pdfTitle">ملف الشرح</div>
  <div class="badge">محمي</div>
</header>

<div class="pdf-container" id="pdfContainer">
  <div class="watermark wm-1" id="wm1">MISSION EDU</div>
  <div class="watermark wm-2" id="wm2">MISSION EDU</div>
  <div class="watermark wm-3" id="wm3">MISSION EDU</div>
  <div class="pdf-shield"></div>
</div>

<script>
(function(){
  "use strict";

  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('url');
  const title = params.get('title') || 'ملف الشرح';
  const userPhone = params.get('wm') || 'طالب';

  document.title = title + ' | MISSION EDU';
  document.getElementById('pdfTitle').textContent = title;

  document.querySelectorAll('.watermark').forEach(el => {
    el.textContent = userPhone;
  });

  const container = document.getElementById('pdfContainer');
  const loader = document.getElementById('loader');
  const errorMsg = document.getElementById('errorMsg');

  if (!pdfUrl) {
    loader.classList.add('hidden');
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'رابط الملف غير موجود أو غير صالح.';
    return;
  }

  const isGoogleDrive = pdfUrl.includes('drive.google.com');
  let embedUrl = pdfUrl;
  
  if (!isGoogleDrive) {
    embedUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(pdfUrl)}&embedded=true`;
  }

  const obj = document.createElement('object');
  obj.data = embedUrl;
  obj.type = 'application/pdf';
  obj.style.width = '100%';
  obj.style.height = '100%';
  
  obj.innerHTML = `
    <iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe>
  `;

  container.appendChild(obj);

  setTimeout(() => {
    loader.classList.add('hidden');
  }, 1500);

  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) || 
        (e.ctrlKey && ['S','P','U'].includes(e.key.toUpperCase()))) {
      e.preventDefault();
      return false;
    }
  });

  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

})();
</script>
</body>
</html>
