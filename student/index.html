.social-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;border-radius:18px;text-decoration:none;color:inherit;background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid rgba(90,140,230,.22);transition:.28s;position:relative;overflow:hidden}
.social-card:hover{transform:translateY(-4px);border-color:rgba(90,140,230,.55);box-shadow:0 12px 30px rgba(47,125,255,.25)}
.guest-banner{position:sticky;top:64px;z-index:45;margin:12px 26px 0;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(47,125,255,.18),rgba(139,92,246,.14));border:1.5px solid rgba(47,125,255,.45);display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(47,125,255,.20)}
.guest-banner .guest-icon{width:44px;height:44px;border-radius:12px;background:rgba(47,125,255,.22);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.pass-banner{position:sticky;top:64px;z-index:44;margin:12px 26px 0;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(245,158,11,.10));border:1.5px solid rgba(251,191,36,.5);display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(251,191,36,.25)}
.pass-banner .pass-icon{width:44px;height:44px;border-radius:12px;background:rgba(251,191,36,.22);display:grid;place-items:center;font-size:22px;flex-shrink:0;animation:pulse 2s infinite}
.flashcard{perspective:1200px;width:100%;height:320px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;border:2px solid var(--border2)}
.flashcard-front{background:linear-gradient(135deg,rgba(47,125,255,.18),rgba(139,92,246,.12))}
.flashcard-back{background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(6,182,212,.12));transform:rotateY(180deg)}
.flashcard-text{font-size:20px;font-weight:700;line-height:1.6;max-width:100%;overflow-y:auto;max-height:100%}
.opt{display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:14px;background:rgba(255,255,255,.035);border:1.5px solid var(--border);transition:.2s;cursor:pointer;text-align:right;width:100%;font-size:14.5px;color:var(--txt)}
.opt:hover{background:rgba(47,125,255,.09);border-color:var(--border2)}
.opt.ok{background:rgba(34,197,94,.15);border-color:var(--green)}
.opt.bad{background:rgba(239,68,68,.14);border-color:var(--red)}
.opt-l{width:32px;height:32px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:800;font-size:13px}
.opt.ok .opt-l{background:var(--green);color:#fff}
.opt.bad .opt-l{background:var(--red);color:#fff}
.pomodoro-time{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.pomodoro-label{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
.sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;max-width:85vw;box-shadow:-20px 0 60px rgba(0,0,0,.7);overflow-x:hidden}
.sidebar.open{transform:translateX(0)!important}
.mbar{display:flex}
.content{padding:14px 14px 120px;overflow-x:hidden}
.topbar{padding:10px 14px}
.g2,.g3,.g4{grid-template-columns:1fr}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.social-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.guest-banner,.pass-banner{margin:10px 14px 0}
.btmnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:55;background:rgba(6,9,20,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 6px;justify-content:space-around;padding-bottom:calc(8px + env(safe-area-inset-bottom));max-width:100vw;overflow-x:hidden}
.btmnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:700;transition:.2s;min-width:0}
.btmnav button.on{color:var(--blue2);background:rgba(47,125,255,.12)}
.btmnav .i{font-size:19px;display:flex;justify-content:center}
.btmnav .lbl-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
@media(max-width:640px){.pomodoro-time{font-size:36px}.flashcard{height:260px}.flashcard-text{font-size:17px}}

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/db.js"></script>
<script>
  if (window.Babel && Babel.availablePresets && Babel.availablePresets['react']) {
    Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
  }
  (function(){
    var blockEvent=function(e){if(!e)return;e.preventDefault&&e.preventDefault();e.stopPropagation&&e.stopPropagation();e.stopImmediatePropagation&&e.stopImmediatePropagation();return false};
    document.addEventListener("contextmenu",function(e){var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;blockEvent(e)},true);
    document.addEventListener("copy",function(e){var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;blockEvent(e)},true);
    document.addEventListener("cut",function(e){var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;blockEvent(e)},true);
    document.addEventListener("dragstart",function(e){var t=e.target;if(t&&(t.tagName==="IMG"||t.tagName==="VIDEO"))blockEvent(e)},true);
    document.addEventListener("selectstart",function(e){var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;blockEvent(e)},true);
    document.addEventListener("keydown",function(e){
      var k=(e.key||"").toUpperCase();
      if(e.key==="F12")return blockEvent(e);
      if(e.ctrlKey&&e.shiftKey&&["I","J","C","K","M"].indexOf(k)>=0)return blockEvent(e);
      if(e.ctrlKey&&["U","S","P"].indexOf(k)>=0)return blockEvent(e);
      if(e.metaKey&&["U","S","P"].indexOf(k)>=0)return blockEvent(e);
      if(e.key==="PrintScreen"||e.keyCode===44){try{navigator.clipboard.writeText("")}catch(err){}try{document.body.style.filter="blur(20px)";setTimeout(function(){document.body.style.filter=""},700)}catch(err){}return blockEvent(e)}
    },true);
    window.addEventListener("beforeprint",function(e){blockEvent(e);try{document.body.style.display="none";setTimeout(function(){document.body.style.display=""},300)}catch(err){}});
    if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}
  })();
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;
const GUEST_USER={id:"guest",name:"ضيف",role:"guest",avatar:"👤",xp:0,streak:0,completed_lessons:[],completed_missions:[],achievements:[],all_subjects:true,access_subjects:[],subscription:"free",gender:null};
let _audioCtx=null;
function getAudioCtx(){if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}return _audioCtx}
function beep(f,d,t='sine',v=0.15){try{const c=getAudioCtx();if(!c)return;if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d/1000);o.start(c.currentTime);o.stop(c.currentTime+d/1000)}catch(e){}}
function playSound(t='notify'){switch(t){case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100)}}
const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);if(type==='ok')playSound('success');else if(type==='err')playSound('err');else if(type==='warn')playSound('warn');else playSound('notify')},[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div></ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);
  const [progress,setProgress]=useState(100);
  useEffect(()=>{const s=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-s)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280)}},40);return()=>clearInterval(t)},[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}><div className="toast-ico">{icons[data.type]}</div><div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div><button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280)}}>✕</button><div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div></div>;
}
const useToast=()=>useContext(ToastCtx);
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);
const WEAK_PASSWORDS=["123456","12345678","password","123456789","qwerty","111111","abc123","000000","1234567890","admin","iloveyou"];
async function isWeakPassword(user){
  if(!user||!user.password_hash)return false;
  try{for(const pw of WEAK_PASSWORDS){const h=await DB.hashPassword(pw);if(user.password_hash===h)return true;}}catch(e){}
  return false;
}
function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],settings:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [attempts,setAttempts]=useState([]);
  const [errors,setErrors]=useState([]);
  const [notes,setNotes]=useState([]);
  const [certificates,setCertificates]=useState([]);
  const [settings,setSettings]=useState({about_title:'عن المنصة',about_text:'',social_links:[]});
  const [loading,setLoading]=useState(true);
  const [guestMode,setGuestMode]=useState(false);
  const [bannedUser,setBannedUser]=useState(null);
  const [weakPassword,setWeakPassword]=useState(false);
  const [theme,setThemeState]=useState(()=>{try{return localStorage.getItem('me_theme')||'dark'}catch(e){return 'dark'}});
  const [focusMode,setFocusModeState]=useState(()=>{try{return localStorage.getItem('me_focus_mode')==='true'}catch(e){return false}});
  const toast=useToast();
  const lastNotifIdRef=useRef(null);
  const isFirstNotifLoadRef=useRef(true);
  const setTheme=useCallback((t)=>{setThemeState(t);try{localStorage.setItem('me_theme',t);document.documentElement.setAttribute('data-theme',t)}catch(e){}},[theme]);
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
  const setFocusMode=useCallback((v)=>{setFocusModeState(v);try{localStorage.setItem('me_focus_mode',v?'true':'false')}catch(e){}},[focusMode]);
  const reload=useCallback(async()=>{try{await DB.cleanupExpiredPolls();const data=await DB.loadAll();setDb(data)}catch(e){console.warn(e)}},[]);
  const reloadUserData=useCallback(async()=>{
    if(!currentUser||guestMode||currentUser.role==='guest')return;
    try{
      const sb=await DB.getClient();
      const [a,e,n,c]=await Promise.all([DB.getAttempts(currentUser.id),DB.getErrors(currentUser.id),sb.from('notes').select('*').eq('user_id',currentUser.id).then(r=>r.data||[]),sb.from('certificates').select('*').eq('user_id',currentUser.id).then(r=>r.data||[])]);
      setAttempts(a);setErrors(e);setNotes(n);setCertificates(c);
      const u=await DB.getUser(currentUser.id);if(u){setCurrentUser(u);setWeakPassword(await isWeakPassword(u))}
    }catch(e){console.warn(e)}
  },[currentUser,guestMode]);
  const enterGuestMode=useCallback(()=>{setGuestMode(true);setCurrentUser(GUEST_USER);try{localStorage.setItem('guest_mode','true')}catch(e){}},[]);
  const exitGuestMode=useCallback(()=>{setGuestMode(false);setCurrentUser(null);try{localStorage.removeItem('guest_mode')}catch(e){}window.location.replace('/auth/login.html')},[]);
  useEffect(()=>{
    (async()=>{
      try{
        const wasGuest=(()=>{try{return localStorage.getItem('guest_mode')==='true'}catch(e){return false}})();
        const sid=DB.getSessionId();
        if(!sid){if(wasGuest){setGuestMode(true);setCurrentUser(GUEST_USER)}const st=await DB.getSettings();setSettings(st);await reload();setLoading(false);return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();if(wasGuest){setGuestMode(true);setCurrentUser(GUEST_USER)}setLoading(false);return;}
        if(u.role==='admin'){window.location.replace('/admin/index.html');return}
        if(u.banned===true){setBannedUser(u);setLoading(false);return}
        setCurrentUser(u);setWeakPassword(await isWeakPassword(u));if(u.theme&&u.theme!=='dark')setTheme(u.theme);
        const sb=await DB.getClient();
        const [a,e,n,c]=await Promise.all([DB.getAttempts(u.id),DB.getErrors(u.id),sb.from('notes').select('*').eq('user_id',u.id).then(r=>r.data||[]),sb.from('certificates').select('*').eq('user_id',u.id).then(r=>r.data||[])]);
        setAttempts(a);setErrors(e);setNotes(n);setCertificates(c);
        const st=await DB.getSettings();setSettings(st);await reload();
      }catch(e){console.warn(e)}
      setLoading(false);
    })();
  },[]);
  useEffect(()=>{const interval=setInterval(async()=>{const c=await DB.cleanupExpiredPolls();if(c>0)await reload()},5*60*1000);return()=>clearInterval(interval)},[reload]);
  useEffect(()=>{
    if(!currentUser||guestMode)return;
    const checkNotifs=async()=>{
      try{
        const myNotifs=(db.notifications||[]).filter(n=>n.target==='all'||n.target===currentUser.id).sort((a,b)=>b.created_at-a.created_at);
        if(myNotifs.length===0)return;const latest=myNotifs[0];
        if(isFirstNotifLoadRef.current){isFirstNotifLoadRef.current=false;lastNotifIdRef.current=latest.id;return}
        if(latest.id!==lastNotifIdRef.current){
          lastNotifIdRef.current=latest.id;
          if(('Notification' in window)&&Notification.permission==='granted'){
            try{const reg=await navigator.serviceWorker.ready;reg.showNotification(latest.title||'MISSION EDU',{body:latest.body||'',icon:'/logo.png',badge:'/logo.png',dir:'rtl',lang:'ar',tag:'notif-'+latest.id,data:{url:latest.url||'/student/index.html'}});}catch(e){try{new Notification(latest.title||'MISSION EDU',{body:latest.body||'',icon:'/logo.png',dir:'rtl',lang:'ar'})}catch(err){}}
          }
          playSound('notify');await reload();
        }
      }catch(e){}
    };
    checkNotifs();const interval=setInterval(checkNotifs,15000);return ()=>clearInterval(interval);
  },[db.notifications,currentUser,guestMode]);
  useEffect(()=>{const unlock=()=>{const c=getAudioCtx();if(c&&c.state==='suspended')c.resume();document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock)};document.addEventListener('click',unlock,{once:true});document.addEventListener('touchstart',unlock,{once:true});return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock)}},[]);
  const logout=useCallback(()=>{Swal.fire({title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed){try{localStorage.removeItem('student_tab');localStorage.removeItem('student_selected');localStorage.removeItem('guest_mode')}catch(e){}DB.clearSession();window.location.replace('/auth/login.html')}});},[]);
  const updateUser=useCallback(async(id,patch)=>{if(guestMode)throw new Error('سجل دخولك أولاً');const u=await DB.updateUser(id,patch);setCurrentUser(u);return u},[guestMode]);
  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return{current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null}}return{current:cur,next}},[db.levels]);
  const saveNote=useCallback(async(lessonId,text)=>{if(!currentUser||guestMode)return;const sb=await DB.getClient();const existing=notes.find(n=>n.lesson_id===lessonId);const now=Date.now();if(existing){await sb.from('notes').update({text,updated_at:now}).eq('id',existing.id);setNotes(x=>x.map(n=>n.id===existing.id?{...n,text,updated_at:now}:n))}else{const row={id:DB.uid('note_'),user_id:currentUser.id,lesson_id:lessonId,text,created_at:now,updated_at:now};await sb.from('notes').insert([row]);setNotes(x=>[...x,row])}},[currentUser,notes,guestMode]);
  const getNote=useCallback((lessonId)=>notes.find(n=>n.lesson_id===lessonId)?.text||'',[notes]);
  const requireAuth=useCallback((action='هذه الميزة')=>{if(!guestMode&&currentUser&&currentUser.role!=='guest')return true;Swal.fire({icon:'info', title:'🔐 سجل دخولك',html:`<div style="text-align:right;line-height:1.9;font-size:14px"><p style="margin-bottom:10px">${action} متاحة للأعضاء فقط.</p><p style="color:#b7c6e4;font-size:13px">سجل دخولك أو أنشئ حساب مجاني.</p></div>`,showCancelButton:true, confirmButtonText:'🔑 تسجيل الدخول', cancelButtonText:'📝 حساب جديد',confirmButtonColor:'#2f7dff', cancelButtonColor:'#8b5cf6',background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed)window.location.replace('/auth/login.html');else if(r.dismiss===Swal.DismissReason.cancel)window.location.replace('/auth/register.html');});return false;},[guestMode,currentUser]);
  return <AppCtx.Provider value={{db,currentUser,attempts,errors,notes,certificates,settings,loading,guestMode,bannedUser,weakPassword,theme,focusMode,setTheme,setFocusMode,enterGuestMode,exitGuestMode,requireAuth,logout,updateUser,reload,reloadUserData,getLevel,toast,playSound,saveNote,getNote,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id),question:id=>db.questions.find(q=>q.id===id),grade:id=>db.grades.find(g=>g.id===id)}}>{children}</AppCtx.Provider>;
}

function PracticePage(){

  if(app.guestMode) return <div className="glass" style={{padding:40,textAlign:'center'}}><div style={{fontSize:64,marginBottom:12}}>🔐</div><div className="h3 mb8">الاستخدام أوفلاين للأعضاء فقط</div><button className="btn btn-p mt16" onClick={()=>window.location.replace('/auth/login.html')}>🔑 دخول</button></div>;
  if(loading) return <div className="glass" style={{padding:40,textAlign:'center'}}><div className="spinner" style={{margin:'0 auto 14px'}}></div>جارٍ التحميل...</div>;
  return <><div className="glass mb16" style={{padding:20,background: online ? 'rgba(34,197,94,.08)' : 'rgba(239,68,68,.08)', borderColor: online ? 'rgba(34,197,94,.35)' : 'rgba(239,68,68,.35)'}}><div className="flex between center"><div><div className="h3 mb6">{online ? '🌐 متصل' : '📴 غير متصل'}</div><div className="sm muted">{online ? 'يمكنك التصفح بشكل طبيعي' : 'تقدر تتصفح الدروس المحمّلة'}</div></div><div style={{fontSize:32}}>{online ? '🌐' : '📴'}</div></div></div><div className="flex between center mb16 wrap g8"><div><div className="h2 grad">📥 الدروس المحمّلة</div><div className="sm muted mt6">{cached.length} درس</div></div><button className="btn btn-p" onClick={cacheAll}>📥 تحميل 20 درس</button></div>{cached.length === 0 ? <div className="glass" style={{padding:40}}><Empty icon="📥" title="لا توجد دروس محمّلة" desc="اضغط 'تحميل 20 درس' عشان تشتغل أوفلاين"/></div> :<div className="grid g2">{cached.map(c=>{const l = app.lesson(c.lesson_id);if(!l) return null;return <div key={c.id} className="glass-s" style={{padding:14}}><div className="h4 mb6">{l.title}</div><div className="xs muted mb12">📅 {DB.formatDate(c.cached_at)}</div><div className="flex g8"><a href={`/student/lesson.html?id=${l.id}`} className="btn btn-p btn-sm" style={{flex:1,textDecoration:'none'}}>▶️ فتح</a><button className="btn btn-dn btn-sm" onClick={()=>remove(l.id)}>🗑️</button></div></div>;})}</div>}</>;
}
function StudentApp(){
  const app=useApp();
  const user=app.currentUser;
  const isGuest=app.guestMode||user.role==='guest';
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('student_tab')||'home'}catch(e){return 'home'}});
  const [selected,setSelected]=useState(()=>{try{const saved=localStorage.getItem('student_selected');return saved?JSON.parse(saved):null}catch(e){return null}});
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchResults,setSearchResults]=useState([]);
  const [showDailyReward,setShowDailyReward]=useState(false);
  const [showWelcome,setShowWelcome]=useState(false);

  useEffect(()=>{try{localStorage.setItem('student_tab',tab)}catch(e){}},[tab]);
  useEffect(()=>{try{if(selected)localStorage.setItem('student_selected',JSON.stringify(selected));else localStorage.removeItem('student_selected')}catch(e){}},[selected]);

  useEffect(()=>{
    if(isGuest) return;
    (async()=>{
      try{ const status = await DB.getDailyRewardStatus(user.id); if(status.canClaim) setTimeout(()=>setShowDailyReward(true), 800); }catch(e){}
      const seen = (()=>{try{return localStorage.getItem('me_welcome_seen_'+user.id)==='true'}catch(e){return false}})();
      if(!seen){ setTimeout(()=>setShowWelcome(true), 1200); try{localStorage.setItem('me_welcome_seen_'+user.id,'true')}catch(e){} }
    })();
  },[user.id,isGuest]);

  useEffect(()=>{
    if(isGuest) return;
    if('Notification' in window && Notification.permission === 'granted'){
      setupPushNotifications(user.id).catch(()=>{});
      setupPeriodicSync().catch(()=>{});
    }
  },[user.id,isGuest]);

  const handleNav=(id)=>{
    if(isGuest&&['notes','certificates','errors','profile','partner','practice','daily-challenge','xp-shop','flashcards','study-groups','study-calendar','analytics','focus-mode','offline','sv'].includes(id)){
      app.requireAuth('هذه الميزة');
      return;
    }
    if (id === 'sv') {
      window.location.href = '/student/sv.html';
      return;
    }
    if(id!=='subject')setSelected(null);
    setTab(id);
  };

  const unread=isGuest?0:app.db.notifications.filter(n=>(n.target==='all'||n.target===user.id)&&!(n.read_by||[]).includes(user.id)).length;

  const items=[
    {title:'',items:[{id:'home',icon:'home',label:'الرئيسية'}]},
    {title:'التعلم',items:[
      {id:'subjects',icon:'book',label:'المواد'},
      {id:'missions',icon:'target',label:'المهام'},
      {id:'practice',icon:'zapCircle',label:'وضع التدريب'},
      {id:'daily-challenge',icon:'trophy',label:'التحدي اليومي'},
      {id:'sv',icon:'trophy',label:'تحدي الأصدقاء'}
    ]},
    {title:'مميزاتي',items:[
      {id:'achievements',icon:'trophy',label:'الإنجازات'},
      {id:'certificates',icon:'award',label:'شهاداتي'},
      {id:'flashcards',icon:'layers',label:'Flashcards'},
      {id:'errors',icon:'alert',label:'دفتر الأخطاء'}
    ]},
    {title:'المجتمع',items:[
      {id:'partner',icon:'handshake',label:'شريك الدراسة'},
      {id:'study-groups',icon:'users',label:'مجموعات الدراسة'},
      {id:'leaderboard',icon:'medal',label:'المتصدرون'},
      {id:'school-leaderboard',icon:'school',label:'مسابقة المدارس'}
    ]},
    {title:'الأدوات',items:[
      {id:'notes',icon:'note',label:'ملاحظاتي',badge:isGuest?null:(app.notes?.length||null)},
      {id:'study-calendar',icon:'calendar',label:'تقويم المذاكرة'},
      {id:'focus-mode',icon:'clock',label:'وضع التركيز'},
      {id:'analytics',icon:'chart',label:'تحليلاتي'},
      {id:'xp-shop',icon:'shoppingBag',label:'متجر XP'},
      {id:'offline',icon:'download',label:'الدروس المحمّلة'}
    ]},
    {title:'أخرى',items:[
      {id:'polls',icon:'activity',label:'استطلاعات'},
      {id:'notifications',icon:'bell',label:'الإشعارات',badge:unread||null},
      {id:'about',icon:'info',label:'عن المنصة'},
      {id:'profile',icon:'user',label:'الملف الشخصي'}
    ]}
  ];

  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    const access=user.all_subjects?app.db.subjects.map(s=>s.id):(user.access_subjects||[]);
    app.db.lessons.filter(l=>{const un=app.unit(l.unit_id);return un&&access.includes(un.subject_id)&&l.published!==false&&(l.title.toLowerCase().includes(lc)||(l.desc||'').toLowerCase().includes(lc))}).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="book" size={16}/>,title:l.title,href:`/student/lesson.html?id=${l.id}`}));
    app.db.exams.filter(e=>access.includes(e.subject_id)&&e.title.toLowerCase().includes(lc)).forEach(e=>res.push({type:'اختبار',icon:<Icon name="clipboard" size={16}/>,title:e.title,href:`/student/exam.html?id=${e.id}`}));
    setSearchResults(res);
  };

  const btmTabs=[
    {id:'home',icon:'home',label:'الرئيسية',color:'#5aa9ff'},
    {id:'subjects',icon:'book',label:'المواد',color:'#22c55e'},
    {id:'practice',icon:'zapCircle',label:'تدريب',color:'#f59e0b'},
    {id:'daily-challenge',icon:'trophy',label:'تحدي',color:'#fbbf24'},
    {id:'leaderboard',icon:'medal',label:'متصدرون',color:'#8b5cf6'}
  ];

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={handleNav} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={isGuest?app.exitGuestMode:app.logout} onSearch={onSearch} searchResults={searchResults} unreadNotifs={unread} onOpenNotifications={()=>handleNav('notifications')} theme={app.theme} onToggleTheme={()=>app.setTheme(app.theme==='dark'?'light':'dark')}/>
      {isGuest&&<GuestBanner/>}
      {!isGuest&&app.weakPassword&&<PasswordBanner/>}
      <div className="content">
        {tab==='home'&&<Home onNav={handleNav} setSelected={setSelected}/>}
        {tab==='subjects'&&<Subjects setSelected={setSelected} setTab={setTab}/>}
        {tab==='subject'&&selected&&<SubjectDetail subjectId={selected.id} setTab={setTab}/>}
        {tab==='missions'&&<Missions/>}
        {tab==='practice'&&<PracticePage/>}
        {tab==='daily-challenge'&&<DailyChallengePage/>}
        {tab==='achievements'&&<Achievements/>}
        {tab==='certificates'&&<CertificatesPage/>}
        {tab==='flashcards'&&<FlashcardsPage/>}
        {tab==='partner'&&<StudyPartnerPage/>}
        {tab==='study-groups'&&<StudyGroupsPage/>}
        {tab==='leaderboard'&&<Leaderboard/>}
        {tab==='school-leaderboard'&&<SchoolLeaderboardPage/>}
        {tab==='notes'&&<NotesPage/>}
        {tab==='study-calendar'&&<StudyCalendarPage/>}
        {tab==='focus-mode'&&<FocusModePage/>}
        {tab==='analytics'&&<AnalyticsPage/>}
        {tab==='xp-shop'&&<XPShopPage/>}
        {tab==='offline'&&<OfflineManagerPage/>}
        {tab==='errors'&&<ErrorBook/>}
        {tab==='polls'&&<PollsPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='about'&&<AboutPageFull/>}
        {tab==='profile'&&<ProfileRedirect/>}
        <Footer/>
      </div>
    </div>
    <div className="btmnav">
      {btmTabs.map(it=>{
        const active=tab===it.id;
        return <button key={it.id} className={active?'on':''} onClick={()=>handleNav(it.id)} style={active?{color:it.color,background:`linear-gradient(180deg,${it.color}22,${it.color}08)`}:{}}>
          <span className="i" style={active?{color:it.color,filter:`drop-shadow(0 0 8px ${it.color}88)`}:{color:it.color+'99'}}><Icon name={it.icon} size={19}/></span>
          <span className="lbl-txt" style={active?{color:it.color,fontWeight:800}:{}}>{it.label}</span>
        </button>;
      })}
    </div>
    {showDailyReward && !isGuest && <DailyRewardModal user={user} onClose={()=>setShowDailyReward(false)} onClaimed={async(xp)=>{app.toast.ok(`🎁 +${xp} XP`); await app.reloadUserData();}}/>}
    {showWelcome && !isGuest && <WelcomeModal user={user} onClose={()=>setShowWelcome(false)}/>}
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading)return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(app.bannedUser)return <BannedScreen user={app.bannedUser}/>;
  if(!app.currentUser)return <GuestLanding onEnterGuest={app.enterGuestMode}/>;
  if(app.currentUser.role==='admin')return null;
  return <StudentApp/>;
}

function App(){
  return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
