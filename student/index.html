<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — لوحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/db.js"></script>
<style>
:root{
--bg:#050a14;--bg2:#0a1220;
--gold:#00d4ff;--gold-l:#00ffff;--gold-d:#0088cc;
--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);
--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;
--r:20px;--rs:13px;
--sh:0 18px 50px rgba(0,0,0,.75), 0 0 0 1px rgba(0,212,255,.05) inset;
--sh-gold:0 10px 30px rgba(0,212,255,.35);
--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%);
}
body[data-theme="cyber"] { --gold:#00d4ff;--gold-l:#00ffff;--bg:#050a14;--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%); }
body[data-theme="purple"] { --gold:#a855f7;--gold-l:#d8b4fe;--bg:#0f0518;--grad-gold:linear-gradient(135deg,#d8b4fe 0%,#a855f7 45%,#7e22ce 100%); }
body[data-theme="green"] { --gold:#22c55e;--gold-l:#4ade80;--bg:#05140a;--grad-gold:linear-gradient(135deg,#4ade80 0%,#22c55e 45%,#16a34a 100%); }
body[data-theme="orange"] { --gold:#f59e0b;--gold-l:#fcd34d;--bg:#140d05;--grad-gold:linear-gradient(135deg,#fcd34d 0%,#f59e0b 45%,#d97706 100%); }
body[data-theme="pink"] { --gold:#ec4899;--gold-l:#f9a8d4;--bg:#14050c;--grad-gold:linear-gradient(135deg,#f9a8d4 0%,#ec4899 45%,#be185d 100%); }
body.light-mode { --bg:#f0f4f8; --bg2:#e0e8f0; --txt:#0a1220; --txt2:#4a5f7a; --muted:#8fa5bd; background: #f0f4f8; }
body.light-mode .glass { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(240,244,248,.85)); border-color: rgba(0,212,255,.35); }
body.light-mode .glass-s { background: rgba(255,255,255,.85); }
body.light-mode .sidebar { background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(240,244,248,.95)); }
body.light-mode .topbar { background: rgba(255,255,255,.85); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(0,255,255,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7;transition:background 0.3s,color 0.3s}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(0,212,255,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(10,18,32,.78),rgba(5,10,20,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative;transition:background 0.3s,border 0.3s}
.glass-s{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:var(--rs);transition:background 0.3s}
.hv{transition:.28s}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:fixed;inset-inline-end:0;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(10,18,32,.96),rgba(5,10,20,.92));border-inline-start:1px solid var(--border);z-index:60;transition:transform 0.3s}
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-inline-start:264px}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);color:#050a14;font-size:20px}
.brand-name{font-weight:900;font-size:17px;color:var(--gold-l)}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(0,212,255,.10);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(0,212,255,.24),rgba(0,212,255,.03));color:#a0e8ff}
.nav-ico{width:24px;text-align:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(5,10,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:60px;transition:background 0.3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 10px 28px rgba(0,212,255,.42)}
.btn-p:hover{box-shadow:0 14px 40px rgba(0,212,255,.55);transform:translateY(-2px)}
.btn-s{background:rgba(0,212,255,.08);color:var(--gold-l);border:1px solid var(--border)}
.btn-s:hover{background:rgba(0,212,255,.16);border-color:var(--border2)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.h2{font-size:22px;font-weight:800}
.h3{font-size:18px;font-weight:800}
.h4{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#00ffff,#a0e8ff 50%,#00d4ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill-b{background:rgba(0,212,255,.16);color:var(--gold-l);border-color:rgba(0,212,255,.35)}
.pill-g{background:rgba(34,197,94,.16);color:#6ee7a0;border-color:rgba(34,197,94,.32)}
.pill-r{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.bar{height:9px;border-radius:20px;background:rgba(0,212,255,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(0,212,255,.08);border:1px solid var(--border);transition:.2s;font-size:16px;color:var(--gold);position:relative;flex-shrink:0;cursor:pointer}
.icon-btn:hover{background:rgba(0,212,255,.18);border-color:var(--border2)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted);background:var(--bg);text-align:center}
.spinner{width:48px;height:48px;border:3px solid rgba(0,212,255,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.24s;cursor:pointer;padding:16px}
.card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.theme-dots{display:flex;gap:8px;padding:10px;flex-wrap:wrap;justify-content:center}
.t-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:.2s}
.t-dot.active{border:3px solid #fff;transform:scale(1.1)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:440px}
.toast{pointer-events:auto;min-width:280px;padding:14px;border-radius:16px;background:rgba(10,18,32,.98);border:1px solid var(--border2);box-shadow:0 10px 30px rgba(0,0,0,.7);display:flex;align-items:flex-start;gap:12px}
.toast-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.2);color:#6ee7a0}
.toast.err .toast-ico{background:rgba(239,68,68,.2);color:#fca5a5}
.toast.warn .toast-ico{background:rgba(245,158,11,.2);color:#fcd34d}
.toast.info .toast-ico{background:rgba(0,212,255,.2);color:#00ffff}
.toast-title{font-weight:800;font-size:14px;color:var(--gold-l)}
.toast-msg{font-size:12px;color:var(--txt2);margin-top:2px}
.flashcard{perspective:1000px;height:200px;cursor:pointer;margin-bottom:12px}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:20px;text-align:center;font-weight:700;font-size:16px;border:1px solid var(--border2)}
.flashcard-front{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,150,255,.08))}
.flashcard-back{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.08));transform:rotateY(180deg)}
.focus-timer{font-size:60px;font-weight:900;font-family:monospace;color:var(--gold);text-shadow:0 0 30px rgba(0,212,255,.5)}
@media(max-width:860px){
.sidebar{transform:translateX(100%)}
.sidebar.open{transform:translateX(0)!important}
.main{margin-inline-start:0}
.content{padding:14px}
.g2,.g3,.g4{grid-template-columns:1fr}
.mbar{display:grid!important}
}
.mbar{display:none}
</style>
</head>
<body data-theme="cyber">

<div id="loader" class="loading">
  <div class="spinner"></div>
  <div>جارٍ التحميل...</div>
</div>

<div id="app" class="app" style="display:none;">
  
  <div id="sidebarOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none;" onclick="toggleSidebar()"></div>
  
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🏆</div>
      <div>
        <div class="brand-name">MISSION EDU</div>
        <div class="brand-sub">المنصة التعليمية</div>
      </div>
    </div>
    
    <div style="flex:1;overflow-y:auto;">
      <div class="nav-gt">الرئيسية</div>
      <button class="nav-i on" onclick="navigate('home')"><span class="nav-ico">🏠</span><span>الرئيسية</span></button>
      <button class="nav-i" onclick="navigate('analytics')"><span class="nav-ico">📊</span><span>تحليلاتي</span></button>
      
      <div class="nav-gt">التعلم</div>
      <button class="nav-i" onclick="navigate('lessons')"><span class="nav-ico">📚</span><span>المواد</span></button>
      <button class="nav-i" onclick="navigate('exams')"><span class="nav-ico">📝</span><span>الاختبارات</span></button>
      <button class="nav-i" onclick="navigate('flashcards')"><span class="nav-ico">🃏</span><span>Flashcards</span></button>
      
      <div class="nav-gt">الأنشطة</div>
      <button class="nav-i" onclick="navigate('focus')"><span class="nav-ico">🎯</span><span>وضع التركيز</span></button>
      <button class="nav-i" onclick="navigate('calendar')"><span class="nav-ico">📅</span><span>تقويم المذاكرة</span></button>
      
      <div class="nav-gt">التواصل</div>
      <button class="nav-i" onclick="navigate('leaderboard')"><span class="nav-ico">🏆</span><span>المتصدرين</span></button>
      <button class="nav-i" onclick="navigate('messages')"><span class="nav-ico">💬</span><span>الرسائل</span></button>
      <button class="nav-i" onclick="navigate('notifications')"><span class="nav-ico">🔔</span><span>الإشعارات</span></button>
      
      <div class="nav-gt">الحساب</div>
      <button class="nav-i" onclick="navigate('xp-shop')"><span class="nav-ico">🛒</span><span>متجر XP</span></button>
      <button class="nav-i" onclick="navigate('profile')"><span class="nav-ico">👤</span><span>ملفي</span></button>
    </div>

    <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px;">
      <div class="theme-dots">
        <div class="t-dot active" style="background:#00d4ff" onclick="setTheme('cyber', this)"></div>
        <div class="t-dot" style="background:#a855f7" onclick="setTheme('purple', this)"></div>
        <div class="t-dot" style="background:#22c55e" onclick="setTheme('green', this)"></div>
        <div class="t-dot" style="background:#f59e0b" onclick="setTheme('orange', this)"></div>
        <div class="t-dot" style="background:#ec4899" onclick="setTheme('pink', this)"></div>
      </div>
      <button class="nav-i" onclick="logout()" style="color:#fca5a5;"><span class="nav-ico">🚪</span><span>تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn mbar" onclick="toggleSidebar()">☰</button>
      <div class="flex center g8" style="margin-inline-start:auto;">
        <button class="icon-btn" onclick="toggleDarkMode()" id="themeToggleBtn">🌙</button>
        <button class="icon-btn" onclick="navigate('messages')">💬</button>
        <button class="icon-btn" onclick="navigate('notifications')">🔔</button>
        <button class="glass-s" onclick="navigate('profile')" style="padding:4px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;">
          <div id="topbarAvatar" style="width:30px;height:30px;border-radius:8px;background:rgba(0,212,255,.1);display:grid;place-items:center;">👤</div>
          <span class="sm" style="font-weight:700;" id="topbarName">...</span>
        </button>
      </div>
    </div>

    <div class="content" id="contentArea"></div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script>
const DB = window.MissionDB;
const state = {
  user: null,
  db: { users:[], subjects:[], units:[], lessons:[], exams:[], notifications:[], direct_messages:[], xp_shop_items:[], practice_sessions:[], focus_sessions:[], flashcards:[] },
  theme: 'cyber',
  isLight: false,
  charts: []
};

function showToast(msg, type = 'info', title = '') {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<div class="toast-ico">${type==='ok'?'✓':type==='err'?'✕':'i'}</div><div><div class="toast-title">${title||type}</div><div class="toast-msg">${msg}</div></div>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(()=>el.remove(), 300); }, 4000);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  const isOpen = sb.classList.contains('open');
  if (isOpen) {
    sb.classList.remove('open');
    ov.style.display = 'none';
  } else {
    sb.classList.add('open');
    ov.style.display = 'block';
  }
}

function setTheme(theme, el) {
  state.theme = theme;
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('stu_theme', theme);
  document.querySelectorAll('.t-dot').forEach(d => d.classList.remove('active'));
  if(el) el.classList.add('active');
  renderCurrentPage();
}

function toggleDarkMode() {
  state.isLight = !state.isLight;
  if (state.isLight) {
    document.body.classList.add('light-mode');
    document.getElementById('themeToggleBtn').innerText = '☀️';
    localStorage.setItem('stu_dark', 'false');
  } else {
    document.body.classList.remove('light-mode');
    document.getElementById('themeToggleBtn').innerText = '🌙';
    localStorage.setItem('stu_dark', 'true');
  }
  renderCurrentPage();
}

function logout() {
  DB.clearSession();
  window.location.replace('../auth/login.html');
}

let currentTab = 'home';

function navigate(page) {
  currentTab = page;
  document.querySelectorAll('.nav-i').forEach(b => b.classList.remove('on'));
  const btn = document.querySelector(`.nav-i[onclick*="'${page}'"]`);
  if(btn) btn.classList.add('on');
  
  if (window.innerWidth <= 860) toggleSidebar();
  document.getElementById('contentArea').innerHTML = `<div style="text-align:center;padding:50px;"><div class="spinner" style="margin:0 auto;"></div></div>`;
  
  setTimeout(() => {
    renderCurrentPage();
  }, 50);
}

function renderCurrentPage() {
  state.charts.forEach(c => c.destroy());
  state.charts = [];
  
  switch(currentTab) {
    case 'home': renderHome(); break;
    case 'lessons': renderLessons(); break;
    case 'exams': renderExams(); break;
    case 'leaderboard': renderLeaderboard(); break;
    case 'messages': renderMessages(); break;
    case 'notifications': renderNotifications(); break;
    case 'profile': renderProfile(); break;
    case 'xp-shop': renderXPShop(); break;
    case 'flashcards': renderFlashcards(); break;
    case 'focus': renderFocusMode(); break;
    case 'calendar': renderCalendar(); break;
    case 'analytics': renderAnalytics(); break;
    default: renderHome();
  }
}

function renderHome() {
  const u = state.user;
  const db = state.db;
  const totalLessons = db.lessons.length;
  const completed = (u.completed_lessons || []).length;
  const progress = totalLessons ? Math.round((completed/totalLessons)*100) : 0;
  
  document.getElementById('contentArea').innerHTML = `
    <div class="glass mb16" style="padding:20px;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.12));">
      <div class="flex between center wrap g12">
        <div>
          <div class="h2 mb6 grad">أهلاً، ${u.name.split(' ')[0]} 👋</div>
          <div class="sm txt2">مستواك الحالي: ${u.xp || 0} XP</div>
        </div>
        <div style="text-align:left;">
          <div class="sm muted mb6">التقدم الكلي</div>
          <div class="h2" style="color:var(--gold);">${progress}%</div>
        </div>
      </div>
      <div class="mt16">
        <div class="bar" style="height:10px;"><div class="bar-f bar-b" style="width:${progress}%;"></div></div>
        <div class="sm muted mt8">لقد أكملت ${completed} من أصل ${totalLessons} درس</div>
      </div>
    </div>
    
    <div class="grid g4 mb16">
      <div class="glass-s" style="padding:16px;"><div class="sm muted">الدروس المكتملة</div><div class="h2" style="color:var(--gold)">${completed}</div></div>
      <div class="glass-s" style="padding:16px;"><div class="sm muted">نقاط الخبرة</div><div class="h2" style="color:#22c55e">${u.xp||0}</div></div>
      <div class="glass-s" style="padding:16px;"><div class="sm muted">السلسلة</div><div class="h2" style="color:#f59e0b">${u.streak||0} يوم</div></div>
      <div class="glass-s" style="padding:16px;"><div class="sm muted">المستوى</div><div class="h2" style="color:#00ffff">Lv 1</div></div>
    </div>

    <div class="grid g2">
      <div class="glass" style="padding:20px;">
        <div class="h4 mb12" style="color:var(--gold);">📚 متابعة التعلم</div>
        <button class="btn btn-p btn-block" onclick="navigate('lessons')">تصفح المواد</button>
      </div>
      <div class="glass" style="padding:20px;">
        <div class="h4 mb12" style="color:var(--gold);">📝 الاختبارات</div>
        <button class="btn btn-s btn-block" onclick="navigate('exams')">عرض الاختبارات</button>
      </div>
    </div>
  `;
}

function renderLessons() {
  const subjects = state.db.subjects || [];
  let html = `<div class="h2 mb16 grad">📚 المواد الدراسية</div>`;
  if (subjects.length === 0) {
    html += `<div class="empty"><div class="empty-ico">📚</div><div class="h4">لا توجد مواد مضافة</div></div>`;
  } else {
    html += `<div class="grid g3">`;
    subjects.forEach(s => {
      html += `
        <div class="card" onclick="viewSubject('${s.id}')">
          <div style="font-size:32px;margin-bottom:10px;">${s.icon || '📚'}</div>
          <div class="h4">${s.name}</div>
        </div>
      `;
    });
    html += `</div>`;
  }
  document.getElementById('contentArea').innerHTML = html;
}

window.viewSubject = function(subjectId) {
  const subject = state.db.subjects.find(s => s.id === subjectId);
  const units = state.db.units.filter(u => u.subject_id === subjectId);
  const lessons = state.db.lessons.filter(l => {
    const unit = units.find(u => u.id === l.unit_id);
    return unit !== undefined;
  });

  let html = `
    <button class="btn btn-s btn-sm mb16" onclick="navigate('lessons')">← رجوع للمواد</button>
    <div class="h2 mb16 grad">${subject.icon} ${subject.name}</div>
  `;
  
  if (units.length === 0) {
    html += `<div class="glass" style="padding:30px;text-align:center;">لا توجد وحدات في هذه المادة بعد.</div>`;
  } else {
    units.forEach(u => {
      const uLessons = lessons.filter(l => l.unit_id === u.id);
      if (uLessons.length > 0) {
        html += `<div class="glass mb16" style="padding:18px;">
          <div class="h4 mb12" style="color:var(--gold);">📁 ${u.name}</div>
          <div class="grid g2">`;
        uLessons.forEach(l => {
          html += `<div class="glass-s hv" style="padding:14px;cursor:pointer;" onclick="window.location.href='lesson.html?id=${l.id}'">
            <div class="sm" style="font-weight:700;">${l.title}</div>
            <div class="xs muted mt6">+${l.xp || 0} XP</div>
          </div>`;
        });
        html += `</div></div>`;
      }
    });
  }
  document.getElementById('contentArea').innerHTML = html;
}

function renderLeaderboard() {

  if (users.length === 0) {
    html += `<div class="empty">لا يوجد طلاب</div>`;
  } else {
    users.slice(0, 50).forEach((u, i) => {
      html += `
        <div class="flex center g12" style="padding:10px 0;border-bottom:1px solid rgba(0,212,255,.08);">
          <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:${i===0?'#00d4ff':i===1?'#a8a8a8':i===2?'#cd7f32':'rgba(0,212,255,.1)'};color:${i<3?'#000':'#fff'};font-weight:800;">${i+1}</div>

  document.getElementById('contentArea').innerHTML = html;
}

window.changePassword = async function() {
  const {value:newPass} = await Swal.fire({
    title:'كلمة مرور جديدة',
    input:'password',
    inputPlaceholder:'على الأقل 6 أحرف',
    showCancelButton:true,
    confirmButtonText:'حفظ',
    cancelButtonText:'إلغاء',
    confirmButtonColor:'#00d4ff',
    cancelButtonColor:'#64748b',
    background:'#0a1220',
    color:'#e0f7ff'
  });
  if(newPass){
    try{
      await DB.updateUser(state.user.id,{password:newPass});
      showToast('تم تحديث كلمة المرور بنجاح', 'ok');
    }catch(e){
      showToast(e.message, 'err');
    }
  }
};

function renderXPShop() {
  const items = state.db.xp_shop_items || [];
  let html = `<div class="h2 mb16 grad">🛒 متجر XP</div>`;
  html += `<div class="glass mb16" style="padding:18px;display:flex;justify-content:space-between;align-items:center;">
    <span class="sm">رصيدك</span><span class="h3" style="color:var(--gold)">${state.user.xp || 0} XP</span>
  </div>`;
  
  if (items.length === 0) {
    html += `<div class="glass" style="padding:30px;"><div class="empty"><div class="empty-ico">🛒</div><div class="h4">لا توجد منتجات حالياً</div></div></div>`;
  } else {
    html += `<div class="grid g3">`;
    items.forEach(item => {
      html += `
        <div class="card" style="text-align:center;">
          <div style="font-size:48px;margin-bottom:8px;">${item.icon || '🎁'}</div>
          <div class="h4 mb6">${item.name}</div>
          <div class="sm muted mb12">${item.description || ''}</div>
          <div class="pill pill-b mb12" style="font-weight:900;">⚡ ${item.xp_cost} XP</div>
          <button class="btn btn-p btn-block" onclick="buyItem('${item.id}', ${item.xp_cost})">شراء</button>
        </div>
      `;
    });
    html += `</div>`;
  }
  document.getElementById('contentArea').innerHTML = html;
}

window.buyItem = async function(id, cost) {
  if ((state.user.xp || 0) < cost) return showToast('رصيد XP غير كافي', 'err');
  const r = await Swal.fire({
    title:'تأكيد الشراء',
    text:`هل تريد شراء هذا المنتج مقابل ${cost} XP؟`,
    showCancelButton:true,
    confirmButtonText:'شراء',
    cancelButtonText:'إلغاء',
    confirmButtonColor:'#00d4ff',
    background:'#0a1220',
    color:'#e0f7ff'
  });
  if(!r.isConfirmed) return;
  try {
    const sb = await DB.getClient();
    const {data, error} = await sb.rpc('purchase_shop_item', { p_item_id: id });
    if (error) throw new Error(error.message);
    showToast(`تم الشراء بنجاح!`, 'ok');
    state.user = await DB.getUser(state.user.id);
    renderXPShop();
  } catch(e) {
    showToast(e.message || 'فشل الشراء', 'err');
  }
};

  `;

let timerInterval;
let timeLeft = 25 * 60;
window.startTimer = function() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    const el = document.getElementById('timerDisplay');
    if(el) el.innerText = `${m}:${s}`;
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      showToast('انتهى وقت التركيز!', 'ok');
    }
  }, 1000);
};
window.resetTimer = function() {
  clearInterval(timerInterval);
  timeLeft = 25 * 60;
  const el = document.getElementById('timerDisplay');
  if(el) el.innerText = `25:00`;
};

async function init() {
  try {
    const savedTheme = localStorage.getItem('stu_theme');
    if(savedTheme) {
      state.theme = savedTheme;
      document.body.setAttribute('data-theme', savedTheme);
    }
    
    const isDark = localStorage.getItem('stu_dark') !== 'false';
    if(!isDark) toggleDarkMode();

    const sid = DB.getSessionId();
    if (!sid) {
      document.getElementById('loader').innerHTML = `<div style="color:#ef4444;text-align:center;padding:20px;">جلسة غير موجودة، جاري تحويلك لتسجيل الدخول...<br><script>setTimeout(()=>window.location.href='../auth/login.html',2000)<\/script></div>`;
      return;
    }

    state.user = await DB.getUser(sid);
    if (!state.user) {
      DB.clearSession();
      window.location.replace('../auth/login.html');
      return;
    }

    state.db = await DB.loadAll();
    
    document.getElementById('topbarName').innerText = state.user.name;
    document.getElementById('topbarAvatar').innerText = state.user.gender === 'female' ? '👧' : '👦';

    document.getElementById('loader').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    navigate('home');

  } catch (err) {
    console.error(err);
    document.getElementById('loader').innerHTML = `<div style="color:#ef4444;text-align:center;padding:20px;">حدث خطأ أثناء تحميل البيانات<br><small>${err.message}</small><br><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;border-radius:8px;background:#00d4ff;color:#000;border:none;cursor:pointer;">إعادة المحاولة</button></div>`;
  }
}

init();
</script>
