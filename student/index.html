<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060e" />
<title>MISSION EDU — منصة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(9,14,29,.94),rgba(6,9,20,.9));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 110px;max-width:1200px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 8px 26px rgba(47,125,255,.45)}
.brand-name{font-weight:900;font-size:17px}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(47,125,255,.09);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(47,125,255,.22),rgba(47,125,255,.03));color:#fff}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#2f7dff,#8b5cf6)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:rgba(6,9,20,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:rgba(18,26,48,.7);border:1px solid var(--border);border-radius:14px;padding:8px 14px}
.search input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-g{background:rgba(47,125,255,.10);color:var(--blue2);border:1px solid var(--border2)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-wr{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h1{font-size:clamp(21px,3.2vw,30px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#5aa9ff,#a78bfa 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.flex{display:flex}
.between{justify-content:space-between}
.center{align-items:center}
.wrap{flex-wrap:wrap}
.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.pill-v{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.28)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar-f{height:100%;border-radius:20px;transition:width .8s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden}
.bar-f::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:400px 100%;animation:shimmer 2.4s infinite linear}
.bar-b{background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.bar-g{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bar-v{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(10,16,32,.72);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12)}
select.input{cursor:pointer;appearance:none;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237f93b8' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
textarea.input{resize:vertical;min-height:80px;font-family:inherit}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:14px;background:rgba(255,255,255,.035);border:1.5px solid var(--border);transition:.2s;cursor:pointer;text-align:right;width:100%;font-size:14.5px;color:var(--txt)}
.opt:hover{background:rgba(47,125,255,.09);border-color:var(--border2);transform:translateX(-3px)}
.opt.sel{background:rgba(47,125,255,.16);border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.10)}
.opt.ok{background:rgba(34,197,94,.15);border-color:var(--green)}
.opt.bad{background:rgba(239,68,68,.14);border-color:var(--red)}
.opt-l{width:32px;height:32px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:800;font-size:13px}
.opt.sel .opt-l{background:var(--blue);color:#fff}
.opt.ok .opt-l{background:var(--green);color:#fff}
.opt.bad .opt-l{background:var(--red);color:#fff}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:var(--border);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(90,140,230,.08)}
.sx{overflow-x:auto}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.avatar-lg{width:64px;height:64px;border-radius:18px;font-size:24px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border);transition:.2s;font-size:16px;color:var(--txt)}
.icon-btn:hover{background:rgba(47,125,255,.15);border-color:var(--border2)}
.hero{padding:24px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(47,125,255,.18),rgba(139,92,246,.12) 50%,rgba(6,182,212,.08));border:1px solid var(--border)}
.ring{position:relative;display:grid;place-items:center}
.ring-t{position:absolute;text-align:center}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:12px}
.vid-shell{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(140deg,#000,#0a1124);border:1px solid var(--border);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.vid-shell iframe,.vid-shell video{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
.vid-watermark{position:absolute;bottom:14px;inset-inline-end:14px;z-index:6;font-size:11px;font-weight:700;color:rgba(255,255,255,.32);pointer-events:none;user-select:none;letter-spacing:.6px;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.vid-custom-cover{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.55));cursor:pointer;transition:opacity .35s}
.vid-custom-cover.hidden{opacity:0;pointer-events:none}
.play-big{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;box-shadow:0 14px 44px rgba(47,125,255,.6);padding-inline-start:6px}
.vid-meta-bar{position:absolute;bottom:0;inset-inline:0;z-index:3;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);pointer-events:none}
.vid-progress-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.5)}
.eb{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.rank-2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#000}
.rank-3{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.rank-x{background:rgba(255,255,255,.06);color:var(--muted)}
.lock{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(21,31,56,.98),rgba(11,17,34,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.65);animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(47,125,255,.18);color:#7db6ff}
.toast.info .toast-bar-f{background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,.82);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.mbar{display:none}
.btmnav{display:none}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);position:relative;flex-wrap:wrap}
.footer-dev::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:120px;height:1px;background:linear-gradient(90deg,transparent,#2f7dff,transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s cubic-bezier(.2,.8,.3,1);border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));border-color:rgba(90,140,230,.3);color:var(--txt);position:relative;overflow:hidden}
.dev-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);transition:transform .7s}
.dev-btn:hover::before{transform:translateX(100%)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900;letter-spacing:.3px}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.tg-btn{background:rgba(34,158,217,.12);border-color:rgba(34,158,217,.3);color:#7dd3fc}
.tg-btn:hover{background:rgba(34,158,217,.22);border-color:#229ed9;color:#fff;transform:translateY(-2px);box-shadow:0 10px 26px rgba(34,158,217,.3)}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;box-shadow:0 24px 70px rgba(0,0,0,.75) !important;font-family:'Tajawal','Cairo',sans-serif !important;backdrop-filter:blur(20px)}
.swal-custom-title{color:#e8eefc !important;font-size:20px !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input:focus{border-color:#2f7dff !important;box-shadow:0 0 0 4px rgba(47,125,255,.15) !important}
.swal-custom-confirm{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
.swal-custom-cancel{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
.swal2-html-container{color:#b7c6e4 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal2-validation-message{background:rgba(239,68,68,.15) !important;color:#fca5a5 !important;border-radius:10px !important;border:1px solid rgba(239,68,68,.3) !important;font-family:'Tajawal','Cairo',sans-serif !important}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;box-shadow:-20px 0 60px rgba(0,0,0,.7)}
  .sidebar.open{transform:translateX(0)!important}
  .mbar{display:flex}
  .content{padding:14px 14px 100px}
  .topbar{padding:10px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g-auto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .btmnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:55;background:rgba(6,9,20,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 6px;justify-content:space-around;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .btmnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:700;transition:.2s}
  .btmnav button.on{color:var(--blue2);background:rgba(47,125,255,.12)}
  .btmnav .i{font-size:19px;display:flex;justify-content:center}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);
  useEffect(()=>{
    const start=Date.now();
    const t=setInterval(()=>{
      const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);
      setProgress(p);
      if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}
    },40);
    return()=>clearInterval(t);
  },[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
    <div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [attempts,setAttempts]=useState([]);
  const [errors,setErrors]=useState([]);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{const data=await DB.loadAll();setDb(data);}catch(e){console.warn(e);}
  },[]);

  const reloadUserData=useCallback(async ()=>{
    if(!currentUser) return;
    try{
      const [a,e]=await Promise.all([DB.getAttempts(currentUser.id),DB.getErrors(currentUser.id)]);
      setAttempts(a);
      setErrors(e);
      const u=await DB.getUser(currentUser.id);
      if(u) setCurrentUser(u);
    }catch(e){}
  },[currentUser]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('/auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}
        if(u.role==='admin'){window.location.replace('/admin/index.html');return;}
        setCurrentUser(u);
        const [a,e]=await Promise.all([DB.getAttempts(u.id),DB.getErrors(u.id)]);
        setAttempts(a);
        setErrors(e);
        await reload();
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  const logout=useCallback(()=>{
    Swal.fire({
      title: 'تسجيل الخروج',
      text: 'هل أنت متأكد من رغبتك في الخروج؟',
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'نعم، خروج',
      cancelButtonText: 'إلغاء',
      confirmButtonColor: '#ef4444',
      cancelButtonColor: '#64748b',
      background: 'linear-gradient(180deg, #151f38, #0b1122)',
      color: '#e8eefc',
      customClass: {popup: 'swal-custom-popup', title: 'swal-custom-title'}
    }).then((result) => {
      if (result.isConfirmed) {
        DB.clearSession();
        window.location.replace('/auth/login.html');
      }
    });
  },[]);

  const updateUser=useCallback(async (id,patch)=>{
    const u=await DB.updateUser(id,patch);
    setCurrentUser(u);
    return u;
  },[]);
  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  return <AppCtx.Provider value={{
    db,currentUser,attempts,errors,loading,logout,updateUser,reload,reloadUserData,getLevel,toast,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

  const p={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:color,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'};
  const paths={
    home:<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
    book:<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>,
    target:<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
    trophy:<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>,
    alert:<><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    medal:<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
    bell:<><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
    user:<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    menu:<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>,
    search:<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    close:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    check:<><polyline points="20 6 9 17 4 12"/></>,
    logout:<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
    play:<><polygon points="5 3 19 12 5 21 5 3"/></>,
    video:<><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></>,
    flame:<><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></>,
    zap:<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>,
    award:<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
    clipboard:<><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></>
  };
  return <svg {...p}>{paths[name]}</svg>;
};

function Stat({label,value,icon,color='var(--blue)',sub}){
  return <div className="glass-s hv" style={{padding:16}}>
    <div className="flex between center mb8">
      <div className="stat-l">{label}</div>
      <div style={{color}}>{typeof icon==='string'?<Icon name={icon} size={20}/>:icon}</div>
    </div>
    <div className="stat-n" style={{color}}>{value}</div>
    {sub&&<div className="xs muted mt8">{sub}</div>}
  </div>;
}
function Empty({icon='📭',title,desc}){
  return <div className="empty">
    <div className="empty-ico">{icon}</div>
    <div className="h4 txt2 mb8">{title}</div>
    {desc&&<div className="sm">{desc}</div>}
  </div>;
}
function Ring({value,size=120,stroke=10,color='#2f7dff',children}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c-(value/100)*c;
  return <div className="ring" style={{width:size,height:size}}>
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,.07)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:'stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)'}}/>
    </svg>
    <div className="ring-t">{children}</div>
  </div>;
}

function SecureVideoPlayer({video,lessonTitle,user}){
  const ref = useRef(null);
  const playerRef = useRef(null);

  useEffect(()=>{
    if (!ref.current || !window.SecureVideoPlayer) return;
    
    const watermark = user?.phone 
      ? `ID: ${user.phone}` 
      : (user?.name ? `ID: ${user.name}` : "USER");

    const player = new window.SecureVideoPlayer({
      container: ref.current,
      video: video,
      lessonTitle: lessonTitle,
      watermark: watermark,
      onPlay: () => {
        DB.trackActivity({
          userId: user.id,
          userName: user.name,
          type: "video_play",
          target: lessonTitle,
          details: { lesson: lessonTitle }
        });
      },
      onTimeUpdate: (percent, current, duration, milestone) => {
        if (milestone === "p25") {
          DB.trackActivity({
            userId: user.id, userName: user.name,
            type: "video_25", target: lessonTitle,
            details: { lesson: lessonTitle }
          });
        }
        if (milestone === "p50") {
          DB.trackActivity({
            userId: user.id, userName: user.name,
            type: "video_50", target: lessonTitle,
            details: { lesson: lessonTitle }
          });
        }
        if (milestone === "p75") {
          DB.trackActivity({
            userId: user.id, userName: user.name,
            type: "video_75", target: lessonTitle,
            details: { lesson: lessonTitle }
          });
        }
      },
      onComplete: () => {
        DB.trackActivity({
          userId: user.id, userName: user.name,
          type: "video_complete", target: lessonTitle,
          details: { lesson: lessonTitle }
        });
      }
    });

    playerRef.current = player;

    return () => {
      if (playerRef.current) playerRef.current.destroy();
    };
  }, [video?.url, lessonTitle, user?.id]);

  return <div ref={ref} />;
}
function Sidebar({items,active,onNav,open,onClose}){
  return <>
    {open&&<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:55}}/>}
    <aside className={`sidebar ${open?'open':''}`}>
      <div className="brand">
        <div className="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
        </div>
        <div><div className="brand-name">MISSION EDU</div><div className="brand-sub">منصة المهام</div></div>
      </div>
      {items.map((g,gi)=><div key={gi}>
        {g.title&&<div style={{fontSize:10.5,fontWeight:800,color:'var(--muted)',letterSpacing:1,padding:'14px 14px 4px'}}>{g.title}</div>}
        {g.items.map(it=><button key={it.id} className={`nav-i ${active===it.id?'on':''}`} onClick={()=>{onNav(it.id);onClose?.();}}>
          <span className="nav-ico"><Icon name={it.icon} size={16}/></span>
          <span>{it.label}</span>
          {it.badge!=null&&<span className="pill pill-b" style={{marginInlineStart:'auto'}}>{it.badge}</span>}
        </button>)}
      </div>)}
    </aside>
  </>;
}

function Topbar({user,onMenu,onLogout,onSearch,searchResults,onResultClick}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!q.trim()){setOpen(false);return;}
    setOpen(true);
    const t=setTimeout(()=>onSearch?.(q),150);
    return()=>clearTimeout(t);
  },[q]);
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}><Icon name="menu" size={16}/></button>
    <div style={{position:'relative',flex:1,maxWidth:520}}>
      <div className="search">
        <Icon name="search" size={15} color="var(--muted)"/>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث عن درس، اختبار..."/>
        {q&&<button onClick={()=>{setQ('');setOpen(false);}} style={{opacity:.6,color:'var(--txt)'}}><Icon name="close" size={14}/></button>}
      </div>
      {open&&searchResults?.length>0&&<div className="glass" style={{position:'absolute',top:'calc(100% + 8px)',insetInline:0,padding:8,zIndex:80,maxHeight:340,overflowY:'auto'}}>
        {searchResults.slice(0,10).map((r,i)=><button key={i} className="nav-i" onClick={()=>{onResultClick(r);setQ('');setOpen(false);}}>
          <span className="nav-ico">{r.icon}</span>
          <div style={{flex:1,textAlign:'right'}}>
            <div style={{fontSize:13.5}}>{r.title}</div>
            <div className="xs muted">{r.type}</div>
          </div>
        </button>)}
      </div>}
    </div>
    <div className="flex center g8" style={{marginInlineStart:'auto'}}>
      <div className="glass-s" style={{padding:'5px 12px',display:'flex',alignItems:'center',gap:8}}>
        <div className="avatar" style={{width:32,height:32,fontSize:15}}>{user.avatar||'👤'}</div>
      </div>
      <button className="icon-btn" onClick={onLogout}><Icon name="logout" size={16}/></button>
    </div>
  </div>;
}

function Home({onNav,setSelected}){
  const app=useApp();
  const u=app.currentUser;
  const {current,next}=app.getLevel(u.xp||0);
  const access=u.all_subjects?app.db.subjects.map(s=>s.id):(u.access_subjects||[]);
  const accessibleLessons=app.db.lessons.filter(l=>{
    const un=app.db.units.find(x=>x.id===l.unit_id);
    return un&&access.includes(un.subject_id)&&l.published!==false;
  });
  const doneLessons=accessibleLessons.filter(l=>(u.completed_lessons||[]).includes(l.id));
  const progressPct=DB.pct(doneLessons.length,accessibleLessons.length);
  const userMissions=app.db.missions.filter(m=>access.includes(m.subject_id));
  const currentMission=userMissions.sort((a,b)=>a.sort_order-b.sort_order).find(m=>!(u.completed_missions||[]).includes(m.id));
  const top10=useMemo(()=>[...app.db.users.filter(x=>x.role==='student'&&x.active!==false)].sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10),[app.db.users]);
  const recentAttempts=useMemo(()=>[...(app.attempts||[])].slice(0,3),[app.attempts]);

  return <>
    <div className="hero mb16">
      <div className="flex between wrap center g16">
        <div>
          <div className="h2 mb6">أهلًا بك {u.name.split(' ')[0]} 👋</div>
          <div className="sm txt2 mb12">مهمتك الحالية في انتظارك. خطوة واحدة كل يوم.</div>
          {currentMission?
            <button className="btn btn-p btn-lg" onClick={()=>{setSelected({type:'mission',id:currentMission.id});onNav('missions');}}>
              <Icon name="play" size={14} color="#fff"/> ابدأ مهمتك
            </button>:
            <button className="btn btn-g btn-lg" onClick={()=>onNav('subjects')}>
              <Icon name="book" size={14}/> استعرض المواد
            </button>
          }
        </div>
        <div className="flex center g16">
          <Ring value={progressPct} size={110} stroke={9} color="#2f7dff">
            <div className="stat-n">{progressPct}%</div>
            <div className="xs muted">التقدم</div>
          </Ring>
          <Ring value={next?DB.pct((u.xp-current.xp),next.xp-current.xp):100} size={90} stroke={8} color="#8b5cf6">
            <div style={{fontWeight:900}}>Lv {current.level}</div>
            <div className="xs muted">{current.name}</div>
          </Ring>
        </div>
      </div>
    </div>

    <div className="grid g4 mb16">
      <Stat label="نقاط XP" value={DB.fmt(u.xp||0)} icon="zap" color="#5aa9ff"/>
      <Stat label="سلسلة المذاكرة" value={`${u.streak||0}`} icon="flame" color="#f59e0b"/>
      <Stat label="الدروس المكتملة" value={DB.fmt(doneLessons.length)} icon="book" color="#22c55e" sub={`من ${accessibleLessons.length}`}/>
      <Stat label="الإنجازات" value={DB.fmt((u.achievements||[]).length)} icon="trophy" color="#8b5cf6"/>
    </div>

    {currentMission&&<div className="glass mb16" style={{padding:20}}>
      <div className="flex between center mb12">
        <div className="h3" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="target" size={18}/> مهمتك الحالية</div>
        <span className="pill pill-b">+{currentMission.xp} XP</span>
      </div>
      <div className="h4 mb6">{currentMission.title}</div>
      <div className="sm muted mb16">{currentMission.desc}</div>
      <button className="btn btn-p" onClick={()=>{setSelected({type:'mission',id:currentMission.id});onNav('missions');}}>عرض المهمة ←</button>
    </div>}

    <div className="glass mb16" style={{padding:18}}>
      <div className="flex between center mb12">
        <div className="h3" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="medal" size={18}/> المتصدرون العشرة</div>
        <button className="btn btn-s btn-sm" onClick={()=>onNav('leaderboard')}>الكل</button>
      </div>
      {top10.length===0?<div className="sm muted" style={{textAlign:'center',padding:12}}>لا يوجد طلاب بعد</div>:
        top10.map((s,i)=>{
          const {current:c}=app.getLevel(s.xp||0);
          const isMe=s.id===u.id;
          return <div key={s.id} className="flex center g12" style={{padding:'9px 0',borderBottom:'1px solid rgba(90,140,230,.08)',background:isMe?'rgba(47,125,255,.06)':'transparent',borderRadius:isMe?10:0,paddingInline:isMe?10:0}}>
            <div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div>
            <div className="avatar" style={{width:34,height:34,fontSize:14}}>{s.avatar||'👤'}</div>
            <div style={{flex:1}}>
              <div className="sm">{s.name} {isMe&&<span className="pill pill-b" style={{marginInlineStart:6}}>أنت</span>}</div>
              <div className="xs muted">Lv {c.level} — {c.name}</div>
            </div>
            <span className="pill pill-b">{DB.fmt(s.xp||0)} XP</span>
          </div>;
        })
      }
    </div>

    <div className="glass" style={{padding:18}}>
      <div className="flex between center mb12">
        <div className="h3" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="clipboard" size={18}/> آخر الاختبارات</div>
        <button className="btn btn-s btn-sm" onClick={()=>onNav('subjects')}>الكل</button>
      </div>
      {recentAttempts.length===0?<div className="sm muted" style={{textAlign:'center',padding:12}}>لم تجرِ اختبارًا بعد</div>:
        recentAttempts.map((a,i)=>{
          const e=app.exam(a.exam_id);
          if(!e) return null;
          return <div key={i} className="flex center g12" style={{padding:'9px 0',borderBottom:'1px solid rgba(90,140,230,.08)'}}>
            <div style={{color:a.passed?'var(--green)':'var(--red)'}}><Icon name={a.passed?'check':'close'} size={18}/></div>
            <div style={{flex:1}}>
              <div className="sm">{e.title}</div>

}

function ExamRunner({examId,onBack}){
  const app=useApp();
  const u=app.currentUser;
  const exam=app.exam(examId);
  const [started,setStarted]=useState(false);
  const [answers,setAnswers]=useState({});
  const [current,setCurrent]=useState(0);
  const [submitted,setSubmitted]=useState(false);
  const [timeLeft,setTimeLeft]=useState(exam?exam.duration*60:0);
  const [result,setResult]=useState(null);

  useEffect(()=>{
    if(!started||submitted) return;
    const t=setInterval(()=>setTimeLeft(x=>{
      if(x<=1){clearInterval(t);submit();return 0;}
      return x-1;
    }),1000);
    return()=>clearInterval(t);
  },[started,submitted]);

  if(!exam) return <Empty icon="❓" title="الاختبار غير موجود"/>;
  const qs=(exam.question_ids||[]).map(id=>app.question(id)).filter(Boolean);
  const attempts=(app.attempts||[]).filter(a=>a.exam_id===exam.id);
  const canTry=attempts.length<(exam.max_attempts||99);

  const start=()=>{
    setStarted(true);
    DB.trackActivity({userId:u.id,userName:u.name,type:'exam_start',target:exam.title,details:{exam:exam.title}});
  };

  const submit=async ()=>{
    let score=0;
    for(let i=0;i<qs.length;i++){
      const q=qs[i];
      const given=answers[i];
      if(given===q.correct[0]) score++;
      else await DB.saveError({userId:u.id,questionId:q.id,given:given??-1,correct:q.correct[0],lessonId:q.lesson_id});
    }
    const total=qs.length;
    const p=DB.pct(score,total);
    const passed=p>=exam.pass_score;
    const gained=passed?(exam.xp||0):Math.round((exam.xp||0)*0.3);
    try{await DB.saveAttempt({userId:u.id,examId:exam.id,score,total,pct:p,passed,answers});}catch(e){}
    await app.updateUser(u.id,{xp:(u.xp||0)+gained});
    DB.trackActivity({userId:u.id,userName:u.name,type:'exam_submit',target:exam.title,details:{score,total,pct:p,passed}});
    setResult({score,total,pct:p,passed,answers:{...answers}});
    setSubmitted(true);
    if(passed) app.toast.ok(`🎉 نجحت بـ ${p}% — +${gained} XP`);
    else app.toast.warn(`حصلت على ${p}%`);
    await app.reloadUserData();
  };

  if(!started) return <>
    <button className="btn btn-s btn-sm mb16" onClick={onBack}>← رجوع</button>
    <div className="glass" style={{padding:24,maxWidth:640,margin:'0 auto'}}>
      <div className="h1 mb8">{exam.title}</div>
      <div className="grid g2 mb16">
        <Stat label="عدد الأسئلة" value={qs.length} icon="clipboard"/>
        <Stat label="المدة" value={`${exam.duration}د`} icon="clipboard"/>
        <Stat label="درجة النجاح" value={`${exam.pass_score}%`} icon="target"/>
        <Stat label="المكافأة" value={`+${exam.xp} XP`} icon="zap"/>
      </div>
      {attempts.length>0&&<div className="glass-s mb16" style={{padding:12}}>
        <div className="sm mb6"><b>محاولاتك السابقة:</b></div>
        {attempts.map((a,i)=><div key={i} className="flex between center xs" style={{padding:'4px 0'}}>
          <span className="muted">محاولة {i+1}</span>
          <span className={a.passed?'pill pill-g':'pill pill-r'}>{a.pct}%</span>
        </div>)}
      </div>}
      <button className="btn btn-p btn-block btn-lg" disabled={!canTry} onClick={start}>
        {canTry?'▶️ بدء الاختبار':`🚫 استنفدت المحاولات (${exam.max_attempts})`}
      </button>
    </div>
  </>;

  if(submitted&&result) return <>
    <button className="btn btn-s btn-sm mb16" onClick={onBack}>← رجوع</button>
    <div className="glass mb16" style={{padding:24,textAlign:'center'}}>
      <div style={{fontSize:64,marginBottom:8}}>{result.passed?'🎉':'💪'}</div>
      <div className="h1 mb6">{result.passed?'أحسنت!':'حاول مرة أخرى'}</div>
      <div className="sm muted mb16">حصلت على {result.score} من {result.total}</div>
      <Ring value={result.pct} size={140} stroke={10} color={result.passed?'#22c55e':'#f59e0b'}>
        <div className="h1">{result.pct}%</div>
      </Ring>
    </div>
    <div className="h3 mb12">📋 مراجعة الإجابات</div>
    {qs.map((q,i)=>{
      const given=result.answers[i];
      const correct=given===q.correct[0];
      return <div key={q.id} className="glass mb12" style={{padding:16}}>
        <div className="flex between center mb8">
          <span className={`pill ${correct?'pill-g':'pill-r'}`}>{correct?'✓ صحيح':'✗ خطأ'}</span>
          <span className="xs muted">سؤال {i+1}</span>
        </div>
        <div className="h4 mb12">{q.text}</div>
        <div className="flex col g6 mb12">
          {(q.options||[]).map((op,oi)=>{
            const isGiven=given===oi,isCorrect=q.correct[0]===oi;
            let cls='';
            if(isCorrect)cls='ok';
            else if(isGiven)cls='bad';
            return <div key={oi} className={`opt ${cls}`} style={{cursor:'default'}}>
              <div className="opt-l">{['أ','ب','ج','د','هـ'][oi]}</div>
              <div>{op}</div>
            </div>;
          })}
        </div>
        <div className="glass-s" style={{padding:10}}>
          <div className="xs muted mb6"><b style={{color:'var(--blue2)'}}>💡 الشرح:</b> {q.explanation}</div>
          {q.lesson_id&&app.lesson(q.lesson_id)&&<div className="xs">📖 الدرس: <b>{app.lesson(q.lesson_id).title}</b></div>}
        </div>
      </div>;
    })}
    <button className="btn btn-p btn-block" onClick={onBack}>🏠 العودة</button>
  </>;

  const q=qs[current];
  const answered=Object.keys(answers).length;
  const mins=Math.floor(timeLeft/60);
  const secs=timeLeft%60;

  return <>
    <div className="glass mb12" style={{padding:14}}>
      <div className="flex between center wrap g8 mb8">
        <div className="h4">{exam.title}</div>
        <div className="flex g8 center">
          <span className="pill pill-b">⏱ {mins}:{String(secs).padStart(2,'0')}</span>
          <span className="pill pill-y">{answered}/{qs.length}</span>
        </div>
      </div>
      <div className="bar"><div className="bar-f bar-b" style={{width:`${DB.pct(answered,qs.length)}%`}}/></div>
    </div>
    <div className="glass" style={{padding:22}}>
      <div className="xs muted mb8">سؤال {current+1} من {qs.length}</div>
      <div className="h3 mb16">{q.text}</div>
      <div className="flex col g8 mb20">
        {(q.options||[]).map((op,oi)=><button key={oi} className={`opt ${answers[current]===oi?'sel':''}`} onClick={()=>setAnswers({...answers,[current]:oi})}>
          <div className="opt-l">{['أ','ب','ج','د','هـ'][oi]}</div>
          <div>{op}</div>
        </button>)}
      </div>
      <div className="flex between g8">
        <button className="btn btn-s" disabled={current===0} onClick={()=>setCurrent(c=>c-1)}>← السابق</button>
        {current<qs.length-1?
          <button className="btn btn-p" onClick={()=>setCurrent(c=>c+1)}>التالي →</button>:
          <button className="btn btn-ok" onClick={submit}>✓ إرسال الإجابات</button>
        }
      </div>
    </div>
  </>;
}

            </div>}
            {!done&&canComplete&&<button className="btn btn-ok btn-block" onClick={()=>complete(m)}>🎉 استلام المكافأة</button>}
            {!done&&!canComplete&&reqs.length>0&&<div className="sm muted" style={{textAlign:'center',padding:8}}>أكمل المتطلبات أعلاه</div>}
            {done&&<div className="sm" style={{textAlign:'center',color:'var(--green)',fontWeight:700}}>🎯 مكتملة</div>}
          </div>;
        })}
      </div>
    }
  </>;
}

function Achievements(){
  const app=useApp();
  const u=app.currentUser;
  return <>
    <div className="h2 mb16">الإنجازات</div>
    {app.db.achievements.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏆" title="لا توجد إنجازات"/></div>:
      <div className="grid g-auto">
        {app.db.achievements.map(a=>{
          const got=(u.achievements||[]).includes(a.id);
          return <div key={a.id} className={`glass hv ${got?'':'lock'}`} style={{padding:20,textAlign:'center'}}>
            <div style={{fontSize:44,marginBottom:8}}>{a.icon}</div>
            <div className="h4 mb6">{a.title}</div>
            <div className="sm muted mb12">{a.desc}</div>
            {got?<span className="pill pill-g">✓ محقق</span>:<span className="pill pill-y">🔒 مقفول</span>}
          </div>;
        })}
      </div>
    }
  </>;
}

function ErrorBook(){
  const app=useApp();
  const errs=app.errors;
  return <>
    <div className="h2 mb16">دفتر أخطائي</div>
    {errs.length===0?<div className="glass" style={{padding:30}}><Empty icon="✨" title="لا توجد أخطاء — أحسنت!"/></div>:
      errs.map((e,i)=>{
        const q=app.question(e.question_id);
        if(!q) return null;
        const l=app.lesson(q.lesson_id);
        return <div key={i} className="glass mb12" style={{padding:16}}>
          <div className="flex between center mb8">
            <span className="pill pill-r">أخطأت {e.count||1} مرة</span>
            <span className="xs muted">{new Date(e.at).toLocaleDateString('ar-EG')}</span>
          </div>
          <div className="h4 mb12">{q.text}</div>
          <div className="grid g2 mb12">
            <div className="eb">
              <div className="xs muted">إجابتك</div>
              <div className="sm" style={{color:'var(--red)'}}>{q.options[e.given]||'—'}</div>
            </div>
            <div className="eb">
              <div className="xs muted">الإجابة الصحيحة</div>
              <div className="sm" style={{color:'var(--green)'}}>{q.options[q.correct[0]]}</div>
            </div>
          </div>
          <div className="glass-s" style={{padding:10}}>
            <div className="xs muted mb6"><b style={{color:'var(--blue2)'}}>💡 الشرح:</b> {q.explanation}</div>
            {l&&<div className="xs">📖 الدرس: <b>{l.title}</b></div>}
          </div>
        </div>;
      })
    }
  </>;
}

function Leaderboard(){
  const app=useApp();
  const u=app.currentUser;
  const top10=useMemo(()=>[...app.db.users.filter(x=>x.role==='student'&&x.active!==false)].sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10),[app.db.users]);
  return <>
    <div className="h2 mb16">المتصدرون العشرة</div>
    {top10.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏅" title="لا يوجد طلاب بعد"/></div>:
      <div className="glass" style={{padding:14}}>
        <div className="sx">
          <table className="tbl">
            <thead><tr><th>#</th><th>الطالب</th><th>XP</th><th>المستوى</th></tr></thead>
            <tbody>
              {top10.map((s,i)=>{
                const {current}=app.getLevel(s.xp||0);
                const isMe=s.id===u.id;
                return <tr key={s.id} style={{background:isMe?'rgba(47,125,255,.06)':'transparent'}}>
                  <td><div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div></td>
                  <td>
                    <div className="flex center g8">
                      <div className="avatar" style={{width:32,height:32,fontSize:14}}>{s.avatar||'👤'}</div>
                      <span>{s.name} {isMe&&<span className="pill pill-b" style={{marginInlineStart:6}}>أنت</span>}</span>
                    </div>
                  </td>
                  <td><b>{DB.fmt(s.xp||0)}</b></td>
                  <td><span className="pill pill-v">Lv {current.level} — {current.name}</span></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    }
  </>;
}

function Notifications(){
  const app=useApp();
  const u=app.currentUser;
  const list=app.db.notifications.filter(n=>n.target==='all'||n.target===u.id).sort((a,b)=>b.created_at-a.created_at);
  const markRead=async id=>{
    try{
      const n=list.find(x=>x.id===id);
      const readBy=[...(n.read_by||[])];
      if(!readBy.includes(u.id)) readBy.push(u.id);
      await DB.save('notifications',{...n,read_by:readBy});
      await app.reload();
    }catch(e){}
  };
  return <>
    <div className="h2 mb16">الإشعارات</div>
    {list.length===0?<div className="glass" style={{padding:30}}><Empty icon="🔕" title="لا توجد إشعارات"/></div>:
      list.map(n=>{
        const read=(n.read_by||[]).includes(u.id);
        return <div key={n.id} className={`glass mb12`} style={{padding:16,borderColor:read?'var(--border)':'var(--border2)'}}>
          <div className="flex between center mb6">
            <div className="h4">{n.title} {!read&&<span className="pill pill-b" style={{marginInlineStart:8}}>جديد</span>}</div>
            <span className="xs muted">{new Date(n.created_at).toLocaleDateString('ar-EG')}</span>
          </div>
          <div className="sm txt2 mb12">{n.body}</div>
          {!read&&<button className="btn btn-s btn-sm" onClick={()=>markRead(n.id)}>تحديد كمقروء</button>}
        </div>;
      })
    }
  </>;
}

function Profile(){
  const app=useApp();
  const u=app.currentUser;
  const {current,next}=app.getLevel(u.xp||0);
  return <>
    <div className="h2 mb16">الملف الشخصي</div>
    <div className="glass mb16" style={{padding:24}}>
      <div className="flex center g16 wrap">
        <div className="avatar avatar-lg">{u.avatar||'🧑‍🎓'}</div>
        <div style={{flex:1}}>
          <div className="h2 mb6">{u.name}</div>
          <div className="sm muted mb8" dir="ltr">{(u.country_code||'+20')}{u.phone||''}</div>
          <div className="flex wrap g8">
            <span className="pill pill-v">Lv {current.level} — {current.name}</span>
            {u.grade_id&&app.grade(u.grade_id)&&<span className="pill pill-b">{app.grade(u.grade_id).name}</span>}
            <span className="pill pill-a">🔥 {u.streak||0} يوم</span>
          </div>
        </div>
      </div>
      <div className="div"/>
      <div className="grid g3">
        <Stat label="نقاط XP" value={DB.fmt(u.xp||0)} icon="zap" color="#5aa9ff"/>
        <Stat label="دروس مكتملة" value={DB.fmt((u.completed_lessons||[]).length)} icon="book" color="#22c55e"/>
        <Stat label="إنجازات" value={DB.fmt((u.achievements||[]).length)} icon="trophy" color="#f59e0b"/>
      </div>
      {next&&<>
        <div className="div"/>
        <div className="sm muted mb6">المستوى التالي: {next.name} — {DB.fmt(next.xp)} XP</div>
        <div className="bar"><div className="bar-f bar-v" style={{width:`${DB.pct((u.xp||0)-current.xp,next.xp-current.xp)}%`}}/></div>
      </>}
    </div>
    <div className="glass" style={{padding:20}}>
      <div className="h4 mb12">تسجيل الخروج</div>
      <div className="sm muted mb12">سيتم إنهاء جلستك والعودة لصفحة الدخول.</div>
      <button className="btn btn-p" onClick={app.logout}>تسجيل الخروج</button>
    </div>
  </>;
}

function StudentApp(){
  const app=useApp();
  const user=app.currentUser;
  const [tab,setTab]=useState('home');
  const [selected,setSelected]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchResults,setSearchResults]=useState([]);

  const unread=app.db.notifications.filter(n=>(n.target==='all'||n.target===user.id)&&!(n.read_by||[]).includes(user.id)).length;

  const items=[{title:'',items:[
    {id:'home',icon:'home',label:'الرئيسية'},
    {id:'subjects',icon:'book',label:'المواد'},
    {id:'missions',icon:'target',label:'المهام'},
    {id:'achievements',icon:'trophy',label:'الإنجازات'},
    {id:'errors',icon:'alert',label:'دفتر أخطائي'},
    {id:'leaderboard',icon:'medal',label:'المتصدرون'},
    {id:'notifications',icon:'bell',label:'الإشعارات',badge:unread||null},
    {id:'profile',icon:'user',label:'الملف الشخصي'}
  ]}];

  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    const access=user.all_subjects?app.db.subjects.map(s=>s.id):(user.access_subjects||[]);
    app.db.lessons.filter(l=>{
      const un=app.unit(l.unit_id);
      return un&&access.includes(un.subject_id)&&l.published!==false&&(l.title.toLowerCase().includes(lc)||(l.desc||'').toLowerCase().includes(lc));
    }).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="book" size={16}/>,title:l.title,nav:'lesson',lessonId:l.id}));
    app.db.exams.filter(e=>access.includes(e.subject_id)&&e.title.toLowerCase().includes(lc)).forEach(e=>res.push({type:'اختبار',icon:<Icon name="clipboard" size={16}/>,title:e.title,nav:'exam',examId:e.id}));
    app.db.subjects.filter(s=>access.includes(s.id)&&s.name.toLowerCase().includes(lc)).forEach(s=>res.push({type:'مادة',icon:s.icon||'📚',title:s.name,nav:'subject',subjectId:s.id}));
    setSearchResults(res);
  };
  const onResultClick=r=>{
    if(r.nav==='lesson'){setSelected({type:'lesson',id:r.lessonId});setTab('lesson');}
    else if(r.nav==='exam'){setSelected({type:'exam',id:r.examId});setTab('exam');}
    else if(r.nav==='subject'){setSelected({type:'subject',id:r.subjectId});setTab('subject');}
  };
  const nav=t=>{setTab(t);setSelected(null);};

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={nav} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} onSearch={onSearch} searchResults={searchResults} onResultClick={onResultClick}/>
      <div className="content">
        {tab==='home'&&<Home onNav={nav} setSelected={setSelected}/>}
        {tab==='subjects'&&<Subjects setSelected={setSelected} setTab={setTab}/>}
        {tab==='subject'&&selected&&<SubjectDetail subjectId={selected.id} setSelected={setSelected} setTab={setTab}/>}
        {tab==='missions'&&<Missions setSelected={setSelected} setTab={setTab}/>}
        {tab==='lesson'&&selected&&<LessonView lessonId={selected.id} onBack={()=>setTab('home')} setSelected={setSelected} setTab={setTab}/>}
        {tab==='exam'&&selected&&<ExamRunner examId={selected.id} onBack={()=>setTab('home')}/>}
        {tab==='achievements'&&<Achievements/>}
        {tab==='errors'&&<ErrorBook/>}
        {tab==='leaderboard'&&<Leaderboard/>}
        {tab==='notifications'&&<Notifications/>}
        {tab==='profile'&&<Profile/>}
        <Footer/>
      </div>
    </div>
    <div className="btmnav">
      {[
        {id:'home',icon:'home',label:'الرئيسية'},
        {id:'subjects',icon:'book',label:'المواد'},
        {id:'missions',icon:'target',label:'المهام'},
        {id:'leaderboard',icon:'medal',label:'المتصدرون'},
        {id:'profile',icon:'user',label:'حسابي'}
      ].map(it=><button key={it.id} className={tab===it.id?'on':''} onClick={()=>nav(it.id)}>
        <span className="i"><Icon name={it.icon} size={19}/></span>{it.label}
      </button>)}
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role==='admin') return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
