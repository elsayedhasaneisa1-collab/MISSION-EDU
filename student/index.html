<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

/* ═══════════ أصوات (Web Audio API) ═══════════ */
let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx){
    try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
    catch(e){return null;}
  }
  return _audioCtx;
}
function beep(frequency,duration,type='sine',volume=0.15){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type;
    osc.frequency.value=frequency;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(volume,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration/1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+duration/1000);
  }catch(e){}
}
function playSound(type='notify'){
  switch(type){
    case 'success':
      beep(523,100,'sine',0.18);
      setTimeout(()=>beep(659,100,'sine',0.18),100);
      setTimeout(()=>beep(784,200,'sine',0.18),200);
      break;
    case 'err':
      beep(392,120,'square',0.15);
      setTimeout(()=>beep(311,200,'square',0.15),120);
      break;
    case 'warn':
      beep(440,150,'triangle',0.18);
      setTimeout(()=>beep(440,150,'triangle',0.18),180);
      break;
    default:
      beep(880,100,'sine',0.15);
      setTimeout(()=>beep(1175,120,'sine',0.15),100);
  }
}

/* ═══════════ Toast ═══════════ */
const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
    if(type==='ok') playSound('success');
    else if(type==='err') playSound('err');
    else if(type==='warn') playSound('warn');
    else playSound('notify');
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);
  useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
    <div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

/* ═══════════ App Provider ═══════════ */
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [attempts,setAttempts]=useState([]);
  const [errors,setErrors]=useState([]);
  const [notes,setNotes]=useState([]);
  const [certificates,setCertificates]=useState([]);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      await DB.cleanupExpiredPolls();
      const data=await DB.loadAll();
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  const reloadUserData=useCallback(async ()=>{
    if(!currentUser) return;
    try{
      const sb=await DB.getClient();
      const [a,e,n,c]=await Promise.all([
        DB.getAttempts(currentUser.id),
        DB.getErrors(currentUser.id),
        sb.from('notes').select('*').eq('user_id',currentUser.id).then(r=>r.data||[]),
        sb.from('certificates').select('*').eq('user_id',currentUser.id).then(r=>r.data||[])
      ]);
      setAttempts(a);setErrors(e);setNotes(n);setCertificates(c);
      const u=await DB.getUser(currentUser.id);
      if(u) setCurrentUser(u);
    }catch(e){console.warn(e);}
  },[currentUser]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('/auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}
        if(u.role==='admin'){window.location.replace('/admin/index.html');return;}
        setCurrentUser(u);
        const sb=await DB.getClient();
        const [a,e,n,c]=await Promise.all([
          DB.getAttempts(u.id),
          DB.getErrors(u.id),
          sb.from('notes').select('*').eq('user_id',u.id).then(r=>r.data||[]),
          sb.from('certificates').select('*').eq('user_id',u.id).then(r=>r.data||[])
        ]);
        setAttempts(a);setErrors(e);setNotes(n);setCertificates(c);
        await reload();
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  // ✅ حذف الاستطلاعات المنتهية كل 5 دقايق
  useEffect(()=>{
    const interval=setInterval(async ()=>{
      const count=await DB.cleanupExpiredPolls();
      if(count>0){ await reload(); }
    },5*60*1000);
    return ()=>clearInterval(interval);
  },[reload]);

  // ✅ تفعيل AudioContext بعد أول تفاعل
  useEffect(()=>{
    const unlock=()=>{
      const ctx=getAudioCtx();
      if(ctx&&ctx.state==='suspended') ctx.resume();
      document.removeEventListener('click',unlock);
      document.removeEventListener('touchstart',unlock);
    };
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{
      document.removeEventListener('click',unlock);
      document.removeEventListener('touchstart',unlock);
    };
  },[]);

  const logout=useCallback(()=>{
    Swal.fire({
      title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',
      showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    }).then(r=>{
      if(r.isConfirmed){
        try{localStorage.removeItem('student_tab');localStorage.removeItem('student_selected');}catch(e){}
        DB.clearSession();
        window.location.replace('/auth/login.html');
      }
    });
  },[]);

  const updateUser=useCallback(async (id,patch)=>{
    const u=await DB.updateUser(id,patch);
    setCurrentUser(u);
    return u;
  },[]);

  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  const saveNote=useCallback(async (lessonId,text)=>{
    if(!currentUser) return;
    const sb=await DB.getClient();
    const existing=notes.find(n=>n.lesson_id===lessonId);
    const now=Date.now();
    if(existing){
      await sb.from('notes').update({text,updated_at:now}).eq('id',existing.id);
      setNotes(x=>x.map(n=>n.id===existing.id?{...n,text,updated_at:now}:n));
    } else {
      const row={id:DB.uid('note_'),user_id:currentUser.id,lesson_id:lessonId,text,created_at:now,updated_at:now};
      await sb.from('notes').insert([row]);
      setNotes(x=>[...x,row]);
    }
  },[currentUser,notes]);

  const getNote=useCallback((lessonId)=>{
    return notes.find(n=>n.lesson_id===lessonId)?.text||'';
  },[notes]);

  return <AppCtx.Provider value={{
    db,currentUser,attempts,errors,notes,certificates,loading,
    logout,updateUser,reload,reloadUserData,getLevel,toast,playSound,
    saveNote,getNote,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

    <div className="ring-t">{children}</div>

/* ═══════════ 🍅 Pomodoro ═══════════ */
function PomodoroTimer({compact=false}){
  const app=useApp();
  const u=app.currentUser;
  const [mode,setMode]=useState('work');
  const [running,setRunning]=useState(false);
  const [secondsLeft,setSecondsLeft]=useState(25*60);
  const [sessions,setSessions]=useState(0);
  const intervalRef=useRef(null);
  const WORK_TIME=25*60;
  const BREAK_TIME=5*60;

  useEffect(()=>{
    if(running){
      intervalRef.current=setInterval(()=>{
        setSecondsLeft(s=>{
          if(s<=1){
            clearInterval(intervalRef.current);
            setRunning(false);
            if(mode==='work'){
              saveSession();
              app.playSound('success');
              Swal.fire({
                icon:'success', title:'🎉 خلصت 25 دقيقة!', text:'خد راحة 5 دقايق',
                background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc',
                confirmButtonColor:'#2f7dff', confirmButtonText:'خد راحة',
                customClass:{popup:'swal-custom-popup',title:'swal-custom-title'},
                timer:5000, showConfirmButton:true
              }).then(()=>{ setMode('break'); setSecondsLeft(BREAK_TIME); });
            } else {
              app.playSound('notify');
              Swal.fire({
                icon:'info', title:'☕ خلصت الراحة', text:'جاهز لـ 25 دقيقة جديدة؟',
                background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc',
                confirmButtonColor:'#2f7dff', confirmButtonText:'يلا نبدأ',
                customClass:{popup:'swal-custom-popup',title:'swal-custom-title'},
                timer:5000
              }).then(()=>{ setMode('work'); setSecondsLeft(WORK_TIME); });
            }
            return 0;
          }
          return s-1;
        });
      },1000);
    } else { clearInterval(intervalRef.current); }
    return ()=>clearInterval(intervalRef.current);
  },[running,mode]);

  const saveSession=async ()=>{
    try{
      const sb=await DB.getClient();
      await sb.from('pomodoro_sessions').insert([{
        id:DB.uid('pomo_'), user_id:u.id, duration:25,
        completed_at:Date.now(), created_at:Date.now()
      }]);
      setSessions(s=>s+1);
      await DB.updateUser(u.id,{xp:(u.xp||0)+5});
      app.reloadUserData();
    }catch(e){console.warn(e);}
  };

  const reset=()=>{ setRunning(false); setMode('work'); setSecondsLeft(WORK_TIME); };
  const total=mode==='work'?WORK_TIME:BREAK_TIME;
  const progress=((total-secondsLeft)/total)*100;
  const mins=Math.floor(secondsLeft/60);
  const secs=secondsLeft%60;
  const color=mode==='work'?'#f59e0b':'#22c55e';

  if(compact){
    return <div className="glass-s" style={{padding:12}}>
      <div className="flex between center mb8">
        <div className="flex center g8">
          <span style={{color}}><Icon name="clock" size={16}/></span>
          <span className="sm" style={{fontWeight:700}}>{mode==='work'?'🍅 مذاكرة':'☕ راحة'}</span>
        </div>
        <span className="h4" style={{fontVariantNumeric:'tabular-nums',color}}>
          {String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}
        </span>
      </div>
      <div className="bar"><div className="bar-f" style={{width:`${progress}%`,background:color}}/></div>
      <div className="flex g6 mt8">
        <button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>setRunning(r=>!r)}>
          {running?<><Icon name="pause" size={12}/> إيقاف</>:'▶️ تشغيل'}
        </button>
        <button className="btn btn-s btn-sm" onClick={reset}>
          <Icon name="refresh" size={12}/>
        </button>
      </div>
    </div>;
  }

  return <div className="glass" style={{padding:24,textAlign:'center'}}>
    <div className="h3 mb16" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
      <span style={{color}}>{mode==='work'?'🍅':'☕'}</span>
      {mode==='work'?'وقت المذاكرة':'وقت الراحة'}
    </div>
    <Ring value={progress} size={220} stroke={14} color={color}>
      <div className="pomodoro-time">{String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}</div>
      <div className="pomodoro-label">{mode==='work'?'من 25 دقيقة':'من 5 دقايق'}</div>
    </Ring>
    <div className="flex center g8 mt20" style={{justifyContent:'center'}}>
      <button className="btn btn-p" onClick={()=>setRunning(r=>!r)} style={{minWidth:140}}>
        {running?<><Icon name="pause" size={14}/> إيقاف مؤقت</>:'▶️ ابدأ'}
      </button>
      <button className="btn btn-s" onClick={reset}><Icon name="refresh" size={14}/> إعادة</button>
    </div>
    {sessions > 0 && <div className="pill pill-g mt16" style={{display:'inline-flex'}}>✅ أكملت {sessions} جلسة النهاردة</div>}
  </div>;
}

        </button>)}

/* ═══════════ Topbar ═══════════ */
function Topbar({user,onMenu,onLogout,onSearch,searchResults,unreadNotifs=0,onOpenNotifications}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!q.trim()){setOpen(false);return;}
    setOpen(true);
    const t=setTimeout(()=>onSearch?.(q),150);
    return()=>clearTimeout(t);
  },[q]);
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}><Icon name="menu" size={16}/></button>
    <div style={{position:'relative',flex:1,maxWidth:520,minWidth:0}}>
      <div className="search">
        <Icon name="search" size={15} color="var(--muted)"/>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث عن درس، اختبار..."/>
        {q&&<button onClick={()=>{setQ('');setOpen(false);}} style={{opacity:.6,color:'var(--txt)'}}><Icon name="close" size={14}/></button>}
      </div>
      {open&&searchResults?.length>0&&<div className="glass" style={{position:'absolute',top:'calc(100% + 8px)',insetInline:0,padding:8,zIndex:80,maxHeight:340,overflowY:'auto'}}>
        {searchResults.slice(0,10).map((r,i)=><a key={i} href={r.href} className="nav-i">
          <span className="nav-ico">{r.icon}</span>
          <div style={{flex:1,textAlign:'right',minWidth:0}}>
            <div style={{fontSize:13.5}}>{r.title}</div>
            <div className="xs muted">{r.type}</div>
          </div>
        </a>)}
      </div>}
    </div>
    <div className="flex center g8" style={{marginInlineStart:'auto',flexShrink:0}}>
      <button className="icon-btn" onClick={onOpenNotifications} title="الإشعارات">
        <Icon name="bell" size={16}/>
        {unreadNotifs > 0 && (
          <span style={{
            position:'absolute',top:-4,insetInlineEnd:-4,
            minWidth:18,height:18,borderRadius:9,
            background:'linear-gradient(135deg,#2f7dff,#8b5cf6)',
            color:'#fff',fontSize:10,fontWeight:900,
            display:'grid',placeItems:'center',padding:'0 5px',
            boxShadow:'0 0 10px rgba(47,125,255,.7)',animation:'pulse 2s infinite'
          }}>{unreadNotifs > 9 ? '9+' : unreadNotifs}</span>
        )}
      </button>
      <div className="glass-s" style={{padding:'5px 12px',display:'flex',alignItems:'center',gap:8}}>
        <div className="avatar" style={{width:32,height:32,fontSize:15}}>{user.avatar||'👤'}</div>
      </div>
      <button className="icon-btn" onClick={onLogout}><Icon name="logout" size={16}/></button>
    </div>
  </div>;
}

function Subjects({setSelected,setTab}){

      <div className="grid g-auto">
        {subjects.map(s=>{

              <span className="xs muted">{done}/{lessons.length}</span>

function SubjectDetail({subjectId,setSelected,setTab}){

  if(!s) return <Empty icon="❓" title="المادة غير موجودة"/>;
  const units=app.db.units.filter(x=>x.subject_id===s.id).sort((a,b)=>a.sort_order-b.sort_order);
  return <>
    <button className="btn btn-s btn-sm mb16" onClick={()=>setTab('subjects')}>← المواد</button>
    <div className="hero mb16">
      <div className="flex center g16">
        <div style={{fontSize:52}}>{s.icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div className="h1 mb6">{s.name}</div>
          <div className="sm txt2">{s.desc}</div>
        </div>
      </div>
    </div>

    <div className="h3 mb12" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="book" size={18}/> الوحدات والدروس</div>

      const lessons=app.db.lessons.filter(l=>l.unit_id===un.id&&l.published!==false).sort((a,b)=>{
        const sa=Number(a.sort_order)||999999,sb=Number(b.sort_order)||999999;
        if(sa!==sb) return sa-sb;
        const ta=new Date(a.created_at||a.createdAt||0).getTime()||0;
        const tb=new Date(b.created_at||b.createdAt||0).getTime()||0;
        return ta-tb;
      });
      const exams=app.db.exams.filter(e=>e.unit_id===un.id&&e.published!==false).sort((a,b)=>{
        const sa=Number(a.sort_order)||999999,sb=Number(b.sort_order)||999999;
        if(sa!==sb) return sa-sb;
        const ta=new Date(a.created_at||a.createdAt||0).getTime()||0;
        const tb=new Date(b.created_at||b.createdAt||0).getTime()||0;
        return ta-tb;
      });
      return <div key={un.id} className="glass mb16" style={{padding:18}}>
        <div className="flex between center mb12">
          <div style={{minWidth:0}}>
            <div className="h4">{un.name}</div>
            <div className="xs muted">{un.desc}</div>
          </div>
          <span className="pill pill-b">{lessons.length} درس</span>
        </div>
        {lessons.length===0?<div className="sm muted" style={{textAlign:'center',padding:12}}>لا توجد دروس في هذه الوحدة</div>:
          <div className="grid g2">
            {lessons.map(l=>{
              const done=(u.completed_lessons||[]).includes(l.id);
              const hasVideo=l.video&&l.video.url;
              const note=app.getNote(l.id);
              return <a key={l.id} href={`/student/lesson.html?id=${l.id}`} className="glass-s hv" style={{padding:14,textDecoration:'none',color:'inherit'}}
                onClick={()=>{if(typeof fbq!=='undefined') fbq('trackCustom','ViewLesson',{lesson:l.title});}}>
                <div className="flex between center mb6">
                  <span className={`pill ${done?'pill-g':'pill-b'}`}>{done?<Icon name="check" size={12}/>:<Icon name="play" size={12}/>}</span>
                  <div className="flex g6">
                    {note && <span className="pill pill-y" style={{fontSize:10}}>📝</span>}
                    {hasVideo&&<span className="pill pill-v" style={{fontSize:10}}>🎬</span>}
                  </div>
                </div>
                <div className="h4" style={{fontSize:14}}>{l.title}</div>
                <div className="xs muted mt6">⏱ {l.duration}د • +{l.xp} XP</div>
              </a>;
            })}
          </div>
        }
        {exams.length>0&&<>
          <div className="div"/>
          <div className="h4 mb8" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="clipboard" size={14}/> اختبارات الوحدة</div>
          <div className="grid g2">
            {exams.map(e=>{
              const attempts=(app.attempts||[]).filter(a=>a.exam_id===e.id);
              const best=attempts.length?Math.max(...attempts.map(a=>a.pct)):0;
              return <a key={e.id} href={`/student/exam.html?id=${e.id}`} className="glass-s hv" style={{padding:14,textDecoration:'none',color:'inherit'}}
                onClick={()=>{if(typeof fbq!=='undefined') fbq('track','InitiateCheckout',{content_name:e.title});}}>
                <div className="flex between center mb6">
                  <span className={`pill ${best>=e.pass_score?'pill-g':'pill-a'}`}>{attempts.length?`أفضل: ${best}%`:'جديد'}</span>
                  <span className="xs muted">⏱ {e.duration}د</span>
                </div>
                <div className="h4" style={{fontSize:14}}>{e.title}</div>
                <div className="xs muted mt6">+{e.xp} XP • {(e.question_ids||[]).length} أسئلة</div>
              </a>;
            })}
          </div>
        </>}
      </div>;
    })}
  </>;
}

/* ═══════════ Missions ═══════════ */
function Missions({setSelected,setTab}){
  const app=useApp();
  const u=app.currentUser;
  const access=u.all_subjects?app.db.subjects.map(s=>s.id):(u.access_subjects||[]);
  const missions=app.db.missions.filter(m=>access.includes(m.subject_id)).sort((a,b)=>a.sort_order-b.sort_order);
  const complete=async m=>{
    try{
      await app.updateUser(u.id,{
        completed_missions:[...(u.completed_missions||[]),m.id],
        xp:(u.xp||0)+(m.xp||0)
      });
      DB.trackActivity({userId:u.id,userName:u.name,type:'mission_complete',target:m.title,details:{xp:m.xp}});
      if(typeof fbq!=='undefined') fbq('trackCustom','CompleteMission',{mission:m.title,xp:m.xp});
      app.toast.ok(`🎉 أكملت المهمة! +${m.xp} XP`);
      await app.reload();
    }catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="h2 mb16">المهام</div>
    {missions.length===0?<div className="glass" style={{padding:30}}><Empty icon="🎯" title="لا توجد مهام متاحة"/></div>:
      <div className="grid g2">
        {missions.map(m=>{
          const done=(u.completed_missions||[]).includes(m.id);
          const reqs=[];
          (m.required_lessons||[]).forEach(lid=>{
            const l=app.lesson(lid);
            reqs.push({label:l?.title||'درس',done:(u.completed_lessons||[]).includes(lid)});
          });
          if(m.required_exam_id){
            const e=app.exam(m.required_exam_id);
            const passed=(app.attempts||[]).some(a=>a.exam_id===m.required_exam_id&&a.passed);
            reqs.push({label:e?.title||'اختبار',done:passed});
          }
          const reqsDone=reqs.filter(r=>r.done).length;
          const canComplete=reqs.length>0&&reqsDone===reqs.length;
          const s=app.subject(m.subject_id);
          return <div key={m.id} className="glass hv" style={{padding:20}}>
            <div className="flex between center mb12">
              <span className="pill pill-b">{s?.icon} {s?.name}</span>
              <span className={`pill ${done?'pill-g':'pill-v'}`}>{done?'مكتملة':`+${m.xp} XP`}</span>
            </div>
            <div className="h3 mb6">{m.title}</div>
            <div className="sm muted mb16">{m.desc}</div>
            {reqs.length>0&&<div className="mb12">
              <div className="flex between center mb8">
                <span className="xs muted">المتطلبات</span>
                <span className="xs" style={{color:'var(--blue2)',fontWeight:700}}>{reqsDone}/{reqs.length}</span>
              </div>
              {reqs.map((r,i)=><div key={i} className="flex g8 mb6" style={{alignItems:'center'}}>
                <span style={{color:r.done?'var(--green)':'var(--muted)',fontWeight:800}}>{r.done?'✓':'○'}</span>
                <span className="sm txt2">{r.label}</span>
              </div>)}
            </div>}
            {!done&&canComplete&&<button className="btn btn-ok btn-block" onClick={()=>complete(m)}>🎉 استلام المكافأة</button>}
            {!done&&!canComplete&&reqs.length>0&&<div className="sm muted" style={{textAlign:'center',padding:8}}>أكمل المتطلبات أعلاه</div>}
            {done&&<div className="sm" style={{textAlign:'center',color:'var(--green)',fontWeight:700}}>🎯 مكتملة</div>}
          </div>;
        })}
      </div>
    }
  </>;
}

/* ═══════════ Leaderboard ═══════════ */
function Leaderboard(){
  const app=useApp();
  const u=app.currentUser;
  const [period,setPeriod]=useState('week');
  
  const weekStart = useMemo(()=>{
    const d=new Date();
    const day=d.getDay();
    const diff=d.getDate()-day;
    const ws=new Date(d.setDate(diff));
    ws.setHours(0,0,0,0);
    return ws.getTime();
  },[]);

  const weekXpByUser = useMemo(()=>{
    const map={};
    app.db.activity.forEach(a=>{
      if(a.at && a.at >= weekStart && a.type === 'lesson_complete'){
        const xp = (a.details && a.details.xp) || 20;
        map[a.user_id] = (map[a.user_id] || 0) + xp;
      }
      if(a.at && a.at >= weekStart && a.type === 'exam_submit' && a.details && a.details.passed){
        map[a.user_id] = (map[a.user_id] || 0) + 50;
      }
    });
    return map;
  }, [app.db.activity, weekStart]);

  const sorted = useMemo(()=>{
    return [...app.db.users.filter(x=>x.role==='student'&&x.active!==false)]
      .map(s=>({...s,weekXp: period==='week' ? (weekXpByUser[s.id]||0) : (s.xp||0)}))
      .sort((a,b)=>b.weekXp-a.weekXp).slice(0,10);
  }, [app.db.users, weekXpByUser, period]);

  return <>
    <div className="flex between center mb16 wrap g8">
      <div className="h2">🏅 المتصدرون</div>
      <div className="flex g6" style={{background:'rgba(255,255,255,.03)',padding:5,borderRadius:13}}>
        <button onClick={()=>setPeriod('week')} style={{padding:'8px 16px',borderRadius:10,background:period==='week'?'rgba(47,125,255,.22)':'transparent',border:period==='week'?'1px solid var(--blue)':'1px solid transparent',color:period==='week'?'#fff':'var(--txt2)',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>هذا الأسبوع</button>
        <button onClick={()=>setPeriod('all')} style={{padding:'8px 16px',borderRadius:10,background:period==='all'?'rgba(47,125,255,.22)':'transparent',border:period==='all'?'1px solid var(--blue)':'1px solid transparent',color:period==='all'?'#fff':'var(--txt2)',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>الكل</button>
      </div>
    </div>
    {period==='week'&&<div className="glass-s mb16" style={{padding:12,borderColor:'var(--border2)'}}>
      <div className="xs muted" style={{textAlign:'center'}}>🔥 يتم تحديث الترتيب الأسبوعي تلقائيًا كل يوم أحد</div>
    </div>}
    {sorted.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏅" title="لا يوجد طلاب بعد"/></div>:
      <div className="glass" style={{padding:14}}>
        <div className="sx">
          <table className="tbl">
            <thead><tr><th>#</th><th>الطالب</th><th>{period==='week'?'XP الأسبوع':'XP الكلي'}</th><th>المستوى</th></tr></thead>
            <tbody>
              {sorted.map((s,i)=>{
                const {current}=app.getLevel(s.xp||0);
                const isMe=s.id===u.id;
                return <tr key={s.id} style={{background:isMe?'rgba(47,125,255,.06)':'transparent'}}>
                  <td><div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div></td>
                  <td><div className="flex center g8">
                    <div className="avatar" style={{width:32,height:32,fontSize:14}}>{s.avatar||'👤'}</div>
                    <span>{s.name} {isMe&&<span className="pill pill-b" style={{marginInlineStart:6}}>أنت</span>}</span>
                  </div></td>
                  <td><b>{DB.fmt(s.weekXp)}</b></td>
                  <td><span className="pill pill-v">Lv {current.level} — {current.name}</span></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    }
  </>;
}

/* ═══════════ Notes Page ═══════════ */
function NotesPage({setTab}){
  const app=useApp();
  const notes = app.notes || [];
  const sortedNotes = useMemo(()=>[...notes].sort((a,b)=>(b.updated_at||0)-(a.updated_at||0)),[notes]);
  const [editing,setEditing]=useState(null);
  const [text,setText]=useState('');
  const startEdit=(n)=>{setEditing(n.id);setText(n.text||'');};
  const cancelEdit=()=>{setEditing(null);setText('');};
  const saveEdit=async (n)=>{
    try{await app.saveNote(n.lesson_id,text);app.toast.ok('تم الحفظ');setEditing(null);}
    catch(e){app.toast.err(e.message);}
  };
  const delNote=async (n)=>{
    const r=await Swal.fire({
      title:'حذف الملاحظة؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb=await DB.getClient();
      await sb.from('notes').delete().eq('id',n.id);
      app.reloadUserData();
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">📝 ملاحظاتي</div>
        <div className="sm muted mt6">كل ملاحظاتك على الدروس في مكان واحد</div>
      </div>
      <span className="pill pill-b">{sortedNotes.length} ملاحظة</span>
    </div>
    {sortedNotes.length===0?<div className="glass" style={{padding:30}}><Empty icon="📝" title="لا توجد ملاحظات" desc="ابدأ بكتابة ملاحظاتك من صفحة الدرس"/></div>:
      <div className="grid g2">
        {sortedNotes.map(n=>{
          const l = app.lesson(n.lesson_id);
          const isEditing = editing===n.id;
          return <div key={n.id} className="glass" style={{padding:16}}>
            <div className="flex between center mb12">
              <div className="flex center g8" style={{flex:1,minWidth:0}}>
                <span className="pill pill-b" style={{fontSize:11}}><Icon name="note" size={11}/> درس</span>
                {l?<a href={`/student/lesson.html?id=${l.id}`} className="sm" style={{fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l.title}</a>:<span className="sm muted">درس محذوف</span>}
              </div>
              <span className="xs muted">{new Date(n.updated_at||n.created_at).toLocaleDateString('ar-EG')}</span>
            </div>
            {isEditing?<>
              <textarea className="input" value={text} onChange={e=>setText(e.target.value)} rows="5"/>
              <div className="flex g8 mt12">
                <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>saveEdit(n)}>💾 حفظ</button>
                <button className="btn btn-s btn-sm" onClick={cancelEdit}>إلغاء</button>
              </div>
            </>:<>
              <div className="sm txt2" style={{background:'rgba(0,0,0,.20)',padding:10,borderRadius:10,borderInlineStart:'2px solid var(--blue)',whiteSpace:'pre-wrap',minHeight:60}}>{n.text||'—'}</div>
              <div className="flex g8 mt12">
                <button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>startEdit(n)}><Icon name="edit" size={12}/> تعديل</button>
                <button className="btn btn-dn btn-sm" onClick={()=>delNote(n)}><Icon name="trash" size={12}/></button>
              </div>
            </>}
          </div>;
        })}
      </div>
    }
  </>;
}

/* ═══════════ Polls Page (طالب) ═══════════ */
function PollsPage(){
  const app=useApp();
  const u=app.currentUser;
  const [loading,setLoading]=useState(true);
  const [polls,setPolls]=useState([]);
  const [votes,setVotes]=useState([]);
  const [voting,setVoting]=useState(null);

  const loadData = useCallback(async ()=>{
    try{
      await DB.cleanupExpiredPolls();
      const sb = await DB.getClient();
      const [pRes, vRes] = await Promise.all([
        sb.from('polls').select('*').eq('active', true).order('created_at',{ascending:false}),
        sb.from('poll_votes').select('*')
      ]);
      const now = Date.now();
      const activePolls = (pRes.data || []).filter(p => !p.ends_at || p.ends_at > now);
      setPolls(activePolls);
      setVotes(vRes.data || []);
    }catch(e){console.warn(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{ loadData(); },[loadData]);

  const myVote = (pollId) => votes.find(v => v.poll_id === pollId && v.user_id === u.id);

  const vote = async (poll, optionIndex) => {
    if(myVote(poll.id)) return app.toast.warn('صوّت بالفعل');
    setVoting(poll.id + ':' + optionIndex);
    try{
      const sb = await DB.getClient();
      await sb.from('poll_votes').insert([{
        id: DB.uid('vote_'),
        poll_id: poll.id,
        user_id: u.id,
        option_index: optionIndex,
        created_at: Date.now()
      }]);
      await loadData();
      app.toast.ok('✅ تم تسجيل صوتك');
      if(typeof fbq!=='undefined') fbq('trackCustom','PollVote',{poll:poll.question});
      DB.trackActivity({
        userId: u.id, userName: u.name, type: 'poll_vote',
        target: poll.question, details: { poll_id: poll.id, option: optionIndex }
      });
    }catch(e){ app.toast.err(e.message); }
    setVoting(null);
  };

  const getStats = (poll) => {
    const pollVotes = votes.filter(v => v.poll_id === poll.id);
    const total = pollVotes.length;
    const counts = (poll.options||[]).map((_, i) =>
      pollVotes.filter(v => v.option_index === i).length
    );
    return { total, counts };
  };

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">🗳️ استطلاعات الرأي</div>
        <div className="sm muted mt6">شاركنا رأيك — صوتك يهمنا</div>
      </div>
      <span className="pill pill-b">{polls.length} استطلاع</span>
    </div>

    {loading ? (
      <div className="glass" style={{padding:40,textAlign:'center'}}>
        <div className="spinner" style={{margin:'0 auto 14px'}}></div>
        جارٍ التحميل...
      </div>
    ) : polls.length === 0 ? (
      <div className="glass" style={{padding:30}}>
        <Empty icon="🗳️" title="لا توجد استطلاعات حالياً" desc="هيظهر هنا أي استطلاع جديد"/>
      </div>
    ) : (
      <div className="flex col g16">
        {polls.map(p => {
          const { total, counts } = getStats(p);
          const mine = myVote(p.id);
          const hasVoted = !!mine;
          return <div key={p.id} className="glass" style={{padding:22}}>
            <div className="flex between center mb16 wrap g8">
              <span className="pill pill-b">📊 {total} صوت</span>
              {hasVoted && <span className="pill pill-g">✓ صوّتت</span>}
            </div>

            <div className="h3 mb16" style={{lineHeight:1.5}}>{p.question}</div>

            <div className="flex col g10">
              {(p.options||[]).map((opt, i) => {
                const cnt = counts[i] || 0;
                const perc = total ? Math.round((cnt/total)*100) : 0;
                const isMyPick = mine && mine.option_index === i;
                const isVoting = voting === p.id + ':' + i;

                if(!hasVoted){
                  return <button key={i}
                    onClick={()=>vote(p, i)}
                    disabled={!!voting}
                    className="glass-s hv"
                    style={{
                      padding:'14px 18px',
                      cursor: isVoting ? 'wait' : 'pointer',
                      textAlign:'right',
                      display:'flex',
                      alignItems:'center',
                      gap:12,
                      border: '1.5px solid var(--border)',
                      fontFamily:'inherit',
                      color:'inherit',
                      width:'100%',
                      transition:'.2s'
                    }}
                  >
                    <span style={{
                      width:32,height:32,borderRadius:'50%',
                      display:'grid',placeItems:'center',
                      background:'rgba(47,125,255,.12)',
                      border:'1.5px solid var(--border2)',
                      fontWeight:800,fontSize:13,
                      color:'var(--blue2)',
                      flexShrink:0
                    }}>{['أ','ب','ج','د','هـ','و'][i]}</span>
                    <span style={{flex:1,fontWeight:600}}>{opt}</span>
                    {isVoting && <span className="spinner" style={{width:16,height:16,borderWidth:2}}/>}
                  </button>;
                }

                return <div key={i} className="glass-s" style={{
                  padding:'14px 18px',
                  border: isMyPick ? '1.5px solid var(--green)' : '1.5px solid var(--border)',
                  background: isMyPick ? 'rgba(34,197,94,.08)' : 'rgba(21,31,56,.62)'
                }}>
                  <div className="flex between center mb8">
                    <div className="flex g8 center">
                      <span style={{
                        width:32,height:32,borderRadius:'50%',
                        display:'grid',placeItems:'center',
                        background: isMyPick ? 'var(--green)' : 'rgba(47,125,255,.12)',
                        color: isMyPick ? '#fff' : 'var(--blue2)',
                        border: isMyPick ? 'none' : '1.5px solid var(--border2)',
                        fontWeight:800,fontSize:13,
                        flexShrink:0
                      }}>{['أ','ب','ج','د','هـ','و'][i]}</span>
                      <span style={{fontWeight:600}}>{opt}</span>
                      {isMyPick && <span className="pill pill-g" style={{fontSize:10}}>اختيارك</span>}
                    </div>
                    <div className="flex g6 center">
                      <span className="xs muted">{cnt}</span>
                      <span className="sm" style={{fontWeight:800,color:isMyPick?'var(--green)':'var(--blue2)'}}>{perc}%</span>
                    </div>
                  </div>
                  <div className="bar" style={{height:8}}>
                    <div
                      className={`bar-f ${isMyPick?'bar-g':'bar-b'}`}
                      style={{width:`${perc}%`}}
                    />
                  </div>
                </div>;
              })}
            </div>

            {p.ends_at && (
              <div className="xs muted mt16" style={{textAlign:'center'}}>
                ⏰ ينتهي: {DB.formatDate(p.ends_at)}
              </div>
            )}
          </div>;
        })}
      </div>
    )}
  </>;
}

/* ═══════════ Notifications ═══════════ */
function Notifications(){
  const app=useApp();
  const u=app.currentUser;
  const list=app.db.notifications.filter(n=>n.target==='all'||n.target===u.id).sort((a,b)=>b.created_at-a.created_at);
  const markRead=async id=>{
    try{
      const n=list.find(x=>x.id===id);
      const readBy=[...(n.read_by||[])];
      if(!readBy.includes(u.id)) readBy.push(u.id);
      await DB.save('notifications',{...n,read_by:readBy});
      await app.reload();
    }catch(e){}
  };
  return <>
    <div className="h2 mb16">الإشعارات</div>
    {list.length===0?<div className="glass" style={{padding:30}}><Empty icon="🔕" title="لا توجد إشعارات"/></div>:
      list.map(n=>{
        const read=(n.read_by||[]).includes(u.id);
        return <div key={n.id} className="glass mb12" style={{padding:16,borderColor:read?'var(--border)':'var(--border2)'}}>
          <div className="flex between center mb6">
            <div className="h4">{n.title} {!read&&<span className="pill pill-b" style={{marginInlineStart:8}}>جديد</span>}</div>
            <span className="xs muted">{new Date(n.created_at).toLocaleDateString('ar-EG')}</span>
          </div>
          <div className="sm txt2 mb12">{n.body}</div>
          {!read&&<button className="btn btn-s btn-sm" onClick={()=>markRead(n.id)}>تحديد كمقروء</button>}
        </div>;
      })
    }
  </>;
}

    {id:'notifications',icon:'bell',label:'الإشعارات',badge:unread||null},
    {id:'profile',icon:'user',label:'الملف الشخصي'}
  ]}];

  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    const access=user.all_subjects?app.db.subjects.map(s=>s.id):(user.access_subjects||[]);
    app.db.lessons.filter(l=>{
      const un=app.unit(l.unit_id);
      return un&&access.includes(un.subject_id)&&l.published!==false&&(l.title.toLowerCase().includes(lc)||(l.desc||'').toLowerCase().includes(lc));
    }).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="book" size={16}/>,title:l.title,href:`/student/lesson.html?id=${l.id}`}));
    app.db.exams.filter(e=>access.includes(e.subject_id)&&e.title.toLowerCase().includes(lc)).forEach(e=>res.push({type:'اختبار',icon:<Icon name="clipboard" size={16}/>,title:e.title,href:`/student/exam.html?id=${e.id}`}));
    setSearchResults(res);
  };

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={handleNav} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar
        user={user}
        onMenu={()=>setSidebarOpen(true)}
        onLogout={app.logout}
        onSearch={onSearch}
        searchResults={searchResults}
        unreadNotifs={unread}
        onOpenNotifications={()=>handleNav('notifications')}
      />
      <div className="content">
        {tab==='home'&&<Home onNav={setTab} setSelected={setSelected}/>}
        {tab==='subjects'&&<Subjects setSelected={setSelected} setTab={setTab}/>}
        {tab==='subject'&&selected&&<SubjectDetail subjectId={selected.id} setSelected={setSelected} setTab={setTab}/>}
        {tab==='missions'&&<Missions setSelected={setSelected} setTab={setTab}/>}
        {tab==='achievements'&&<Achievements/>}
        {tab==='notes'&&<NotesPage setTab={setTab}/>}
        {tab==='polls'&&<PollsPage/>}
        {tab==='errors'&&<ErrorBook/>}
        {tab==='leaderboard'&&<Leaderboard/>}
        {tab==='notifications'&&<Notifications/>}
        {tab==='profile'&&<ProfileRedirect/>}
        <Footer/>
      </div>
    </div>
    <div className="btmnav">
      {[
        {id:'home',icon:'home',label:'الرئيسية'},
        {id:'subjects',icon:'book',label:'المواد'},
        {id:'missions',icon:'target',label:'المهام'},
        {id:'polls',icon:'check',label:'استطلاعات'},
        {id:'notes',icon:'note',label:'ملاحظاتي'}
      ].map(it=><button key={it.id} className={tab===it.id?'on':''} onClick={()=>handleNav(it.id)}>
        <span className="i"><Icon name={it.icon} size={19}/></span>
        <span className="lbl-txt">{it.label}</span>
      </button>)}
    </div>
  </div>;
}

/* ═══════════ Root + App ═══════════ */
function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role==='admin') return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
