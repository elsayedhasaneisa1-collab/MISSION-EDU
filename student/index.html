<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0805" />
<title>MISSION EDU — المنصة التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
--bg:#0a0805;--bg2:#0f0c07;
--gold:#D4AF37;--gold-l:#FFD700;--gold-xl:#FFED4E;--gold-d:#8B6914;--gold-dd:#5c4509;
--gold-soft:#F5E6A8;--gold-glow:rgba(212,175,55,.35);
--border:rgba(212,175,55,.18);--border2:rgba(212,175,55,.38);--border3:rgba(255,215,0,.55);
--txt:#f7f0dd;--txt2:#d4c79a;--muted:#8a7d55;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#b8860b;
--r:20px;--rs:13px;
--sh:0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(212,175,55,.05) inset;
--sh-gold:0 10px 30px rgba(212,175,55,.35);
--sh-gold-h:0 14px 40px rgba(212,175,55,.55);
--grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%);
--grad-gold-soft:linear-gradient(135deg,rgba(255,215,0,.18),rgba(212,175,55,.08));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(212,175,55,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(184,134,11,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(255,215,0,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(212,175,55,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#D4AF37,#8B6914);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(28,22,12,.78),rgba(15,12,7,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(212,175,55,.05) 40%,rgba(255,215,0,.20));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass-s{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(15,12,7,.96),rgba(10,8,5,.92));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 8px 26px rgba(212,175,55,.55),0 0 0 1px rgba(255,237,78,.3) inset;position:relative}
.brand-logo::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,#FFD700,#FFF3B0 45%,#D4AF37 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s linear infinite}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(212,175,55,.10);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(212,175,55,.24),rgba(212,175,55,.03));color:#FFF3B0}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#FFD700,#D4AF37);box-shadow:0 0 12px rgba(255,215,0,.7)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(10,8,5,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:52px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-gold);color:#1a1206;box-shadow:0 10px 28px rgba(212,175,55,.42),0 0 0 1px rgba(255,237,78,.4) inset;position:relative;overflow:hidden}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:var(--sh-gold-h);transform:translateY(-2px);color:#000}
.btn-s{background:rgba(212,175,55,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:rgba(212,175,55,.16);color:#FFF3B0;border-color:var(--border2)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#FFD700,#FFF3B0 50%,#D4AF37 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 5s linear infinite}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill-b{background:rgba(212,175,55,.16);color:#FFD700;border-color:rgba(212,175,55,.35)}
.pill-g{background:rgba(34,197,94,.16);color:#6ee7a0;border-color:rgba(34,197,94,.32)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.pill-v{background:rgba(184,134,11,.18);color:#e0b84c;border-color:rgba(184,134,11,.35)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}
.pill-paid{background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(212,175,55,.10));color:#FFD700;border:1px solid rgba(212,175,55,.45)}
.bar{height:9px;border-radius:20px;background:rgba(212,175,55,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold);box-shadow:0 0 14px rgba(212,175,55,.5)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(15,12,7,.78);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.input::placeholder{color:var(--muted)}
textarea.input{resize:vertical;min-height:80px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--gold);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(212,175,55,.08);vertical-align:middle}
.sx{overflow-x:auto}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(212,175,55,.08);border:1px solid var(--border);transition:.2s;font-size:15px;color:var(--gold);position:relative;flex-shrink:0}
.icon-btn:hover{background:rgba(212,175,55,.18);border-color:var(--border2)}
.modal-bg{position:fixed;inset:0;background:rgba(5,3,1,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{padding:16px 20px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.12) 50%,rgba(255,215,0,.06));border:1px solid var(--border2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.vid-preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border2);position:relative;margin-top:10px}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:0;display:block;object-fit:contain}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(212,175,55,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#FFD700,#D4AF37);color:#1a1206}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:rgba(212,175,55,.10);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(28,22,12,.98),rgba(15,12,7,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7);animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(212,175,55,.08);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(212,175,55,.20);color:#FFD700}
.toast.info .toast-bar-f{background:var(--grad-gold)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(212,175,55,.14);position:relative;flex-wrap:wrap}
.footer-dev::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:180px;height:1px;background:linear-gradient(90deg,transparent,#FFD700,transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s;border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.18));border-color:rgba(212,175,55,.4);color:var(--txt)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(212,175,55,.32),rgba(184,134,11,.32));border-color:#FFD700;transform:translateY(-2px)}
.dev-name b{background:linear-gradient(90deg,#FFD700,#FFF3B0,#D4AF37,#FFD700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900}
.tg-btn{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.35);color:#FFD700}
.tg-btn:hover{background:rgba(212,175,55,.24);border-color:#FFD700;color:#FFF3B0}
.swal-custom-popup{border:1px solid rgba(212,175,55,.4)!important;border-radius:22px!important;box-shadow:0 24px 70px rgba(0,0,0,.85)!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-title{color:#f7f0dd!important;font-size:20px!important;font-weight:800!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-input{background:rgba(15,12,7,.78)!important;border:1.5px solid rgba(212,175,55,.35)!important;color:#f7f0dd!important;border-radius:12px!important;font-family:'Tajawal','Cairo',sans-serif!important}
.section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(212,175,55,.12);font-size:14px;color:var(--gold);flex-shrink:0}
.msg-card{background:rgba(212,175,55,.04);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;transition:.2s}
.msg-card:hover{border-color:var(--border2);background:rgba(212,175,55,.07)}
.msg-card.unread{border-inline-start:3px solid var(--gold);background:rgba(212,175,55,.08)}
.msg-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.msg-tab{padding:8px 16px;border-radius:20px;font-weight:700;font-size:12.5px;background:rgba(212,175,55,.06);border:1px solid var(--border);color:var(--txt2);transition:.2s;cursor:pointer}
.msg-tab.active{background:rgba(212,175,55,.20);border-color:var(--gold);color:#FFD700}
.chat-list{max-height:420px;overflow-y:auto}
.chat-bubble{max-width:70%;padding:10px 14px;border-radius:14px;margin-bottom:8px;font-size:13px;word-wrap:break-word;line-height:1.5}
.chat-bubble.me{background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(212,175,55,.15));margin-inline-start:auto;border-bottom-left-radius:4px}
.chat-bubble.other{background:rgba(255,255,255,.06);border-bottom-right-radius:4px}
.chat-time{font-size:10px;color:var(--muted);margin-top:4px;display:block}
.student-card{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.24s;text-align:center}
.student-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.lesson-card{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.24s;cursor:pointer}
.lesson-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.lesson-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#2a1f0a,#1a1408);position:relative;display:grid;place-items:center;overflow:hidden}
.lesson-thumb img{width:100%;height:100%;object-fit:cover}
.lesson-thumb .play{width:56px;height:56px;border-radius:50%;background:rgba(212,175,55,.9);display:grid;place-items:center;color:#1a1206;font-size:22px;position:absolute;box-shadow:0 8px 28px rgba(212,175,55,.6)}
.lesson-body{padding:14px}
.lesson-title{font-weight:800;font-size:14.5px;margin-bottom:6px;line-height:1.4}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.qbox-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--border);transition:.18s;cursor:pointer}
.qbox-opt:hover{background:rgba(212,175,55,.08)}
.qbox-opt-letter{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(212,175,55,.15);color:var(--gold);font-weight:800;font-size:12px;flex-shrink:0}
.qbox.selected{background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(212,175,55,.05));border-color:var(--gold)}
.sec-warning{position:fixed;top:0;inset-inline:0;background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;padding:10px;text-align:center;font-weight:800;font-size:13px;z-index:99999;animation:shake .5s;display:none}
.sec-warning.show{display:block}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){

<body>
<div id="secWarning" class="sec-warning">⚠️ تم كشف محاولة تلاعب — الجلسة هتُغلق</div>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
if (window.Babel) { Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] }); }
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

const SEC = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  safeUrl: u => /^https?:\/\//i.test(String(u || '')) ? u : '#',
  safeImg: u => /^https?:\/\/.+\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(String(u || '')) || /^https:\/\/.+\.supabase\.co\/storage\//i.test(String(u||'')) ? u : null,
  clean: s => String(s ?? '').replace(/[<>]/g,'').trim(),
  maxLen: (s, n=500) => String(s ?? '').slice(0, n),
  rateLimit: (()=>{const store={};return (key,ms=3000)=>{const now=Date.now();if(store[key]&&now-store[key]<ms)return false;store[key]=now;return true;};})(),
  sanitizeObject: obj => {
    if(!obj || typeof obj!=='object') return obj;
    const out = Array.isArray(obj) ? [] : {};
    for(const k in obj){
      if(/^(__proto__|constructor|prototype)$/.test(k)) continue;
      const v = obj[k];
      if(typeof v==='string') out[k] = SEC.maxLen(v, 5000);
      else if(typeof v==='object' && v !== null) out[k] = SEC.sanitizeObject(v);
      else out[k] = v;
    }
    return out;
  }
};

const ANTI_TAMPER = (function(){
  let locked = false;
  function lock(reason){
    if(locked) return;
    locked = true;
    try{ DB.clearSession(); }catch(e){}
    try{
      const w = document.getElementById('secWarning');
      if(w){ w.textContent = '⚠️ ' + (reason || 'تم كشف تلاعب — الجلسة مغلقة'); w.classList.add('show'); }
    }catch(e){}
    try{
      const sb = DB.getClient();
      sb.then(c => c.from('reports').insert([{
        id: 'sec_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        user_id: null,
        user_name: 'محاولة تلاعب',
        user_phone: '',
        reporter_id: null,
        reason: 'Tamper Attempt',
        details: reason || '',
        created_at: Date.now()
      }])).catch(()=>{});
    }catch(e){}
    setTimeout(()=>{ try{ window.location.replace('/auth/login.html'); }catch(e){} }, 2500);
  }
  return { lock, isLocked: ()=>locked };
})();

const ToastCtx=createContext(null);
function ToastProvider({children}){const [items,setItems]=useState([]);const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);},[]);const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div></ToastCtx.Provider>;}
function Toast({data,onClose}){const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);const icons={ok:'✓',err:'✕',warn:'!',info:'i'};return <div className={`toast ${data.type} ${out?'out':''}`}><div className="toast-ico">{icons[data.type]}</div><div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div><button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button><div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div></div>;}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],direct_messages:[],reports:[],friendships:[],xp_shop_items:[],study_groups:[],study_group_members:[],study_plans:[],daily_challenges:[],practice_sessions:[],focus_sessions:[],flashcards:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      const data=await DB.loadAll();
      const sb=await DB.getClient();
      const extra=['direct_messages','xp_shop_items','study_groups','study_group_members','daily_challenges','flashcards','friendships'];
      const extraResults=await Promise.all(extra.map(async(t)=>{try{const res=await sb.from(t).select('*').limit(2000);return{t,data:res.data||[]};}catch(e){return{t,data:[]};}}));
      extraResults.forEach(r=>{data[r.t]=r.data;});
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{(async ()=>{try{const sid=DB.getSessionId();if(!sid){window.location.replace('/auth/login.html');return;}const u=await DB.getUser(sid);if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}if(u.banned===true){DB.clearSession();window.location.replace('/auth/banned.html');return;}setCurrentUser(u);await reload();}catch(e){console.warn(e);}setLoading(false);})();},[]);

  useEffect(()=>{
    if(!currentUser) return;
    const initialXp = currentUser.xp || 0;
    const interval = setInterval(async ()=>{
      try{
        const fresh = await DB.getUser(currentUser.id);
        if(!fresh){ ANTI_TAMPER.lock('المستخدم غير موجود'); return; }
        if(fresh.banned === true){ ANTI_TAMPER.lock('تم حظر حسابك'); return; }
        if(fresh.active === false){ ANTI_TAMPER.lock('تم إيقاف حسابك'); return; }
        const dbXp = Number(fresh.xp) || 0;
        if(dbXp < initialXp - 100){ ANTI_TAMPER.lock('تلاعب محتمل في XP'); return; }
      }catch(e){}
    }, 30000);
    return ()=>clearInterval(interval);
  },[currentUser]);

  useEffect(()=>{
    if(!currentUser) return;
    try{
      let ref = currentUser;
      Object.defineProperty(window, 'currentUser', {
        configurable: false,
        get: ()=>ref,
        set: (v)=>{ ANTI_TAMPER.lock('محاولة تعديل بيانات المستخدم من Console'); }
      });
    }catch(e){}
  },[currentUser]);

  useEffect(()=>{
    if(!currentUser) return;
    const checkMutations = ()=>{
      try{
        const ls = localStorage.getItem('mission_session');
        if(!ls){ ANTI_TAMPER.lock('الجلسة محذوفة'); return; }
        const s = JSON.parse(ls);
        if(s.userId !== currentUser.id){ ANTI_TAMPER.lock('تلاعب في الجلسة'); return; }
      }catch(e){}
    };
    const interval = setInterval(checkMutations, 15000);
    return ()=>clearInterval(interval);
  },[currentUser]);

  const logout=useCallback(()=>{Swal.fire({title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('/auth/login.html');}});},[]);

  const save=useCallback(async (table,item)=>{
    const clean = SEC.sanitizeObject(item);
    if(!clean || typeof clean!=='object') throw new Error('بيانات غير صالحة');
    const saved=await DB.save(table,clean);
    await reload();
    return saved;
  },[reload]);

  const remove=useCallback(async (table,id)=>{
    if(!id || typeof id!=='string' || id.length<3) throw new Error('معرف غير صالح');
    await DB.remove(table,id);
    await reload();
  },[reload]);

  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return {current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}return {current:cur,next};},[db.levels]);

  return <AppCtx.Provider value={{db,currentUser,loading,logout,reload,save,remove,getLevel,toast,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id),question:id=>db.questions.find(q=>q.id===id),grade:id=>db.grades.find(g=>g.id===id)}}>{children}</AppCtx.Provider>;
}

function Modal({title,children,onClose,wide}){return <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}><div className={`glass modal ${wide?'wide':''}`}><div className="flex between center mb16"><div className="h3">{title}</div><button className="icon-btn" onClick={onClose}><Icon name="close" size={16}/></button></div>{children}</div></div>;}
function Stat({label,value,icon,color='var(--gold)',sub}){return <div className="glass-s hv" style={{padding:16}}><div className="flex between center mb8"><div className="stat-l">{label}</div><div style={{color}}>{typeof icon==='string'?<Icon name={icon} size={20}/>:icon}</div></div><div className="stat-n" style={{color}}>{value}</div>{sub&&<div className="xs muted mt8">{sub}</div>}</div>;}
function Field({label,children,hint}){return <div className="mb12"><label className="lbl">{label}</label>{children}{hint&&<div className="xs muted mt8">{hint}</div>}</div>;}
function Empty({icon='📭',title,desc}){return <div className="empty"><div className="empty-ico">{icon}</div><div className="h4 txt2 mb8">{title}</div>{desc&&<div className="sm">{desc}</div>}</div>;}
function AccessBadge({value}){const isFree=value!==false&&value!=='paid';if(isFree)return <span className="pill pill-free">🆓 مجاني</span>;return <span className="pill pill-paid">🔒 مدفوع</span>;}

function StudentAvatar({student, size=40}){
  const isPaid = student?.subscription==='paid' || student?.subscription==='vip';
  const safeImg = isPaid ? SEC.safeImg(student?.avatar_url) : null;
  if(safeImg){
    return <img src={safeImg} alt={SEC.esc(student.name||'')} loading="lazy"
      onError={e=>{e.currentTarget.style.display='none';}}
      style={{width:size,height:size,borderRadius:12,objectFit:'cover',border:'2px solid var(--gold)',flexShrink:0}}/>;
  }
  const isFemale = student?.gender==='female';
  const icon = isFemale ? '👧' : student?.gender==='male' ? '👦' : '👤';
  const bg = isFemale ? 'linear-gradient(135deg,#f472b6,#ec4899)' : 'linear-gradient(135deg,#60a5fa,#3b82f6)';
  return <div style={{width:size,height:size,borderRadius:12,background:bg,display:'grid',placeItems:'center',fontSize:size*0.55,flexShrink:0,border:'2px solid rgba(212,175,55,.4)'}}>{icon}</div>;
}

  </div>;

const PUSH_MANAGER = (function(){
  let enabled = false;
  let lastCheck = 0;
  let seenIds = new Set();
  try{
    const saved = localStorage.getItem('push_seen_ids');
    if(saved) seenIds = new Set(JSON.parse(saved));
  }catch(e){}

  async function requestPermission(){
    if(!('Notification' in window)) return false;
    if(Notification.permission === 'granted'){ enabled = true; return true; }
    if(Notification.permission === 'denied') return false;
    try{
      const perm = await Notification.requestPermission();
      enabled = (perm === 'granted');
      return enabled;
    }catch(e){ return false; }
  }

  function show(title, body, tag){
    if(!enabled || Notification.permission !== 'granted') return;
    try{
      const n = new Notification(title, {
        body,
        icon: '/logo.png',
        badge: '/logo.png',
        tag: tag || 'mission-edu',
        dir: 'rtl',
        lang: 'ar'
      });
      n.onclick = ()=>{ window.focus(); n.close(); };
      setTimeout(()=>{ try{n.close();}catch(e){} }, 10000);
    }catch(e){}
  }

  function isEnabled(){ return enabled && typeof Notification !== 'undefined' && Notification.permission === 'granted'; }

  function trackAndShow(notifications, userId){
    const now = Date.now();
    if(now - lastCheck < 15000) return;
    lastCheck = now;
    const list = (notifications||[]).filter(n=>{
      if(!n.created_at) return false;
      if(n.target !== 'all' && n.target !== userId) return false;
      return true;
    }).sort((a,b)=>(b.created_at||0)-(a.created_at||0)).slice(0,5);
    const newOnes = [];
    list.forEach(n=>{
      if(!seenIds.has(n.id)){
        seenIds.add(n.id);
        newOnes.push(n);
      }
    });
    try{
      localStorage.setItem('push_seen_ids', JSON.stringify([...seenIds].slice(-200)));
    }catch(e){}
    newOnes.slice(0,3).forEach(n=>{
      show(n.title || 'MISSION EDU', n.body || '', n.id);
    });
  }

  return { requestPermission, show, isEnabled, trackAndShow };
})();

const NOTIF_TRACKER = (function(){
  let lastSeen = 0;
  try{ lastSeen = Number(localStorage.getItem('last_notif_seen_global')||0); }catch(e){}
  async function check(user, onNew){
    if(!user) return;
    if(Date.now() - lastSeen < 10000) return;
    lastSeen = Date.now();
    try{
      const sb = await DB.getClient();
      const { data } = await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
      const filtered = (data||[]).filter(n => n.target === 'all' || n.target === user.id);
      PUSH_MANAGER.trackAndShow(filtered, user.id);
      if(onNew && filtered.length){
        const unseen = filtered.filter(n => {
          const ts = Number(n.created_at)||0;
          const lastRead = Number(localStorage.getItem('notif_read_'+user.id)||0);
          return ts > lastRead;
        });
        if(unseen.length) onNew(unseen.length);
      }
    }catch(e){}
  }
  return { check };
})();

let _audioCtx = null;
function getAudioCtx(){if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return _audioCtx;}
function beep(frequency,duration,type='sine',volume=0.15){try{const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.value=frequency;osc.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration/1000);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+duration/1000);}catch(e){}}
function playSound(type='notify'){switch(type){case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100);}}

function ExamsPage({examId}){
  const app=useApp();
  const [activeExam,setActiveExam]=useState(examId||null);
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [timeLeft,setTimeLeft]=useState(0);
  const [showResult,setShowResult]=useState(null);
  const [attemptsMap,setAttemptsMap]=useState({});
  const [busy,setBusy]=useState(false);

  useEffect(()=>{(async()=>{try{const sb=await DB.getClient();const {data}=await sb.from('exam_attempts').select('*').eq('user_id',app.currentUser.id);const m={};(data||[]).forEach(a=>{m[a.exam_id]=(m[a.exam_id]||0)+1;});setAttemptsMap(m);}catch(e){}})();},[app.currentUser.id]);

  const exams=app.db.exams.filter(e=>e.published!==false);

  useEffect(()=>{
    if(!activeExam||!activeExam.duration)return;
    const exam=app.exam(activeExam.id);
    if(!exam)return;
    setTimeLeft((exam.duration||15)*60);
    const t=setInterval(()=>setTimeLeft(x=>{if(x<=1){clearInterval(t);return 0;}return x-1;}),1000);
    return ()=>clearInterval(t);
  },[activeExam?.id]);

  useEffect(()=>{if(activeExam&&timeLeft===0&&!submitted){handleSubmit();}},[timeLeft]);

        <div className="sm mb12" style={{fontWeight:700,whiteSpace:'pre-wrap'}}>{SEC.esc(q.text)}</div>

        </div>
      </div>;
    })}</div>}
  </>;
}

function ProfilePage(){
  const app=useApp();
  const user=app.currentUser;
  const lvl=app.getLevel(user.xp||0);
  const isPaid=user.subscription==='paid'||user.subscription==='vip';
  const [uploading,setUploading]=useState(false);

  const uploadAvatar=async file=>{
    if(!file)return;
    if(file.size>5*1024*1024)return app.toast.warn('الصورة أكبر من 5MB');
    if(!file.type.startsWith('image/'))return app.toast.warn('الملف ليس صورة');
    setUploading(true);
    try{
      const sb=await DB.getClient();
      const ext=file.name.split('.').pop();
      const path=`avatars/${user.id}_${Date.now()}.${ext}`;
      const {error}=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});
      if(error)throw new Error(error.message);
      const {data}=sb.storage.from('avatars').getPublicUrl(path);
      await DB.updateUser(user.id,{avatar_url:data.publicUrl});
      await app.reload();
      app.toast.ok('تم تحديث الصورة');
    }catch(e){app.toast.err(e.message);}
    setUploading(false);
  };

  const changePassword=async ()=>{
    const {value:newPass}=await Swal.fire({title:'كلمة مرور جديدة',input:'password',inputPlaceholder:'على الأقل 6 أحرف',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',inputValidator:v=>{if(!v||v.length<6)return 'قصيرة جدًا'},customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});
    if(newPass){try{await DB.updateUser(user.id,{password:newPass});app.toast.ok('تم التحديث');}catch(e){app.toast.err(e.message);}}
  };

  return <>
    <div className="h2 mb16 grad">👤 ملفي</div>
    <div className="glass mb16" style={{padding:22}}>
      <div className="flex center g16 wrap">
        <StudentAvatar student={user} size={100}/>
        <div style={{flex:1,minWidth:200}}>
          <div className="h2 mb6">{SEC.esc(user.name)}</div>
          <div className="sm muted mb8" dir="ltr">📱 {(user.country_code||'+20')}{(user.phone||'').replace(/(\d{3})\d{4}(\d{3})/,'$1****$2')}</div>
          <div className="flex wrap g6">
            <span className="pill pill-b">🏆 Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</span>
            {user.subscription==='vip'?<span className="pill pill-v">💎 VIP</span>:user.subscription==='paid'?<span className="pill pill-g">💳 مدفوع</span>:<span className="pill pill-y">🆓 مجاني</span>}
            {user.governorate&&<span className="pill pill-b">📍 {SEC.esc(user.governorate)}</span>}
          </div>
        </div>
      </div>
      <div className="div"></div>
      <div className="grid g4">
        <Stat label="XP" value={DB.fmt(user.xp||0)} icon="trend" color="#FFD700"/>
        <Stat label="السلسلة" value={DB.fmt(user.streak||0)} icon="flash" color="#f59e0b"/>
        <Stat label="دروس" value={DB.fmt((user.completed_lessons||[]).length)} icon="book" color="#22c55e"/>
        <Stat label="إنجازات" value={DB.fmt((user.achievements||[]).length)} icon="award" color="#B8860B"/>
      </div>
    </div>
    <div className="glass mb16" style={{padding:22}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📷 صورة البروفايل</div>
      {isPaid?<>
        {user.avatar_url?<div className="flex center g12 mb12"><img src={SEC.safeImg(user.avatar_url)||''} alt="" style={{width:80,height:80,borderRadius:16,objectFit:'cover',border:'2px solid var(--gold)'}}/><button className="btn btn-dn btn-sm" onClick={async()=>{await DB.updateUser(user.id,{avatar_url:null});await app.reload();app.toast.ok('تم الحذف');}}>حذف</button></div>:null}
        <label className="btn btn-p" style={{cursor:'pointer',opacity:uploading?.6:1}}>
          {uploading?'جارٍ الرفع...':'📷 رفع صورة جديدة'}
          <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>uploadAvatar(e.target.files[0])} disabled={uploading}/>
        </label>
        <div className="xs muted mt8">حتى 5MB • PNG, JPG, WEBP</div>
      </>:<div className="glass-s" style={{padding:14,textAlign:'center'}}>
        <div style={{fontSize:32,marginBottom:8}}>🔒</div>
        <div className="sm mb6">صور بروفايل مخصصة للمشتركين المدفوعين فقط</div>
        <div className="xs muted">مستواك الحالي: {user.gender==='female'?'👧':'👦'} صورة افتراضية</div>
      </div>}
    </div>
    <div className="glass" style={{padding:22}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>⚙️ الإعدادات</div>
      <button className="btn btn-s btn-block mb12" onClick={changePassword}>🔑 تغيير كلمة المرور</button>
      <button className="btn btn-dn btn-block" onClick={app.logout}>🚪 تسجيل الخروج</button>
    </div>
  </>;
}

function StudentsDirectoryPage({onOpenChat}){
  const app=useApp();
  const [q,setQ]=useState('');
  const students=app.db.users.filter(u=>u.role==='student'&&u.banned!==true&&u.id!==app.currentUser.id);
  const filtered=students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
  const reportStudent=async (target)=>{
    const r=await Swal.fire({
      title:`الإبلاغ عن ${SEC.esc(target.name)}`,
      html:`<select id="swal-reason" class="swal2-input">
        <option value="سلوك غير لائق">سلوك غير لائق</option>
        <option value="محتوى مسيء">محتوى مسيء</option>
        <option value="تحرش">تحرش</option>
        <option value="غش في الاختبارات">غش في الاختبارات</option>
        <option value="إزعاج متكرر">إزعاج متكرر</option>
        <option value="سبب آخر">سبب آخر</option>
      </select>
      <textarea id="swal-details" class="swal2-textarea" placeholder="تفاصيل إضافية (اختياري)"></textarea>`,
      showCancelButton:true,
      confirmButtonText:'📤 إرسال البلاغ',
      cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',
      cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg,#1c160c,#0f0c07)',
      color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'},
      preConfirm:()=>({reason:document.getElementById('swal-reason').value,details:document.getElementById('swal-details').value})
    });
    if(!r.isConfirmed)return;
    try{
      const sb=await DB.getClient();
      await sb.from('reports').insert([{id:DB.uid('rep_'),user_id:target.id,user_name:target.name,user_phone:(target.country_code||'+20')+(target.phone||''),reporter_id:app.currentUser.id,reason:SEC.clean(r.value.reason),details:SEC.clean(SEC.maxLen(r.value.details,500)),created_at:Date.now()}]);
      const newCount=(target.reports_count||0)+1;
      const update={reports_count:newCount};
      if(newCount>=3){update.banned=true;update.ban_reason='حظر تلقائي - 3 بلاغات';update.banned_at=Date.now();}
      await DB.updateUser(target.id,update);
      await app.reload();
      app.toast.ok(newCount>=3?'تم الإبلاغ والحظر التلقائي':'تم الإبلاغ');
    }catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="h2 mb16 grad">👥 الطلاب</div>
    <div className="glass mb16" style={{padding:14}}>
      <input className="input" placeholder="🔍 ابحث عن طالب..." value={q} onChange={e=>setQ(e.target.value)}/>
    </div>
    {filtered.length===0?<div className="glass" style={{padding:30}}><Empty icon="👥" title="لا طلاب"/></div>:
    <div className="grid g3">{filtered.map(s=>{const lvl=app.getLevel(s.xp||0);return <div key={s.id} className="student-card">
      <StudentAvatar student={s} size={70}/>
      <div className="h4 mt8">{SEC.esc(s.name)}</div>
      <div className="xs muted">Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</div>
      <div className="flex center g6 mt8" style={{justifyContent:'center'}}>
        <span className="pill pill-b" style={{fontSize:10}}>{DB.fmt(s.xp||0)} XP</span>
      </div>
      <div className="flex g6 mt8">
        <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>onOpenChat(s.id)}><Icon name="message" size={12}/> رسالة</button>
        <button className="btn btn-dn btn-sm" onClick={()=>reportStudent(s)} title="إبلاغ"><Icon name="flag" size={12}/></button>
      </div>
    </div>;})}</div>}
  </>;
}

function MessagesPage({initialChat,onClearInitial}){
  const app=useApp();
  const user=app.currentUser;
  const [chatWith,setChatWith]=useState(initialChat||null);
  const [text,setText]=useState('');
  const [busy,setBusy]=useState(false);
  const [tab,setTab]=useState('inbox');

  useEffect(()=>{if(initialChat){setChatWith(initialChat);onClearInitial?.();}},[initialChat]);

  const allMsgs=(app.db.direct_messages||[]);
  const inbox=allMsgs.filter(m=>m.to_id===user.id).sort((a,b)=>b.created_at-a.created_at);
  const sent=allMsgs.filter(m=>m.from_id===user.id).sort((a,b)=>b.created_at-a.created_at);
  const conversation=chatWith?allMsgs.filter(m=>(m.from_id===user.id&&m.to_id===chatWith)||(m.from_id===chatWith&&m.to_id===user.id)).sort((a,b)=>a.created_at-b.created_at):[];
  const otherUser=chatWith?app.db.users.find(u=>u.id===chatWith):null;

  const send=async ()=>{
    if(!SEC.rateLimit('dm_'+user.id,1500))return app.toast.warn('انتظر لحظة');
    const t=SEC.clean(SEC.maxLen(text,1000));
    if(!t)return;
    setBusy(true);
    try{
      await app.save('direct_messages',{from_id:user.id,to_id:chatWith,text:t,created_at:Date.now(),read:false});
      setText('');
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };

  if(chatWith&&otherUser){
    return <>
      <div className="flex between center mb16">
        <button className="btn btn-s" onClick={()=>setChatWith(null)}>← رجوع</button>
        <div className="flex center g8"><StudentAvatar student={otherUser} size={36}/><div><div className="sm" style={{fontWeight:700}}>{SEC.esc(otherUser.name)}</div></div></div>
      </div>
      <div className="glass" style={{padding:16}}>
        <div className="chat-list" style={{marginBottom:12}}>
          {conversation.length===0?<Empty icon="💬" title="لا رسائل بعد"/>:
          conversation.map(m=><div key={m.id} style={{display:'flex',justifyContent:m.from_id===user.id?'flex-end':'flex-start'}}>
            <div className={`chat-bubble ${m.from_id===user.id?'me':'other'}`}>
              {SEC.esc(m.text)}
              <span className="chat-time">{DB.formatDateTime(m.created_at)}</span>
            </div>
          </div>)}
        </div>
        <div className="flex g8">
          <input className="input" placeholder="اكتب رسالة..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!busy&&send()} maxLength={1000}/>
          <button className="btn btn-p" onClick={send} disabled={busy||!text.trim()}><Icon name="send" size={16}/></button>
        </div>
      </div>
    </>;
  }

  return <>
    <div className="h2 mb16 grad">💬 الرسائل</div>
    <div className="msg-tabs">
      <button className={`msg-tab ${tab==='inbox'?'active':''}`} onClick={()=>setTab('inbox')}>📥 الوارد ({inbox.length})</button>
      <button className={`msg-tab ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>📤 المرسل ({sent.length})</button>
    </div>
    <div className="glass" style={{padding:16}}>
      {(tab==='inbox'?inbox:sent).length===0?<Empty icon="💬" title="لا رسائل"/>:
      (tab==='inbox'?inbox:sent).map(m=>{const otherId=tab==='inbox'?m.from_id:m.to_id;const other=app.db.users.find(u=>u.id===otherId);return <div key={m.id} className={`msg-card ${!m.read&&tab==='inbox'?'unread':''}`} onClick={()=>{setChatWith(otherId);if(tab==='inbox'&&!m.read){DB.save('direct_messages',{...m,read:true});}}}>
        <div className="flex between center mb6"><div className="flex center g8">{other&&<StudentAvatar student={other} size={28}/>}<span className="sm" style={{fontWeight:700}}>{SEC.esc(other?.name||'محذوف')}</span></div><span className="xs muted">{DB.formatDateTime(m.created_at)}</span></div>
        <div className="sm muted" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{SEC.esc(m.text)}</div>
      </div>;})}
    </div>
  </>;
}

function Footer(){
  const app=useApp();
  const user=app.currentUser;

function StudentApp(){
  const app=useApp();
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('student_tab')||'home'}catch(e){return 'home'}});
  const [subId,setSubId]=useState(null);
  const [chatWith,setChatWith]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [pushEnabled,setPushEnabled]=useState(PUSH_MANAGER.isEnabled());
  const user=app.currentUser;

  useEffect(()=>{try{localStorage.setItem('student_tab',tab)}catch(e){}},[tab]);

  const unreadMsgs=(app.db.direct_messages||[]).filter(m=>m.to_id===user.id&&!m.read).length;
  const unreadNotifs=(app.db.notifications||[]).filter(n=>{
    if(n.target!=='all'&&n.target!==user.id)return false;
    const created=Number(n.created_at)||0;
    const lastSeen=Number(localStorage.getItem('notif_read_'+user.id)||0);
    return created>lastSeen;
  }).length;

  useEffect(()=>{
    if(!user) return;
    const loop = async ()=>{
      await NOTIF_TRACKER.check(user);
    };
    loop();
    const iv = setInterval(loop, 25000);
    return ()=>clearInterval(iv);
  },[user?.id]);

  const enablePush=async ()=>{
    const ok = await PUSH_MANAGER.requestPermission();
    if(ok){
      setPushEnabled(true);
      PUSH_MANAGER.show('MISSION EDU','تم تفعيل الإشعارات بنجاح ✅');
      app.toast.ok('تم تفعيل الإشعارات');
    } else {
      app.toast.warn('لم يتم منح الإذن');
    }
  };

  useEffect(()=>{
    if(PUSH_MANAGER.isEnabled()){
      PUSH_MANAGER.show('MISSION EDU', 'أهلاً بك في المنصة 🎓');
    }
  },[]);

  const items=[
    {title:'الرئيسية',items:[{id:'home',icon:'home',label:'الرئيسية'}]},
    {title:'التعلم',items:[{id:'lessons',icon:'book',label:'الدروس'},{id:'exams',icon:'clipboard',label:'الاختبارات'}]},
    {title:'التواصل',items:[{id:'leaderboard',icon:'trophy',label:'المتصدرين'},{id:'students',icon:'users',label:'الطلاب'},{id:'messages',icon:'message',label:'الرسائل',badge:unreadMsgs||null},{id:'notifications',icon:'bell',label:'الإشعارات',badge:unreadNotifs||null}]},
    {title:'الحساب',items:[{id:'profile',icon:'user',label:'ملفي'}]}
  ];

  const navigate=(id,sub)=>{setTab(id);setSubId(sub||null);setSidebarOpen(false);};

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={navigate} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={app.logout}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} unreadNotifs={unreadNotifs} unreadMsgs={unreadMsgs} onOpenNotifications={()=>navigate('notifications')} onOpenMessages={()=>navigate('messages')} onOpenProfile={()=>navigate('profile')} pushEnabled={pushEnabled} onEnablePush={enablePush}/>
      <div className="content">
        {tab==='home'&&<HomePage onNavigate={navigate}/>}
        {tab==='lessons'&&<LessonsPage lessonId={subId} onBack={(t,id)=>navigate(t,id)}/>}
        {tab==='exams'&&<ExamsPage examId={subId}/>}
        {tab==='leaderboard'&&<LeaderboardPage/>}
        {tab==='students'&&<StudentsDirectoryPage onOpenChat={id=>{setChatWith(id);navigate('messages');}}/>}
        {tab==='messages'&&<MessagesPage initialChat={chatWith} onClearInitial={()=>setChatWith(null)}/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='profile'&&<ProfilePage/>}
        <Footer/>
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading)return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser)return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const bar = document.createElement('div');

            document.body.appendChild(bar);
          }
        });
      });
    }).catch(() => {});
  });
}
