<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — لوحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{
--bg:#050a14;--gold:#00d4ff;--gold-soft:#a0e8ff;--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%);
--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.75);--sh-gold:0 10px 30px rgba(0,212,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),var(--bg);color:var(--txt);min-height:100vh;line-height:1.7}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(10,18,32,.78),rgba(5,10,20,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass-s{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:var(--rs)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(10,18,32,.96),rgba(5,10,20,.92));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold)}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,#00ffff,#a0e8ff 45%,#00d4ff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;width:100%;text-align:right;position:relative}
.nav-i:hover,.nav-i.on{background:linear-gradient(90deg,rgba(0,212,255,.24),rgba(0,212,255,.03));color:#a0e8ff}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(5,10,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:52px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;color:var(--txt)}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 10px 28px rgba(0,212,255,.42)}
.btn-s{background:rgba(0,212,255,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.mb16{margin-bottom:16px}.mt8{margin-top:8px}
.grad{background:linear-gradient(100deg,#00ffff,#a0e8ff 50%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero{padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.12));border:1px solid var(--border2)}
.lesson-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.lesson-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.lesson-thumb{aspect-ratio:16/9;background:#0a1220;display:grid;place-items:center;position:relative}
.lesson-body{padding:14px}.lesson-title{font-weight:800;font-size:14.5px}
.pill{display:inline-flex;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;background:rgba(0,212,255,.16);color:#00ffff;border:1px solid rgba(0,212,255,.35)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:grid;place-items:center}
.modal{width:100%;max-width:500px;padding:22px}
/* باقي الـ CSS بتاعك */
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/db.js"></script>
<script>
if (window.Babel) { Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] }); }
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;
const SEC = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  safeUrl: u => /^https?:\/\//i.test(String(u || '')) ? u : '#',
  safeImg: u => /^https?:\/\/.+\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(String(u || '')) ? u : null,
  clean: s => String(s ?? '').replace(/[<>]/g,'').trim(),
  maxLen: (s, n=500) => String(s ?? '').slice(0, n),
};
// ... (باقي كود الحماية والـ Context زي ما هو)
const ToastCtx=createContext(null);
function ToastProvider({children}){const [items,setItems]=useState([]);const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');setItems(x=>[...x,{id,msg,type,title,duration}]);},[]);const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host" style={{position:'fixed',bottom:20,left:20,zIndex:9999}}>{items.map(t=><div key={t.id} onClick={()=>remove(t.id)} style={{background:'#00d4ff',color:'#000',padding:10,marginTop:10,borderRadius:8,cursor:'pointer',fontWeight:'bold'}}>{t.msg}</div>)}</div></ToastCtx.Provider>;}
const useToast=()=>useContext(ToastCtx);
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],direct_messages:[],reports:[],friendships:[],xp_shop_items:[],xp_purchases:[],study_groups:[],study_group_members:[],study_plans:[],study_tasks:[],daily_challenges:[],daily_challenge_attempts:[],practice_sessions:[],focus_sessions:[],flashcards:[],video_progress:[],daily_reward:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      const data=await DB.loadAll();
      const sb=await DB.getClient();
      const extra=['direct_messages','xp_shop_items','xp_purchases','study_groups','study_group_members','study_plans','study_tasks','daily_challenges','daily_challenge_attempts','flashcards','video_progress','daily_reward','friendships','practice_sessions','focus_sessions'];
      const extraResults=await Promise.all(extra.map(async(t)=>{try{const res=await sb.from(t).select('*').limit(2000);return{t,data:res.data||[]};}catch(e){return{t,data:[]};}}));
      extraResults.forEach(r=>{data[r.t]=r.data;});
      setDb(data);
      
      // تحديث بيانات اليوزر عشان الـ XP
      setCurrentUser(prev => {
        if (!prev) return null;
        const fresh = data.users.find(u => u.id === prev.id);
        return fresh || prev;
      });
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{(async ()=>{try{const sid=DB.getSessionId();if(!sid){window.location.replace('../auth/login.html');return;}const u=await DB.getUser(sid);if(!u||u.active===false||u.banned===true){DB.clearSession();window.location.replace('../auth/login.html');return;}setCurrentUser(u);await reload();}catch(e){}setLoading(false);})();},[]);

  const logout=useCallback(()=>{DB.clearSession();window.location.replace('../auth/login.html');},[]);

  const save=useCallback(async (table,item)=>{const saved=await DB.save(table,SEC.sanitizeObject(item));await reload();return saved;},[reload]);
  const remove=useCallback(async (table,id)=>{await DB.remove(table,id);await reload();},[reload]);
  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return {current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}return {current:cur,next};},[db.levels]);

  return <AppCtx.Provider value={{db,currentUser,loading,logout,reload,save,remove,getLevel,toast,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id)}}>{children}</AppCtx.Provider>;
}

const Icon=({name,size=18,color='currentColor'})=>{
  const p={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:color,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'};
  const paths={home:<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>, book:<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>, clipboard:<><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></>, target:<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>, layers:<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></>, clock:<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>, calendar:<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>, handshake:<><path d="M11 17l-3-3 4-4 3 3"/><path d="M14 14l4 4-3 3-4-4"/></>, swords:<><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/></>, trophy:<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>, school:<><path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></>, users:<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></>, message:<><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>, bell:<><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>, shoppingBag:<><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>, user:<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>, chart:<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>, menu:<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>, logout:<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>, play:<><polygon points="5 3 19 12 5 21 5 3"/></>, gift:<><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/></>};
  return <svg {...p}>{paths[name]||paths.help}</svg>;
};

function Stat({label,value,icon,color='var(--gold)',sub}){return <div className="glass-s" style={{padding:16}}><div className="flex between center mb8"><div className="stat-l">{label}</div><div style={{color}}><Icon name={icon} size={20}/></div></div><div className="stat-n" style={{color,fontWeight:900,fontSize:24}}>{value}</div>{sub&&<div className="xs muted mt8">{sub}</div>}</div>;}

function StudentAvatar({student, size=40}){
  if(student?.avatar_url){
    return <img src={SEC.safeImg(student.avatar_url)} loading="lazy" style={{width:size,height:size,borderRadius:12,objectFit:'cover',border:'2px solid var(--gold)'}}/>;
  }
  const isFemale = student?.gender==='female';
  const icon = isFemale ? '👧' : student?.gender==='male' ? '👦' : '👤';
  return <div style={{width:size,height:size,borderRadius:12,background:isFemale?'linear-gradient(135deg,#f472b6,#ec4899)':'linear-gradient(135deg,#60a5fa,#3b82f6)',display:'grid',placeItems:'center',fontSize:size*0.55,border:'2px solid rgba(0,212,255,.4)'}}>{icon}</div>;
}

function Sidebar({items,active,onNav,open,onClose,onLogout}){return <>{open&&<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:55}}/>}<aside className={`sidebar ${open?'open':''}`}><div className="brand"><div className="brand-logo"><Icon name="trophy" size={22} color="#050a14"/></div><div><div className="brand-name">MISSION EDU</div><div className="brand-sub">المنصة التعليمية</div></div></div><div style={{flex:1,overflowY:'auto'}}>{items.map((g,gi)=><div key={gi}>{g.title&&<div className="nav-gt" style={{fontSize:12,color:'var(--muted)',marginTop:15,marginBottom:5}}>{g.title}</div>}{g.items.map(it=><button key={it.id} className={`nav-i ${active===it.id?'on':''}`} onClick={()=>{onNav(it.id);onClose?.();}} style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:10,marginBottom:2}}><Icon name={it.icon} size={16}/><span>{it.label}</span></button>)}</div>)}</div><div style={{marginTop:'10px',paddingTop:'10px',borderTop:'1px solid var(--border)'}}><button className="nav-i" onClick={onLogout} style={{color:'#fca5a5',width:'100%'}}><Icon name="logout" size={16}/><span>تسجيل الخروج</span></button></div></aside></>;}

function Topbar({user,onMenu,onLogout,unreadNotifs,unreadMsgs,onOpenNotifications,onOpenMessages,onOpenProfile}){
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}><Icon name="menu" size={16}/></button>
    <div className="flex center g8" style={{marginInlineStart:'auto'}}>
      <button className="icon-btn" onClick={onOpenMessages}><Icon name="message" size={16}/>{unreadMsgs>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--gold)',color:'#000',fontSize:10,padding:'2px 5px',borderRadius:10}}>{unreadMsgs}</span>}</button>
      <button className="icon-btn" onClick={onOpenNotifications}><Icon name="bell" size={16}/>{unreadNotifs>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--gold)',color:'#000',fontSize:10,padding:'2px 5px',borderRadius:10}}>{unreadNotifs}</span>}</button>
      <button className="glass-s" onClick={onOpenProfile} style={{padding:'4px 10px',display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
        <StudentAvatar student={user} size={30}/><span className="sm" style={{fontWeight:700}}>{SEC.esc(user.name)}</span>
      </button>
      <button className="icon-btn" onClick={onLogout}><Icon name="logout" size={16}/></button>
    </div>
  </div>;
}

function HomePage({onNavigate}){
  const app=useApp();
  const user=app.currentUser;
  const lvl=app.getLevel(user.xp||0);
  const totalLessons=app.db.lessons.filter(l=>l.published!==false).length;
  const completed=(user.completed_lessons||[]).length;
  const progress=totalLessons?Math.round((completed/totalLessons)*100):0;
  const recentExams=app.db.exams.slice(0,3);
  
  // المكافأة اليومية
  const today = new Date().toLocaleDateString('en-CA');
  const todayReward = (app.db.daily_reward || []).find(r => r.user_id === user.id && r.date === today);
  const claimDailyReward = async () => {
    if (todayReward) return app.toast.info('استلمت مكافأة اليوم بالفعل');
    try {
      const sb = await DB.getClient();
      const { data: existing } = await sb.from('daily_reward').select('*').eq('user_id', user.id).eq('date', today);
      if (existing && existing.length > 0) return app.toast.info('استلمت مكافأة اليوم بالفعل');
      
      await sb.from('daily_reward').insert([{ id: DB.uid('dr_'), user_id: user.id, date: today, xp: 50, claimed_at: Date.now() }]);
      await DB.updateUser(user.id, { xp: (user.xp || 0) + 50, last_daily_reward: Date.now() });
      await app.reload();
      app.toast.ok('🎁 +50 XP مكافأة يومية!');
    } catch (e) {
      Swal.fire({ title: 'خطأ', text: e.message, icon: 'error', background: '#050a14', color: '#fff' });
    }
  };

  return <>
    <div className="hero mb16">
      <div className="flex between center">
        <div>
          <div className="h2 grad">أهلاً، {SEC.esc(user.name.split(' ')[0])} 👋</div>
          <div className="sm txt2">مستواك: Lv {lvl.current.level} — {lvl.current.name}</div>
        </div>
        <div style={{textAlign:'left'}}>
          <div className="sm muted">XP</div>
          <div className="stat-n" style={{color:'var(--gold)'}}>{user.xp||0}</div>
        </div>
      </div>
    </div>

    <div className="grid g4 mb16">
      <Stat label="المستوى" value={`Lv ${lvl.current.level}`} icon="trend" color="var(--gold)"/>
      <Stat label="السلسلة" value={user.streak||0} icon="flash" color="#f59e0b"/>
      <Stat label="الدروس" value={`${completed}/${totalLessons}`} icon="book" color="#22c55e"/>
      <Stat label="الإنجازات" value={(user.achievements||[]).length} icon="award" color="var(--gold-d)"/>
    </div>

    {!todayReward && (
      <div className="glass mb16" style={{padding:18,borderColor:'rgba(34,197,94,.4)'}}>
        <div className="flex between center">
          <div className="flex center g12">
            <div style={{fontSize:32}}>🎁</div>
            <div><div className="h4" style={{color:'#6ee7a0'}}>مكافأة اليوم جاهزة!</div></div>
          </div>
          <button className="btn btn-ok" onClick={claimDailyReward}>استلام +50 XP</button>
        </div>
      </div>
    )}

    <div className="grid g2 mb16">
      <div className="glass" style={{padding:18}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📖 مواصلة التعلم</div>
        {app.db.lessons.filter(l=>l.published!==false).slice(0,3).map(l=>(
          <div key={l.id} className="flex center g12 mb8" style={{padding:10,background:'rgba(0,212,255,.04)',borderRadius:10,cursor:'pointer'}} onClick={()=>window.location.href=`lesson.html?id=${l.id}`}>
            <div style={{width:40,height:40,borderRadius:10,background:'var(--grad-gold)',display:'grid',placeItems:'center',color:'#050a14',fontSize:18}}>📖</div>
            <div style={{flex:1}}><div className="sm" style={{fontWeight:700}}>{l.title}</div></div>
            <span className="pill">+{l.xp||0} XP</span>
          </div>
        ))}
      </div>
      <div className="glass" style={{padding:18}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📝 اختبارات</div>
        {recentExams.map(e=>(
          <div key={e.id} className="flex center g12 mb8" style={{padding:10,background:'rgba(0,212,255,.04)',borderRadius:10,cursor:'pointer'}} onClick={()=>window.location.href=`exam.html?id=${e.id}`}>
            <div style={{width:40,height:40,borderRadius:10,background:'rgba(0,212,255,.15)',display:'grid',placeItems:'center',color:'var(--gold)',fontSize:18}}>📝</div>
            <div style={{flex:1}}><div className="sm" style={{fontWeight:700}}>{e.title}</div></div>
          </div>
        ))}
      </div>
    </div>
  </>;
}

function LessonsPage(){
  const app=useApp();
  const [filterSubject,setFilterSubject]=useState('all');
  const lessons=app.db.lessons.filter(l=>l.published!==false);
  const filtered=filterSubject==='all'?lessons:lessons.filter(l=>{const u=app.unit(l.unit_id);return u?.subject_id===filterSubject;});
  
  return <>
    <div className="h2 mb16 grad">📖 الدروس</div>
    <div className="flex wrap g6 mb16">
      <button onClick={()=>setFilterSubject('all')} className={`btn btn-s btn-sm ${filterSubject==='all'?'btn-p':''}`}>الكل</button>
      {app.db.subjects.map(s=><button key={s.id} onClick={()=>setFilterSubject(s.id)} className={`btn btn-s btn-sm ${filterSubject===s.id?'btn-p':''}`}>{s.name}</button>)}
    </div>
    <div className="grid g3">
      {filtered.map(l=>{
        const unit=app.unit(l.unit_id);
        return (
          // التوجيه لملف lesson.html مع تمرير ID الدرس
          <div key={l.id} className="lesson-card" onClick={()=>window.location.href=`lesson.html?id=${l.id}`}>
            <div className="lesson-thumb">
               <Icon name="play" size={30} color="var(--gold)"/>
            </div>
            <div className="lesson-body">
              <div className="lesson-title">{l.title}</div>
              <div className="sm muted mt8">{unit?.name||''} • +{l.xp||0} XP</div>
            </div>
          </div>
        );
      })}
    </div>
  </>;
}

function ExamsPage(){
  const app=useApp();
  const exams=app.db.exams.filter(e=>e.published!==false);
  return <>
    <div className="h2 mb16 grad">📝 الاختبارات</div>
    <div className="grid g2">
      {exams.map(e=>(
        // التوجيه لملف exam.html مع تمرير ID الاختبار
        <div key={e.id} className="glass" style={{padding:18,cursor:'pointer'}} onClick={()=>window.location.href=`exam.html?id=${e.id}`}>
          <div className="h4">{e.title}</div>
          <div className="sm muted mt8">{e.duration} دقيقة • {e.question_ids?.length||0} سؤال</div>
        </div>
      ))}
    </div>
  </>;
}

// مكونات وهمية للميزات التانية (لأنك ممكن تكون عاملها في صفحات منفصلة أو لسه)
function AnalyticsPage(){return <div className="h2">📊 تحليلاتي (قيد التطوير)</div>;}
function PracticePage(){return <div className="h2">🎯 وضع التدريب (قيد التطوير)</div>;}
function FlashcardsPage(){return <div className="h2">🃏 Flashcards (قيد التطوير)</div>;}
function FocusModePage(){return <div className="h2">🎯 وضع التركيز (قيد التطوير)</div>;}
function StudyCalendarPage(){return <div className="h2">📅 تقويم المذاكرة (قيد التطوير)</div>;}
function StudyGroupsPage(){return <div className="h2">👥 مجموعات الدراسة (قيد التطوير)</div>;}
function XPShopPage(){return <div className="h2">🛒 متجر XP (قيد التطوير)</div>;}
function LeaderboardPage(){return <div className="h2">🏆 المتصدرين (قيد التطوير)</div>;}
function SchoolLeaderboardPage(){return <div className="h2">🏫 ترتيب المدارس (قيد التطوير)</div>;}
function StudentsDirectoryPage(){return <div className="h2">👥 الطلاب (قيد التطوير)</div>;}
function MessagesPage(){return <div className="h2">💬 الرسائل (قيد التطوير)</div>;}
function NotificationsPage(){return <div className="h2">🔔 الإشعارات (قيد التطوير)</div>;}
function ProfilePage(){return <div className="h2">👤 ملفي (قيد التطوير)</div>;}

function StudentApp(){
  const app=useApp();
  const [tab,setTab]=useState('home');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const user=app.currentUser;

  const items=[
    {title:'الرئيسية',items:[{id:'home',icon:'home',label:'الرئيسية'},{id:'analytics',icon:'chart',label:'تحليلاتي'}]},
    {title:'التعلم',items:[{id:'lessons',icon:'book',label:'الدروس'},{id:'exams',icon:'clipboard',label:'الاختبارات'}]},
    {title:'الأنشطة',items:[
      {id:'focus',icon:'clock',label:'وضع التركيز'},
      {id:'calendar',icon:'calendar',label:'تقويم المذاكرة'},
      {id:'groups',icon:'handshake',label:'مجموعات الدراسة'},
      {id:'friend-challenge',icon:'swords',label:'تحدي الأصدقاء'}
    ]},
    {title:'التواصل',items:[{id:'leaderboard',icon:'trophy',label:'المتصدرين'},{id:'students',icon:'users',label:'الطلاب'},{id:'messages',icon:'message',label:'الرسائل'}]},
    {title:'الحساب',items:[{id:'xp-shop',icon:'shoppingBag',label:'متجر XP'},{id:'profile',icon:'user',label:'ملفي'}]}
  ];

  const navigate=(id)=>{
    if(id === 'friend-challenge'){
      window.location.href = 'sv.html';
      return;
    }
    setTab(id);
    setSidebarOpen(false);
  };

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={navigate} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={app.logout}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} unreadNotifs={0} unreadMsgs={0} onOpenNotifications={()=>navigate('notifications')} onOpenMessages={()=>navigate('messages')} onOpenProfile={()=>navigate('profile')}/>
      <div className="content">
        {tab==='home'&&<HomePage onNavigate={navigate}/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='analytics'&&<AnalyticsPage/>}
        {tab==='focus'&&<FocusModePage/>}
        {tab==='calendar'&&<StudyCalendarPage/>}
        {tab==='groups'&&<StudyGroupsPage/>}
        {tab==='leaderboard'&&<LeaderboardPage/>}
        {tab==='students'&&<StudentsDirectoryPage/>}
        {tab==='messages'&&<MessagesPage/>}
        {tab==='xp-shop'&&<XPShopPage/>}
        {tab==='profile'&&<ProfilePage/>}
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading)return <div style={{display:'grid',placeItems:'center',height:'100vh',color:'#00d4ff'}}>جارٍ التحميل...</div>;
  if(!app.currentUser)return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
