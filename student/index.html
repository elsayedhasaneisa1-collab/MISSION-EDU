<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — لوحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{
--bg:#050a14;--bg2:#0a1220;
--gold:#00d4ff;--gold-l:#00ffff;--gold-xl:#5ffbff;--gold-d:#0088cc;--gold-dd:#005580;
--gold-soft:#a0e8ff;--gold-glow:rgba(0,212,255,.35);
--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);--border3:rgba(0,255,255,.55);
--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#7c3aed;
--r:20px;--rs:13px;
--sh:0 18px 50px rgba(0,0,0,.75), 0 0 0 1px rgba(0,212,255,.05) inset;
--sh-gold:0 10px 30px rgba(0,212,255,.35);
--sh-gold-h:0 14px 40px rgba(0,212,255,.55);
--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%);
--grad-gold-soft:linear-gradient(135deg,rgba(0,255,255,.18),rgba(0,212,255,.08));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(0,255,255,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,212,255,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00d4ff,#0088cc);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(10,18,32,.78),rgba(5,10,20,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,rgba(0,255,255,.25),rgba(0,212,255,.05) 40%,rgba(0,255,255,.20));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass-s{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(10,18,32,.96),rgba(5,10,20,.92));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,212,255,.4)}50%{box-shadow:0 0 40px rgba(0,212,255,.8)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 8px 26px rgba(0,212,255,.55),0 0 0 1px rgba(95,251,255,.3) inset;position:relative}
.brand-logo::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,#00ffff,#a0e8ff 45%,#00d4ff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s linear infinite}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(0,212,255,.10);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(0,212,255,.24),rgba(0,212,255,.03));color:#a0e8ff}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#00ffff,#00d4ff);box-shadow:0 0 12px rgba(0,255,255,.7)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(5,10,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:52px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 10px 28px rgba(0,212,255,.42),0 0 0 1px rgba(95,251,255,.4) inset;position:relative;overflow:hidden}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:var(--sh-gold-h);transform:translateY(-2px);color:#000}
.btn-s{background:rgba(0,212,255,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:rgba(0,212,255,.16);color:#a0e8ff;border-color:var(--border2)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#00ffff,#a0e8ff 50%,#00d4ff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 5s linear infinite}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill-b{background:rgba(0,212,255,.16);color:#00ffff;border-color:rgba(0,212,255,.35)}
.pill-g{background:rgba(34,197,94,.16);color:#6ee7a0;border-color:rgba(34,197,94,.32)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.pill-v{background:rgba(124,58,237,.18);color:#c4b5fd;border-color:rgba(124,58,237,.35)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}
.pill-paid{background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(0,212,255,.10));color:#00ffff;border:1px solid rgba(0,212,255,.45)}
.bar{height:9px;border-radius:20px;background:rgba(0,212,255,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold);box-shadow:0 0 14px rgba(0,212,255,.5)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(5,10,20,.78);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(0,212,255,.14)}
.input::placeholder{color:var(--muted)}
textarea.input{resize:vertical;min-height:80px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--gold);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(0,212,255,.08);vertical-align:middle}
.sx{overflow-x:auto}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,212,255,.08);border:1px solid var(--border);transition:.2s;font-size:15px;color:var(--gold);position:relative;flex-shrink:0}
.icon-btn:hover{background:rgba(0,212,255,.18);border-color:var(--border2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{padding:16px 20px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.12) 50%,rgba(0,255,255,.06));border:1px solid var(--border2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.vid-preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border2);position:relative;margin-top:10px}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:0;display:block;object-fit:contain}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(0,212,255,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#00ffff,#00d4ff);color:#050a14}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:rgba(0,212,255,.10);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(10,18,32,.98),rgba(5,10,20,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7);animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(0,212,255,.08);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(0,212,255,.20);color:#00ffff}
.toast.info .toast-bar-f{background:var(--grad-gold)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(0,212,255,.14);position:relative;flex-wrap:wrap}
.footer-dev::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:180px;height:1px;background:linear-gradient(90deg,transparent,#00ffff,transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s;border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.18));border-color:rgba(0,212,255,.4);color:var(--txt)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(0,212,255,.32),rgba(0,150,255,.32));border-color:#00ffff;transform:translateY(-2px)}
.dev-name b{background:linear-gradient(90deg,#00ffff,#a0e8ff,#00d4ff,#00ffff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900}
.tg-btn{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.35);color:#00ffff}
.tg-btn:hover{background:rgba(0,212,255,.24);border-color:#00ffff;color:#a0e8ff}
.swal-custom-popup{border:1px solid rgba(0,212,255,.4)!important;border-radius:22px!important;box-shadow:0 24px 70px rgba(0,0,0,.85)!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-title{color:#e0f7ff!important;font-size:20px!important;font-weight:800!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-input{background:rgba(5,10,20,.78)!important;border:1.5px solid rgba(0,212,255,.35)!important;color:#e0f7ff!important;border-radius:12px!important;font-family:'Tajawal','Cairo',sans-serif!important}
.section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(0,212,255,.12);font-size:14px;color:var(--gold);flex-shrink:0}
.msg-card{background:rgba(0,212,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;transition:.2s}
.msg-card:hover{border-color:var(--border2);background:rgba(0,212,255,.07)}
.msg-card.unread{border-inline-start:3px solid var(--gold);background:rgba(0,212,255,.08)}
.msg-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.msg-tab{padding:8px 16px;border-radius:20px;font-weight:700;font-size:12.5px;background:rgba(0,212,255,.06);border:1px solid var(--border);color:var(--txt2);transition:.2s;cursor:pointer}
.msg-tab.active{background:rgba(0,212,255,.20);border-color:var(--gold);color:#00ffff}
.chat-list{max-height:420px;overflow-y:auto}
.chat-bubble{max-width:70%;padding:10px 14px;border-radius:14px;margin-bottom:8px;font-size:13px;word-wrap:break-word;line-height:1.5}
.chat-bubble.me{background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(0,212,255,.15));margin-inline-start:auto;border-bottom-left-radius:4px}
.chat-bubble.other{background:rgba(255,255,255,.06);border-bottom-right-radius:4px}
.chat-time{font-size:10px;color:var(--muted);margin-top:4px;display:block}
.student-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.24s;text-align:center}
.student-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.lesson-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.24s;cursor:pointer}
.lesson-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.lesson-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#0a1220,#050a14);position:relative;display:grid;place-items:center;overflow:hidden}
.lesson-thumb img{width:100%;height:100%;object-fit:cover}
.lesson-thumb .play{width:56px;height:56px;border-radius:50%;background:rgba(0,212,255,.9);display:grid;place-items:center;color:#050a14;font-size:22px;position:absolute;box-shadow:0 8px 28px rgba(0,212,255,.6)}
.lesson-body{padding:14px}
.lesson-title{font-weight:800;font-size:14.5px;margin-bottom:6px;line-height:1.4}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.qbox-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--border);transition:.18s;cursor:pointer}
.qbox-opt:hover{background:rgba(0,212,255,.08)}
.qbox-opt-letter{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,212,255,.15);color:var(--gold);font-weight:800;font-size:12px;flex-shrink:0}
.qbox.selected{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,212,255,.05));border-color:var(--gold)}
.sec-warning{position:fixed;top:0;inset-inline:0;background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;padding:10px;text-align:center;font-weight:800;font-size:13px;z-index:99999;animation:shake .5s;display:none}
.sec-warning.show{display:block}
.shop-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;transition:.24s;cursor:pointer}
.shop-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.flashcard{perspective:1000px;height:200px;cursor:pointer;margin-bottom:12px}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:20px;text-align:center;font-weight:700;font-size:16px;border:1px solid var(--border2)}
.flashcard-front{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,150,255,.08))}
.flashcard-back{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.08));transform:rotateY(180deg)}
.focus-timer{font-size:clamp(48px,10vw,96px);font-weight:900;letter-spacing:2px;font-family:monospace;color:var(--gold);text-shadow:0 0 30px rgba(0,212,255,.5)}
.calendar-day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:rgba(0,212,255,.04);border:1px solid var(--border);font-size:12px;cursor:pointer;transition:.2s}
.calendar-day:hover{border-color:var(--border2)}
.calendar-day.today{background:rgba(0,212,255,.20);border-color:var(--gold);font-weight:800}
.calendar-day.done{background:rgba(34,197,94,.15);border-color:#22c55e}
.reward-banner{animation:glow 2.5s ease-in-out infinite}
.xp-pop{animation:pop .5s ease-out}
body.light-mode{--bg:#f0f4f8;--bg2:#e0e8f0;--txt:#0a1220;--txt2:#4a5f7a;--muted:#8fa5bd;background:#f0f4f8}
body.light-mode .glass{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(240,244,248,.85));border-color:rgba(0,212,255,.35)}
body.light-mode .glass-s{background:rgba(255,255,255,.85)}
body.light-mode .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(240,244,248,.95))}
body.light-mode .topbar{background:rgba(255,255,255,.85)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
.sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;max-width:85vw;box-shadow:-20px 0 60px rgba(0,0,0,.75);overflow-x:hidden}
.sidebar.open{transform:translateX(0)!important}
.mbar{display:flex}
.content{padding:14px 14px 90px}
.topbar{padding:6px 10px;gap:6px;min-height:48px}
.icon-btn{width:32px;height:32px;font-size:14px}
.g2,.g3,.g4{grid-template-columns:1fr}
}
</style>

<div id="secWarning" class="sec-warning">⚠️ تم كشف محاولة تلاعب — الجلسة هتُغلق</div>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

if (window.Babel) { Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] }); }

<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;
const SEC = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  safeUrl: u => /^https?:\/\//i.test(String(u || '')) ? u : '#',
  safeImg: u => /^https?:\/\/.+\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(String(u || '')) || /^https:\/\/.+\.supabase\.(co|in)\/storage\//i.test(String(u||'')) ? u : null,
  clean: s => String(s ?? '').replace(/[<>]/g,'').trim(),
  maxLen: (s, n=500) => String(s ?? '').slice(0, n),
  rateLimit: (()=>{const store={};return (key,ms=3000)=>{const now=Date.now();if(store[key]&&now-store[key]<ms)return false;store[key]=now;return true;};})(),
  sanitizeObject: obj => {
    if(!obj || typeof obj!=='object') return obj;
    const out = Array.isArray(obj) ? [] : {};
    for(const k in obj){
      if(/^(__proto__|constructor|prototype)$/.test(k)) continue;
      const v = obj[k];
      if(typeof v==='string') out[k] = SEC.maxLen(v, 5000);
      else if(typeof v==='object' && v !== null) out[k] = SEC.sanitizeObject(v);
      else out[k] = v;
    }
    return out;
  }
};
const ANTI_TAMPER = (function(){
  let locked = false;
  function lock(reason){
    if(locked) return;
    locked = true;
    try{ DB.clearSession(); }catch(e){}
    try{
      const w = document.getElementById('secWarning');
      if(w){ w.textContent = '⚠️ ' + (reason || 'تم كشف تلاعب — الجلسة مغلقة'); w.classList.add('show'); }
    }catch(e){}
    setTimeout(()=>{ try{ window.location.replace('../auth/login.html'); }catch(e){} }, 2500);
  }
  return { lock, isLocked: ()=>locked };
})();
const ToastCtx=createContext(null);
function ToastProvider({children}){const [items,setItems]=useState([]);const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);},[]);const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div></ToastCtx.Provider>;}
function Toast({data,onClose}){const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);const icons={ok:'✓',err:'✕',warn:'!',info:'i'};return <div className={`toast ${data.type} ${out?'out':''}`}><div className="toast-ico">{icons[data.type]}</div><div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div><button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button><div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div></div>;}
const useToast=()=>useContext(ToastCtx);
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);
const EMPTY_DB={users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],direct_messages:[],reports:[],friendships:[],xp_shop_items:[],xp_purchases:[],study_groups:[],study_group_members:[],study_plans:[],study_tasks:[],daily_challenges:[],daily_challenge_attempts:[],practice_sessions:[],focus_sessions:[],flashcards:[],video_progress:[],daily_reward:[]};
function AppProvider({children}){
  const [db,setDb]=useState(EMPTY_DB);
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();
  const reload=useCallback(async ()=>{
    try{
      let data;
      try{
        data = await DB.loadAll();
      }catch(e){
        console.warn('loadAll failed, falling back:', e);
        const sb = await DB.getClient();
        const tables = ['users','grades','subjects','units','lessons','exams','missions','achievements','levels','notifications','activity','polls','poll_votes','direct_messages','reports','friendships','xp_shop_items','xp_purchases','study_groups','study_group_members','study_plans','study_tasks','daily_challenges','daily_challenge_attempts','practice_sessions','focus_sessions','flashcards','video_progress','daily_reward'];
        data = {};
        await Promise.all(tables.map(async t=>{
          try{ const r = await sb.from(t).select('*').limit(2000); data[t] = r.data||[]; }
          catch(err){ data[t] = []; }
        }));
      }
      try{
        const sb = await DB.getClient();
        const { data: pubQs } = await sb.from('questions_public').select('*').limit(2000);
        data.questions = pubQs || [];
      }catch(e){ data.questions = data.questions || []; }
      const extra=['direct_messages','xp_shop_items','xp_purchases','study_groups','study_group_members','study_plans','study_tasks','daily_challenges','daily_challenge_attempts','flashcards','video_progress','daily_reward','friendships','practice_sessions','focus_sessions'];
      const sb2 = await DB.getClient();
      const extraResults=await Promise.all(extra.map(async(t)=>{try{const res=await sb2.from(t).select('*').limit(2000);return{t,data:res.data||[]};}catch(e){return{t,data:data[t]||[]};}}));
      extraResults.forEach(r=>{data[r.t]=r.data;});
      setDb(data);
      setCurrentUser(prev => {
        if (!prev) return null;
        const fresh = data.users.find(u => u.id === prev.id);
        return fresh || prev;
      });
    }catch(e){console.warn(e);}
  },[]);
  useEffect(()=>{(async ()=>{try{const sid=DB.getSessionId();if(!sid){window.location.replace('../auth/login.html');return;}const u=await DB.getUser(sid);if(!u||u.active===false){DB.clearSession();window.location.replace('../auth/login.html');return;}if(u.banned===true){DB.clearSession();window.location.replace('../auth/banned.html');return;}setCurrentUser(u);if(u.theme==='light')document.body.classList.add('light-mode');await reload();}catch(e){console.warn(e);}setLoading(false);})();},[]);
  useEffect(()=>{
    if(!currentUser) return;
    const interval = setInterval(async ()=>{
      try{
        const fresh = await DB.getUser(currentUser.id);
        if(!fresh){ ANTI_TAMPER.lock('المستخدم غير موجود'); return; }
        if(fresh.banned === true){ ANTI_TAMPER.lock('تم حظر حسابك'); return; }
        if(fresh.active === false){ ANTI_TAMPER.lock('تم إيقاف حسابك'); return; }
        setCurrentUser(prev => {
          if(!prev) return prev;
          const next = {...prev};
          let changed = false;
          if(Number(fresh.xp) !== Number(prev.xp)){ next.xp = fresh.xp; changed = true; }
          if(JSON.stringify(fresh.completed_lessons||[]) !== JSON.stringify(prev.completed_lessons||[])){ next.completed_lessons = fresh.completed_lessons||[]; changed = true; }
          if(fresh.subscription !== prev.subscription){ next.subscription = fresh.subscription; changed = true; }
          if(fresh.subscription_until !== prev.subscription_until){ next.subscription_until = fresh.subscription_until; changed = true; }
          return changed ? next : prev;
        });
      }catch(e){}
    }, 30000);
    return ()=>clearInterval(interval);
  },[currentUser?.id]);
  const logout=useCallback(()=>{Swal.fire({title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',confirmButtonColor:'#00d4ff',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #0a1220, #050a14)',color:'#e0f7ff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('../auth/login.html');}});},[]);
  const save=useCallback(async (table,item)=>{
    const clean = SEC.sanitizeObject(item);
    if(!clean || typeof clean!=='object') throw new Error('بيانات غير صالحة');
    const saved=await DB.save(table,clean);
    await reload();
    return saved;
  },[reload]);
  const remove=useCallback(async (table,id)=>{
    if(!id || typeof id!=='string' || id.length<3) throw new Error('معرف غير صالح');
    await DB.remove(table,id);
    await reload();
  },[reload]);
  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return {current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}return {current:cur,next};},[db.levels]);
  const toggleTheme=useCallback(async ()=>{
    const newTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
    if(newTheme==='light') document.body.classList.add('light-mode');
    else document.body.classList.remove('light-mode');
    if(currentUser){
      try{ await DB.updateUser(currentUser.id,{theme:newTheme}); setCurrentUser(u=>({...u,theme:newTheme})); }catch(e){}
    }
  },[currentUser]);
  return <AppCtx.Provider value={{db,currentUser,loading,logout,reload,save,remove,getLevel,toast,toggleTheme,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id),question:id=>db.questions.find(q=>q.id===id),grade:id=>db.grades.find(g=>g.id===id)}}>{children}</AppCtx.Provider>;
}

const PUSH_MANAGER = (function(){
  let enabled = false;
  let lastCheck = 0;
  let seenIds = new Set();
  try{ const saved = localStorage.getItem('push_seen_ids'); if(saved) seenIds = new Set(JSON.parse(saved)); }catch(e){}
  async function requestPermission(){
    if(!('Notification' in window)) return false;
    if(Notification.permission === 'granted'){ enabled = true; return true; }
    if(Notification.permission === 'denied') return false;
    try{ const perm = await Notification.requestPermission(); enabled = (perm === 'granted'); return enabled; }catch(e){ return false; }
  }
  function show(title, body, tag){
    if(!enabled || Notification.permission !== 'granted') return;
    try{
      const n = new Notification(title, {body, icon:'/logo.png', badge:'/logo.png', tag:tag||'mission-edu', dir:'rtl', lang:'ar'});
      n.onclick = ()=>{ window.focus(); n.close(); };
      setTimeout(()=>{ try{n.close();}catch(e){} }, 10000);
    }catch(e){}
  }
  function isEnabled(){ return enabled && typeof Notification !== 'undefined' && Notification.permission === 'granted'; }
  function trackAndShow(notifications, userId){
    const now = Date.now();
    if(now - lastCheck < 15000) return;
    lastCheck = now;
    const list = (notifications||[]).filter(n=>{ if(!n.created_at) return false; if(n.target !== 'all' && n.target !== userId) return false; return true; }).sort((a,b)=>(b.created_at||0)-(a.created_at||0)).slice(0,5);
    const newOnes = [];
    list.forEach(n=>{ if(!seenIds.has(n.id)){ seenIds.add(n.id); newOnes.push(n); } });
    try{ localStorage.setItem('push_seen_ids', JSON.stringify([...seenIds].slice(-200))); }catch(e){}
    newOnes.slice(0,3).forEach(n=>{ show(n.title || 'MISSION EDU', n.body || '', n.id); });
  }
  return { requestPermission, show, isEnabled, trackAndShow };
})();
const NOTIF_TRACKER = (function(){
  let lastSeen = 0;
  try{ lastSeen = Number(localStorage.getItem('last_notif_seen_global')||0); }catch(e){}
  async function check(user, onNew){
    if(!user) return;
    if(Date.now() - lastSeen < 10000) return;
    lastSeen = Date.now();
    try{
      const sb = await DB.getClient();
      const { data } = await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
      const filtered = (data||[]).filter(n => n.target === 'all' || n.target === user.id);
      PUSH_MANAGER.trackAndShow(filtered, user.id);
      if(onNew && filtered.length){
        const unseen = filtered.filter(n => { const ts = Number(n.created_at)||0; const lastRead = Number(localStorage.getItem('notif_read_'+user.id)||0); return ts > lastRead; });
        if(unseen.length) onNew(unseen.length);
      }
    }catch(e){}
  }
  return { check };
})();
let _audioCtx = null;
function getAudioCtx(){if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return _audioCtx;}
function beep(frequency,duration,type='sine',volume=0.15){try{const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.value=frequency;osc.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration/1000);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+duration/1000);}catch(e){}}
function playSound(type='notify'){switch(type){case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100);}}

function PracticePage(){
  const app=useApp();
  const [allQuestions,setAllQuestions]=useState([]);
  const [loadingQs,setLoadingQs]=useState(true);
  const [filterSubject,setFilterSubject]=useState('all');
  const [session,setSession]=useState(null);
  const [qIndex,setQIndex]=useState(0);
  const [score,setScore]=useState(0);
  const [answers,setAnswers]=useState({});
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    (async()=>{
      try{
        const sb=await DB.getClient();
        const {data}=await sb.from('questions_public').select('id,text,options,subject_id').limit(500);
        setAllQuestions(data||[]);
      }catch(e){ console.warn(e); }
      setLoadingQs(false);
    })();
  },[]);

  const filteredQuestions=useMemo(()=>{
    if(filterSubject==='all') return allQuestions;
    return allQuestions.filter(q=>q.subject_id===filterSubject);
  },[allQuestions,filterSubject]);

  const startPractice=()=>{
    if(filteredQuestions.length===0) return app.toast.warn('لا توجد أسئلة في هذه المادة');
    const shuffled=[...filteredQuestions].sort(()=>Math.random()-0.5).slice(0,10);
    setSession(shuffled);
    setQIndex(0);
    setScore(0);
    setAnswers({});
  };

  const submitAnswer=async (oi)=>{
    if(answers[qIndex] || busy) return;
    setBusy(true);
    try{
      const sb=await DB.getClient();
      const {data,error}=await sb.rpc('practice_answer',{
        p_question_id:session[qIndex].id,
        p_answer_index:oi,
        p_user_id:app.currentUser.id
      });
      if(error) throw new Error(error.message);
      setAnswers(a=>({...a,[qIndex]:{selected:oi,is_correct:data.is_correct,correct_index:data.correct_index,explanation:data.explanation}}));
      if(data.is_correct){ setScore(s=>s+1); playSound('success'); }
      else playSound('err');
    }catch(e){
      app.toast.err(e.message||'تعذر التحقق من الإجابة');
    }finally{
      setBusy(false);
    }
  };

  const nextQuestion=async ()=>{
    if(qIndex+1>=session.length){
      setBusy(true);
      try{
        const sb=await DB.getClient();
        const {data,error}=await sb.rpc('practice_complete',{
          p_subject_id:filterSubject==='all'?null:filterSubject,
          p_score:score,
          p_total:session.length,
          p_user_id:app.currentUser.id
        });
        if(error) throw new Error(error.message);
        app.toast.ok(`🎉 انتهى التدريب! +${data.xp_gained} XP (${score}/${session.length})`);
        await app.reload();
        setSession(null);
      }catch(e){
        app.toast.err(e.message||'تعذر حفظ الجلسة');
      }finally{
        setBusy(false);
      }
    } else {
      setQIndex(i=>i+1);
    }
  };

  const exitSession=()=>{ if(busy) return; setSession(null); };

  if(session){
    const q=session[qIndex];
    const ans=answers[qIndex];
    const isAnswered=!!ans;
    const isDone=qIndex+1>=session.length;
    return <>
      <div className="flex between center mb16 wrap g8">
        <button className="btn btn-s" onClick={exitSession} disabled={busy}>← إلغاء</button>
        <div className="flex g8"><span className="pill pill-b">{qIndex+1}/{session.length}</span><span className="pill pill-g">✓ {score}</span></div>
      </div>
      <div className="glass" style={{padding:22}}>
        <div className="sm mb12" style={{fontWeight:700}}>{SEC.esc(q.text)}</div>
        {(q.options||[]).map((opt,oi)=>{
          const isCorrect = isAnswered && ans.correct_index===oi;
          const isSelected = isAnswered && ans.selected===oi;
          let bg='rgba(255,255,255,.03)',border='var(--border)';
          if(isAnswered){
            if(isCorrect){ bg='rgba(34,197,94,.15)'; border='#22c55e'; }
            else if(isSelected){ bg='rgba(239,68,68,.15)'; border='#ef4444'; }
          }
          return <div key={oi} className="qbox-opt" onClick={()=>submitAnswer(oi)} style={{background:bg,borderColor:border,cursor:isAnswered||busy?'default':'pointer',opacity:busy&&!isAnswered?.6:1}}>
            <span className="qbox-opt-letter">{['A','B','C','D'][oi]}</span>
            <span className="sm" style={{flex:1}}>{SEC.esc(opt)}</span>
            {isCorrect&&<span style={{color:'#22c55e'}}>✓</span>}
            {isSelected&&!isCorrect&&<span style={{color:'#ef4444'}}>✕</span>}
          </div>;
        })}
        {isAnswered&&ans.explanation&&<div className="xs mt12" style={{background:'rgba(0,212,255,.08)',padding:10,borderRadius:8}}>💡 {SEC.esc(ans.explanation)}</div>}
        {isAnswered&&<button className="btn btn-p btn-block mt16" onClick={nextQuestion} disabled={busy}>{busy?'جارٍ...':(isDone?'✅ إنهاء وحفظ':'السؤال التالي →')}</button>}
      </div>
    </>;
  }

  return <>
    <div className="h2 mb16 grad">🎯 وضع التدريب</div>
    <div className="glass mb16" style={{padding:22}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>اختر المادة</div>
      {loadingQs?<div style={{padding:20,textAlign:'center'}}><div className="spinner" style={{margin:'0 auto'}}/></div>:<>
        <div className="flex wrap g6 mb16">
          <button onClick={()=>setFilterSubject('all')} className={`msg-tab ${filterSubject==='all'?'active':''}`}>الكل ({allQuestions.length})</button>
          {app.db.subjects.map(s=>{const cnt=allQuestions.filter(q=>q.subject_id===s.id).length;if(cnt===0)return null;return <button key={s.id} onClick={()=>setFilterSubject(s.id)} className={`msg-tab ${filterSubject===s.id?'active':''}`}>{SEC.esc(s.name)} ({cnt})</button>;})}
        </div>
        <button className="btn btn-p btn-block" onClick={startPractice} disabled={filteredQuestions.length<1}><Icon name="play" size={16}/> ابدأ التدريب ({Math.min(10,filteredQuestions.length)} سؤال)</button>
      </>}
    </div>
  </>;
}

function FlashcardsPage(){

  const user=app.currentUser;
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({front:'',back:''});

  const dueCards=cards.filter(c=>!c.next_review_at||c.next_review_at<=Date.now());
  const saveCard=async ()=>{
    if(!form.front.trim()||!form.back.trim()) return app.toast.warn('اكتب السؤال والإجابة');
    if(saving) return;
    setSaving(true);
    try{
      await DB.save('flashcards',{id:editing==='new'?DB.uid('fc_'):editing,user_id:user.id,front:form.front,back:form.back,repetitions:0,next_review_at:Date.now(),created_at:Date.now()});
      await app.reload();
      app.toast.ok('تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    finally{setSaving(false);}
  };
  const reviewCard=async (card,known)=>{
    const newReps=known?(card.repetitions||0)+1:0;
    const nextIn=known?[1,3,7,14,30][Math.min(newReps-1,4)]*24*60*60*1000:10*60*1000;
    try{
      await DB.save('flashcards',{...card,repetitions:newReps,next_review_at:Date.now()+nextIn});
      await app.reload();
    }catch(e){}
  };
  const delCard=async (id)=>{
    const r=await Swal.fire({title:'حذف البطاقة؟',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#0a1220,#050a14)',color:'#e0f7ff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});

  return <>
    <div className="flex between center mb16 wrap g8"><div className="h2 grad">🃏 Flashcards</div><div className="flex g6"><button onClick={()=>setView('study')} className={`msg-tab ${view==='study'?'active':''}`}>📖 مذاكرة ({dueCards.length})</button><button onClick={()=>setView('manage')} className={`msg-tab ${view==='manage'?'active':''}`}>📋 إدارة ({cards.length})</button></div></div>
    {view==='study'&&<>
      {dueCards.length===0?<div className="glass" style={{padding:30}}><Empty icon="✅" title="كل البطاقات تمت مراجعتها"/></div>:
      <div>{dueCards.slice(0,1).map(card=><div key={card.id}>
        <div className={`flashcard ${flipped[card.id]?'flipped':''}`} onClick={()=>setFlipped(f=>({...f,[card.id]:!f[card.id]}))}>
          <div className="flashcard-inner">
            <div className="flashcard-face flashcard-front"><div>{SEC.esc(card.front)}</div></div>
            <div className="flashcard-face flashcard-back"><div>{SEC.esc(card.back)}</div></div>
          </div>
        </div>
        {flipped[card.id]&&<div className="flex g8 mt16">
          <button className="btn btn-dn" style={{flex:1}} onClick={()=>{reviewCard(card,false);setFlipped(f=>({...f,[card.id]:false}));}}>❌ لم أتذكر</button>
          <button className="btn btn-ok" style={{flex:1}} onClick={()=>{reviewCard(card,true);setFlipped(f=>({...f,[card.id]:false}));}}>✅ أتذكر</button>
        </div>}
      </div>)}</div>}
    </>}
    {view==='manage'&&<>
      <button className="btn btn-p btn-block mb16" onClick={()=>{setForm({front:'',back:''});setEditing('new');}}><Icon name="plus" size={16}/> بطاقة جديدة</button>
      {cards.length===0?<div className="glass" style={{padding:30}}><Empty icon="🃏" title="لا بطاقات"/></div>:
      <div className="grid g2">{cards.map(card=><div key={card.id} className="glass-s" style={{padding:14}}>
        <div className="flex between center mb8"><span className="sm" style={{fontWeight:700}}>{SEC.esc(card.front)}</span><span className="pill pill-b">{card.repetitions||0}</span></div>
        <div className="xs muted mb12">{SEC.esc(card.back)}</div>
        <div className="flex g6"><button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>{setForm({front:card.front,back:card.back});setEditing(card.id);}}>تعديل</button><button className="btn btn-dn btn-sm" onClick={()=>delCard(card.id)}>حذف</button></div>
      </div>)}</div>}
    </>}
    {editing!==null&&<Modal title={editing==='new'?'بطاقة جديدة':'تعديل'} onClose={()=>setEditing(null)}>
      <Field label="السؤال (الوجه الأمامي)"><textarea className="input" rows="3" value={form.front} onChange={e=>setForm({...form,front:e.target.value})}/></Field>
      <Field label="الإجابة (الوجه الخلفي)"><textarea className="input" rows="3" value={form.back} onChange={e=>setForm({...form,back:e.target.value})}/></Field>

    </Modal>}
  </>;
}

function AnalyticsPage(){
  const app=useApp();
  const user=app.currentUser;
  const [attempts,setAttempts]=useState([]);
  const [practice,setPractice]=useState([]);
  const [loading,setLoading]=useState(true);
  const c1=useRef(null);const c2=useRef(null);
  const chart1=useRef(null);const chart2=useRef(null);
  useEffect(()=>{(async()=>{
    try{
      const sb=await DB.getClient();
      const [aRes,pRes]=await Promise.all([
        sb.from('exam_attempts').select('*').eq('user_id',user.id).order('at',{ascending:true}),
        sb.from('practice_sessions').select('*').eq('user_id',user.id).eq('status','completed')
      ]);
      setAttempts(aRes.data||[]);
      setPractice(pRes.data||[]);
    }catch(e){}
    setLoading(false);
  })();},[user.id]);
  const subjectStats=useMemo(()=>{
    const map={};
    attempts.forEach(a=>{
      const exam=app.db.exams.find(e=>e.id===a.exam_id);
      if(!exam||!exam.subject_id) return;
      if(!map[exam.subject_id]) map[exam.subject_id]={attempts:0,totalPct:0,passed:0};
      map[exam.subject_id].attempts++;
      map[exam.subject_id].totalPct+=(a.pct||0);
      if(a.passed) map[exam.subject_id].passed++;
    });
    return Object.entries(map).map(([sid,d])=>{const s=app.subject(sid);return {name:s?.name||'—',icon:s?.icon||'📚',attempts:d.attempts,avg:d.attempts?Math.round(d.totalPct/d.attempts):0,passed:d.passed};});
  },[attempts,app.db.exams,app.db.subjects]);
  useEffect(()=>{
    if(!chart1.current||!window.Chart||attempts.length===0) return;
    const ctx=chart1.current.getContext('2d');
    if(c1.current)c1.current.destroy();
    const last10=attempts.slice(-10);
    c1.current=new window.Chart(ctx,{type:'line',data:{labels:last10.map((_,i)=>`#${i+1}`),datasets:[{label:'النسبة %',data:last10.map(a=>a.pct||0),borderColor:'#00d4ff',backgroundColor:'rgba(0,212,255,.15)',fill:true,tension:.4,borderWidth:3,pointRadius:4,pointBackgroundColor:'#00ffff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8fd4ee'},grid:{display:false}},y:{ticks:{color:'#8fd4ee'},grid:{color:'rgba(0,212,255,.08)'},max:100,beginAtZero:true}}}});
    return()=>{if(c1.current)c1.current.destroy();};
  },[attempts]);
  useEffect(()=>{
    if(!chart2.current||!window.Chart||subjectStats.length===0) return;
    const ctx=chart2.current.getContext('2d');
    if(c2.current)c2.current.destroy();
    c2.current=new window.Chart(ctx,{type:'bar',data:{labels:subjectStats.map(s=>s.name),datasets:[{label:'متوسط النسبة %',data:subjectStats.map(s=>s.avg),backgroundColor:'rgba(0,212,255,.7)',borderColor:'#00d4ff',borderWidth:2,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8fd4ee'},grid:{display:false}},y:{ticks:{color:'#8fd4ee'},grid:{color:'rgba(0,212,255,.08)'},max:100,beginAtZero:true}}}});
    return()=>{if(c2.current)c2.current.destroy();};
  },[subjectStats]);
  if(loading) return <div className="glass" style={{padding:40,textAlign:'center'}}><div className="spinner" style={{margin:'0 auto 14px'}}></div></div>;
  return <>
    <div className="h2 mb16 grad">📊 تحليلاتي</div>
    <div className="grid g4 mb16">
      <Stat label="اختبارات" value={DB.fmt(attempts.length)} icon="clipboard" color="var(--gold)"/>
      <Stat label="تدريبات" value={DB.fmt(practice.length)} icon="target" color="#22c55e"/>
      <Stat label="متوسط" value={`${attempts.length?Math.round(attempts.reduce((s,a)=>s+(a.pct||0),0)/attempts.length):0}%`} icon="trend" color="#f59e0b"/>
      <Stat label="نجاحات" value={DB.fmt(attempts.filter(a=>a.passed).length)} icon="check" color="#22c55e"/>
    </div>
    <div className="grid g2 mb16">
      <div className="glass" style={{padding:18}}><div className="h4 mb12" style={{color:'var(--gold)'}}>📈 تقدم المحاولات</div>{attempts.length===0?<Empty icon="📊" title="لا محاولات"/>:<div style={{height:240,position:'relative'}}><canvas ref={chart1}></canvas></div>}</div>
      <div className="glass" style={{padding:18}}><div className="h4 mb12" style={{color:'var(--gold)'}}>🎯 أداء المواد</div>{subjectStats.length===0?<Empty icon="📊" title="لا بيانات"/>:<div style={{height:240,position:'relative'}}><canvas ref={chart2}></canvas></div>}</div>
    </div>
    <div className="glass" style={{padding:18}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📚 تفاصيل المواد</div>
      {subjectStats.length===0?<Empty icon="📊" title="لا بيانات"/>:<div className="flex col g8">{subjectStats.map(s=><div key={s.name} className="flex between center" style={{padding:'10px 0',borderBottom:'1px solid rgba(0,212,255,.08)'}}>
        <div className="flex center g8"><span style={{fontSize:20}}>{s.icon}</span><span className="sm" style={{fontWeight:700}}>{SEC.esc(s.name)}</span></div>
        <div className="flex g8"><span className="pill pill-b">{s.attempts}</span><span className="pill" style={{background:s.avg>=70?'rgba(34,197,94,.15)':s.avg>=40?'rgba(245,158,11,.15)':'rgba(239,68,68,.15)',color:s.avg>=70?'#6ee7a0':s.avg>=40?'#fcd34d':'#fca5a5'}}>{s.avg}%</span></div>
      </div>)}</div>}
    </div>
  </>;
}

function SchoolLeaderboardPage(){

        map[school].count++;
        map[school].totalXp+=(s.xp||0);
        map[school].students.push(s);

function FocusModePage(){
  const app=useApp();
  const user=app.currentUser;
  const [duration,setDuration]=useState(25);
  const [timeLeft,setTimeLeft]=useState(25*60);
  const [running,setRunning]=useState(false);
  const [label,setLabel]=useState('جلسة مذاكرة');
  const [sessions,setSessions]=useState([]);
  const [startedAt,setStartedAt]=useState(null);
  const [finishing,setFinishing]=useState(false);
  const timerRef=useRef(null);
  useEffect(()=>{(async()=>{
    try{
      const sb=await DB.getClient();
      const {data}=await sb.from('focus_sessions').select('*').eq('user_id',user.id).eq('status','completed').order('started_at',{ascending:false}).limit(10);
      setSessions(data||[]);
    }catch(e){}
  })();},[user.id]);
  useEffect(()=>{
    if(running && timeLeft>0){
      timerRef.current=setInterval(()=>{setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);return 0;}return t-1;});},1000);
      return ()=>clearInterval(timerRef.current);
    }
  },[running]);
  useEffect(()=>{
    if(running&&timeLeft===0){ finish(); }
  },[timeLeft]);
  const finish=async ()=>{
    if(finishing) return;
    setRunning(false);
    if(!startedAt) return;
    setFinishing(true);
    try{
      const sb=await DB.getClient();
      const {data,error}=await sb.rpc('focus_complete',{
        p_label:label,
        p_duration:duration,
        p_started_at:startedAt,
        p_user_id:user.id
      });
      if(error) throw new Error(error.message);
      playSound('success');
      app.toast.ok(`🎯 انتهت الجلسة! +${data.xp_gained} XP (${data.actual_minutes} دقيقة)`);
      await app.reload();
      const {data:fresh}=await sb.from('focus_sessions').select('*').eq('user_id',user.id).eq('status','completed').order('started_at',{ascending:false}).limit(10);
      setSessions(fresh||[]);
    }catch(e){
      app.toast.err(e.message||'تعذر حفظ الجلسة');
    }finally{
      setTimeLeft(duration*60);
      setStartedAt(null);
      setFinishing(false);
    }
  };
  const start=()=>{
    if(running){ clearInterval(timerRef.current); setRunning(false); return; }
    setStartedAt(Date.now());
    setRunning(true);
  };
  const reset=()=>{ clearInterval(timerRef.current); setRunning(false); setTimeLeft(duration*60); setStartedAt(null); };
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return <>
    <div className="h2 mb16 grad">🎯 وضع التركيز</div>
    <div className="glass mb16" style={{padding:30,textAlign:'center'}}>
      <input className="input" placeholder="اسم الجلسة" value={label} onChange={e=>setLabel(e.target.value)} style={{maxWidth:300,margin:'0 auto 20px',textAlign:'center'}} disabled={running}/>
      <div className="focus-timer mb20">{fmt(timeLeft)}</div>
      {!running&&<div className="flex wrap g6 mb16" style={{justifyContent:'center'}}>
        {[5,15,25,45,60].map(d=><button key={d} onClick={()=>{setDuration(d);setTimeLeft(d*60);}} className={`msg-tab ${duration===d?'active':''}`}>{d} د</button>)}
      </div>}
      <div className="flex g8" style={{justifyContent:'center'}}>
        <button className="btn btn-p" onClick={start} style={{minWidth:140}} disabled={finishing}>{running?'⏸️ إيقاف':'▶️ بدء'}</button>
        <button className="btn btn-s" onClick={reset} disabled={finishing}>🔄 إعادة</button>
      </div>
    </div>
    {sessions.length>0&&<>
      <div className="h3 mb12" style={{color:'var(--gold)'}}>آخر الجلسات</div>
      <div className="flex col g8">{sessions.map(s=><div key={s.id} className="glass-s" style={{padding:12}}>
        <div className="flex between center"><span className="sm">{SEC.esc(s.label||'جلسة')}</span><span className="pill pill-b">{s.actual_minutes}د • +{s.xp_awarded} XP</span></div>
        <div className="xs muted mt6">{DB.formatDateTime(s.started_at)}</div>
      </div>)}</div>
    </>}
  </>;
}

      background:'linear-gradient(180deg,#0a1220,#050a14)',color:'#e0f7ff',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'},
      preConfirm:()=>({reason:document.getElementById('swal-reason').value,details:document.getElementById('swal-details').value})
    });
    if(!r.isConfirmed)return;
    try{
      const sb=await DB.getClient();
      await sb.rpc('submit_user_report', {
        p_reporter_id: app.currentUser.id,
        p_target_id: target.id,
        p_reason: SEC.clean(r.value.reason),
        p_details: SEC.clean(SEC.maxLen(r.value.details, 500))
      });
      await app.reload();
      app.toast.ok('تم إرسال البلاغ — سيتم مراجعته من الإدارة');
    }catch(e){
      if(e.message.includes('already') || e.message.includes('من قبل')) {
        app.toast.warn('لقد أبلغت عن هذا المستخدم من قبل');
      } else {
        app.toast.err(e.message);
      }
    }
  };
  return <>
    <div className="h2 mb16 grad">👥 الطلاب</div>
    <div className="glass mb16" style={{padding:14}}>
      <input className="input" placeholder="🔍 ابحث عن طالب..." value={q} onChange={e=>setQ(e.target.value)}/>
    </div>
    {filtered.length===0?<div className="glass" style={{padding:30}}><Empty icon="👥" title="لا طلاب"/></div>:
    <div className="grid g3">{filtered.map(s=>{const lvl=app.getLevel(s.xp||0);return <div key={s.id} className="student-card">
      <StudentAvatar student={s} size={70}/>
      <div className="h4 mt8">{SEC.esc(s.name)}</div>
      <div className="xs muted">Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</div>
      <div className="flex center g6 mt8" style={{justifyContent:'center'}}>
        <span className="pill pill-b" style={{fontSize:10}}>{DB.fmt(s.xp||0)} XP</span>
      </div>
      <div className="flex g6 mt8">
        <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>onOpenChat(s.id)}><Icon name="message" size={12}/> رسالة</button>
        <button className="btn btn-dn btn-sm" onClick={()=>reportStudent(s)} title="إبلاغ"><Icon name="flag" size={12}/></button>
      </div>
    </div>;})}</div>}
  </>;
}

function MessagesPage({initialChat,onClearInitial}){
  const app=useApp();
  const user=app.currentUser;
  const [chatWith,setChatWith]=useState(initialChat||null);
  const [text,setText]=useState('');
  const [busy,setBusy]=useState(false);
  const [tab,setTab]=useState('inbox');
  useEffect(()=>{if(initialChat){setChatWith(initialChat);onClearInitial?.();}},[initialChat]);
  const allMsgs=(app.db.direct_messages||[]);
  const inbox=allMsgs.filter(m=>m.to_id===user.id).sort((a,b)=>b.created_at-a.created_at);
  const sent=allMsgs.filter(m=>m.from_id===user.id).sort((a,b)=>b.created_at-a.created_at);
  const conversation=chatWith?allMsgs.filter(m=>(m.from_id===user.id&&m.to_id===chatWith)||(m.from_id===chatWith&&m.to_id===user.id)).sort((a,b)=>a.created_at-b.created_at):[];
  const otherUser=chatWith?app.db.users.find(u=>u.id===chatWith):null;
  const send=async ()=>{
    if(!SEC.rateLimit('dm_'+user.id,1500))return app.toast.warn('انتظر لحظة');
    const t=SEC.clean(SEC.maxLen(text,1000));
    if(!t)return;
    setBusy(true);
    try{ await app.save('direct_messages',{from_id:user.id,to_id:chatWith,text:t,created_at:Date.now(),read:false}); setText(''); }
    catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  if(chatWith&&otherUser){
    return <>
      <div className="flex between center mb16">
        <button className="btn btn-s" onClick={()=>setChatWith(null)}>← رجوع</button>
        <div className="flex center g8"><StudentAvatar student={otherUser} size={36}/><div><div className="sm" style={{fontWeight:700}}>{SEC.esc(otherUser.name)}</div></div></div>
      </div>
      <div className="glass" style={{padding:16}}>
        <div className="chat-list" style={{marginBottom:12}}>
          {conversation.length===0?<Empty icon="💬" title="لا رسائل بعد"/>:
          conversation.map(m=><div key={m.id} style={{display:'flex',justifyContent:m.from_id===user.id?'flex-end':'flex-start'}}>
            <div className={`chat-bubble ${m.from_id===user.id?'me':'other'}`}>
              {SEC.esc(m.text)}
              <span className="chat-time">{DB.formatDateTime(m.created_at)}</span>
            </div>
          </div>)}
        </div>
        <div className="flex g8">
          <input className="input" placeholder="اكتب رسالة..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!busy&&send()} maxLength={1000}/>
          <button className="btn btn-p" onClick={send} disabled={busy||!text.trim()}><Icon name="send" size={16}/></button>
        </div>
      </div>
    </>;
  }
  return <>
    <div className="h2 mb16 grad">💬 الرسائل</div>
    <div className="msg-tabs">
      <button className={`msg-tab ${tab==='inbox'?'active':''}`} onClick={()=>setTab('inbox')}>📥 الوارد ({inbox.length})</button>
      <button className={`msg-tab ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>📤 المرسل ({sent.length})</button>
    </div>
    <div className="glass" style={{padding:16}}>
      {(tab==='inbox'?inbox:sent).length===0?<Empty icon="💬" title="لا رسائل"/>:
      (tab==='inbox'?inbox:sent).map(m=>{const otherId=tab==='inbox'?m.from_id:m.to_id;const other=app.db.users.find(u=>u.id===otherId);return <div key={m.id} className={`msg-card ${!m.read&&tab==='inbox'?'unread':''}`} onClick={()=>{setChatWith(otherId);if(tab==='inbox'&&!m.read){DB.save('direct_messages',{...m,read:true});}}}>
        <div className="flex between center mb6"><div className="flex center g8">{other&&<StudentAvatar student={other} size={28}/>}<span className="sm" style={{fontWeight:700}}>{SEC.esc(other?.name||'محذوف')}</span></div><span className="xs muted">{DB.formatDateTime(m.created_at)}</span></div>
        <div className="sm muted" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{SEC.esc(m.text)}</div>
      </div>;})}
    </div>
  </>;
}

function NotificationsPage(){
  const app=useApp();
  const user=app.currentUser;
  const notifs=(app.db.notifications||[]).filter(n=>n.target==='all'||n.target===user.id).sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  useEffect(()=>{try{localStorage.setItem('notif_read_'+user.id,Date.now().toString());}catch(e){}},[user.id]);
  return <>
    <div className="h2 mb16 grad">🔔 الإشعارات</div>
    {notifs.length===0?<div className="glass" style={{padding:30}}><Empty icon="🔔" title="لا إشعارات"/></div>:
    <div className="flex col g8">{notifs.map(n=><div key={n.id} className="glass-s" style={{padding:14}}>
      <div className="flex between center mb6"><div className="h4" style={{fontSize:14}}>{SEC.esc(n.title)}</div><span className="xs muted">{DB.formatDateTime(n.created_at)}</span></div>
      <div className="sm txt2">{SEC.esc(n.body)}</div>
    </div>)}</div>}
  </>;
}

function MyNotesPage(){
  const app = useApp();
  const user = app.currentUser;
  const [notes, setNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState('');

  const loadNotes = useCallback(async ()=>{
    setLoading(true);
    try{
      const data = await DB.getUserNotes(user.id);
      setNotes(data || []);
    }catch(e){
      app.toast.err?.('تعذر تحميل الملاحظات');
    }
    setLoading(false);
  },[user.id]);

  useEffect(()=>{ loadNotes(); },[loadNotes]);

  const del = async (id)=>{
    const r = await Swal.fire({
      title:'حذف الملاحظة؟',
      text:'لا يمكن التراجع',
      icon:'warning',
      showCancelButton:true,
      confirmButtonText:'نعم، احذف',
      cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',
      cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg,#0a1220,#050a14)',
      color:'#e0f7ff',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      await DB.deleteUserNote(id, user.id);
      setNotes(prev=>prev.filter(n=>n.id!==id));
      app.toast.warn('تم الحذف');
    }catch(e){
      app.toast.err(e.message||'فشل الحذف');
    }
  };

  const filtered = useMemo(()=>{
    if(!q.trim()) return notes;
    const lc = q.toLowerCase();
    return notes.filter(n=>(n.text||'').toLowerCase().includes(lc));
  },[notes,q]);

  const grouped = useMemo(()=>{
    const map = {};
    filtered.forEach(n=>{
      const key = n.lesson_id || '_none';
      if(!map[key]) map[key] = [];
      map[key].push(n);
    });
    return map;
  },[filtered]);

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">📝 ملاحظاتي</div>
        <div className="sm muted mt6">{notes.length} ملاحظة موزعة على {Object.keys(grouped).length} درس</div>
      </div>
      <button className="btn btn-s btn-sm" onClick={loadNotes}>🔄 تحديث</button>
    </div>

    <div className="glass mb16" style={{padding:14}}>
      <input
        className="input"
        placeholder="🔍 ابحث في ملاحظاتك..."
        value={q}
        onChange={e=>setQ(e.target.value)}
      />
    </div>

    {loading ? (
      <div className="glass" style={{padding:40,textAlign:'center'}}>
        <div className="spinner" style={{margin:'0 auto 14px'}}></div>
        <div className="sm muted">جارٍ التحميل...</div>
      </div>
    ) : filtered.length===0 ? (
      <div className="glass" style={{padding:40}}>
        <Empty
          icon="📝"
          title={q ? 'لا نتائج للبحث' : 'لا ملاحظات بعد'}
          desc={q ? 'جرّب كلمة تانية' : 'افتح أي درس واكتب ملاحظاتك هناك — هتظهر هنا'}
        />
      </div>
    ) : (
      Object.entries(grouped).map(([lessonId, lessonNotes])=>{
        const lesson = lessonId!=='_none' ? app.lesson(lessonId) : null;
        const unit = lesson ? app.unit(lesson.unit_id) : null;
        const subject = unit ? app.subject(unit.subject_id) : null;

        return (
          <div key={lessonId} className="glass mb16" style={{padding:16}}>
            <div className="flex between center mb12 wrap g8">
              <div className="flex center g8" style={{flex:1,minWidth:0}}>
                <div style={{width:36,height:36,borderRadius:10,background:'rgba(0,212,255,.15)',display:'grid',placeItems:'center',fontSize:16,flexShrink:0}}>
                  📖
                </div>
                <div style={{minWidth:0}}>
                  <div className="sm" style={{fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {lesson ? SEC.esc(lesson.title) : 'درس محذوف'}
                  </div>
                  <div className="xs muted">
                    {subject ? SEC.esc(subject.name) : ''}
                    {unit ? ` • ${SEC.esc(unit.name)}` : ''}
                  </div>
                </div>
              </div>
              <div className="flex g6">
                <span className="pill pill-b">{lessonNotes.length}</span>
                {lesson && (
                  <button
                    className="btn btn-s btn-sm"
                    onClick={()=>window.location.href=`lesson.html?id=${lessonId}`}>
                    فتح ←
                  </button>
                )}
              </div>
            </div>

            <div className="flex col g8">
              {lessonNotes.map(n=>(
                <div key={n.id} className="glass-s" style={{padding:12,borderInlineStart:'3px solid var(--gold)'}}>
                  <div className="flex between center mb6">
                    <span className="xs muted">
                      {n.updated_at ? DB.formatDateTime(n.updated_at) : DB.formatDateTime(n.created_at)}
                    </span>
                    <button
                      className="btn btn-dn btn-sm"
                      onClick={()=>del(n.id)}
                      title="حذف">
                      ✕
                    </button>
                  </div>
                  <div className="sm txt2" style={{whiteSpace:'pre-wrap',lineHeight:1.7}}>
                    {SEC.esc(n.text||'')}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })
    )}
  </>;
}

function Footer(){
  const app=useApp();
  const user=app.currentUser;
  const sendReport=async()=>{const {value:msg}=await Swal.fire({title:'🚨 بلاغ',input:'textarea',inputPlaceholder:'اكتب رسالتك',showCancelButton:true,confirmButtonText:'📤 إرسال',cancelButtonText:'إلغاء',confirmButtonColor:'#00d4ff',cancelButtonColor:'#64748b',inputValidator:v=>{if(!v||v.trim().length<5)return 'رسالة قصيرة'},customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});if(msg){const sent=await DB.reportIssue({userName:user?.name||'طالب',userPhone:(user?.country_code||'+20')+(user?.phone||'—'),message:SEC.clean(SEC.maxLen(msg,2000))});Swal.fire({icon:sent?'success':'error',title:sent?'✅':'❌',confirmButtonColor:'#00d4ff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});}};
  return <div className="footer-dev"><button className="dev-btn" onClick={()=>window.open("https://wa.me/201128351702","_blank","noopener,noreferrer")}><span className="dev-name">Developed by <b>EL-sayed Hasan</b></span></button><button className="tg-btn" onClick={sendReport}>بلاغ</button></div>;
}

function StudentApp(){
  const app=useApp();
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('student_tab')||'home'}catch(e){return 'home'}});
  const [chatWith,setChatWith]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [pushEnabled,setPushEnabled]=useState(PUSH_MANAGER.isEnabled());
  const [isLight,setIsLight]=useState(()=>document.body.classList.contains('light-mode'));
  const user=app.currentUser;
  useEffect(()=>{try{localStorage.setItem('student_tab',tab)}catch(e){}},[tab]);
  const unreadMsgs=(app.db.direct_messages||[]).filter(m=>m.to_id===user.id&&!m.read).length;
  const unreadNotifs=(app.db.notifications||[]).filter(n=>{if(n.target!=='all'&&n.target!==user.id)return false;const created=Number(n.created_at)||0;const lastSeen=Number(localStorage.getItem('notif_read_'+user.id)||0);return created>lastSeen;}).length;
  useEffect(()=>{if(!user) return;const loop=async ()=>{await NOTIF_TRACKER.check(user);};loop();const iv=setInterval(loop,25000);return ()=>clearInterval(iv);},[user?.id]);
  const enablePush=async ()=>{
    const ok = await PUSH_MANAGER.requestPermission();
    if(ok){ setPushEnabled(true); PUSH_MANAGER.show('MISSION EDU','تم تفعيل الإشعارات بنجاح ✅'); app.toast.ok('تم تفعيل الإشعارات'); }
    else { app.toast.warn('لم يتم منح الإذن'); }
  };
  const toggleTheme=async ()=>{
    await app.toggleTheme();
    setIsLight(!isLight);
  };
  useEffect(()=>{if(PUSH_MANAGER.isEnabled()){PUSH_MANAGER.show('MISSION EDU', 'أهلاً بك في المنصة 🎓');}},[]);
  const items=[
    {title:'الرئيسية',items:[{id:'home',icon:'home',label:'الرئيسية'},{id:'analytics',icon:'chart',label:'تحليلاتي'}]},
    {title:'التعلم',items:[{id:'lessons',icon:'book',label:'المواد'},{id:'exams',icon:'clipboard',label:'الاختبارات'},{id:'practice',icon:'target',label:'وضع التدريب'},{id:'flashcards',icon:'layers',label:'Flashcards'},{id:'notes',icon:'note',label:'ملاحظاتي'}]},
    {title:'الأنشطة',items:[
      {id:'focus',icon:'clock',label:'وضع التركيز'},
      {id:'calendar',icon:'calendar',label:'تقويم المذاكرة'},
      {id:'groups',icon:'handshake',label:'مجموعات الدراسة'},
      {id:'friend-challenge',icon:'swords',label:'تحدي الأصدقاء'}
    ]},
    {title:'التواصل',items:[{id:'leaderboard',icon:'trophy',label:'المتصدرين'},{id:'school-lb',icon:'school',label:'ترتيب المدارس'},{id:'students',icon:'users',label:'الطلاب'},{id:'messages',icon:'message',label:'الرسائل',badge:unreadMsgs||null},{id:'notifications',icon:'bell',label:'الإشعارات',badge:unreadNotifs||null}]},
    {title:'الحساب',items:[{id:'xp-shop',icon:'shoppingBag',label:'متجر XP'},{id:'profile',icon:'user',label:'ملفي'}]}
  ];
  const navigate=(id)=>{
    if(id === 'friend-challenge'){
      window.location.href = 'sv.html';
      return;
    }
    setTab(id);setSidebarOpen(false);
  };
  return <div className="app">
    <Sidebar items={items} active={tab} onNav={navigate} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={app.logout}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} unreadNotifs={unreadNotifs} unreadMsgs={unreadMsgs} onOpenNotifications={()=>navigate('notifications')} onOpenMessages={()=>navigate('messages')} onOpenProfile={()=>navigate('profile')} pushEnabled={pushEnabled} onEnablePush={enablePush} onToggleTheme={toggleTheme} isLight={isLight}/>
      <div className="content">
        {tab==='home'&&<HomePage onNavigate={navigate}/>}
        {tab==='analytics'&&<AnalyticsPage/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='practice'&&<PracticePage/>}
        {tab==='flashcards'&&<FlashcardsPage/>}
        {tab==='notes'&&<MyNotesPage/>}
        {tab==='focus'&&<FocusModePage/>}
        {tab==='calendar'&&<StudyCalendarPage/>}
        {tab==='groups'&&<StudyGroupsPage/>}
        {tab==='xp-shop'&&<XPShopPage/>}
        {tab==='leaderboard'&&<LeaderboardPage/>}
        {tab==='school-lb'&&<SchoolLeaderboardPage/>}
        {tab==='students'&&<StudentsDirectoryPage onOpenChat={id=>{setChatWith(id);navigate('messages');}}/>}
        {tab==='messages'&&<MessagesPage initialChat={chatWith} onClearInitial={()=>setChatWith(null)}/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='profile'&&<ProfilePage/>}
        <Footer/>
      </div>
    </div>
  </div>;
}
function Root(){
  const app=useApp();
  if(app.loading)return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser)return null;
  return <StudentApp/>;
}
function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
