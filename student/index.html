<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a14" />
<title>MISSION EDU — لوحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{
--bg:#050a14;--bg2:#0a1220;
--gold:#00d4ff;--gold-l:#00ffff;--gold-d:#0088cc;--gold-soft:#a0e8ff;
--border:rgba(0,212,255,.18);--border2:rgba(0,212,255,.38);
--txt:#e0f7ff;--txt2:#8fd4ee;--muted:#4a7a99;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#7c3aed;
--r:20px;--rs:13px;
--sh:0 18px 50px rgba(0,0,0,.75), 0 0 0 1px rgba(0,212,255,.05) inset;
--sh-gold:0 10px 30px rgba(0,212,255,.35);
--grad-gold:linear-gradient(135deg,#00ffff 0%,#00d4ff 45%,#0088cc 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(0,212,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(0,150,255,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(0,255,255,.08),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,212,255,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00d4ff,#0088cc);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(10,18,32,.78),rgba(5,10,20,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,rgba(0,255,255,.25),rgba(0,212,255,.05) 40%,rgba(0,255,255,.20));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass-s{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(10,18,32,.96),rgba(5,10,20,.92));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 8px 26px rgba(0,212,255,.55);position:relative}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,#00ffff,#a0e8ff 45%,#00d4ff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(0,212,255,.10);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(0,212,255,.24),rgba(0,212,255,.03));color:#a0e8ff}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#00ffff,#00d4ff);box-shadow:0 0 12px rgba(0,255,255,.7)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(5,10,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:52px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:var(--grad-gold);color:#050a14;box-shadow:0 10px 28px rgba(0,212,255,.42);position:relative;overflow:hidden}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:0 14px 40px rgba(0,212,255,.55);transform:translateY(-2px);color:#000}
.btn-s{background:rgba(0,212,255,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:rgba(0,212,255,.16);color:#a0e8ff;border-color:var(--border2)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#00ffff,#a0e8ff 50%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill-b{background:rgba(0,212,255,.16);color:#00ffff;border-color:rgba(0,212,255,.35)}
.pill-g{background:rgba(34,197,94,.16);color:#6ee7a0;border-color:rgba(34,197,94,.32)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.pill-v{background:rgba(124,58,237,.18);color:#c4b5fd;border-color:rgba(124,58,237,.35)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}
.pill-paid{background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(0,212,255,.10));color:#00ffff;border:1px solid rgba(0,212,255,.45)}
.bar{height:9px;border-radius:20px;background:rgba(0,212,255,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:var(--grad-gold)}
.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(5,10,20,.78);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(0,212,255,.14)}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:14px 0}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,212,255,.08);border:1px solid var(--border);transition:.2s;font-size:15px;color:var(--gold);position:relative;flex-shrink:0}
.icon-btn:hover{background:rgba(0,212,255,.18);border-color:var(--border2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.mbar{display:none}
.hero{padding:16px 20px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.12) 50%,rgba(0,255,255,.06));border:1px solid var(--border2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(0,212,255,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#00ffff,#00d4ff);color:#050a14}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:rgba(0,212,255,.10);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(10,18,32,.98),rgba(5,10,20,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7);animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(0,212,255,.08);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(0,212,255,.20);color:#00ffff}
.toast.info .toast-bar-f{background:var(--grad-gold)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(0,212,255,.14);position:relative;flex-wrap:wrap}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s;border:1px solid}
.dev-btn{background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,150,255,.18));border-color:rgba(0,212,255,.4);color:var(--txt)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(0,212,255,.32),rgba(0,150,255,.32));border-color:#00ffff;transform:translateY(-2px)}
.dev-name b{background:linear-gradient(90deg,#00ffff,#a0e8ff,#00d4ff,#00ffff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900}
.tg-btn{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.35);color:#00ffff}
.tg-btn:hover{background:rgba(0,212,255,.24);border-color:#00ffff;color:#a0e8ff}
.swal-custom-popup{border:1px solid rgba(0,212,255,.4)!important;border-radius:22px!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-title{color:#e0f7ff!important;font-size:20px!important;font-weight:800!important}
.swal-custom-input{background:rgba(5,10,20,.78)!important;border:1.5px solid rgba(0,212,255,.35)!important;color:#e0f7ff!important;border-radius:12px!important}
.lesson-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.24s;cursor:pointer}
.lesson-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.lesson-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#0a1220,#050a14);position:relative;display:grid;place-items:center}
.lesson-thumb .play{width:56px;height:56px;border-radius:50%;background:rgba(0,212,255,.9);display:grid;place-items:center;color:#050a14;font-size:22px;box-shadow:0 8px 28px rgba(0,212,255,.6)}
.lesson-body{padding:14px}.lesson-title{font-weight:800;font-size:14.5px;margin-bottom:6px}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.student-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.24s;text-align:center}
.student-card:hover{transform:translateY(-4px);border-color:var(--border2)}
.shop-card{background:rgba(10,18,32,.65);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;transition:.24s}
.flashcard{perspective:1000px;height:200px;cursor:pointer;margin-bottom:12px}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:20px;text-align:center;font-weight:700;font-size:16px;border:1px solid var(--border2)}
.flashcard-front{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,150,255,.08))}
.flashcard-back{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.08));transform:rotateY(180deg)}
.focus-timer{font-size:clamp(48px,10vw,96px);font-weight:900;letter-spacing:2px;font-family:monospace;color:var(--gold)}
.msg-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.msg-tab{padding:8px 16px;border-radius:20px;font-weight:700;font-size:12.5px;background:rgba(0,212,255,.06);border:1px solid var(--border);color:var(--txt2);cursor:pointer}
.msg-tab.active{background:rgba(0,212,255,.20);border-color:var(--gold);color:#00ffff}
.msg-card{background:rgba(0,212,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
body.light-mode{--bg:#f0f4f8;--bg2:#e0e8f0;--txt:#0a1220;--txt2:#4a5f7a;--muted:#8fa5bd;background:#f0f4f8}
body.light-mode .glass{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(240,244,248,.85));border-color:rgba(0,212,255,.35)}
body.light-mode .glass-s{background:rgba(255,255,255,.85)}
body.light-mode .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(240,244,248,.95))}
body.light-mode .topbar{background:rgba(255,255,255,.85)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
.sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;max-width:85vw;box-shadow:-20px 0 60px rgba(0,0,0,.75);overflow-x:hidden}
.sidebar.open{transform:translateX(0)!important}
.mbar{display:flex}.content{padding:14px 14px 90px}
.topbar{padding:6px 10px;gap:6px;min-height:48px}
.g2,.g3,.g4{grid-template-columns:1fr}
}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/db.js"></script>
<script>
if (window.Babel) { Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] }); }
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;
const SEC = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  safeImg: u => /^https?:\/\/.+\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(String(u || '')) ? u : null,
  clean: s => String(s ?? '').replace(/[<>]/g,'').trim()
};
const ToastCtx=createContext(null);
function ToastProvider({children}){const [items,setItems]=useState([]);const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);},[]);const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div></ToastCtx.Provider>;}
function Toast({data,onClose}){const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);const icons={ok:'✓',err:'✕',warn:'!',info:'i'};return <div className={`toast ${data.type} ${out?'out':''}`}><div className="toast-ico">{icons[data.type]}</div><div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div><button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button><div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div></div>;}
const useToast=()=>useContext(ToastCtx);
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],direct_messages:[],reports:[],friendships:[],xp_shop_items:[],xp_purchases:[],study_groups:[],study_group_members:[],study_plans:[],study_tasks:[],daily_challenges:[],daily_challenge_attempts:[],practice_sessions:[],focus_sessions:[],flashcards:[],video_progress:[],daily_reward:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [isLight,setIsLight]=useState(false);
  const toast=useToast();
  const reload=useCallback(async ()=>{
    try{
      const data=await DB.loadAll();
      const sb=await DB.getClient();
      const extra=['direct_messages','xp_shop_items','xp_purchases','study_groups','study_group_members','study_plans','study_tasks','daily_challenges','daily_challenge_attempts','flashcards','video_progress','daily_reward','friendships','practice_sessions','focus_sessions'];
      const extraResults=await Promise.all(extra.map(async(t)=>{try{const res=await sb.from(t).select('*').limit(2000);return{t,data:res.data||[]};}catch(e){return{t,data:[]};}}));
      extraResults.forEach(r=>{data[r.t]=r.data;});
      setDb(data);
      setCurrentUser(prev => {
        if (!prev) return null;
        const fresh = data.users.find(u => u.id === prev.id);
        return fresh || prev;
      });
    }catch(e){console.warn(e);}
  },[]);
  useEffect(()=>{(async ()=>{try{const sid=DB.getSessionId();if(!sid){window.location.replace('../auth/login.html');return;}const u=await DB.getUser(sid);if(!u||u.active===false){DB.clearSession();window.location.replace('../auth/login.html');return;}if(u.banned===true){DB.clearSession();window.location.replace('../auth/banned.html');return;}setCurrentUser(u);if(u.theme==='light'){document.body.classList.add('light-mode');setIsLight(true);}await reload();}catch(e){console.warn(e);}setLoading(false);})();},[]);
  
  // Push Notifications
  useEffect(()=>{if('Notification' in window && Notification.permission==='default'){Notification.requestPermission();}},[]);

  const logout=useCallback(()=>{Swal.fire({title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',confirmButtonColor:'#00d4ff',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #0a1220, #050a14)',color:'#e0f7ff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('../auth/login.html');}});},[]);
  
  const toggleTheme=useCallback(async ()=>{
    const newTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
    if(newTheme==='light') document.body.classList.add('light-mode');
    else document.body.classList.remove('light-mode');
    setIsLight(newTheme==='light');
    if(currentUser){try{ await DB.updateUser(currentUser.id,{theme:newTheme}); }catch(e){}}
  },[currentUser]);

  const save=useCallback(async (table,item)=>{const saved=await DB.save(table,item);await reload();return saved;},[reload]);
  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return {current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}return {current:cur,next};},[db.levels]);
  
  return <AppCtx.Provider value={{db,currentUser,loading,logout,reload,save,getLevel,toast,toggleTheme,isLight,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id),question:id=>db.questions.find(q=>q.id===id)}}>{children}</AppCtx.Provider>;
}

function Modal({title,children,onClose}){return <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="glass modal"><div className="flex between center mb16"><div className="h3">{title}</div><button className="icon-btn" onClick={onClose}><Icon name="close" size={16}/></button></div>{children}</div></div>;}
function Stat({label,value,icon,color='var(--gold)'}){return <div className="glass-s hv" style={{padding:16}}><div className="flex between center mb8"><div className="stat-l">{label}</div><div style={{color}}>{typeof icon==='string'?<Icon name={icon} size={20}/>:icon}</div></div><div className="stat-n" style={{color}}>{value}</div></div>;}
function Field({label,children}){return <div className="mb12"><label className="lbl" style={{display:'block',fontSize:12.5,fontWeight:700,color:'var(--txt2)',marginBottom:6}}>{label}</label>{children}</div>;}
function Empty({icon='📭',title}){return <div className="empty"><div className="empty-ico">{icon}</div><div className="h4 txt2 mb8">{title}</div></div>;}
function AccessBadge({value}){const isFree=value!==false&&value!=='paid';if(isFree)return <span className="pill pill-free">🆓 مجاني</span>;return <span className="pill pill-paid">🔒 مدفوع</span>;}

function StudentAvatar({student, size=40}){
  const isPaid = student?.subscription==='paid' || student?.subscription==='vip';
  const safeImg = isPaid ? SEC.safeImg(student?.avatar_url) : null;
  if(safeImg) return <img src={safeImg} loading="lazy" style={{width:size,height:size,borderRadius:12,objectFit:'cover',border:'2px solid var(--gold)',flexShrink:0}}/>;
  const isFemale = student?.gender==='female';
  const icon = isFemale ? '👧' : student?.gender==='male' ? '👦' : '👤';
  const bg = isFemale ? 'linear-gradient(135deg,#f472b6,#ec4899)' : 'linear-gradient(135deg,#60a5fa,#3b82f6)';
  return <div style={{width:size,height:size,borderRadius:12,background:bg,display:'grid',placeItems:'center',fontSize:size*0.55,flexShrink:0,border:'2px solid rgba(0,212,255,.4)'}}>{icon}</div>;
}

function Sidebar({items,active,onNav,open,onClose,onLogout}){
  return <>{open&&<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:55}}/>}
  <aside className={`sidebar ${open?'open':''}`}>
    <div className="brand"><div className="brand-logo"><Icon name="trophy" size={22} color="#050a14"/></div><div><div className="brand-name">MISSION EDU</div><div className="brand-sub">المنصة التعليمية</div></div></div>
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:'4px'}}>
      {items.map((g,gi)=><div key={gi}>{g.title&&<div className="nav-gt">{g.title}</div>}{g.items.map(it=><button key={it.id} className={`nav-i ${active===it.id?'on':''}`} onClick={()=>{onNav(it.id);onClose?.();}}><span className="nav-ico"><Icon name={it.icon} size={16}/></span><span>{it.label}</span>{it.badge!=null&&<span className="pill pill-b" style={{marginInlineStart:'auto'}}>{it.badge}</span>}</button>)}</div>)}
    </div>
    <div style={{marginTop:'10px',paddingTop:'10px',borderTop:'1px solid var(--border)'}}><button className="nav-i" onClick={onLogout} style={{color:'#fca5a5',width:'100%'}}><span className="nav-ico"><Icon name="logout" size={16}/></span><span>تسجيل الخروج</span></button></div>
  </aside></>;
}

function HomePage({onNavigate}){
  const app=useApp();
  const user=app.currentUser;
  const lvl=app.getLevel(user.xp||0);
  const totalLessons=app.db.lessons.filter(l=>l.published!==false).length;
  const completed=(user.completed_lessons||[]).length;
  const progress=totalLessons?Math.round((completed/totalLessons)*100):0;
  const recentExams=app.db.exams.slice(0,3);
  const today = new Date().toLocaleDateString('en-CA');
  const todayReward = (app.db.daily_reward || []).find(r => r.user_id === user.id && r.date === today);
  
  // Video Tracking (Last watched)
  const lastVideo = (app.db.video_progress||[]).filter(v=>v.user_id===user.id && v.seconds>0).sort((a,b)=>b.updated_at-a.updated_at)[0];
  const lastLesson = lastVideo ? app.lesson(lastVideo.lesson_id) : null;

  const claimDailyReward = async () => {
    if (todayReward) return app.toast.info('استلمت مكافأة اليوم بالفعل');
    try {
      const sb = await DB.getClient();
      const { data: existing } = await sb.from('daily_reward').select('*').eq('user_id', user.id).eq('date', today);
      if (existing && existing.length > 0) return app.toast.info('استلمت مكافأة اليوم بالفعل');
      await sb.from('daily_reward').insert([{ id: DB.uid('dr_'), user_id: user.id, date: today, xp: 50, claimed_at: Date.now() }]);
      await DB.updateUser(user.id, { xp: (user.xp || 0) + 50 });
      await app.reload();
      app.toast.ok('🎁 +50 XP مكافأة يومية!');
    } catch (e) { app.toast.err(e.message); }
  };

  return <>
    <div className="hero mb16">
      <div className="flex between center wrap g12">
        <div><div className="h2 mb6 grad">أهلاً، {SEC.esc(user.name.split(' ')[0])} 👋</div><div className="sm txt2">مستواك: Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</div></div>
        <div style={{textAlign:'left'}}><div className="sm muted mb6">XP</div><div className="stat-n" style={{color:'var(--gold)'}}>{DB.fmt(user.xp||0)}</div></div>
      </div>
      <div className="mt16"><div className="flex between center mb8"><span className="sm">📊 التقدم الكلي</span><span className="sm" style={{fontWeight:900,color:'var(--gold)'}}>{progress}%</span></div><div className="bar" style={{height:10}}><div className="bar-f" style={{width:`${progress}%`}}/></div></div>
    </div>
    
    <div className="grid g4 mb16">
      <Stat label="المستوى" value={`Lv ${lvl.current.level}`} icon="trend" color="var(--gold)"/>
      <Stat label="السلسلة" value={DB.fmt(user.streak||0)} icon="flash" color="#f59e0b"/>
      <Stat label="الدروس" value={`${completed}/${totalLessons}`} icon="book" color="#22c55e"/>
      <Stat label="الإنجازات" value={DB.fmt((user.achievements||[]).length)} icon="award" color="var(--gold-d)"/>
    </div>

    {lastLesson && (
      <div className="glass mb16" style={{padding:18,borderColor:'var(--gold)'}}>
        <div className="flex between center wrap g8">
          <div className="flex center g12">
            <div style={{width:40,height:40,borderRadius:10,background:'rgba(0,212,255,.15)',display:'grid',placeItems:'center',color:'var(--gold)'}}><Icon name="video" size={20}/></div>
            <div><div className="h4">أكمل المشاهدة</div><div className="xs muted">{SEC.esc(lastLesson.title)} - توقفت عند {Math.floor(lastVideo.seconds/60)}:{String(lastVideo.seconds%60).padStart(2,'0')}</div></div>
          </div>
          <button className="btn btn-p" onClick={()=>window.location.href=`lesson.html?id=${lastLesson.id}`}>متابعة</button>
        </div>
      </div>
    )}

    {!todayReward&&<div className="glass mb16" style={{padding:18,borderColor:'rgba(34,197,94,.4)'}}><div className="flex between center wrap g8"><div className="flex center g12"><div style={{fontSize:32}}>🎁</div><div><div className="h4" style={{color:'#6ee7a0'}}>مكافأة اليوم جاهزة!</div><div className="xs muted">استلم +50 XP</div></div></div><button className="btn btn-ok" onClick={claimDailyReward}><Icon name="gift" size={16}/> استلام</button></div></div>}
    
    <div className="grid g2 mb16">
      <div className="glass" style={{padding:18}}>
        <div className="flex between center mb12"><div className="h4" style={{color:'var(--gold)'}}>📖 مواصلة التعلم</div><button className="btn btn-s btn-sm" onClick={()=>onNavigate('lessons')}>الكل</button></div>
        {app.db.lessons.filter(l=>l.published!==false).slice(0,3).map(l=><div key={l.id} className="flex center g12 mb8" style={{padding:10,background:'rgba(0,212,255,.04)',borderRadius:10,border:'1px solid var(--border)',cursor:'pointer'}} onClick={()=>window.location.href=`lesson.html?id=${l.id}`}><div style={{width:40,height:40,borderRadius:10,background:'var(--grad-gold)',display:'grid',placeItems:'center',color:'#050a14',fontSize:18}}>📖</div><div style={{flex:1,minWidth:0}}><div className="sm" style={{fontWeight:700}}>{SEC.esc(l.title)}</div><div className="xs muted">{SEC.esc(app.unit(l.unit_id)?.name||'')}</div></div><span className="pill pill-b">+{l.xp||0} XP</span></div>)}
        {app.db.lessons.length===0&&<Empty icon="📖" title="لا دروس بعد"/>}
      </div>
      <div className="glass" style={{padding:18}}>
        <div className="flex between center mb12"><div className="h4" style={{color:'var(--gold)'}}>📝 اختبارات</div><button className="btn btn-s btn-sm" onClick={()=>onNavigate('exams')}>الكل</button></div>
        {recentExams.map(e=><div key={e.id} className="flex center g12 mb8" style={{padding:10,background:'rgba(0,212,255,.04)',borderRadius:10,border:'1px solid var(--border)',cursor:'pointer'}} onClick={()=>window.location.href=`exam.html?id=${e.id}`}><div style={{width:40,height:40,borderRadius:10,background:'rgba(0,212,255,.15)',display:'grid',placeItems:'center',color:'var(--gold)',fontSize:18}}>📝</div><div style={{flex:1,minWidth:0}}><div className="sm" style={{fontWeight:700}}>{SEC.esc(e.title)}</div><div className="xs muted">{e.duration}د • {(e.question_ids||[]).length} سؤال</div></div></div>)}
        {app.db.exams.length===0&&<Empty icon="📝" title="لا اختبارات"/>}
      </div>
    </div>
    <div className="glass" style={{padding:18}}>
      <div className="flex between center mb12"><div className="h4" style={{color:'var(--gold)'}}>🏆 المتصدرون</div><button className="btn btn-s btn-sm" onClick={()=>onNavigate('leaderboard')}>الكل</button></div>
      {[...app.db.users].filter(u=>u.role==='student'&&u.banned!==true).sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,5).map((s,i)=><div key={s.id} className="flex center g12" style={{padding:'8px 0',borderBottom:'1px solid rgba(0,212,255,.08)'}}><div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div><StudentAvatar student={s} size={32}/><div style={{flex:1}}><div className="sm">{SEC.esc(s.name)}</div></div><span className="pill pill-b">{DB.fmt(s.xp||0)} XP</span></div>)}
    </div>
  </>;
}

function LessonsPage(){
  const app=useApp();

function PracticePage(){
  const app=useApp();
  const [session,setSession]=useState(null);
  const [qIndex,setQIndex]=useState(0);
  const [score,setScore]=useState(0);
  const [answered,setAnswered]=useState(false);
  const [selected,setSelected]=useState(null);
  const [filterSubject,setFilterSubject]=useState('all');
  const allQuestions=useMemo(()=>{let qs=app.db.questions||[];if(filterSubject!=='all')qs=qs.filter(q=>q.subject_id===filterSubject);return qs;},[app.db.questions,filterSubject]);
  const startPractice=()=>{if(allQuestions.length===0)return app.toast.warn('لا توجد أسئلة');const shuffled=[...allQuestions].sort(()=>Math.random()-0.5).slice(0,10);setSession(shuffled);setQIndex(0);setScore(0);setAnswered(false);setSelected(null);};
  const submitAnswer=(oi)=>{if(answered)return;setSelected(oi);setAnswered(true);const q=session[qIndex];const correct=Number(Array.isArray(q.correct)?q.correct[0]:q.correct);if(oi===correct)setScore(s=>s+1);};
  const nextQuestion=async ()=>{if(qIndex+1>=session.length){try{const sb=await DB.getClient();await sb.from('practice_sessions').insert([{id:DB.uid('ps_'),user_id:app.currentUser.id,subject_id:filterSubject==='all'?null:filterSubject,score,total:session.length,pct:Math.round((score/session.length)*100),status:'completed',started_at:Date.now(),completed_at:Date.now()}]);const xpEarned=score*5;await DB.updateUser(app.currentUser.id,{xp:(app.currentUser.xp||0)+xpEarned});await app.reload();app.toast.ok(`انتهى التدريب! +${xpEarned} XP`);}catch(e){}setSession(null);}else{setQIndex(i=>i+1);setAnswered(false);setSelected(null);}};
  if(session){
    const q=session[qIndex];const correct=Number(Array.isArray(q.correct)?q.correct[0]:q.correct);const isDone=qIndex+1>=session.length;
    return <><div className="flex between center mb16"><button className="btn btn-s" onClick={()=>setSession(null)}>← إلغاء</button><div className="flex g8"><span className="pill pill-b">{qIndex+1}/{session.length}</span><span className="pill pill-g">✓ {score}</span></div></div><div className="glass" style={{padding:22}}><div className="sm mb12" style={{fontWeight:700}}>{SEC.esc(q.text)}</div>{(q.options||[]).map((opt,oi)=>{const isCorrect=oi===correct;const isSelected=oi===selected;let bg='rgba(255,255,255,.03)',border='var(--border)';if(answered){if(isCorrect){bg='rgba(34,197,94,.15)';border='#22c55e';}else if(isSelected){bg='rgba(239,68,68,.15)';border='#ef4444';}}return <div key={oi} className="qbox-opt" onClick={()=>submitAnswer(oi)} style={{background:bg,borderColor:border,cursor:answered?'default':'pointer'}}><span className="qbox-opt-letter">{['A','B','C','D'][oi]}</span><span className="sm" style={{flex:1}}>{SEC.esc(opt)}</span>{answered&&isCorrect&&<span style={{color:'#22c55e'}}>✓</span>}</div>;})}{answered&&q.explanation&&<div className="xs mt12" style={{background:'rgba(0,212,255,.08)',padding:10,borderRadius:8}}>💡 {SEC.esc(q.explanation)}</div>}{answered&&<button className="btn btn-p btn-block mt16" onClick={nextQuestion}>{isDone?'✅ إنهاء':'السؤال التالي →'}</button>}</div></>;
  }
  return <><div className="h2 mb16 grad">🎯 وضع التدريب</div><div className="glass mb16" style={{padding:22}}><div className="h4 mb12" style={{color:'var(--gold)'}}>اختر المادة</div><div className="flex wrap g6 mb16"><button onClick={()=>setFilterSubject('all')} className={`msg-tab ${filterSubject==='all'?'active':''}`}>الكل ({app.db.questions.length})</button>{app.db.subjects.map(s=>{const cnt=app.db.questions.filter(q=>q.subject_id===s.id).length;if(cnt===0)return null;return <button key={s.id} onClick={()=>setFilterSubject(s.id)} className={`msg-tab ${filterSubject===s.id?'active':''}`}>{SEC.esc(s.name)} ({cnt})</button>;})}</div><div className="grid g3 mb16"><Stat label="أسئلة متاحة" value={DB.fmt(allQuestions.length)} icon="help" color="var(--gold)"/><Stat label="أسئلة الجلسة" value="10" icon="target" color="#22c55e"/><Stat label="XP محتمل" value="+50" icon="flash" color="#f59e0b"/></div><button className="btn btn-p btn-block" onClick={startPractice} disabled={allQuestions.length<1}><Icon name="play" size={16}/> ابدأ التدريب</button></div></>;
}

  const addTask=async ()=>{if(!form.title.trim())return app.toast.warn('اكتب عنوان المهمة');try{const sb=await DB.getClient();await sb.from('study_tasks').insert([{id:DB.uid('tk_'),user_id:user.id,title:form.title,done:false,due_date:new Date(form.due_date).getTime(),created_at:Date.now()}]);const {data}=await sb.from('study_tasks').select('*').eq('user_id',user.id).order('due_date',{ascending:true});setTasks(data||[]);app.toast.ok('تمت الإضافة');setEditing(null);setForm({title:'',due_date:new Date().toISOString().slice(0,10)});}catch(e){app.toast.err(e.message);}};
  const toggleTask=async (t)=>{try{const sb=await DB.getClient();await sb.from('study_tasks').update({done:!t.done}).eq('id',t.id);setTasks(ts=>ts.map(x=>x.id===t.id?{...x,done:!x.done}:x));}catch(e){}};
  return <><div className="flex between center mb16 wrap g8"><div className="h2 grad">📅 تقويم المذاكرة</div><button className="btn btn-p" onClick={()=>setEditing('new')}><Icon name="plus" size={16}/> مهمة</button></div><div className="grid g3 mb16"><Stat label="مهام اليوم" value={tasks.filter(t=>new Date(t.due_date).toISOString().slice(0,10)===new Date().toISOString().slice(0,10)).length} icon="calendar" color="var(--gold)"/><Stat label="مكتملة" value={tasks.filter(t=>t.done).length} icon="check" color="#22c55e"/><Stat label="إجمالي" value={tasks.length} icon="target" color="#f59e0b"/></div>{tasks.length===0?<div className="glass" style={{padding:30}}><Empty icon="📅" title="لا مهام"/></div>:<div className="glass" style={{padding:14}}>{tasks.map(t=><div key={t.id} className="flex center g8" style={{padding:10,borderBottom:'1px solid var(--border)'}}><input type="checkbox" checked={t.done} onChange={()=>toggleTask(t)} style={{width:20,height:20}}/><span className="sm" style={{flex:1,textDecoration:t.done?'line-through':'none',opacity:t.done?.5:1}}>{SEC.esc(t.title)}</span></div>)}</div>}{editing&&<Modal title="مهمة جديدة" onClose={()=>setEditing(null)}><Field label="العنوان"><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></Field><Field label="التاريخ"><input type="date" className="input" value={form.due_date} onChange={e=>setForm({...form,due_date:e.target.value})}/></Field><div className="flex g8 mt16"><button className="btn btn-p" style={{flex:1}} onClick={addTask}>حفظ</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div></Modal>}</>;
}

function FocusModePage(){
  const app=useApp();const user=app.currentUser;const [duration,setDuration]=useState(25);const [timeLeft,setTimeLeft]=useState(25*60);const [running,setRunning]=useState(false);const [startedAt,setStartedAt]=useState(null);const timerRef=useRef(null);
  useEffect(()=>{if(running&&timeLeft>0){timerRef.current=setInterval(()=>{setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);return 0;}return t-1;});},1000);return()=>clearInterval(timerRef.current);}},[running]);
  useEffect(()=>{if(running&&timeLeft===0){finish();}},[timeLeft]);
  const finish=async ()=>{setRunning(false);if(!startedAt)return;const minutes=Math.round((Date.now()-startedAt)/60000);try{const sb=await DB.getClient();await sb.from('focus_sessions').insert([{id:DB.uid('fs_'),user_id:user.id,label:'جلسة',duration_minutes:duration,actual_minutes:minutes,xp_awarded:minutes*2,status:'completed',started_at:startedAt,completed_at:Date.now()}]);await DB.updateUser(user.id,{xp:(user.xp||0)+minutes*2});await app.reload();app.toast.ok(`انتهت الجلسة! +${minutes*2} XP`);}catch(e){}setTimeLeft(duration*60);setStartedAt(null);};
  const start=()=>{if(running){clearInterval(timerRef.current);setRunning(false);return;}setStartedAt(Date.now());setRunning(true);};
  const reset=()=>{clearInterval(timerRef.current);setRunning(false);setTimeLeft(duration*60);setStartedAt(null);};
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return <><div className="h2 mb16 grad">🎯 وضع التركيز</div><div className="glass mb16" style={{padding:30,textAlign:'center'}}><div className="focus-timer mb20">{fmt(timeLeft)}</div>{!running&&<div className="flex wrap g6 mb16" style={{justifyContent:'center'}}>{[5,15,25,45,60].map(d=><button key={d} onClick={()=>{setDuration(d);setTimeLeft(d*60);}} className={`msg-tab ${duration===d?'active':''}`}>{d} د</button>)}</div>}<div className="flex g8" style={{justifyContent:'center'}}><button className="btn btn-p" onClick={start} style={{minWidth:140}}>{running?'⏸️ إيقاف':'▶️ بدء'}</button><button className="btn btn-s" onClick={reset}>🔄 إعادة</button></div></div></>;
}

function LeaderboardPage(){
  const app=useApp();
  const students=[...app.db.users].filter(u=>u.role==='student'&&u.banned!==true).sort((a,b)=>(b.xp||0)-(a.xp||0));
  return <><div className="h2 mb16 grad">🏆 لوحة المتصدرين</div>{students.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏆" title="لا طلاب"/></div>:<div className="glass" style={{padding:18}}>{students.slice(0,50).map((s,i)=>{const lvl=app.getLevel(s.xp||0);return <div key={s.id} className="flex center g12" style={{padding:'10px 0',borderBottom:'1px solid rgba(0,212,255,.08)'}}><div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div><StudentAvatar student={s} size={40}/><div style={{flex:1}}><div className="sm" style={{fontWeight:700}}>{SEC.esc(s.name)}</div><div className="xs muted">Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</div></div><span className="pill pill-b">{DB.fmt(s.xp||0)} XP</span></div>;})}</div>}</>;
}

function StudentsDirectoryPage(){
  const app=useApp();const [q,setQ]=useState('');
  const students=app.db.users.filter(u=>u.role==='student'&&u.banned!==true&&u.id!==app.currentUser.id);
  const filtered=students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
  return <><div className="h2 mb16 grad">👥 الطلاب</div><div className="glass mb16" style={{padding:14}}><input className="input" placeholder="🔍 ابحث..." value={q} onChange={e=>setQ(e.target.value)}/></div>{filtered.length===0?<div className="glass" style={{padding:30}}><Empty icon="👥" title="لا طلاب"/></div>:<div className="grid g3">{filtered.map(s=>{const lvl=app.getLevel(s.xp||0);return <div key={s.id} className="student-card"><StudentAvatar student={s} size={70}/><div className="h4 mt8">{SEC.esc(s.name)}</div><div className="xs muted">Lv {lvl.current.level}</div><div className="mt8"><span className="pill pill-b">{DB.fmt(s.xp||0)} XP</span></div></div>;})}</div>}</>;
}

function MessagesPage(){
  const app=useApp();const user=app.currentUser;const [chatWith,setChatWith]=useState(null);const [text,setText]=useState('');
  const allMsgs=(app.db.direct_messages||[]);
  const inbox=allMsgs.filter(m=>m.to_id===user.id).sort((a,b)=>b.created_at-a.created_at);
  const conversation=chatWith?allMsgs.filter(m=>(m.from_id===user.id&&m.to_id===chatWith)||(m.from_id===chatWith&&m.to_id===user.id)).sort((a,b)=>a.created_at-b.created_at):[];
  const otherUser=chatWith?app.db.users.find(u=>u.id===chatWith):null;
  const send=async ()=>{const t=SEC.clean(text);if(!t)return;try{await DB.save('direct_messages',{from_id:user.id,to_id:chatWith,text:t,created_at:Date.now(),read:false});setText('');await app.reload();}catch(e){app.toast.err(e.message);}};
  if(chatWith&&otherUser){return <><div className="flex between center mb16"><button className="btn btn-s" onClick={()=>setChatWith(null)}>← رجوع</button><div className="flex center g8"><StudentAvatar student={otherUser} size={36}/><div className="sm" style={{fontWeight:700}}>{SEC.esc(otherUser.name)}</div></div></div><div className="glass" style={{padding:16}}>{conversation.map(m=><div key={m.id} style={{display:'flex',justifyContent:m.from_id===user.id?'flex-end':'flex-start'}}><div style={{maxWidth:'70%',padding:'10px 14px',borderRadius:14,marginBottom:8,background:m.from_id===user.id?'rgba(0,212,255,.2)':'rgba(255,255,255,.06)'}}>{SEC.esc(m.text)}</div></div>)}<div className="flex g8 mt12"><input className="input" placeholder="اكتب..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><button className="btn btn-p" onClick={send}><Icon name="send" size={16}/></button></div></div></>;}
  return <><div className="h2 mb16 grad">💬 الرسائل</div><div className="glass" style={{padding:16}}>{inbox.length===0?<Empty icon="💬" title="لا رسائل"/>:inbox.map(m=>{const other=app.db.users.find(u=>u.id===m.from_id);return <div key={m.id} className="msg-card" onClick={()=>setChatWith(m.from_id)}><div className="flex between center mb6"><span className="sm" style={{fontWeight:700}}>{SEC.esc(other?.name||'محذوف')}</span><span className="xs muted">{DB.formatDateTime(m.created_at)}</span></div><div className="sm muted">{SEC.esc(m.text)}</div></div>;})}</div></>;
}

function NotificationsPage(){
  const app=useApp();const user=app.currentUser;
  const notifs=(app.db.notifications||[]).filter(n=>n.target==='all'||n.target===user.id).sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  return <><div className="h2 mb16 grad">🔔 الإشعارات</div>{notifs.length===0?<div className="glass" style={{padding:30}}><Empty icon="🔔" title="لا إشعارات"/></div>:<div className="flex col g8">{notifs.map(n=><div key={n.id} className="glass-s" style={{padding:14}}><div className="flex between center mb6"><div className="h4" style={{fontSize:14}}>{SEC.esc(n.title)}</div><span className="xs muted">{DB.formatDateTime(n.created_at)}</span></div><div className="sm txt2">{SEC.esc(n.body)}</div></div>)}</div>}</>;
}

function ProfilePage(){
  const app=useApp();const user=app.currentUser;const lvl=app.getLevel(user.xp||0);
  const changePassword=async ()=>{const {value:newPass}=await Swal.fire({title:'كلمة مرور جديدة',input:'password',inputPlaceholder:'6 أحرف على الأقل',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',confirmButtonColor:'#00d4ff',cancelButtonColor:'#64748b',inputValidator:v=>{if(!v||v.length<6)return 'قصيرة جدًا'},customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});if(newPass){try{await DB.updateUser(user.id,{password:newPass});app.toast.ok('تم التحديث');}catch(e){app.toast.err(e.message);}}};
  return <><div className="h2 mb16 grad">👤 ملفي</div><div className="glass mb16" style={{padding:22}}><div className="flex center g16 wrap"><StudentAvatar student={user} size={100}/><div style={{flex:1,minWidth:200}}><div className="h2 mb6">{SEC.esc(user.name)}</div><div className="sm muted mb8" dir="ltr">📱 {(user.country_code||'+20')}{(user.phone||'')}</div><div className="flex wrap g6"><span className="pill pill-b">🏆 Lv {lvl.current.level} — {SEC.esc(lvl.current.name)}</span>{user.subscription==='vip'?<span className="pill pill-v">💎 VIP</span>:user.subscription==='paid'?<span className="pill pill-g">💳 مدفوع</span>:<span className="pill pill-y">🆓 مجاني</span>}{user.governorate&&<span className="pill pill-b">📍 {SEC.esc(user.governorate)}</span>}</div></div></div><div className="div"></div><div className="grid g4"><Stat label="XP" value={DB.fmt(user.xp||0)} icon="trend" color="var(--gold)"/><Stat label="السلسلة" value={DB.fmt(user.streak||0)} icon="flash" color="#f59e0b"/><Stat label="دروس" value={DB.fmt((user.completed_lessons||[]).length)} icon="book" color="#22c55e"/><Stat label="إنجازات" value={DB.fmt((user.achievements||[]).length)} icon="award" color="var(--gold-d)"/></div></div><div className="glass" style={{padding:22}}><div className="h4 mb12" style={{color:'var(--gold)'}}>⚙️ الإعدادات</div><button className="btn btn-s btn-block mb12" onClick={changePassword}>🔑 تغيير كلمة المرور</button><button className="btn btn-dn btn-block" onClick={app.logout}>🚪 تسجيل الخروج</button></div></>;
}

function Footer(){
  const app=useApp();const user=app.currentUser;
  const sendReport=async()=>{const {value:msg}=await Swal.fire({title:'🚨 بلاغ',input:'textarea',inputPlaceholder:'اكتب رسالتك',showCancelButton:true,confirmButtonText:'📤 إرسال',cancelButtonText:'إلغاء',confirmButtonColor:'#00d4ff',cancelButtonColor:'#64748b',inputValidator:v=>{if(!v||v.trim().length<5)return 'رسالة قصيرة'},customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});if(msg){const sent=await DB.reportIssue({userName:user?.name||'طالب',userPhone:(user?.country_code||'+20')+(user?.phone||'—'),message:SEC.clean(msg)});Swal.fire({icon:sent?'success':'error',title:sent?'✅':'❌',confirmButtonColor:'#00d4ff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});}};
  return <div className="footer-dev"><button className="dev-btn" onClick={()=>window.open("https://wa.me/201128351702","_blank")}><span className="dev-name">Developed by <b>EL-sayed Hasan</b></span></button><button className="tg-btn" onClick={sendReport}>بلاغ</button></div>;
}

function StudentApp(){
  const app=useApp();
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('student_tab')||'home'}catch(e){return 'home'}});
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const user=app.currentUser;
  useEffect(()=>{try{localStorage.setItem('student_tab',tab)}catch(e){}},[tab]);
  const unreadMsgs=(app.db.direct_messages||[]).filter(m=>m.to_id===user.id&&!m.read).length;
  const unreadNotifs=(app.db.notifications||[]).filter(n=>{if(n.target!=='all'&&n.target!==user.id)return false;return (Number(n.created_at)||0)>Number(localStorage.getItem('notif_read_'+user.id)||0);}).length;
  useEffect(()=>{if(tab==='notifications'){try{localStorage.setItem('notif_read_'+user.id,Date.now().toString())}catch(e){}}},[tab,user.id]);
  const items=[
    {title:'الرئيسية',items:[{id:'home',icon:'home',label:'الرئيسية'},{id:'analytics',icon:'chart',label:'تحليلاتي'}]},
    {title:'التعلم',items:[{id:'lessons',icon:'book',label:'الدروس'},{id:'exams',icon:'clipboard',label:'الاختبارات'},{id:'practice',icon:'target',label:'وضع التدريب'},{id:'flashcards',icon:'layers',label:'Flashcards'}]},
    {title:'الأنشطة',items:[{id:'focus',icon:'clock',label:'وضع التركيز'},{id:'calendar',icon:'calendar',label:'تقويم المذاكرة'},{id:'groups',icon:'handshake',label:'مجموعات الدراسة'},{id:'friend-challenge',icon:'swords',label:'تحدي الأصدقاء'}]},
    {title:'التواصل',items:[{id:'leaderboard',icon:'trophy',label:'المتصدرين'},{id:'school-lb',icon:'school',label:'ترتيب المدارس'},{id:'students',icon:'users',label:'الطلاب'},{id:'messages',icon:'message',label:'الرسائل',badge:unreadMsgs||null},{id:'notifications',icon:'bell',label:'الإشعارات',badge:unreadNotifs||null}]},
    {title:'الحساب',items:[{id:'xp-shop',icon:'shoppingBag',label:'متجر XP'},{id:'profile',icon:'user',label:'ملفي'}]}
  ];
  const navigate=(id)=>{
    if(id==='friend-challenge'){ window.location.href='sv.html'; return; }
    setTab(id);setSidebarOpen(false);
  };
  return <div className="app">
    <Sidebar items={items} active={tab} onNav={navigate} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={app.logout}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} unreadNotifs={unreadNotifs} unreadMsgs={unreadMsgs} onOpenNotifications={()=>navigate('notifications')} onOpenMessages={()=>navigate('messages')} onOpenProfile={()=>navigate('profile')} onToggleTheme={app.toggleTheme} isLight={app.isLight}/>
      <div className="content">
        {tab==='home'&&<HomePage onNavigate={navigate}/>}
        {tab==='analytics'&&<AnalyticsPage/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='practice'&&<PracticePage/>}
        {tab==='flashcards'&&<FlashcardsPage/>}
        {tab==='focus'&&<FocusModePage/>}
        {tab==='calendar'&&<StudyCalendarPage/>}
        {tab==='groups'&&<StudyGroupsPage/>}
        {tab==='xp-shop'&&<XPShopPage/>}
        {tab==='leaderboard'&&<LeaderboardPage/>}
        {tab==='school-lb'&&<SchoolLeaderboardPage/>}
        {tab==='students'&&<StudentsDirectoryPage/>}
        {tab==='messages'&&<MessagesPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='profile'&&<ProfilePage/>}
        <Footer/>
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading)return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser)return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
