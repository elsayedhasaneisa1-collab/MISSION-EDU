<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}

body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}

button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}

.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 110px;max-width:1200px;width:100%;margin:0 auto;animation:fu .5s}

.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}

.dev-btn,.report-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.32s;border:1px solid;font-family:inherit}

.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px)}

.report-btn{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(200,50,50,.10));border-color:rgba(239,68,68,.4);color:#fca5a5;position:relative;overflow:hidden}
.report-btn:hover{background:linear-gradient(135deg,rgba(239,68,68,.30),rgba(200,50,50,.20));border-color:#ef4444;color:#fff;transform:translateY(-2px)}

@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;max-width:85vw;box-shadow:-20px 0 60px rgba(0,0,0,.7);overflow-x:hidden}
  .sidebar.open{transform:translateX(0)!important}
  .mbar{display:flex}
  .content{padding:14px 14px 120px;overflow-x:hidden}
  .topbar{padding:10px 14px}
  .g2,.g4{grid-template-columns:1fr}
  .g-auto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .btmnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:55;background:rgba(6,9,20,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 6px;justify-content:space-around;padding-bottom:calc(8px + env(safe-area-inset-bottom));max-width:100vw;overflow-x:hidden}
  .btmnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:700;transition:.2s;min-width:0}
  .btmnav button.on{color:var(--blue2);background:rgba(47,125,255,.12)}
  .btmnav .i{font-size:19px;display:flex;justify-content:center}
  .btmnav .lbl-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
html,body{overflow-x:hidden;max-width:100%;width:100%}

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<script src="/db.js"></script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

/* ═══ أصوات ═══ */
let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx){try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  return _audioCtx;
}
function beep(f,d,t='sine',v=0.15){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=t;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(v,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d/1000);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+d/1000);
  }catch(e){}
}
function playSound(type='notify'){
  switch(type){
    case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;
    case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;
    case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;
    default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100);
  }
}

const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
    if(type==='ok') playSound('success');
    else if(type==='err') playSound('err');
    else if(type==='warn') playSound('warn');
    else playSound('notify');
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);
  useEffect(()=>{
    const s=Date.now();
    const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-s)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);
    return()=>clearInterval(t);
  },[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [attempts,setAttempts]=useState([]);
  const [errors,setErrors]=useState([]);
  const [notes,setNotes]=useState([]);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      await DB.cleanupExpiredPolls();
      const data=await DB.loadAll();
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('/auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}
        if(u.role==='admin'){window.location.replace('/admin/index.html');return;}
        setCurrentUser(u);
        const sb=await DB.getClient();
        const [a,e,n]=await Promise.all([
          DB.getAttempts(u.id),
          DB.getErrors(u.id),
          sb.from('notes').select('*').eq('user_id',u.id).then(r=>r.data||[])
        ]);
        setAttempts(a);setErrors(e);setNotes(n);
        await reload();
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  useEffect(()=>{
    const unlock=()=>{
      const ctx=getAudioCtx();
      if(ctx&&ctx.state==='suspended') ctx.resume();
      document.removeEventListener('click',unlock);
      document.removeEventListener('touchstart',unlock);
    };
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{
      document.removeEventListener('click',unlock);
      document.removeEventListener('touchstart',unlock);
    };
  },[]);

  const logout=useCallback(()=>{
    Swal.fire({
      title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',
      showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    }).then(r=>{
      if(r.isConfirmed){
        try{localStorage.removeItem('student_tab');localStorage.removeItem('student_selected');}catch(e){}
        DB.clearSession();
        window.location.replace('/auth/login.html');
      }
    });
  },[]);

  const updateUser=useCallback(async (id,patch)=>{
    const u=await DB.updateUser(id,patch);
    setCurrentUser(u);
    return u;
  },[]);

  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  const saveNote=useCallback(async (lessonId,text)=>{
    if(!currentUser) return;
    const sb=await DB.getClient();
    const existing=notes.find(n=>n.lesson_id===lessonId);
    const now=Date.now();
    if(existing){
      await sb.from('notes').update({text,updated_at:now}).eq('id',existing.id);
      setNotes(x=>x.map(n=>n.id===existing.id?{...n,text,updated_at:now}:n));
    } else {
      const row={id:DB.uid('note_'),user_id:currentUser.id,lesson_id:lessonId,text,created_at:now,updated_at:now};
      await sb.from('notes').insert([row]);
      setNotes(x=>[...x,row]);
    }
  },[currentUser,notes]);

  const getNote=useCallback((lessonId)=>{
    return notes.find(n=>n.lesson_id===lessonId)?.text||'';
  },[notes]);

  return <AppCtx.Provider value={{
    db,currentUser,attempts,errors,notes,loading,
    logout,updateUser,reload,getLevel,toast,playSound,
    saveNote,getNote,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

function Stat({label,value,icon,color='var(--blue)',sub}){
  return <div className="glass-s hv" style={{padding:16}}>
    <div className="flex between center mb8">
      <div className="stat-l">{label}</div>
      <div style={{color}}>{typeof icon==='string'?<Icon name={icon} size={20}/>:icon}</div>
    </div>
    <div className="stat-n" style={{color}}>{value}</div>
    {sub&&<div className="xs muted mt8">{sub}</div>}
  </div>;

function Empty({icon='📭',title,desc}){
  return <div className="empty">
    <div className="empty-ico">{icon}</div>
    <div className="h4 txt2 mb8">{title}</div>
    {desc&&<div className="sm">{desc}</div>}
  </div>;
}

function Ring({value,size=120,stroke=10,color='#2f7dff',children}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c-(value/100)*c;
  return <div className="ring" style={{width:size,height:size}}>
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,.07)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:'stroke-dashoffset 1s'}}/>
    </svg>
    <div className="ring-t">{children}</div>
  </div>;
}

function Topbar({user,onMenu,onLogout,onSearch,searchResults,unreadNotifs=0,onOpenNotifications}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!q.trim()){setOpen(false);return;}
    setOpen(true);
    const t=setTimeout(()=>onSearch?.(q),150);
    return()=>clearTimeout(t);
  },[q]);
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}><Icon name="menu" size={16}/></button>
    <div style={{position:'relative',flex:1,maxWidth:520,minWidth:0}}>

        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث عن درس، اختبار..."/>
        {q&&<button onClick={()=>{setQ('');setOpen(false);}} style={{opacity:.6,color:'var(--txt)'}}><Icon name="close" size={14}/></button>}

function Subjects({setSelected,setTab}){
  const app=useApp();
  const u=app.currentUser;
  const access=u.all_subjects?app.db.subjects.map(s=>s.id):(u.access_subjects||[]);
  const subjects=app.db.subjects.filter(s=>access.includes(s.id)).sort((a,b)=>a.sort_order-b.sort_order);
  return <>
    <div className="h2 mb16">المواد المتاحة</div>
    {subjects.length===0?<div className="glass" style={{padding:30}}><Empty icon="📚" title="لا توجد مواد متاحة لك"/></div>:
      <div className="grid g-auto">
        {subjects.map(s=>{
          const units=app.db.units.filter(x=>x.subject_id===s.id);
          const lessons=app.db.lessons.filter(l=>units.some(un=>un.id===l.unit_id)&&l.published!==false);
          const done=lessons.filter(l=>(u.completed_lessons||[]).includes(l.id)).length;
          const p=DB.pct(done,lessons.length);
          return <div key={s.id} className="glass hv" style={{padding:20,cursor:'pointer'}} onClick={()=>{
            setSelected({type:'subject',id:s.id});setTab('subject');
          }}>
            <div className="flex between center mb12">
              <div style={{fontSize:38}}>{s.icon}</div>
              <span className="pill pill-b">{lessons.length} درس</span>

            <div className="bar"><div className="bar-f" style={{width:`${p}%`}}/></div>
            <div className="flex between center mt8">
              <span className="xs muted">{done}/{lessons.length}</span>
              <span className="xs" style={{color:'var(--blue2)',fontWeight:700}}>{p}%</span>
            </div>
          </div>;
        })}
      </div>
    }
  </>;
}

function SubjectDetail({subjectId,setTab}){
  const app=useApp();
  const u=app.currentUser;
  const s=app.subject(subjectId);
  if(!s) return <Empty icon="❓" title="المادة غير موجودة"/>;
  const units=app.db.units.filter(x=>x.subject_id===s.id).sort((a,b)=>a.sort_order-b.sort_order);
  return <>
    <button className="btn btn-s btn-sm mb16" onClick={()=>setTab('subjects')}>← المواد</button>
    <div className="hero mb16">
      <div className="flex center g16">
        <div style={{fontSize:52}}>{s.icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div className="h1 mb6">{s.name}</div>
          <div className="sm txt2">{s.desc}</div>
        </div>
      </div>
    </div>

    <div className="h3 mb12" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="book" size={18}/> الوحدات والدروس</div>
    {units.map(un=>{
      const lessons=app.db.lessons.filter(l=>l.unit_id===un.id&&l.published!==false).sort((a,b)=>{
        const sa=Number(a.sort_order)||999999,sb=Number(b.sort_order)||999999;
        if(sa!==sb) return sa-sb;
        return (new Date(a.created_at||0).getTime()||0)-(new Date(b.created_at||0).getTime()||0);
      });
      return <div key={un.id} className="glass mb16" style={{padding:18}}>
        <div className="flex between center mb12">
          <div style={{minWidth:0}}>
            <div className="h4">{un.name}</div>
            <div className="xs muted">{un.desc}</div>
          </div>
          <span className="pill pill-b">{lessons.length} درس</span>
        </div>
        {lessons.length===0?<div className="sm muted" style={{textAlign:'center',padding:12}}>لا توجد دروس</div>:
          <div className="grid g2">
            {lessons.map(l=>{
              const done=(u.completed_lessons||[]).includes(l.id);
              return <a key={l.id} href={`/student/lesson.html?id=${l.id}`} className="glass-s hv" style={{padding:14,textDecoration:'none',color:'inherit'}}>
                <div className="flex between center mb6">
                  <span className={`pill ${done?'pill-g':'pill-b'}`}>{done?<Icon name="check" size={12}/>:<Icon name="play" size={12}/>}</span>
                </div>
                <div className="h4" style={{fontSize:14}}>{l.title}</div>
                <div className="xs muted mt6">⏱ {l.duration}د • +{l.xp} XP</div>
              </a>;
            })}
          </div>
        }
      </div>;
    })}
  </>;
}

function Missions(){
  const app=useApp();
  const u=app.currentUser;
  const access=u.all_subjects?app.db.subjects.map(s=>s.id):(u.access_subjects||[]);
  const missions=app.db.missions.filter(m=>access.includes(m.subject_id));
  const complete=async m=>{
    try{
      await app.updateUser(u.id,{
        completed_missions:[...(u.completed_missions||[]),m.id],
        xp:(u.xp||0)+(m.xp||0)
      });
      DB.trackActivity({userId:u.id,userName:u.name,type:'mission_complete',target:m.title,details:{xp:m.xp}});
      app.toast.ok(`🎉 أكملت المهمة! +${m.xp} XP`);
      await app.reload();
    }catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="h2 mb16">المهام</div>
    {missions.length===0?<div className="glass" style={{padding:30}}><Empty icon="🎯" title="لا توجد مهام متاحة"/></div>:
      <div className="grid g2">
        {missions.map(m=>{
          const done=(u.completed_missions||[]).includes(m.id);
          const s=app.subject(m.subject_id);
          return <div key={m.id} className="glass hv" style={{padding:20}}>
            <div className="flex between center mb12">
              <span className="pill pill-b">{s?.icon} {s?.name}</span>
              <span className={`pill ${done?'pill-g':'pill-v'}`}>{done?'مكتملة':`+${m.xp} XP`}</span>
            </div>
            <div className="h3 mb6">{m.title}</div>
            <div className="sm muted mb16">{m.desc}</div>
            {!done&&<button className="btn btn-ok btn-block" onClick={()=>complete(m)}>🎉 استلام المكافأة</button>}
            {done&&<div className="sm" style={{textAlign:'center',color:'var(--green)',fontWeight:700}}>🎯 مكتملة</div>}
          </div>;
        })}
      </div>
    }
  </>;
}

function Achievements(){
  const app=useApp();
  const u=app.currentUser;
  return <>
    <div className="h2 mb16">الإنجازات</div>
    {app.db.achievements.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏆" title="لا توجد إنجازات"/></div>:
      <div className="grid g-auto">
        {app.db.achievements.map(a=>{
          const got=(u.achievements||[]).includes(a.id);
          return <div key={a.id} className={`glass hv ${got?'':'lock'}`} style={{padding:20,textAlign:'center',opacity:got?1:.45,filter:got?'none':'grayscale(.4)'}}>
            <div style={{fontSize:44,marginBottom:8}}>{a.icon}</div>
            <div className="h4 mb6">{a.title}</div>
            <div className="sm muted mb12">{a.desc}</div>
            {got?<span className="pill pill-g">✓ محقق</span>:<span className="pill pill-y">🔒 مقفول</span>}
          </div>;
        })}
      </div>
    }
  </>;
}

function ErrorBook(){
  const app=useApp();
  const errs=app.errors;
  return <>
    <div className="h2 mb16">دفتر أخطائي</div>
    {errs.length===0?<div className="glass" style={{padding:30}}><Empty icon="✨" title="لا توجد أخطاء — أحسنت!"/></div>:
      errs.map((e,i)=>{
        const q=app.question(e.question_id);
        if(!q) return null;
        return <div key={i} className="glass mb12" style={{padding:16}}>
          <div className="flex between center mb8">
            <span className="pill pill-r">أخطأت {e.count||1} مرة</span>
            <span className="xs muted">{new Date(e.at).toLocaleDateString('ar-EG')}</span>
          </div>
          <div className="h4 mb12">{q.text}</div>
          <div className="grid g2 mb12">
            <div className="eb">
              <div className="xs muted">إجابتك</div>
              <div className="sm" style={{color:'var(--red)'}}>{q.options[e.given]||'—'}</div>
            </div>
            <div className="eb">
              <div className="xs muted">الإجابة الصحيحة</div>
              <div className="sm" style={{color:'var(--green)'}}>{q.options[q.correct[0]]}</div>
            </div>
          </div>
          <div className="glass-s" style={{padding:10}}>
            <div className="xs muted"><b style={{color:'var(--blue2)'}}>💡 الشرح:</b> {q.explanation}</div>
          </div>
        </div>;
      })
    }
  </>;
}

function Leaderboard(){
  const app=useApp();
  const u=app.currentUser;
  const sorted=useMemo(()=>[...app.db.users.filter(x=>x.role==='student'&&x.active!==false)].sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10),[app.db.users]);
  return <>
    <div className="h2 mb16">🏅 المتصدرون</div>
    {sorted.length===0?<div className="glass" style={{padding:30}}><Empty icon="🏅" title="لا يوجد طلاب بعد"/></div>:
      <div className="glass" style={{padding:14}}>
        <div className="sx">
          <table className="tbl">
            <thead><tr><th>#</th><th>الطالب</th><th>XP</th><th>المستوى</th></tr></thead>
            <tbody>
              {sorted.map((s,i)=>{
                const {current}=app.getLevel(s.xp||0);
                const isMe=s.id===u.id;
                return <tr key={s.id} style={{background:isMe?'rgba(47,125,255,.06)':'transparent'}}>
                  <td><div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div></td>
                  <td><div className="flex center g8">
                    <div className="avatar" style={{width:32,height:32,fontSize:14}}>{s.avatar||'👤'}</div>
                    <span>{s.name} {isMe&&<span className="pill pill-b" style={{marginInlineStart:6}}>أنت</span>}</span>
                  </div></td>
                  <td><b>{DB.fmt(s.xp||0)}</b></td>
                  <td><span className="pill pill-v">Lv {current.level}</span></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    }
  </>;
}

function NotesPage({setTab}){
  const app=useApp();
  const notes = app.notes || [];
  const sortedNotes = useMemo(()=>[...notes].sort((a,b)=>(b.updated_at||0)-(a.updated_at||0)),[notes]);
  const [editing,setEditing]=useState(null);
  const [text,setText]=useState('');
  const startEdit=(n)=>{setEditing(n.id);setText(n.text||'');};
  const saveEdit=async (n)=>{
    try{await app.saveNote(n.lesson_id,text);app.toast.ok('تم الحفظ');setEditing(null);}
    catch(e){app.toast.err(e.message);}
  };
  const delNote=async (n)=>{
    const r=await Swal.fire({
      title:'حذف الملاحظة؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb=await DB.getClient();
      await sb.from('notes').delete().eq('id',n.id);
      app.reload();
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">📝 ملاحظاتي</div>
        <div className="sm muted mt6">كل ملاحظاتك على الدروس</div>
      </div>
      <span className="pill pill-b">{sortedNotes.length} ملاحظة</span>
    </div>
    {sortedNotes.length===0?<div className="glass" style={{padding:30}}><Empty icon="📝" title="لا توجد ملاحظات" desc="ابدأ بكتابة ملاحظاتك من صفحة الدرس"/></div>:
      <div className="grid g2">
        {sortedNotes.map(n=>{
          const l = app.lesson(n.lesson_id);
          const isEditing = editing===n.id;
          return <div key={n.id} className="glass" style={{padding:16}}>
            <div className="flex between center mb12">
              <div className="flex center g8" style={{flex:1,minWidth:0}}>
                <span className="pill pill-b" style={{fontSize:11}}>📖</span>
                {l?<a href={`/student/lesson.html?id=${l.id}`} className="sm" style={{fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l.title}</a>:<span className="sm muted">درس محذوف</span>}
              </div>
              <span className="xs muted">{new Date(n.updated_at||n.created_at).toLocaleDateString('ar-EG')}</span>
            </div>
            {isEditing?<>
              <textarea className="input" value={text} onChange={e=>setText(e.target.value)} rows="5"/>
              <div className="flex g8 mt12">
                <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>saveEdit(n)}>💾 حفظ</button>
                <button className="btn btn-s btn-sm" onClick={()=>setEditing(null)}>إلغاء</button>
              </div>
            </>:<>
              <div className="sm txt2" style={{background:'rgba(0,0,0,.20)',padding:10,borderRadius:10,borderInlineStart:'2px solid var(--blue)',whiteSpace:'pre-wrap',minHeight:60}}>{n.text||'—'}</div>
              <div className="flex g8 mt12">
                <button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>startEdit(n)}>✏️ تعديل</button>
                <button className="btn btn-dn btn-sm" onClick={()=>delNote(n)}>🗑️</button>
              </div>
            </>}
          </div>;
        })}
      </div>
    }
  </>;
}

function Notifications(){
  const app=useApp();
  const u=app.currentUser;
  const list=app.db.notifications.filter(n=>n.target==='all'||n.target===u.id).sort((a,b)=>b.created_at-a.created_at);
  const markRead=async id=>{
    try{
      const n=list.find(x=>x.id===id);
      const readBy=[...(n.read_by||[])];
      if(!readBy.includes(u.id)) readBy.push(u.id);
      await DB.save('notifications',{...n,read_by:readBy});
      await app.reload();
    }catch(e){}
  };
  return <>
    <div className="h2 mb16">الإشعارات</div>
    {list.length===0?<div className="glass" style={{padding:30}}><Empty icon="🔕" title="لا توجد إشعارات"/></div>:
      list.map(n=>{
        const read=(n.read_by||[]).includes(u.id);
        return <div key={n.id} className="glass mb12" style={{padding:16,borderColor:read?'var(--border)':'var(--border2)'}}>
          <div className="flex between center mb6">
            <div className="h4">{n.title} {!read&&<span className="pill pill-b" style={{marginInlineStart:8}}>جديد</span>}</div>
            <span className="xs muted">{new Date(n.created_at).toLocaleDateString('ar-EG')}</span>
          </div>
          <div className="sm txt2 mb12">{n.body}</div>
          {!read&&<button className="btn btn-s btn-sm" onClick={()=>markRead(n.id)}>تحديد كمقروء</button>}
        </div>;
      })
    }
  </>;
}

function ProfileRedirect(){
  useEffect(()=>{ window.location.href = "/student/profile.html"; },[]);
  return <div className="loading"><div className="spinner"></div>جارٍ التحويل...</div>;
}

  const app=useApp();
  const u=app.currentUser;

    const { value: msg } = await Swal.fire({
      title: '🚨 بلاغ عن مشكلة', input: 'textarea',
      inputPlaceholder: 'اكتب رسالتك هنا...',
      showCancelButton: true, confirmButtonText: '📤 إرسال', cancelButtonText: 'إلغاء',
      confirmButtonColor: '#2f7dff', cancelButtonColor: '#64748b',
      inputValidator: v => { if(!v || v.trim().length < 5) return 'يرجى كتابة رسالة واضحة'; },
      customClass: {popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}

        userName: u?.name || 'زائر',

      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span className="dev-name">Developed by <b>EL-sayed Hasan</b></span>
    </button>
    <button className="report-btn" onClick={sendReport} style={{
      background:'linear-gradient(135deg,rgba(239,68,68,.15),rgba(200,50,50,.10))',
      border:'1px solid rgba(239,68,68,.4)',
      color:'#fca5a5',
      padding:'10px 20px',
      borderRadius:50,
      fontSize:12.5,
      fontWeight:700,
      display:'inline-flex',
      alignItems:'center',
      gap:9,
      cursor:'pointer',
      transition:'all .32s',
      fontFamily:'inherit'
    }}>
      <i className="fa-solid fa-ladybug" style={{fontSize:15}}></i>
      <span>بلاغ</span>
    </button>
  </div>;
}

function StudentApp(){
  const app=useApp();
  const user=app.currentUser;

  const [tab,setTab]=useState(()=>{
    try{return localStorage.getItem('student_tab')||'home';}catch(e){return 'home';}
  });

  const [selected,setSelected]=useState(()=>{
    try{const saved=localStorage.getItem('student_selected');return saved?JSON.parse(saved):null;}catch(e){return null;}
  });

  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchResults,setSearchResults]=useState([]);

  useEffect(()=>{try{localStorage.setItem('student_tab',tab);}catch(e){}},[tab]);
  useEffect(()=>{
    try{
      if(selected) localStorage.setItem('student_selected',JSON.stringify(selected));
      else localStorage.removeItem('student_selected');
    }catch(e){}
  },[selected]);

  const handleNav = (id)=>{
    if(id !== 'subject') setSelected(null);
    setTab(id);
  };

  const unread=app.db.notifications.filter(n=>(n.target==='all'||n.target===user.id)&&!(n.read_by||[]).includes(user.id)).length;

  const items=[{title:'',items:[
    {id:'home',icon:'home',label:'الرئيسية'},
    {id:'subjects',icon:'book',label:'المواد'},
    {id:'missions',icon:'target',label:'المهام'},
    {id:'achievements',icon:'trophy',label:'الإنجازات'},
    {id:'notes',icon:'note',label:'ملاحظاتي',badge:app.notes?.length||null},
    {id:'errors',icon:'alert',label:'دفتر أخطائي'},
    {id:'leaderboard',icon:'medal',label:'المتصدرون'},
    {id:'notifications',icon:'bell',label:'الإشعارات',badge:unread||null},
    {id:'profile',icon:'user',label:'الملف الشخصي'}
  ]}];

  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    const access=user.all_subjects?app.db.subjects.map(s=>s.id):(user.access_subjects||[]);
    app.db.lessons.filter(l=>{
      const un=app.unit(l.unit_id);
      return un&&access.includes(un.subject_id)&&l.published!==false&&(l.title.toLowerCase().includes(lc)||(l.desc||'').toLowerCase().includes(lc));
    }).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="book" size={16}/>,title:l.title,href:`/student/lesson.html?id=${l.id}`}));
    app.db.exams.filter(e=>access.includes(e.subject_id)&&e.title.toLowerCase().includes(lc)).forEach(e=>res.push({type:'اختبار',icon:<Icon name="clipboard" size={16}/>,title:e.title,href:`/student/exam.html?id=${e.id}`}));
    setSearchResults(res);
  };

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={handleNav} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar
        user={user}
        onMenu={()=>setSidebarOpen(true)}
        onLogout={app.logout}
        onSearch={onSearch}
        searchResults={searchResults}
        unreadNotifs={unread}
        onOpenNotifications={()=>handleNav('notifications')}
      />
      <div className="content">
        {tab==='home'&&<Home onNav={setTab} setSelected={setSelected}/>}
        {tab==='subjects'&&<Subjects setSelected={setSelected} setTab={setTab}/>}
        {tab==='subject'&&selected&&<SubjectDetail subjectId={selected.id} setTab={setTab}/>}
        {tab==='missions'&&<Missions/>}
        {tab==='achievements'&&<Achievements/>}
        {tab==='notes'&&<NotesPage setTab={setTab}/>}
        {tab==='errors'&&<ErrorBook/>}
        {tab==='leaderboard'&&<Leaderboard/>}
        {tab==='notifications'&&<Notifications/>}
        {tab==='profile'&&<ProfileRedirect/>}
        <Footer/>
      </div>
    </div>
    <div className="btmnav">
      {[
        {id:'home',icon:'home',label:'الرئيسية'},
        {id:'subjects',icon:'book',label:'المواد'},
        {id:'missions',icon:'target',label:'المهام'},
        {id:'leaderboard',icon:'medal',label:'المتصدرون'},
        {id:'notes',icon:'note',label:'ملاحظاتي'}
      ].map(it=><button key={it.id} className={tab===it.id?'on':''} onClick={()=>handleNav(it.id)}>
        <span className="i"><Icon name={it.icon} size={19}/></span>
        <span className="lbl-txt">{it.label}</span>
      </button>)}
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role==='admin') return null;
  return <StudentApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
