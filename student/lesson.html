<!DOCTYPE html>

<head>

<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--gold:#fbbf24;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 100px}
.h1{font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.col{flex-direction:column}.wrap-fl{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-ok:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(34,197,94,.5)}
.btn-wr{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn-wr:hover{transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-block{width:100%}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-v{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.28)}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.pill-paid{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(251,191,36,.10));color:#fbbf24;border:1px solid rgba(251,191,36,.5);box-shadow:0 0 14px rgba(251,191,36,.22)}
.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42)}
.pill-vip{background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(139,92,246,.12));color:#c4b5fd;border:1px solid rgba(139,92,246,.5);box-shadow:0 0 14px rgba(139,92,246,.25)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.div{height:1px;background:var(--border);margin:14px 0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulsePlay{0%,100%{box-shadow:0 16px 50px rgba(47,125,255,.55),0 0 0 0 rgba(47,125,255,.5)}50%{box-shadow:0 16px 50px rgba(47,125,255,.55),0 0 0 24px rgba(47,125,255,0)}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes noteBlink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes lockPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(251,191,36,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 35px rgba(251,191,36,.9))}}
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.fade-in{animation:fu .5s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(6,9,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;font-weight:700;transition:.2s;text-decoration:none}
.back-btn:hover{background:rgba(47,125,255,.15);color:var(--txt);border-color:var(--border2)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
/* Small-screen lesson player: keep the play button visible and scale down text only. */
@media(max-width:640px){
  .vid-shell .vp-error{padding:10px!important;}
  #btnOpenPlayer{width:clamp(48px,14vw,68px)!important;height:clamp(48px,14vw,68px)!important;min-width:48px;min-height:48px;flex:0 0 auto;margin-bottom:10px!important;padding-right:4px!important;}
  #btnOpenPlayer svg{width:26px;height:26px;}
  #vidShell .vp-error > div:nth-child(2){font-size:clamp(14px,4vw,18px)!important;line-height:1.45;margin-bottom:5px!important;padding:0 8px!important;overflow-wrap:anywhere;}
  #vidShell .vp-error > div:nth-child(3){font-size:11px!important;line-height:1.5;margin-bottom:8px!important;padding:0 6px;}
  #vidShell .vp-error > div:nth-child(4){font-size:10px!important;line-height:1.4;}
}
.vid-shell{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate;cursor:pointer}
.vp-error{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#7f93b8;font-family:'Tajawal','Cairo',sans-serif;text-align:center;padding:20px}
.locked-shell{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,rgba(4,6,14,.96),rgba(11,18,38,.98));border:1px solid rgba(251,191,36,.35);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(251,191,36,.12) inset;display:flex;align-items:center;justify-content:center;padding:16px}
.lock-content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;max-width:420px}
.lock-icon-wrap{position:relative;width:clamp(70px,18vw,110px);height:clamp(70px,18vw,110px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(251,191,36,.35),rgba(251,191,36,.08) 70%,transparent);border:2px solid rgba(251,191,36,.4);box-shadow:0 0 40px rgba(251,191,36,.3);margin-bottom:clamp(12px,3vw,20px);animation:lockPulse 3s ease-in-out infinite}
.lock-icon-wrap i{font-size:clamp(28px,7vw,46px);color:#fbbf24;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.crown-badge{position:absolute;top:-8px;right:-8px;width:clamp(28px,7vw,40px);height:clamp(28px,7vw,40px);border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;box-shadow:0 6px 20px rgba(251,191,36,.55),0 0 0 2px rgba(10,8,5,.9) inset;animation:crownFloat 2.5s ease-in-out infinite}
.crown-badge i{font-size:clamp(13px,3.5vw,18px);color:#1a1206}
.lock-title{font-size:clamp(15px,4vw,20px);font-weight:900;color:#fbbf24;margin-bottom:6px;text-shadow:0 2px 12px rgba(251,191,36,.4)}
.lock-desc{font-size:clamp(11px,2.8vw,13.5px);color:#b7c6e4;margin-bottom:clamp(12px,3vw,18px);line-height:1.6;padding:0 10px}
.lock-btn{display:inline-flex;align-items:center;gap:8px;padding:clamp(9px,2.5vw,12px) clamp(18px,4.5vw,26px);border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1206;font-weight:900;font-size:clamp(12px,3vw,14px);box-shadow:0 10px 30px rgba(251,191,36,.45);transition:.24s;border:none;cursor:pointer;font-family:inherit}
.lock-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(251,191,36,.6)}
.lock-btn i{font-size:clamp(12px,3vw,15px)}
.lock-note{margin-top:clamp(10px,2.5vw,14px);font-size:clamp(9.5px,2.4vw,11px);color:#7f93b8;opacity:.8}
.example{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.example-q{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--txt2)}
.example-a{font-size:13px;color:var(--muted)}
.kp{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.kp-dot{color:var(--blue2);font-weight:800;flex-shrink:0}
.exam-card{display:block;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit;border-radius:14px;background:rgba(21,31,56,.62);border:1px solid var(--border);transition:.28s cubic-bezier(.2,.8,.3,1);position:relative}
.exam-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 12px 30px rgba(47,125,255,.15)}
.exam-card.locked-card{border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(21,31,56,.62));cursor:pointer}
.exam-card.locked-card:hover{border-color:rgba(251,191,36,.6);box-shadow:0 12px 30px rgba(251,191,36,.20)}
.exam-lock-badge{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;box-shadow:0 4px 14px rgba(251,191,36,.5)}
.exam-lock-badge i{font-size:12px;color:#1a1206}
.notes-area{width:100%;min-height:130px;padding:12px 14px;border-radius:12px;background:rgba(10,16,32,.55);border:1.5px solid var(--border);color:var(--txt);font-size:13px;line-height:1.8;resize:vertical;outline:none;font-family:inherit;transition:.22s}
.notes-area:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12);background:rgba(10,16,32,.78)}
.notes-area::placeholder{color:var(--muted)}
.note-status-saving{animation:noteBlink 1s infinite}
.pdf-box{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(239,68,68,.10),rgba(239,68,68,.03));border:1px solid rgba(239,68,68,.28);transition:.28s;text-decoration:none;color:inherit;cursor:pointer;border-width:1px;width:100%;text-align:right;font-family:inherit}
.pdf-box:hover{transform:translateY(-3px);border-color:rgba(239,68,68,.5);box-shadow:0 12px 30px rgba(239,68,68,.20)}
.pdf-icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-size:11px;font-weight:900;flex-shrink:0;box-shadow:0 8px 20px rgba(239,68,68,.35);letter-spacing:.5px}
.pdf-info{flex:1;min-width:0}
.pdf-title{font-size:14.5px;font-weight:800;color:#e8eefc;margin-bottom:4px}
.pdf-desc{font-size:11.5px;color:#7f93b8}
.pdf-arrow{color:#fca5a5;flex-shrink:0;font-size:18px}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);flex-wrap:wrap}
.dev-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .3s;border:1px solid rgba(90,140,230,.3);background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;background:linear-gradient(180deg, #151f38, #0b1122) !important;color:#e8eefc !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important}
.player-modal{position:fixed;inset:0;z-index:9999;background:rgba(3,5,12,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:0;animation:pu .3s}
.player-modal.open{display:flex}
.player-box{position:relative;width:100%;max-width:1400px;background:#000;border-radius:0;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.9);display:flex;flex-direction:column;max-height:100vh}
.player-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,rgba(21,31,56,.98),rgba(11,17,34,.98));border-bottom:1px solid var(--border);flex-shrink:0}
.player-title{flex:1;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:10.5px;font-weight:700;background:rgba(34,197,94,.12);color:#6ee7a0;border:1px solid rgba(34,197,94,.28)}
.player-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
.player-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(47,125,255,.12);border:1px solid rgba(47,125,255,.3);color:#7db6ff;font-size:16px;transition:.2s;cursor:pointer;flex-shrink:0}
.player-btn:hover{background:rgba(47,125,255,.25);color:#fff}
.player-close{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;font-size:18px;font-weight:900;transition:.2s;cursor:pointer;flex-shrink:0}
.player-close:hover{background:rgba(239,68,68,.25);color:#fff}
.player-stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate;flex:1}
.player-stage iframe,.player-stage video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:auto}
.watermark{position:absolute;z-index:100;font-size:15px;font-weight:900;font-family:'Cairo','Tajawal',sans-serif;color:rgba(255,60,60,.32);text-shadow:0 0 4px rgba(255,60,60,.15),1px 1px 1px rgba(0,0,0,.3);padding:0;background:transparent;border:none;outline:none;pointer-events:none;user-select:none;-webkit-user-select:none;white-space:nowrap;transition:top 1.8s cubic-bezier(.4,0,.2,1),left 1.8s cubic-bezier(.4,0,.2,1);letter-spacing:1px;direction:ltr}
.shield-overlay{position:absolute;inset:0;z-index:80;pointer-events:none}
.shield-overlay::before{content:'';position:absolute;top:0;left:0;right:0;height:60px;background:transparent;pointer-events:auto;cursor:default}
.shield-overlay::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:transparent;pointer-events:auto;cursor:default}
.shield-side{position:absolute;top:60px;bottom:80px;width:50px;background:transparent;z-index:80;pointer-events:auto;cursor:default}
.shield-side.right{right:0;left:auto}
.shield-side.left{left:0;right:auto}
.player-modal.fullscreen .player-box{max-width:100vw;width:100vw;height:100vh;max-height:100vh;border-radius:0}
.player-modal.fullscreen .player-header{position:absolute;top:0;left:0;right:0;z-index:150;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);border:none;transition:opacity .3s}
.player-modal.fullscreen .player-header:hover{opacity:1}
.player-modal.fullscreen .player-stage{aspect-ratio:auto;height:100vh;flex:1}
@media(max-width:900px) and (orientation:landscape){
.player-modal{padding:0}
.player-box{border-radius:0;max-width:100vw}
.player-header{padding:6px 12px}
.player-title{font-size:12px}
.player-badge{display:none}
.player-btn,.player-close{width:32px;height:32px;font-size:14px}
.watermark{font-size:12px}
}
@media(max-width:640px){
.player-modal{padding:0}
.player-box{border-radius:0}
.player-header{padding:8px 10px;gap:8px}
.player-title{font-size:12px}
.player-badge{display:none}
.player-btn,.player-close{width:34px;height:34px;font-size:14px}
.watermark{font-size:12px}
}
</style>
</head>

function esc(str){
return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
}
function getYouTubeId(url){
if(!url) return "";
const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([\w-]{11})/);
return m ? m[1] : "";
}
function parseVideo(v){
if(!v) return null;
if(typeof v === 'string'){
try{ return JSON.parse(v); }catch(e){ return null; }
}
return v;
}
function isPaidContent(item){
if(!item) return false;
const checkFlag = (val)=>{
if(val === false) return true;
if(val === 'false') return true;
if(val === 'paid') return true;
if(val === 0) return true;
return false;
};
if(checkFlag(item.is_free)) return true;
const video = parseVideo(item.video);
if(video && checkFlag(video.is_free)) return true;
return false;
}
function hasSubscriptionAccess(user){
if(!user) return false;
if(user.subscription === 'vip' || user.subscription === 'VIP') return true;
if(user.subscription === 'paid' || user.subscription === 'PAID'){
if(!user.subscription_until) return true;
const until = typeof user.subscription_until === 'number'
? user.subscription_until
: new Date(user.subscription_until).getTime();
if(!isNaN(until) && until > Date.now()) return true;
}
return false;
}
function hasAccess(user, item){
const paid = isPaidContent(item);
if(!paid) return true;
return hasSubscriptionAccess(user);
}
function getLockReason(user, item){
if(!isPaidContent(item)) return '';
if(!user) return 'no_user';
if(user.subscription === 'vip' || user.subscription === 'VIP') return '';
if(user.subscription === 'paid' || user.subscription === 'PAID'){
if(!user.subscription_until) return '';
const until = typeof user.subscription_until === 'number' ? user.subscription_until : new Date(user.subscription_until).getTime();
if(until > Date.now()) return '';

}
return 'no_subscription';
}

async function downloadPdf(url, filename){
try{
const res = await fetch(url, { mode: 'cors' });
if(!res.ok) throw new Error('HTTP ' + res.status);
const blob = await res.blob();
const blobUrl = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = blobUrl;
a.download = filename || 'lesson.pdf';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(blobUrl), 1500);
return true;
}catch(e){
console.warn('PDF download failed, opening in new tab:', e);
window.open(url, '_blank');
return false;
}
}
async function loadNote(userId, lessonId){
try{
const sb = await DB.getClient();
const { data } = await sb.from('notes').select('*').eq('user_id', userId).eq('lesson_id', lessonId).maybeSingle();
if(data){
state.note = data.text || '';
state.noteId = data.id;
}
}catch(e){ console.warn('loadNote:', e); }
}
function updateNoteStatus(status){
const el = document.getElementById('noteStatus');
if(!el) return;
el.classList.remove('note-status-saving');
if(status === 'saving'){
el.textContent = '⏳ جارٍ الحفظ...';
el.className = 'pill pill-a note-status-saving';
} else if(status === 'saved'){
el.textContent = '✅ محفوظ';
el.className = 'pill pill-g';
} else if(status === 'error'){
el.textContent = '❌ فشل الحفظ';
el.className = 'pill pill-r';
} else if(status === 'empty'){
el.textContent = 'فارغ';
el.className = 'pill pill-y';
}
}
async function saveNote(silent){
if(!state.user || !state.lesson) return;
if(!state.noteDirty && silent) return;
state.noteSaving = true;
updateNoteStatus('saving');
try{
const sb = await DB.getClient();
const now = Date.now();
const text = state.note;
if(!text.trim()){
if(state.noteId){
await sb.from('notes').delete().eq('id', state.noteId);
state.noteId = null;
}
state.noteDirty = false;
state.noteSaving = false;
updateNoteStatus('empty');
return;
}
if(state.noteId){
await sb.from('notes').update({text, updated_at: now}).eq('id', state.noteId);
} else {
const id = DB.uid('note_');
await sb.from('notes').insert([{
id,
user_id: state.user.id,
lesson_id: state.lesson.id,
text,
created_at: now,
updated_at: now
}]);
state.noteId = id;
}
state.noteDirty = false;
state.noteSaving = false;
updateNoteStatus('saved');
if(!silent){
DB.trackActivity({
userId: state.user.id,
userName: state.user.name,
type: "note_save",
target: state.lesson.title,
details: { lesson: state.lesson.title }
});
}
}catch(e){
console.warn('saveNote:', e);
state.noteSaving = false;
updateNoteStatus('error');
if(!silent){
Swal.fire({
icon: 'error',
title: 'خطأ',
text: 'فشل حفظ الملاحظة',
background: 'linear-gradient(180deg, #151f38, #0b1122)',
color: '#e8eefc',
confirmButtonColor: '#2f7dff',
customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
});
}
}
}

async function enterFullscreenLandscape(){
const modal = document.getElementById('playerModal');
const box = modal?.querySelector('.player-box');
try{
if(box){
if(box.requestFullscreen){
await box.requestFullscreen();
} else if(box.webkitRequestFullscreen){
box.webkitRequestFullscreen();
} else if(box.msRequestFullscreen){
box.msRequestFullscreen();
}
}
if(screen.orientation && screen.orientation.lock){
try{
await screen.orientation.lock('landscape');
}catch(e){
console.warn('Orientation lock failed:', e.message);
}
}
modal.classList.add('fullscreen');
state.isFullscreen = true;
}catch(e){
console.warn('Fullscreen failed:', e.message);
modal.classList.add('fullscreen');
state.isFullscreen = true;
}
}
async function exitFullscreen(){
try{
if(document.fullscreenElement){
if(document.exitFullscreen) await document.exitFullscreen();
else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
else if(document.msExitFullscreen) document.msExitFullscreen();
}
}catch(e){}
state.isFullscreen = false;
if(screen.orientation && screen.orientation.unlock){
try{ screen.orientation.unlock(); }catch(e){}
}
}
async function lockOrientation(mode){
if(screen.orientation && screen.orientation.lock){
try{
await screen.orientation.lock(mode);
}catch(e){}
}
}
function toggleFullscreen(){
const modal = document.getElementById('playerModal');
if(!modal) return;
if(state.isFullscreen){
exitFullscreen().then(()=>{
modal.classList.remove('fullscreen');
lockOrientation('portrait');
});
} else {
enterFullscreenLandscape();
}
}
function moveWatermark(){
const wm = document.getElementById('watermark');
const stage = document.getElementById('playerStage');
if(!wm || !stage) return;
const w = stage.offsetWidth;
const h = stage.offsetHeight;
const maxX = Math.max(20, w - 180);
const maxY = Math.max(20, h - 50);
const x = Math.floor(Math.random() * maxX) + 10;
const y = Math.floor(Math.random() * maxY) + 10;
wm.style.left = x + 'px';
wm.style.top = y + 'px';
wm.style.right = 'auto';
wm.style.bottom = 'auto';
}
function startWatermarkMotion(){
moveWatermark();
state.watermarkTimer = setInterval(moveWatermark, 5000);
}
function stopWatermarkMotion(){
if(state.watermarkTimer){
clearInterval(state.watermarkTimer);
state.watermarkTimer = null;
}
}
function attachProtection(){
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
if(e.key === 'F12'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'U'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'S'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'P'){ e.preventDefault(); return false; }
if(e.key === 'PrintScreen'){
try{ navigator.clipboard.writeText(''); }catch(err){}
}
if(e.key === 'Escape'){
const modal = document.getElementById('playerModal');
if(modal && modal.classList.contains('open')) closePlayer();
}
});
document.addEventListener('copy', e => {
const t = e.target?.tagName?.toLowerCase();
if(t !== 'input' && t !== 'textarea') e.preventDefault();
});
document.addEventListener('cut', e => {
const t = e.target?.tagName?.toLowerCase();
if(t !== 'input' && t !== 'textarea') e.preventDefault();
});
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => {
const t = e.target?.tagName?.toLowerCase();
if(t !== 'input' && t !== 'textarea') e.preventDefault();
});
document.addEventListener('dblclick', e => e.preventDefault());
}

const lockedSubscribeBtn = document.getElementById('btnLockedSubscribe');
if(lockedSubscribeBtn) lockedSubscribeBtn.addEventListener('click', showLockedMessage);
const openBtn = document.getElementById('btnOpenPlayer');
if(openBtn){
const openHandler = (e)=>{
e.preventDefault();
e.stopPropagation();
openPlayer(l, u);
};
openBtn.addEventListener('click', openHandler);
openBtn.addEventListener('touchend', openHandler, { passive: false });
}
const lockedExamCards = app.querySelectorAll('.exam-card[data-locked="true"]');
lockedExamCards.forEach(card=>{
card.addEventListener('click', (e)=>{
e.preventDefault();
e.stopPropagation();
showLockedMessage();
});
});
const pdfLink = document.getElementById('pdfLink');
if(pdfLink){
pdfLink.addEventListener('click', async ()=>{
try{
DB.trackActivity({
userId: u.id, userName: u.name,
type: "pdf_open", target: l.title,
details: { lesson: l.title, pdf: l.pdf_url }
});
}catch(e){}
const url = pdfLink.dataset.url;
const fname = pdfLink.dataset.filename || 'lesson.pdf';
await downloadPdf(url, fname);
});
}
const btnDoneEl = document.getElementById("btnDone");
if(btnDoneEl){
btnDoneEl.addEventListener("click", async ()=>{
if(state.isDone) return;
if(!state.hasVideoAccess){
showLockedMessage();
return;
}
try{
const sb = await DB.getClient();
const { data: userData } = await sb.from("users").select("completed_lessons, xp").eq("id", u.id).maybeSingle();
const completed = userData?.completed_lessons || [];
const currentXp = userData?.xp || 0;
const newCompleted = [...completed, l.id];
const newXp = currentXp + (l.xp || 0);
await DB.updateUser(u.id, { completed_lessons: newCompleted, xp: newXp });
DB.trackActivity({userId:u.id,userName:u.name,type:"lesson_complete",target:l.title,details:{xp:l.xp}});
let certificateEarned = null;
try{
const subjectId = state.subject?.id || state.unit?.subject_id;
if(subjectId && hasSubscriptionAccess(u)){
const { data: unitsInSubject } = await sb.from("units").select("id").eq("subject_id", subjectId);
const unitIds = (unitsInSubject || []).map(x => x.id);
if(unitIds.length > 0){
const { data: allLessons } = await sb.from("lessons").select("id").in("unit_id", unitIds).eq("published", true);
const allLessonIds = (allLessons || []).map(x => x.id);
const allComplete = allLessonIds.length > 0 && allLessonIds.every(id => newCompleted.includes(id));
if(allComplete){
const { data: existingCert } = await sb.from("certificates").select("*").eq("user_id", u.id).eq("subject_id", subjectId).maybeSingle();
if(!existingCert){
const newCert = {
id: DB.uid('cert_'),
user_id: u.id,
subject_id: subjectId,
issued_at: Date.now(),
created_at: Date.now(),
auto_generated: true
};
const { data: insertedCert } = await sb.from("certificates").insert([newCert]).select().single();
certificateEarned = insertedCert || newCert;
DB.trackActivity({
userId: u.id, userName: u.name,
type: "certificate_earned",
target: state.subject?.name || 'مادة',
details: { subject: state.subject?.name, cert_id: newCert.id }
});
}
}
}
}
}catch(certErr){ console.warn("Auto cert error:", certErr); }
await Swal.fire({
icon: 'success',
title: certificateEarned ? '🏆 مبروووك!' : 'أحسنت!',
html: certificateEarned 
? `
<div style="text-align:center;">
<div style="font-size:64px;margin-bottom:12px;">🎓</div>
<p style="font-size:17px;margin-bottom:10px;font-weight:700;">خلصت مادة <b style="color:#fbbf24">${state.subject?.name || ''}</b> كاملة!</p>
<p style="color:#b7c6e4;font-size:14px;margin-bottom:8px;">اتولدت لك <b style="color:#FFD700">شهادة إتمام</b> تلقائيًا 🎉</p>
<div style="display:inline-block;padding:8px 20px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);border-radius:12px;margin-top:8px;">
<span style="color:#fbbf24;font-weight:900;font-size:14px;">+${l.xp} XP</span>
</div>
</div>
`
: `<div style="text-align:center;"><div style="font-size:48px;margin-bottom:8px;">✨</div><div style="font-size:20px;font-weight:900;color:#6ee7a0;">+${l.xp} XP</div></div>`,
background: 'linear-gradient(180deg, #151f38, #0b1122)',
color: '#e8eefc',
confirmButtonColor: certificateEarned ? '#fbbf24' : '#2f7dff',
confirmButtonText: certificateEarned ? '🎓 روح لشهاداتي' : 'تمام',
customClass: {popup:'swal-custom-popup', title:'swal-custom-title'},
timer: certificateEarned ? undefined : 2000,
showConfirmButton: certificateEarned ? true : false
}).then(r=>{
if(certificateEarned && r.isConfirmed){
window.location.href = '/student/index.html';
} else {
location.reload();
}
});
}catch(e){
Swal.fire({icon:'error', title:'خطأ', text:e.message, background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc', confirmButtonColor:'#2f7dff', customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
}
});
}
const btnReviewEl = document.getElementById("btnReview");
if(btnReviewEl){
btnReviewEl.addEventListener("click", ()=>{
if(!state.hasVideoAccess){
showLockedMessage();
return;
}
Swal.fire({
icon: 'info',
title: 'تمت الإضافة',
text: 'سجلنا هذا الدرس في قائمة المراجعة',
background: 'linear-gradient(180deg, #151f38, #0b1122)',
color: '#e8eefc',
confirmButtonColor: '#2f7dff',
customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
});
});
}
const noteEl = document.getElementById('lessonNote');
if(noteEl){
noteEl.value = state.note || '';
if(state.note && state.note.trim()){
updateNoteStatus('saved');
} else {
updateNoteStatus('empty');
}
noteEl.addEventListener('input', ()=>{
state.note = noteEl.value;
state.noteDirty = true;
updateNoteStatus('saving');
scheduleAutoSave();
});
noteEl.addEventListener('blur', ()=>{
if(state.noteDirty) saveNote(true);
});
}
const btnSave = document.getElementById('btnSaveNote');
if(btnSave){
btnSave.addEventListener('click', ()=>{
state.noteDirty = true;
saveNote(false);
});
}
const btnClear = document.getElementById('btnClearNote');
if(btnClear){
btnClear.addEventListener('click', async ()=>{
if(!state.note.trim() && !state.noteId) return;
const r = await Swal.fire({
title: 'مسح الملاحظة؟',
text: 'سيتم حذف الملاحظة نهائيًا',
icon: 'warning',
showCancelButton: true,
confirmButtonText: 'نعم، امسح',
cancelButtonText: 'إلغاء',
confirmButtonColor: '#ef4444',
cancelButtonColor: '#64748b',
background: 'linear-gradient(180deg, #151f38, #0b1122)',
color: '#e8eefc',
customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
});
if(!r.isConfirmed) return;
const el = document.getElementById('lessonNote');
if(el) el.value = '';
state.note = '';
state.noteDirty = true;
await saveNote(false);
});
}
}
async function load(){
if(!lessonId){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ لم يتم تحديد الدرس</div>
<p class="sm muted mb16">يرجى فتح الدرس من داخل المنصة</p>
<a href="/student/index.html" class="btn btn-p" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}
const sid = DB.getSessionId();
if(!sid){ window.location.replace("/auth/login.html"); return; }
const user = await DB.getUser(sid);
if(!user || user.active === false){ DB.clearSession(); window.location.replace("/auth/login.html"); return; }
state.user = user;
userAvatar.textContent = user.avatar || "🧑‍🎓";
const sb = await DB.getClient();
const { data: lesson, error } = await sb.from("lessons").select("*").eq("id", lessonId).maybeSingle();
if(error || !lesson){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ الدرس غير موجود</div>
<a href="/student/index.html" class="btn btn-p" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}
state.lesson = lesson;
DB.trackActivity({
userId: user.id, userName: user.name,
type: "lesson_view", target: lesson.title,
details: { lesson: lesson.title }
});
const { data: unit } = await sb.from("units").select("*").eq("id", lesson.unit_id).maybeSingle();
state.unit = unit;
if(unit){
const { data: subject } = await sb.from("subjects").select("*").eq("id", unit.subject_id).maybeSingle();
state.subject = subject;
}
const { data: unitLessons } = await sb.from("lessons").select("id").eq("unit_id", lesson.unit_id).eq("published", true);
const { data: userData } = await sb.from("users").select("completed_lessons").eq("id", user.id).maybeSingle();
const completed = userData?.completed_lessons || [];
state.totalUnit = unitLessons?.length || 1;
state.doneUnit = (unitLessons || []).filter(l => completed.includes(l.id)).length;
state.unitPct = Math.round((state.doneUnit / state.totalUnit) * 100);
state.isDone = completed.includes(lesson.id);
const { data: allExams } = await sb.from("exams").select("*").eq("published", true);
state.relatedExams = (allExams || []).filter(e => {
const lessonIds = Array.isArray(e.lesson_ids) ? e.lesson_ids : [];
return lessonIds.includes(lesson.id);
});
state.hasVideoAccess = hasAccess(user, lesson);
state.hasExamAccess = {};
state.relatedExams.forEach(e=>{
state.hasExamAccess[e.id] = hasAccess(user, e);
});
await loadNote(user.id, lesson.id);
render();
const closeBtn = document.getElementById('playerClose');
if(closeBtn) closeBtn.addEventListener('click', closePlayer);
const fsBtn = document.getElementById('playerFullscreen');
if(fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
const modal = document.getElementById('playerModal');
if(modal){
modal.addEventListener('click', (e)=>{
if(e.target === modal) closePlayer();
});
}
attachProtection();
window.addEventListener('beforeunload', ()=>{
if(state.noteDirty){
saveNote(true);
}
});
try{
localStorage.setItem('student_last_lesson', lessonId);
}catch(e){}
}
window.openWhatsApp = ()=>{
window.open("https://wa.me/201128351702?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
};
window.sendReport = async ()=>{
const user = state.user || await DB.getUser(DB.getSessionId());
const { value: msg } = await Swal.fire({
title: '🚨 بلاغ عن مشكلة',
input: 'textarea',
inputPlaceholder: 'اكتب رسالتك هنا...',
showCancelButton: true,
confirmButtonText: '📤 إرسال',
cancelButtonText: 'إلغاء',
confirmButtonColor: '#2f7dff',
cancelButtonColor: '#64748b',
inputValidator: v => { if(!v || v.trim().length < 5) return 'يرجى كتابة رسالة واضحة'; },
customClass: {popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}
});
if(msg){
const sent = await DB.reportIssue({
userName: user?.name || 'زائر',
userPhone: (user?.country_code||'+20')+(user?.phone||'—'),
message: msg
});
Swal.fire({icon: sent?'success':'error', title: sent?'✅ تم الإرسال':'❌ فشل', text: sent?'شكرًا لك':'حاول مرة أخرى', background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc', confirmButtonColor:'#2f7dff', customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
}
};
load();
})();
</script>
