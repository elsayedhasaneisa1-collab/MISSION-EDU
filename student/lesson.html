<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 100px}
.h1{font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.col{flex-direction:column}.wrap-fl{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-ok:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(34,197,94,.5)}
.btn-wr{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn-wr:hover{transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-block{width:100%}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-v{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.28)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.div{height:1px;background:var(--border);margin:14px 0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulsePlay{0%,100%{box-shadow:0 16px 50px rgba(47,125,255,.55),0 0 0 0 rgba(47,125,255,.5)}50%{box-shadow:0 16px 50px rgba(47,125,255,.55),0 0 0 24px rgba(47,125,255,0)}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.fade-in{animation:fu .5s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(6,9,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;font-weight:700;transition:.2s;text-decoration:none}
.back-btn:hover{background:rgba(47,125,255,.15);color:var(--txt);border-color:var(--border2)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
.vid-shell{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate;cursor:pointer}
.vp-error{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#7f93b8;font-family:'Tajawal','Cairo',sans-serif;text-align:center;padding:20px}
.example{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.example-q{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--txt2)}
.example-a{font-size:13px;color:var(--muted)}
.kp{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.kp-dot{color:var(--blue2);font-weight:800;flex-shrink:0}
.exam-card{display:block;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit;border-radius:14px;background:rgba(21,31,56,.62);border:1px solid var(--border);transition:.28s cubic-bezier(.2,.8,.3,1)}
.exam-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 12px 30px rgba(47,125,255,.15)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);flex-wrap:wrap}
.dev-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .3s;border:1px solid rgba(90,140,230,.3);background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;background:linear-gradient(180deg, #151f38, #0b1122) !important;color:#e8eefc !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important}
.player-modal{position:fixed;inset:0;z-index:9999;background:rgba(3,5,12,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:0;animation:pu .3s}
.player-modal.open{display:flex}
.player-box{position:relative;width:100%;max-width:1400px;background:#000;border-radius:0;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.9);display:flex;flex-direction:column;max-height:100vh}
.player-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,rgba(21,31,56,.98),rgba(11,17,34,.98));border-bottom:1px solid var(--border);flex-shrink:0;min-height:56px}
.player-title{flex:1;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(47,125,255,.12);border:1px solid rgba(47,125,255,.3);color:#7db6ff;font-size:16px;transition:.2s;cursor:pointer;flex-shrink:0}
.player-btn:hover{background:rgba(47,125,255,.25);color:#fff}
.player-close{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;font-size:18px;font-weight:900;transition:.2s;cursor:pointer;flex-shrink:0}
.player-close:hover{background:rgba(239,68,68,.25);color:#fff}
.player-stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate;flex:1;display:flex;align-items:center;justify-content:center}
.player-stage iframe,.player-stage video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:auto}
.video-progress-wrap{position:absolute;bottom:0;left:0;right:0;z-index:130;padding:0;direction:ltr;transition:padding .2s}
.video-progress-wrap:hover{padding:6px 0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.video-progress-bar{position:relative;width:100%;height:4px;background:rgba(255,255,255,.20);cursor:pointer;transition:height .2s;border-radius:0}
.video-progress-wrap:hover .video-progress-bar{height:7px;border-radius:4px}
.video-progress-buffer{position:absolute;top:0;left:0;bottom:0;background:rgba(255,255,255,.28);width:0%;border-radius:inherit;pointer-events:none;transition:width .3s}
.video-progress-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,#2f7dff,#5aa9ff,#8b5cf6);width:0%;border-radius:inherit;pointer-events:none;transition:width .1s linear;box-shadow:0 0 12px rgba(47,125,255,.6)}
.video-progress-thumb{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%) scale(0);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(47,125,255,.9),0 2px 6px rgba(0,0,0,.6);pointer-events:none;transition:transform .2s,left .1s linear}
.video-progress-wrap:hover .video-progress-thumb{transform:translate(-50%,-50%) scale(1)}
.video-time-display{position:absolute;bottom:14px;left:14px;z-index:131;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);color:#fff;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;font-family:'Tajawal',sans-serif;letter-spacing:.3px;pointer-events:none;direction:ltr;opacity:0;transition:opacity .25s;border:1px solid rgba(255,255,255,.1)}
.player-stage:hover .video-time-display{opacity:1}
.player-modal.fullscreen .player-box{max-width:100vw;width:100vw;height:100vh;max-height:100vh;border-radius:0}
.player-modal.fullscreen .player-header{position:absolute;top:0;left:0;right:0;z-index:150;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);border:none;transition:opacity .3s}
.player-modal.fullscreen .player-stage{aspect-ratio:auto;height:100vh;flex:1}
@media(max-width:900px) and (orientation:landscape){
.player-modal{padding:0}
.player-box{border-radius:0;max-width:100vw}
.player-header{padding:6px 12px;min-height:44px}
.player-title{font-size:12px}
.player-btn,.player-close{width:34px;height:34px;font-size:14px}
.video-progress-bar{height:3px}
.video-time-display{font-size:10.5px;padding:3px 8px;bottom:10px;left:10px}
}
@media(max-width:640px){
.player-modal{padding:0}
.player-box{border-radius:0}
.player-header{padding:8px 10px;gap:8px;min-height:48px}
.player-title{font-size:12px}
.player-btn,.player-close{width:36px;height:36px;font-size:15px}
.video-progress-bar{height:4px}
.video-time-display{font-size:10.5px;padding:3px 8px;bottom:10px;left:10px}
}
</style>
</head>

<script>
(function(){
"use strict";

const DB = window.MissionDB;
const params = new URLSearchParams(window.location.search);
const lessonId = params.get("id");

const app = document.getElementById("app");
const userAvatar = document.getElementById("userAvatar");

let state = {
user: null,
lesson: null,
unit: null,
subject: null,
relatedExams: [],
unitPct: 0,
doneUnit: 0,
totalUnit: 0,
isDone: false,
isFullscreen: false,
videoType: null,
ytPlayer: null,
progressTimer: null,
isSeeking: false,
maxWatched: 0
};

function esc(str){
return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
}

function getYouTubeId(url){
if(!url) return "";
const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([\w-]{11})/);
return m ? m[1] : "";
}

function formatTime(sec){
if(!isFinite(sec) || sec < 0) sec = 0;
const h = Math.floor(sec / 3600);
const m = Math.floor((sec % 3600) / 60);
const s = Math.floor(sec % 60);
if(h > 0){
return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
return m + ':' + String(s).padStart(2,'0');
}

function openPlayer(lesson, user){
const video = lesson.video || {};
const url = video.url || "";
const type = video.type || "youtube";

if(!url){
Swal.fire({
icon: 'warning',
title: 'لا يوجد فيديو',
text: 'هذا الدرس لا يحتوي على فيديو',
background: 'linear-gradient(180deg, #151f38, #0b1122)',
color: '#e8eefc',
confirmButtonColor: '#2f7dff',
customClass: {popup:'swal-custom-popup', title:'swal-custom-title'}
});
return;
}

state.videoType = type;
state.maxWatched = 0;

const playerTitle = document.getElementById('playerTitle');
if(playerTitle) playerTitle.textContent = lesson.title || 'الدرس';

resetProgressBar();

const container = document.getElementById('playerContainer');
if(container){
if(type === 'youtube'){
const ytId = getYouTubeId(url);
if(ytId){
container.innerHTML = `<div id="ytPlayer" style="width:100%;height:100%"></div>`;
initYouTubePlayer(ytId);
} else {

function initYouTubePlayer(videoId){
if(!window.YT || !window.YT.Player){
window.onYouTubeIframeAPIReady = function(){
createYTPlayer(videoId);
};
return;
}
createYTPlayer(videoId);
}

function createYTPlayer(videoId){
try{
if(state.ytPlayer && state.ytPlayer.destroy){
state.ytPlayer.destroy();
state.ytPlayer = null;
}
state.ytPlayer = new window.YT.Player('ytPlayer', {
videoId: videoId,
playerVars: {
rel: 0,
modestbranding: 1,
iv_load_policy: 3,
playsinline: 1,
fs: 1,
autoplay: 1,
showinfo: 0,
controls: 1,
disablekb: 0
},
events: {
onReady: function(e){
try{ e.target.playVideo(); }catch(err){}
showProgressBar();
startProgressTracking();
},
onStateChange: function(e){
if(e.data === 1 || e.data === 2 || e.data === 3){
startProgressTracking();
}
if(e.data === 0){
stopProgressTracking();
setProgressToEnd();
}
},
onError: function(){
hideProgressBar();
}
}
});
}catch(e){
console.warn('YT player init failed:', e);
hideProgressBar();
}
}

function initMp4Player(){
const v = document.getElementById('mp4Video');
if(!v) return;

showProgressBar();
startProgressTracking();

v.addEventListener('loadedmetadata', ()=>{
updateProgressBar();
});
v.addEventListener('timeupdate', ()=>{
updateProgressBar();
});
v.addEventListener('progress', ()=>{
updateBufferBar();
});
v.addEventListener('ended', ()=>{
stopProgressTracking();
setProgressToEnd();
});
}

function showProgressBar(){
const wrap = document.getElementById('videoProgressWrap');
const timeEl = document.getElementById('videoTime');
if(wrap) wrap.style.display = '';
if(timeEl) timeEl.style.display = '';
}

function hideProgressBar(){
const wrap = document.getElementById('videoProgressWrap');
const timeEl = document.getElementById('videoTime');
if(wrap) wrap.style.display = 'none';
if(timeEl) timeEl.style.display = 'none';
}

function resetProgressBar(){
const fill = document.getElementById('videoProgressFill');
const thumb = document.getElementById('videoProgressThumb');
const buffer = document.getElementById('videoProgressBuffer');
const timeEl = document.getElementById('videoTime');
if(fill) fill.style.width = '0%';
if(thumb) thumb.style.left = '0%';
if(buffer) buffer.style.width = '0%';
if(timeEl) timeEl.textContent = '0:00 / 0:00';
}

function setProgressToEnd(){
const fill = document.getElementById('videoProgressFill');
const thumb = document.getElementById('videoProgressThumb');
if(fill) fill.style.width = '100%';
if(thumb) thumb.style.left = '100%';
}

function startProgressTracking(){
if(state.progressTimer) clearInterval(state.progressTimer);
state.progressTimer = setInterval(updateProgressBar, 250);
}

function stopProgressTracking(){
if(state.progressTimer){
clearInterval(state.progressTimer);
state.progressTimer = null;
}
}

function getVideoProgress(){
let current = 0, duration = 0;

if(state.videoType === 'youtube' && state.ytPlayer){
try{
if(state.ytPlayer.getDuration) duration = state.ytPlayer.getDuration() || 0;
if(state.ytPlayer.getCurrentTime) current = state.ytPlayer.getCurrentTime() || 0;
}catch(e){}
} else if(state.videoType === 'mp4'){
const v = document.getElementById('mp4Video');
if(v){
current = v.currentTime || 0;
duration = v.duration || 0;
}
}
return { current, duration };
}

function updateProgressBar(){
if(state.isSeeking) return;

const fill = document.getElementById('videoProgressFill');
const thumb = document.getElementById('videoProgressThumb');
const timeEl = document.getElementById('videoTime');
if(!fill) return;

const { current, duration } = getVideoProgress();

if(duration > 0){
const pct = Math.min(100, (current / duration) * 100);
fill.style.width = pct + '%';
if(thumb) thumb.style.left = pct + '%';
if(timeEl) timeEl.textContent = formatTime(current) + ' / ' + formatTime(duration);
if(current > state.maxWatched) state.maxWatched = current;
}
}

function updateBufferBar(){
if(state.videoType !== 'mp4') return;
const v = document.getElementById('mp4Video');
const buffer = document.getElementById('videoProgressBuffer');
if(!v || !buffer) return;
if(v.buffered.length > 0 && v.duration > 0){
const buffEnd = v.buffered.end(v.buffered.length - 1);
const pct = Math.min(100, (buffEnd / v.duration) * 100);
buffer.style.width = pct + '%';
}
}

function attachProgressEvents(){
const bar = document.getElementById('videoProgressBar');
if(!bar) return;

const getPct = (clientX)=>{
const rect = bar.getBoundingClientRect();
let x = clientX - rect.left;
x = Math.max(0, Math.min(rect.width, x));
return rect.width > 0 ? (x / rect.width) : 0;
};

const seekTo = (pct)=>{
const { duration } = getVideoProgress();
if(duration <= 0) return;

if(state.videoType === 'youtube' && state.ytPlayer && state.ytPlayer.seekTo){
try{ state.ytPlayer.seekTo(duration * pct, true); }catch(e){}
} else if(state.videoType === 'mp4'){
const v = document.getElementById('mp4Video');
if(v) v.currentTime = duration * pct;
}

const fill = document.getElementById('videoProgressFill');
const thumb = document.getElementById('videoProgressThumb');
const timeEl = document.getElementById('videoTime');
const visualPct = pct * 100;
if(fill) fill.style.width = visualPct + '%';
if(thumb) thumb.style.left = visualPct + '%';
if(timeEl) timeEl.textContent = formatTime(duration * pct) + ' / ' + formatTime(duration);
};

bar.addEventListener('click', (e)=>{
e.stopPropagation();
});

bar.addEventListener('mousedown', (e)=>{
e.preventDefault();
e.stopPropagation();
state.isSeeking = true;
seekTo(getPct(e.clientX));

const onMove = (ev)=>{
seekTo(getPct(ev.clientX));
};
const onUp = ()=>{
state.isSeeking = false;
document.removeEventListener('mousemove', onMove);
document.removeEventListener('mouseup', onUp);
};
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
});

bar.addEventListener('touchstart', (e)=>{
e.stopPropagation();
state.isSeeking = true;
const touch = e.touches[0];
seekTo(getPct(touch.clientX));

const onMove = (ev)=>{
ev.preventDefault();
const t = ev.touches[0];
seekTo(getPct(t.clientX));
};
const onEnd = ()=>{
state.isSeeking = false;
document.removeEventListener('touchmove', onMove);
document.removeEventListener('touchend', onEnd);
};
document.addEventListener('touchmove', onMove, { passive: false });
document.addEventListener('touchend', onEnd);
}, { passive: false });
}

function closePlayer(){
const modal = document.getElementById('playerModal');
if(modal){
modal.classList.remove('open');
modal.classList.remove('fullscreen');
}
document.body.style.overflow = '';

stopProgressTracking();
exitFullscreen();

try{
if(state.ytPlayer){
if(state.ytPlayer.stopVideo) state.ytPlayer.stopVideo();
if(state.ytPlayer.destroy) state.ytPlayer.destroy();
state.ytPlayer = null;
}
}catch(e){}

const mp4 = document.getElementById('mp4Video');
if(mp4){
try{ mp4.pause(); mp4.src = ''; }catch(e){}
}

const container = document.getElementById('playerContainer');
if(container) container.innerHTML = '';

state.videoType = null;
resetProgressBar();
}

async function enterFullscreen(){
const modal = document.getElementById('playerModal');
const box = modal?.querySelector('.player-box');

try{
if(box){
if(box.requestFullscreen) await box.requestFullscreen();
else if(box.webkitRequestFullscreen) box.webkitRequestFullscreen();
else if(box.msRequestFullscreen) box.msRequestFullscreen();
}
modal.classList.add('fullscreen');
state.isFullscreen = true;
}catch(e){
modal.classList.add('fullscreen');
state.isFullscreen = true;
}
}

async function exitFullscreen(){
try{
if(document.fullscreenElement){
if(document.exitFullscreen) await document.exitFullscreen();
else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
else if(document.msExitFullscreen) document.msExitFullscreen();
}
}catch(e){}
state.isFullscreen = false;
}

function toggleFullscreen(){
const modal = document.getElementById('playerModal');
if(!modal) return;

if(state.isFullscreen){
exitFullscreen().then(()=>{
modal.classList.remove('fullscreen');
});
} else {
enterFullscreen();
}
}

function attachProtection(){
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
if(e.key === 'F12'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'U'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'S'){ e.preventDefault(); return false; }
if(e.ctrlKey && e.key.toUpperCase() === 'P'){ e.preventDefault(); return false; }
if(e.key === 'Escape'){
const modal = document.getElementById('playerModal');
if(modal && modal.classList.contains('open')) closePlayer();
}
});

document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => {
const t = e.target?.tagName?.toLowerCase();
if(t !== 'input' && t !== 'textarea') e.preventDefault();
});
document.addEventListener('dblclick', e => e.preventDefault());
}

async function load(){
if(!lessonId){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">

<a href="/student/index.html" class="btn btn-p" style="text-decoration:none">العودة للرئيسية</a>
</div>`;
return;
}

const sid = DB.getSessionId();
if(!sid){ window.location.replace("/auth/login.html"); return; }

const user = await DB.getUser(sid);
if(!user || user.active === false){ DB.clearSession(); window.location.replace("/auth/login.html"); return; }

state.user = user;
userAvatar.textContent = user.avatar || "🧑‍🎓";

const sb = await DB.getClient();

const { data: lesson, error } = await sb.from("lessons").select("*").eq("id", lessonId).maybeSingle();
if(error || !lesson){
app.innerHTML = `<div class="glass" style="padding:40px;text-align:center">
<div class="h3 mb12">⚠️ الدرس غير موجود</div>
<a href="/student/index.html" class="btn btn-p" style="text-decoration:none">العودة للرئيسية</a>
</div>`;

}

DB.trackActivity({
userId: user.id, userName: user.name,

});

state.unit = unit;

if(unit){
const { data: subject } = await sb.from("subjects").select("*").eq("id", unit.subject_id).maybeSingle();
state.subject = subject;
}

const { data: unitLessons } = await sb.from("lessons").select("id").eq("unit_id", lesson.unit_id).eq("published", true);
const { data: userData } = await sb.from("users").select("completed_lessons").eq("id", user.id).maybeSingle();

});
