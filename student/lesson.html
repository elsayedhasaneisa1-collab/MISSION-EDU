<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060e" />
<title>الدرس | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 100px}
.h1{font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.txt2{color:var(--txt2)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.col{flex-direction:column}.wrap-fl{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-ok:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(34,197,94,.5)}
.btn-wr{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn-wr:hover{transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-block{width:100%}
.btn-lg{padding:15px 32px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s;background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.div{height:1px;background:var(--border);margin:14px 0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-size:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade-in{animation:fu .5s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(6,9,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;font-weight:700;transition:.2s}
.back-btn:hover{background:rgba(47,125,255,.15);color:var(--txt);border-color:var(--border2)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
.vid-shell{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.vid-shell iframe,.vid-shell video{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
.vid-cover{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(4,6,14,.85),rgba(11,18,38,.9));cursor:pointer;transition:opacity .4s,visibility .4s}
.vid-cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
.vid-cover-title{position:absolute;top:20px;left:20px;right:20px;text-align:center;color:#e8eefc;font-size:14px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none}
.play-btn{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 16px 50px rgba(47,125,255,.7);padding-right:6px;animation:pulse 2.5s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 16px 50px rgba(47,125,255,.7),0 0 0 0 rgba(47,125,255,.6)}50%{box-shadow:0 16px 50px rgba(47,125,255,.7),0 0 0 20px rgba(47,125,255,0)}}
.cover-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;font-weight:600;pointer-events:none}
.vid-wm{position:absolute;top:14px;right:14px;z-index:25;font-size:13px;font-weight:900;color:#ff2d2d;text-shadow:0 0 8px rgba(255,45,45,.9),0 0 16px rgba(255,45,45,.6),1px 1px 2px rgba(0,0,0,.8);pointer-events:none;user-select:none}
.vid-badge{position:absolute;bottom:14px;left:14px;z-index:25;font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:20px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);pointer-events:none}
.vid-prog{position:absolute;bottom:14px;right:14px;z-index:25;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);pointer-events:none}
.example{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.example-q{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--txt2)}
.example-a{font-size:13px;color:var(--muted)}
.kp{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.kp-dot{color:var(--blue2);font-weight:800;flex-shrink:0}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(90,140,230,.12);flex-wrap:wrap}
.dev-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .3s;border:1px solid rgba(90,140,230,.3);background:linear-gradient(135deg,rgba(47,125,255,.15),rgba(139,92,246,.15));color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,rgba(47,125,255,.28),rgba(139,92,246,.28));border-color:#2f7dff;transform:translateY(-2px);box-shadow:0 12px 32px rgba(47,125,255,.35)}
.dev-name b{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#22d3ee,#5aa9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;font-weight:900}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.swal-custom-popup{border:1px solid rgba(90,140,230,.3) !important;border-radius:22px !important;background:linear-gradient(180deg, #151f38, #0b1122) !important;color:#e8eefc !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#e8eefc !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(10,16,32,.75) !important;border:1.5px solid rgba(90,140,230,.3) !important;color:#e8eefc !important;border-radius:12px !important}
</style>
</head>
<body>

  <button class="back-btn" onclick="history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>

  <button class="dev-btn" onclick="openWhatsApp()">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/db.js"></script>
<script>
(function(){
  "use strict";

  const DB = window.MissionDB;
  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get("id");

  const app = document.getElementById("app");
  const userAvatar = document.getElementById("userAvatar");

  const VIDEO_STYLES = `
    .vp-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(90,140,230,.25);box-shadow:0 20px 60px rgba(0,0,0,.6);isolation:isolate;user-select:none}
    .vp-wrap iframe,.vp-wrap video{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
    .vp-overlay{position:absolute;top:0;left:0;right:0;height:60px;z-index:30;background:transparent}
    .vp-watermark{position:absolute;top:14px;right:14px;z-index:35;font-family:'Tajawal','Cairo',sans-serif;font-size:13px;font-weight:900;color:#ff2d2d;text-shadow:0 0 8px rgba(255,45,45,.9),0 0 16px rgba(255,45,45,.6),1px 1px 2px rgba(0,0,0,.8);pointer-events:none;user-select:none}
    .vp-badge{position:absolute;bottom:14px;left:14px;z-index:35;font-family:'Tajawal','Cairo',sans-serif;font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:20px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);pointer-events:none}
    .vp-progress-badge{position:absolute;bottom:14px;right:14px;z-index:35;font-family:'Tajawal','Cairo',sans-serif;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);pointer-events:none}
    .vp-cover{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(4,6,14,.85),rgba(11,18,38,.9));cursor:pointer;transition:opacity .4s,visibility .4s}
    .vp-cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .vp-play-btn{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 16px 50px rgba(47,125,255,.7);padding-right:6px;animation:vpPulse 2.5s ease-in-out infinite;pointer-events:none}
    @keyframes vpPulse{0%,100%{box-shadow:0 16px 50px rgba(47,125,255,.7),0 0 0 0 rgba(47,125,255,.6)}50%{box-shadow:0 16px 50px rgba(47,125,255,.7),0 0 0 20px rgba(47,125,255,0)}}
    .vp-cover-title{position:absolute;top:20px;left:20px;right:20px;text-align:center;color:#e8eefc;font-size:14px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none}
    .vp-cover-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;font-weight:600;pointer-events:none}
    .vp-error{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#7f93b8;font-family:'Tajawal','Cairo',sans-serif;text-align:center;padding:20px}
  `;

  function injectStyles(){
    if(document.getElementById("vp-styles")) return;
    const s = document.createElement("style");
    s.id = "vp-styles";
    s.textContent = VIDEO_STYLES;
    document.head.appendChild(s);
  }

  function getYouTubeId(url){
    if(!url) return "";
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([\w-]{11})/);
    return m ? m[1] : "";
  }
  function getVimeoId(url){
    if(!url) return "";
    const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    return m ? m[1] : "";
  }
  function esc(str){
    return String(str||"").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[s]);
  }

  function renderPlayer(container, video, lessonTitle, watermark, user){
    injectStyles();
    container.innerHTML = "";

    const wrap = document.createElement("div");
    wrap.className = "vp-wrap";

    const cover = document.createElement("div");
    cover.className = "vp-cover";
    cover.innerHTML = `
      <div class="vp-cover-title">${esc(lessonTitle)}</div>
      <div class="vp-play-btn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div class="vp-cover-hint">اضغط لتشغيل الفيديو</div>
    `;

    const overlay = document.createElement("div");
    overlay.className = "vp-overlay";

    const wm = document.createElement("div");
    wm.className = "vp-watermark";
    wm.textContent = watermark;

    const badge = document.createElement("div");
    badge.className = "vp-badge";
    badge.textContent = "🛡 مشاهدة محمية";

    const prog = document.createElement("div");
    prog.className = "vp-progress-badge";
    prog.textContent = "0%";

    const hideCover = ()=>{
      cover.classList.add("hidden");
      DB.trackActivity({userId:user.id,userName:user.name,type:"video_play",target:lessonTitle,details:{lesson:lessonTitle}});
    };

    if(!video || !video.url){
      wrap.innerHTML = `<div class="vp-error"><div style="font-size:48px;opacity:.35;margin-bottom:12px">🎬</div><div>لا يوجد فيديو لهذا الدرس</div></div>`;
      container.appendChild(wrap);
      return;
    }

    if(video.type === "youtube"){
      const id = getYouTubeId(video.url);
      if(!id){
        wrap.innerHTML = `<div class="vp-error">رابط YouTube غير صالح</div>`;
        container.appendChild(wrap);
        return;
      }
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&fs=1`;
      iframe.setAttribute("allow","accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen");
      iframe.setAttribute("allowfullscreen","true");
      iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
      wrap.appendChild(iframe);
      wrap.appendChild(overlay);
      wrap.appendChild(wm);
      wrap.appendChild(badge);
      cover.addEventListener("click", e=>{e.preventDefault();e.stopPropagation();hideCover();});
      cover.addEventListener("touchstart", ()=>hideCover(), {passive:true});
      wrap.appendChild(cover);
      container.appendChild(wrap);
      return;
    }

    if(video.type === "vimeo"){
      const id = getVimeoId(video.url);
      if(!id){
        wrap.innerHTML = `<div class="vp-error">رابط Vimeo غير صالح</div>`;
        container.appendChild(wrap);
        return;
      }
      const iframe = document.createElement("iframe");
      iframe.src = `https://player.vimeo.com/video/${id}?byline=0&portrait=0&title=0&dnt=1`;
      iframe.setAttribute("allow","autoplay; fullscreen; picture-in-picture");
      iframe.setAttribute("allowfullscreen","true");
      wrap.appendChild(iframe);
      wrap.appendChild(overlay);
      wrap.appendChild(wm);
      wrap.appendChild(badge);
      cover.addEventListener("click", e=>{e.preventDefault();e.stopPropagation();hideCover();});
      cover.addEventListener("touchstart", ()=>hideCover(), {passive:true});
      wrap.appendChild(cover);
      container.appendChild(wrap);
      return;
    }

    if(video.type === "mp4"){
      const vEl = document.createElement("video");
      vEl.controls = true;
      vEl.controlsList = "nodownload noremoteplayback noplaybackrate";
      vEl.disablePictureInPicture = true;
      vEl.playsInline = true;
      vEl.preload = "metadata";
      if(video.poster) vEl.poster = video.poster;
      const src = document.createElement("source");
      src.src = video.url;
      src.type = "video/mp4";
      vEl.appendChild(src);

      const ms = {p25:false,p50:false,p75:false,p90:false};
      vEl.addEventListener("play", ()=>hideCover());
      vEl.addEventListener("timeupdate", ()=>{
        if(!vEl.duration) return;
        const p = (vEl.currentTime/vEl.duration)*100;
        prog.textContent = Math.round(p)+"%";
        if(p>=25 && !ms.p25){ms.p25=true;DB.trackActivity({userId:user.id,userName:user.name,type:"video_25",target:lessonTitle,details:{lesson:lessonTitle}});}
        if(p>=50 && !ms.p50){ms.p50=true;DB.trackActivity({userId:user.id,userName:user.name,type:"video_50",target:lessonTitle,details:{lesson:lessonTitle}});}
        if(p>=75 && !ms.p75){ms.p75=true;DB.trackActivity({userId:user.id,userName:user.name,type:"video_75",target:lessonTitle,details:{lesson:lessonTitle}});}
        if(p>=90 && !ms.p90){ms.p90=true;DB.trackActivity({userId:user.id,userName:user.name,type:"video_complete",target:lessonTitle,details:{lesson:lessonTitle}});}
      });
      vEl.addEventListener("contextmenu", e=>e.preventDefault());

      wrap.appendChild(vEl);
      wrap.appendChild(overlay);
      wrap.appendChild(wm);
      wrap.appendChild(badge);
      wrap.appendChild(prog);

      cover.addEventListener("click", e=>{
        e.preventDefault();
        e.stopPropagation();
        hideCover();
        vEl.play().catch(()=>{});
      });
      cover.addEventListener("touchstart", ()=>{
        hideCover();
        vEl.play().catch(()=>{});
      }, {passive:true});

      wrap.appendChild(cover);
      container.appendChild(wrap);
      return;
    }

    if(video.type === "external"){
      const iframe = document.createElement("iframe");
      iframe.src = video.url;
      iframe.setAttribute("allowfullscreen","true");
      iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-presentation allow-popups allow-forms");
      wrap.appendChild(iframe);
      wrap.appendChild(overlay);
      wrap.appendChild(wm);
      wrap.appendChild(badge);
      cover.addEventListener("click", e=>{e.preventDefault();e.stopPropagation();hideCover();});
      cover.addEventListener("touchstart", ()=>hideCover(), {passive:true});
      wrap.appendChild(cover);
      container.appendChild(wrap);
      return;
    }

    wrap.innerHTML = `<div class="vp-error">نوع الفيديو غير مدعوم</div>`;
    container.appendChild(wrap);
  }

  async function load(){
    if(!lessonId){
      app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12">⚠️ لم يتم تحديد الدرس</div><p class="sm muted">يرجى فتح الدرس من داخل المنصة</p><a href="/student/index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
      return;
    }

    const sid = DB.getSessionId();
    if(!sid){
      window.location.replace("/auth/login.html");
      return;
    }

    const user = await DB.getUser(sid);
    if(!user || user.active === false){
      DB.clearSession();
      window.location.replace("/auth/login.html");
      return;
    }

    userAvatar.textContent = user.avatar || "🧑‍🎓";

    // Track lesson view
    const sb = await DB.getClient();

    const { data: lesson, error } = await sb.from("lessons").select("*").eq("id", lessonId).maybeSingle();
    if(error || !lesson){
      app.innerHTML = `<div class="glass" style="padding:40px;text-align:center"><div class="h3 mb12">⚠️ الدرس غير موجود</div><a href="/student/index.html" class="btn btn-p mt16" style="text-decoration:none">العودة للرئيسية</a></div>`;
      return;
    }

    DB.trackActivity({userId:user.id,userName:user.name,type:"lesson_view",target:lesson.title,details:{lesson:lesson.title}});

    // Get unit & subject
    const { data: unit } = await sb.from("units").select("*").eq("id", lesson.unit_id).maybeSingle();
    const { data: subject } = unit ? await sb.from("subjects").select("*").eq("id", unit.subject_id).maybeSingle() : { data: null };

    // Get unit lessons for progress
    const { data: unitLessons } = await sb.from("lessons").select("id").eq("unit_id", lesson.unit_id).eq("published", true);
    const { data: userLessons } = await sb.from("users").select("completed_lessons").eq("id", user.id).maybeSingle();
    const completed = userLessons?.completed_lessons || [];
    const totalUnit = unitLessons?.length || 1;
    const doneUnit = (unitLessons || []).filter(l => completed.includes(l.id)).length;
    const unitPct = Math.round((doneUnit / totalUnit) * 100);

    // Get exams for this lesson
    const { data: allExams } = await sb.from("exams").select("*").eq("published", true);
    const relatedExams = (allExams || []).filter(e => (e.lesson_ids || []).includes(lesson.id));

    const isDone = completed.includes(lesson.id);

    app.innerHTML = `
      <div class="fade-in">
        <div class="flex between center wrap-fl g12 mb16">
          <div>
            <div class="h1 mb6">${esc(lesson.title)}</div>
            <div class="flex wrap-fl g8 xs muted">
              <span>⏱ ${lesson.duration || 15} دقيقة</span>
              <span>•</span>
              <span>+${lesson.xp || 20} XP</span>
              ${subject ? `<span>•</span><span>${esc(subject.name)}</span>` : ''}
              ${unit ? `<span>•</span><span>${esc(unit.name)}</span>` : ''}
            </div>
          </div>
          ${isDone ? '<span class="pill pill-g">✅ مكتمل</span>' : '<span class="pill pill-b">▶️ لم يُكمل</span>'}
        </div>

        <div class="grid-main">
          <div>
            <div class="glass" style="padding:20px">
              ${lesson.desc ? `<div class="sm txt2 mb16">${esc(lesson.desc)}</div>` : ''}
              
              <div id="playerBox" class="mb20"></div>

              ${lesson.summary ? `
                <div class="h4 mb8">📝 ملخص الدرس</div>
                <div class="sm txt2 mb16">${esc(lesson.summary)}</div>
              ` : ''}

              ${(lesson.key_points || []).length > 0 ? `
                <div class="h4 mb8">💡 النقاط المهمة</div>
                <div class="mb16">
                  ${(lesson.key_points || []).map(k => `
                    <div class="kp"><span class="kp-dot">◆</span><span class="sm txt2">${esc(k)}</span></div>
                  `).join('')}
                </div>
              ` : ''}

              ${(lesson.examples || []).length > 0 ? `
                <div class="h4 mb8">🧮 أمثلة محلولة</div>
                <div class="mb16">
                  ${(lesson.examples || []).map(ex => `
                    <div class="example">
                      <div class="example-q"><b>س:</b> ${esc(ex.q)}</div>
                      <div class="example-a"><b>ج:</b> ${esc(ex.a)}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${lesson.notes ? `
                <div class="h4 mb8">📌 ملاحظات</div>
                <div class="sm txt2 mb16">${esc(lesson.notes)}</div>
              ` : ''}

              <div class="flex wrap-fl g8 mt20">
                <button class="btn btn-ok" id="btnDone" ${isDone ? 'disabled' : ''}>
                  ${isDone ? '✅ تم إكمال الدرس' : '✓ فهمت الدرس'}
                </button>
                <button class="btn btn-wr" id="btnReview">🔄 أحتاج مراجعة</button>
              </div>
            </div>
          </div>

          <div>
            <div class="glass mb16" style="padding:16px">
              <div class="h4 mb12">📊 تقدمك في الوحدة</div>
              <div class="flex between center mb8">
                <span class="sm muted">${unit ? esc(unit.name) : ''}</span>
                <span class="sm" style="font-weight:700;color:var(--blue2)">${unitPct}%</span>
              </div>
              <div class="bar"><div class="bar-f" style="width:${unitPct}%"></div></div>
              <div class="xs muted mt8">${doneUnit} من ${totalUnit} دروس</div>
            </div>

            ${relatedExams.length > 0 ? `
              <div class="glass" style="padding:16px">
                <div class="h4 mb12">📝 اختبارات مرتبطة</div>
                ${relatedExams.map(e => `
                  <a href="/student/exam.html?id=${e.id}" class="btn btn-p btn-block mb8" style="text-decoration:none">
                    بدء: ${esc(e.title)}
                  </a>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;

    const watermark = user.phone ? `ID: ${user.phone}` : `ID: ${user.name}`;
    renderPlayer(document.getElementById("playerBox"), lesson.video, lesson.title, watermark, user);

    document.getElementById("btnDone").addEventListener("click", async ()=>{
      if(isDone) return;
      try{
        const newCompleted = [...completed, lesson.id];
        const newXp = (user.xp || 0) + (lesson.xp || 0);
        await DB.updateUser(user.id, { completed_lessons: newCompleted, xp: newXp });
        DB.trackActivity({userId:user.id,userName:user.name,type:"lesson_complete",target:lesson.title,details:{xp:lesson.xp}});
        Swal.fire({icon:'success',title:'أحسنت!',text:`+${lesson.xp} XP`,background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',confirmButtonColor:'#2f7dff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(()=>{
          location.reload();
        });
      }catch(e){
        Swal.fire({icon:'error',title:'خطأ',text:e.message,background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',confirmButtonColor:'#2f7dff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
      }
    });

    document.getElementById("btnReview").addEventListener("click", ()=>{
      Swal.fire({icon:'info',title:'تمت الإضافة',text:'سجلنا هذا الدرس في قائمة المراجعة',background:'linear-gradient(180deg, #151f38, #0b1122)',color:'#e8eefc',confirmButtonColor:'#2f7dff',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    });

    // Protection
    document.addEventListener("contextmenu", e=>e.preventDefault());
    document.addEventListener("keydown", e=>{
      if(e.key === "F12" || (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase()))) e.preventDefault();
    });
  }

  window.openWhatsApp = ()=>{
    window.open("https://wa.me/201550802408?text=" + encodeURIComponent("مرحبًا، أريد الاستفسار عن منصة MISSION EDU"), "_blank");
  };

  window.sendReport = async ()=>{
    const user = await DB.getUser(DB.getSessionId());
    const { value: msg } = await Swal.fire({
      title: '🚨 بلاغ عن مشكلة',
      input: 'textarea',
      inputPlaceholder: 'اكتب رسالتك هنا...',
      showCancelButton: true,
      confirmButtonText: '📤 إرسال',
      cancelButtonText: 'إلغاء',
      confirmButtonColor: '#2f7dff',
      cancelButtonColor: '#64748b',
      inputValidator: v => { if(!v || v.trim().length < 5) return 'يرجى كتابة رسالة واضحة'; },
      customClass: {popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}
    });
    if(msg){
      const sent = await DB.reportIssue({
        userName: user?.name || 'زائر',
        userPhone: (user?.country_code||'+20')+(user?.phone||'—'),
        message: msg
      });
      Swal.fire({icon: sent?'success':'error', title: sent?'✅ تم الإرسال':'❌ فشل', text: sent?'شكرًا لك':'حاول مرة أخرى', background:'linear-gradient(180deg, #151f38, #0b1122)', color:'#e8eefc', confirmButtonColor:'#2f7dff', customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    }
  };

  load();
})();
</script>
