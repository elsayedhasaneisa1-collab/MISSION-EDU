<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04060e">
<title>مشغل الفيديو | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:'Tajawal','Cairo',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage{position:relative;width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;isolation:isolate}
video,iframe.embed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain;pointer-events:none;touch-action:none;-webkit-touch-callout:none}
.watermark{position:absolute;z-index:10;pointer-events:none;color:rgba(255,70,70,.4);font-size:clamp(12px,1.8vw,16px);font-weight:900;padding:4px 8px;direction:ltr;max-width:80%;overflow-wrap:anywhere;letter-spacing:1.2px;font-family:'Cairo',monospace;transition:top 2s ease-in-out,left 2s ease-in-out;opacity:.8}
.controls{position:absolute;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.7) 40%,transparent 100%);padding:16px 20px;direction:ltr;transition:opacity .3s,transform .3s;pointer-events:auto}
.controls.hidden{opacity:0;transform:translateY(20px);pointer-events:none}
.ctrl-row{display:flex;align-items:center;gap:10px;color:#fff}
.ctrl-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s;flex-shrink:0;backdrop-filter:blur(4px);pointer-events:auto}
.ctrl-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.05)}
.ctrl-btn:active{transform:scale(.95)}
.ctrl-btn svg{width:22px;height:22px;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.ctrl-btn.play-pause{width:44px;height:44px;background:rgba(47,125,255,.2);border:1px solid rgba(47,125,255,.4)}
.ctrl-btn.play-pause:hover{background:rgba(47,125,255,.4)}
.ctrl-btn.play-pause svg{width:26px;height:26px}
.seek-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:0;direction:ltr}
.seek-bar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:20px;position:relative;cursor:pointer;transition:.2s;pointer-events:auto}
.seek-bar:hover{height:8px}
.seek-bar .progress{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#2f7dff,#8a5cff);border-radius:20px;transition:width .1s linear;box-shadow:0 0 12px rgba(47,125,255,.6);pointer-events:none}
.seek-bar .progress::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 0 12px rgba(47,125,255,.9);opacity:0;transition:.2s}
.seek-bar:hover .progress::after{opacity:1}
.time{font-size:13px;color:#dfe7f7;font-variant-numeric:tabular-nums;letter-spacing:.5px;font-weight:700;min-width:100px;text-align:center;font-family:'Cairo',monospace}
.volume-wrap{display:flex;align-items:center;gap:8px;position:relative;pointer-events:auto}
.volume-slider{width:0;height:6px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden;transition:width .3s;cursor:pointer;position:relative}
.volume-wrap:hover .volume-slider{width:80px}
.volume-slider .vol-fill{height:100%;background:linear-gradient(90deg,#2f7dff,#8a5cff);border-radius:20px;transition:.1s}
.center-play{position:absolute;inset:0;display:grid;place-items:center;z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
.center-play.show{opacity:1;pointer-events:auto}
.center-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(47,125,255,.9);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 44px rgba(47,125,255,.6),0 0 0 8px rgba(47,125,255,.15);transition:.25s;backdrop-filter:blur(8px);pointer-events:auto}
.center-play-btn:hover{transform:scale(1.1)}
.center-play-btn svg{width:36px;height:36px;margin-left:4px;pointer-events:none}
.flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);z-index:18;pointer-events:none;opacity:0;transition:.4s cubic-bezier(.2,.8,.3,1)}
.flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.flash svg{width:70px;height:70px;color:#fff;filter:drop-shadow(0 10px 30px rgba(0,0,0,.9))}
.toast-msg{position:absolute;top:30px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(15,20,30,.92);color:#fff;padding:12px 24px;border-radius:40px;font-size:14px;font-weight:700;border:1px solid rgba(47,125,255,.4);backdrop-filter:blur(10px);z-index:30;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90%;text-align:center}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
.security-badge{position:absolute;top:16px;right:16px;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:40px;background:rgba(10,15,28,.85);border:1px solid rgba(34,197,94,.4);color:#6ee7a0;font-size:12px;font-weight:700;backdrop-filter:blur(10px);pointer-events:none;transition:opacity .3s}
.security-badge.hidden{opacity:0}
.security-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.error-overlay{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:30px;text-align:center}
.error-overlay .icon{font-size:64px;margin-bottom:16px;opacity:.6}
.error-overlay .title{font-size:18px;font-weight:900;color:#fca5a5;margin-bottom:8px}
.error-overlay .desc{font-size:13px;color:#7f93b8;line-height:1.6;max-width:400px}
.external-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:22;background:rgba(15,20,30,.95);padding:20px 28px;border-radius:16px;border:1px solid rgba(47,125,255,.4);text-align:center;max-width:90%;backdrop-filter:blur(10px)}
.external-hint .title{font-size:15px;font-weight:800;color:#7db6ff;margin-bottom:6px}
.external-hint .sub{font-size:12px;color:#7f93b8;line-height:1.6}
@media(max-width:768px){
.controls{padding:12px 14px}
.ctrl-btn{width:36px;height:36px}
.ctrl-btn svg{width:20px;height:20px}
.ctrl-btn.play-pause{width:40px;height:40px}
.time{font-size:11px;min-width:85px}
.volume-slider{display:none}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div id="videoRoot"></div>
  <div class="watermark" id="watermark"></div>
  <div class="security-badge" id="securityBadge">محمي</div>
  <div class="center-play show" id="centerPlay">
    <button class="center-play-btn" id="centerPlayBtn" aria-label="تشغيل">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="flash" id="flash"></div>
  <div class="toast-msg" id="toastMsg"></div>
  <div class="controls" id="controls">
    <div class="seek-wrap">
      <div class="seek-bar" id="seekBar">
        <div class="progress" id="progressBar" style="width:0%"></div>
      </div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn play-pause" id="btnPlay" aria-label="تشغيل">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnRewind" aria-label="رجوع 10 ثواني">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="ctrl-btn" id="btnForward" aria-label="تقديم 10 ثواني">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <div class="volume-wrap">
        <button class="ctrl-btn" id="btnMute" aria-label="كتم الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="volIcon"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <div class="volume-slider" id="volumeSlider">
          <div class="vol-fill" id="volFill" style="width:100%"></div>
        </div>
      </div>
      <div class="time" id="timeDisplay">0:00 / 0:00</div>
      <div style="flex:1"></div>
      <button class="ctrl-btn" id="btnFullscreen" aria-label="ملء الشاشة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>
</main>
<script>
(function(){
"use strict";

const params = new URLSearchParams(location.search);
let type = (params.get('type') || 'youtube').toLowerCase().trim();
const rawUrl = params.get('url') || '';
const title = params.get('title') || 'فيديو الدرس';
const wm = params.get('wm') || 'طالب';
document.title = title + ' | MISSION EDU';

const root = document.getElementById('videoRoot');
const stage = document.getElementById('stage');
const mark = document.getElementById('watermark');
const centerPlay = document.getElementById('centerPlay');
const centerPlayBtn = document.getElementById('centerPlayBtn');
const controls = document.getElementById('controls');
const btnPlay = document.getElementById('btnPlay');
const playIcon = document.getElementById('playIcon');
const btnRewind = document.getElementById('btnRewind');
const btnForward = document.getElementById('btnForward');
const btnMute = document.getElementById('btnMute');
const volIcon = document.getElementById('volIcon');
const volumeSlider = document.getElementById('volumeSlider');
const volFill = document.getElementById('volFill');
const seekBar = document.getElementById('seekBar');
const progressBar = document.getElementById('progressBar');
const timeDisplay = document.getElementById('timeDisplay');
const btnFullscreen = document.getElementById('btnFullscreen');
const flash = document.getElementById('flash');
const toastMsg = document.getElementById('toastMsg');
const securityBadge = document.getElementById('securityBadge');

const icons = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',
  volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
  volumeLow: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>'
};

let player = null;
let playerType = null;
let ytPlayer = null;
let isPlaying = false;
let duration = 0;
let currentTime = 0;
let volume = 1;
let muted = false;
let controlsTimeout = null;
let wmInterval = null;
let progressInterval = null;
let lastTapTime = 0;
let tapTimer = null;
let destroyed = false;

mark.textContent = wm;

function setIcon(el, svgPath) { if (el) el.innerHTML = svgPath; }

function showToast(msg) {
  toastMsg.textContent = msg;
  toastMsg.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastMsg.classList.remove('show'), 2200);
}

function flashIcon(svgPath) {
  flash.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor">' + svgPath + '</svg>';
  flash.classList.add('show');
  clearTimeout(flashIcon._t);
  flashIcon._t = setTimeout(() => flash.classList.remove('show'), 600);
}

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  timeDisplay.textContent = fmtTime(currentTime) + ' / ' + fmtTime(duration);
  const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
  progressBar.style.width = pct + '%';
}

function showControls() {
  controls.classList.remove('hidden');
  securityBadge.classList.remove('hidden');
  clearTimeout(controlsTimeout);
  if (isPlaying) {
    controlsTimeout = setTimeout(() => {
      controls.classList.add('hidden');
      securityBadge.classList.add('hidden');
    }, 5000);
  }
}

function toggleControls() {
  if (controls.classList.contains('hidden')) showControls();
  else {
    controls.classList.add('hidden');
    securityBadge.classList.add('hidden');
  }
}

function updatePlayUI() {
  if (isPlaying) {
    setIcon(playIcon, icons.pause);
    centerPlay.classList.remove('show');
    showControls();
  } else {
    setIcon(playIcon, icons.play);
    centerPlay.classList.add('show');
    controls.classList.remove('hidden');
    securityBadge.classList.remove('hidden');
    clearTimeout(controlsTimeout);
  }
}

function togglePlay() {
  if (!player) return;
  if (playerType === 'youtube' && ytPlayer) {
    try {
      if (isPlaying) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    } catch (e) {}
  } else if (playerType === 'native' && player && player.play && player.pause) {
    if (isPlaying) player.pause();
    else player.play().catch(() => {});
  } else if (playerType === 'iframe') {
    showToast('استخدم أزرار المشغل الداخلية');
  }
}

function toggleMute() {
  if (playerType === 'youtube' && ytPlayer) {
    try {
      if (muted) { ytPlayer.unMute(); ytPlayer.setVolume(volume * 100); muted = false; }
      else { ytPlayer.mute(); muted = true; }
    } catch (e) {}
  } else if (playerType === 'native' && player) {
    player.muted = !muted;
    muted = !muted;
    if (!muted) player.volume = volume;
  }
  setIcon(volIcon, muted || volume === 0 ? icons.mute : volume < 0.5 ? icons.volumeLow : icons.volume);
}

function setVolume(v) {
  volume = Math.max(0, Math.min(1, v));
  volFill.style.width = (volume * 100) + '%';
  muted = volume === 0;
  setIcon(volIcon, muted || volume === 0 ? icons.mute : volume < 0.5 ? icons.volumeLow : icons.volume);
  if (playerType === 'youtube' && ytPlayer) {
    try {
      ytPlayer.setVolume(volume * 100);
      if (muted) ytPlayer.mute();
      else ytPlayer.unMute();
    } catch (e) {}
  } else if (playerType === 'native' && player) {
    player.volume = volume;
    player.muted = muted;
  }
}

function seekTo(seconds) {
  if (!isFinite(duration) || duration <= 0) return;
  const t = Math.max(0, Math.min(duration, seconds));
  if (playerType === 'youtube' && ytPlayer) {
    try { ytPlayer.seekTo(t, true); } catch (e) {}
  } else if (playerType === 'native' && player) {
    player.currentTime = t;
  } else if (playerType === 'iframe') {
    showToast('لا يمكن التحكم في التقدم لهذا النوع');
    return;
  }
  currentTime = t;
  updateTime();
}

function enterFullscreen() {
  const el = stage;
  try {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  } catch (e) {}
}

function moveWatermark() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const mw = mark.offsetWidth || 100;
  const mh = mark.offsetHeight || 20;
  const maxX = Math.max(10, w - mw - 20);
  const maxY = Math.max(10, h - mh - 80);
  mark.style.left = (Math.floor(Math.random() * maxX) + 10) + 'px';
  mark.style.top = (Math.floor(Math.random() * maxY) + 10) + 'px';
}

function startWatermark() {
  moveWatermark();
  wmInterval = setInterval(moveWatermark, 6000);
}

function ytId(u) {
  if (!u) return '';
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

function vimeoId(u) {
  if (!u) return '';
  const m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : '';
}

function showError(titleText, descText) {
  const el = document.createElement('div');
  el.className = 'error-overlay';
  el.innerHTML = '<div class="icon">⚠️</div><div class="title">' + titleText + '</div><div class="desc">' + (descText || '') + '</div>';
  stage.appendChild(el);
  controls.style.display = 'none';
  centerPlay.style.display = 'none';
  securityBadge.style.display = 'none';
}

function loadYouTube() {
  const id = ytId(rawUrl);
  if (!id) return showError('رابط YouTube غير صالح', 'تأكد من صيغة الرابط');
  playerType = 'youtube';

  if (window.YT && window.YT.Player) {
    initYT(id);
    return;
  }
  window.onYouTubeIframeAPIReady = function() { initYT(id); };
  const existing = document.querySelector('script[src*="youtube.com/iframe_api"]');
  if (!existing) {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
}

function initYT(videoId) {
  if (destroyed) return;
  const container = document.createElement('div');
  container.id = 'ytPlayerDiv';
  container.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
  root.appendChild(container);

  try {
    ytPlayer = new window.YT.Player('ytPlayerDiv', {
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0,
        iv_load_policy: 3,
        disablekb: 1,
        fs: 0,
        playsinline: 1,
        cc_load_policy: 0,
        cc_lang_pref: 'ar',
        origin: window.location.origin
      },
      events: {
        onReady: (e) => {
          player = ytPlayer;
          duration = e.target.getDuration() || 0;
          e.target.setVolume(volume * 100);
          
          try {
            e.target.unloadModule("captions");
            e.target.unloadModule("cc");
          } catch(err) {}

          e.target.playVideo();
          updateTime();
          startProgressLoop();
        },
        onStateChange: (e) => {
          if (e.data === window.YT.PlayerState.PLAYING) {
            isPlaying = true;
            updatePlayUI();
            duration = ytPlayer.getDuration() || duration;
            try {
              ytPlayer.unloadModule("captions");
              ytPlayer.unloadModule("cc");
            } catch(err) {}
          } else if (e.data === window.YT.PlayerState.PAUSED) {
            isPlaying = false;
            updatePlayUI();
          } else if (e.data === window.YT.PlayerState.ENDED) {
            isPlaying = false;
            updatePlayUI();
            showToast('انتهى الفيديو');
          }
        },
        onError: (e) => {
          showError('تعذر تشغيل الفيديو', 'الكود: ' + (e.data || 'unknown'));
        }
      }
    });
  } catch (e) {
    showError('فشل تحميل YouTube', 'حاول تحديث الصفحة');
  }
}

function loadNative(videoUrl) {
  playerType = 'native';
  const v = document.createElement('video');
  v.controls = false;
  v.autoplay = true;
  v.playsInline = true;
  v.preload = 'auto';
  v.crossOrigin = 'anonymous';
  v.setAttribute('disablePictureInPicture', '');
  v.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback noplaybackrate');
  v.src = videoUrl;

  v.addEventListener('loadedmetadata', () => {
    duration = v.duration || 0;
    updateTime();
    startProgressLoop();
  });
  v.addEventListener('play', () => { isPlaying = true; updatePlayUI(); });
  v.addEventListener('pause', () => { isPlaying = false; updatePlayUI(); });
  v.addEventListener('ended', () => { isPlaying = false; updatePlayUI(); showToast('انتهى الفيديو'); });
  v.addEventListener('timeupdate', () => { currentTime = v.currentTime; updateTime(); });
  v.addEventListener('error', () => {
    const err = v.error;
    let msg = 'تعذر تحميل الفيديو';
    if (err && err.code === 4) msg = 'صيغة الفيديو غير مدعومة أو الرابط غير صالح';
    else if (err && err.code === 2) msg = 'خطأ في الشبكة أثناء تحميل الفيديو';
    showError('خطأ في التشغيل', msg);
  });

  root.appendChild(v);
  player = v;
  v.play().catch(() => {});
  setVolume(volume);
}

function loadVimeo() {
  const id = vimeoId(rawUrl);
  if (!id) return showError('رابط Vimeo غير صالح', 'تأكد من صيغة الرابط');
  playerType = 'iframe';
  const f = document.createElement('iframe');
  f.className = 'embed';
  f.src = 'https://player.vimeo.com/video/' + id + '?autoplay=1&controls=0&title=0&byline=0&portrait=0&dnt=1&transparent=0';
  f.allow = 'autoplay; fullscreen; picture-in-picture';
  f.allowFullscreen = true;
  root.appendChild(f);
  player = { play: () => {}, pause: () => {}, currentTime: 0 };
  isPlaying = true;
  updatePlayUI();
  showExternalHint('فيديو Vimeo — استخدم عناصر التحكم الخاصة به');
}

function loadExternal() {
  playerType = 'iframe';
  const f = document.createElement('iframe');
  f.className = 'embed';
  f.src = rawUrl;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.sandbox = 'allow-scripts allow-same-origin allow-presentation allow-popups';
  root.appendChild(f);
  player = { play: () => {}, pause: () => {}, currentTime: 0 };
  isPlaying = false;
  updatePlayUI();
  showExternalHint('فيديو خارجي — استخدم عناصر التحكم الخاصة به');
}

function showExternalHint(text) {
  const existing = document.querySelector('.external-hint');
  if (existing) existing.remove();
  const hint = document.createElement('div');
  hint.className = 'external-hint';
  hint.innerHTML = '<div class="title">ℹ️ تنبيه</div><div class="sub">' + text + '</div>';
  stage.appendChild(hint);
  setTimeout(() => { if (hint.parentNode) hint.remove(); }, 5000);
}

function startProgressLoop() {
  if (progressInterval) clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (destroyed) return;
    if (playerType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
      try {
        currentTime = ytPlayer.getCurrentTime() || 0;
        duration = ytPlayer.getDuration() || duration;
        updateTime();
      } catch (e) {}
    } else if (playerType === 'native' && player) {
      currentTime = player.currentTime || 0;
      duration = player.duration || duration;
      updateTime();
    }
  }, 200);
}

btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); showControls(); });
centerPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
btnMute.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); showControls(); });
btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); enterFullscreen(); });

btnRewind.addEventListener('click', (e) => {
  e.stopPropagation();
  seekTo(currentTime - 10);
  flashIcon('<polyline points="1 4 1 10 7 10" fill="none" stroke="white" stroke-width="3"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" fill="none" stroke="white" stroke-width="3"/>');
  showControls();
});

btnForward.addEventListener('click', (e) => {
  e.stopPropagation();
  seekTo(currentTime + 10);
  flashIcon('<polyline points="23 4 23 10 17 10" fill="none" stroke="white" stroke-width="3"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" fill="none" stroke="white" stroke-width="3"/>');
  showControls();
});

seekBar.addEventListener('click', (e) => {
  e.stopPropagation();
  if (playerType === 'iframe') { showToast('لا يمكن التحكم في التقدم لهذا النوع'); return; }
  const rect = seekBar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  seekTo(pct * duration);
  showControls();
});

volumeSlider.addEventListener('click', (e) => {
  e.stopPropagation();
  const rect = volumeSlider.getBoundingClientRect();
  setVolume(Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)));
  showControls();
});

stage.addEventListener('click', (e) => {
  if (e.target.closest('.controls') || e.target.closest('.center-play') || e.target.closest('.error-overlay')) return;
  const now = Date.now();
  if (now - lastTapTime < 280) {
    clearTimeout(tapTimer);
    toggleControls();
    lastTapTime = 0;
    return;
  }
  lastTapTime = now;
  tapTimer = setTimeout(() => {
    if (controls.classList.contains('hidden')) showControls();
    else toggleControls();
  }, 280);
});

document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dragstart', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => {
  if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault();
});

document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(k.toUpperCase())) ||
      (e.ctrlKey && ['U', 'S', 'P'].includes(k.toUpperCase()))) {
    e.preventDefault();
    return false;
  }
  if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); togglePlay(); showControls(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); seekTo(currentTime - 5); showControls(); }
  else if (k === 'ArrowRight') { e.preventDefault(); seekTo(currentTime + 5); showControls(); }
  else if (k === 'ArrowUp') { e.preventDefault(); setVolume(volume + 0.1); showControls(); }
  else if (k === 'ArrowDown') { e.preventDefault(); setVolume(volume - 0.1); showControls(); }
  else if (k === 'm' || k === 'M') { toggleMute(); showControls(); }
  else if (k === 'f' || k === 'F') { enterFullscreen(); }
}, true);

window.addEventListener('beforeunload', () => {
  destroyed = true;
  if (progressInterval) clearInterval(progressInterval);
  if (wmInterval) clearInterval(wmInterval);
  try {
    if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    if (playerType === 'native' && player && player.pause) player.pause();
  } catch (e) {}
});

function boot() {
  if (!rawUrl) {
    showError('لا يوجد رابط للفيديو', 'لم يتم استلام رابط صالح');
    return;
  }

  const isYouTubeLink = /youtu\.?be/.test(rawUrl);
  const isVimeoLink = /vimeo\.com/.test(rawUrl);

  if (isYouTubeLink) type = 'youtube';
  else if (isVimeoLink) type = 'vimeo';

  if (type === 'youtube') loadYouTube();
  else if (type === 'vimeo') loadVimeo();
  else if (type === 'mp4' || /\.mp4(?:$|\?)/i.test(rawUrl)) loadNative(rawUrl);
  else if (type === 'webm' || /\.webm(?:$|\?)/i.test(rawUrl)) loadNative(rawUrl);
  else if (type === 'ogg' || /\.ogg(?:$|\?)/i.test(rawUrl)) loadNative(rawUrl);
  else if (type === 'iframe' || type === 'external') loadExternal();
  else loadExternal();

  startWatermark();
  showControls();
}

boot();
})();
</script>
</body>
</html>
