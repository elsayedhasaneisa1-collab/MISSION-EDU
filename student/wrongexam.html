<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04060e">
<title>امتحان أخطائي | MISSION EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060e;--txt:#e8eefc;--muted:#91a3c7;--border:rgba(90,140,230,.22);--blue:#2f7dff;--violet:#8b5cf6;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 90% 0%,rgba(47,125,255,.2),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(139,92,246,.14),transparent 60%),var(--bg);color:var(--txt);font-family:'Tajawal','Cairo',sans-serif;line-height:1.8;padding:18px}.wrap{max-width:850px;margin:auto}.card{background:linear-gradient(180deg,rgba(21,31,56,.88),rgba(11,17,34,.86));border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 18px 50px #0005}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:20px;font-weight:900}.grad{background:linear-gradient(100deg,#5aa9ff,#a78bfa,#22d3ee);background-clip:text;-webkit-background-clip:text;color:transparent}.pill{border:1px solid var(--border);background:#2f7dff1c;border-radius:30px;padding:5px 12px;font-weight:800}.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:#7db6ff}.q{background:#ffffff06;border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}.muted{color:var(--muted);font-size:13px}.question{font-size:17px;font-weight:800;margin:8px 0 14px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{width:100%;text-align:right;border:1px solid var(--border);border-radius:12px;background:#ffffff05;color:var(--txt);padding:12px;font:inherit;cursor:pointer}.option.selected{border-color:#5aa9ff;background:#2f7dff2e}.option:disabled{cursor:default}.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,var(--violet),var(--blue));color:white;font:inherit;font-weight:900;cursor:pointer}.btn.secondary{background:#ffffff0a;border:1px solid var(--border)}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.feedback{padding:12px;border-radius:12px;background:#ffffff08;margin-top:12px}.ok{color:#6ee7a0}.bad{color:#fca5a5}.empty{text-align:center;padding:36px 12px}.small{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,15,.82);backdrop-filter:blur(8px)}.modal-box{width:min(100%,420px);text-align:center;padding:26px 22px;border:1px solid rgba(90,140,230,.4);border-radius:22px;background:linear-gradient(160deg,#151f38,#0b1122);box-shadow:0 24px 80px #0009}.modal-icon{font-size:46px;line-height:1.4}.modal-box h2{margin:8px 0;font-size:23px}.modal-box p{color:var(--muted);margin:8px 0 20px}.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.done-banner{text-align:center;padding:18px 12px 8px}.done-banner .icon{font-size:42px}.done-banner h2{margin:4px 0;color:#a5f3fc}.done-banner p{color:var(--muted);margin:0 0 12px}@media(max-width:600px){body{padding:10px}.card{padding:15px}.options{grid-template-columns:1fr}.question{font-size:16px}}
</style></head><body><main class="wrap"><header class="card top"><div><div class="brand"><span class="grad">MISSION EDU</span></div><div class="muted">🎯 امتحان من أخطائك السابقة</div></div><div class="top"><span class="pill" id="count">0 سؤال</span><span class="timer" id="timer">00:00</span></div></header><section id="content" class="card"><div class="empty">جاري تحميل الامتحان...</div></section><div class="small" style="text-align:center;margin:18px 0">تدريب شخصي فقط • بدون XP • لا يتم حفظ النتيجة في قاعدة البيانات</div></main>
<script>
(()=>{
const SESSION_KEY='mission_edu_wrong_practice_session', ANSWERS_KEY='mission_edu_wrong_practice_answers';
const content=document.getElementById('content'),timerEl=document.getElementById('timer'),countEl=document.getElementById('count');
let session=null,answers={},finished=false,remaining=0,tick=null;
try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');answers=JSON.parse(localStorage.getItem(ANSWERS_KEY)||'{}')||{}}catch(e){}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=()=>session&&Array.isArray(session.questions)?session.questions:[];
const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function persist(){try{localStorage.setItem(ANSWERS_KEY,JSON.stringify(answers));}catch(e){}}
function finish(auto=false){if(finished)return;finished=true;if(tick)clearInterval(tick);render();if(auto){const note=document.createElement('div');note.className='modal';note.innerHTML='<div class="modal-box"><div class="modal-icon">⏰</div><h2>انتهى الوقت!</h2><p>الوقت خلص، وده وقت مراجعة إجاباتك والتعلّم من أخطائك. بالتوفيق في التحدي الجاي 💙</p><button class="btn" id="timeOk">عرض النتيجة</button></div>';document.body.appendChild(note);document.getElementById('timeOk').onclick=()=>note.remove();}}
function showSubmitModal(){
 if(document.getElementById('submitModal'))return;
 const qs=questions(),answered=qs.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==null&&answers[q.id]!=='').length,unanswered=qs.length-answered;
 const modal=document.createElement('div');modal.className='modal';modal.id='submitModal';modal.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="submitTitle"><div class="modal-icon">🚀</div><h2 id="submitTitle">جاهز تسلّم التحدي؟</h2><p>${unanswered?`لسه فاضلك <strong style="color:#fbbf24">${unanswered} سؤال</strong> من غير إجابة. تقدر تراجعهم قبل التسليم.`:'برافو عليك! جاوبت على كل الأسئلة. سلّم وشوف نتيجتك ومراجعة الإجابات.'}<br>خد لحظة وتأكد إنك جاهز 💙</p><div class="modal-actions"><button class="btn" id="confirmSubmit">تسليم الامتحان ✅</button><button class="btn secondary" id="cancelSubmit">هراجع تاني</button></div></div>`;
 document.body.appendChild(modal);
 document.getElementById('confirmSubmit').onclick=()=>{modal.remove();finish(false)};
 document.getElementById('cancelSubmit').onclick=()=>modal.remove();
 modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
}
function startTimer(){if(!session)return;remaining=Math.max(0,Math.ceil((Number(session.endsAt)||Date.now())-Date.now())/1000);remaining=Math.ceil(remaining);timerEl.textContent=fmt(remaining);tick=setInterval(()=>{remaining=Math.max(0,Math.ceil((Number(session.endsAt)-Date.now())/1000));timerEl.textContent=fmt(remaining);if(remaining<=0)finish(true)},500);}
function render(){if(!session||!questions().length){content.innerHTML='<div class="empty"><div style="font-size:42px">📝</div><h2>مفيش امتحان مفتوح</h2><p class="muted">ارجع لدفتر أخطائي وابدأ امتحان جديد.</p><button class="btn" id="returnHome">العودة للمنصة</button></div>';const home=document.getElementById('returnHome');if(home)home.onclick=()=>location.href='/student/index.html';countEl.textContent='0 سؤال';timerEl.textContent='00:00';return}
const qs=questions();countEl.textContent=qs.length+' سؤال';const score=qs.filter(q=>answers[q.id]===((q.correct||[])[0])).length;
content.innerHTML=(finished?`<div class="done-banner"><div class="icon">🏆</div><h2>عاش! خلّصت التحدي</h2><p>راجع إجاباتك واتعلّم من كل غلطة، خطوة جديدة ناحية التفوق 💙</p><span class="pill">نتيجتك: ${score} من ${qs.length}</span></div>`:`<div class="top"><div><h2 style="margin:0">🧠 امتحان أخطائي</h2><div class="muted">اختار الإجابة الأنسب لكل سؤال.</div></div></div>`)+qs.map((q,i)=>{const correct=(q.correct||[])[0];const opts=Object.entries(q.options||{});return `<article class="q"><div class="muted">السؤال ${i+1} من ${qs.length}</div><div class="question">${esc(q.text)}</div><div class="options">${opts.map(([key,val])=>`<button class="option ${answers[q.id]===key?'selected':''}" data-q="${esc(q.id)}" data-key="${esc(key)}" ${finished?'disabled':''}>${answers[q.id]===key?'🔘':'⚪'} ${esc(val)}</button>`).join('')}</div>${finished?`<div class="feedback"><div class="${answers[q.id]===correct?'ok':'bad'}">الإجابة الصحيحة: ${esc((q.options||{})[correct]||'—')}</div>${q.explanation?`<div class="muted" style="margin-top:5px">💡 ${esc(q.explanation)}</div>`:''}</div>`:''}</article>`}).join('')+(!finished?'<div class="btnrow"><button class="btn" id="submit">تسليم الامتحان ✅</button><button class="btn secondary" id="back">العودة لدفتر أخطائي</button></div>':'<div class="btnrow"><button class="btn" id="again">إنهاء والعودة لدفتر أخطائي</button></div>');
content.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{answers[b.dataset.q]=b.dataset.key;persist();render()}));const sub=document.getElementById('submit');if(sub)sub.onclick=()=>showSubmitModal();const back=document.getElementById('back');if(back)back.onclick=()=>location.href='/student/index.html';const again=document.getElementById('again');if(again)again.onclick=()=>{try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(ANSWERS_KEY)}catch(e){}location.href='/student/index.html'};
}
if(session){render();if(Number(session.endsAt)<=Date.now())finish(true);else if(!finished)startTimer()}else render();
})();
</script></body></html>
