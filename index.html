<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MISSION EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060e;--blue:#2f7dff;--txt:#e8eefc;--muted:#7f93b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:20px}
.logo{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 14px 44px rgba(47,125,255,.5);animation:pulse 2s ease-in-out infinite;margin:0 auto}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.spinner{width:44px;height:44px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:24px auto 0}
.txt{margin-top:20px;font-size:20px;font-weight:900;letter-spacing:-.5px}
.sub{margin-top:8px;color:var(--muted);font-size:13px}
.err{margin-top:20px;padding:14px 20px;border-radius:14px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.32);color:#fca5a5;font-size:13px;font-weight:700;max-width:380px;margin-inline:auto}
</style>
</head>
<body>
<div style="text-align:center;animation:fu .5s">
  <div class="logo">🚀</div>
  <div class="txt">MISSION EDU</div>
  <div class="sub" id="status">جارٍ التحقق من الحساب...</div>
  <div class="spinner" id="loader"></div>
</div>
<script src="db.js"></script>
<script>
(async ()=>{
  const DB = window.MissionDB;
  const statusEl = document.getElementById('status');
  const loaderEl = document.getElementById('loader');
  try{
    const sid = DB.getSessionId();
    if (!sid){
      window.location.replace('auth/login.html');
      return;
    }
    const user = await DB.getUser(sid);
    if (!user || user.active === false){
      DB.clearSession();
      window.location.replace('auth/login.html');
      return;
    }
    statusEl.textContent = user.role === 'admin' ? 'جارٍ فتح لوحة الإدارة...' : 'جارٍ فتح لوحة الطالب...';
    setTimeout(()=>DB.redirectByRole(user), 300);
  }catch(e){
    loaderEl.style.display = 'none';
    statusEl.innerHTML = '<div class="err">تعذّر الاتصال بالخادم. جارٍ إعادة التوجيه...</div>';
    setTimeout(()=>{ window.location.replace('auth/login.html'); }, 1500);
  }
})();
</script>
</body>
</html>
