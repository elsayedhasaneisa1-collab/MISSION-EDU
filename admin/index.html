<style>
:root{
  --bg:#0a0805;
  --gold:#D4AF37;
  --gold-l:#FFD700;
  --gold-soft:#F5E6A8;
  --border:rgba(212,175,55,.18);
  --border2:rgba(212,175,55,.38);
  --txt:#f7f0dd;
  --txt2:#d4c79a;
  --muted:#8a7d55;
  --green:#22c55e;
  --red:#ef4444;
  --r:20px;
  --rs:13px;
  --sh:0 18px 50px rgba(0,0,0,.65);
  --sh-gold:0 10px 30px rgba(212,175,55,.35);
  --sh-gold-h:0 14px 40px rgba(212,175,55,.55);
  --grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(212,175,55,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(184,134,11,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(212,175,55,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#D4AF37,#8B6914);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(28,22,12,.78),rgba(15,12,7,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass-s{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(15,12,7,.96),rgba(10,8,5,.92));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ladybugWiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.05)}75%{transform:rotate(14deg) scale(1.05)}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 8px 26px rgba(212,175,55,.55)}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,#FFD700,#FFF3B0 45%,#D4AF37 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s linear infinite}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(212,175,55,.10);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(212,175,55,.24),rgba(212,175,55,.03));color:#FFF3B0}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#FFD700,#D4AF37)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:rgba(10,8,5,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:rgba(28,22,12,.7);border:1px solid var(--border);border-radius:14px;padding:8px 14px}
.search input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn-p{background:var(--grad-gold);color:#1a1206;box-shadow:0 10px 28px rgba(212,175,55,.42)}
.btn-p:hover{box-shadow:var(--sh-gold-h);transform:translateY(-2px)}
.btn-s{background:rgba(212,175,55,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:rgba(212,175,55,.16);color:#FFF3B0}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h1{font-size:clamp(21px,3.2vw,30px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#FFD700,#FFF3B0 50%,#D4AF37 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 5s linear infinite}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}

.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}

.bar{height:9px;border-radius:20px;background:rgba(212,175,55,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(15,12,7,.78);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
select.input{cursor:pointer;appearance:none;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
textarea.input{resize:vertical;min-height:80px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:var(--border);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--gold);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(212,175,55,.08);vertical-align:middle}
.sx{overflow-x:auto}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--grad-gold);color:#1a1206;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(212,175,55,.08);border:1px solid var(--border);font-size:16px;color:var(--gold);position:relative}
.modal-bg{position:fixed;inset:0;background:rgba(5,3,1,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{padding:24px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.12) 50%,rgba(255,215,0,.06));border:1px solid var(--border2)}
.act-row{display:flex;gap:12px;padding:12px;border-radius:13px;background:rgba(212,175,55,.04);border:1px solid var(--border);align-items:flex-start}
.act-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:rgba(212,175,55,.15);color:var(--gold)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(212,175,55,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#FFD700,#D4AF37);color:#1a1206}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:rgba(212,175,55,.10);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(28,22,12,.98),rgba(15,12,7,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(212,175,55,.08);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.info .toast-ico{background:rgba(212,175,55,.20);color:#FFD700}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid rgba(212,175,55,.14);flex-wrap:wrap}
.dev-btn,.report-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.32s;border:1px solid;font-family:inherit}
.dev-btn{background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.18));border-color:rgba(212,175,55,.4);color:var(--txt);position:relative;overflow:hidden}
.dev-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,237,78,.28),transparent);transform:translateX(-100%);transition:transform .7s}
.dev-btn:hover::before{transform:translateX(100%)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(212,175,55,.32),rgba(184,134,11,.32));border-color:#FFD700;transform:translateY(-2px);box-shadow:var(--sh-gold)}
.dev-name b{background:linear-gradient(90deg,#FFD700,#FFF3B0,#D4AF37,#FFD700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900}

/* ═══ 🐞 زرار البلاغ — دعسوقة ═══ */
.report-btn{
  background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(200,50,50,.10));
  border-color:rgba(239,68,68,.4);
  color:#fca5a5;
  position:relative;
  overflow:hidden;

.report-btn::before{
  content:"";

.report-btn:hover::before{transform:translateX(100%)}
.report-btn:hover{
  background:linear-gradient(135deg,rgba(239,68,68,.30),rgba(200,50,50,.20));
  border-color:#ef4444;
  color:#fff;
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(239,68,68,.4);
}
.report-btn i.fa-ladybug,
.report-btn i.fa-bug{
  font-size:15px;
  transition:transform .4s cubic-bezier(.2,.8,.3,1);
  display:inline-block;

.swal-custom-popup{border:1px solid rgba(212,175,55,.4) !important;border-radius:22px !important;box-shadow:0 24px 70px rgba(0,0,0,.85) !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-title{color:#f7f0dd !important;font-size:20px !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-confirm{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important;background:linear-gradient(135deg,#FFD700,#D4AF37) !important;color:#1a1206 !important}

  .sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;box-shadow:-20px 0 60px rgba(0,0,0,.75)}
  .sidebar.open{transform:translateX(0)!important}
  .mbar{display:flex}
  .content{padding:14px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}

}
html,body{overflow-x:hidden;max-width:100%;width:100%}

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<script src="/db.js"></script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

/* ═══ أصوات ═══ */
let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx){try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  return _audioCtx;
}
function beep(f,d,t='sine',v=0.15){
  try{
    const ctx=getAudioCtx();
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=t;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(v,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d/1000);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+d/1000);
  }catch(e){}
}
function playSound(type='notify'){
  switch(type){
    case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;
    case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;
    case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;
    default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100);
  }
}

/* ═══ Toast ═══ */
const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
    if(type==='ok') playSound('success');
    else if(type==='err') playSound('err');
    else if(type==='warn') playSound('warn');
    else playSound('notify');
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);
  const [progress,setProgress]=useState(100);
  useEffect(()=>{
    const s=Date.now();
    const t=setInterval(()=>{
      const p=Math.max(0,100-((Date.now()-s)/data.duration)*100);
      setProgress(p);
      if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}
    },40);
    return()=>clearInterval(t);
  },[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">
      {data.title&&<div className="toast-title">{data.title}</div>}
      <div className="toast-msg">{data.msg}</div>
    </div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

/* ═══ App Context ═══ */
const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      await DB.cleanupExpiredPolls();
      const data=await DB.loadAll();
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('/auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}
        if(u.role!=='admin'){window.location.replace('/student/index.html');return;}
        setCurrentUser(u);
        await reload();
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  const logout=useCallback(()=>{
    Swal.fire({
      title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',
      showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',
      confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    }).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('/auth/login.html');}});
  },[]);

  const save=useCallback(async (table,item)=>{
    const saved=await DB.save(table,item);
    await reload();
    return saved;
  },[reload]);
  const remove=useCallback(async (table,id)=>{
    await DB.remove(table,id);
    await reload();
  },[reload]);
  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  return <AppCtx.Provider value={{
    db,currentUser,loading,logout,reload,save,remove,getLevel,toast,playSound,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

/* ═══ CRUD ═══ */
function Crud({title,collection,defaultItem,fields,columns}){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [busy,setBusy]=useState(false);
  const items=[...(app.db[collection]||[])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const openNew=()=>{setForm(defaultItem());setEditing('new');};
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};
  const save=async ()=>{
    setBusy(true);
    try{
      await app.save(collection,form);
      app.toast.ok(editing==='new'?'تمت الإضافة':'تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    const r=await Swal.fire({
      title:'تأكيد الحذف',text:'سيتم حذف هذا العنصر نهائيًا',icon:'warning',
      showCancelButton:true,confirmButtonText:'نعم، احذف',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{await app.remove(collection,id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="flex between center mb16">
      <div className="h2 grad">{title}</div>
      <button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> إضافة</button>
    </div>
    <div className="glass" style={{padding:14}}>
      {items.length===0?<Empty title="لا توجد بيانات"/>:
        <div className="sx"><table className="tbl">
          <thead><tr>{columns.map((c,i)=><th key={i}>{c.label}</th>)}<th>إجراءات</th></tr></thead>
          <tbody>{items.map(it=><tr key={it.id}>
            {columns.map((c,i)=><td key={i}>{c.render?c.render(it,app):it[c.key]}</td>)}
            <td><div className="flex g6">
              <button className="btn btn-s btn-sm" onClick={()=>openEdit(it)}><Icon name="edit" size={13}/></button>
              <button className="btn btn-dn btn-sm" onClick={()=>del(it.id)}><Icon name="trash" size={13}/></button>
            </div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>
    {editing!==null&&<Modal title={editing==='new'?'إضافة':'تعديل'} onClose={()=>setEditing(null)} wide>
      <div className="grid g2">
        {fields.map(f=><div key={f.key} style={{gridColumn:f.full?'span 2':'span 1'}}>
          <Field label={f.label} hint={f.hint}>
            {f.type==='textarea'?<textarea className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>:
             f.type==='number'?<input type="number" className="input" value={form[f.key]??''} onChange={e=>setForm({...form,[f.key]:+e.target.value})}/>:
             f.type==='select'?<select className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}>
               <option value="">— اختر —</option>
               {(typeof f.options==='function'?f.options(app):f.options).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
             </select>:
             <input className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>}
          </Field>
        </div>)}
      </div>
      <div className="flex g8 mt16">
        <button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button>
        <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
      </div>
    </Modal>}
  </>;
}

/* ═══ Students ═══ */
function StudentsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [q,setQ]=useState('');
  const [govFilter,setGovFilter]=useState('all');
  const [busy,setBusy]=useState(false);

  const GOVERNORATES = [
    "القاهرة","الجيزة","الإسكندرية","الدقهلية","الشرقية","المنوفية",
    "القليوبية","البحيرة","الغربية","بورسعيد","دمياط","الإسماعيلية",
    "السويس","كفر الشيخ","الفيوم","بني سويف","المنيا","أسيوط",
    "سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد",
    "مطروح","شمال سيناء","جنوب سيناء"
  ];

  const allStudents = app.db.users.filter(u => u.role === 'student');

  const list = allStudents.filter(u => {
    const matchesSearch = u.name.toLowerCase().includes(q.toLowerCase()) || (u.phone||'').includes(q);
    let matchesGov = true;
    if (govFilter === 'all') matchesGov = true;
    else if (govFilter === 'none') matchesGov = !u.governorate;
    else matchesGov = u.governorate === govFilter;
    return matchesSearch && matchesGov;
  });

  const open = s => { setForm(JSON.parse(JSON.stringify(s))); setEditing(s.id); };

  const save = async () => {
    setBusy(true);
    try {
      await DB.updateUser(editing, {
        name: form.name, phone: form.phone, xp: form.xp,
        grade_id: form.grade_id, governorate: form.governorate || null,
        all_subjects: form.all_subjects, access_subjects: form.access_subjects || [],
        subscription: form.subscription || 'free',
        subscription_until: form.subscription_until || null
      });
      await app.reload();
      app.toast.ok('تم الحفظ');
      setEditing(null);
    } catch(e) { app.toast.err(e.message); }
    setBusy(false);
  };

  const toggle = async s => {
    const action = s.active !== false ? 'إيقاف' : 'تفعيل';
    const r = await Swal.fire({
      title: `${action} الحساب؟`,
      text: `هل تريد ${action} حساب ${s.name}؟`,
      icon: 'question', showCancelButton: true,
      confirmButtonText: `نعم، ${action}`, cancelButtonText: 'إلغاء',
      confirmButtonColor: s.active !== false ? '#ef4444' : '#D4AF37',
      cancelButtonColor: '#64748b',
      background: 'linear-gradient(180deg, #1c160c, #0f0c07)', color: '#f7f0dd',
      customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }
    });
    if (!r.isConfirmed) return;
    try {
      await DB.updateUser(s.id, { active: !s.active });
      await app.reload();
      app.toast.warn(s.active !== false ? 'تم الإيقاف' : 'تم التفعيل');
    } catch(e) { app.toast.err(e.message); }
  };

  const govCounts = {};
  allStudents.forEach(u => { if (u.governorate) govCounts[u.governorate] = (govCounts[u.governorate]||0)+1; });

  return <>
    <div className="flex between center mb16 wrap g8">
      <div className="h2 grad">إدارة الطلاب</div>
      <div className="flex g8 wrap">
        <input className="input" style={{maxWidth:200}} placeholder="🔍 بحث..." value={q} onChange={e=>setQ(e.target.value)}/>
        <select className="input" style={{maxWidth:220}} value={govFilter} onChange={e=>setGovFilter(e.target.value)}>
          <option value="all">كل المحافظات ({allStudents.length})</option>
          {GOVERNORATES.map(gov => {
            const count = govCounts[gov] || 0;
            if (count === 0) return null;
            return <option key={gov} value={gov}>{gov} ({count})</option>;
          })}
          <option value="none">— بدون محافظة —</option>
        </select>
      </div>
    </div>

    <div className="glass" style={{padding:14}}>
      <div className="sx">
        <table className="tbl">
          <thead><tr>
            <th>الطالب</th><th>الهاتف</th><th>📍 المحافظة</th><th>XP</th><th>💳 الاشتراك</th><th>الحالة</th><th>إجراءات</th>
          </tr></thead>
          <tbody>
            {list.map(s => (
              <tr key={s.id}>
                <td><div className="flex center g8">
                  <div className="avatar" style={{width:30,height:30,fontSize:14}}>{s.avatar||'👤'}</div>
                  <span>{s.name}</span>
                </div></td>
                <td className="sm muted" dir="ltr">{(s.country_code||'+20')}{s.phone||''}</td>
                <td>{s.governorate ? <span className="pill pill-b" style={{fontSize:11}}>📍 {s.governorate}</span> : <span className="xs muted">—</span>}</td>
                <td><b style={{color:'var(--gold)'}}>{DB.fmt(s.xp||0)}</b></td>
                <td>
                  {s.subscription === 'vip' ? <span className="pill pill-a">💎 VIP</span>
                   : s.subscription === 'paid' ? <span className="pill pill-g">💳 مدفوع</span>
                   : <span className="pill pill-y">🆓 مجاني</span>}
                </td>
                <td>{s.active!==false ? <span className="pill pill-g">نشط</span> : <span className="pill pill-r">موقوف</span>}</td>
                <td><div className="flex g6">
                  <button className="btn btn-s btn-sm" onClick={()=>open(s)}><Icon name="edit" size={13}/></button>
                  <button className={`btn btn-sm ${s.active!==false?'btn-dn':'btn-ok'}`} onClick={()=>toggle(s)}>
                    {s.active!==false?'إيقاف':'تفعيل'}
                  </button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
        {list.length === 0 && <Empty icon="🔍" title="لا يوجد طلاب مطابقين للبحث"/>}
      </div>
    </div>

    {editing && <Modal title={`تعديل: ${form.name}`} onClose={()=>setEditing(null)} wide>
      <div className="grid g2">
        <Field label="الاسم"><input className="input" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
        <Field label="الهاتف"><input className="input" value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})}/></Field>
        <Field label="XP"><input type="number" className="input" value={form.xp||0} onChange={e=>setForm({...form,xp:+e.target.value})}/></Field>
        <Field label="الصف">
          <select className="input" value={form.grade_id||''} onChange={e=>setForm({...form,grade_id:e.target.value})}>
            <option value="">— اختر —</option>
            {app.db.grades.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        </Field>
        <Field label="📍 المحافظة" full>
          <select className="input" value={form.governorate||''} onChange={e=>setForm({...form,governorate:e.target.value})}>
            <option value="">— بدون —</option>
            {GOVERNORATES.map(gov => <option key={gov} value={gov}>{gov}</option>)}
          </select>
        </Field>
      </div>
      <div className="div"/>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>💳 الاشتراك</div>
      <div className="grid g2">
        <Field label="نوع الاشتراك">
          <select className="input" value={form.subscription||'free'} onChange={e=>setForm({...form,subscription:e.target.value})}>
            <option value="free">🆓 مجاني</option>
            <option value="paid">💳 مدفوع</option>
            <option value="vip">💎 VIP</option>
          </select>
        </Field>
        <Field label="تاريخ انتهاء الاشتراك">
          <input type="date" className="input" value={form.subscription_until||''} onChange={e=>setForm({...form,subscription_until:e.target.value})}/>
        </Field>
      </div>
      <div className="flex g8 mt16">
        <button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button>
        <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
      </div>
    </Modal>}
  </>;
}

/* ═══ Notifications ═══ */
function NotificationsPage(){
  const app=useApp();
  const [form,setForm]=useState({title:'',body:'',target:'all'});
  const [busy,setBusy]=useState(false);
  const send=async ()=>{
    if(!form.title||!form.body) return app.toast.warn('أدخل العنوان والنص');
    setBusy(true);
    try{
      await app.save('notifications',{...form,read_by:[]});
      app.toast.ok('تم الإرسال');
      setForm({title:'',body:'',target:'all'});
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    const r=await Swal.fire({title:'حذف الإشعار؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    if(!r.isConfirmed) return;
    try{await app.remove('notifications',id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="h2 mb16 grad">الإشعارات</div>
    <div className="grid g2">
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{display:'flex',alignItems:'center',gap:8,color:'var(--gold)'}}>
          <Icon name="bell" size={16}/> إرسال إشعار
        </div>
        <Field label="العنوان"><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></Field>
        <Field label="النص"><textarea className="input" value={form.body} onChange={e=>setForm({...form,body:e.target.value})}/></Field>
        <Field label="المستهدفون">
          <select className="input" value={form.target} onChange={e=>setForm({...form,target:e.target.value})}>
            <option value="all">كل الطلاب</option>
            {app.db.users.filter(u=>u.role==='student').map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
        <button className="btn btn-p btn-block" onClick={send} disabled={busy}>{busy?'جارٍ...':'📤 إرسال'}</button>
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>آخر الإشعارات</div>
        {app.db.notifications.slice(0,10).map(n=><div key={n.id} className="glass-s mb8" style={{padding:12,display:'flex',gap:10,alignItems:'flex-start'}}>
          <div style={{flex:1}}>
            <div className="h4" style={{fontSize:14}}>{n.title}</div>
            <div className="xs muted">{n.body}</div>
            <div className="xs muted mt6">{DB.formatDate(n.created_at)}</div>
          </div>
          <button className="btn btn-dn btn-sm" onClick={()=>del(n.id)}><Icon name="trash" size={13}/></button>
        </div>)}
      </div>
    </div>
  </>;
}

  const unreadNotifs = useMemo(()=>{
    return (app.db.notifications||[]).filter(n => {
      if(!n.created_at) return false;
      const created = new Date(n.created_at).getTime();
      const lastSeen = Number(localStorage.getItem('admin_last_notif_seen') || 0);
      return created > lastSeen;
    }).length;
  },[app.db.notifications]);

  useEffect(()=>{
    if(tab === 'notifications'){
      try{ localStorage.setItem('admin_last_notif_seen', Date.now().toString()); }
      catch(e){}
    }
  },[tab]);

  const items=[
    {title:'الرئيسية',items:[
      {id:'dashboard',icon:'dashboard',label:'لوحة التحكم'}
    ]},
    {title:'المحتوى',items:[
      {id:'grades',icon:'school',label:'الصفوف'},
      {id:'subjects',icon:'book',label:'المواد'},
      {id:'units',icon:'folder',label:'الوحدات'},
      {id:'levels',icon:'trend',label:'المستويات'},
      {id:'achievements',icon:'trophy',label:'الإنجازات'}
    ]},
    {title:'المستخدمون',items:[
      {id:'students',icon:'users',label:'الطلاب'},
      {id:'notifications',icon:'bell',label:'الإشعارات',badge:unreadNotifs||null},
      {id:'reports',icon:'link',label:'البلاغات'}
    ]},
    {title:'النظام',items:[
      {id:'settings',icon:'settings',label:'الإعدادات'}
    ]}
  ];

  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    app.db.users.filter(x=>x.name.toLowerCase().includes(lc)||(x.phone||'').includes(lc)).slice(0,5).forEach(s=>res.push({type:'مستخدم',icon:<Icon name="user" size={16}/>,title:s.name,nav:'students'}));
    app.db.subjects.filter(s=>s.name.toLowerCase().includes(lc)).forEach(s=>res.push({type:'مادة',icon:s.icon||'📚',title:s.name,nav:'subjects'}));
    setSearchResults(res);
  };

  return <div className="app">
    <Sidebar items={items} active={tab} onNav={(id)=>{setTab(id);try{localStorage.setItem('admin_tab',id);}catch(e){}}} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar
        user={user}
        onMenu={()=>setSidebarOpen(true)}
        onLogout={app.logout}
        onSearch={onSearch}
        searchResults={searchResults}
        onResultClick={r=>setTab(r.nav)}
        unreadNotifs={unreadNotifs}
        onOpenNotifications={()=>setTab('notifications')}
      />
      <div className="content">
        {tab==='dashboard'&&<Dashboard/>}
        {tab==='grades'&&<GradesPage/>}
        {tab==='subjects'&&<SubjectsPage/>}
        {tab==='units'&&<UnitsPage/>}
        {tab==='levels'&&<LevelsPage/>}
        {tab==='achievements'&&<AchievementsPage/>}
        {tab==='students'&&<StudentsPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='reports'&&<ReportsPage/>}
        {tab==='settings'&&<SettingsPage/>}
        <Footer/>
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role!=='admin') return null;
  return <AdminApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
