<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0805" />
<title>MISSION EDU — لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
--bg:#0a0805;--bg2:#0f0c07;
--gold:#D4AF37;--gold-l:#FFD700;--gold-xl:#FFED4E;--gold-d:#8B6914;--gold-dd:#5c4509;
--gold-soft:#F5E6A8;--gold-glow:rgba(212,175,55,.35);
--border:rgba(212,175,55,.18);--border2:rgba(212,175,55,.38);--border3:rgba(255,215,0,.55);
--blue:#D4AF37;--blue2:#FFD700;
--txt:#f7f0dd;--txt2:#d4c79a;--muted:#8a7d55;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#b8860b;
--r:20px;--rs:13px;
--sh:0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(212,175,55,.05) inset;
--sh-gold:0 10px 30px rgba(212,175,55,.35);
--sh-gold-h:0 14px 40px rgba(212,175,55,.55);
--grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%);
--grad-gold-soft:linear-gradient(135deg,rgba(255,215,0,.18),rgba(212,175,55,.08));
}
body[data-theme="gold"] { --gold:#D4AF37; --gold-l:#FFD700; --gold-d:#8B6914; --bg:#0a0805; --grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%); --border:rgba(212,175,55,.18); --border2:rgba(212,175,55,.38); }
body[data-theme="blue"] { --gold:#2f7dff; --gold-l:#5aa9ff; --gold-d:#1f5fd6; --bg:#04060e; --grad-gold:linear-gradient(135deg,#5aa9ff 0%,#2f7dff 45%,#1f5fd6 100%); --border:rgba(47,125,255,.18); --border2:rgba(47,125,255,.38); }
body[data-theme="green"] { --gold:#22c55e; --gold-l:#4ade80; --gold-d:#16a34a; --bg:#040a06; --grad-gold:linear-gradient(135deg,#4ade80 0%,#22c55e 45%,#16a34a 100%); --border:rgba(34,197,94,.18); --border2:rgba(34,197,94,.38); }
body[data-theme="purple"] { --gold:#8b5cf6; --gold-l:#a78bfa; --gold-d:#7c3aed; --bg:#06040e; --grad-gold:linear-gradient(135deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); --border:rgba(139,92,246,.18); --border2:rgba(139,92,246,.38); }
body[data-theme="red"] { --gold:#ef4444; --gold-l:#f87171; --gold-d:#dc2626; --bg:#0e0404; --grad-gold:linear-gradient(135deg,#f87171 0%,#ef4444 45%,#dc2626 100%); --border:rgba(239,68,68,.18); --border2:rgba(239,68,68,.38); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;width:100%}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,var(--border),transparent 62%),radial-gradient(950px 520px at -8% 18%,var(--border),transparent 60%),radial-gradient(700px 400px at 50% 110%,var(--border),transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7;transition: background-color 0.3s;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--border)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--gold-l),var(--gold))}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(28,22,12,.78),rgba(15,12,7,.68));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,var(--border2),transparent 40%,var(--border2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass-s{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(15,12,7,.96),rgba(10,8,5,.92));border-inline-start:1px solid var(--border);z-index:60;transition: transform 0.3s;}
.sidebar.hidden-sidebar { transform: translateX(-100%); position: fixed; }
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
.skeleton { background: #1c160c; background-image: linear-gradient(90deg, #1c160c 0px, #2a2012 40px, #1c160c 80px); background-size: 1000px 100%; animation: shimmer 1.5s infinite linear; border-radius: 8px; }
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);box-shadow:0 8px 26px var(--gold-glow),0 0 0 1px rgba(255,237,78,.3) inset;position:relative}
.brand-logo::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.brand-name{font-weight:900;font-size:17px;background:linear-gradient(100deg,var(--gold-l),#fff 45%,var(--gold) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 4s linear infinite}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:var(--border);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,var(--border2),transparent);color:var(--gold-l)}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,var(--gold-l),var(--gold));box-shadow:0 0 12px var(--gold-l)}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(10,8,5,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);min-height:52px}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:rgba(28,22,12,.7);border:1px solid var(--border);border-radius:12px;padding:6px 12px;transition:.22s;min-height:38px}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--border)}
.search input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-gold);color:#1a1206;box-shadow:0 10px 28px var(--gold-glow),0 0 0 1px rgba(255,255,255,.2) inset;position:relative;overflow:hidden}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:var(--sh-gold-h);transform:translateY(-2px);color:#000}
.btn-s{background:var(--border);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:var(--border2);color:var(--gold-l);border-color:var(--gold)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h1{font-size:clamp(21px,3.2vw,30px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,var(--gold-l),#fff 50%,var(--gold) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 5s linear infinite}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill-b{background:var(--border);color:var(--gold-l);border-color:var(--border2)}
.pill-g{background:rgba(34,197,94,.16);color:#6ee7a0;border-color:rgba(34,197,94,.32)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.32)}
.pill-v{background:rgba(184,134,11,.18);color:#e0b84c;border-color:rgba(184,134,11,.35)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.pill-free{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));color:#86efac;border:1px solid rgba(34,197,94,.42);box-shadow:0 0 12px rgba(34,197,94,.15)}
.pill-paid{background:linear-gradient(135deg,var(--border2),var(--border));color:var(--gold-l);border:1px solid var(--gold);box-shadow:0 0 12px var(--border)}
.bar{height:9px;border-radius:20px;background:var(--border);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold);box-shadow:0 0 14px var(--gold-glow)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(15,12,7,.78);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--border)}
.input::placeholder{color:var(--muted)}
select.input{cursor:pointer;appearance:none;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
textarea.input{resize:vertical;min-height:80px;font-family:inherit}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--gold);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap;opacity:.85}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--border)}
.sx{overflow-x:auto}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--grad-gold);color:#1a1206;flex-shrink:0;box-shadow:0 4px 14px var(--gold-glow)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--border);border:1px solid var(--border);transition:.2s;font-size:15px;color:var(--gold);position:relative;flex-shrink:0}
.icon-btn:hover{background:var(--border2);border-color:var(--border2);box-shadow:0 0 16px var(--border2)}
.modal-bg{position:fixed;inset:0;background:rgba(5,3,1,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{padding:16px 20px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--border2),var(--border) 50%,transparent);border:1px solid var(--border2);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px var(--border) inset}
.hero::after{content:'';position:absolute;top:-50%;inset-inline-end:0;width:340px;height:340px;background:radial-gradient(circle,var(--border2),transparent 65%);pointer-events:none;border-radius:50%}
.vid-preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border2);position:relative;margin-top:10px}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:0;display:block;object-fit:contain}
.act-row{display:flex;gap:12px;padding:12px;border-radius:13px;background:var(--border);border:1px solid var(--border);align-items:flex-start}
.act-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:var(--border2);color:var(--gold)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px;box-shadow:0 0 20px var(--border2)}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#1a1206;box-shadow:0 0 20px var(--gold-glow)}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:var(--border);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(28,22,12,.98),rgba(15,12,7,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 30px var(--border);animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--border);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:var(--border2);color:var(--gold-l)}
.toast.info .toast-bar-f{background:var(--grad-gold)}
.footer-dev{display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;border-top:1px solid var(--border);position:relative;flex-wrap:wrap}
.footer-dev::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-l),transparent)}
.dev-btn,.tg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s;border:1px solid}
.dev-btn{background:linear-gradient(135deg,var(--border2),var(--border));border-color:var(--border2);color:var(--txt);position:relative;overflow:hidden}
.dev-btn:hover{background:linear-gradient(135deg,var(--border2),var(--border2));border-color:var(--gold-l);transform:translateY(-2px);box-shadow:var(--sh-gold)}
.dev-name b{background:linear-gradient(90deg,var(--gold-l),#fff,var(--gold),var(--gold-l));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900;letter-spacing:.3px}
.tg-btn{background:var(--border);border-color:var(--border2);color:var(--gold-l)}
.tg-btn:hover{background:var(--border2);border-color:var(--gold-l);color:var(--gold-l);transform:translateY(-2px);box-shadow:var(--sh-gold)}
.swal-custom-popup{border:1px solid var(--border2)!important;border-radius:22px!important;box-shadow:0 24px 70px rgba(0,0,0,.85),0 0 40px var(--border)!important;font-family:'Tajawal','Cairo',sans-serif!important;backdrop-filter:blur(20px)}
.swal-custom-title{color:var(--txt)!important;font-size:20px!important;font-weight:800!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-input{background:rgba(15,12,7,.78)!important;border:1.5px solid var(--border2)!important;color:var(--txt)!important;border-radius:12px!important;font-family:'Tajawal','Cairo',sans-serif!important}
.swal-custom-confirm{border-radius:12px!important;font-weight:700!important;font-family:'Tajawal','Cairo',sans-serif!important;padding:10px 24px!important;background:var(--grad-gold)!important;color:#1a1206!important}
.swal-custom-cancel{border-radius:12px!important;font-weight:700!important;font-family:'Tajawal','Cairo',sans-serif!important;padding:10px 24px!important}
.access-toggle{display:flex;gap:8px;flex-wrap:wrap}

.access-btn-free{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.28);color:#86efac}

.access-btn .em{font-size:15px}
.section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--border);font-size:14px;color:var(--gold);flex-shrink:0}
.qbank-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;background:var(--border);color:var(--gold-soft);border:1px solid var(--border)}

.msg-card{background:var(--border);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;transition:.2s}

.msg-tab.active{background:var(--border2);border-color:var(--gold);color:var(--gold-l)}
body.focus-mode .sidebar { transform: translateX(-100%); position: fixed; }
body.focus-mode .main { margin-inline-start: 0; }
body.focus-mode .topbar { padding-inline-start: 20px; }

.cmd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 9999; display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh; }
.cmd-box { width: 100%; max-width: 600px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); animation: pu .2s; }
.cmd-input { width: 100%; padding: 16px 20px; background: transparent; border: none; border-bottom: 1px solid var(--border); font-size: 18px; color: var(--txt); outline: none; }
.cmd-results { max-height: 400px; overflow-y: auto; padding: 8px; }
.cmd-item { padding: 12px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.1s; }

@keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 24px; opacity: 1; } }

<script>

</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

const SEC = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  safeUrl: u => /^https?:\/\//i.test(String(u || '')) ? u : '#',
  safeImg: u => /^https?:\/\/.+\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(String(u || '')) || /^https:\/\/.+\.supabase\.co\/storage\//i.test(String(u||'')) ? u : null,
  clean: s => String(s ?? '').replace(/[<>]/g,'').trim(),
  maxLen: (s, n=500) => String(s ?? '').slice(0, n),
  rateLimit: (()=>{const store={};return (key,ms=3000)=>{const now=Date.now();if(store[key]&&now-store[key]<ms)return false;store[key]=now;return true;};})(),
  sanitizeObject: obj => {
    if(!obj || typeof obj!=='object') return obj;
    const out = Array.isArray(obj) ? [] : {};
    for(const k in obj){
      if(/^(__proto__|constructor|prototype)$/.test(k)) continue;
      const v = obj[k];
      if(typeof v==='string') out[k] = SEC.maxLen(v, 5000);
      else if(typeof v==='object' && v !== null) out[k] = SEC.sanitizeObject(v);
      else out[k] = v;
    }
    return out;
  }
};

let _audioCtx = null;
function getAudioCtx(){if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return _audioCtx;}
function beep(frequency,duration,type='sine',volume=0.15){try{const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.value=frequency;osc.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration/1000);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+duration/1000);}catch(e){}}
function playSound(type='notify'){switch(type){case 'success':beep(523,100,'sine',0.18);setTimeout(()=>beep(659,100,'sine',0.18),100);setTimeout(()=>beep(784,200,'sine',0.18),200);break;case 'err':beep(392,120,'square',0.15);setTimeout(()=>beep(311,200,'square',0.15),120);break;case 'warn':beep(440,150,'triangle',0.18);setTimeout(()=>beep(440,150,'triangle',0.18),180);break;default:beep(880,100,'sine',0.15);setTimeout(()=>beep(1175,120,'sine',0.15),100);}}

const ToastCtx=createContext(null);
function ToastProvider({children}){const [items,setItems]=useState([]);const push=useCallback((msg,type='info',title,duration=3800)=>{const id=DB.uid('t_');const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);if(type==='ok')playSound('success');else if(type==='err')playSound('err');else if(type==='warn')playSound('warn');else playSound('notify');},[]);const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>{children}<div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div></ToastCtx.Provider>;}
function Toast({data,onClose}){const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);const icons={ok:'✓',err:'✕',warn:'!',info:'i'};return <div className={`toast ${data.type} ${out?'out':''}`}><div className="toast-ico">{icons[data.type]}</div><div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div><button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button><div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div></div>;}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[],xp_shop_items:[],study_groups:[],study_group_members:[],study_plans:[],daily_challenges:[],practice_sessions:[],focus_sessions:[],flashcards:[],audit_logs:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      await DB.cleanupExpiredPolls();
      const data=await DB.loadAll();
      const extra=['xp_shop_items','study_groups','study_group_members','study_plans','study_tasks','daily_challenges','practice_sessions','focus_sessions','flashcards','xp_purchases','video_progress','daily_reward','audit_logs'];
      const sb=await DB.getClient();
      const extraResults=await Promise.all(extra.map(async(t)=>{try{const res=await sb.from(t).select('*').limit(2000);return{t,data:res.data||[]};}catch(e){return{t,data:[]};}}));
      extraResults.forEach(r=>{data[r.t]=r.data;});
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{(async ()=>{try{const sid=DB.getSessionId();if(!sid){window.location.replace('/auth/login.html');return;}const u=await DB.getUser(sid);if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}if(u.role!=='admin'){window.location.replace('/student/index.html');return;}setCurrentUser(u);await reload();}catch(e){console.warn(e);}setLoading(false);})();},[]);

  useEffect(()=>{const interval=setInterval(async ()=>{const count=await DB.cleanupExpiredPolls();if(count>0){await reload();}},5*60*1000);return ()=>clearInterval(interval);},[reload]);

  useEffect(()=>{const unlock=()=>{const ctx=getAudioCtx();if(ctx&&ctx.state==='suspended')ctx.resume();document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};document.addEventListener('click',unlock,{once:true});document.addEventListener('touchstart',unlock,{once:true});return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};},[]);

  const logout=useCallback(()=>{Swal.fire({title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}}).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('/auth/login.html');}});},[]);

  const logAudit = useCallback(async(action, target, details) => {
    if(!currentUser) return;
    try {
      await DB.save('audit_logs', {
        id: DB.uid('log_'),
        admin_id: currentUser.id,
        admin_name: currentUser.name,
        action,
        target,
        details: details || {},
        created_at: Date.now()
      });
    } catch(e) {}
  }, [currentUser]);

  const save=useCallback(async (table,item)=>{
    const clean = SEC.sanitizeObject(item);
    if(!clean || typeof clean!=='object') throw new Error('بيانات غير صالحة');
    const saved=await DB.save(table,clean);
    await logAudit('edit/create', `${table} : ${item.title || item.name || item.id}`, { table, id: item.id });
    await reload();
    return saved;
  },[reload, logAudit]);

  const remove=useCallback(async (table,id)=>{
    if(!id || typeof id!=='string' || id.length<3) throw new Error('معرف غير صالح');
    await DB.remove(table,id);
    await logAudit('delete', `${table} : ${id}`, { table, id });
    await reload();
  },[reload, logAudit]);

  const removeMany=useCallback(async (table,ids)=>{
    const clean = (ids||[]).filter(x=>typeof x==='string'&&x.length>=3);
    if(!clean.length) return;
    await DB.removeMany(table,clean);
    await logAudit('bulk_delete', `${table}`, { table, count: clean.length });
    await reload();
  },[reload, logAudit]);

  const getLevel=useCallback((xp)=>{const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);if(ls.length===0)return {current:{level:1,name:'مبتدئ',xp:0},next:null};let cur=ls[0],next=null;for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}return {current:cur,next};},[db.levels]);

  return <AppCtx.Provider value={{db,currentUser,loading,logout,reload,save,remove,removeMany,getLevel,toast,playSound,logAudit,subject:id=>db.subjects.find(s=>s.id===id),unit:id=>db.units.find(u=>u.id===id),lesson:id=>db.lessons.find(l=>l.id===id),exam:id=>db.exams.find(e=>e.id===id),question:id=>db.questions.find(q=>q.id===id),grade:id=>db.grades.find(g=>g.id===id)}}>{children}</AppCtx.Provider>;
}

function Crud({title,collection,defaultItem,fields,columns}){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [busy,setBusy]=useState(false);
  const rows=app.db[collection]||[];
  const openNew=()=>{setForm(defaultItem());setEditing('new');};
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};
  const save=async ()=>{setBusy(true);try{await app.save(collection,form);app.toast.ok('تم الحفظ');setEditing(null);}catch(e){app.toast.err(e.message);}setBusy(false);};
  const del=async id=>{const r=await Swal.fire({title:'حذف العنصر؟',text:'لا يمكن التراجع',icon:'warning',showCancelButton:true,confirmButtonText:'نعم، احذف',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{await app.remove(collection,id);app.toast.warn('تم الحذف');}catch(e){app.toast.err(e.message);}};
  return <>
    <div className="flex between center mb16 wrap g8"><div className="h2 grad">{title}</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> جديد</button></div>
    <div className="glass" style={{padding:14}}>
      {rows.length===0?<Empty icon="📭" title="لا توجد عناصر" desc="ابدأ بإضافة عنصر جديد"/>:
      <div className="sx"><table className="tbl"><thead><tr>{columns.map((c,i)=><th key={i}>{c.label}</th>)}<th>إجراءات</th></tr></thead><tbody>{rows.map(it=><tr key={it.id}>{columns.map((c,i)=><td key={i}>{c.render?c.render(it):(it[c.key] ?? '—')}</td>)}<td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>openEdit(it)}><Icon name="edit" size={13}/></button><button className="btn btn-dn btn-sm" onClick={()=>del(it.id)}><Icon name="trash" size={13}/></button></div></td></tr>)}</tbody></table></div>}
    </div>
    {editing!==null&&<Modal title={editing==='new'?`${title} — جديد`:`${title} — تعديل`} onClose={()=>setEditing(null)} wide>
      {fields.map(f=>{const val=form[f.key]??'';
        if(f.type==='textarea') return <Field key={f.key} label={f.label}><textarea className="input" rows="4" value={val} onChange={e=>setForm({...form,[f.key]:e.target.value})}/></Field>;
        if(f.type==='select') return (<Field key={f.key} label={f.label}><select className="input" value={val} onChange={e=>setForm({...form,[f.key]:e.target.value})}><option value="">— اختر —</option>{(f.options||[]).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></Field>);
        if(f.type==='number') return <Field key={f.key} label={f.label}><input type="number" className="input" value={val} onChange={e=>setForm({...form,[f.key]:e.target.value===''?'':+e.target.value})}/></Field>;
        return <Field key={f.key} label={f.label}><input className="input" value={val} onChange={e=>setForm({...form,[f.key]:e.target.value})}/></Field>;
      })}
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

function CommandPalette({onClose, onNavigate}){
  const app=useApp();
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const results = useMemo(()=>{
    if(!q.trim()) return [];
    const lc = q.toLowerCase();
    const res = [];
    app.db.users.filter(u=>u.role==='student' && (u.name.toLowerCase().includes(lc) || (u.phone||'').includes(lc))).slice(0,4).forEach(u=>{res.push({ id:'s_'+u.id, type:'طالب', title:u.name, sub:u.phone, nav:'students', icon:<Icon name="user" size={16}/> });});
    app.db.lessons.filter(l=>l.title.toLowerCase().includes(lc)).slice(0,4).forEach(l=>{res.push({ id:'l_'+l.id, type:'درس', title:l.title, sub:app.unit(l.unit_id)?.name, nav:'lessons', icon:<Icon name="file" size={16}/> });});
    app.db.exams.filter(e=>e.title.toLowerCase().includes(lc)).slice(0,4).forEach(e=>{res.push({ id:'e_'+e.id, type:'اختبار', title:e.title, sub:app.subject(e.subject_id)?.name, nav:'exams', icon:<Icon name="clipboard" size={16}/> });});
    app.db.subjects.filter(s=>s.name.toLowerCase().includes(lc)).slice(0,4).forEach(s=>{res.push({ id:'sub_'+s.id, type:'مادة', title:s.name, sub:'', nav:'subjects', icon:<Icon name="book" size={16}/> });});
    return res;
  }, [q, app.db]);
  useEffect(()=>{ setSel(0); }, [q]);
  useEffect(()=>{
    const handleKey = (e) => {
      if(e.key === 'ArrowDown'){ e.preventDefault(); setSel(s=>Math.min(s+1, results.length-1)); }
      if(e.key === 'ArrowUp'){ e.preventDefault(); setSel(s=>Math.max(s-1, 0)); }
      if(e.key === 'Enter' && results[sel]){ e.preventDefault(); onNavigate(results[sel].nav); onClose(); }
    };
    window.addEventListener('keydown', handleKey);
    return ()=>window.removeEventListener('keydown', handleKey);
  }, [results, sel, onNavigate, onClose]);
  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="cmd-box" onClick={e=>e.stopPropagation()}>
        <input className="cmd-input" autoFocus placeholder="ابحث عن طالب، درس، اختبار، مادة..." value={q} onChange={e=>setQ(e.target.value)}/>
        {q.trim() && results.length===0 ? (
          <div className="cmd-empty">لا توجد نتائج مطابقة</div>
        ) : (
          <div className="cmd-results">
            {results.map((r,i)=>(
              <div key={r.id} className={`cmd-item ${i===sel?'selected':''}`} onMouseEnter={()=>setSel(i)} onClick={()=>{onNavigate(r.nav);onClose();}}>
                <div className="cmd-item-ico">{r.icon}</div>
                <div style={{flex:1}}>
                  <div className="sm" style={{fontWeight:700}}>{r.title}</div>
                  <div className="xs muted">{r.type} {r.sub ? `• ${r.sub}` : ''}</div>
                </div>
                <div className="xs muted" style={{border:'1px solid var(--border)',padding:'2px 6px',borderRadius:4}}>↵</div>
              </div>
            ))}
          </div>
        )}
        <div style={{padding:'10px 16px', background:'var(--border)', borderTop:'1px solid var(--border)', fontSize:11, color:'var(--muted)', display:'flex', gap:16}}>
          <span><b>↑↓</b> للتنقل</span>
          <span><b>Enter</b> للاختيار</span>
          <span><b>Esc</b> للإغلاق</span>
        </div>
      </div>
    </div>
  );
}

function Dashboard(){
  const app=useApp();
  const students=app.db.users.filter(u=>u.role==='student');
  const active=students.filter(s=>s.active!==false&&s.banned!==true).length;
  const banned=students.filter(s=>s.banned===true).length;
  const totalLessons=app.db.lessons.filter(l=>l.published!==false).length;
  let totalDone=0;
  students.forEach(s=>{totalDone+=(s.completed_lessons||[]).length;});
  const avgProgress=students.length&&totalLessons?Math.round((totalDone/(students.length*totalLessons))*100):0;
  const top10=useMemo(()=>[...students].filter(s=>s.banned!==true).sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10),[students]);
  const recentAct=(app.db.activity||[]).slice(0,8);
  const expiringSoon = useMemo(()=>{
    const now = Date.now();

  const save=async()=>{setBusy(true);try{await DB.updateUser(editing,{name:form.name,phone:form.phone,xp:form.xp,grade_id:form.grade_id,governorate:form.governorate||null,gender:form.gender||null,all_subjects:form.all_subjects,access_subjects:form.access_subjects||[],subscription:form.subscription||'free',subscription_until:form.subscription_until||null});await app.reload();app.toast.ok('تم');setEditing(null);}catch(e){app.toast.err(e.message);}setBusy(false);};
  const toggle=async s=>{const action=s.active!==false?'إيقاف':'تفعيل';const r=await Swal.fire({title:`${action}؟`,text:`${action} حساب ${s.name}?`,icon:'question',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:s.active!==false?'#ef4444':'#D4AF37',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{await DB.updateUser(s.id,{active:!s.active});await app.reload();app.toast.warn('تم');}catch(e){app.toast.err(e.message);}};
  const govCounts={};allStudents.forEach(u=>{if(u.governorate){govCounts[u.governorate]=(govCounts[u.governorate]||0)+1;}});

    <div className="glass" style={{padding:14}}>
      <div className="sx"><table className="tbl"><thead><tr><th style={{width:40}}><input type="checkbox" checked={list.length>0 && selectedIds.length === list.length} onChange={toggleSelectAll}/></th><th>الطالب</th><th>النوع</th><th>الهاتف</th><th>📍</th><th>XP</th><th>الاشتراك</th><th>بلاغات</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody>{list.map(s=><tr key={s.id} style={{background: selectedIds.includes(s.id) ? 'var(--border2)' : 'transparent'}}>

          <td>{s.gender==='female'?<span className="pill" style={{background:'rgba(236,72,153,.15)',color:'#f9a8d4',borderColor:'rgba(236,72,153,.3)',border:'1px solid'}}>👧</span>:s.gender==='male'?<span className="pill pill-b">👦</span>:'—'}</td>
          <td className="sm muted" dir="ltr">{(s.country_code||'+20')}{s.phone||''}</td>
          <td>{s.governorate?<span className="pill pill-b" style={{fontSize:11}}>📍 {SEC.esc(s.governorate)}</span>:'—'}</td>
          <td><b style={{color:'var(--gold)'}}>{DB.fmt(s.xp||0)}</b></td>
          <td>{s.subscription==='vip'?<span className="pill pill-v">💎 VIP</span>:s.subscription==='paid'?<span className="pill pill-g">💳</span>:<span className="pill pill-y">🆓</span>}</td>
          <td>{(s.reports_count||0)>=3?<span className="pill pill-r">🚨 {s.reports_count}</span>:(s.reports_count||0)>0?<span className="pill pill-a">{s.reports_count}</span>:'0'}</td>
          <td>{s.banned?<span className="pill pill-r">⛔</span>:s.active!==false?<span className="pill pill-g">نشط</span>:<span className="pill pill-y">موقوف</span>}</td>
          <td><div className="flex g6"><button className="btn btn-s btn-sm" title="بروفايل" onClick={()=>setProfileId(s.id)}><Icon name="user" size={13}/></button><button className="btn btn-s btn-sm" onClick={()=>open(s)}><Icon name="edit" size={13}/></button>{!s.banned&&<button className={`btn btn-sm ${s.active!==false?'btn-dn':'btn-ok'}`} onClick={()=>toggle(s)}>{s.active!==false?'إيقاف':'تفعيل'}</button>}</div></td>
        </tr>)}</tbody></table></div>
      {list.length===0&&<Empty icon="🔍" title="لا طلاب"/>}
    </div>
    {selectedIds.length > 0 && (<div className="bulk-bar"><span className="sm" style={{fontWeight:700}}>تم تحديد {selectedIds.length} طالب</span><div style={{width:1,height:24,background:'var(--border)'}}/><button className="btn btn-dn btn-sm" onClick={()=>bulkAction('ban')} disabled={busy}>⛔ حظر</button><button className="btn btn-s btn-sm" onClick={()=>bulkAction('unban')} disabled={busy}>✅ فك الحظر</button><button className="btn btn-s btn-sm" onClick={()=>bulkAction('active')} disabled={busy}>▶️ تفعيل</button><button className="btn btn-s btn-sm" onClick={()=>bulkAction('inactive')} disabled={busy}>⏸️ إيقاف</button><button className="icon-btn" onClick={()=>setSelectedIds([])}><Icon name="close" size={14}/></button></div>)}
    {editing&&<Modal title={`تعديل: ${SEC.esc(form.name)}`} onClose={()=>setEditing(null)} wide>
      <div className="grid g2"><Field label="الاسم"><input className="input" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})}/></Field><Field label="الهاتف"><input className="input" value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})}/></Field><Field label="النوع"><select className="input" value={form.gender||''} onChange={e=>setForm({...form,gender:e.target.value||null})}><option value="">—</option><option value="male">👦</option><option value="female">👧</option></select></Field><Field label="XP"><input type="number" className="input" value={form.xp??''} onChange={e=>setForm({...form,xp:e.target.value===''?'':+e.target.value})}/></Field><Field label="الصف"><select className="input" value={form.grade_id||''} onChange={e=>setForm({...form,grade_id:e.target.value})}><option value="">—</option>{app.db.grades.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></Field><Field label="📍 المحافظة"><select className="input" value={form.governorate||''} onChange={e=>setForm({...form,governorate:e.target.value})}><option value="">— بدون —</option>{GOVERNORATES.map(g=><option key={g} value={g}>{g}</option>)}</select></Field></div>
      <div className="grid g2"><Field label="الاشتراك"><select className="input" value={form.subscription||'free'} onChange={e=>setForm({...form,subscription:e.target.value})}><option value="free">🆓</option><option value="paid">💳</option><option value="vip">💎</option></select></Field><Field label="تاريخ الانتهاء"><input type="date" className="input" value={form.subscription_until||''} onChange={e=>setForm({...form,subscription_until:e.target.value})}/></Field></div>
      <Field label="الوصول"><label className="flex center g8 mb12" style={{cursor:'pointer'}}><input type="checkbox" checked={!!form.all_subjects} onChange={e=>setForm({...form,all_subjects:e.target.checked})}/><span className="sm">جميع المواد</span></label></Field>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

function LessonsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);const [form,setForm]=useState({});const [busy,setBusy]=useState(false);
  const [filterUnit,setFilterUnit]=useState('all');const [filterAccess,setFilterAccess]=useState('all');
  const [lessonTestText,setLessonTestText]=useState('');
  const [lessonTestTitle,setLessonTestTitle]=useState('');
  const [lessonTestDuration,setLessonTestDuration]=useState(15);
  const [lessonTestPassScore,setLessonTestPassScore]=useState(50);
  const [lessonTestXp,setLessonTestXp]=useState(10);
  const [lessonTestFree,setLessonTestFree]=useState(true);
  const [lessonTestBusy,setLessonTestBusy]=useState(false);
  const [previewQs,setPreviewQs]=useState(null);
  const openNew=()=>{setForm({title:'',desc:'',summary:'',video:{type:'youtube',url:'',poster:'',allowDownload:false,allowExternal:true,is_free:true},pdf_url:'',duration:'',xp:'',sort_order:'',unit_id:'',published:true,key_points:[],examples:[],notes:''});setLessonTestText('');setLessonTestTitle('');setLessonTestDuration(15);setLessonTestPassScore(50);setLessonTestXp(10);setLessonTestFree(true);setEditing('new');};
  const openEdit=it=>{const c=JSON.parse(JSON.stringify(it));if(!c.video)c.video={type:'youtube',url:'',poster:'',allowDownload:false,allowExternal:true,is_free:true};if(c.video.is_free===undefined)c.video.is_free=true;if(!c.key_points)c.key_points=[];if(!c.pdf_url)c.pdf_url='';setForm(c);setLessonTestText('');setLessonTestTitle(`اختبار ${c.title||'الدرس'}`);setLessonTestDuration(15);setLessonTestPassScore(50);setLessonTestXp(10);setLessonTestFree(true);setEditing(it.id);};
  const duplicate = (it) => {const c = JSON.parse(JSON.stringify(it));delete c.id;c.title = `${c.title} (نسخة)`;setForm(c);setEditing('new');app.toast.info('تم نسخ الدرس.');};
  const parseLessonQuestionsJSON = (raw) => {
    let parsed;
    try { parsed = JSON.parse(raw); }catch(e) { throw new Error('صيغة JSON غير صحيحة.'); }
    const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.questions) ? parsed.questions : null);
    if(!list || !list.length) throw new Error('لا توجد أسئلة.');
    return list.map((item, i) => {
      if(!item || typeof item !== 'object') throw new Error(`السؤال ${i+1} غير صالح.`);
      const text = String(item.question ?? item.text ?? '').trim();
      const source = item.options ?? item.choices;
      let options;
      if(Array.isArray(source)) options = source.map(v => String(v ?? '').trim());
      else if(source && typeof source === 'object') options = ['A','B','C','D'].map(k => String(source[k] ?? source[k.toLowerCase()] ?? '').trim());
      else options = [];
      if(!text) throw new Error(`نص السؤال ${i+1} فارغ.`);
      if(options.length < 2 || options.some(v => !v)) throw new Error(`اختيارات ${i+1} ناقصة.`);
      if(options.length > 4) options = options.slice(0, 4);
      const rawCorrect = item.correct ?? item.answer;
      if(rawCorrect === undefined || rawCorrect === null || String(rawCorrect).trim() === '') throw new Error(`الإجابة الصحيحة ${i+1} غير محددة.`);
      let correct = -1;
      if(typeof rawCorrect === 'number' || /^\d+$/.test(String(rawCorrect).trim())) {const n = Number(rawCorrect);correct = (n >= 0 && n < options.length) ? n : (n >= 1 && n <= options.length ? n - 1 : -1);} else {const key = String(rawCorrect).trim();const letterMap = {'A':0,'B':1,'C':2,'D':3,'a':0,'b':1,'c':2,'d':3,'أ':0,'ب':1,'ج':2,'د':3};if(Object.prototype.hasOwnProperty.call(letterMap, key)) correct = letterMap[key];else correct = options.findIndex(o => o.toLowerCase() === key.toLowerCase());}
      if(correct < 0 || correct >= options.length) throw new Error(`الإجابة الصحيحة ${i+1} لا تطابق.`);
      return {text, options, correct, explanation: String(item.explanation ?? item.rationale ?? '').trim(), difficulty: String(item.difficulty || 'medium'), xp: Number(item.xp) || 0};
    });
  };
  const previewTest = () => {try {const parsed = parseLessonQuestionsJSON((lessonTestText || '').trim());setPreviewQs(parsed);} catch(e) {app.toast.err(e.message, 'راجع JSON');}};
  const createTestForLesson = async () => {
    if(editing === 'new' || !form.id) return app.toast.warn('احفظ الدرس أولاً');
    if(!lessonTestTitle.trim()) return app.toast.warn('اكتب اسم الاختبار');
    let parsed;
    try { parsed = parseLessonQuestionsJSON((lessonTestText || '').trim()); }catch(e) { return app.toast.err(e.message, 'راجع JSON'); }
    const lesson = app.lesson(form.id) || form;
    const unit = app.unit(lesson.unit_id);
    const subjectId = unit?.subject_id || '';
    if(!subjectId) return app.toast.warn('الدرس لازم يكون مرتبط بوحدة');
    setLessonTestBusy(true);
    try {
      const questionIds = [];
      for(const q of parsed) {const id = DB.uid('q_');await app.save('questions', {id, text: q.text, options: q.options, correct: [q.correct],explanation: q.explanation, lesson_id: lesson.id,unit_id: lesson.unit_id, subject_id: subjectId,difficulty: q.difficulty, xp: Number(q.xp) || Number(lessonTestXp) || 0, type: 'mcq'});questionIds.push(id);}
      const exam = {id: DB.uid('exam_'), title: lessonTestTitle.trim(),subject_id: subjectId, unit_id: lesson.unit_id, lesson_ids: [lesson.id],question_ids: questionIds, duration: Number(lessonTestDuration) || 15,pass_score: Number(lessonTestPassScore) || 0, max_attempts: 0,xp: Number(lessonTestXp) || 0, published: true, sort_order: 0,is_free: lessonTestFree};
      await app.save('exams', exam);

      setLessonTestText(''); setPreviewQs(null);
    } catch(e) {app.toast.err('فشل: ' + (e.message || 'خطأ'));}
    setLessonTestBusy(false);
  };
  const save=async()=>{if(!form.title)return app.toast.warn('العنوان مطلوب');if(!form.unit_id)return app.toast.warn('اختر الوحدة');setBusy(true);try{const saved=await app.save('lessons',form);if(editing==='new'){const lesson=saved||form;setForm(lesson);setEditing(lesson.id);setLessonTestTitle(`اختبار ${lesson.title||'الدرس'}`);app.toast.ok('تم حفظ الدرس.');}else{app.toast.ok('تم الحفظ');setEditing(null);}}catch(e){app.toast.err(e.message);}setBusy(false);};
  const del=async id=>{const r=await Swal.fire({title:'حذف الدرس؟',text:'لا يمكن التراجع',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{await app.remove('lessons',id);app.toast.warn('تم');}catch(e){app.toast.err(e.message);}};
  const getLessonExams=lessonId=>app.db.exams.filter(e=>(e.lesson_ids||[]).includes(lessonId));
  const sortedLessons=useMemo(()=>[...app.db.lessons].sort((a,b)=>{const ta=new Date(a.created_at||a.createdAt||0).getTime()||0;const tb=new Date(b.created_at||b.createdAt||0).getTime()||0;return ta-tb;}),[app.db.lessons]);
  const filteredLessons=useMemo(()=>{let list=sortedLessons;if(filterUnit!=='all')list=list.filter(l=>l.unit_id===filterUnit);if(filterAccess!=='all'){list=list.filter(l=>{const isFree=!l.video||!l.video.url||l.video.is_free!==false;return filterAccess==='free'?isFree:!isFree;});}return list;},[sortedLessons,filterUnit,filterAccess]);
  const currentLessonExams=editing&&editing!=='new'?getLessonExams(editing):[];
  return <>
    <div className="flex between center mb16 wrap g8"><div className="h2 grad">📖 إدارة الدروس</div><div className="flex g8"><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> درس جديد</button></div></div>
    <div className="glass mb16" style={{padding:14}}><div className="flex wrap g12"><div style={{flex:'1 1 240px'}}><label className="lbl">الوحدة</label><select className="input" value={filterUnit} onChange={e=>setFilterUnit(e.target.value)}><option value="all">كل الوحدات ({sortedLessons.length})</option>{app.db.units.map(u=><option key={u.id} value={u.id}>{app.subject(u.subject_id)?.name} — {u.name}</option>)}</select></div><div style={{flex:'1 1 240px'}}><label className="lbl">الوصول</label><select className="input" value={filterAccess} onChange={e=>setFilterAccess(e.target.value)}><option value="all">الكل</option><option value="free">🆓 مجاني</option><option value="paid">🔒 مدفوع</option></select></div></div></div>
    <div className="glass" style={{padding:14}}>

        {filteredLessons.map(l=>{const isFree=!l.video||!l.video.url||l.video.is_free!==false;const exams=getLessonExams(l.id);const totalQs=exams.reduce((s,e)=>s+(e.question_ids||[]).length,0);const hasPdf=!!l.pdf_url;return <tr key={l.id}><td><b>{SEC.esc(l.title)}</b></td><td className="sm">{SEC.esc(app.unit(l.unit_id)?.name||'—')}</td><td><AccessBadge value={isFree}/></td><td>{exams.length>0?<span className="pill pill-g">📝 {totalQs} سؤال</span>:<span className="pill pill-y">—</span>}</td><td>{hasPdf?<a href={SEC.safeUrl(l.pdf_url)} target="_blank" rel="noopener noreferrer" className="pill pill-b" style={{textDecoration:'none'}}>📄 PDF</a>:<span className="pill pill-y">—</span>}</td><td>{l.xp||'—'}</td><td>{l.published!==false?<span className="pill pill-g">منشور</span>:<span className="pill pill-y">مخفي</span>}</td><td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>duplicate(l)} title="نسخ"><Icon name="copy" size={13}/></button><button className="btn btn-s btn-sm" onClick={()=>openEdit(l)}><Icon name="edit" size={13}/></button><button className="btn btn-dn btn-sm" onClick={()=>del(l.id)}><Icon name="trash" size={13}/></button></div></td></tr>;})}

          {currentLessonExams.map(e=><div key={e.id} className="flex between center mb6" style={{padding:'8px 12px',background:'rgba(34,197,94,.06)',borderRadius:10,border:'1px solid rgba(34,197,94,.20)'}}>
            <div style={{flex:1,minWidth:0}}><div className="sm" style={{fontWeight:700}}>📋 {SEC.esc(e.title)}</div><div className="xs muted">⏱ {e.duration}د • 🎯 {e.pass_score}% • ❓ {(e.question_ids||[]).length}</div></div>
            <button className="btn btn-dn btn-sm" onClick={async()=>{const r=await Swal.fire({title:'حذف؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;const qIds=e.question_ids||[];if(qIds.length>0)await DB.removeMany('questions',qIds);await DB.remove('exams',e.id);await app.reload();app.toast.ok('تم');}}><Icon name="trash" size={12}/></button>
          </div>)}
        </div>}
        <div className="grid g2">
          <Field label="اسم الاختبار"><input className="input" value={lessonTestTitle} onChange={e=>setLessonTestTitle(e.target.value)}/></Field>
          <Field label="المدة"><input type="number" className="input" value={lessonTestDuration} onChange={e=>setLessonTestDuration(e.target.value===''?'':+e.target.value)}/></Field>
          <Field label="درجة النجاح %"><input type="number" className="input" value={lessonTestPassScore} onChange={e=>setLessonTestPassScore(e.target.value===''?'':+e.target.value)}/></Field>
          <Field label="XP"><input type="number" className="input" value={lessonTestXp} onChange={e=>setLessonTestXp(e.target.value===''?'':+e.target.value)}/></Field>
        </div>
        <Field label="نوع الاختبار"><AccessToggle value={lessonTestFree} onChange={setLessonTestFree}/></Field>
        <Field label="إضافة أسئلة (الصق كود JSON)"><textarea className="input" rows="14" dir="ltr" value={lessonTestText} onChange={e=>setLessonTestText(e.target.value)} placeholder={'[\n  {\n    "question": "A person who takes care of patients in a hospital is usually a ______.",\n    "options": { "A": "mechanic", "B": "nurse", "C": "architect", "D": "pilot" },\n    "correct": "B",\n    "explanation": "A nurse cares for patients."\n  }\n]'} style={{fontFamily:'monospace',fontSize:12,textAlign:'left',minHeight:220}}/></Field>
        <div className="flex g8 mb12"><button className="btn btn-s" onClick={previewTest} disabled={!lessonTestText.trim()} style={{flex:1}}>👁️ معاينة</button><button className="btn btn-p" onClick={createTestForLesson} disabled={lessonTestBusy} style={{flex:2}}>{lessonTestBusy?'جارٍ...':'⚡ إنشاء الاختبار'}</button></div>
      </>}
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
    {previewQs&&<Modal title={`👁️ معاينة (${previewQs.length})`} onClose={()=>setPreviewQs(null)} wide>
      <div style={{maxHeight:'60vh',overflowY:'auto'}}>{previewQs.map((q,idx)=><div key={idx} className="glass-s mb12" style={{padding:14}}><div className="flex between center mb10"><span className="pill pill-b">سؤال {idx+1}</span>{q.xp>0&&<span className="pill pill-g">+{q.xp} XP</span>}</div><div className="sm mb10" style={{fontWeight:700,whiteSpace:'pre-wrap'}}>{SEC.esc(q.text)}</div><div className="flex col g6 mb10">{q.options.map((opt,oi)=>{const isCorrect=q.correct===oi;return <div key={oi} className="flex center g8" style={{padding:'6px 10px',borderRadius:8,background:isCorrect?'rgba(34,197,94,.10)':'rgba(255,255,255,.03)',border:`1px solid ${isCorrect?'rgba(34,197,94,.4)':'var(--border)'}`}}><span style={{width:24,height:24,borderRadius:'50%',display:'grid',placeItems:'center',background:isCorrect?'#22c55e':'rgba(255,255,255,.06)',fontWeight:800,fontSize:11,flexShrink:0}}>{['A','B','C','D'][oi]}</span><span className="sm" style={{flex:1}}>{SEC.esc(opt)}</span></div>;})}</div>{q.explanation&&<div className="xs" style={{background:'var(--border)',padding:8,borderRadius:8,borderInlineStart:'2px solid var(--gold)'}}>💡 {SEC.esc(q.explanation)}</div>}</div>)}</div>
      <button className="btn btn-p btn-block" onClick={()=>setPreviewQs(null)}>رجوع</button>
    </Modal>}
  </>;
}

function ExamsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);const [form,setForm]=useState({});const [busy,setBusy]=useState(false);const [jsonText,setJsonText]=useState('');
  const [editingQ,setEditingQ]=useState(null);const [qForm,setQForm]=useState({text:'',options:['','','',''],correct:0,explanation:''});const [qBusy,setQBusy]=useState(false);
  const openNew=()=>{setForm({title:'',subject_id:'',unit_id:'',lesson_ids:[],question_ids:[],duration:'',pass_score:'',max_attempts:'',xp:'',published:true,sort_order:'',is_free:true});setJsonText('');setEditing('new');};
  const openEdit=it=>{const c=JSON.parse(JSON.stringify(it));if(c.is_free===undefined)c.is_free=true;if(c.max_attempts===undefined)c.max_attempts='';setForm(c);setJsonText('');setEditing(it.id);};
  const duplicate = (it) => {const c=JSON.parse(JSON.stringify(it));delete c.id;c.title = `${c.title} (نسخة)`;setForm(c);setEditing('new');app.toast.info('تم نسخ الاختبار.');};
  const parseQuestionJSON=raw=>{
    let parsed;try{parsed=JSON.parse(raw);}catch(e){throw new Error('صيغة JSON غير صحيحة.');}
    const list=Array.isArray(parsed)?parsed:(Array.isArray(parsed?.questions)?parsed.questions:(Array.isArray(parsed?.data)?parsed.data:null));
    if(!list||!list.length)throw new Error('لا توجد أسئلة.');
    return list.map((item,i)=>{
      if(!item||typeof item!=='object'||Array.isArray(item))throw new Error(`السؤال ${i+1} غير صالح.`);
      const text=String(item.question??item.text??item.title??'').trim();
      const source=item.options??item.choices??item.answers;
      let options;
      if(Array.isArray(source))options=source.map(v=>String(v??'').trim());
      else if(source&&typeof source==='object')options=['A','B','C','D'].map((k)=>String(source[k]??source[k.toLowerCase()]??source[['أ','ب','ج','د'][['A','B','C','D'].indexOf(k)]]??'').trim());
      else options=[];
      if(!text)throw new Error(`نص السؤال ${i+1} فارغ.`);
      if(options.length<2||options.some(v=>!v))throw new Error(`اختيارات ${i+1} ناقصة.`);
      if(options.length>4)options=options.slice(0,4);
      const rawCorrect=item.correct??item.answer??item.correct_answer??item.correctAnswer;
      if(rawCorrect===undefined||rawCorrect===null||String(rawCorrect).trim()==='')throw new Error(`الإجابة الصحيحة ${i+1} غير محددة.`);
      let correct=-1;
      if(typeof rawCorrect==='number'||/^\d+$/.test(String(rawCorrect).trim())){const n=Number(rawCorrect);correct=(n>=0&&n<options.length)?n:(n>=1&&n<=options.length?n-1:-1);}else{const key=String(rawCorrect).trim();const letterMap={'A':0,'B':1,'C':2,'D':3,'a':0,'b':1,'c':2,'d':3,'أ':0,'ب':1,'ج':2,'د':3};if(Object.prototype.hasOwnProperty.call(letterMap,key))correct=letterMap[key];else correct=options.findIndex(o=>o.toLowerCase()===key.toLowerCase());}
      if(correct<0||correct>=options.length)throw new Error(`الإجابة الصحيحة ${i+1} لا تطابق.`);
      return {text,options,correct,explanation:String(item.explanation??item.rationale??item.feedback??'').trim(),difficulty:String(item.difficulty||'medium'),xp:Number(item.xp)||0};
    });
  };
  const save=async()=>{
    if(!String(form.title||'').trim()||!form.subject_id)return app.toast.warn('العنوان والمادة مطلوبان');
    let parsedQuestions=[];
    if(jsonText.trim()){try{parsedQuestions=parseQuestionJSON(jsonText.trim());}catch(e){return app.toast.err(e.message,'راجع JSON');}}
    if(!(form.question_ids||[]).length&&!parsedQuestions.length)return app.toast.warn('اختر سؤالاً أو الصق أسئلة JSON');
    setBusy(true);const createdIds=[];
    try{
      for(const q of parsedQuestions){const id=DB.uid('q_');createdIds.push(id);await DB.save('questions',{id,text:q.text,options:q.options,correct:[q.correct],explanation:q.explanation,lesson_id:null,unit_id:form.unit_id||null,subject_id:form.subject_id,difficulty:q.difficulty,xp:q.xp,type:'mcq'});}
      const maxAttempts=form.max_attempts===''||form.max_attempts===null||form.max_attempts===undefined?0:Number(form.max_attempts)||0;
      const exam={...form,title:String(form.title).trim(),max_attempts:maxAttempts,question_ids:[...new Set([...(form.question_ids||[]),...createdIds])]};
      await DB.save('exams',exam);
      await app.reload();
      app.toast.ok(`تم حفظ الاختبار${createdIds.length?` وإضافة ${createdIds.length} سؤالاً`:''}`);
      setEditing(null);setJsonText('');
    }catch(e){for(const id of createdIds){try{await DB.remove('questions',id);}catch(_){}}await app.reload();app.toast.err(e.message||'تعذر حفظ الاختبار');}finally{setBusy(false);}
  };
  const del=async id=>{const exam=app.db.exams.find(e=>e.id===id);if(!exam)return;const qCount=(exam.question_ids||[]).length;const r=await Swal.fire({title:'حذف؟',html:`سيتم حذف الاختبار و ${qCount} سؤال`,icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{const qIds=exam.question_ids||[];if(qIds.length>0)await DB.removeMany('questions',qIds);await DB.remove('exams',id);await app.reload();app.toast.ok('تم');}catch(e){app.toast.err(e.message);}};
  const openEditQ=q=>{const correctRaw=Array.isArray(q.correct)?q.correct[0]:(typeof q.correct==='number'?q.correct:0);const opts=Array.isArray(q.options)?[...q.options]:['','','',''];while(opts.length<4)opts.push('');setQForm({text:q.text||q.question||'',options:opts.slice(0,4),correct:Number(correctRaw)||0,explanation:q.explanation||''});setEditingQ(q.id);};
  const saveQ=async()=>{if(!qForm.text.trim())return app.toast.warn('نص السؤال مطلوب');if(qForm.options.some(o=>!String(o).trim()))return app.toast.warn('جميع الاختيارات مطلوبة');setQBusy(true);try{const existing=app.question(editingQ)||{};await app.save('questions',{...existing,text:qForm.text.trim(),options:qForm.options.map(o=>String(o).trim()),correct:[Number(qForm.correct)],explanation:(qForm.explanation||'').trim()});app.toast.ok('تم');setEditingQ(null);}catch(e){app.toast.err(e.message);}setQBusy(false);};
  const removeQFromExam=async qId=>{const r=await Swal.fire({title:'حذف السؤال؟',icon:'warning',showCancelButton:true,showDenyButton:true,confirmButtonText:'حذف نهائي',denyButtonText:'إزالة فقط',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',denyButtonColor:'#D4AF37',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed&&!r.isDenied)return;try{const updatedIds=(form.question_ids||[]).filter(id=>id!==qId);await app.save('exams',{...form,question_ids:updatedIds});setForm(f=>({...f,question_ids:updatedIds}));if(r.isConfirmed)await app.remove('questions',qId);app.toast.ok('تم');}catch(e){app.toast.err(e.message);}};
  const availQ=form.unit_id?app.db.questions.filter(q=>q.unit_id===form.unit_id):app.db.questions;
  const currentQuestions=(form.question_ids||[]).map(id=>app.question(id)).filter(Boolean);
  const attemptsLabel=e=>{const n=Number(e.max_attempts)||0;return n>0?`${n}`:'∞';};
  return <>
    <div className="flex between center mb16 wrap g8"><div className="h2 grad">📝 الاختبارات</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> جديد</button></div>
    <div className="glass" style={{padding:14}}>{app.db.exams.length===0?<Empty title="لا اختبارات"/>:<div className="sx"><table className="tbl"><thead><tr><th>العنوان</th><th>المادة</th><th>الأسئلة</th><th>المحاولات</th><th>الوصول</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>{app.db.exams.map(e=><tr key={e.id}><td><b>{SEC.esc(e.title)}</b></td><td className="sm">{SEC.esc(app.subject(e.subject_id)?.name||'—')}</td><td>{(e.question_ids||[]).length}</td><td><span className="pill pill-b">{attemptsLabel(e)}</span></td><td><AccessBadge value={e.is_free}/></td><td>{e.published!==false?<span className="pill pill-g">منشور</span>:<span className="pill pill-y">مخفي</span>}</td><td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>duplicate(e)} title="نسخ"><Icon name="copy" size={13}/></button><button className="btn btn-s btn-sm" onClick={()=>openEdit(e)}><Icon name="edit" size={13}/></button><button className="btn btn-dn btn-sm" onClick={()=>del(e.id)}><Icon name="trash" size={13}/></button></div></td></tr>)}</tbody></table></div>}</div>
    {editing!==null&&<Modal title={editing==='new'?'جديد':'تعديل'} onClose={()=>setEditing(null)} wide>
      <Field label="الاسم"><input className="input" value={form.title||''} onChange={e=>setForm({...form,title:e.target.value})}/></Field>
      <div className="grid g2">
        <Field label="المادة"><select className="input" value={form.subject_id||''} onChange={e=>setForm({...form,subject_id:e.target.value,unit_id:''})}><option value="">— اختر —</option>{app.db.subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
        <Field label="الوحدة"><select className="input" value={form.unit_id||''} onChange={e=>setForm({...form,unit_id:e.target.value,question_ids:[]})}><option value="">— اختر —</option>{app.db.units.filter(u=>!form.subject_id||u.subject_id===form.subject_id).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
        <Field label="المدة بالدقائق"><input type="number" className="input" value={form.duration??''} onChange={e=>setForm({...form,duration:e.target.value===''?'':+e.target.value})}/></Field>
        <Field label="درجة النجاح %"><input type="number" className="input" value={form.pass_score??''} onChange={e=>setForm({...form,pass_score:e.target.value===''?'':+e.target.value})}/></Field>
        <Field label="عدد المحاولات" hint="اتركه 0 أو فارغ = غير محدود"><input type="number" min="0" className="input" value={form.max_attempts??''} onChange={e=>setForm({...form,max_attempts:e.target.value===''?'':+e.target.value})} placeholder="0 = غير محدود"/></Field>
        <Field label="XP"><input type="number" className="input" value={form.xp??''} onChange={e=>setForm({...form,xp:e.target.value===''?'':+e.target.value})}/></Field>
        <Field label="الحالة"><select className="input" value={form.published!==false?'1':'0'} onChange={e=>setForm({...form,published:e.target.value==='1'})}><option value="1">منشور</option><option value="0">مخفي</option></select></Field>
      </div>
      <Field label="نوع الوصول"><AccessToggle value={form.is_free} onChange={v=>setForm({...form,is_free:v})}/></Field>
      <div className="glass-s mb12" style={{padding:14,borderColor:'var(--border2)'}}>
        <div className="h4 mb8">⚡ إضافة أسئلة بكود JSON</div>
        <textarea className="input" rows="9" dir="ltr" value={jsonText} onChange={e=>setJsonText(e.target.value)} placeholder={'[\n  {\n    "question": "ما ناتج 2 + 2؟",\n    "options": { "A": "3", "B": "4", "C": "5", "D": "6" },\n    "correct": "B",\n    "explanation": "لأن 2 + 2 = 4"\n  }\n]'} style={{fontFamily:'monospace',fontSize:12,textAlign:'left',minHeight:180}}/>
      </div>
      <Field label={`الأسئلة الحالية (${currentQuestions.length})`}>
        <div className="glass-s" style={{padding:10,maxHeight:400,overflowY:'auto'}}>
          {currentQuestions.length===0?<div className="sm muted">لا أسئلة بعد.</div>:
          currentQuestions.map((q,idx)=>{const correctArr=Array.isArray(q.correct)?q.correct:[q.correct];const correctIdx=Number(correctArr[0])||0;return <div key={q.id} style={{padding:10,borderBottom:'1px solid var(--border)'}}><div className="flex between center mb6"><span className="pill pill-b" style={{fontSize:10}}>{idx+1}</span><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>openEditQ(q)}><Icon name="edit" size={12}/></button><button className="btn btn-dn btn-sm" onClick={()=>removeQFromExam(q.id)}><Icon name="trash" size={12}/></button></div></div><div className="sm" style={{fontWeight:700,marginBottom:6}}>{SEC.esc(String(q.text||'').slice(0,100))}</div><div className="flex wrap g6">{(q.options||[]).map((opt,oi)=><span key={oi} className="xs" style={{padding:'2px 8px',borderRadius:20,background:oi===correctIdx?'rgba(34,197,94,.18)':'rgba(255,255,255,.04)',color:oi===correctIdx?'#6ee7a0':'var(--muted)',border:`1px solid ${oi===correctIdx?'rgba(34,197,94,.4)':'var(--border)'}`}}>{['A','B','C','D'][oi]}. {SEC.esc(String(opt).slice(0,30))}</span>)}</div>{q.explanation&&<div className="xs muted mt6">💡 {SEC.esc(String(q.explanation).slice(0,120))}</div>}</div>;})}
        </div>
      </Field>
      <Field label={`إضافة من البنك (${availQ.filter(q=>!(form.question_ids||[]).includes(q.id)).length} متاح)`}>
        <div className="glass-s" style={{padding:10,maxHeight:260,overflowY:'auto'}}>
          {availQ.filter(q=>!(form.question_ids||[]).includes(q.id)).length===0?<div className="sm muted">لا أسئلة إضافية.</div>:
          availQ.filter(q=>!(form.question_ids||[]).includes(q.id)).map(q=>(<label key={q.id} className="flex center g8 mb6" style={{padding:6,cursor:'pointer'}}><input type="checkbox" checked={false} onChange={()=>setForm({...form,question_ids:[...(form.question_ids||[]),q.id]})}/><span className="sm" style={{flex:1}}>{SEC.esc(String(q.text||'').slice(0,80))}</span></label>))}
        </div>
      </Field>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ الحفظ...':'💾 حفظ الاختبار'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
    {editingQ&&<Modal title="✏️ تعديل السؤال" onClose={()=>setEditingQ(null)} wide>
      <Field label="نص السؤال"><textarea className="input" rows="3" value={qForm.text} onChange={e=>setQForm({...qForm,text:e.target.value})}/></Field>
      <div className="grid g2">{['A','B','C','D'].map((letter,i)=>(<Field key={letter} label={`الاختيار ${letter}`}><div className="flex center g8"><input type="radio" name="correct_option" checked={qForm.correct===i} onChange={()=>setQForm({...qForm,correct:i})} style={{width:18,height:18,accentColor:'#D4AF37'}}/><input className="input" value={qForm.options[i]||''} onChange={e=>setQForm({...qForm,options:qForm.options.map((o,oi)=>oi===i?e.target.value:o)})}/></div></Field>))}</div>
      <Field label="الشرح (اختياري)"><textarea className="input" rows="3" value={qForm.explanation||''} onChange={e=>setQForm({...qForm,explanation:e.target.value})}/></Field>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={saveQ} disabled={qBusy}>{qBusy?'جارٍ...':'💾 حفظ التعديل'}</button><button className="btn btn-s" onClick={()=>setEditingQ(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

function MissionsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);const [form,setForm]=useState({});const [busy,setBusy]=useState(false);
  const openNew=()=>{setForm({title:'',desc:'',subject_id:'',required_lessons:[],required_exam_id:'',xp:'',sort_order:''});setEditing('new');};
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};
  const save=async()=>{if(!form.title)return app.toast.warn('العنوان مطلوب');if(!form.subject_id)return app.toast.warn('اختر المادة');setBusy(true);try{await app.save('missions',form);app.toast.ok('تم');setEditing(null);}catch(e){app.toast.err(e.message);}setBusy(false);};
  const del=async id=>{const r=await Swal.fire({title:'حذف؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{await app.remove('missions',id);app.toast.warn('تم');}catch(e){app.toast.err(e.message);}};
  return <>
    <div className="flex between center mb16"><div className="h2 grad">🎯 المهام</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> جديد</button></div>
