function ErrorsAnalyticsPage(){
  const app=useApp();
  const [filterSubject,setFilterSubject]=useState('all');
  const [filterLesson,setFilterLesson]=useState('all');
  const [sortBy,setSortBy]=useState('count');
  const [loading,setLoading]=useState(true);
  const [allErrors,setAllErrors]=useState([]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sb=await DB.getClient();
        const {data}=await sb.from('user_errors').select('*').limit(2000);
        setAllErrors(data||[]);
      }catch(e){
        console.warn('فشل تحميل الأخطاء:',e);
      }
      setLoading(false);
    })();
  },[]);

  const groupedByQuestion = useMemo(()=>{
    const map={};
    allErrors.forEach(err=>{
      const qid = err.question_id;
      if(!qid) return;
      if(!map[qid]){
        map[qid] = {
          question_id: qid,
          total_errors: 0,
          unique_students: new Set(),
          last_error_at: 0
        };
      }
      map[qid].total_errors += (err.count || 1);
      map[qid].unique_students.add(err.user_id);
      if(err.at && err.at > map[qid].last_error_at){
        map[qid].last_error_at = err.at;
      }
    });

    return Object.values(map).map(item=>{
      const q = app.question(item.question_id);
      const lesson = q ? app.lesson(q.lesson_id) : null;
      const unit = lesson ? app.unit(lesson.unit_id) : null;
      const subject = unit ? app.subject(unit.subject_id) : null;
      return {
        ...item,
        question: q,
        lesson,
        unit,
        subject,
        studentsCount: item.unique_students.size
      };
    }).filter(x=>x.question);
  },[allErrors, app.db.questions, app.db.lessons, app.db.units, app.db.subjects]);

  const filtered = useMemo(()=>{
    let list = [...groupedByQuestion];

    if(filterSubject !== 'all'){
      list = list.filter(x=>x.subject?.id === filterSubject);
    }
    if(filterLesson !== 'all'){
      list = list.filter(x=>x.lesson?.id === filterLesson);
    }

    if(sortBy === 'count'){
      list.sort((a,b)=>b.total_errors - a.total_errors);
    } else if(sortBy === 'students'){
      list.sort((a,b)=>b.studentsCount - a.studentsCount);
    } else if(sortBy === 'recent'){
      list.sort((a,b)=>b.last_error_at - a.last_error_at);
    }

    return list;
  },[groupedByQuestion, filterSubject, filterLesson, sortBy]);

  const stats = useMemo(()=>{
    const totalErrors = groupedByQuestion.reduce((s,x)=>s+x.total_errors,0);
    const totalQuestions = groupedByQuestion.length;
    const worstQuestion = groupedByQuestion[0];
    return {totalErrors, totalQuestions, worstQuestion};
  },[groupedByQuestion]);

  const availableLessons = useMemo(()=>{
    if(filterSubject === 'all') return app.db.lessons;
    return app.db.lessons.filter(l=>{
      const u = app.unit(l.unit_id);
      return u?.subject_id === filterSubject;
    });
  },[filterSubject, app.db.lessons]);

  const exportErrorsCSV=()=>{
    const headers=["السؤال","المادة","الدرس","عدد الأخطاء","عدد الطلاب"];
    const rows=filtered.map(x=>[
      x.question.text,
      x.subject?.name||'—',
      x.lesson?.title||'—',
      x.total_errors,
      x.studentsCount
    ]);
    const csv=[headers,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`errors_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    app.toast.ok("تم تصدير الأخطاء");
  };

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">📊 تحليل أخطاء الطلاب</div>
        <div className="sm muted mt6">اكتشف الأسئلة الصعبة وحسّن المحتوى</div>
      </div>
      <div className="flex g8">
        <button className="btn btn-s" onClick={exportErrorsCSV} disabled={filtered.length===0}>
          <Icon name="file" size={14}/> تصدير CSV
        </button>
        <button className="btn btn-s" onClick={()=>window.location.reload()}>
          🔄 تحديث
        </button>
      </div>
    </div>

    <div className="grid g3 mb16">
      <Stat label="إجمالي الأخطاء" value={DB.fmt(stats.totalErrors)} icon="alert" color="#ef4444"/>
      <Stat label="أسئلة فيها أخطاء" value={DB.fmt(stats.totalQuestions)} icon="help" color="#f59e0b"/>
      <Stat
        label="أصعب سؤال"
        value={stats.worstQuestion ? `${stats.worstQuestion.total_errors} خطأ` : '—'}
        icon="trophy"
        color="#ef4444"
        sub={stats.worstQuestion?.question?.text?.slice(0,40)+'...'}
      />
    </div>

    <div className="glass mb16" style={{padding:14}}>
      <div className="flex wrap g8 center">
        <div style={{flex:'1 1 200px'}}>
          <label className="lbl">المادة</label>
          <select className="input" value={filterSubject} onChange={e=>{setFilterSubject(e.target.value);setFilterLesson('all');}}>
            <option value="all">كل المواد</option>
            {app.db.subjects.map(s=><option key={s.id} value={s.id}>{s.icon} {s.name}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 200px'}}>
          <label className="lbl">الدرس</label>
          <select className="input" value={filterLesson} onChange={e=>setFilterLesson(e.target.value)}>
            <option value="all">كل الدروس</option>
            {availableLessons.map(l=><option key={l.id} value={l.id}>{l.title}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 200px'}}>
          <label className="lbl">الترتيب حسب</label>
          <select className="input" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
            <option value="count">عدد الأخطاء</option>
            <option value="students">عدد الطلاب</option>
            <option value="recent">الأحدث</option>
          </select>
        </div>
      </div>
    </div>

    <div className="glass" style={{padding:14}}>
      {loading ? (
        <div style={{textAlign:'center',padding:40}}>
          <div className="spinner" style={{margin:'0 auto 14px'}}></div>
          جارٍ تحميل بيانات الأخطاء...
        </div>
      ) : filtered.length === 0 ? (
        <Empty icon="✨" title="لا توجد أخطاء" desc="لم يسجل الطلاب أي أخطاء بعد"/>
      ) : (
        <div className="sx">
          <table className="tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>السؤال</th>
                <th>المادة</th>
                <th>الدرس</th>
                <th>عدد الأخطاء</th>
                <th>عدد الطلاب</th>
                <th>آخر خطأ</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((x, idx) => (
                <tr key={x.question_id}>
                  <td>
                    <span className={`rank ${idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'rank-x'}`} style={{width:28,height:28,fontSize:12}}>
                      {idx+1}
                    </span>
                  </td>
                  <td style={{maxWidth:380}}>
                    <div className="sm" style={{fontWeight:700}}>{x.question.text.slice(0,100)}{x.question.text.length>100?'...':''}</div>
                    <div className="xs muted mt6">
                      💡 {x.question.explanation?.slice(0,60)}...
                    </div>
                  </td>
                  <td>
                    {x.subject ? <span className="pill pill-b" style={{fontSize:11}}>{x.subject.icon} {x.subject.name}</span> : <span className="xs muted">—</span>}
                  </td>
                  <td className="sm">{x.lesson?.title || '—'}</td>
                  <td>
                    <span className="pill pill-r" style={{fontWeight:800}}>{x.total_errors}</span>
                  </td>
                  <td>
                    <span className="pill pill-a">{x.studentsCount} طالب</span>
                  </td>
                  <td className="xs muted">
                    {x.last_error_at ? DB.formatDateTime(x.last_error_at) : '—'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  </>;
}

      <div style="display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:0 40px">
        <div style="text-align:center;min-width:180px">
          <div style="font-size:12px;color:#8a7d55;letter-spacing:2px;margin-bottom:10px;font-weight:700">تاريخ الإصدار</div>
          <div style="font-size:16px;color:#d4c79a;font-weight:800">${issueDate}</div>
          <div style="width:130px;height:1px;background:#D4AF37;margin:10px auto 0;opacity:.6"></div>
        </div>

        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid #D4AF37;box-shadow:0 0 24px rgba(212,175,55,.5)"></div>
          <div style="position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(212,175,55,.8)"></div>
          <div style="position:relative;text-align:center;color:#FFD700">
            <div style="font-size:10px;letter-spacing:2px;font-weight:800">OFFICIAL</div>
            <div style="font-size:26px;font-weight:900;line-height:1;margin:4px 0;color:#FFF3B0">✦</div>
            <div style="font-size:9px;letter-spacing:1.5px;font-weight:800">MISSION EDU</div>
          </div>
        </div>

        <div style="text-align:center;min-width:180px">
          <div style="font-size:12px;color:#8a7d55;letter-spacing:2px;margin-bottom:10px;font-weight:700">رقم الشهادة</div>
          <div style="font-size:14px;color:#d4c79a;font-weight:800;font-family:monospace;direction:ltr">${certNumber}</div>
          <div style="width:130px;height:1px;background:#D4AF37;margin:10px auto 0;opacity:.6"></div>
        </div>
      </div>

      <div style="text-align:center;margin-top:24px">
        <div style="font-size:22px;font-weight:900;color:#FFD700;font-style:italic">MISSION EDU</div>
        <div style="width:160px;height:1px;background:#D4AF37;margin:8px auto;opacity:.6"></div>
        <div style="font-size:11px;color:#8a7d55;letter-spacing:2px">التوقيع الرسمي</div>
      </div>
    `;

    document.body.appendChild(container);

    try{
      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 1000));

      const canvas = await window.html2canvas(container, {
        scale: 2,
        backgroundColor: '#0a0805',
        useCORS: true,
        logging: false
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
      pdf.save(`شهادة_${subject?.name||'مادة'}.pdf`);
      app.toast.ok('تم تحميل الشهادة');
    }catch(e){ console.error(e); app.toast.err('فشل توليد الشهادة'); }
    finally{ document.body.removeChild(container); }
  };

  const del = async id => {
    const r = await Swal.fire({
      title:'حذف الشهادة؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb = await DB.getClient();
      await sb.from('certificates').delete().eq('id',id);
      setCerts(x=>x.filter(c=>c.id!==id));
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };

  const downloadAgain = (cert) => {
    const student = app.db.users.find(u=>u.id===cert.user_id);
    const subject = app.db.subjects.find(s=>s.id===cert.subject_id);
    generatePDF(student, subject, cert);
  };

  return <>
    <div className="h2 mb16 grad">🏆 إدارة الشهادات</div>

    <div className="glass mb16" style={{padding:20}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>➕ إصدار شهادة جديدة</div>
      <div className="grid g2">
        <Field label="الطالب">
          <select className="input" value={studentId} onChange={e=>setStudentId(e.target.value)}>
            <option value="">— اختر الطالب —</option>
            {students.map(s=><option key={s.id} value={s.id}>{s.name} — {(s.country_code||'+20')}{s.phone}</option>)}
          </select>
        </Field>
        <Field label="المادة">
          <select className="input" value={subjectId} onChange={e=>setSubjectId(e.target.value)}>
            <option value="">— اختر المادة —</option>
            {app.db.subjects.map(s=><option key={s.id} value={s.id}>{s.icon} {s.name}</option>)}
          </select>
        </Field>
      </div>
      <button className="btn btn-p btn-block" onClick={issueCertificate} disabled={busy}>
        {busy?'جارٍ الإصدار...':'🏆 إصدار الشهادة + تحميل PDF'}
      </button>
    </div>

    <div className="glass" style={{padding:14}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📜 الشهادات الصادرة ({certs.length})</div>
      {loading ? (
        <div style={{textAlign:'center',padding:40}}>
          <div className="spinner" style={{margin:'0 auto 14px'}}></div>
          جارٍ التحميل...
        </div>
      ) : certs.length === 0 ? (
        <Empty icon="🏆" title="لا توجد شهادات" desc="ابدأ بإصدار شهادة من الأعلى"/>
      ) : (
        <div className="sx">
          <table className="tbl">
            <thead>
             <tr>
  <th>الطالب</th>
  <th>الهاتف</th>
  <th>📍 المحافظة</th>
  <th>XP</th>
  <th>💳 الاشتراك</th>
  <th>الحالة</th>
  <th>إجراءات</th>
</tr>
            </thead>
            <tbody>
              {certs.map(c => {
                const u = app.db.users.find(x=>x.id===c.user_id);
                const s = app.db.subjects.find(x=>x.id===c.subject_id);
                return <tr key={c.id}>
                  <td>
                    <div className="flex center g8">
                      <div className="avatar" style={{width:28,height:28,fontSize:12}}>{u?.avatar||'👤'}</div>
                      <span>{u?.name || 'طالب محذوف'}</span>
                    </div>
                  </td>
                  <td><span className="pill pill-b">{s?.icon} {s?.name||'—'}</span></td>
                  <td className="xs muted">{DB.formatDateTime(c.issued_at)}</td>
                  <td className="xs" dir="ltr" style={{fontFamily:'monospace'}}>{c.id.slice(-12).toUpperCase()}</td>
                  <td>
                    <div className="flex g6">
                      <button className="btn btn-s btn-sm" onClick={()=>downloadAgain(c)} title="تحميل PDF">
                        <Icon name="download" size={13}/>
                      </button>
                      <button className="btn btn-dn btn-sm" onClick={()=>del(c.id)}>
                        <Icon name="trash" size={13}/>
                      </button>
                    </div>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  </>;
}

function CouponsPage(){
  const app=useApp();
  const [loading,setLoading]=useState(true);
  const [coupons,setCoupons]=useState([]);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({code:'',discount:10,max_uses:100,expires_at:'',active:true});
  const [busy,setBusy]=useState(false);

  const loadCoupons = useCallback(async ()=>{
    try{
      const sb = await DB.getClient();
      const { data } = await sb.from('coupons').select('*').order('created_at',{ascending:false});
      setCoupons(data||[]);
    }catch(e){console.warn(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{ loadCoupons(); },[loadCoupons]);

  const openNew = () => {
    setForm({code:'',discount:10,max_uses:100,expires_at:'',active:true});
    setEditing('new');
  };
  const openEdit = (c) => {
    setForm({...c, expires_at: c.expires_at ? new Date(c.expires_at).toISOString().slice(0,10) : ''});
    setEditing(c.id);
  };

  const save = async () => {
    if(!form.code || form.code.length < 3) return app.toast.warn('الكود قصير');
    setBusy(true);
    try{
      const sb = await DB.getClient();
      const record = {
        id: editing==='new' ? DB.uid('cpn_') : editing,
        code: form.code.toUpperCase().trim(),
        discount: +form.discount || 10,
        max_uses: +form.max_uses || 100,
        used_count: form.used_count || 0,
        expires_at: form.expires_at ? new Date(form.expires_at).getTime() : null,
        active: form.active !== false,
        created_at: form.created_at || Date.now()
      };
      const { error } = await sb.from('coupons').upsert(record);
      if(error) throw new Error(error.message);
      await loadCoupons();
      app.toast.ok(editing==='new'?'تم إضافة الكوبون':'تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };

  const del = async id => {
    const r = await Swal.fire({
      title:'حذف الكوبون؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb = await DB.getClient();
      await sb.from('coupons').delete().eq('id',id);
      setCoupons(x=>x.filter(c=>c.id!==id));
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };

  const toggleActive = async (c) => {
    try{
      const sb = await DB.getClient();
      await sb.from('coupons').update({active:!c.active}).eq('id',c.id);
      setCoupons(x=>x.map(x=>x.id===c.id?{...x,active:!c.active}:x));
      app.toast.ok(c.active?'تم التعطيل':'تم التفعيل');
    }catch(e){app.toast.err(e.message);}
  };

  const copyCode = (code) => {
    try{
      navigator.clipboard.writeText(code);
      app.toast.ok('تم نسخ الكود');
    }catch(e){app.toast.err('فشل النسخ');}
  };

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">🎟️ كوبونات الخصم</div>
        <div className="sm muted mt6">أكواد خصم للطلاب عند التسجيل</div>
      </div>
      <button className="btn btn-p" onClick={openNew}>
        <Icon name="plus" size={15}/> كوبون جديد
      </button>
    </div>

    <div className="glass" style={{padding:14}}>
      {loading ? (
        <div style={{textAlign:'center',padding:40}}>
          <div className="spinner" style={{margin:'0 auto 14px'}}></div>
          جارٍ التحميل...
        </div>
      ) : coupons.length === 0 ? (
        <Empty icon="🎟️" title="لا توجد كوبونات" desc="ابدأ بإضافة كوبون جديد"/>
      ) : (
        <div className="sx">
          <table className="tbl">
            <thead>
              <tr>
                <th>الكود</th>
                <th>الخصم</th>
                <th>الاستخدامات</th>
                <th>الانتهاء</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>
              {coupons.map(c => {
                const expired = c.expires_at && c.expires_at < Date.now();
                const usedUp = (c.used_count||0) >= (c.max_uses||100);
                return <tr key={c.id}>
                  <td>
                    <div className="flex center g6">
                      <code style={{
                        background:'rgba(212,175,55,.15)',
                        padding:'4px 10px',borderRadius:8,
                        fontWeight:900,letterSpacing:1,
                        color:'#FFD700',fontSize:13
                      }}>{c.code}</code>
                      <button className="icon-btn" style={{width:28,height:28}} onClick={()=>copyCode(c.code)}>📋</button>
                    </div>
                  </td>
                  <td><span className="pill pill-g">{c.discount}%</span></td>
                  <td>
                    <span className="sm">{c.used_count||0} / {c.max_uses||100}</span>
                    <div className="bar mt6" style={{height:5}}>
                      <div className="bar-f" style={{width:`${Math.min(100,((c.used_count||0)/(c.max_uses||100))*100)}%`}}/>
                    </div>
                  </td>
                  <td className="xs muted">
                    {c.expires_at ? DB.formatDate(c.expires_at) : 'بلا نهاية'}
                    {expired && <div className="pill pill-r mt6" style={{fontSize:10}}>منتهي</div>}
                  </td>
                  <td>
                    {!c.active ? <span className="pill pill-y">معطّل</span>
                     : usedUp ? <span className="pill pill-a">استُنفد</span>
                     : expired ? <span className="pill pill-r">منتهي</span>
                     : <span className="pill pill-g">نشط</span>}
                  </td>
                  <td>
                    <div className="flex g6">
                      <button className="btn btn-s btn-sm" onClick={()=>toggleActive(c)}>
                        {c.active?'🚫':'✓'}
                      </button>
                      <button className="btn btn-s btn-sm" onClick={()=>openEdit(c)}>
                        <Icon name="edit" size={13}/>
                      </button>
                      <button className="btn btn-dn btn-sm" onClick={()=>del(c.id)}>
                        <Icon name="trash" size={13}/>
                      </button>
                    </div>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>

    {editing!==null && <Modal title={editing==='new'?'كوبون جديد':'تعديل الكوبون'} onClose={()=>setEditing(null)}>
      <Field label="الكود">
        <input
          className="input"
          value={form.code}
          onChange={e=>setForm({...form,code:e.target.value.toUpperCase()})}
          placeholder="SUMMER2025"
          style={{letterSpacing:2,fontWeight:900,textAlign:'center'}}
        />
      </Field>
      <div className="grid g2">
        <Field label="نسبة الخصم %">
          <input type="number" className="input" value={form.discount} onChange={e=>setForm({...form,discount:+e.target.value})} min="1" max="100"/>
        </Field>
        <Field label="الحد الأقصى للاستخدام">
          <input type="number" className="input" value={form.max_uses} onChange={e=>setForm({...form,max_uses:+e.target.value})}/>
        </Field>
      </div>
      <label className="flex center g8 mt12" style={{cursor:'pointer'}}>
        <input type="checkbox" checked={form.active!==false} onChange={e=>setForm({...form,active:e.target.checked})}/>
        <span className="sm">مفعّل</span>
      </label>
      <Field label="تاريخ الانتهاء (اختياري)">
        <input type="date" className="input" value={form.expires_at||''} onChange={e=>setForm({...form,expires_at:e.target.value})}/>
      </Field>
      <div className="flex g8 mt16">
        <button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button>
        <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
      </div>
    </Modal>}
  </>;
}

function ReferralsPage(){
  const app=useApp();
  const [loading,setLoading]=useState(true);
  const [referrals,setReferrals]=useState([]);

  const loadReferrals = useCallback(async ()=>{
    try{
      const sb = await DB.getClient();
      const { data } = await sb.from('referrals').select('*').order('created_at',{ascending:false}).limit(500);
      setReferrals(data||[]);
    }catch(e){console.warn(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{ loadReferrals(); },[loadReferrals]);

  const stats = useMemo(()=>{
    const total = referrals.length;
    const rewarded = referrals.filter(r=>r.rewarded).length;
    const totalXp = referrals.reduce((s,r)=>s+(r.reward_xp||50),0);
    return { total, rewarded, totalXp };
  },[referrals]);

  const topReferrers = useMemo(()=>{
    const map = {};
    referrals.forEach(r=>{
      const id = r.referrer_id;
      if(!id) return;
      if(!map[id]){
        map[id] = { user_id:id, count:0, rewarded:0, total_xp:0 };
      }
      map[id].count++;
      if(r.rewarded) map[id].rewarded++;
      map[id].total_xp += (r.reward_xp||50);
    });
    return Object.values(map).sort((a,b)=>b.count - a.count).slice(0,10);
  },[referrals]);

  const del = async id => {
    const r = await Swal.fire({
      title:'حذف الإحالة؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb = await DB.getClient();
      await sb.from('referrals').delete().eq('id',id);
      setReferrals(x=>x.filter(x=>x.id!==id));
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };

  const markRewarded = async (r) => {
    try{
      const sb = await DB.getClient();
      await sb.from('referrals').update({rewarded:true}).eq('id',r.id);
      setReferrals(x=>x.map(x=>x.id===r.id?{...x,rewarded:true}:x));

      const referrer = app.db.users.find(u=>u.id===r.referrer_id);
      const referred = app.db.users.find(u=>u.id===r.referred_id);
      const xp = r.reward_xp || 50;

      if(referrer) await DB.updateUser(referrer.id, { xp: (referrer.xp||0) + xp });
      if(referred) await DB.updateUser(referred.id, { xp: (referred.xp||0) + xp });

      await app.reload();
      app.toast.ok(`✅ تم توزيع ${xp} XP على الطالبين`);
    }catch(e){app.toast.err(e.message);}
  };

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">🎁 نظام الإحالة</div>
        <div className="sm muted mt6">إحصائيات دعوة الأصدقاء</div>
      </div>
      <button className="btn btn-s" onClick={loadReferrals}>🔄 تحديث</button>
    </div>

    <div className="grid g3 mb16">
      <Stat label="إجمالي الإحالات" value={DB.fmt(stats.total)} icon="share" color="#FFD700"/>
      <Stat label="إحالات مكافأة" value={DB.fmt(stats.rewarded)} icon="check" color="#22c55e"/>
      <Stat label="إجمالي XP الموزع" value={DB.fmt(stats.totalXp)} icon="trend" color="#B8860B"/>
    </div>

    <div className="glass mb16" style={{padding:18}}>
      <div className="h4 mb12" style={{display:'flex',alignItems:'center',gap:8,color:'var(--gold)'}}>
        <Icon name="trophy" size={16}/> أفضل 10 مُحيلين
      </div>
      {topReferrers.length === 0 ? (
        <div className="sm muted" style={{textAlign:'center',padding:20}}>لا يوجد مُحيلين بعد</div>
      ) : (
        topReferrers.map((r,i)=>{
          const u = app.db.users.find(x=>x.id===r.user_id);
          return <div key={r.user_id} className="flex center g12" style={{padding:'9px 0',borderBottom:'1px solid rgba(212,175,55,.08)'}}>
            <div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div>
            <div className="avatar" style={{width:34,height:34,fontSize:14}}>{u?.avatar||'👤'}</div>
            <div style={{flex:1}}>
              <div className="sm" style={{fontWeight:700}}>{u?.name || 'مستخدم محذوف'}</div>
              <div className="xs muted">📍 {u?.governorate || '—'}</div>
            </div>
            <div className="flex g6">
              <span className="pill pill-b">{r.count} إحالة</span>
              <span className="pill pill-g">{r.rewarded} مكافأة</span>
            </div>
          </div>;
        })
      )}
    </div>

    <div className="glass" style={{padding:14}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📋 سجل الإحالات</div>
      {loading ? (
        <div style={{textAlign:'center',padding:40}}>
          <div className="spinner" style={{margin:'0 auto 14px'}}></div>
          جارٍ التحميل...
        </div>
      ) : referrals.length === 0 ? (
        <Empty icon="🎁" title="لا توجد إحالات" desc="لم يقم أي طالب بدعوة أصدقاء بعد"/>
      ) : (
        <div className="sx">
          <table className="tbl">
            <thead>
              <tr>
                <th>المُحيل</th>
                <th>→</th>
                <th>المدعو</th>
                <th>التاريخ</th>
                <th>المكافأة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>
              {referrals.map(r => {
                const referrer = app.db.users.find(x=>x.id===r.referrer_id);
                const referred = app.db.users.find(x=>x.id===r.referred_id);
                return <tr key={r.id}>
                  <td>
                    <div className="flex center g8">
                      <div className="avatar" style={{width:28,height:28,fontSize:12}}>{referrer?.avatar||'👤'}</div>
                      <span className="sm">{referrer?.name || 'محذوف'}</span>
                    </div>
                  </td>
                  <td className="muted">→</td>
                  <td>
                    <div className="flex center g8">
                      <div className="avatar" style={{width:28,height:28,fontSize:12}}>{referred?.avatar||'👤'}</div>
                      <span className="sm">{referred?.name || 'محذوف'}</span>
                    </div>
                  </td>
                  <td className="xs muted">{DB.formatDateTime(r.created_at)}</td>
                  <td>
                    {r.rewarded
                      ? <span className="pill pill-g">✓ +{r.reward_xp||50} XP</span>
                      : <span className="pill pill-a">⏳ بانتظار</span>}
                  </td>
                  <td>
                    <div className="flex g6">
                      {!r.rewarded && (
                        <button className="btn btn-ok btn-sm" onClick={()=>markRewarded(r)}>
                          ✓ منح
                        </button>
                      )}
                      <button className="btn btn-dn btn-sm" onClick={()=>del(r.id)}>
                        <Icon name="trash" size={13}/>
                      </button>
                    </div>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  </>;
}
function PollsPage(){
  const app=useApp();
  const [loading,setLoading]=useState(true);
  const [polls,setPolls]=useState([]);
  const [votes,setVotes]=useState([]);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({question:'',options:['',''],active:true,allow_multiple:false,ends_at:''});
  const [busy,setBusy]=useState(false);
  const [expandedPoll,setExpandedPoll]=useState(null);

  const loadData = useCallback(async ()=>{
    try{
      const deleted = await DB.cleanupExpiredPolls();
      if(deleted > 0) console.log(`🗑️ حذف ${deleted} استطلاع منتهي`);

      const sb = await DB.getClient();
      const [pRes, vRes] = await Promise.all([
        sb.from('polls').select('*').order('created_at',{ascending:false}),
        sb.from('poll_votes').select('*')
      ]);
      setPolls(pRes.data || []);
      setVotes(vRes.data || []);
    }catch(e){console.warn(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{ loadData(); },[loadData]);

  const openNew = () => {
    setForm({question:'',options:['',''],active:true,allow_multiple:false,ends_at:''});
    setEditing('new');
  };

  const openEdit = (p) => {
    setForm({
      ...p,
      options: Array.isArray(p.options) ? [...p.options] : ['',''],
      ends_at: p.ends_at ? new Date(p.ends_at).toISOString().slice(0,10) : ''
    });
    setEditing(p.id);
  };

  const addOption = () => setForm(f => ({...f, options:[...f.options, '']}));
  const removeOption = (idx) => {
    if(form.options.length <= 2) return app.toast.warn('لازم خيارين على الأقل');
    setForm(f => ({...f, options:f.options.filter((_,i)=>i!==idx)}));
  };
  const updateOption = (idx, val) => setForm(f => ({...f, options:f.options.map((o,i)=>i===idx?val:o)}));

  const save = async () => {
    const q = (form.question||'').trim();
    const opts = (form.options||[]).map(o=>o.trim()).filter(Boolean);
    if(!q || q.length < 3) return app.toast.warn('السؤال قصير');
    if(opts.length < 2) return app.toast.warn('لازم خيارين على الأقل');

    setBusy(true);
    try{
      const sb = await DB.getClient();
      const record = {
        id: editing === 'new' ? DB.uid('poll_') : editing,
        question: q,
        options: opts,
        active: form.active !== false,
        allow_multiple: !!form.allow_multiple,
        ends_at: form.ends_at ? new Date(form.ends_at).getTime() : null,
        created_at: form.created_at || Date.now()
      };
      const { error } = await sb.from('polls').upsert(record);
      if(error) throw new Error(error.message);
      await loadData();
      app.toast.ok(editing==='new'?'تم إنشاء الاستطلاع':'تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };

  const del = async (id) => {
    const r = await Swal.fire({
      title:'حذف الاستطلاع؟',
      text:'سيتم حذف كل الأصوات المرتبطة به',
      icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم، احذف',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{
      const sb = await DB.getClient();
      await sb.from('poll_votes').delete().eq('poll_id', id);
      await sb.from('polls').delete().eq('id', id);
      await loadData();
      app.toast.warn('تم الحذف');
    }catch(e){app.toast.err(e.message);}
  };

  const toggleActive = async (p) => {
    try{
      const sb = await DB.getClient();
      await sb.from('polls').update({active: !p.active}).eq('id', p.id);
      await loadData();
      app.toast.ok(p.active?'تم الإيقاف':'تم التفعيل');
    }catch(e){app.toast.err(e.message);}
  };

  const getStats = (poll) => {
    const pollVotes = votes.filter(v => v.poll_id === poll.id);
    const total = pollVotes.length;
    const counts = (poll.options||[]).map((_, i) =>
      pollVotes.filter(v => v.option_index === i).length
    );
    return { total, counts };
  };

  const getVoterDetails = (poll) => {
    const pollVotes = votes.filter(v => v.poll_id === poll.id);
    return pollVotes.map(v => {
      const voter = app.db.users.find(u => u.id === v.user_id);
      return {
        id: v.user_id,
        name: voter?.name || 'طالب محذوف',
        avatar: voter?.avatar || '👤',
        phone: voter?.phone || '—',
        country_code: voter?.country_code || '+20',
        governorate: voter?.governorate || '—',
        grade: voter?.grade_id ? (app.grade(voter.grade_id)?.name || '—') : '—',
        xp: voter?.xp || 0,
        option: (poll.options || [])[v.option_index] || '—',
        optionIndex: v.option_index,
        voted_at: v.created_at
      };
    }).sort((a,b) => b.voted_at - a.voted_at);
  };

  return <>
    <div className="flex between center mb16 wrap g8">
      <div>
        <div className="h2 grad">📊 استطلاعات الرأي</div>
        <div className="sm muted mt6">اسأل طلابك واستقبل آرائهم</div>
      </div>
      <button className="btn btn-p" onClick={openNew}>
        <Icon name="plus" size={15}/> استطلاع جديد
      </button>
    </div>

    {loading ? (
      <div className="glass" style={{padding:40,textAlign:'center'}}>
        <div className="spinner" style={{margin:'0 auto 14px'}}></div>
        جارٍ التحميل...
      </div>
    ) : polls.length === 0 ? (
      <div className="glass" style={{padding:30}}>
        <Empty icon="📊" title="لا توجد استطلاعات" desc="ابدأ بإنشاء استطلاع جديد"/>
      </div>
    ) : (
      <div className="grid g2">
        {polls.map(p => {
          const { total, counts } = getStats(p);
          const expired = p.ends_at && p.ends_at < Date.now();
          const voters = getVoterDetails(p);
          const isExpanded = expandedPoll === p.id;
          return <div key={p.id} className="glass" style={{padding:20}}>
            <div className="flex between center mb12 wrap g8">
              <div className="flex g6 center">
                {p.active && !expired
                  ? <span className="pill pill-g">● نشط</span>
                  : expired
                  ? <span className="pill pill-r">منتهي</span>
                  : <span className="pill pill-y">موقوف</span>}
                <span className="pill pill-b">{total} صوت</span>
              </div>
              <div className="flex g6">
                <button className="btn btn-s btn-sm" onClick={()=>toggleActive(p)} title={p.active?'إيقاف':'تفعيل'}>
                  {p.active?'⏸':'▶️'}
                </button>
                <button className="btn btn-s btn-sm" onClick={()=>openEdit(p)}>
                  <Icon name="edit" size={13}/>
                </button>
                <button className="btn btn-dn btn-sm" onClick={()=>del(p.id)}>
                  <Icon name="trash" size={13}/>
                </button>
              </div>
            </div>

            <div className="h4 mb12" style={{lineHeight:1.5}}>{p.question}</div>

            <div className="flex col g8">
              {(p.options||[]).map((opt, i) => {
                const cnt = counts[i] || 0;
                const perc = total ? Math.round((cnt/total)*100) : 0;
                return <div key={i}>
                  <div className="flex between center mb6">
                    <span className="sm">{opt}</span>
                    <span className="xs muted">{cnt} ({perc}%)</span>
                  </div>
                  <div className="bar" style={{height:8}}>
                    <div className="bar-f bar-b" style={{width:`${perc}%`}}/>
                  </div>
                </div>;
              })}
            </div>

            {voters.length > 0 && (
              <>
                <button
                  className="btn btn-s btn-sm mt16"
                  onClick={()=>setExpandedPoll(isExpanded ? null : p.id)}
                  style={{width:'100%'}}
                >
                  <Icon name="users" size={13}/>
                  {isExpanded ? 'إخفاء تفاصيل المصوتين' : `عرض تفاصيل المصوتين (${voters.length})`}
                </button>

                {isExpanded && (
                  <div style={{marginTop:12, maxHeight:400, overflowY:'auto'}}>
                    {voters.map((v, i) => (
                      <div key={i} className="glass-s mb8" style={{
                        padding:'12px',
                        display:'flex',
                        alignItems:'center',
                        gap:12,
                        flexWrap:'wrap'
                      }}>
                        <div className="avatar" style={{width:40,height:40,fontSize:16,flexShrink:0}}>
                          {v.avatar}
                        </div>
                        <div style={{flex:1,minWidth:180}}>
                          <div className="sm" style={{fontWeight:700,marginBottom:2}}>
                            {v.name}
                          </div>
                          <div className="flex wrap g8 xs muted">
                            <span dir="ltr">📱 {v.country_code}{v.phone}</span>
                            {v.governorate !== '—' && <span>📍 {v.governorate}</span>}
                            {v.grade !== '—' && <span>🎓 {v.grade}</span>}
                            <span>⚡ {DB.fmt(v.xp)} XP</span>
                          </div>
                        </div>
                        <div className="flex col" style={{alignItems:'flex-end',gap:4}}>
                          <span className="pill pill-b" style={{fontSize:11}}>
                            {['أ','ب','ج','د','هـ','و'][v.optionIndex]}: {v.option}
                          </span>
                          <span className="xs muted">{DB.formatDateTime(v.voted_at)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

            {p.ends_at && (
              <div className="xs muted mt12">
                ⏰ ينتهي: {DB.formatDate(p.ends_at)}
              </div>
            )}
          </div>;
        })}
      </div>
    )}

    {editing !== null && (
      <Modal title={editing==='new'?'استطلاع جديد':'تعديل الاستطلاع'} onClose={()=>setEditing(null)} wide>
        <Field label="السؤال">
          <textarea className="input" rows="2" value={form.question||''} onChange={e=>setForm({...form,question:e.target.value})} placeholder="اكتب السؤال هنا..."/>
        </Field>

        <Field label={`الخيارات (${form.options.length})`}>
          <div className="flex col g8">
            {form.options.map((opt, i) => (
              <div key={i} className="flex g8 center">
                <span className="pill pill-b" style={{minWidth:32,justifyContent:'center'}}>{i+1}</span>
                <input
                  className="input"
                  value={opt}
                  onChange={e=>updateOption(i, e.target.value)}
                  placeholder={`الخيار ${i+1}`}
                />
                {form.options.length > 2 && (
                  <button className="btn btn-dn btn-sm" onClick={()=>removeOption(i)}>
                    <Icon name="trash" size={12}/>
                  </button>
                )}
              </div>
            ))}
            <button className="btn btn-s btn-sm" onClick={addOption} style={{alignSelf:'flex-start'}}>
              <Icon name="plus" size={13}/> إضافة خيار
            </button>
          </div>
        </Field>

        <div className="grid g2">
          <Field label="تاريخ الانتهاء (اختياري)">
            <input type="date" className="input" value={form.ends_at||''} onChange={e=>setForm({...form,ends_at:e.target.value})}/>
          </Field>
          <Field label="الحالة">
            <label className="flex center g8" style={{cursor:'pointer',marginTop:6}}>
              <input type="checkbox" checked={form.active!==false} onChange={e=>setForm({...form,active:e.target.checked})}/>
              <span className="sm">مفعّل</span>
            </label>
          </Field>
        </div>

        <Field label="السماح بأكثر من صوت">
          <label className="flex center g8" style={{cursor:'pointer'}}>
            <input type="checkbox" checked={!!form.allow_multiple} onChange={e=>setForm({...form,allow_multiple:e.target.checked})}/>
            <span className="sm">يسمح للطالب بالتصويت أكثر من مرة (مش مفعّل حالياً)</span>
          </label>
        </Field>

        <div className="flex g8 mt16">
          <button className="btn btn-p" onClick={save} disabled={busy}>
            {busy?'جارٍ...':'💾 حفظ'}
          </button>
          <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
        </div>
      </Modal>
    )}
  </>;
}

    app.db.lessons.filter(l=>l.title.toLowerCase().includes(lc)).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="file" size={16}/>,title:l.title,nav:'lessons'}));
    app.db.exams.filter(e=>e.title.toLowerCase().includes(lc)).slice(0,5).forEach(e=>res.push({type:'اختبار',icon:<Icon name="clipboard" size={16}/>,title:e.title,nav:'exams'}));
    app.db.questions.filter(x=>x.text.toLowerCase().includes(lc)).slice(0,5).forEach(x=>res.push({type:'سؤال',icon:<Icon name="help" size={16}/>,title:x.text.slice(0,50),nav:'questions'}));
    setSearchResults(res);
  };

  return <div className="app">
    <Sidebar
      items={items}
      active={tab}
      onNav={(id)=>{setTab(id);try{localStorage.setItem('admin_tab',id);}catch(e){}}}
      open={sidebarOpen}
      onClose={()=>setSidebarOpen(false)}
    />
    <div className="main">
      <Topbar
        user={user}
        onMenu={()=>setSidebarOpen(true)}
        onLogout={app.logout}
        onSearch={onSearch}
        searchResults={searchResults}
        onResultClick={r=>setTab(r.nav)}
        unreadNotifs={unreadNotifs}
        onOpenNotifications={()=>setTab('notifications')}
      />
      <div className="content">
        {tab==='dashboard'&&<Dashboard/>}
        {tab==='activity'&&<ActivityLog/>}
        {tab==='errors'&&<ErrorsAnalyticsPage/>}
        {tab==='grades'&&<GradesPage/>}
        {tab==='subjects'&&<SubjectsPage/>}
        {tab==='units'&&<UnitsPage/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='questions'&&<QuestionsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='missions'&&<MissionsPage/>}
        {tab==='achievements'&&<AchievementsPage/>}
        {tab==='levels'&&<LevelsPage/>}
        {tab==='certificates'&&<CertificatesPage/>}
        {tab==='students'&&<StudentsPage/>}
        {tab==='notes'&&<NotesPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='reports'&&<ReportsPage/>}
        {tab==='coupons'&&<CouponsPage/>}
        {tab==='referrals'&&<ReferralsPage/>}
        {tab==='polls'&&<PollsPage/>}
        {tab==='settings'&&<SettingsPage/>}
        <Footer/>
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role!=='admin') return null;
  return <AdminApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
