function QuestionsBankPage(){
  const app=useApp();
  const [filterSubject,setFilterSubject]=useState('all');
  const [filterLesson,setFilterLesson]=useState('all');
  const [filterType,setFilterType]=useState('all');
  const [q,setQ]=useState('');
  const [page,setPage]=useState(1);
  const [attempts,setAttempts]=useState([]);
  const perPage=50;
  useEffect(()=>{(async()=>{
    try{const sb=await DB.getClient();const {data}=await sb.from('exam_attempts').select('answers,total').limit(2000);setAttempts(data||[]);}catch(e){}
  })();},[]);
  const qualityMap=useMemo(()=>{
    const stats={};
    attempts.forEach(a=>{
      const answers=a.answers||{};
      Object.keys(answers).forEach(qid=>{
        if(!stats[qid])stats[qid]={total:0,wrong:0,skipped:0};
        stats[qid].total++;
        const question=app.db.questions.find(x=>x.id===qid);
        if(!question)return;
        const correct=Array.isArray(question.correct)?question.correct[0]:question.correct;
        const ans=answers[qid];
        if(ans===null||ans===undefined||ans==='')stats[qid].skipped++;
        else if(Number(ans)!==Number(correct))stats[qid].wrong++;
      });
    });
    return stats;
  },[attempts,app.db.questions]);
  const usageMap=useMemo(()=>{const map={};(app.db.exams||[]).forEach(ex=>{(ex.question_ids||[]).forEach(qid=>{if(!map[qid])map[qid]=[];map[qid].push({id:ex.id,title:ex.title});});});return map;},[app.db.exams]);
  const enriched=useMemo(()=>{
    return (app.db.questions||[]).map(q=>{
      const lesson=q.lesson_id?app.lesson(q.lesson_id):null;
      const unit=q.unit_id?app.unit(q.unit_id):(lesson?app.unit(lesson.unit_id):null);
      const subject=q.subject_id?app.subject(q.subject_id):(unit?app.subject(unit.subject_id):null);
      const usedIn=usageMap[q.id]||[];
      const st=qualityMap[q.id];
      let quality='unknown',qualityColor='var(--muted)',qualityLabel='غير مقيّم';
      if(st&&st.total>=5){
        const wrongPct=(st.wrong/st.total)*100;
        if(wrongPct>=90){quality='bad';qualityColor='#ef4444';qualityLabel='⚠️ صعب جداً';}
        else if(wrongPct>=70){quality='hard';qualityColor='#f59e0b';qualityLabel='🔶 صعب';}
        else if(wrongPct>=30){quality='good';qualityColor='#22c55e';qualityLabel='✅ متوازن';}
        else if(wrongPct<=10){quality='easy';qualityColor='#60a5fa';qualityLabel='💧 سهل';}
      }
      return {...q,lesson,unit,subject,usedIn,isOrphan:usedIn.length===0,quality,qualityColor,qualityLabel,stats:st};
    });
  },[app.db.questions,app.db.lessons,app.db.units,app.db.subjects,usageMap,qualityMap]);
  const filtered=useMemo(()=>{
    let list=[...enriched];
    if(filterSubject!=='all')list=list.filter(x=>x.subject?.id===filterSubject);
    if(filterLesson!=='all')list=list.filter(x=>x.lesson?.id===filterLesson);
    if(filterType==='used')list=list.filter(x=>!x.isOrphan);
    if(filterType==='orphan')list=list.filter(x=>x.isOrphan);
    if(filterType==='bad')list=list.filter(x=>x.quality==='bad'||x.quality==='hard');
    if(q.trim()){const lc=q.toLowerCase();list=list.filter(x=>(x.text||'').toLowerCase().includes(lc));}
    return list;
  },[enriched,filterSubject,filterLesson,filterType,q]);
  const totalPages=Math.ceil(filtered.length/perPage)||1;
  const paginated=filtered.slice((page-1)*perPage,page*perPage);
  const stats=useMemo(()=>{const total=enriched.length;const orphan=enriched.filter(x=>x.isOrphan).length;const bad=enriched.filter(x=>x.quality==='bad').length;return {total,orphan,used:total-orphan,bad};},[enriched]);
  const deleteOne=async id=>{const r=await Swal.fire({title:'حذف السؤال؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{const result=await DB.deleteQuestion(id);await app.reload();app.toast.ok(`تم${result.examsUpdated?` وتحديث ${result.examsUpdated} امتحان`:''}`);}catch(e){app.toast.err(e.message);}};
  const availableLessons=useMemo(()=>{if(filterSubject==='all')return app.db.lessons;return app.db.lessons.filter(l=>{const u=app.unit(l.unit_id);return u?.subject_id===filterSubject;});},[filterSubject,app.db.lessons]);
  return <>
    <div className="h2 mb16 grad">🗃️ بنك الأسئلة</div>
    <div className="grid g4 mb16">
      <Stat label="إجمالي" value={DB.fmt(stats.total)} icon="help" color="var(--gold-l)"/>
      <Stat label="مستخدمة" value={DB.fmt(stats.used)} icon="check" color="#22c55e"/>
      <Stat label="يتيمة" value={DB.fmt(stats.orphan)} icon="alert" color="#ef4444"/>
      <Stat label="مشكوك فيها" value={DB.fmt(stats.bad)} icon="alert" color="#f59e0b" sub="≥70% خطأ"/>
    </div>
    <div className="glass mb16" style={{padding:14}}>
      <div className="grid g4" style={{gap:10}}>
        <div><label className="lbl">المادة</label><select className="input" value={filterSubject} onChange={e=>{setFilterSubject(e.target.value);setFilterLesson('all');}}><option value="all">كل المواد</option>{app.db.subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
        <div><label className="lbl">الدرس</label><select className="input" value={filterLesson} onChange={e=>setFilterLesson(e.target.value)}><option value="all">كل الدروس</option>{availableLessons.map(l=><option key={l.id} value={l.id}>{l.title}</option>)}</select></div>
        <div><label className="lbl">النوع</label><select className="input" value={filterType} onChange={e=>setFilterType(e.target.value)}><option value="all">الكل</option><option value="used">✅ مستخدمة</option><option value="orphan">⚠️ يتيمة</option><option value="bad">🔶 مشكوك فيها</option></select></div>
        <div><label className="lbl">بحث</label><input className="input" value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} placeholder="🔍"/></div>
      </div>
    </div>
    <div className="glass" style={{padding:14}}>
      {filtered.length===0?<Empty icon="🗃️" title="لا أسئلة"/>:<>
        <div className="flex between center mb12"><span className="pill pill-b">{filtered.length} سؤال — صفحة {page} من {totalPages}</span></div>
        <div className="sx"><table className="tbl">
          <thead><tr><th>السؤال</th><th>المادة</th><th>الجودة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody>{paginated.map(x=><tr key={x.id}>
            <td style={{maxWidth:400}}><div className="sm" style={{fontWeight:700}}>{SEC.esc(x.text.slice(0,120))}{x.text.length>120?'...':''}</div></td>
            <td>{x.subject?<span className="pill pill-b">{SEC.esc(x.subject.name)}</span>:'—'}</td>
            <td>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <span className="pill" style={{background:`${x.qualityColor}22`,color:x.qualityColor,border:`1px solid ${x.qualityColor}55`,fontSize:10}}>{x.qualityLabel}</span>
                {x.stats&&x.stats.total>0&&<span className="xs muted">{x.stats.wrong}/{x.stats.total} خطأ</span>}
              </div>
            </td>
            <td>{x.usedIn.length>0?<span className="pill qbank-used">✓ {x.usedIn.length}</span>:<span className="pill qbank-orphan">⚠️</span>}</td>
            <td><button className="btn btn-dn btn-sm" onClick={()=>deleteOne(x.id)}><Icon name="trash" size={12}/></button></td>
          </tr>)}</tbody>
        </table></div>
        {totalPages>1&&<div className="flex between center mt16"><button className="btn btn-s btn-sm" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>←</button><span className="sm muted">صفحة {page} من {totalPages}</span><button className="btn btn-s btn-sm" onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages}>→</button></div>}
      </>}
    </div>
  </>;
}

function NotificationsPage(){
  const app=useApp();
  const [form,setForm]=useState({title:'',body:'',target:'all'});
  const [busy,setBusy]=useState(false);
  const [templates,setTemplates]=useState([]);
  useEffect(()=>{(async()=>{
    try{const sb=await DB.getClient();const {data}=await sb.from('admin_templates').select('*').order('created_at',{ascending:false});setTemplates(data||[]);}catch(e){}
  })();},[]);
  const saveTemplate=async()=>{
    if(!form.title.trim()||!form.body.trim())return app.toast.warn('العنوان والنص مطلوبان');
    const name=await Swal.fire({title:'اسم القالب',input:'text',inputPlaceholder:'مثال: تهنئة',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});
    if(!name.isConfirmed||!name.value)return;
    try{
      const sb=await DB.getClient();
      const row={id:DB.uid('tpl_'),name:SEC.clean(name.value),title:SEC.clean(form.title),body:SEC.clean(form.body),created_at:Date.now()};
      await sb.from('admin_templates').insert(row);
      setTemplates([row,...templates]);
      app.toast.ok('تم حفظ القالب');
    }catch(e){app.toast.err(e.message);}
  };
  const delTemplate=async id=>{
    try{const sb=await DB.getClient();await sb.from('admin_templates').delete().eq('id',id);setTemplates(templates.filter(t=>t.id!==id));app.toast.ok('تم');}catch(e){app.toast.err(e.message);}
  };
  const applyTemplate=t=>{setForm(f=>({...f,title:t.title,body:t.body}));app.toast.info('تم تطبيق القالب');};
  const send=async ()=>{
    if(!SEC.rateLimit('adm_notif_send',1500)) return app.toast.warn('انتظر لحظة');
    const t=SEC.clean(SEC.maxLen(form.title,120)),b=SEC.clean(SEC.maxLen(form.body,2000));
    if(!t||!b)return app.toast.warn('العنوان والنص مطلوبان');
    setBusy(true);
    try{await app.save('notifications',{title:t,body:b,target:form.target,read_by:[],created_at:Date.now()});app.toast.ok('تم');setForm({title:'',body:'',target:'all'});}catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{const r=await Swal.fire({title:'حذف؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});if(!r.isConfirmed)return;try{await app.remove('notifications',id);app.toast.warn('تم');}catch(e){app.toast.err(e.message);}};
  return <>
    <div className="h2 mb16 grad">الإشعارات</div>
    <div className="grid g2 mb16">
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📤 إرسال</div>
        <Field label="العنوان"><input className="input" maxLength={120} value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></Field>
        <Field label="النص"><textarea className="input" maxLength={2000} value={form.body} onChange={e=>setForm({...form,body:e.target.value})}/></Field>
        <Field label="المستهدف"><select className="input" value={form.target} onChange={e=>setForm({...form,target:e.target.value})}><option value="all">كل الطلاب</option>{app.db.users.filter(u=>u.role==='student').map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
        <div className="flex g8">
          <button className="btn btn-p" onClick={send} disabled={busy} style={{flex:2}}>{busy?'جارٍ...':'📤 إرسال'}</button>
          <button className="btn btn-s" onClick={saveTemplate} style={{flex:1}}>💾 حفظ كقالب</button>
        </div>
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📋 القوالب ({templates.length})</div>
        {templates.length===0?<div className="sm muted">لا قوالب بعد — احفظ رسالة كقالب للاستخدام السريع</div>:
        <div style={{maxHeight:400,overflowY:'auto'}}>{templates.map(t=>(
          <div key={t.id} className="glass-s mb8" style={{padding:10}}>
            <div className="flex between center mb6">
              <b className="sm" style={{color:'var(--gold-l)'}}>{SEC.esc(t.name)}</b>
              <div className="flex g6">
                <button className="btn btn-s btn-sm" onClick={()=>applyTemplate(t)}>تطبيق</button>
                <button className="btn btn-dn btn-sm" onClick={()=>delTemplate(t.id)}><Icon name="trash" size={11}/></button>
              </div>
            </div>
            <div className="xs muted">{SEC.esc(t.title)}</div>
          </div>
        ))}</div>}
      </div>
    </div>
    <div className="glass" style={{padding:20}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>آخر الإشعارات</div>
      {app.db.notifications.slice(0,10).map(n=><div key={n.id} className="glass-s mb8" style={{padding:12,display:'flex',gap:10}}><div style={{flex:1}}><div className="h4" style={{fontSize:14}}>{SEC.esc(n.title)}</div><div className="xs muted">{SEC.esc(n.body)}</div></div><button className="btn btn-dn btn-sm" onClick={()=>del(n.id)}><Icon name="trash" size={13}/></button></div>)}
    </div>
  </>;
}

function ReportsPage(){
  const app=useApp();
  const [reports,setReports]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState('pending');
  const [busy,setBusy]=useState(null);
  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const data = await DB.getAdminReports(filter, app.currentUser.id);
      if(data){ setReports(data); }
      else{
        const sb=await DB.getClient();
        const {data:rows}=await sb.from('reports').select('*').order('created_at',{ascending:false}).limit(500);
        setReports(rows||[]);
      }
    }catch(e){ console.warn(e); app.toast.err?.('تعذر تحميل البلاغات'); }
    setLoading(false);
  },[filter]);
  useEffect(()=>{ load(); },[load]);
  const review=async(reportId,status,action,banTarget,banReason)=>{
    setBusy(reportId);
    try{
      const sb=await DB.getClient();
      const {data,error}=await sb.rpc('admin_review_report',{p_report_id: reportId,p_admin_id: app.currentUser.id,p_status: status,p_action: action || null,p_notes: null,p_ban_target: !!banTarget,p_ban_reason: banReason || null});
      if(error)throw new Error(error.message);
      app.toast.ok(banTarget?'✅ تم الحظر':'✅ تم تحديث البلاغ');
      await load();
      await app.reload();
    }catch(e){app.toast.err(e.message||'فشل');}
    setBusy(null);
  };
  const banAndReview=async(r)=>{
    const res=await Swal.fire({title:'حظر المستخدم؟',html:`<div style="text-align:right;font-size:14px;line-height:1.8"><div>👤 <b>${SEC.esc(r.user_name||'—')}</b></div><div>📱 ${SEC.esc(r.user_phone||'—')}</div><div>🚩 ${SEC.esc(r.reason||'—')}</div></div>`,input:'text',inputPlaceholder:'سبب الحظر (اختياري)',showCancelButton:true,confirmButtonText:'⛔ حظر',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title',input:'swal-custom-input'}});
    if(!res.isConfirmed)return;
    await review(r.id,'action_taken','banned',true,res.value||'حظر بسبب بلاغات');
  };
  const dismiss=async(r)=>{await review(r.id,'dismissed','dismissed',false,null);};
  const takeAction=async(r)=>{await review(r.id,'action_taken','warning_sent',false,null);};
  const statusBadge=(s)=>{
    if(s==='pending') return <span className="pill pill-a">⏳ معلق</span>;
    if(s==='dismissed') return <span className="pill pill-y">⊘ مرفوض</span>;
    if(s==='action_taken') return <span className="pill pill-r">⚡ تم إجراء</span>;
    return <span className="pill pill-g">✓ مراجع</span>;
  };
  const filtered=filter==='all'?reports:reports.filter(r=>(r.status||'pending')===filter);
  const pendingCount=reports.filter(r=>(r.status||'pending')==='pending').length;
  return <>
    <div className="flex between center mb16 wrap g8"><div><div className="h2 grad">📨 البلاغات</div><div className="sm muted mt6">{pendingCount>0 ? `⚠️ ${pendingCount} بلاغ في انتظار المراجعة` : '✅ لا بلاغات معلقة'}</div></div><div className="flex g8"><span className="pill pill-b">{reports.length} إجمالي</span><button className="btn btn-s" onClick={load}>🔄</button></div></div>
    <div className="msg-tabs mb16">{[{id:'pending',label:'⏳ معلق'},{id:'action_taken',label:'⚡ إجراء'},{id:'dismissed',label:'⊘ مرفوض'},{id:'all',label:'الكل'}].map(f=>(<button key={f.id} className={`msg-tab ${filter===f.id?'active':''}`} onClick={()=>setFilter(f.id)}>{f.label}</button>))}</div>
    <div className="glass" style={{padding:14}}>
      {loading ? (<div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto 14px'}}></div></div>) : filtered.length===0 ? (<Empty icon="✅" title="لا بلاغات"/>) : (
        <div className="flex col g8">{filtered.map(r=>{const isPending=(r.status||'pending')==='pending';const isBusy=busy===r.id;return (<div key={r.id} className="glass-s" style={{padding:14,borderColor:isPending?'rgba(245,158,11,.35)':'var(--border)'}}>
          <div className="flex between center mb8 wrap g8"><div className="flex center g8"><span className="sm" style={{fontWeight:700}}>👤 {SEC.esc(r.user_name||'—')}</span><span className="xs muted" dir="ltr">📱 {SEC.esc(r.user_phone||'—')}</span></div><div className="flex g8">{statusBadge(r.status||'pending')}<span className="xs muted">{DB.formatDateTime(r.created_at)}</span></div></div>
          <div className="flex g8 mb8 wrap"><span className="pill pill-r">🚩 {SEC.esc(r.reason||'—')}</span>{r.target_total_reports && <span className="pill pill-a">إجمالي: {r.target_total_reports}</span>}{r.target_distinct_reporters && <span className="pill pill-b">مُبلِّغون: {r.target_distinct_reporters}</span>}{r.target_is_banned && <span className="pill pill-r">⛔ محظور</span>}</div>
          {r.details && (<div className="sm txt2 mb8" style={{background:'rgba(0,0,0,.25)',padding:10,borderRadius:10,borderInlineStart:'2px solid var(--gold)'}}>"{SEC.esc(r.details)}"</div>)}
          {r.reporter_name && (<div className="xs muted mb8">بلّغ عنه: <b>{SEC.esc(r.reporter_name)}</b></div>)}
          {isPending && (<div className="flex g6 wrap mt12"><button className="btn btn-dn btn-sm" onClick={()=>banAndReview(r)} disabled={isBusy}>{isBusy?'...':'⛔ حظر'}</button><button className="btn btn-s btn-sm" onClick={()=>takeAction(r)} disabled={isBusy}>⚡ إجراء</button><button className="btn btn-s btn-sm" onClick={()=>dismiss(r)} disabled={isBusy}>⊘ رفض</button></div>)}
          {!isPending && r.admin_notes && (<div className="xs muted mt8">📝 {SEC.esc(r.admin_notes)}</div>)}
        </div>);})}</div>
      )}
    </div>
  </>;
}

function AdvancedStatsPage(){
  const app=useApp();
  const students=app.db.users.filter(u=>u.role==='student');
  const totalXP=students.reduce((s,u)=>s+(u.xp||0),0);
  const avgXP=students.length?Math.round(totalXP/students.length):0;
  const totalLessons=app.db.lessons.length;
  const totalCompleted=students.reduce((s,u)=>s+(u.completed_lessons||[]).length,0);
  const completionRate=students.length&&totalLessons?Math.round((totalCompleted/(students.length*totalLessons))*100):0;
  const chartRef=useRef(null);
  const chartInst=useRef(null);
  useEffect(()=>{
    if(!chartRef.current||!window.Chart)return;
    const ctx=chartRef.current.getContext('2d');
    if(chartInst.current)chartInst.current.destroy();
    const byGov={};
    students.forEach(s=>{const g=s.governorate||'غير محدد';byGov[g]=(byGov[g]||0)+1;});
    const sorted=Object.entries(byGov).sort((a,b)=>b[1]-a[1]).slice(0,10);
    chartInst.current=new window.Chart(ctx,{type:'bar',data:{labels:sorted.map(x=>x[0]),datasets:[{label:'طلاب',data:sorted.map(x=>x[1]),backgroundColor:'rgba(255,215,0,0.7)',borderColor:'#FFD700',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#d4c79a'},grid:{display:false}},y:{ticks:{color:'#d4c79a'},grid:{color:'rgba(212,175,55,0.08)'}}}}});
    return ()=>{if(chartInst.current)chartInst.current.destroy();};
  },[students]);
  return <>
    <div className="h2 mb16 grad">📊 إحصائيات متقدمة</div>
    <div className="grid g4 mb16">
      <Stat label="إجمالي XP" value={DB.fmt(totalXP)} icon="trend" color="var(--gold-l)"/>
      <Stat label="متوسط XP" value={DB.fmt(avgXP)} icon="activity" color="#22c55e"/>
      <Stat label="نسبة الإنجاز" value={`${completionRate}%`} icon="check" color="#f59e0b"/>

    </div>
    <div className="glass mb16" style={{padding:18}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📍 توزيع الطلاب حسب المحافظة</div>
      <div style={{height:320,position:'relative'}}><canvas ref={chartRef}></canvas></div>
    </div>
  </>;
}

function ErrorsAnalyticsPage(){
  const app=useApp();
  const [attempts,setAttempts]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{(async()=>{
    try{
      const sb=await DB.getClient();
      const {data}=await sb.from('exam_attempts').select('*').limit(500);
      setAttempts(data||[]);
    }catch(e){}
    setLoading(false);
  })();},[]);
  const wrongCounts={};
  attempts.forEach(a=>{
    const answers=a.answers||{};
    Object.keys(answers).forEach(qid=>{
      const q=app.db.questions.find(x=>x.id===qid);
      if(!q)return;
      const correct=Array.isArray(q.correct)?q.correct[0]:q.correct;
      if(Number(answers[qid])!==Number(correct))wrongCounts[qid]=(wrongCounts[qid]||0)+1;
    });
  });
  const top=Object.entries(wrongCounts).sort((a,b)=>b[1]-a[1]).slice(0,30);
  return <>
    <div className="h2 mb16 grad">🔍 تحليل الأخطاء</div>
    <div className="grid g3 mb16">
      <Stat label="محاولات" value={DB.fmt(attempts.length)} icon="clipboard" color="var(--gold-l)"/>
      <Stat label="أسئلة خاطئة" value={DB.fmt(Object.keys(wrongCounts).length)} icon="alert" color="#ef4444"/>
      <Stat label="إجمالي أخطاء" value={DB.fmt(Object.values(wrongCounts).reduce((s,n)=>s+n,0))} icon="trend" color="#f59e0b"/>
    </div>
    <div className="glass" style={{padding:14}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>أكثر الأسئلة خطأً</div>
      {loading?<div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto 14px'}}></div></div>:
      top.length===0?<Empty icon="✅" title="لا بيانات كافية"/>:
      <div className="flex col g8">{top.map(([qid,count],i)=>{
        const q=app.db.questions.find(x=>x.id===qid);
        if(!q)return null;
        return <div key={qid} className="glass-s" style={{padding:12}}>
          <div className="flex between center mb6">
            <span className="pill pill-r">🚩 {count} خطأ</span>
            <span className="xs muted">#{i+1}</span>
          </div>
          <div className="sm" style={{fontWeight:700}}>{SEC.esc(String(q.text||'').slice(0,140))}</div>
        </div>;
      })}</div>}
    </div>
  </>;
}

    app.toast.ok('تم تصدير النسخة الاحتياطية');
  };
  const importAll=async(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const r=await Swal.fire({title:'استعادة نسخة احتياطية؟',text:'سيتم دمج البيانات الحالية',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    if(!r.isConfirmed){e.target.value='';return;}
    setImporting(true);
    try{
      const data=JSON.parse(await file.text());
      if(!data.users||!data.lessons)throw new Error('ملف غير صالح');
      const tables=['users','grades','subjects','units','lessons','questions','exams','missions','achievements','levels','notifications','activity','polls','poll_votes','xp_shop_items','study_groups','study_group_members','study_plans','daily_challenges','practice_sessions','focus_sessions','flashcards'];
      let total=0,failed=0;
      for(const t of tables){
        if(!Array.isArray(data[t]))continue;
        for(const row of data[t]){
          try{await DB.save(t,row);total++;}catch(_){failed++;}
        }
      }
      app.toast.ok(`تم ${total} عنصر${failed?` (${failed} فشل)`:''}`);
      await app.reload();
    }catch(err){app.toast.err(err.message);}
    setImporting(false);e.target.value='';
  };
  return <>
    <div className="h2 mb16 grad">💾 النسخ الاحتياطي</div>
    <div className="grid g2 mb16">
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📤 تصدير</div>
        <p className="sm muted mb16">ملف JSON كامل بكل بيانات المنصة.</p>
        <button className="btn btn-p btn-block" onClick={exportAll}>
          <Icon name="download" size={15}/> تصدير كل البيانات
        </button>
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📥 استعادة</div>
        <p className="sm muted mb16">ارفع ملف JSON سابق لاستعادة البيانات.</p>
        <input type="file" accept="application/json" onChange={importAll} style={{display:'none'}} id="bk-input"/>
        <label htmlFor="bk-input" className="btn btn-s btn-block" style={{cursor:'pointer'}}>
          {importing?'⏳ جارٍ...':'📂 اختار ملف'}
        </label>
      </div>
    </div>
    <div className="glass" style={{padding:16}}>
      <div className="h4 mb12" style={{color:'var(--gold)'}}>📊 إحصائيات سريعة</div>
      <div className="grid g4">
        <div className="glass-s" style={{padding:12}}><div className="xs muted">طلاب</div><div className="h3">{DB.fmt((app.db.users||[]).filter(u=>u.role==='student').length)}</div></div>
        <div className="glass-s" style={{padding:12}}><div className="xs muted">دروس</div><div className="h3">{DB.fmt((app.db.lessons||[]).length)}</div></div>
        <div className="glass-s" style={{padding:12}}><div className="xs muted">أسئلة</div><div className="h3">{DB.fmt((app.db.questions||[]).length)}</div></div>
        <div className="glass-s" style={{padding:12}}><div className="xs muted">اختبارات</div><div className="h3">{DB.fmt((app.db.exams||[]).length)}</div></div>
      </div>
    </div>
  </>;
}

function BulkImportPage(){
  const app=useApp();
  const [type,setType]=useState('students');
  const [rows,setRows]=useState([]);
  const [busy,setBusy]=useState(false);
  const [fileName,setFileName]=useState('');
  const onFile=async(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    setFileName(file.name);
    try{
      const buf=await file.arrayBuffer();
      const wb=window.XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=window.XLSX.utils.sheet_to_json(ws,{defval:''});
      setRows(data);
      app.toast.ok(`تم تحميل ${data.length} صف`);
    }catch(err){app.toast.err('ملف غير صالح: '+err.message);}
    e.target.value='';
  };
  const downloadTemplate=()=>{
    const headers=type==='students'
      ?['name','phone','country_code','gender','governorate','grade','xp','subscription']
      :['question','optionA','optionB','optionC','optionD','correct','explanation','subject','unit','difficulty'];
    const sample=type==='students'
      ?[['أحمد محمد','1001234567','+20','male','القاهرة','الصف الأول',0,'free']]
      :[['ما ناتج 2+2؟','3','4','5','6','B','لأن 2+2=4','الرياضيات','الوحدة 1','easy']];
    const ws=window.XLSX.utils.aoa_to_sheet([headers,...sample]);
    const wb=window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb,ws,'Template');
    window.XLSX.writeFile(wb,`template_${type}.xlsx`);
  };
  const doImport=async()=>{
    if(!rows.length)return app.toast.warn('ارفع ملف أولاً');
    setBusy(true);
    let ok=0,fail=0;
    try{
      for(const r of rows){
        try{
          if(type==='students'){
            if(!r.name||!r.phone)throw new Error('بيانات ناقصة');
            const grade=app.db.grades.find(g=>g.name===String(r.grade).trim());
            await DB.save('users',{
              id:DB.uid('u_'),role:'student',
              name:SEC.clean(String(r.name)),
              phone:SEC.clean(String(r.phone)).replace(/[^0-9]/g,''),
              country_code:String(r.country_code||'+20'),
              gender:['male','female'].includes(String(r.gender))?String(r.gender):null,
              governorate:SEC.clean(String(r.governorate||''))||null,
              grade_id:grade?.id||null,
              xp:Number(r.xp)||0,
              subscription:['free','paid','vip'].includes(String(r.subscription))?String(r.subscription):'free',
              active:true,created_at:Date.now(),
              completed_lessons:[],reports_count:0,streak:0
            });
          } else {
            if(!r.question||!r.optionA||!r.optionB)throw new Error('بيانات ناقصة');
            const correctLetter=String(r.correct||'A').toUpperCase();
            const correctIdx='ABCD'.indexOf(correctLetter);
            if(correctIdx<0)throw new Error('correct يجب A/B/C/D');
            const subj=app.db.subjects.find(s=>s.name===String(r.subject).trim());
            const unit=app.db.units.find(u=>u.name===String(r.unit).trim()&&(!subj||u.subject_id===subj.id));
            await DB.save('questions',{
              id:DB.uid('q_'),
              text:SEC.clean(String(r.question)),
              options:[r.optionA,r.optionB,r.optionC,r.optionD].map(o=>SEC.clean(String(o||''))),
              correct:[correctIdx],
              explanation:SEC.clean(String(r.explanation||'')),
              subject_id:subj?.id||null,
              unit_id:unit?.id||null,
              difficulty:String(r.difficulty||'medium'),
              type:'mcq',xp:0,lesson_id:null
            });
          }
          ok++;
        }catch(_){fail++;}
      }
      app.toast.ok(`✅ نجح: ${ok}${fail?` | ❌ فشل: ${fail}`:''}`);
      setRows([]);setFileName('');
      await app.reload();
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  return <>
    <div className="h2 mb16 grad">📥 استيراد جماعي</div>
    <div className="glass mb16" style={{padding:20}}>
      <div className="flex wrap g12 mb16">
        <button className={`btn ${type==='students'?'btn-p':'btn-s'}`} onClick={()=>{setType('students');setRows([]);}}>👥 طلاب</button>
        <button className={`btn ${type==='questions'?'btn-p':'btn-s'}`} onClick={()=>{setType('questions');setRows([]);}}>❓ أسئلة</button>
        <button className="btn btn-s" onClick={downloadTemplate}>📥 تحميل قالب</button>
      </div>
      <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} style={{display:'none'}} id="bulk-input"/>
      <label htmlFor="bulk-input" className="btn btn-p btn-block" style={{cursor:'pointer'}}>
        📂 اختار ملف Excel / CSV
      </label>
      {fileName&&<div className="sm muted mt12">📄 {fileName} — {rows.length} صف</div>}
    </div>
    {rows.length>0&&<>
      <div className="glass mb16" style={{padding:14}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>معاينة أول 5 صفوف</div>
        <div className="sx">
          <table className="tbl">
            <thead><tr>{Object.keys(rows[0]).slice(0,6).map(k=><th key={k}>{k}</th>)}</tr></thead>
            <tbody>{rows.slice(0,5).map((r,i)=><tr key={i}>{Object.keys(rows[0]).slice(0,6).map(k=><td key={k} className="sm">{String(r[k]).slice(0,50)}</td>)}</tr>)}</tbody>
          </table>
        </div>
      </div>
      <button className="btn btn-p btn-block" onClick={doImport} disabled={busy}>
        {busy?'⏳ جارٍ الاستيراد...':`⚡ استيراد ${rows.length} صف`}
      </button>
    </>}
  </>;
}

function PollsPage(){
  const app=useApp();
  const polls=app.db.polls||[];
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({question:'',options:[],active:true});
  const [busy,setBusy]=useState(false);
  const openNew=()=>{setForm({question:'',options:['',''],active:true});setEditing('new');};
  const openEdit=p=>{setForm({...p,options:[...(p.options||['',''])]});setEditing(p.id);};
  const save=async()=>{
    if(!form.question.trim())return app.toast.warn('السؤال مطلوب');
    const opts=form.options.filter(o=>o.trim());
    if(opts.length<2)return app.toast.warn('لازم اختيارين على الأقل');
    setBusy(true);
    try{
      const payload={...form,options:opts};
      if(editing==='new')payload.id=DB.uid('poll_');
      await app.save('polls',payload);
      app.toast.ok('تم');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    const r=await Swal.fire({title:'حذف الاستطلاع؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg,#1c160c,#0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    if(!r.isConfirmed)return;
    try{await app.remove('polls',id);app.toast.ok('تم');}catch(e){app.toast.err(e.message);}
  };
  const votes=app.db.poll_votes||[];
  return <>
    <div className="flex between center mb16"><div className="h2 grad">📊 الاستطلاعات</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> جديد</button></div>

      {polls.length===0?<Empty icon="📊" title="لا استطلاعات"/>:
      <div className="flex col g12">{polls.map(p=>{
        const pv=votes.filter(v=>v.poll_id===p.id);
        return <div key={p.id} className="glass-s" style={{padding:14}}>
          <div className="flex between center mb8">
            <b className="sm">{SEC.esc(p.question)}</b>
            <div className="flex g6">
              <span className="pill pill-b">{pv.length} تصويت</span>
              <button className="btn btn-s btn-sm" onClick={()=>openEdit(p)}><Icon name="edit" size={12}/></button>
              <button className="btn btn-dn btn-sm" onClick={()=>del(p.id)}><Icon name="trash" size={12}/></button>
            </div>
          </div>
          {(p.options||[]).map((opt,i)=>{
            const count=pv.filter(v=>v.option_index===i).length;
            const pct=pv.length?Math.round((count/pv.length)*100):0;
            return <div key={i} style={{marginBottom:6}}>
              <div className="flex between center xs mb6"><span>{SEC.esc(opt)}</span><span>{count} ({pct}%)</span></div>
              <div className="bar"><div className="bar-f bar-b" style={{width:`${pct}%`}}/></div>
            </div>;
          })}
        </div>;
      })}</div>}
    </div>
    {editing!==null&&<Modal title={editing==='new'?'استطلاع جديد':'تعديل'} onClose={()=>setEditing(null)}>
      <Field label="السؤال"><input className="input" value={form.question} onChange={e=>setForm({...form,question:e.target.value})}/></Field>
      <Field label="الاختيارات">
        {form.options.map((o,i)=><div key={i} className="flex g6 mb6">
          <input className="input" value={o} onChange={e=>setForm({...form,options:form.options.map((x,xi)=>xi===i?e.target.value:x)})} placeholder={`اختيار ${i+1}`}/>
          {form.options.length>2&&<button className="icon-btn" onClick={()=>setForm({...form,options:form.options.filter((_,xi)=>xi!==i)})}><Icon name="close" size={12}/></button>}
        </div>)}
        <button className="btn btn-s btn-sm mt8" onClick={()=>setForm({...form,options:[...form.options,'']})}>+ إضافة اختيار</button>
      </Field>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

function AdminApp(){
  const app=useApp();
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem('admin_tab')||'dashboard'}catch(e){return 'dashboard'}});
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchResults,setSearchResults]=useState([]);
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('admin_theme')||'gold'}catch(e){return 'gold'}});
  const [focusMode, setFocusMode] = useState(false);
  const [showCmd, setShowCmd] = useState(false);
  const user=app.currentUser;
  useEffect(()=>{try{localStorage.setItem('admin_tab',tab)}catch(e){}},[tab]);
  useEffect(()=>{document.body.setAttribute('data-theme', theme);try{localStorage.setItem('admin_theme', theme)}catch(e){}},[theme]);
  useEffect(()=>{
    const handleKeyDown = (e) => {
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); setShowCmd(true); }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);
  const unreadNotifs=useMemo(()=>{return (app.db.notifications||[]).filter(n=>{if(!n.created_at)return false;const created=new Date(n.created_at).getTime();const lastSeen=Number(localStorage.getItem('admin_last_notif_seen')||0);return created>lastSeen;}).length;},[app.db.notifications]);
  useEffect(()=>{document.title=unreadNotifs>0?`(${unreadNotifs}) MISSION EDU — لوحة الإدارة`:'MISSION EDU — لوحة الإدارة';},[unreadNotifs]);
  useEffect(()=>{if(tab==='notifications'){try{localStorage.setItem('admin_last_notif_seen',Date.now().toString())}catch(e){}}},[tab]);
  const bannedCount=(app.db.users||[]).filter(u=>u.role==='student'&&u.banned===true).length;

    {title:'المحتوى',items:[{id:'grades',icon:'school',label:'الصفوف'},{id:'subjects',icon:'book',label:'المواد'},{id:'units',icon:'folder',label:'الوحدات'},{id:'lessons',icon:'file',label:'الدروس'},{id:'exams',icon:'clipboard',label:'الاختبارات'},{id:'questions-bank',icon:'database',label:'بنك الأسئلة'},{id:'missions',icon:'target',label:'المهام'}]},
    {title:'التحفيز',items:[{id:'achievements',icon:'trophy',label:'الإنجازات'},{id:'levels',icon:'trend',label:'المستويات'},{id:'certificates',icon:'award',label:'مولّد الشهادات'},{id:'xp-shop',icon:'shoppingBag',label:'متجر XP'},{id:'daily-challenges',icon:'zapCircle',label:'التحديات اليومية'}]},
    {title:'الطلاب',items:[{id:'students',icon:'users',label:'الطلاب'},{id:'banned',icon:'lock',label:'المحظورون',badge:bannedCount||null},{id:'notes',icon:'note',label:'ملاحظات'},{id:'notifications',icon:'bell',label:'الإشعارات',badge:unreadNotifs||null},{id:'reports',icon:'link',label:'البلاغات'}]},
    {title:'الأنشطة',items:[{id:'practice-sessions',icon:'target',label:'جلسات التدريب'},{id:'focus-sessions',icon:'clock',label:'جلسات التركيز'},{id:'study-groups',icon:'handshake',label:'مجموعات الدراسة'},{id:'study-plans',icon:'calendar',label:'خطط المذاكرة'},{id:'flashcards',icon:'layers',label:'Flashcards'}]},
    {title:'النمو',items:[{id:'coupons',icon:'coupon',label:'الكوبونات'},{id:'referrals',icon:'share',label:'الإحالات'},{id:'polls',icon:'activity',label:'الاستطلاعات'}]},
    {title:'النظام',items:[{id:'backup',icon:'database',label:'النسخ الاحتياطي'},{id:'bulk-import',icon:'download',label:'استيراد جماعي'},{id:'settings',icon:'settings',label:'الإعدادات'}]}
  ];
  const onSearch=q=>{const lc=q.toLowerCase(),res=[];app.db.users.filter(x=>x.name.toLowerCase().includes(lc)||(x.phone||'').includes(lc)).slice(0,5).forEach(s=>res.push({type:'مستخدم',icon:<Icon name="user" size={16}/>,title:s.name,nav:'students'}));app.db.subjects.filter(s=>s.name.toLowerCase().includes(lc)).forEach(s=>res.push({type:'مادة',icon:'📚',title:s.name,nav:'subjects'}));app.db.lessons.filter(l=>l.title.toLowerCase().includes(lc)).slice(0,5).forEach(l=>res.push({type:'درس',icon:<Icon name="file" size={16}/>,title:l.title,nav:'lessons'}));setSearchResults(res);};
  return <div className="app">
    <Sidebar items={items} active={tab} onNav={id=>{setTab(id);try{localStorage.setItem('admin_tab',id)}catch(e){}}} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={app.logout} hidden={focusMode}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} onSearch={onSearch} searchResults={searchResults} onResultClick={r=>setTab(r.nav)} theme={theme} onThemeChange={setTheme} unreadNotifs={unreadNotifs} onOpenNotifications={()=>setTab('notifications')} onToggleFocus={()=>setFocusMode(!focusMode)} focusMode={focusMode}/>
      <div className="content">
        {tab==='dashboard'&&<Dashboard/>}
        {tab==='advanced-stats'&&<AdvancedStatsPage/>}
        {tab==='activity'&&<ActivityLog/>}
        {tab==='exam-results'&&<ExamResultsPage/>}
        {tab==='errors'&&<ErrorsAnalyticsPage/>}
        {tab==='audit-logs'&&<AuditLogsPage/>}
        {tab==='grades'&&<GradesPage/>}
        {tab==='subjects'&&<SubjectsPage/>}
        {tab==='units'&&<UnitsPage/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='questions-bank'&&<QuestionsBankPage/>}
        {tab==='missions'&&<MissionsPage/>}
        {tab==='achievements'&&<AchievementsPage/>}
        {tab==='levels'&&<LevelsPage/>}
        {tab==='certificates'&&<CertificatesGenPage/>}
        {tab==='xp-shop'&&<XPShopPage/>}
        {tab==='daily-challenges'&&<DailyChallengesPage/>}
        {tab==='students'&&<StudentsPage/>}
        {tab==='banned'&&<BannedUsersPage/>}
        {tab==='notes'&&<NotesPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='reports'&&<ReportsPage/>}
        {tab==='practice-sessions'&&<PracticeSessionsPage/>}
        {tab==='focus-sessions'&&<FocusSessionsPage/>}
        {tab==='study-groups'&&<StudyGroupsPage/>}
        {tab==='study-plans'&&<StudyPlansPage/>}
        {tab==='flashcards'&&<FlashcardsPage/>}
        {tab==='coupons'&&<CouponsPage/>}
        {tab==='referrals'&&<ReferralsPage/>}
        {tab==='polls'&&<PollsPage/>}
        {tab==='backup'&&<BackupPage/>}
        {tab==='bulk-import'&&<BulkImportPage/>}
        {tab==='settings'&&<SettingsPage/>}
        <Footer/>
      </div>
    </div>
    {showCmd && <CommandPalette onClose={()=>setShowCmd(false)} onNavigate={(nav)=>{setTab(nav);setShowCmd(false);}}/>}
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading)return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser)return null;
  if(app.currentUser.role!=='admin')return null;
  return <AdminApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const bar = document.createElement('div');
            bar.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;max-width:400px;background:linear-gradient(135deg,#FFD700,#D4AF37);color:#1a1206;padding:14px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:99999;font-family:Tajawal,sans-serif;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px';
            bar.innerHTML = '<span>تحديث جديد متاح</span><button onclick="location.reload()" style="background:#1a1206;color:#FFD700;border:none;padding:6px 14px;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit">تحديث</button>';
            document.body.appendChild(bar);
          }
        });
      });
    }).catch((err) => {
      console.warn('فشل تسجيل SW:', err);
    });
  });
}
</script>
