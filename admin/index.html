<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0805" />
<title>MISSION EDU — لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSION EDU">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0a0805;
  --bg2:#0f0c07;
  --gold:#D4AF37;
  --gold-l:#FFD700;
  --gold-xl:#FFED4E;
  --gold-d:#8B6914;
  --gold-dd:#5c4509;
  --gold-soft:#F5E6A8;
  --gold-glow:rgba(212,175,55,.35);
  --border:rgba(212,175,55,.18);
  --border2:rgba(212,175,55,.38);
  --border3:rgba(255,215,0,.55);
  --blue:#D4AF37;
  --blue2:#FFD700;
  --txt:#f7f0dd;
  --txt2:#d4c79a;
  --muted:#8a7d55;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --violet:#b8860b;
  --r:20px;
  --rs:13px;
  --sh:0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(212,175,55,.05) inset;
  --sh-gold:0 10px 30px rgba(212,175,55,.35);
  --sh-gold-h:0 14px 40px rgba(212,175,55,.55);
  --grad-gold:linear-gradient(135deg,#FFD700 0%,#D4AF37 45%,#B8860B 100%);
  --grad-gold-soft:linear-gradient(135deg,rgba(255,215,0,.18),rgba(212,175,55,.08));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Tajawal','Cairo',sans-serif;
  background:
    radial-gradient(1200px 620px at 85% -12%,rgba(212,175,55,.20),transparent 62%),
    radial-gradient(950px 520px at -8% 18%,rgba(184,134,11,.14),transparent 60%),
    radial-gradient(700px 400px at 50% 110%,rgba(255,215,0,.08),transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);
  min-height:100vh;
  line-height:1.7;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(212,175,55,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#D4AF37,#8B6914);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#FFD700,#D4AF37)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{
  background:linear-gradient(180deg,rgba(28,22,12,.78),rgba(15,12,7,.68));
  border:1px solid var(--border);
  border-radius:var(--r);
  backdrop-filter:blur(16px);
  box-shadow:var(--sh);
  position:relative;
}
.glass::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--r);
  padding:1px;
  background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(212,175,55,.05) 40%,rgba(255,215,0,.20));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.glass-s{background:rgba(28,22,12,.65);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--sh-gold)}
.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;
  flex-shrink:0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  padding:18px 12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:linear-gradient(180deg,rgba(15,12,7,.96),rgba(10,8,5,.92));
  border-inline-start:1px solid var(--border);
  z-index:60;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pu{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes goldShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--grad-gold);
  box-shadow:0 8px 26px rgba(212,175,55,.55), 0 0 0 1px rgba(255,237,78,.3) inset;
  position:relative;
}
.brand-logo::after{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%);
  pointer-events:none;
}
.brand-name{
  font-weight:900;font-size:17px;
  background:linear-gradient(100deg,#FFD700,#FFF3B0 45%,#D4AF37 90%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:goldShine 4s linear infinite;
}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;
  color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative;
}
.nav-i:hover{background:rgba(212,175,55,.10);color:var(--txt)}
.nav-i.on{
  background:linear-gradient(90deg,rgba(212,175,55,.24),rgba(212,175,55,.03));
  color:#FFF3B0;
}
.nav-i.on::before{
  content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;
  background:linear-gradient(180deg,#FFD700,#D4AF37);
  box-shadow:0 0 12px rgba(255,215,0,.7);
}
.nav-ico{font-size:16px;width:22px;text-align:center;display:flex;justify-content:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px;padding:14px 14px 4px;opacity:.75}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:12px 26px;background:rgba(10,8,5,.78);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:rgba(28,22,12,.7);border:1px solid var(--border);border-radius:14px;padding:8px 14px;transition:.22s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.12)}
.search input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{
  background:var(--grad-gold);color:#1a1206;
  box-shadow:0 10px 28px rgba(212,175,55,.42), 0 0 0 1px rgba(255,237,78,.4) inset;
  position:relative;overflow:hidden;
}
.btn-p::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%);transition:transform .7s;
}
.btn-p:hover::before{transform:translateX(100%)}
.btn-p:hover{box-shadow:var(--sh-gold-h);transform:translateY(-2px);color:#000}
.btn-s{background:rgba(212,175,55,.08);color:var(--gold-soft);border:1px solid var(--border)}
.btn-s:hover{background:rgba(212,175,55,.16);color:#FFF3B0;border-color:var(--border2)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h1{font-size:clamp(21px,3.2vw,30px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{
  background:linear-gradient(100deg,#FFD700,#FFF3B0 50%,#D4AF37 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:goldShine 5s linear infinite;
}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(212,175,55,.16);color:#FFD700;border-color:rgba(212,175,55,.35)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.pill-v{background:rgba(184,134,11,.18);color:#e0b84c;border-color:rgba(184,134,11,.35)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.bar{height:9px;border-radius:20px;background:rgba(212,175,55,.10);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s}
.bar-b{background:var(--grad-gold);box-shadow:0 0 14px rgba(212,175,55,.5)}
.input,select.input,textarea.input{
  width:100%;padding:11px 14px;border-radius:12px;
  background:rgba(15,12,7,.78);border:1.5px solid var(--border);
  outline:none;font-size:14px;transition:.22s;color:var(--txt);
}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.input::placeholder{color:var(--muted)}
select.input{cursor:pointer;appearance:none;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
textarea.input{resize:vertical;min-height:80px;font-family:inherit}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--gold);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap;opacity:.85}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(212,175,55,.08);vertical-align:middle}
.tbl tr:hover td{background:rgba(212,175,55,.05)}
.sx{overflow-x:auto}
.avatar{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:14px;background:var(--grad-gold);color:#1a1206;flex-shrink:0;
  box-shadow:0 4px 14px rgba(212,175,55,.4);
}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(212,175,55,.08);border:1px solid var(--border);transition:.2s;
  font-size:16px;color:var(--gold);position:relative;
}
.icon-btn:hover{background:rgba(212,175,55,.18);border-color:var(--border2);box-shadow:0 0 16px rgba(212,175,55,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(5,3,1,.85);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pu .3s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{
  padding:24px;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.12) 50%,rgba(255,215,0,.06));
  border:1px solid var(--border2);
  box-shadow:0 20px 50px rgba(0,0,0,.5), 0 0 40px rgba(212,175,55,.10) inset;
}
.hero::after{
  content:'';position:absolute;top:-50%;inset-inline-end:-20%;width:340px;height:340px;
  background:radial-gradient(circle,rgba(255,215,0,.18),transparent 65%);
  pointer-events:none;
}
.vid-preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border2);position:relative;margin-top:10px}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:0;display:block;object-fit:contain}
.act-row{display:flex;gap:12px;padding:12px;border-radius:13px;background:rgba(212,175,55,.04);border:1px solid var(--border);align-items:flex-start}
.act-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:rgba(212,175,55,.15);color:var(--gold)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(212,175,55,.18);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px;box-shadow:0 0 20px rgba(212,175,55,.3)}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#FFD700,#D4AF37);color:#1a1206;box-shadow:0 0 20px rgba(255,215,0,.6)}
.rank-2{background:linear-gradient(135deg,#e8e8e8,#a8a8a8);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8B6914);color:#fff}
.rank-x{background:rgba(212,175,55,.10);color:var(--muted)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{
  pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(28,22,12,.98),rgba(15,12,7,.98));
  border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 30px rgba(212,175,55,.15);
  animation:slideIn .4s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px;
}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px;color:var(--gold-soft)}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(212,175,55,.08);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(212,175,55,.20);color:#FFD700}
.toast.info .toast-bar-f{background:var(--grad-gold)}
.footer-dev{
  display:flex;justify-content:center;gap:10px;padding:24px 20px 16px;margin-top:40px;
  border-top:1px solid rgba(212,175,55,.14);position:relative;flex-wrap:wrap;
}
.footer-dev::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:180px;height:1px;background:linear-gradient(90deg,transparent,#FFD700,transparent)}
.dev-btn,.tg-btn{
  display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:50px;
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .32s;border:1px solid;
}
.dev-btn{
  background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(184,134,11,.18));
  border-color:rgba(212,175,55,.4);color:var(--txt);position:relative;overflow:hidden;
}
.dev-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,237,78,.28),transparent);transform:translateX(-100%);transition:transform .7s}
.dev-btn:hover::before{transform:translateX(100%)}
.dev-btn:hover{background:linear-gradient(135deg,rgba(212,175,55,.32),rgba(184,134,11,.32));border-color:#FFD700;transform:translateY(-2px);box-shadow:var(--sh-gold)}
.dev-name b{background:linear-gradient(90deg,#FFD700,#FFF3B0,#D4AF37,#FFD700);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShine 3s linear infinite;font-weight:900;letter-spacing:.3px}
.tg-btn{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.35);color:#FFD700}
.tg-btn:hover{background:rgba(212,175,55,.24);border-color:#FFD700;color:#FFF3B0;transform:translateY(-2px);box-shadow:var(--sh-gold)}
.swal-custom-popup{
  border:1px solid rgba(212,175,55,.4) !important;border-radius:22px !important;
  box-shadow:0 24px 70px rgba(0,0,0,.85), 0 0 40px rgba(212,175,55,.2) !important;
  font-family:'Tajawal','Cairo',sans-serif !important;backdrop-filter:blur(20px);
}
.swal-custom-title{color:#f7f0dd !important;font-size:20px !important;font-weight:800 !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-input{background:rgba(15,12,7,.78) !important;border:1.5px solid rgba(212,175,55,.35) !important;color:#f7f0dd !important;border-radius:12px !important;font-family:'Tajawal','Cairo',sans-serif !important}
.swal-custom-confirm{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important;background:var(--grad-gold) !important;color:#1a1206 !important}
.swal-custom-cancel{border-radius:12px !important;font-weight:700 !important;font-family:'Tajawal','Cairo',sans-serif !important;padding:10px 24px !important}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s;width:280px;box-shadow:-20px 0 60px rgba(0,0,0,.75)}
  .sidebar.open{transform:translateX(0)!important}
  .mbar{display:flex}
  .content{padding:14px 14px 90px}
  .topbar{padding:10px 14px}

const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;

/* ═══════════════════════════════════════════
   🎵 أصوات الإشعارات — نسخة مصلّحة
   ═══════════════════════════════════════════ */

// ✅ Web Audio API — بيولّد الأصوات بدون files base64
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){
      console.warn('AudioContext failed:', e);
      return null;
    }
  }
  return _audioCtx;
}

// ✅ نطق صوت "beep" بـ frequency معينة
function beep(frequency, duration, type='sine', volume=0.15){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    // resume لو موقوف (متصفحات الموبايل)
    if(ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = frequency;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration/1000);
  }catch(e){}
}

// ✅ تشغيل صوت حسب النوع
function playSound(type='notify'){
  switch(type){
    case 'success':
      // نغمة صاعدة (نجاح)
      beep(523, 100, 'sine', 0.18); // C5
      setTimeout(()=>beep(659, 100, 'sine', 0.18), 100); // E5
      setTimeout(()=>beep(784, 200, 'sine', 0.18), 200); // G5
      break;
    case 'err':
      // نغمة هابطة (خطأ)
      beep(392, 120, 'square', 0.15); // G4
      setTimeout(()=>beep(311, 200, 'square', 0.15), 120); // Eb4
      break;
    case 'warn':
      // نغمة تحذير
      beep(440, 150, 'triangle', 0.18);
      setTimeout(()=>beep(440, 150, 'triangle', 0.18), 180);
      break;
    case 'notify':
    default:
      // نغمة إشعار عادية
      beep(880, 100, 'sine', 0.15);
      setTimeout(()=>beep(1175, 120, 'sine', 0.15), 100);
      break;
  }
}

const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
    if(type==='ok') playSound('success');
    else if(type==='err') playSound('err');
    else if(type==='warn') playSound('warn');
    else playSound('notify');
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);
  useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
    <div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[],polls:[],poll_votes:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      // ✅ 1) حذف الاستطلاعات المنتهية أول حاجة
      const deleted = await DB.cleanupExpiredPolls();
      if(deleted > 0){
        console.log(`🗑️ تم حذف ${deleted} استطلاع منتهي`);
      }
      // ✅ 2) تحميل باقي البيانات
      const data=await DB.loadAll();
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('/auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('/auth/login.html');return;}
        if(u.role!=='admin'){window.location.replace('/student/index.html');return;}
        setCurrentUser(u);
        await reload();
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  // ✅ حذف الاستطلاعات المنتهية كل 5 دقايق تلقائيًا
  useEffect(()=>{
    const interval = setInterval(async ()=>{
      const count = await DB.cleanupExpiredPolls();
      if(count > 0){
        console.log(`🗑️ Auto-cleanup: حذف ${count} استطلاع`);
        await reload();
      }
    }, 5 * 60 * 1000);
    return ()=>clearInterval(interval);
  },[reload]);

  // ✅ تشغيل AudioContext بعد أول تفاعل من المستخدم
  useEffect(()=>{
    const unlock = () => {
      const ctx = getAudioCtx();
      if(ctx && ctx.state === 'suspended') ctx.resume();
      document.removeEventListener('click', unlock);
      document.removeEventListener('touchstart', unlock);
    };
    document.addEventListener('click', unlock, { once: true });
    document.addEventListener('touchstart', unlock, { once: true });
    return ()=>{
      document.removeEventListener('click', unlock);
      document.removeEventListener('touchstart', unlock);
    };
  },[]);

  const logout=useCallback(()=>{
    Swal.fire({
      title:'تسجيل الخروج',text:'هل أنت متأكد؟',icon:'question',
      showCancelButton:true,confirmButtonText:'نعم، خروج',cancelButtonText:'إلغاء',
      confirmButtonColor:'#D4AF37',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    }).then(r=>{if(r.isConfirmed){DB.clearSession();window.location.replace('/auth/login.html');}});
  },[]);

  const save=useCallback(async (table,item)=>{
    const saved=await DB.save(table,item);
    await reload();
    return saved;
  },[reload]);
  const remove=useCallback(async (table,id)=>{
    await DB.remove(table,id);
    await reload();
  },[reload]);
  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  return <AppCtx.Provider value={{
    db,currentUser,loading,logout,reload,save,remove,getLevel,toast,playSound,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

        {g.items.map(it=><button key={it.id} className={`nav-i ${active===it.id?'on':''}`} onClick={()=>{onNav(it.id);onClose?.();}}>
          <span className="nav-ico"><Icon name={it.icon} size={16}/></span>
          <span>{it.label}</span>
          {it.badge!=null&&<span className="pill pill-b" style={{marginInlineStart:'auto'}}>{it.badge}</span>}
        </button>)}
      </div>)}
    </aside>
  </>;
}

function Topbar({user,onMenu,onLogout,onSearch,searchResults,onResultClick,theme,onToggleTheme,unreadNotifs=0,onOpenNotifications}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!q.trim()){setOpen(false);return;}
    setOpen(true);
    const t=setTimeout(()=>onSearch?.(q),150);
    return()=>clearTimeout(t);
  },[q]);
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}><Icon name="menu" size={16}/></button>
    <div style={{position:'relative',flex:1,maxWidth:520}}>
      <div className="search">
        <span style={{fontSize:15,opacity:.7,color:'var(--gold)'}}>🔍</span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث..."/>
        {q&&<button onClick={()=>{setQ('');setOpen(false);}} style={{opacity:.6,color:'var(--txt)'}}>✕</button>}
      </div>
      {open&&searchResults?.length>0&&<div className="glass" style={{position:'absolute',top:'calc(100% + 8px)',insetInline:0,padding:8,zIndex:80,maxHeight:340,overflowY:'auto'}}>
        {searchResults.slice(0,10).map((r,i)=><button key={i} className="nav-i" onClick={()=>{onResultClick(r);setQ('');setOpen(false);}}>
          <span className="nav-ico">{r.icon}</span>
          <div style={{flex:1,textAlign:'right'}}>
            <div style={{fontSize:13.5}}>{r.title}</div>
            <div className="xs muted">{r.type}</div>
          </div>
        </button>)}
      </div>}
    </div>
    <div className="flex center g8" style={{marginInlineStart:'auto'}}>
      <button className="icon-btn" onClick={onOpenNotifications} title="الإشعارات">
        <Icon name="bell" size={16}/>
        {unreadNotifs > 0 && (
          <span style={{
            position:'absolute',top:-4,insetInlineEnd:-4,
            minWidth:18,height:18,borderRadius:9,
            background:'var(--grad-gold)',
            color:'#1a1206',fontSize:10,fontWeight:900,
            display:'grid',placeItems:'center',padding:'0 5px',
            boxShadow:'0 0 10px rgba(255,215,0,.7)',
            animation:'pulse 2s infinite'
          }}>{unreadNotifs > 9 ? '9+' : unreadNotifs}</span>
        )}
      </button>
      <button className="icon-btn" onClick={onToggleTheme} title={theme==='dark'?'الوضع النهاري':'الوضع الليلي'}>
        <Icon name={theme==='dark'?'sun':'moon'} size={16}/>
      </button>
      <div className="glass-s" style={{padding:'5px 12px',display:'flex',alignItems:'center',gap:8,borderColor:'var(--border2)'}}>
        <div className="avatar" style={{width:32,height:32,fontSize:15}}>{user.avatar||'👑'}</div>
      </div>
      <button className="icon-btn" onClick={onLogout}><Icon name="logout" size={16}/></button>
    </div>
  </div>;
}

function Dashboard(){
  const app=useApp();
  const students=app.db.users.filter(u=>u.role==='student');
  const active=students.filter(s=>s.active!==false).length;
  const totalLessons=app.db.lessons.filter(l=>l.published!==false).length;
  let totalDone=0;
  students.forEach(s=>{totalDone+=(s.completed_lessons||[]).length;});
  const avgProgress=students.length&&totalLessons?Math.round((totalDone/(students.length*totalLessons))*100):0;
  const top10=useMemo(()=>[...students].sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10),[students]);
  const recentAct=(app.db.activity||[]).slice(0,8);
  const actLabel={login:'تسجيل دخول',register:'تسجيل جديد',lesson_view:'فتح درس',lesson_complete:'أكمل درس',exam_start:'بدأ اختبار',exam_submit:'أنهى اختبار',video_play:'شاهد فيديو',video_25:'25%',video_50:'50%',video_75:'75%',video_complete:'أكمل الفيديو',mission_complete:'أكمل مهمة',achievement_unlock:'فتح إنجاز',poll_vote:'صوّت في استطلاع'};
  
  const chart1Ref=useRef(null);
  const chart2Ref=useRef(null);
  const chart3Ref=useRef(null);
  const chart1Instance=useRef(null);
  const chart2Instance=useRef(null);
  const chart3Instance=useRef(null);

  useEffect(()=>{
    if(!chart1Ref.current || !window.Chart) return;
    const ctx=chart1Ref.current.getContext("2d");
    if(chart1Instance.current) chart1Instance.current.destroy();
    const g1=ctx.createLinearGradient(0,0,0,240);
    g1.addColorStop(0,"rgba(255,215,0,0.85)");
    g1.addColorStop(1,"rgba(139,105,20,0.5)");
    chart1Instance.current=new window.Chart(ctx,{
      type:"bar",
      data:{
        labels:top10.map(s=>s.name.split(" ")[0]),
        datasets:[{label:"XP",data:top10.map(s=>s.xp||0),backgroundColor:g1,borderColor:"#FFD700",borderWidth:2,borderRadius:10}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:"#d4c79a",font:{family:"Tajawal",size:12}},grid:{display:false}},
          y:{ticks:{color:"#d4c79a",font:{family:"Tajawal",size:12}},grid:{color:"rgba(212,175,55,0.08)"}}
        }
      }
    });
    return ()=>{if(chart1Instance.current)chart1Instance.current.destroy();};
  },[top10]);

  useEffect(()=>{
    if(!chart2Ref.current || !window.Chart) return;
    const ctx=chart2Ref.current.getContext("2d");
    if(chart2Instance.current) chart2Instance.current.destroy();
    const levels=[...app.db.levels].sort((a,b)=>a.xp-b.xp);
    const distribution=levels.map(lv=>({
      name:`Lv ${lv.level} - ${lv.name}`,
      count:students.filter(s=>{const {current}=app.getLevel(s.xp||0);return current.level===lv.level;}).length
    }));
    chart2Instance.current=new window.Chart(ctx,{
      type:"doughnut",
      data:{
        labels:distribution.map(d=>d.name),
        datasets:[{data:distribution.map(d=>d.count),backgroundColor:["rgba(255,215,0,0.8)","rgba(212,175,55,0.8)","rgba(184,134,11,0.8)","rgba(139,105,20,0.8)","rgba(92,69,9,0.8)"],borderColor:"rgba(10,8,5,0.7)",borderWidth:3}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:"#d4c79a",font:{family:"Tajawal",size:11},padding:12,boxWidth:14}}}}
    });
    return ()=>{if(chart2Instance.current)chart2Instance.current.destroy();};
  },[students,app.db.levels]);

  useEffect(()=>{
    if(!chart3Ref.current || !window.Chart) return;
    const ctx=chart3Ref.current.getContext("2d");
    if(chart3Instance.current) chart3Instance.current.destroy();
    
    const govStats={};
    students.forEach(s=>{
      const gov = s.governorate || 'بدون محافظة';
      govStats[gov] = (govStats[gov] || 0) + 1;
    });
    const sorted = Object.entries(govStats).sort((a,b)=>b[1]-a[1]).slice(0, 10);
    
    if (sorted.length === 0) return;
    
    const colors = [
      "rgba(255,215,0,0.85)","rgba(212,175,55,0.85)","rgba(184,134,11,0.85)",
      "rgba(245,222,110,0.85)","rgba(139,105,20,0.85)","rgba(255,237,78,0.85)",
      "rgba(168,132,20,0.85)","rgba(220,190,80,0.85)","rgba(92,69,9,0.85)","rgba(255,240,150,0.85)"
    ];
    
    chart3Instance.current=new window.Chart(ctx,{
      type:"doughnut",
      data:{
        labels: sorted.map(s => s[0]),
        datasets: [{
          data: sorted.map(s => s[1]),
          backgroundColor: colors.slice(0, sorted.length),
          borderColor: "rgba(10,8,5,0.7)",
          borderWidth: 3
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"bottom",labels:{color:"#d4c79a",font:{family:"Tajawal",size:11},padding:12,boxWidth:14}}}
      }
    });
    return ()=>{if(chart3Instance.current)chart3Instance.current.destroy();};
  },[students]);

  const exportToCSV=()=>{
    const headers=["الاسم","الهاتف","المحافظة","البريد","XP","المستوى","سلسلة الأيام","الحالة","دروس مكتملة"];
    const rows=students.map(s=>{
      const {current}=app.getLevel(s.xp||0);
      return [
        s.name,
        (s.country_code||"+20")+(s.phone||""),
        s.governorate || "—",
        s.email||"—",
        s.xp||0,
        `Lv ${current.level} - ${current.name}`,
        s.streak||0,
        s.active===false?"موقوف":"نشط",
        (s.completed_lessons||[]).length
      ];
    });
    const csv=[headers,...rows].map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`students_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    app.toast.ok("تم تصدير البيانات");
  };

  return <>
    <div className="hero mb16">
      <div className="flex between center wrap g12">
        <div>
          <div className="h2 mb6 grad">لوحة تحكم الأدمن</div>
          <div className="sm txt2">إدارة كاملة لكل محتوى المنصة</div>
        </div>
        <button className="btn btn-p" onClick={exportToCSV}>
          <Icon name="file" size={15}/> تصدير Excel
        </button>
      </div>
    </div>
    
    <div className="grid g4 mb16">
      <Stat label="إجمالي الطلاب" value={DB.fmt(students.length)} icon="users" color="#FFD700"/>
      <Stat label="الطلاب النشطون" value={DB.fmt(active)} icon="check" color="#22c55e"/>
      <Stat label="عدد المواد" value={DB.fmt(app.db.subjects.length)} icon="book" color="#D4AF37"/>
      <Stat label="عدد الدروس" value={DB.fmt(app.db.lessons.length)} icon="file" color="#B8860B"/>
      <Stat label="الوحدات" value={DB.fmt(app.db.units.length)} icon="folder" color="#FFED4E"/>
      <Stat label="الاختبارات" value={DB.fmt(app.db.exams.length)} icon="clipboard" color="#D4AF37"/>
      <Stat label="الأسئلة" value={DB.fmt(app.db.questions.length)} icon="help" color="#FFD700"/>
      <Stat label="متوسط التقدم" value={`${avgProgress}%`} icon="trend" color="#FFD700"/>
    </div>

    <div className="grid g2 mb16">
      <div className="glass" style={{padding:18}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>📊 XP — أفضل 10 طلاب</div>
        <div style={{height:240,position:'relative'}}>
          <canvas ref={chart1Ref}></canvas>
        </div>
      </div>
      <div className="glass" style={{padding:18}}>
        <div className="h4 mb12" style={{color:'var(--gold)'}}>🎯 توزيع المستويات</div>
        <div style={{height:240,position:'relative'}}>
          <canvas ref={chart2Ref}></canvas>
        </div>
      </div>
    </div>

    <div className="glass mb16" style={{padding:18}}>
      <div className="flex between center mb12 wrap g8">
        <div className="h4" style={{color:'var(--gold)'}}>📍 توزيع الطلاب على المحافظات</div>
        <span className="pill pill-b">{students.filter(s=>s.governorate).length} طالب</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.2fr)',gap:16,alignItems:'center'}}>
        <div style={{height:260,position:'relative'}}>
          <canvas ref={chart3Ref}></canvas>
        </div>
        <div>
          {(()=>{
            const govStats={};
            students.forEach(s=>{
              const gov = s.governorate || 'بدون محافظة';
              govStats[gov] = (govStats[gov] || 0) + 1;
            });
            const sorted = Object.entries(govStats).sort((a,b)=>b[1]-a[1]);
            
            return sorted.map(([gov, count], idx) => (
              <div key={gov} className="flex between center" style={{padding:'8px 12px',borderBottom:'1px solid rgba(212,175,55,.08)'}}>
                <div className="flex center g8">
                  <span className="pill pill-b" style={{fontSize:10, padding:'2px 8px'}}>{idx + 1}</span>
                  <span className="sm">📍 {gov}</span>
                </div>
                <div className="flex center g8">
                  <div style={{width:'60px',height:'6px',background:'rgba(212,175,55,.12)',borderRadius:20,overflow:'hidden'}}>
                    <div style={{width:`${(count/students.length)*100}%`,height:'100%',background:'var(--grad-gold)'}}/>
                  </div>
                  <span className="pill pill-g" style={{fontSize:11}}>{count}</span>
                </div>
              </div>
            ));
          })()}
        </div>
      </div>
    </div>

    <div className="grid g2 mb16">
      <div className="glass" style={{padding:18}}>
        <div className="h4 mb12" style={{display:'flex',alignItems:'center',gap:8,color:'var(--gold)'}}><Icon name="award" size={16}/> المتصدرون العشرة</div>
        {top10.length===0?<Empty icon="🏅" title="لا يوجد طلاب بعد"/>:
          top10.map((s,i)=>{
            const {current}=app.getLevel(s.xp||0);
            return <div key={s.id} className="flex center g12" style={{padding:'8px 0',borderBottom:'1px solid rgba(212,175,55,.08)'}}>
              <div className={`rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-x'}`}>{i+1}</div>
              <div className="avatar" style={{width:34,height:34,fontSize:14}}>{s.avatar||'👤'}</div>
              <div style={{flex:1}}>
                <div className="sm">{s.name} {s.governorate && <span className="xs muted">— 📍 {s.governorate}</span>}</div>
                <div className="xs muted">Lv {current.level} — {current.name}</div>
              </div>
              <span className="pill pill-b">{DB.fmt(s.xp||0)} XP</span>
            </div>;
          })
        }
      </div>
      <div className="glass" style={{padding:18}}>
        <div className="flex between center mb12">
          <div className="h4" style={{display:'flex',alignItems:'center',gap:8,color:'var(--gold)'}}>
            <Icon name="activity" size={16}/> آخر الأنشطة
          </div>
          <span className="pill pill-b">{app.db.activity?.length || 0}</span>
        </div>
        {recentAct.length===0 ? (
          <div style={{padding:'24px',textAlign:'center'}}>
            <div style={{fontSize:40,opacity:.3,marginBottom:8}}>📡</div>
            <div className="sm muted">لا يوجد نشاط بعد</div>
            <div className="xs muted mt6">سيظهر نشاط الطلاب هنا</div>
          </div>
        ) : (
          recentAct.map(a => (
            <div key={a.id} className="flex center g12" style={{padding:'8px 0',borderBottom:'1px solid rgba(212,175,55,.08)'}}>
              <div className="act-ico"><Icon name="activity" size={16}/></div>
              <div style={{flex:1}}>
                <div className="sm">{a.user_name || 'غير معروف'}</div>
                <div className="xs muted">{actLabel[a.type] || a.type}{a.target ? ` — ${a.target}` : ''}</div>
              </div>
              <div className="xs muted">{DB.formatTime(a.at)}</div>
            </div>
          ))
        )}
      </div>
    </div>
  </>;
}

function Crud({title,collection,defaultItem,fields,columns}){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [busy,setBusy]=useState(false);
  const items=[...(app.db[collection]||[])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const openNew=()=>{setForm(defaultItem());setEditing('new');};
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};
  const save=async ()=>{
    setBusy(true);
    try{
      await app.save(collection,form);
      app.toast.ok(editing==='new'?'تمت الإضافة':'تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    const r=await Swal.fire({
      title:'تأكيد الحذف',text:'سيتم حذف هذا العنصر نهائيًا',icon:'warning',
      showCancelButton:true,confirmButtonText:'نعم، احذف',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{await app.remove(collection,id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };
  return <>
    <div className="flex between center mb16">
      <div className="h2 grad">{title}</div>
      <button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> إضافة</button>
    </div>
    <div className="glass" style={{padding:14}}>
      {items.length===0?<Empty title="لا توجد بيانات"/>:
        <div className="sx"><table className="tbl">
          <thead><tr>{columns.map((c,i)=><th key={i}>{c.label}</th>)}<th>إجراءات</th></tr></thead>
          <tbody>{items.map(it=><tr key={it.id}>
            {columns.map((c,i)=><td key={i}>{c.render?c.render(it,app):it[c.key]}</td>)}
            <td><div className="flex g6">
              <button className="btn btn-s btn-sm" onClick={()=>openEdit(it)}><Icon name="edit" size={13}/></button>
              <button className="btn btn-dn btn-sm" onClick={()=>del(it.id)}><Icon name="trash" size={13}/></button>
            </div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>
    {editing!==null&&<Modal title={editing==='new'?'إضافة':'تعديل'} onClose={()=>setEditing(null)} wide>
      <div className="grid g2">
        {fields.map(f=><div key={f.key} style={{gridColumn:f.full?'span 2':'span 1'}}>
          <Field label={f.label} hint={f.hint}>
            {f.type==='textarea'?<textarea className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>:
             f.type==='number'?<input type="number" className="input" value={form[f.key]??''} onChange={e=>setForm({...form,[f.key]:+e.target.value})}/>:
             f.type==='select'?<select className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}>
               <option value="">— اختر —</option>
               {(typeof f.options==='function'?f.options(app):f.options).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
             </select>:
             f.type==='list'?<textarea className="input" placeholder="سطر لكل عنصر" value={(form[f.key]||[]).join('\n')} onChange={e=>setForm({...form,[f.key]:e.target.value.split('\n').filter(Boolean)})}/>:
             f.type==='bool'?<label className="flex center g8" style={{cursor:'pointer'}}><input type="checkbox" checked={!!form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.checked})}/><span className="sm">{form[f.key]?'مفعّل':'معطّل'}</span></label>:
             <input className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>}
          </Field>
        </div>)}
      </div>
      <div className="flex g8 mt16">
        <button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button>
        <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
      </div>
    </Modal>}
  </>;
}

function LessonsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [busy,setBusy]=useState(false);
  const openNew=()=>{setForm({title:'',desc:'',summary:'',video:{type:'youtube',url:'',poster:'',allowDownload:false,allowExternal:true},duration:15,xp:20,sort_order:1,unit_id:'',published:true,key_points:[],examples:[],notes:'',pdfs:[]});setEditing('new');};
  const openEdit=it=>{const c=JSON.parse(JSON.stringify(it));if(!c.video)c.video={type:'youtube',url:'',poster:'',allowDownload:false,allowExternal:true};if(!c.key_points)c.key_points=[];setForm(c);setEditing(it.id);};
  const save=async ()=>{
    if(!form.title) return app.toast.warn('العنوان مطلوب');
    if(!form.unit_id) return app.toast.warn('اختر الوحدة');
    setBusy(true);
    try{await app.save('lessons',form);app.toast.ok(editing==='new'?'تمت الإضافة':'تم الحفظ');setEditing(null);}
    catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    const r=await Swal.fire({title:'حذف الدرس؟',text:'لا يمكن التراجع',icon:'warning',showCancelButton:true,confirmButtonText:'نعم، احذف',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    if(!r.isConfirmed) return;
    try{await app.remove('lessons',id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };
  const badge=l=>{if(!l.video||!l.video.url)return <span className="pill pill-y">لا فيديو</span>;const map={youtube:'📺 YouTube',vimeo:'🎬 Vimeo',mp4:'🎥 MP4',external:'🔗 خارجي'};return <span className="pill pill-b">{map[l.video.type]||l.video.type}</span>;};

  const sortedLessons = useMemo(()=>{
    return [...app.db.lessons].sort((a,b)=>{
      const ta = new Date(a.created_at || a.createdAt || 0).getTime() || 0;
      const tb = new Date(b.created_at || b.createdAt || 0).getTime() || 0;
      if(ta !== tb) return ta - tb;
      const sa = Number(a.sort_order) || 0;
      const sb = Number(b.sort_order) || 0;
      return sa - sb;
    });
  },[app.db.lessons]);

  return <>
    <div className="flex between center mb16"><div className="h2 grad">📖 إدارة الدروس</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> درس جديد</button></div>
    <div className="glass" style={{padding:14}}>
      {sortedLessons.length===0?<Empty title="لا توجد دروس"/>:
        <div className="sx"><table className="tbl">
          <thead><tr><th>الدرس</th><th>الوحدة</th><th>الفيديو</th><th>XP</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody>{sortedLessons.map(l=><tr key={l.id}>
            <td><b>{l.title}</b></td><td className="sm">{app.unit(l.unit_id)?.name||'—'}</td><td>{badge(l)}</td><td>{l.xp}</td>
            <td>{l.published!==false?<span className="pill pill-g">منشور</span>:<span className="pill pill-y">مخفي</span>}</td>
            <td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>openEdit(l)}><Icon name="edit" size={13}/></button><button className="btn btn-dn btn-sm" onClick={()=>del(l.id)}><Icon name="trash" size={13}/></button></div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>
    {editing!==null&&<Modal title={editing==='new'?'درس جديد':'تعديل الدرس'} onClose={()=>setEditing(null)} wide>
      <div className="grid g2">
        <Field label="عنوان الدرس"><input className="input" value={form.title||''} onChange={e=>setForm({...form,title:e.target.value})}/></Field>
        <Field label="الوحدة"><select className="input" value={form.unit_id||''} onChange={e=>setForm({...form,unit_id:e.target.value})}><option value="">— اختر —</option>{app.db.units.map(u=><option key={u.id} value={u.id}>{app.subject(u.subject_id)?.name} — {u.name}</option>)}</select></Field>
        <Field label="المدة (دقيقة)"><input type="number" className="input" value={form.duration||15} onChange={e=>setForm({...form,duration:+e.target.value})}/></Field>
        <Field label="XP"><input type="number" className="input" value={form.xp||20} onChange={e=>setForm({...form,xp:+e.target.value})}/></Field>
        <Field label="الترتيب"><input type="number" className="input" value={form.sort_order||1} onChange={e=>setForm({...form,sort_order:+e.target.value})}/></Field>
        <Field label="الحالة"><select className="input" value={form.published!==false?'1':'0'} onChange={e=>setForm({...form,published:e.target.value==='1'})}><option value="1">منشور</option><option value="0">مخفي</option></select></Field>
        <Field label="وصف الدرس" full><textarea className="input" value={form.desc||''} onChange={e=>setForm({...form,desc:e.target.value})}/></Field>
      </div>
      <div className="mb12"><VideoEditor value={form.video} onChange={v=>setForm({...form,video:v})}/></div>
      <Field label="ملخص الدرس" full><textarea className="input" value={form.summary||''} onChange={e=>setForm({...form,summary:e.target.value})}/></Field>
      <Field label="النقاط المهمة" full hint="سطر لكل نقطة"><textarea className="input" value={(form.key_points||[]).join('\n')} onChange={e=>setForm({...form,key_points:e.target.value.split('\n').filter(Boolean)})}/></Field>
      <Field label="ملاحظات" full><textarea className="input" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}
function QuestionsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [bulkMode,setBulkMode]=useState(false);
  const [bulkForm,setBulkForm]=useState({
    lesson_id:'',
    difficulty:'medium',
    xp:10,
    questions:[{text:'',options:['','','',''],correct:0,explanation:''}]
  });
  const [busy,setBusy]=useState(false);
  const [filterLesson,setFilterLesson]=useState('all');

  const openNew=()=>{
    setForm({text:'',options:['','','',''],correct:[0],explanation:'',lesson_id:'',difficulty:'medium',xp:10,type:'mcq'});
    setEditing('new');
  };
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};

  const save=async ()=>{
    if(!form.text||!form.lesson_id) return app.toast.warn('النص والدرس مطلوبان');
    const lesson=app.lesson(form.lesson_id);
    const unit_id=lesson?.unit_id||'';
    const subject_id=app.unit(unit_id)?.subject_id||'';
    setBusy(true);
    try{
      await app.save('questions',{...form,unit_id,subject_id});
      app.toast.ok('تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };

  const saveBulk=async ()=>{
    if(!bulkForm.lesson_id) return app.toast.warn('اختر الدرس');
    const validQs = bulkForm.questions.filter(q=>q.text.trim() && q.options.some(o=>o.trim()));
    if(validQs.length===0) return app.toast.warn('أضف سؤالاً واحداً على الأقل');

    const lesson = app.lesson(bulkForm.lesson_id);
    const unit_id = lesson?.unit_id || '';
    const subject_id = app.unit(unit_id)?.subject_id || '';

    setBusy(true);
    try{
      for(const q of validQs){
        const record = {
          text: q.text.trim(),
          options: q.options.map(o=>o.trim()),
          correct: [q.correct],
          explanation: q.explanation.trim(),
          lesson_id: bulkForm.lesson_id,
          unit_id,
          subject_id,
          difficulty: bulkForm.difficulty,
          xp: bulkForm.xp,
          type: 'mcq'
        };
        await app.save('questions', record);
      }
      app.toast.ok(`✅ تمت إضافة ${validQs.length} سؤال`);
      setBulkMode(false);
      setBulkForm({
        lesson_id:'', difficulty:'medium', xp:10,
        questions:[{text:'',options:['','','',''],correct:0,explanation:''}]
      });
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };

  const del=async id=>{
    const r=await Swal.fire({
      title:'حذف السؤال؟',icon:'warning',showCancelButton:true,
      confirmButtonText:'نعم',cancelButtonText:'إلغاء',
      confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',
      background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',
      customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}
    });
    if(!r.isConfirmed) return;
    try{await app.remove('questions',id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };

  const addBulkQuestion=()=>{
    setBulkForm(f=>({...f,questions:[...f.questions,{text:'',options:['','','',''],correct:0,explanation:''}]}));
  };
  const removeBulkQuestion=(idx)=>{
    setBulkForm(f=>({...f,questions:f.questions.filter((_,i)=>i!==idx)}));
  };
  const updateBulkQuestion=(idx,patch)=>{
    setBulkForm(f=>({...f,questions:f.questions.map((q,i)=>i===idx?{...q,...patch}:q)}));
  };

  const filteredQuestions = filterLesson === 'all'
    ? app.db.questions
    : app.db.questions.filter(q=>q.lesson_id === filterLesson);

  const sortedQuestions = useMemo(()=>{
    return [...filteredQuestions].sort((a,b)=>{
      const ta = new Date(a.created_at || a.createdAt || 0).getTime() || 0;
      const tb = new Date(b.created_at || b.createdAt || 0).getTime() || 0;
      return ta - tb;
    });
  },[filteredQuestions]);

  return <>
    <div className="flex between center mb16 wrap g8">
      <div className="h2 grad">❓ بنك الأسئلة</div>
      <div className="flex g8">
        <button className="btn btn-s" onClick={()=>setBulkMode(true)}>
          <Icon name="plus" size={14}/> إضافة مجموعة أسئلة
        </button>
        <button className="btn btn-p" onClick={openNew}>
          <Icon name="plus" size={15}/> سؤال واحد
        </button>
      </div>
    </div>

    <div className="flex between center mb12 wrap g8">
      <div className="flex center g8">
        <span className="sm muted">تصفية حسب الدرس:</span>
        <select className="input" style={{maxWidth:280}} value={filterLesson} onChange={e=>setFilterLesson(e.target.value)}>
          <option value="all">جميع الدروس ({app.db.questions.length})</option>
          {app.db.lessons.map(l=>{
            const count = app.db.questions.filter(q=>q.lesson_id===l.id).length;
            return <option key={l.id} value={l.id}>{l.title} ({count})</option>;
          })}
        </select>
      </div>
      <span className="pill pill-b">{sortedQuestions.length} سؤال</span>
    </div>

    <div className="glass" style={{padding:14}}>
      {sortedQuestions.length===0?<Empty title="لا توجد أسئلة"/>:
        <div className="sx"><table className="tbl">
          <thead><tr><th>السؤال</th><th>الدرس</th><th>الصعوبة</th><th>XP</th><th>إجراءات</th></tr></thead>
          <tbody>{sortedQuestions.map(q=><tr key={q.id}>
            <td style={{maxWidth:340}}>{q.text.slice(0,80)}{q.text.length>80?'...':''}</td>
            <td className="sm">{app.lesson(q.lesson_id)?.title||'—'}</td>
            <td><span className={`pill ${q.difficulty==='easy'?'pill-g':q.difficulty==='hard'?'pill-r':'pill-a'}`}>{q.difficulty}</span></td>
            <td>{q.xp}</td>
            <td><div className="flex g6">
              <button className="btn btn-s btn-sm" onClick={()=>openEdit(q)}><Icon name="edit" size={13}/></button>
              <button className="btn btn-dn btn-sm" onClick={()=>del(q.id)}><Icon name="trash" size={13}/></button>
            </div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>

    {editing!==null&&<Modal title={editing==='new'?'سؤال جديد':'تعديل السؤال'} onClose={()=>setEditing(null)} wide>
      <Field label="نص السؤال"><textarea className="input" value={form.text||''} onChange={e=>setForm({...form,text:e.target.value})}/></Field>
      <Field label="الخيارات">
        {(form.options||[]).map((op,i)=><div key={i} className="flex g8 mb6 center">
          <button type="button" className={`btn btn-sm ${form.correct?.includes(i)?'btn-ok':'btn-s'}`} onClick={()=>setForm({...form,correct:[i]})}>{['أ','ب','ج','د'][i]}</button>
          <input className="input" value={op} onChange={e=>{const o=[...form.options];o[i]=e.target.value;setForm({...form,options:o});}}/>
        </div>)}
      </Field>
      <Field label="شرح الإجابة"><textarea className="input" value={form.explanation||''} onChange={e=>setForm({...form,explanation:e.target.value})}/></Field>
      <div className="grid g2">
        <Field label="الدرس"><select className="input" value={form.lesson_id||''} onChange={e=>setForm({...form,lesson_id:e.target.value})}><option value="">— اختر —</option>{app.db.lessons.map(l=><option key={l.id} value={l.id}>{l.title}</option>)}</select></Field>
        <Field label="الصعوبة"><select className="input" value={form.difficulty||'medium'} onChange={e=>setForm({...form,difficulty:e.target.value})}><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></Field>
        <Field label="XP"><input type="number" className="input" value={form.xp||10} onChange={e=>setForm({...form,xp:+e.target.value})}/></Field>
      </div>
      <div className="flex g8 mt16">
        <button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button>
        <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
      </div>
    </Modal>}

    {bulkMode&&<Modal title="📚 إضافة مجموعة أسئلة" onClose={()=>setBulkMode(false)} wide>
      <div className="grid g2 mb12">
        <Field label="الدرس المستهدف">
          <select className="input" value={bulkForm.lesson_id} onChange={e=>setBulkForm({...bulkForm,lesson_id:e.target.value})}>
            <option value="">— اختر الدرس —</option>
            {app.db.lessons.map(l=><option key={l.id} value={l.id}>{app.subject(app.unit(l.unit_id)?.subject_id)?.name} — {l.title}</option>)}
          </select>
        </Field>
        <Field label="الصعوبة">
          <select className="input" value={bulkForm.difficulty} onChange={e=>setBulkForm({...bulkForm,difficulty:e.target.value})}>
            <option value="easy">سهل</option>
            <option value="medium">متوسط</option>
            <option value="hard">صعب</option>
          </select>
        </Field>
        <Field label="XP لكل سؤال">
          <input type="number" className="input" value={bulkForm.xp} onChange={e=>setBulkForm({...bulkForm,xp:+e.target.value})}/>
        </Field>
        <Field label="عدد الأسئلة">
          <div className="pill pill-b" style={{padding:'12px 20px',fontSize:14}}>{bulkForm.questions.length} سؤال</div>
        </Field>
      </div>

      <div className="div"/>

      <div style={{maxHeight:'60vh',overflowY:'auto',paddingInlineEnd:6}}>
        {bulkForm.questions.map((q,idx)=>(
          <div key={idx} className="glass-s mb12" style={{padding:16,borderColor:'var(--border2)'}}>
            <div className="flex between center mb12">
              <span className="pill pill-b">سؤال {idx+1}</span>
              {bulkForm.questions.length > 1 && (
                <button className="btn btn-dn btn-sm" onClick={()=>removeBulkQuestion(idx)}>
                  <Icon name="trash" size={12}/> حذف
                </button>
              )}
            </div>

            <Field label="نص السؤال">
              <textarea className="input" rows="2" value={q.text} onChange={e=>updateBulkQuestion(idx,{text:e.target.value})} placeholder="اكتب السؤال هنا..."/>
            </Field>

            <Field label="الخيارات (اضغط على الحرف لتحديد الإجابة الصحيحة)">
              {q.options.map((op,oi)=>(
                <div key={oi} className="flex g8 mb6 center">
                  <button type="button" className={`btn btn-sm ${q.correct===oi?'btn-ok':'btn-s'}`}
                    onClick={()=>updateBulkQuestion(idx,{correct:oi})} style={{minWidth:44}}>
                    {['أ','ب','ج','د'][oi]}
                  </button>
                  <input className="input" value={op} onChange={e=>{
                    const opts=[...q.options]; opts[oi]=e.target.value;
                    updateBulkQuestion(idx,{options:opts});
                  }} placeholder={`الخيار ${['أ','ب','ج','د'][oi]}`}/>
                </div>
              ))}
            </Field>

            <Field label="شرح الإجابة (اختياري)">
              <textarea className="input" rows="2" value={q.explanation} onChange={e=>updateBulkQuestion(idx,{explanation:e.target.value})} placeholder="اشرح سبب الإجابة الصحيحة..."/>
            </Field>
          </div>
        ))}
      </div>

      <div className="flex g8 mt12">
        <button className="btn btn-s" onClick={addBulkQuestion} style={{flex:1}}>
          <Icon name="plus" size={14}/> إضافة سؤال آخر
        </button>
        <button className="btn btn-p" onClick={saveBulk} disabled={busy} style={{flex:1}}>
          {busy?'جارٍ الحفظ...':`💾 حفظ ${bulkForm.questions.length} سؤال`}
        </button>
      </div>
    </Modal>}
  </>;
}

    const r=await Swal.fire({title:'حذف الاختبار؟',icon:'warning',showCancelButton:true,confirmButtonText:'نعم',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',background:'linear-gradient(180deg, #1c160c, #0f0c07)',color:'#f7f0dd',customClass:{popup:'swal-custom-popup',title:'swal-custom-title'}});
    if(!r.isConfirmed) return;
    try{await app.remove('exams',id);app.toast.warn('تم الحذف');}catch(e){app.toast.err(e.message);}
  };
  const availQ=form.unit_id?app.db.questions.filter(q=>q.unit_id===form.unit_id):app.db.questions;

  const sortedExams = useMemo(()=>{
    return [...app.db.exams].sort((a,b)=>{
      const ta = new Date(a.created_at || a.createdAt || 0).getTime() || 0;
      const tb = new Date(b.created_at || b.createdAt || 0).getTime() || 0;
      return ta - tb;
    });
  },[app.db.exams]);

  return <>
    <div className="flex between center mb16"><div className="h2 grad">📝 إدارة الاختبارات</div><button className="btn btn-p" onClick={openNew}><Icon name="plus" size={15}/> اختبار جديد</button></div>
    <div className="glass" style={{padding:14}}>
      {sortedExams.length===0?<Empty title="لا توجد اختبارات"/>:
        <div className="sx"><table className="tbl">
          <thead><tr><th>العنوان</th><th>المادة</th><th>الأسئلة</th><th>النجاح</th><th>إجراءات</th></tr></thead>
          <tbody>{sortedExams.map(e=><tr key={e.id}>
            <td>{e.title}</td><td className="sm">{app.subject(e.subject_id)?.name||'—'}</td>
            <td>{(e.question_ids||[]).length}</td><td>{e.pass_score}%</td>
            <td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>openEdit(e)}><Icon name="edit" size={13}/></button><button className="btn btn-dn btn-sm" onClick={()=>del(e.id)}><Icon name="trash" size={13}/></button></div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>
    {editing!==null&&<Modal title={editing==='new'?'اختبار جديد':'تعديل الاختبار'} onClose={()=>setEditing(null)} wide>
      <Field label="اسم الاختبار"><input className="input" value={form.title||''} onChange={e=>setForm({...form,title:e.target.value})}/></Field>
      <div className="grid g2">
        <Field label="المادة"><select className="input" value={form.subject_id||''} onChange={e=>setForm({...form,subject_id:e.target.value,unit_id:''})}><option value="">— اختر —</option>{app.db.subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
        <Field label="الوحدة"><select className="input" value={form.unit_id||''} onChange={e=>setForm({...form,unit_id:e.target.value,question_ids:[]})}><option value="">— اختر —</option>{app.db.units.filter(u=>!form.subject_id||u.subject_id===form.subject_id).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
        <Field label="المدة (دقيقة)"><input type="number" className="input" value={form.duration||15} onChange={e=>setForm({...form,duration:+e.target.value})}/></Field>
        <Field label="درجة النجاح %"><input type="number" className="input" value={form.pass_score||60} onChange={e=>setForm({...form,pass_score:+e.target.value})}/></Field>
        <Field label="عدد المحاولات"><input type="number" className="input" value={form.max_attempts||3} onChange={e=>setForm({...form,max_attempts:+e.target.value})}/></Field>
        <Field label="XP"><input type="number" className="input" value={form.xp||50} onChange={e=>setForm({...form,xp:+e.target.value})}/></Field>
      </div>
      <Field label={`الأسئلة (${(form.question_ids||[]).length} مختار)`}>
        <div className="glass-s" style={{padding:10,maxHeight:260,overflowY:'auto'}}>
          {availQ.length===0?<div className="sm muted">لا توجد أسئلة</div>:
            availQ.map(q=>{const on=(form.question_ids||[]).includes(q.id);return <label key={q.id} className="flex center g8 mb6" style={{padding:6,cursor:'pointer'}}>
              <input type="checkbox" checked={on} onChange={()=>setForm({...form,question_ids:on?(form.question_ids||[]).filter(x=>x!==q.id):[...(form.question_ids||[]),q.id]})}/>
              <span className="sm" style={{flex:1}}>{q.text.slice(0,80)}</span>
            </label>;})
          }
        </div>
      </Field>
      <label className="flex center g8 mt12"><input type="checkbox" checked={form.published!==false} onChange={e=>setForm({...form,published:e.target.checked})}/><span className="sm">منشور</span></label>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

function StudentsPage(){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [q,setQ]=useState('');
  const [govFilter,setGovFilter]=useState('all');
  const [busy,setBusy]=useState(false);

  const GOVERNORATES = [
    "القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "الشرقية", "المنوفية",
    "القليوبية", "البحيرة", "الغربية", "بورسعيد", "دمياط", "الإسماعيلية",
    "السويس", "كفر الشيخ", "الفيوم", "بني سويف", "المنيا", "أسيوط",
    "سوهاج", "قنا", "الأقصر", "أسوان", "البحر الأحمر", "الوادي الجديد",
    "مطروح", "شمال سيناء", "جنوب سيناء"
  ];

  const allStudents = app.db.users.filter(u => u.role === 'student');
  
  const list = allStudents.filter(u => {
    const matchesSearch = u.name.toLowerCase().includes(q.toLowerCase()) || (u.phone||'').includes(q);
    let matchesGov = true;
    if (govFilter === 'all') matchesGov = true;
    else if (govFilter === 'none') matchesGov = !u.governorate;
    else matchesGov = u.governorate === govFilter;
    return matchesSearch && matchesGov;
  });

  const open = s => { setForm(JSON.parse(JSON.stringify(s))); setEditing(s.id); };

  const save = async () => {
  setBusy(true);
  try {
    await DB.updateUser(editing, {
      name: form.name,
      phone: form.phone,
      xp: form.xp,
      grade_id: form.grade_id,
      governorate: form.governorate || null,
      all_subjects: form.all_subjects,
      access_subjects: form.access_subjects || [],
      subscription: form.subscription || 'free',
      subscription_until: form.subscription_until || null
    });

  const toggle = async s => {
    const action = s.active !== false ? 'إيقاف' : 'تفعيل';
    const r = await Swal.fire({
      title: `${action} الحساب؟`,
      text: `هل تريد ${action} حساب ${s.name}؟`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: `نعم، ${action}`,
      cancelButtonText: 'إلغاء',
      confirmButtonColor: s.active !== false ? '#ef4444' : '#D4AF37',
      cancelButtonColor: '#64748b',
      background: 'linear-gradient(180deg, #1c160c, #0f0c07)',
      color: '#f7f0dd',
      customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }
    });
    if (!r.isConfirmed) return;
    try {
      await DB.updateUser(s.id, { active: !s.active });
      await app.reload();
      app.toast.warn(s.active !== false ? 'تم الإيقاف' : 'تم التفعيل');
    } catch(e) { app.toast.err(e.message); }
  };

  const govCounts = {};
  allStudents.forEach(u => {
    if (u.governorate) {
      govCounts[u.governorate] = (govCounts[u.governorate] || 0) + 1;
    }
  });

  return <>
    <div className="flex between center mb16 wrap g8">
      <div className="h2 grad">إدارة الطلاب</div>
      <div className="flex g8 wrap">
        <input
          className="input"
          style={{maxWidth:200}}
          placeholder="🔍 بحث..."
          value={q}
          onChange={e=>setQ(e.target.value)}
        />
        <select
          className="input"
          style={{maxWidth:220}}
          value={govFilter}
          onChange={e=>setGovFilter(e.target.value)}
        >
          <option value="all">كل المحافظات ({allStudents.length})</option>
          {GOVERNORATES.map(gov => {
            const count = govCounts[gov] || 0;
            if (count === 0) return null;
            return <option key={gov} value={gov}>{gov} ({count})</option>;
          })}
          <option value="none">— بدون محافظة ({allStudents.filter(u=>!u.governorate).length}) —</option>
        </select>
      </div>
    </div>

    <div className="glass" style={{padding:14}}>
      <div className="sx">
        <table className="tbl">
          <thead>
            <tr>
              <th>الطالب</th>
              <th>الهاتف</th>
              <th>📍 المحافظة</th>
              <th>XP</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody>
            {list.map(s => (
              <tr key={s.id}>
                <td>
                  <div className="flex center g8">
                    <div className="avatar" style={{width:30,height:30,fontSize:14}}>{s.avatar||'👤'}</div>
                    <span>{s.name}</span>
                  </div>
                </td>
                <td className="sm muted" dir="ltr">{(s.country_code||'+20')}{s.phone||''}</td>
                <td>
                  {s.governorate
                    ? <span className="pill pill-b" style={{fontSize:11}}>📍 {s.governorate}</span>
                    : <span className="xs muted">—</span>
                  }
                </td>
                <td><b style={{color:'var(--gold)'}}>{DB.fmt(s.xp||0)}</b></td>
<td>
  {s.subscription === 'vip' ? <span className="pill pill-v">💎 VIP</span>
   : s.subscription === 'paid' ? <span className="pill pill-g">💳 مدفوع</span>
   : <span className="pill pill-y">🆓 مجاني</span>}
</td>
<td>
  {s.active!==false
    ? <span className="pill pill-g">نشط</span>
    : <span className="pill pill-r">موقوف</span>
  }
</td>
                <td>
                  <div className="flex g6">
                    <button className="btn btn-s btn-sm" onClick={()=>open(s)}>
                      <Icon name="edit" size={13}/>
                    </button>
                    <button
                      className={`btn btn-sm ${s.active!==false?'btn-dn':'btn-ok'}`}
                      onClick={()=>toggle(s)}
                    >
                      {s.active!==false?'إيقاف':'تفعيل'}
                    </button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {list.length === 0 && (
          <div className="empty" style={{padding:'40px 20px',textAlign:'center'}}>
            <div className="empty-ico">🔍</div>
            <div className="h4 txt2 mb8">لا يوجد طلاب مطابقين للبحث</div>
          </div>
        )}
      </div>
    </div>

    {editing && (
      <Modal title={`تعديل: ${form.name}`} onClose={()=>setEditing(null)} wide>
        <div className="grid g2">
          <Field label="الاسم">
            <input className="input" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})}/>
          </Field>
          <Field label="الهاتف">
            <input className="input" value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})}/>
          </Field>
          <Field label="XP">
            <input type="number" className="input" value={form.xp||0} onChange={e=>setForm({...form,xp:+e.target.value})}/>
          </Field>
          <Field label="الصف">
            <select className="input" value={form.grade_id||''} onChange={e=>setForm({...form,grade_id:e.target.value})}>
              <option value="">— اختر —</option>
              {app.db.grades.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </Field>
          <div className="div"/>

<div className="h4 mb12" style={{color:'var(--gold)'}}>💳 الاشتراك</div>
<div className="grid g2">
  <Field label="نوع الاشتراك">
    <select
      className="input"
      value={form.subscription || 'free'}
      onChange={e=>setForm({...form, subscription:e.target.value})}
    >
      <option value="free">🆓 مجاني</option>
      <option value="paid">💳 مدفوع</option>
      <option value="vip">💎 VIP</option>
    </select>
  </Field>
  <Field label="تاريخ انتهاء الاشتراك">
    <input
      type="date"
      className="input"
      value={form.subscription_until || ''}
      onChange={e=>setForm({...form, subscription_until:e.target.value})}
    />
  </Field>
</div>

        <Field label="صلاحيات الوصول">
          <label className="flex center g8 mb12" style={{cursor:'pointer'}}>
            <input type="checkbox" checked={!!form.all_subjects} onChange={e=>setForm({...form,all_subjects:e.target.checked})}/>
            <span className="sm">جميع المواد</span>
          </label>
          {!form.all_subjects && (
            <div className="flex wrap g6">
              {app.db.subjects.map(s => {
                const on = (form.access_subjects||[]).includes(s.id);
                return (
                  <button
                    key={s.id}
                    type="button"
                    onClick={()=>{
                      const cur = form.access_subjects || [];
                      setForm({...form,access_subjects: on ? cur.filter(x=>x!==s.id) : [...cur,s.id]});
                    }}
                    style={{
                      padding:'8px 14px',
                      borderRadius:30,
                      background: on ? 'rgba(212,175,55,.20)' : 'rgba(212,175,55,.05)',
                      border: `1px solid ${on?'var(--gold)':'var(--border)'}`,
                      fontSize:12.5,
                      fontWeight:700,
                      color: on ? '#FFD700' : 'var(--txt)',
                      cursor:'pointer'
                    }}
                  >
                    {s.icon} {s.name}
                  </button>
                );
              })}
            </div>
          )}
        </Field>

        <div className="flex g8 mt16">
          <button className="btn btn-p" onClick={save} disabled={busy}>
            {busy?'جارٍ...':'💾 حفظ'}
          </button>
          <button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button>
        </div>
      </Modal>
    )}
  </>;
}
