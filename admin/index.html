<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MISSION EDU — لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060e;--border:rgba(90,140,230,.16);--border2:rgba(90,140,230,.32);--blue:#2f7dff;--blue2:#5aa9ff;--txt:#e8eefc;--txt2:#b7c6e4;--muted:#7f93b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--r:20px;--rs:13px;--sh:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo',sans-serif;background:radial-gradient(1200px 620px at 85% -12%,rgba(47,125,255,.20),transparent 62%),radial-gradient(950px 520px at -8% 18%,rgba(139,92,246,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,140,230,.25);border-radius:20px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{list-style:none}
.glass{background:linear-gradient(180deg,rgba(21,31,56,.72),rgba(11,17,34,.62));border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.glass-s{background:rgba(21,31,56,.62);border:1px solid var(--border);border-radius:var(--rs)}
.hv{transition:.28s cubic-bezier(.2,.8,.3,1)}
.hv:hover{transform:translateY(-4px);border-color:var(--border2)}
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(9,14,29,.94),rgba(6,9,20,.9));border-inline-start:1px solid var(--border);z-index:60}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px 26px 100px;max-width:1440px;width:100%;margin:0 auto;animation:fu .5s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-30px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px}
.brand-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);box-shadow:0 8px 26px rgba(47,125,255,.45);font-weight:900}
.brand-name{font-weight:900;font-size:17px}
.brand-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--txt2);font-size:14px;font-weight:600;transition:.22s;width:100%;text-align:right;position:relative}
.nav-i:hover{background:rgba(47,125,255,.09);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(47,125,255,.22),rgba(47,125,255,.03));color:#fff}
.nav-i.on::before{content:'';position:absolute;inset-inline-end:0;top:22%;height:56%;width:3px;border-radius:4px;background:linear-gradient(180deg,#2f7dff,#8b5cf6);box-shadow:0 0 12px var(--blue)}
.nav-ico{font-size:16px;width:22px;text-align:center}
.nav-gt{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1px;padding:14px 14px 4px}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:rgba(6,9,20,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:rgba(18,26,48,.7);border:1px solid var(--border);border-radius:14px;padding:8px 14px}
.search input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;transition:.24s;white-space:nowrap;color:var(--txt)}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#2f7dff,#1f5fd6);color:#fff;box-shadow:0 10px 28px rgba(47,125,255,.36)}
.btn-p:hover{box-shadow:0 14px 38px rgba(47,125,255,.55);transform:translateY(-2px)}
.btn-s{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-dn{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.32)}
.btn-dn:hover{background:rgba(239,68,68,.24)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.h1{font-size:clamp(21px,3.2vw,30px);font-weight:900;letter-spacing:-.7px}
.h2{font-size:clamp(17px,2.3vw,22px);font-weight:800}
.h3{font-size:16px;font-weight:800}
.h4{font-size:14.5px;font-weight:700}
.muted{color:var(--muted)}
.txt2{color:var(--txt2)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.grad{background:linear-gradient(100deg,#5aa9ff,#a78bfa 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:40px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.pill-b{background:rgba(47,125,255,.15);color:#7db6ff;border-color:rgba(47,125,255,.28)}
.pill-g{background:rgba(34,197,94,.14);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.pill-a{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.pill-r{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.pill-v{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.28)}
.pill-y{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
.bar{height:9px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-f{height:100%;border-radius:20px;transition:width .8s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden}
.bar-f::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:400px 100%;animation:shimmer 2.4s infinite linear}
.bar-b{background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(10,16,32,.72);border:1.5px solid var(--border);outline:none;font-size:14px;transition:.22s;color:var(--txt)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,125,255,.12)}
select.input{cursor:pointer;appearance:none;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237f93b8' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center}
textarea.input{resize:vertical;min-height:80px;font-family:inherit}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.stat-n{font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600}
.div{height:1px;background:var(--border);margin:14px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(90,140,230,.08);vertical-align:middle}
.tbl tr:hover td{background:rgba(47,125,255,.045)}
.sx{overflow-x:auto}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(140deg,#2f7dff,#8b5cf6);color:#fff;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border);transition:.2s;font-size:16px;color:var(--txt)}
.icon-btn:hover{background:rgba(47,125,255,.15);border-color:var(--border2)}
.toast-host{position:fixed;bottom:26px;inset-inline-start:26px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(440px,92vw)}
.toast{pointer-events:auto;min-width:280px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(21,31,56,.98),rgba(11,17,34,.98));border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.65);animation:slideIn .4s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.toast.out{animation:fadeOut .3s forwards}
.toast-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:13.5px;margin-bottom:3px}
.toast-msg{font-size:12.5px;color:var(--txt2);line-height:1.55;word-break:break-word}
.toast-bar{position:absolute;bottom:0;inset-inline:0;height:3px;background:rgba(255,255,255,.06)}
.toast-bar-f{height:100%;transition:width linear}
.toast-close{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);flex-shrink:0}
.toast.ok .toast-ico{background:rgba(34,197,94,.18);color:#6ee7a0}
.toast.ok .toast-bar-f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.toast.err .toast-ico{background:rgba(239,68,68,.18);color:#fca5a5}
.toast.err .toast-bar-f{background:linear-gradient(90deg,#dc2626,#f87171)}
.toast.warn .toast-ico{background:rgba(245,158,11,.18);color:#fcd34d}
.toast.warn .toast-bar-f{background:linear-gradient(90deg,#d97706,#fbbf24)}
.toast.info .toast-ico{background:rgba(47,125,255,.18);color:#7db6ff}
.toast.info .toast-bar-f{background:linear-gradient(90deg,#2f7dff,#5aa9ff)}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,.78);backdrop-filter:blur(8px);z-index:900;display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px;animation:pop .32s}
.modal.wide{max-width:820px}
.mbar{display:none}
.hero{padding:24px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(47,125,255,.18),rgba(139,92,246,.12) 50%,rgba(6,182,212,.08));border:1px solid var(--border)}
.vid-preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border);position:relative;margin-top:10px}
.vid-preview iframe,.vid-preview video{width:100%;height:100%;border:0;display:block;object-fit:contain}
.act-row{display:flex;gap:12px;padding:12px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border);align-items:flex-start}
.act-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:rgba(47,125,255,.14);color:#7db6ff}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--muted)}
.spinner{width:48px;height:48px;border:3px solid rgba(90,140,230,.2);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.rank-2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#000}
.rank-3{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.rank-x{background:rgba(255,255,255,.06);color:var(--muted)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-end:0;top:0;transform:translateX(-105%);transition:transform .34s cubic-bezier(.2,.8,.3,1);width:280px;box-shadow:-20px 0 60px rgba(0,0,0,.7)}
  .sidebar.open{transform:translateX(0)!important}
  .mbar{display:flex}
  .content{padding:14px 14px 90px}
  .topbar{padding:10px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../db.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef,createContext,useContext}=React;
const DB=window.MissionDB;

const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg,type='info',title,duration=3800)=>{
    const id=DB.uid('t_');
    const titles={ok:'تم بنجاح',err:'خطأ',warn:'تنبيه',info:'معلومة'};
    setItems(x=>[...x,{id,msg,type,title:title||titles[type]||'',duration}]);
  },[]);
  const remove=useCallback(id=>setItems(x=>x.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{push,ok:(m,t)=>push(m,'ok',t),err:(m,t)=>push(m,'err',t),warn:(m,t)=>push(m,'warn',t),info:(m,t)=>push(m,'info',t)}}>
    {children}
    <div className="toast-host">{items.map(t=><Toast key={t.id} data={t} onClose={()=>remove(t.id)}/>)}</div>
  </ToastCtx.Provider>;
}
function Toast({data,onClose}){
  const [out,setOut]=useState(false);const [progress,setProgress]=useState(100);
  useEffect(()=>{const start=Date.now();const t=setInterval(()=>{const p=Math.max(0,100-((Date.now()-start)/data.duration)*100);setProgress(p);if(p<=0){clearInterval(t);setOut(true);setTimeout(onClose,280);}},40);return()=>clearInterval(t);},[]);
  const icons={ok:'✓',err:'✕',warn:'!',info:'i'};
  return <div className={`toast ${data.type} ${out?'out':''}`}>
    <div className="toast-ico">{icons[data.type]}</div>
    <div className="toast-body">{data.title&&<div className="toast-title">{data.title}</div>}<div className="toast-msg">{data.msg}</div></div>
    <button className="toast-close" onClick={()=>{setOut(true);setTimeout(onClose,280);}}>✕</button>
    <div className="toast-bar"><div className="toast-bar-f" style={{width:`${progress}%`,transitionDuration:'40ms'}}/></div>
  </div>;
}
const useToast=()=>useContext(ToastCtx);

const AppCtx=createContext(null);
const useApp=()=>useContext(AppCtx);

function AppProvider({children}){
  const [db,setDb]=useState({users:[],grades:[],subjects:[],units:[],lessons:[],questions:[],exams:[],missions:[],achievements:[],levels:[],notifications:[],activity:[]});
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const toast=useToast();

  const reload=useCallback(async ()=>{
    try{
      const data=await DB.loadAll();
      setDb(data);
    }catch(e){console.warn(e);}
  },[]);

  useEffect(()=>{
    (async ()=>{
      try{
        const sid=DB.getSessionId();
        if(!sid){window.location.replace('../auth/login.html');return;}
        const u=await DB.getUser(sid);
        if(!u||u.active===false){DB.clearSession();window.location.replace('../auth/login.html');return;}
        if(u.role!=='admin'){window.location.replace('../student/index.html');return;}
        setCurrentUser(u);
        await reload();
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  const logout=useCallback(()=>{
    DB.clearSession();
    window.location.replace('../auth/login.html');
  },[]);

  const save=useCallback(async (table,item)=>{
    const saved=await DB.save(table,item);
    await reload();
    return saved;
  },[]);

  const remove=useCallback(async (table,id)=>{
    await DB.remove(table,id);
    await reload();
  },[]);

  const getLevel=useCallback((xp)=>{
    const ls=[...db.levels].sort((a,b)=>a.xp-b.xp);
    if(ls.length===0) return {current:{level:1,name:'مبتدئ',xp:0},next:null};
    let cur=ls[0],next=null;
    for(let i=0;i<ls.length;i++){if(xp>=ls[i].xp){cur=ls[i];next=ls[i+1]||null;}}
    return {current:cur,next};
  },[db.levels]);

  return <AppCtx.Provider value={{
    db,currentUser,loading,logout,reload,save,remove,getLevel,toast,
    subject:id=>db.subjects.find(s=>s.id===id),
    unit:id=>db.units.find(u=>u.id===id),
    lesson:id=>db.lessons.find(l=>l.id===id),
    exam:id=>db.exams.find(e=>e.id===id),
    question:id=>db.questions.find(q=>q.id===id),
    grade:id=>db.grades.find(g=>g.id===id)
  }}>{children}</AppCtx.Provider>;
}

function Modal({title,children,onClose,wide}){
  return <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose?.()}>
    <div className={`glass modal ${wide?'wide':''}`}>
      <div className="flex between center mb16"><div className="h3">{title}</div><button className="icon-btn" onClick={onClose}>✕</button></div>
      {children}
    </div>
  </div>;
}
function Stat({label,value,icon,color='var(--blue)',sub}){
  return <div className="glass-s hv" style={{padding:16}}>
    <div className="flex between center mb8"><div className="stat-l">{label}</div><div style={{fontSize:20,opacity:.7}}>{icon}</div></div>
    <div className="stat-n" style={{color}}>{value}</div>
    {sub&&<div className="xs muted mt8">{sub}</div>}
  </div>;
}
function Field({label,children,hint}){
  return <div className="mb12"><label className="lbl">{label}</label>{children}{hint&&<div className="xs muted mt8" style={{opacity:.8}}>{hint}</div>}</div>;
}
function Empty({icon='📭',title,desc}){
  return <div className="empty"><div className="empty-ico">{icon}</div><div className="h4 txt2 mb8">{title}</div>{desc&&<div className="sm">{desc}</div>}</div>;
}

function VideoEditor({value,onChange}){
  const v=value||{type:'youtube',url:'',poster:'',allowDownload:false,allowExternal:true};
  const set=(k,val)=>onChange({...v,[k]:val});
  const types=[
    {id:'youtube',label:'YouTube',icon:'📺',hint:'رابط YouTube عادي أو youtu.be'},
    {id:'vimeo',label:'Vimeo',icon:'🎬',hint:'رابط Vimeo'},
    {id:'mp4',label:'ملف MP4',icon:'🎥',hint:'رابط فيديو مباشر .mp4'},
    {id:'external',label:'رابط خارجي',icon:'🔗',hint:'رابط embed iframe'}
  ];
  const placeholder={youtube:'https://www.youtube.com/watch?v=xxxxx',vimeo:'https://vimeo.com/123456789',mp4:'https://example.com/video.mp4',external:'https://example.com/embed/xxxx'}[v.type];
  return <div className="glass-s" style={{padding:14,borderColor:'var(--border2)'}}>
    <div className="h4 mb12">🎬 إعدادات الفيديو</div>
    <Field label="نوع الفيديو">
      <div className="flex wrap g6">

    setOpen(true);
    const t=setTimeout(()=>onSearch?.(q),150);

  },[q]);
  return <div className="topbar">
    <button className="icon-btn mbar" onClick={onMenu}>☰</button>
    <div style={{position:'relative',flex:1,maxWidth:520}}>

function Crud({title,collection,defaultItem,fields,columns}){
  const app=useApp();
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [busy,setBusy]=useState(false);
  const openNew=()=>{setForm(defaultItem());setEditing('new');};
  const openEdit=it=>{setForm(JSON.parse(JSON.stringify(it)));setEditing(it.id);};
  const save=async ()=>{
    setBusy(true);
    try{
      await app.save(collection,form);
      app.toast.ok(editing==='new'?'تمت الإضافة':'تم الحفظ');
      setEditing(null);
    }catch(e){app.toast.err(e.message);}
    setBusy(false);
  };
  const del=async id=>{
    if(!confirm('تأكيد الحذف؟')) return;
    try{await app.remove(collection,id);app.toast.warn('تم الحذف');}
    catch(e){app.toast.err(e.message);}
  };
  const items=app.db[collection]||[];
  return <>
    <div className="flex between center mb16"><div className="h2">{title}</div><button className="btn btn-p" onClick={openNew}>+ إضافة</button></div>
    <div className="glass" style={{padding:14}}>
      {items.length===0?<Empty title="لا توجد بيانات"/>:
        <div className="sx"><table className="tbl">
          <thead><tr>{columns.map((c,i)=><th key={i}>{c.label}</th>)}<th>إجراءات</th></tr></thead>
          <tbody>{items.map(it=><tr key={it.id}>
            {columns.map((c,i)=><td key={i}>{c.render?c.render(it,app):it[c.key]}</td>)}
            <td><div className="flex g6"><button className="btn btn-s btn-sm" onClick={()=>openEdit(it)}>✏️</button><button className="btn btn-dn btn-sm" onClick={()=>del(it.id)}>🗑</button></div></td>
          </tr>)}</tbody>
        </table></div>
      }
    </div>
    {editing!==null&&<Modal title={editing==='new'?'إضافة':'تعديل'} onClose={()=>setEditing(null)} wide>
      <div className="grid g2">
        {fields.map(f=><div key={f.key} style={{gridColumn:f.full?'span 2':'span 1'}}>
          <Field label={f.label} hint={f.hint}>
            {f.type==='textarea'?<textarea className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>:
             f.type==='number'?<input type="number" className="input" value={form[f.key]??''} onChange={e=>setForm({...form,[f.key]:+e.target.value})}/>:
             f.type==='select'?<select className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}>
               <option value="">— اختر —</option>
               {(typeof f.options==='function'?f.options(app):f.options).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
             </select>:
             f.type==='list'?<textarea className="input" placeholder="سطر لكل عنصر" value={(form[f.key]||[]).join('\n')} onChange={e=>setForm({...form,[f.key]:e.target.value.split('\n').filter(Boolean)})}/>:
             f.type==='bool'?<label className="flex center g8" style={{cursor:'pointer'}}><input type="checkbox" checked={!!form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.checked})}/><span className="sm">{form[f.key]?'مفعّل':'معطّل'}</span></label>:
             <input className="input" value={form[f.key]||''} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>}
          </Field>
        </div>)}
      </div>
      <div className="flex g8 mt16"><button className="btn btn-p" onClick={save} disabled={busy}>{busy?'جارٍ...':'💾 حفظ'}</button><button className="btn btn-s" onClick={()=>setEditing(null)}>إلغاء</button></div>
    </Modal>}
  </>;
}

        </div>)}
      </div>
    </div>
  </>;
}

function SettingsPage(){
  const app=useApp();
  return <>
    <div className="h2 mb16">⚙️ الإعدادات</div>
    <div className="glass" style={{padding:20,maxWidth:640}}>
      <div className="h4 mb12">🔌 معلومات الاتصال</div>
      <div className="glass-s mb12" style={{padding:12}}>
        <div className="xs muted">Supabase URL</div>
        <div className="xs" style={{wordBreak:'break-all'}}>https://szuvpbdwixezecxnykjn.supabase.co</div>
      </div>
      <div className="grid g3 mb16">
        <Stat label="المستخدمون" value={app.db.users.length} icon="👥"/>
        <Stat label="سجل النشاط" value={app.db.activity.length} icon="📡"/>
        <Stat label="الإشعارات" value={app.db.notifications.length} icon="🔔"/>
      </div>
    </div>
  </>;
}

function AdminApp(){
  const app=useApp();
  const [tab,setTab]=useState('dashboard');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchResults,setSearchResults]=useState([]);
  const user=app.currentUser;
  const items=[
    {title:'الرئيسية',items:[{id:'dashboard',icon:'📊',label:'لوحة التحكم'},{id:'activity',icon:'📡',label:'سجل النشاط'}]},
    {title:'المحتوى',items:[
      {id:'grades',icon:'🏫',label:'الصفوف'},{id:'subjects',icon:'📚',label:'المواد'},{id:'units',icon:'🗂',label:'الوحدات'},
      {id:'lessons',icon:'📖',label:'الدروس'},{id:'questions',icon:'❓',label:'بنك الأسئلة'},{id:'exams',icon:'📝',label:'الاختبارات'},{id:'missions',icon:'🎯',label:'المهام'}
    ]},
    {title:'التحفيز',items:[{id:'achievements',icon:'🏆',label:'الإنجازات'},{id:'levels',icon:'📈',label:'المستويات'}]},
    {title:'المستخدمون',items:[{id:'students',icon:'🧑‍🎓',label:'الطلاب'},{id:'notifications',icon:'🔔',label:'الإشعارات'},{id:'settings',icon:'⚙️',label:'الإعدادات'}]}
  ];
  const onSearch=q=>{
    const lc=q.toLowerCase(),res=[];
    app.db.users.filter(x=>x.name.toLowerCase().includes(lc)||x.email.toLowerCase().includes(lc)).slice(0,5).forEach(s=>res.push({type:'مستخدم',icon:'👤',title:s.name,nav:'students'}));
    app.db.subjects.filter(s=>s.name.toLowerCase().includes(lc)).forEach(s=>res.push({type:'مادة',icon:s.icon||'📚',title:s.name,nav:'subjects'}));
    app.db.lessons.filter(l=>l.title.toLowerCase().includes(lc)).slice(0,5).forEach(l=>res.push({type:'درس',icon:'📖',title:l.title,nav:'lessons'}));
    app.db.exams.filter(e=>e.title.toLowerCase().includes(lc)).slice(0,5).forEach(e=>res.push({type:'اختبار',icon:'📝',title:e.title,nav:'exams'}));
    setSearchResults(res);
  };
  return <div className="app">
    <Sidebar items={items} active={tab} onNav={setTab} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main">
      <Topbar user={user} onMenu={()=>setSidebarOpen(true)} onLogout={app.logout} onSearch={onSearch} searchResults={searchResults} onResultClick={r=>setTab(r.nav)}/>
      <div className="content">
        {tab==='dashboard'&&<Dashboard/>}
        {tab==='activity'&&<ActivityLog/>}
        {tab==='grades'&&<GradesPage/>}
        {tab==='subjects'&&<SubjectsPage/>}
        {tab==='units'&&<UnitsPage/>}
        {tab==='lessons'&&<LessonsPage/>}
        {tab==='questions'&&<QuestionsPage/>}
        {tab==='exams'&&<ExamsPage/>}
        {tab==='missions'&&<MissionsPage/>}
        {tab==='achievements'&&<AchievementsPage/>}
        {tab==='levels'&&<LevelsPage/>}
        {tab==='students'&&<StudentsPage/>}
        {tab==='notifications'&&<NotificationsPage/>}
        {tab==='settings'&&<SettingsPage/>}
      </div>
    </div>
  </div>;
}

function Root(){
  const app=useApp();
  if(app.loading) return <div className="loading"><div className="spinner"></div>جارٍ التحميل...</div>;
  if(!app.currentUser) return null;
  if(app.currentUser.role!=='admin') return null;
  return <AdminApp/>;
}

function App(){return <ToastProvider><AppProvider><Root/></AppProvider></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
