<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<title>الصفحة غير موجودة | MISSION EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root {
    --bg: #04060e;
    --blue: #2f7dff;
    --violet: #8b5cf6;
    --txt: #e8eefc;
    --txt2: #b7c6e4;
    --muted: #7f93b8;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: 'Tajawal', 'Cairo', sans-serif;
    background: 
      radial-gradient(1200px 620px at 85% -12%, rgba(47, 125, 255, 0.20), transparent 62%),
      radial-gradient(950px 520px at -8% 18%, rgba(139, 92, 246, 0.14), transparent 60%),
      radial-gradient(800px 500px at 50% 115%, rgba(6, 182, 212, 0.09), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--txt);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    line-height: 1.7;
  }

  .container {
    position: relative;
    width: 100%;
    max-width: 800px;
    padding: 20px;
    text-align: center;
    z-index: 10;
    animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* خلفية متحركة */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(90, 140, 230, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(90, 140, 230, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(50px); }
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  .orb-1 { width: 300px; height: 300px; background: rgba(47, 125, 255, 0.4); top: -100px; right: -100px; animation: float 10s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.3); bottom: -150px; left: -150px; animation: float 12s ease-in-out infinite reverse; }
  
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.1); }
  }

  /* الرسمة الـ SVG */
  .svg-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 30px;
    position: relative;
  }

  .svg-container svg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
  }

  .floating { animation: floating 4s ease-in-out infinite; }
  @keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.95); }
  }

  .spin { animation: spin 8s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* النصوص */
  .code-txt {
    font-size: clamp(80px, 15vw, 140px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -5px;
    background: linear-gradient(100deg, #5aa9ff, #a78bfa 55%, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    position: relative;
    display: inline-block;
  }

  .code-txt::after {
    content: '404';
    position: absolute;
    inset: 0;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(90, 169, 255, 0.2);
    transform: translate(4px, 4px);
    z-index: -1;
  }

  .title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 800;
    margin-bottom: 16px;
    color: var(--txt);
  }

  .desc {
    font-size: clamp(14px, 2vw, 16px);
    color: var(--txt2);
    max-width: 500px;
    margin: 0 auto 32px;
    line-height: 1.8;
  }

  /* الأزرار */
  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 16px;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
    cursor: pointer;
    border: none;
    font-family: inherit;
  }

  .btn svg { width: 18px; height: 18px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--violet));
    color: #fff;
    box-shadow: 0 10px 30px rgba(47, 125, 255, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 40px rgba(47, 125, 255, 0.6);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: var(--txt);
    border: 1px solid rgba(90, 140, 230, 0.3);
    backdrop-filter: blur(10px);
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(90, 140, 230, 0.6);
    transform: translateY(-3px);
  }

  /* جزيئات (Particles) */
  .particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(90, 169, 255, 0.6);
    box-shadow: 0 0 10px rgba(90, 169, 255, 0.8);
    pointer-events: none;
    z-index: 1;
  }

</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  
  <div class="svg-container">
    <svg viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5aa9ff" />
          <stop offset="50%" stop-color="#8b5cf6" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(47,125,255,0.8)" />
          <stop offset="100%" stop-color="rgba(139,92,246,0.8)" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- الدائرة الخارجية -->
      <g class="spin" style="transform-origin: 250px 200px;">
        <circle cx="250" cy="200" r="150" stroke="url(#g1)" stroke-width="2" stroke-dasharray="10 20" opacity="0.4" />
        <circle cx="250" cy="200" r="120" stroke="url(#g1)" stroke-width="1" stroke-dasharray="5 15" opacity="0.6" />
      </g>

      <!-- الكوكب/الخلفية -->
      <g class="floating">
        <!-- القاعدة -->
        <path d="M250 350 L150 250 A 140 140 0 0 1 350 250 Z" fill="url(#g2)" opacity="0.2" />
        
        <!-- الحلقات (Orbit) -->
        <ellipse cx="250" cy="200" rx="180" ry="50" stroke="url(#g1)" stroke-width="3" transform="rotate(-20 250 200)" opacity="0.5" filter="url(#glow)" />
        
        <!-- الكوكب -->
        <circle cx="250" cy="200" r="80" fill="#0b1122" stroke="url(#g1)" stroke-width="4" />
        
        <!-- تفاصيل الكوكب -->
        <path d="M190 220 Q 250 260 310 220" stroke="url(#g1)" stroke-width="3" fill="none" opacity="0.6" />
        <path d="M180 180 Q 250 210 320 180" stroke="url(#g1)" stroke-width="3" fill="none" opacity="0.6" />
        <circle cx="220" cy="170" r="10" fill="url(#g1)" opacity="0.8" />
        <circle cx="280" cy="230" r="15" fill="url(#g1)" opacity="0.8" />
        
        <!-- قمر صغير -->
        <g class="spin" style="transform-origin: 250px 200px;">
          <circle cx="250" cy="20" r="15" fill="url(#g1)" filter="url(#glow)" />
        </g>
      </g>

      <!-- نجوم -->
      <g opacity="0.8">
        <circle cx="100" cy="100" r="2" fill="#fff" class="pulse" />
        <circle cx="400" cy="150" r="3" fill="#fff" class="pulse" style="animation-delay: 0.5s" />
        <circle cx="80" cy="300" r="2" fill="#fff" class="pulse" style="animation-delay: 1s" />
        <circle cx="420" cy="320" r="2" fill="#fff" class="pulse" style="animation-delay: 1.5s" />
        <circle cx="150" cy="50" r="1.5" fill="#fff" class="pulse" style="animation-delay: 0.8s" />
        <circle cx="350" cy="80" r="2" fill="#fff" class="pulse" style="animation-delay: 1.2s" />
      </g>
      
      <!-- خطوط السرعة -->
      <g stroke="url(#g1)" stroke-width="2" opacity="0.4" stroke-linecap="round">
        <line x1="50" y1="200" x2="100" y2="200" class="pulse" />
        <line x1="400" y1="250" x2="450" y2="250" class="pulse" style="animation-delay: 0.3s" />
        <line x1="70" y1="150" x2="120" y2="150" class="pulse" style="animation-delay: 0.6s" />
      </g>
    </svg>
  </div>

  <div class="code-txt">404</div>
  <div class="title">عذراً، هذه الصفحة ضاعت في الفضاء!</div>
  <div class="desc">
    يبدو أنك دخلت إلى رابط غير موجود أو تم حذفه. لا تقلق، يمكنك العودة إلى المنصة ومتابعة رحلتك التعليمية من حيث توقفت.
  </div>

  <div class="actions">
    <a href="/student/index.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      العودة للرئيسية
    </a>
    <a href="/auth/login.html" class="btn btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      تسجيل الدخول
    </a>
  </div>
</div>

<script>
  // إضافة جزيئات متحركة للخلفية عشان المنظر يبقى احترافي أكتر
  const body = document.body;
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const duration = Math.random() * 10 + 10;
    const delay = Math.random() * 5;
    
    particle.style.left = `${x}vw`;
    particle.style.top = `${y}vh`;
    particle.style.animation = `particleFloat ${duration}s ease-in-out ${delay}s infinite alternate`;
    
    body.appendChild(particle);
  }

  // إضافة أنيميشن الجزيئات بالـ CSS ديناميكياً
  const style = document.createElement('style');
  style.textContent = `
    @keyframes particleFloat {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { opacity: 1; box-shadow: 0 0 15px rgba(90, 169, 255, 1); }
      100% { transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); opacity: 0.2; }
    }
  `;
  document.head.appendChild(style);
</script>

</body>
</html>
